n\">\n<td>kahve</td>\n<td>кафе</td>\n</tr>\n</tbody>\n</table>\n<h3\nid=\"граматика-5.1-сегашно-продължително-време-şimdiki-zaman--ıyor-şimdiki-zaman\">Граматика\n5.1 — Сегашно продължително време (şimdiki zaman): -(ı)yor · Şimdiki\nzaman</h3>\n<p>Означава действие, което се случва сега или в момента изобщо.</p>\n<p><strong>Образуване:</strong> корен на глагола (без\n<code>-mak/-mek</code>) + <code>-ıyor / -iyor / -uyor / -üyor</code> +\nлично окончание.</p>\n<table>\n<thead>\n<tr class=\"header\">\n<th>Лице</th>\n<th>Окончание</th>\n<th>Пример: <code>gelmek</code></th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>ben</td>\n<td>-um</td>\n<td>gel<strong>iyorum</strong></td>\n</tr>\n<tr class=\"even\">\n<td>sen</td>\n<td>-sun</td>\n<td>gel<strong>iyorsun</strong></td>\n</tr>\n<tr class=\"odd\">\n<td>o</td>\n<td>—</td>\n<td>gel<strong>iyor</strong></td>\n</tr>\n<tr class=\"even\">\n<td>biz</td>\n<td>-uz</td>\n<td>gel<strong>iyoruz</strong></td>\n</tr>\n<tr class=\"odd\">\n<td>siz</td>\n<td>-sunuz</td>\n<td>gel<strong>iyorsunuz</strong></td>\n</tr>\n<tr class=\"even\">\n<td>onlar</td>\n<td>-lar</td>\n<td>gel<strong>iyorlar</strong></td>\n</tr>\n</tbody>\n</table>\n<p><strong>Внимание:</strong> личните окончания след <code>-yor</code>\nвинаги са с <strong>-u-</strong>, защото <code>yor</code> съдържа\n<code>o</code>.</p>\n<p><strong>Ако коренът свършва на гласна, тя отпада:</strong> -\n<code>beklemek</code> → bekl<strong>iyorum</strong> (не beklemiyorum!) -\n<code>okumak</code> → ok<strong>uyorum</strong> - <code>yemek</code> →\ny<strong>iyorum</strong> (неправилно) - <code>demek</code> →\nd<strong>iyorum</strong> (неправилно)</p>\n<p><strong>Отрицание:</strong> корен + <code>-mı/-mi/-mu/-mü</code> +\n<code>yor</code> - gelmiyorum — не идвам - çalışmıyorsun — не работиш -\nokumuyor — не чете - görmüyoruz — не виждаме</p>\n<p><strong>Въпрос:</strong> <code>mu</code> (винаги <code>mu</code>,\nзащото пред него е <code>o</code>) - Geliyor musun? — Идваш ли? -\nÇalışıyor mu? — Работи ли? - Gelmiyor musunuz? — Не идвате ли?</p>\n<h3 id=\"граматика-5.2-редът-на-думите-kelime-sırası\">Граматика 5.2 —\nРедът на думите · Kelime sırası</h3>\n<p>Турското изречение е: <strong>подлог + допълнение + глагол</strong>.\nГлаголът е винаги накрая.</p>\n<ul>\n<li>Ben <strong>okulda Türkçe öğreniyorum.</strong> — Аз уча турски в\nучилище.</li>\n<li>Ayşe <strong>her gün kahve içiyor.</strong> — Айше пие кафе всеки\nден.</li>\n</ul>\n<h3 id=\"граматика-5.3-полезни-наречия-за-време-zaman-zarfları\">Граматика\n5.3 — Полезни наречия за време · Zaman zarfları</h3>\n<p><code>şimdi</code> (сега), <code>her gün</code> (всеки ден),\n<code>bugün</code> (днес), <code>şu anda</code> (в момента),\n<code>bazen</code> (понякога), <code>her zaman</code> (винаги),\n<code>hiç</code> (никога — с отрицание), <code>sık sık</code>\n(често).</p>\n<h3\nid=\"граматика-5.4-как-се-отнема-окончанието--mak-mek-mastar-eki-ve-fiil-kökü\">Граматика\n5.4 — Как се отнема окончанието <code>-mak/-mek</code> · Mastar eki ve\nfiil kökü</h3>\n<p>Всеки турски глагол в речника завършва на <code>-mak</code> или\n<code>-mek</code>. Това е инфинитивът. За да го спрегнеш, махаш това\nокончание и остава <strong>коренът</strong>:</p>\n<table>\n<thead>\n<tr class=\"header\">\n<th>Инфинитив</th>\n<th>Корен</th>\n<th>Значение</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>gel<strong>mek</strong></td>\n<td>gel-</td>\n<td>идвам</td>\n</tr>\n<tr class=\"even\">\n<td>yaz<strong>mak</strong></td>\n<td>yaz-</td>\n<td>пиша</td>\n</tr>\n<tr class=\"odd\">\n<td>oku<strong>mak</strong></td>\n<td>oku-</td>\n<td>чета</td>\n</tr>\n<tr class=\"even\">\n<td>görüş<strong>mek</strong></td>\n<td>görüş-</td>\n<td>виждам се</td>\n</tr>\n<tr class=\"odd\">\n<td>başla<strong>mak</strong></td>\n<td>başla-</td>\n<td>започвам</td>\n</tr>\n</tbody>\n</table>\n<p><strong>Кое окончание — -mak или -mek?</strong> Ако последната гласна\nна корена е дебела (a, ı, o, u) → <strong>-mak</strong>. Ако е тънка (e,\ni, ö, ü) → <strong>-mek</strong>.</p>\n<h3\nid=\"граматика-5.5-крайната-гласна-пред--yor--yor-önünde-ünlü-düşmesi\">Граматика\n5.5 — Крайната гласна пред <code>-yor</code> · „-yor“ önünde ünlü\ndüşmesi</h3>\n<p>Ако коренът завършва на гласна, тя <strong>отпада</strong> пред\n<code>-yor</code>:</p>\n<div class=\"line-block\">bekle- | bekl<strong>iyor</strong>um | не\nbeklemiyorum (това значи „не чакам“!) |<br />\noku- | ok<strong>uyor</strong>um | |<br />\nbaşla- | başl<strong>ıyor</strong>um | |<br />\nsöyle- | söyl<strong>üyor</strong>um | |<br />\nanla- | anl<strong>ıyor</strong>um | |<br />\nyürü- | yür<strong>üyor</strong>um | |</div>\n<p><strong>Два глагола със стеснена гласна — <code>yemek</code> и\n<code>demek</code>:</strong></p>\n<p>Корените са <code>ye-</code> и <code>de-</code>. Пред\n<code>-yor</code> гласната <code>e</code> не отпада, а се\n<strong>стеснява</strong> до <code>i</code>:</p>\n<div class=\"line-block\">yemek (ям) | y<strong>iyor</strong>um,\ny<strong>iyor</strong>sun, y<strong>iyor</strong>,\ny<strong>iyor</strong>uz |<br />\ndemek (казвам) | d<strong>iyor</strong>um, d<strong>iyor</strong>sun,\nd<strong>iyor</strong>, d<strong>iyor</strong>uz |</div>\n<p><strong>Само пред <code>-yor</code> и <code>-ecek</code>.</strong> В\nдругите времена коренът остава непроменен: <code>yedim</code> (ядох),\n<code>yerim</code> (ям обикновено), <code>dedim</code> (казах),\n<code>derim</code> (казвам обикновено). Пред бъдеще време пак се\nстеснява: <code>yiyeceğim</code>, <code>diyeceğim</code>.</p>\n<p>В отрицателната форма <code>e</code> се запазва:\n<code>yemiyorum</code> (не ям), <code>demiyorum</code> (не казвам).\nВнимавай — <code>yemiyorum</code> прилича на положителна форма, но е\nотрицание.</p>\n<h3\nid=\"граматика-5.6-пълна-таблица-на--yor-şimdiki-zaman-tam-tablo\">Граматика\n5.6 — Пълна таблица на <code>-yor</code> · Şimdiki zaman tam tablo</h3>\n<p><strong>gelmek (идвам) — утвърдително, отрицателно,\nвъпрос:</strong></p>\n<table>\n<thead>\n<tr class=\"header\">\n<th>Лице</th>\n<th>+</th>\n<th>−</th>\n<th>?</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>ben</td>\n<td>geliyorum</td>\n<td>gelmiyorum</td>\n<td>geliyor muyum?</td>\n</tr>\n<tr class=\"even\">\n<td>sen</td>\n<td>geliyorsun</td>\n<td>gelmiyorsun</td>\n<td>geliyor musun?</td>\n</tr>\n<tr class=\"odd\">\n<td>o</td>\n<td>geliyor</td>\n<td>gelmiyor</td>\n<td>geliyor mu?</td>\n</tr>\n<tr class=\"even\">\n<td>biz</td>\n<td>geliyoruz</td>\n<td>gelmiyoruz</td>\n<td>geliyor muyuz?</td>\n</tr>\n<tr class=\"odd\">\n<td>siz</td>\n<td>geliyorsunuz</td>\n<td>gelmiyorsunuz</td>\n<td>geliyor musunuz?</td>\n</tr>\n<tr class=\"even\">\n<td>onlar</td>\n<td>geliyorlar</td>\n<td>gelmiyorlar</td>\n<td>geliyorlar mı?</td>\n</tr>\n</tbody>\n</table>\n<p><strong>Отрицателен въпрос:</strong> <code>Gelmiyor musun?</code> —\nНе идваш ли?</p>\n<h3\nid=\"граматика-5.7-какво-още-означава--yor-şimdiki-zamanın-kullanımları\">Граматика\n5.7 — Какво още означава <code>-yor</code> · Şimdiki zamanın\nkullanımları</h3>\n<p>Сегашното продължително време на турски покрива повече, отколкото в\nбългарския:</p>\n<ol type=\"1\">\n<li><strong>Сега, в момента:</strong> Şu anda kitap okuyorum. — Точно\nсега чета книга.</li>\n<li><strong>В този период:</strong> Bu yıl Türkçe öğreniyorum. — Тази\nгодина уча турски.</li>\n<li><strong>Близко бъдеще:</strong> Yarın geliyorum. — Утре идвам.</li>\n<li><strong>Постоянно състояние:</strong> Sofya’da oturuyorum. — Живея в\nСофия.</li>\n<li><strong>Ядосано/емоционално:</strong> Sürekli geç kalıyorsun! —\nПостоянно закъсняваш!</li>\n</ol>\n<h3\nid=\"граматика-5.8-наречия-за-честота-и-мястото-им-sıklık-zarfları\">Граматика\n5.8 — Наречия за честота и мястото им · Sıklık zarfları</h3>\n<p>Наречието стои преди глагола, но след подлога:</p>\n<ul>\n<li>Ben <strong>her gün</strong> kahve içiyorum.</li>\n<li>O <strong>şimdi</strong> çalışıyor.</li>\n<li>Biz <strong>bazen</strong> sinemaya gidiyoruz.</li>\n</ul>\n<div class=\"line-block\">şimdi / şu anda | сега / в момента |<br />\nbugün | днес |<br />\nher gün | всеки ден |<br />\nher zaman | винаги |<br />\nsık sık | често |<br />\nbazen | понякога |<br />\nnadiren | рядко |<br />\nhiç | никога (с отрицание) |<br />\nartık | вече, отсега нататък |<br />\nhâlâ | все още |</div>\n<h3 id=\"защо-е-така-neden-böyle-4\">Защо е така · Neden böyle</h3>\n<p><strong>Защо <code>-yor</code> не спазва гласната хармония?</strong>\nЗащото не е старо турско окончание — произлиза от глагола\n<code>yorımak</code> („вървя“), който е бил самостоятелна дума. Затова е\n„замръзнал“ във вида <code>yor</code> и не се мени. Затова и личните\nокончания след него са винаги с <code>u</code>: <code>geliyorum</code>,\nа не <code>geliyorım</code>.</p>\n<p><strong>Защо крайната гласна отпада: <code>bekle-</code> →\n<code>bekliyorum</code>?</strong> Две гласни една до друга са неудобни\nза изговор (<code>bekleiyorum</code>). Турският решава това по два\nначина: или маха едната гласна (при <code>-yor</code>), или вмъква\nсъгласната <code>y</code> (при повечето други окончания:\n<code>bekle-y-eceğim</code>).</p>\n<p><strong>Защо <code>gelmiyorum</code> (не идвам), а не\n<code>gelmeyorum</code>?</strong> Отрицанието е <code>-me</code>, а\nкрайната му гласна отпада пред <code>-yor</code>, както при всеки корен.\nОстава <code>-m</code>, но тогава думата би станала неизговорима, затова\nсе вмъква тясна гласна по хармония: <code>gel-m-i-yor-um</code>.</p>\n<h3 id=\"текст-за-четене-и-превод-okuma-ve-çeviri-metni-3\">Текст за\nчетене и превод · Okuma ve çeviri metni</h3>\n<p><strong>Ne yapıyorsun? — Какво правиш?</strong></p>\n<blockquote>\n<p>— Alo, Mehmet? Ne yapıyorsun?</p>\n<p>— Merhaba Deniz. Şu anda evdeyim, kitap okuyorum. Sen ne\nyapıyorsun?</p>\n<p>— Ben kafedeyim, arkadaşlarımla kahve içiyoruz. Sen de geliyor\nmusun?</p>\n<p>— Bugün gelmiyorum, çok çalışıyorum. Yarın sınavım var.</p>\n<p>— Ne sınavı?</p>\n<p>— Türkçe sınavı. Şimdi yeni kelimeler öğreniyorum ama çok zor.</p>\n<p>— Zor değil, sen çok iyi Türkçe konuşuyorsun!</p>\n<p>— Teşekkür ederim. Yarın akşam görüşüyor muyuz?</p>\n<p>— Tabii, yarın akşam sinemaya gidiyoruz.</p>\n</blockquote>\n<p><em>Нови думи:</em> <code>alo</code> — ало; <code>kafe</code> —\nкафене; <code>arkadaşlarımla</code> — с приятелите ми;\n<code>sınav</code> — изпит; <code>kelime</code> — дума; <code>zor</code>\n— труден; <code>tabii</code> — разбира се.</p>\n<p><strong>Въпроси:</strong></p>\n<ol type=\"1\">\n<li>Mehmet şimdi ne yapıyor?</li>\n<li>Deniz nerede?</li>\n<li>Mehmet neden gelmiyor?</li>\n<li>Yarın akşam ne yapıyorlar?</li>\n</ol>\n<h3 id=\"упражнения-alıştırmalar-4\">Упражнения · Alıştırmalar</h3>\n<p><strong>Упр. 5.1 — Спрегни в сегашно време (ben).</strong>\n<em>(Şimdiki zamanda çekimleyin (ben).)</em></p>\n<ol type=\"1\">\n<li>gelmek</li>\n<li>okumak</li>\n<li>çalışmak</li>\n<li>beklemek</li>\n<li>görmek</li>\n<li>uyumak</li>\n</ol>\n<p><strong>Упр. 5.2 — Постави глагола в правилната форма.</strong>\n<em>(Fiili doğru biçimde yazın.)</em></p>\n<ol type=\"1\">\n<li>Sen ne (yapmak) ___ ?</li>\n<li>O müzik (dinlemek) ___ .</li>\n<li>Biz Türkçe (öğrenmek) ___ .</li>\n<li>Onlar okula (gitmek) ___ .</li>\n<li>Siz çay (içmek) ___ .</li>\n</ol>\n<p><strong>Упр. 5.3 — Направи отрицателни.</strong> <em>(Olumsuz\nyapın.)</em></p>\n<ol type=\"1\">\n<li>Geliyorum.</li>\n<li>Çalışıyorsun.</li>\n<li>Okuyor.</li>\n<li>Görüyoruz.</li>\n<li>Bekliyorsunuz.</li>\n</ol>\n<p><strong>Упр. 5.4 — Направи въпроси.</strong> <em>(Soru cümleleri\nyapın.)</em></p>\n<ol type=\"1\">\n<li>Sen çalışıyorsun.</li>\n<li>O geliyor.</li>\n<li>Siz Türkçe konuşuyorsunuz.</li>\n</ol>\n<p><strong>Упр. 5.5 — Преведи на турски.</strong> <em>(Türkçeye\nçevirin.)</em></p>\n<ol type=\"1\">\n<li>Какво правиш?</li>\n<li>Чета книга.</li>\n<li>Не работя днес.</li>\n<li>Идваш ли утре?</li>\n<li>Учим турски в училище.</li>\n</ol>\n<h3 id=\"допълнителни-упражнения-ek-alıştırmalar-4\">Допълнителни\nупражнения · Ek alıştırmalar</h3>\n<p><strong>Упр. 5.6 — Постави в сегашно време (внимавай с гласната в\nкрая на корена).</strong> <em>(Şimdiki zamana çevirin (kök sonundaki\nünlüye dikkat).)</em></p>\n<ol type=\"1\">\n<li>beklemek (ben)</li>\n<li>okumak (sen)</li>\n<li>yemek (o)</li>\n<li>demek (biz)</li>\n<li>başlamak (siz)</li>\n<li>uyumak (onlar)</li>\n</ol>\n<p><strong>Упр. 5.7 — Отговори отрицателно.</strong> <em>(Olumsuz cevap\nverin.)</em></p>\n<ol type=\"1\">\n<li>Şimdi çalışıyor musun?</li>\n<li>Ali geliyor mu?</li>\n<li>Türkçe konuşuyorlar mı?</li>\n<li>Kahve içiyor musunuz?</li>\n</ol>\n<p><strong>Упр. 5.8 — Подреди думите в изречение.</strong>\n<em>(Kelimeleri sıralayıp cümle kurun.)</em></p>\n<ol type=\"1\">\n<li>okulda / ben / Türkçe / öğreniyorum</li>\n<li>her / o / gün / içiyor / kahve</li>\n<li>gidiyoruz / biz / sinemaya / akşam</li>\n<li>ne / sen / yapıyorsun / şimdi</li>\n</ol>\n<p><strong>Упр. 5.9 — Напиши какво правиш сега (4 изречения).</strong>\n<em>(Şu anda ne yaptığınızı yazın (dört cümle).)</em></p>\n<p><strong>Упр. 5.10 — Намери корена и спрегни за\n<code>ben</code>.</strong> <em>(Fiil kökünü bulun ve „ben“ için\nçekimleyin.)</em></p>\n<ol type=\"1\">\n<li>beklemek</li>\n<li>okumak</li>\n<li>başlamak</li>\n<li>söylemek</li>\n<li>anlamak</li>\n<li>yürümek</li>\n<li>yemek</li>\n<li>demek</li>\n</ol>\n<p><strong>Упр. 5.11 — Попълни цялата таблица за\n<code>çalışmak</code>.</strong> <em>(„çalışmak“ için tabloyu\ntamamlayın.)</em></p>\n<ol type=\"1\">\n<li>ben ___</li>\n<li>sen ___</li>\n<li>o ___</li>\n<li>biz ___</li>\n<li>siz ___</li>\n<li>onlar ___</li>\n</ol>\n<p><strong>Упр. 5.12 — Направи отрицателен въпрос.</strong> <em>(Olumsuz\nsoru yapın.)</em></p>\n<p>Пример: Geliyorsun. → Gelmiyor musun?</p>\n<ol type=\"1\">\n<li>Çalışıyorsun.</li>\n<li>O anlıyor.</li>\n<li>Siz geliyorsunuz.</li>\n<li>Onlar biliyorlar.</li>\n<li>Biz gidiyoruz.</li>\n<li>Sen yiyorsun.</li>\n</ol>\n<p><strong>Упр. 5.13 — Постави наречието на правилното място.</strong>\n<em>(Zarfı doğru yere koyun.)</em></p>\n<ol type=\"1\">\n<li>Ben kahve içiyorum. (her sabah)</li>\n<li>O çalışıyor. (şimdi)</li>\n<li>Biz sinemaya gidiyoruz. (bazen)</li>\n<li>Sen geç kalıyorsun. (sürekli)</li>\n<li>Onlar Türkçe konuşuyorlar. (çok iyi)</li>\n</ol>\n<p><strong>Упр. 5.14 — Кое значение има <code>-yor</code> тук?</strong>\n<em>(Burada -yor hangi anlamda?)</em></p>\n<p>Избери: (а) сега · (б) този период · (в) близко бъдеще · (г)\nпостоянно състояние</p>\n<ol type=\"1\">\n<li>Şu anda ders çalışıyorum.</li>\n<li>Bu yıl üniversiteye gidiyorum.</li>\n<li>Yarın İstanbul’a uçuyorum.</li>\n<li>Sofya’da oturuyorum.</li>\n</ol>\n<p><strong>Упр. 5.15 — Преведи на турски.</strong> <em>(Türkçeye\nçevirin.)</em></p>\n<ol type=\"1\">\n<li>Какво правиш в момента?</li>\n<li>Не разбирам.</li>\n<li>Не работиш ли днес?</li>\n<li>Живея в София.</li>\n<li>Утре идвам.</li>\n<li>Постоянно закъсняваш!</li>\n<li>Учим турски тази година.</li>\n<li>Понякога ходим на кино.</li>\n</ol>\n<h3>Тематичен речник · Konu sözlüğü — Основни глаголи · Temel fiiller</h3><table><thead><tr><th>Türkçe</th><th>Български</th></tr></thead><tbody><tr><td>etmek</td><td>правя (спомагателен)</td></tr><tr><td>uyanmak</td><td>събуждам се</td></tr><tr><td>hoşlanmak</td><td>харесвам (с -dan)</td></tr><tr><td>korkmak</td><td>страхувам се</td></tr><tr><td>cevap vermek</td><td>отговарям</td></tr><tr><td>ağlamak</td><td>плача</td></tr><tr><td>yürümek</td><td>вървя пеша</td></tr><tr><td>koşmak</td><td>тичам</td></tr><tr><td>yüzmek</td><td>плувам</td></tr><tr><td>durmak</td><td>спирам, стоя</td></tr><tr><td>kapatmak</td><td>затварям, изключвам</td></tr><tr><td>satın almak</td><td>купувам</td></tr><tr><td>satmak</td><td>продавам</td></tr><tr><td>kullanmak</td><td>използвам, карам</td></tr><tr><td>aramak</td><td>търся, звъня по телефона</td></tr><tr><td>bulmak</td><td>намирам</td></tr><tr><td>girmek</td><td>влизам</td></tr><tr><td>çıkmak</td><td>излизам</td></tr><tr><td>inmek</td><td>слизам</td></tr><tr><td>binmek</td><td>качвам се (в превозно средство)</td></tr><tr><td>unutmak</td><td>забравям</td></tr><tr><td>hatırlamak</td><td>помня, сещам се</td></tr><tr><td>yardım etmek</td><td>помагам</td></tr><tr><td>dinlenmek</td><td>почивам си</td></tr><tr><td>buluşmak</td><td>срещам се</td></tr><tr><td>beklemek</td><td>чакам</td></tr></tbody></table><p><strong>Упр. 5.16 — Как е на турски?</strong> <em>(Türkçesi nedir?)</em></p><ol type=\"1\"><li>събуждам се</li><li>тичам</li><li>купувам</li><li>продавам</li><li>качвам се в транспорт</li><li>слизам</li><li>забравям</li><li>помагам</li></ol><hr />\n<h2 id=\"урок-6-числа-и-часът-saat-kaç\">УРОК 6 · Числа и часът — Saat\nkaç?</h2><figure class=\"illus\">\n<svg viewBox=\"0 0 400 210\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Часовник\">\n<circle cx=\"110\" cy=\"105\" r=\"78\" fill=\"#fff\" stroke=\"var(--text-accent)\" stroke-width=\"2\"/>\n<g stroke=\"var(--line)\" stroke-width=\"2\">\n<path d=\"M110 32 V44\"/><path d=\"M110 166 V178\"/><path d=\"M37 105 H49\"/><path d=\"M171 105 H183\"/>\n</g>\n<g font-size=\"12\" fill=\"var(--text)\" text-anchor=\"middle\" font-weight=\"600\">\n<text x=\"110\" y=\"58\">12</text><text x=\"162\" y=\"110\">3</text><text x=\"110\" y=\"160\">6</text><text x=\"58\" y=\"110\">9</text>\n</g>\n<path d=\"M110 105 L110 62\" stroke=\"var(--text)\" stroke-width=\"3.5\" stroke-linecap=\"round\"/>\n<path d=\"M110 105 L150 118\" stroke=\"var(--bad)\" stroke-width=\"3\" stroke-linecap=\"round\"/>\n<circle cx=\"110\" cy=\"105\" r=\"4\" fill=\"var(--bad)\"/>\n<g font-size=\"12.5\" fill=\"var(--text)\">\n<text x=\"206\" y=\"52\" font-weight=\"700\" fill=\"var(--text-accent)\">до 30 минути</text>\n<text x=\"206\" y=\"72\">saat dörd<tspan fill=\"var(--bad)\">ü</tspan> on <tspan fill=\"var(--bad)\">geçiyor</tspan></text>\n<text x=\"206\" y=\"88\" font-size=\"10\" fill=\"var(--text-muted)\">4:10 — минава четири и десет</text>\n<text x=\"206\" y=\"124\" font-weight=\"700\" fill=\"var(--text-accent)\">след 30 минути</text>\n<text x=\"206\" y=\"144\">saat beş<tspan fill=\"var(--bad)\">e</tspan> on <tspan fill=\"var(--bad)\">var</tspan></text>\n<text x=\"206\" y=\"160\" font-size=\"10\" fill=\"var(--text-muted)\">4:50 — без десет пет</text>\n<text x=\"206\" y=\"184\">saat beş <tspan fill=\"var(--bad)\">buçuk</tspan>\n<tspan font-size=\"10\" fill=\"var(--text-muted)\"> — 5:30</tspan></text>\n</g>\n</svg>\n<figcaption>Часът: „минава“ иска -i, „без“ иска -e.</figcaption></figure>\n<h3 id=\"речник-числата-sözlük-sayılar\">Речник — числата · Sözlük —\nsayılar</h3>\n<table>\n<tbody>\n<tr class=\"odd\">\n<td>0</td>\n<td>sıfır</td>\n<td>11</td>\n<td>on bir</td>\n</tr>\n<tr class=\"even\">\n<td>1</td>\n<td>bir</td>\n<td>12</td>\n<td>on iki</td>\n</tr>\n<tr class=\"odd\">\n<td>2</td>\n<td>iki</td>\n<td>20</td>\n<td>yirmi</td>\n</tr>\n<tr class=\"even\">\n<td>3</td>\n<td>üç</td>\n<td>30</td>\n<td>otuz</td>\n</tr>\n<tr class=\"odd\">\n<td>4</td>\n<td>dört</td>\n<td>40</td>\n<td>kırk</td>\n</tr>\n<tr class=\"even\">\n<td>5</td>\n<td>beş</td>\n<td>50</td>\n<td>elli</td>\n</tr>\n<tr class=\"odd\">\n<td>6</td>\n<td>altı</td>\n<td>60</td>\n<td>altmış</td>\n</tr>\n<tr class=\"even\">\n<td>7</td>\n<td>yedi</td>\n<td>70</td>\n<td>yetmiş</td>\n</tr>\n<tr class=\"odd\">\n<td>8</td>\n<td>sekiz</td>\n<td>80</td>\n<td>seksen</td>\n</tr>\n<tr class=\"even\">\n<td>9</td>\n<td>dokuz</td>\n<td>90</td>\n<td>doksan</td>\n</tr>\n<tr class=\"odd\">\n<td>10</td>\n<td>on</td>\n<td>100</td>\n<td>yüz</td>\n</tr>\n</tbody>\n</table>\n<p><code>1 000</code> — bin · <code>1 000 000</code> — milyon ·\n<code>1 000 000 000</code> — milyar</p>\n<p>Числата се пишат разделно и просто се редят: - 25 — yirmi beş - 148 —\nyüz kırk sekiz - 2026 — iki bin yirmi altı</p>\n<p><em>Забележка:</em> пред <code>yüz</code> и <code>bin</code> не се\nказва <code>bir</code>: <strong>yüz</strong> (100), <strong>bin</strong>\n(1000), но <code>bir milyon</code> (1 000 000).</p>\n<h3\nid=\"граматика-6.1-редни-числителни--ıncı--inci-sıra-sayıları\">Граматика\n6.1 — Редни числителни: -ıncı / -inci · Sıra sayıları</h3>\n<table>\n<tbody>\n<tr class=\"odd\">\n<td>birinci</td>\n<td>първи</td>\n</tr>\n<tr class=\"even\">\n<td>ikinci</td>\n<td>втори</td>\n</tr>\n<tr class=\"odd\">\n<td>üçüncü</td>\n<td>трети</td>\n</tr>\n<tr class=\"even\">\n<td>dördüncü</td>\n<td>четвърти</td>\n</tr>\n<tr class=\"odd\">\n<td>beşinci</td>\n<td>пети</td>\n</tr>\n<tr class=\"even\">\n<td>altıncı</td>\n<td>шести</td>\n</tr>\n<tr class=\"odd\">\n<td>yedinci</td>\n<td>седми</td>\n</tr>\n<tr class=\"even\">\n<td>sekizinci</td>\n<td>осми</td>\n</tr>\n<tr class=\"odd\">\n<td>dokuzuncu</td>\n<td>девети</td>\n</tr>\n<tr class=\"even\">\n<td>onuncu</td>\n<td>десети</td>\n</tr>\n</tbody>\n</table>\n<h3 id=\"граматика-6.2-дни-и-месеци-günler-ve-aylar\">Граматика 6.2 — Дни\nи месеци · Günler ve aylar</h3>\n<p><strong>Günler (дни):</strong> Pazartesi (понеделник), Salı\n(вторник), Çarşamba (сряда), Perşembe (четвъртък), Cuma (петък),\nCumartesi (събота), Pazar (неделя)</p>\n<p><strong>Aylar (месеци):</strong> Ocak, Şubat, Mart, Nisan, Mayıs,\nHaziran, Temmuz, Ağustos, Eylül, Ekim, Kasım, Aralık</p>\n<p><strong>Mevsimler (сезони):</strong> ilkbahar (пролет), yaz (лято),\nsonbahar (есен), kış (зима)</p>\n<h3 id=\"граматика-6.3-часът-saat\">Граматика 6.3 — Часът · Saat</h3>\n<p><strong>Въпрос: Saat kaç?</strong> — Колко е часът?</p>\n<ul>\n<li>Saat bir. — 1:00</li>\n<li>Saat üç. — 3:00</li>\n<li>Saat beş buçuk. — 5:30 (<code>buçuk</code> — и половина)</li>\n<li>Saat dört<strong>i</strong> çeyrek geçiyor. — 4:15 (минава четири и\nчетвърт)</li>\n<li>Saat beş<strong>e</strong> çeyrek var. — 4:45 (без четвърт пет)</li>\n<li>Saat yedi<strong>yi</strong> yirmi geçiyor. — 7:20</li>\n<li>Saat dokuz<strong>a</strong> on var. — 8:50</li>\n</ul>\n<p><strong>Правило:</strong> - „минава“ → часът + винителен падеж +\nминути + <strong>geçiyor</strong> - „без“ → следващият час + дателен\nпадеж + минути + <strong>var</strong></p>\n<p><strong>Въпрос: Saat kaçta?</strong> — В колко часа? - Saat\nyedi<strong>de</strong> kalkıyorum. — Ставам в седем часа. - Saat sekiz\nbuçuk<strong>ta</strong> okula gidiyorum. — Отивам на училище в 8:30. -\nSaat bir<strong>de</strong> yemek yiyorum. — Ям в един часа.</p>\n<h3 id=\"граматика-6.4-числата-в-детайли-sayılar-ayrıntılı\">Граматика 6.4\n— Числата в детайли · Sayılar ayrıntılı</h3>\n<p><strong>Съставяне на числа</strong> — просто се редят от голямото към\nмалкото, разделно:</p>\n<div class=\"line-block\">21 | yirmi bir |<br />\n99 | doksan dokuz |<br />\n256 | iki yüz elli altı |<br />\n1 340 | bin üç yüz kırk |<br />\n15 000 | on beş bin |<br />\n2 000 000 | iki milyon |</div>\n<p><strong>Важни разлики от българския:</strong></p>\n<ul>\n<li>Пред <code>yüz</code> (100) и <code>bin</code> (1000) НЕ се казва\n<code>bir</code>: <code>yüz lira</code> (100 лири),\n<code>bin kişi</code> (1000 души) Но: <code>bir milyon</code>,\n<code>bir milyar</code> — тук <code>bir</code> е задължително.</li>\n<li>След число съществителното е в <strong>единствено число</strong>:\n<code>beş kitap</code> (пет книги), <code>on öğrenci</code> (десет\nученици) Никога <del>beş kitaplar</del>.</li>\n</ul>\n<h3 id=\"граматика-6.5-дати-tarihler\">Граматика 6.5 — Дати ·\nTarihler</h3>\n<p>Редът е като българския: <strong>ден + месец + година</strong></p>\n<ul>\n<li>5 Mart 2026 — beş Mart iki bin yirmi altı</li>\n<li>Bugün on iki Ağustos. — Днес е дванадесети август.</li>\n<li>1985’te doğdum. — Роден съм през 1985.</li>\n</ul>\n<p><strong>„На коя дата?“</strong> — с местен падеж: - Sınav beş\nMart’<strong>ta</strong>. — Изпитът е на пети март. - Doğum günüm\nOcak’<strong>ta</strong>. — Рожденият ми ден е през януари. -\n2026’<strong>da</strong> — през 2026</p>\n<h3 id=\"граматика-6.6-часът-пълна-схема-saat-tam-şema\">Граматика 6.6 —\nЧасът: пълна схема · Saat: tam şema</h3>\n<p><strong>„Колко е часът?“ — Saat kaç?</strong></p>\n<table>\n<thead>\n<tr class=\"header\">\n<th>Часът</th>\n<th>Турски</th>\n<th>Буквално</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>3:00</td>\n<td>Saat üç.</td>\n<td>часът три</td>\n</tr>\n<tr class=\"even\">\n<td>3:05</td>\n<td>Saat üçü beş geçiyor.</td>\n<td>минава три с пет</td>\n</tr>\n<tr class=\"odd\">\n<td>3:15</td>\n<td>Saat üçü çeyrek geçiyor.</td>\n<td>минава три с четвърт</td>\n</tr>\n<tr class=\"even\">\n<td>3:30</td>\n<td>Saat üç buçuk.</td>\n<td>три и половина</td>\n</tr>\n<tr class=\"odd\">\n<td>3:45</td>\n<td>Saat dörde çeyrek var.</td>\n<td>до четири има четвърт</td>\n</tr>\n<tr class=\"even\">\n<td>3:50</td>\n<td>Saat dörde on var.</td>\n<td>до четири има десет</td>\n</tr>\n<tr class=\"odd\">\n<td>12:00</td>\n<td>Saat on iki.</td>\n<td>—</td>\n</tr>\n</tbody>\n</table>\n<p><strong>Правилото:</strong> - До половина (<code>geçiyor</code>):\nчасът във <strong>винителен</strong> падеж + минути + geçiyor - След\nполовина (<code>var</code>): <strong>следващият</strong> час в\n<strong>дателен</strong> падеж + минути + var</p>\n<p><strong>„В колко часа?“ — Saat kaçta?</strong> — добавя се местен\nпадеж:</p>\n<div class=\"line-block\">Saat üç<strong>te</strong> | в три часа |<br />\nSaat üç buçuk<strong>ta</strong> | в три и половина |<br />\nSaat üçü çeyrek geçe | в три и четвърт |<br />\nSaat dörde çeyrek kala | в три и четиридесет и пет |</div>\n<h3 id=\"граматика-6.7-части-на-деня-günün-bölümleri\">Граматика 6.7 —\nЧасти на деня · Günün bölümleri</h3>\n<div class=\"line-block\">sabah | сутрин | sabahleyin — сутринта |<br />\nöğle | обед | öğleyin — по обед |<br />\nöğleden sonra | следобед | |<br />\nakşam | вечер | akşamleyin — вечерта |<br />\ngece | нощ | geceleyin — през нощта |<br />\ndün | вчера | dün akşam — снощи |<br />\nbugün | днес | bu sabah — тази сутрин |<br />\nyarın | утре | yarın akşam — утре вечер |</div>\n<p>За навик се използва множествено число: - Sabah<strong>ları</strong>\nkoşarım. — Сутрин (обикновено) тичам. - Akşam<strong>ları</strong> kitap\nokurum. — Вечер чета книга.</p>\n<h3 id=\"защо-е-така-neden-böyle-5\">Защо е така · Neden böyle</h3>\n<p><strong>Защо „минава“ иска винителен, а „без“ — дателен?</strong>\nПогледни буквалния превод:</p>\n<ul>\n<li><code>Saat üçü beş geçiyor</code> = „Часът минава\n<strong>три</strong>-та с пет“ — три е обектът, който бива задминат,\nзатова е във винителен падеж.</li>\n<li><code>Saat dörde beş var</code> = „До <strong>четири</strong> има\nпет“ — четири е целта, посоката, затова е в дателен падеж.</li>\n</ul>\n<p>Щом го погледнеш като движение — минаваме покрай тричасовата отметка\nкъм четири — падежите стават логични.</p>\n<p><strong>Защо след число съществителното е в единствено\nчисло?</strong> Същата логика като при <code>-lar</code>: числото вече\nноси информацията за множество. <code>iki saat</code> (два часа),\n<code>beş dakika</code> (пет минути).</p>\n<p><strong>Защо <code>sabahları</code> е в множествено число?</strong>\nЗащото не говорим за една конкретна сутрин, а за сутрините изобщо —\nнавик. <code>Sabah kalkıyorum</code> = сутринта (тази) ставам.\n<code>Sabahları kalkarım</code> = сутрин (обикновено) ставам.</p>\n<h3 id=\"текст-за-четене-и-превод-okuma-ve-çeviri-metni-4\">Текст за\nчетене и превод · Okuma ve çeviri metni</h3>\n<p><strong>Benim günüm — Моят ден</strong></p>\n<blockquote>\n<p>Her sabah saat altı buçukta kalkıyorum. Yediye çeyrek kala kahvaltı\nyapıyorum. Kahvaltıda peynir, zeytin ve ekmek yiyorum, çay içiyorum.\nSaat yedi buçukta evden çıkıyorum. İşe otobüsle gidiyorum, yolculuk\nyirmi dakika sürüyor. Saat sekizde işe başlıyorum. Öğle yemeğini saat on\nikide yiyorum. Saat beşte iş bitiyor. Akşam saat yedide eve dönüyorum.\nAkşam yemeğinden sonra biraz televizyon izliyorum veya kitap okuyorum.\nSaat on birde yatıyorum.</p>\n</blockquote>\n<p><em>Нови думи:</em> <code>kalkmak</code> — ставам;\n<code>kahvaltı</code> — закуска; <code>peynir</code> — сирене;\n<code>zeytin</code> — маслина; <code>otobüsle</code> — с автобус;\n<code>yolculuk</code> — пътуване; <code>sürmek</code> — трае;\n<code>dakika</code> — минута; <code>öğle yemeği</code> — обяд;\n<code>bitmek</code> — свършва; <code>-den sonra</code> — след;\n<code>biraz</code> — малко; <code>veya</code> — или; <code>yatmak</code>\n— лягам.</p>\n<p><strong>Въпроси:</strong></p>\n<ol type=\"1\">\n<li>Saat kaçta kalkıyor?</li>\n<li>Kahvaltıda ne yiyor?</li>\n<li>İşe nasıl gidiyor?</li>\n<li>Akşam saat kaçta eve dönüyor?</li>\n</ol>\n<h3 id=\"упражнения-alıştırmalar-5\">Упражнения · Alıştırmalar</h3>\n<p><strong>Упр. 6.1 — Напиши с думи.</strong> <em>(Yazıyla\nyazın.)</em></p>\n<ol type=\"1\">\n<li>7</li>\n<li>15</li>\n<li>42</li>\n<li>100</li>\n<li>365</li>\n<li>1998</li>\n</ol>\n<p><strong>Упр. 6.2 — Колко е часът?</strong> <em>(Saat kaç?)</em></p>\n<ol type=\"1\">\n<li>3:00</li>\n<li>6:30</li>\n<li>9:15</li>\n<li>10:45</li>\n<li>2:20</li>\n</ol>\n<p><strong>Упр. 6.3 — Попълни правилното окончание.</strong> <em>(Doğru\neki yazın.)</em></p>\n<ol type=\"1\">\n<li>Saat yedi___ kalkıyorum.</li>\n<li>Saat sekiz___ çeyrek var.</li>\n<li>Saat dört___ on geçiyor.</li>\n<li>Saat bir buçuk___ geliyorum.</li>\n</ol>\n<p><strong>Упр. 6.4 — Преведи на турски.</strong> <em>(Türkçeye\nçevirin.)</em></p>\n<ol type=\"1\">\n<li>Колко е часът?</li>\n<li>Часът е шест и половина.</li>\n<li>Ставам в седем часа.</li>\n<li>Днес е понеделник.</li>\n<li>Изпитът е на пети март.</li>\n</ol>\n<h3 id=\"допълнителни-упражнения-ek-alıştırmalar-5\">Допълнителни\nупражнения · Ek alıştırmalar</h3>\n<p><strong>Упр. 6.5 — Напиши часа с думи.</strong> <em>(Saati yazıyla\nyazın.)</em></p>\n<ol type=\"1\">\n<li>8:00</li>\n<li>11:30</li>\n<li>1:15</li>\n<li>5:45</li>\n<li>7:25</li>\n<li>12:00</li>\n</ol>\n<p><strong>Упр. 6.6 — Пресметни.</strong> <em>(Hesaplayın.)</em></p>\n<ol type=\"1\">\n<li>on beş + yirmi =</li>\n<li>kırk − on iki =</li>\n<li>yüz : dört =</li>\n<li>altı × yedi =</li>\n</ol>\n<p><strong>Упр. 6.7 — Кой ден е?</strong> <em>(Hangi gün?)</em></p>\n<ol type=\"1\">\n<li>Pazartesi’den sonra …</li>\n<li>Cuma’dan önce …</li>\n<li>Cumartesi ve … hafta sonu.</li>\n<li>Perşembe’den sonra …</li>\n</ol>\n<p><strong>Упр. 6.8 — Отговори за себе си.</strong> <em>(Kendiniz için\ncevap verin.)</em></p>\n<ol type=\"1\">\n<li>Saat kaçta kalkıyorsun?</li>\n<li>Saat kaçta işe/okula gidiyorsun?</li>\n<li>Saat kaçta yatıyorsun?</li>\n<li>Bugün günlerden ne?</li>\n</ol>\n<p><strong>Упр. 6.9 — Напиши числата с думи.</strong> <em>(Sayıları\nyazıyla yazın.)</em></p>\n<ol type=\"1\">\n<li>21</li>\n<li>47</li>\n<li>99</li>\n<li>105</li>\n<li>380</li>\n<li>1 250</li>\n<li>12 000</li>\n<li>2 000 000</li>\n</ol>\n<p><strong>Упр. 6.10 — Пресметни и напиши отговора с думи.</strong>\n<em>(Hesaplayın ve cevabı yazıyla yazın.)</em></p>\n<ol type=\"1\">\n<li>yirmi + on beş =</li>\n<li>altmış − yirmi beş =</li>\n<li>dokuz × sekiz =</li>\n<li>yüz : beş =</li>\n<li>kırk + otuz iki =</li>\n<li>seksen − on dokuz =</li>\n</ol>\n<p><strong>Упр. 6.11 — Колко е часът?</strong> <em>(Saat kaç?)</em></p>\n<ol type=\"1\">\n<li>2:00</li>\n<li>4:10</li>\n<li>6:15</li>\n<li>8:30</li>\n<li>9:45</li>\n<li>11:50</li>\n<li>1:25</li>\n<li>12:35</li>\n</ol>\n<p><strong>Упр. 6.12 — В колко часа? (добави местен падеж)</strong>\n<em>(Saat kaçta? (bulunma hâli ekleyin))</em></p>\n<ol type=\"1\">\n<li>Sınav saat dokuz___ .</li>\n<li>Ders saat bir buçuk___ başlıyor.</li>\n<li>Saat yedi___ kalkıyorum.</li>\n<li>Toplantı saat on iki___ .</li>\n<li>Film saat sekiz___ başlıyor.</li>\n<li>Saat üç___ geliyorum.</li>\n</ol>\n<p><strong>Упр. 6.13 — Дати.</strong> <em>(Tarihler.)</em></p>\n<ol type=\"1\">\n<li>5 март</li>\n<li>12 август 2026</li>\n<li>Изпитът е на десети май.</li>\n<li>Роден съм през 1990.</li>\n<li>Рожденият ми ден е през януари.</li>\n</ol>\n<p><strong>Упр. 6.14 — Отговори с пълно изречение.</strong> <em>(Tam\ncümleyle cevap verin.)</em></p>\n<ol type=\"1\">\n<li>Bugün günlerden ne?</li>\n<li>Saat kaç?</li>\n<li>Saat kaçta kalkıyorsun?</li>\n<li>Doğum günün ne zaman?</li>\n<li>Bir yılda kaç ay var?</li>\n<li>Bir haftada kaç gün var?</li>\n</ol>\n<h3>Тематичен речник · Konu sözlüğü — Календар и време · Takvim ve hava</h3><table><thead><tr><th>Türkçe</th><th>Български</th></tr></thead><tbody><tr><td>hafta içi</td><td>делник</td></tr><tr><td>hafta sonu</td><td>уикенд</td></tr><tr><td>dün</td><td>вчера</td></tr><tr><td>bugün</td><td>днес</td></tr><tr><td>yarın</td><td>утре</td></tr><tr><td>önceki gün</td><td>завчера</td></tr><tr><td>öbür gün</td><td>вдругиден</td></tr><tr><td>gelecek hafta</td><td>следващата седмица</td></tr><tr><td>geçen ay</td><td>миналия месец</td></tr><tr><td>her yıl</td><td>всяка година</td></tr><tr><td>mevsim</td><td>сезон</td></tr><tr><td>ilkbahar</td><td>пролет</td></tr><tr><td>yaz</td><td>лято</td></tr><tr><td>sonbahar</td><td>есен</td></tr><tr><td>kış</td><td>зима</td></tr><tr><td>takvim</td><td>календар</td></tr><tr><td>tarih</td><td>дата; история</td></tr><tr><td>doğum günü</td><td>рожден ден</td></tr><tr><td>resmî tatil</td><td>официален празник</td></tr><tr><td>yılbaşı</td><td>Нова година</td></tr><tr><td>hava durumu</td><td>прогноза за времето</td></tr><tr><td>güneşli</td><td>слънчево</td></tr><tr><td>bulutlu</td><td>облачно</td></tr><tr><td>yağmurlu</td><td>дъждовно</td></tr><tr><td>karlı</td><td>снежно</td></tr><tr><td>rüzgârlı</td><td>ветровито</td></tr><tr><td>sisli</td><td>мъгливо</td></tr><tr><td>açık hava</td><td>ясно време</td></tr><tr><td>sıcaklık</td><td>температура</td></tr><tr><td>derece</td><td>градус</td></tr><tr><td>sıfırın altında</td><td>под нулата</td></tr><tr><td>ısınmak</td><td>затопля се</td></tr><tr><td>soğumak</td><td>застудява</td></tr><tr><td>yağmur yağmak</td><td>вали дъжд</td></tr><tr><td>kar yağmak</td><td>вали сняг</td></tr><tr><td>dolu yağmak</td><td>вали градушка</td></tr><tr><td>gök gürlemek</td><td>гърми</td></tr><tr><td>şimşek çakmak</td><td>святка</td></tr><tr><td>nem</td><td>влажност</td></tr><tr><td>kuraklık</td><td>суша</td></tr><tr><td>sel</td><td>наводнение</td></tr><tr><td>fırtına</td><td>буря</td></tr><tr><td>gün doğumu</td><td>изгрев</td></tr><tr><td>gün batımı</td><td>залез</td></tr><tr><td>gündüz</td><td>през деня</td></tr><tr><td>gece yarısı</td><td>полунощ</td></tr></tbody></table><p><strong>Упр. 6.15 — Как е на турски?</strong> <em>(Türkçesi nedir?)</em></p><ol type=\"1\"><li>уикенд</li><li>вдругиден</li><li>сезон</li><li>пролет</li><li>прогноза за времето</li><li>облачно</li><li>вали сняг</li><li>градус</li><li>изгрев</li><li>полунощ</li></ol><h3>Тематичен речник · Konu sözlüğü — Дни, месеци и време · Günler, aylar ve zaman</h3><table><thead><tr><th>Türkçe</th><th>Български</th></tr></thead><tbody><tr><td>Pazartesi</td><td>понеделник</td></tr><tr><td>Salı</td><td>вторник</td></tr><tr><td>Çarşamba</td><td>сряда</td></tr><tr><td>Perşembe</td><td>четвъртък</td></tr><tr><td>Cuma</td><td>петък</td></tr><tr><td>Cumartesi</td><td>събота</td></tr><tr><td>Ocak</td><td>януари</td></tr><tr><td>Şubat</td><td>февруари</td></tr><tr><td>Mart</td><td>март</td></tr><tr><td>Nisan</td><td>април</td></tr><tr><td>Mayıs</td><td>май</td></tr><tr><td>Haziran</td><td>юни</td></tr><tr><td>Temmuz</td><td>юли</td></tr><tr><td>Ağustos</td><td>август</td></tr><tr><td>Eylül</td><td>септември</td></tr><tr><td>Ekim</td><td>октомври</td></tr><tr><td>Kasım</td><td>ноември</td></tr><tr><td>Aralık</td><td>декември</td></tr><tr><td>vakit</td><td>време, момент</td></tr><tr><td>saniye</td><td>секунда</td></tr><tr><td>yüzyıl</td><td>век</td></tr><tr><td>sene</td><td>година</td></tr><tr><td>ertesi gün</td><td>на следващия ден</td></tr><tr><td>hiçbir zaman</td><td>никога</td></tr><tr><td>gece</td><td>нощ</td></tr><tr><td>öğle</td><td>обед</td></tr><tr><td>akşam</td><td>вечер</td></tr><tr><td>ilkbahar</td><td>пролет</td></tr></tbody></table><p><strong>Упр. 6.17 — Как е на турски?</strong> <em>(Türkçesi nedir?)</em></p><ol type=\"1\"><li>понеделник</li><li>четвъртък</li><li>януари</li><li>септември</li><li>век</li><li>никога</li><li>на следващия ден</li><li>пролет</li></ol><h3>Тематичен речник · Konu sözlüğü — Числата · Sayılar</h3><table><thead><tr><th>Türkçe</th><th>Български</th></tr></thead><tbody><tr><td>sıfır</td><td>нула</td></tr><tr><td>bir</td><td>едно</td></tr><tr><td>iki</td><td>две</td></tr><tr><td>üç</td><td>три</td></tr><tr><td>dört</td><td>четири</td></tr><tr><td>beş</td><td>пет</td></tr><tr><td>altı</td><td>шест</td></tr><tr><td>yedi</td><td>седем</td></tr><tr><td>sekiz</td><td>осем</td></tr><tr><td>dokuz</td><td>девет</td></tr><tr><td>on</td><td>десет</td></tr><tr><td>yirmi</td><td>двайсет</td></tr><tr><td>otuz</td><td>трийсет</td></tr><tr><td>kırk</td><td>четирийсет</td></tr><tr><td>elli</td><td>петдесет</td></tr><tr><td>altmış</td><td>шейсет</td></tr><tr><td>yetmiş</td><td>седемдесет</td></tr><tr><td>seksen</td><td>осемдесет</td></tr><tr><td>doksan</td><td>деветдесет</td></tr><tr><td>yüz</td><td>сто</td></tr><tr><td>bin</td><td>хиляда</td></tr><tr><td>milyon</td><td>милион</td></tr><tr><td>birinci</td><td>първи</td></tr><tr><td>ikinci</td><td>втори</td></tr><tr><td>üçüncü</td><td>трети</td></tr><tr><td>dördüncü</td><td>четвърти</td></tr><tr><td>beşinci</td><td>пети</td></tr><tr><td>yarım</td><td>половина (самостоятелно)</td></tr><tr><td>buçuk</td><td>и половина (с число)</td></tr><tr><td>tane</td><td>брой, парче</td></tr><tr><td>gram</td><td>грам</td></tr><tr><td>litre</td><td>литър</td></tr><tr><td>metre</td><td>метър</td></tr></tbody></table><p><strong>Упр. 6.16 — Как е на турски?</strong> <em>(Türkçesi nedir?)</em></p><ol type=\"1\"><li>нула</li><li>седем</li><li>четирийсет</li><li>сто</li><li>хиляда</li><li>трети</li><li>и половина (с число)</li><li>брой, парче</li></ol><hr />\n<h2 id=\"урок-7-широко-сегашно-време-geniş-zaman\">УРОК 7 · Широко сегашно\nвреме — Geniş zaman</h2>\n<h3 id=\"речник-sözlük-5\">Речник · Sözlük</h3>\n<table>\n<thead>\n<tr class=\"header\">\n<th>Турски</th>\n<th>Български</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>her gün</td>\n<td>всеки ден</td>\n</tr>\n<tr class=\"even\">\n<td>her zaman</td>\n<td>винаги</td>\n</tr>\n<tr class=\"odd\">\n<td>genellikle</td>\n<td>обикновено</td>\n</tr>\n<tr class=\"even\">\n<td>bazen</td>\n<td>понякога</td>\n</tr>\n<tr class=\"odd\">\n<td>asla / hiç</td>\n<td>никога</td>\n</tr>\n<tr class=\"even\">\n<td>sık sık</td>\n<td>често</td>\n</tr>\n<tr class=\"odd\">\n<td>nadiren</td>\n<td>рядко</td>\n</tr>\n<tr class=\"even\">\n<td>yardım etmek</td>\n<td>помагам</td>\n</tr>\n<tr class=\"odd\">\n<td>gezmek</td>\n<td>разхождам се</td>\n</tr>\n<tr class=\"even\">\n<td>yüzmek</td>\n<td>плувам</td>\n</tr>\n<tr class=\"odd\">\n<td>koşmak</td>\n<td>тичам</td>\n</tr>\n<tr class=\"even\">\n<td>kitap okumak</td>\n<td>чета книга</td>\n</tr>\n<tr class=\"odd\">\n<td>erken</td>\n<td>рано</td>\n</tr>\n<tr class=\"even\">\n<td>geç</td>\n<td>късно</td>\n</tr>\n<tr class=\"odd\">\n<td>birlikte</td>\n<td>заедно</td>\n</tr>\n<tr class=\"even\">\n<td>bazı</td>\n<td>някои</td>\n</tr>\n</tbody>\n</table>\n<h3\nid=\"граматика-7.1-geniş-zaman--r--ar--er--ır--ir--ur--ür-geniş-zaman\">Граматика\n7.1 — Geniş zaman: -r / -ar / -er / -ır / -ir / -ur / -ür · Geniş\nzaman</h3>\n<p>Употребява се за: - навици и повтарящи се действия:\n<code>Her gün kahve içerim.</code> — Всеки ден пия кафе. - общи истини:\n<code>Su yüz derecede kaynar.</code> — Водата кипи при 100 градуса. -\nучтиви молби и предложения: <code>Bir çay alır mısınız?</code> — Ще\nпиете ли чай?</p>\n<p><strong>Правила за образуване:</strong></p>\n<ol type=\"1\">\n<li><p>Ако коренът свършва на <strong>гласна</strong> → <code>-r</code>\n<code>oku-</code> → oku<strong>r</strong>, <code>bekle-</code> →\nbekle<strong>r</strong>, <code>başla-</code> →\nbaşla<strong>r</strong></p></li>\n<li><p>Ако коренът е <strong>едносричен и завършва на съгласна</strong>\n→ <code>-ar / -er</code> <code>gel-</code> → gel<strong>er</strong>,\n<code>yaz-</code> → yaz<strong>ar</strong>, <code>bak-</code> →\nbak<strong>ar</strong>, <code>git-</code> →\ngid<strong>er</strong></p></li>\n<li><p>Ако коренът е <strong>многосричен и завършва на съгласна</strong>\n→ <code>-ır / -ir / -ur / -ür</code> <code>çalış-</code> →\nçalış<strong>ır</strong>, <code>otur-</code> → otur<strong>ur</strong>,\n<code>öğren-</code> → öğren<strong>ir</strong>, <code>götür-</code> →\ngötür<strong>ür</strong></p></li>\n</ol>\n<p><strong>Изключения</strong> (едносрични, но вземат тясната гласна):\n<code>almak → alır</code>, <code>bilmek → bilir</code>,\n<code>bulmak → bulur</code>, <code>gelmek → gelir</code>,\n<code>görmek → görür</code>, <code>kalmak → kalır</code>,\n<code>olmak → olur</code>, <code>ölmek → ölür</code>,\n<code>sanmak → sanır</code>, <code>varmak → varır</code>,\n<code>vermek → verir</code>, <code>vurmak → vurur</code>,\n<code>durmak → durur</code>.</p>\n<p><strong>Спрежение (<code>gelmek</code>):</strong></p>\n<table>\n<tbody>\n<tr class=\"odd\">\n<td>ben gel<strong>irim</strong></td>\n<td>biz gel<strong>iriz</strong></td>\n</tr>\n<tr class=\"even\">\n<td>sen gel<strong>irsin</strong></td>\n<td>siz gel<strong>irsiniz</strong></td>\n</tr>\n<tr class=\"odd\">\n<td>o gel<strong>ir</strong></td>\n<td>onlar gel<strong>irler</strong></td>\n</tr>\n</tbody>\n</table>\n<p><strong>Отрицание — внимание, различно е!</strong></p>\n<table>\n<tbody>\n<tr class=\"odd\">\n<td>ben gel<strong>mem</strong></td>\n<td>biz gel<strong>meyiz</strong></td>\n</tr>\n<tr class=\"even\">\n<td>sen gel<strong>mezsin</strong></td>\n<td>siz gel<strong>mezsiniz</strong></td>\n</tr>\n<tr class=\"odd\">\n<td>o gel<strong>mez</strong></td>\n<td>onlar gel<strong>mezler</strong></td>\n</tr>\n</tbody>\n</table>\n<p>За 1 л. ед.ч. и мн.ч. се използва само <code>-me/-ma</code>, за\nостаналите — <code>-mez/-maz</code>.</p>\n<p><strong>Въпрос:</strong> <code>Gelir misin?</code> (Идваш ли\nобикновено? / Ще дойдеш ли?) · <code>Gelmez misin?</code></p>\n<h3\nid=\"граматика-7.2-разлика-между--yor-и-geniş-zaman-şimdiki-zaman-ve-geniş-zaman-farkı\">Граматика\n7.2 — Разлика между <code>-yor</code> и <code>geniş zaman</code> ·\nŞimdiki zaman ve geniş zaman farkı</h3>\n<table>\n<colgroup>\n<col style=\"width: 50%\" />\n<col style=\"width: 50%\" />\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th>-yor (сега)</th>\n<th>geniş zaman (обикновено)</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Şimdi çay içiyorum. — Сега пия чай.</td>\n<td>Her sabah çay içerim. — Всяка сутрин пия чай.</td>\n</tr>\n<tr class=\"even\">\n<td>Şu anda çalışıyor. — В момента работи.</td>\n<td>Bankada çalışır. — Работи в банка (по принцип).</td>\n</tr>\n</tbody>\n</table>\n<h3\nid=\"граматика-7.3-пълните-правила-за-geniş-zaman-geniş-zamanın-kuralları\">Граматика\n7.3 — Пълните правила за geniş zaman · Geniş zamanın kuralları</h3>\n<p>Изборът на окончание зависи от корена:</p>\n<p><strong>Правило 1 — корен на гласна → <code>-r</code></strong></p>\n<div class=\"line-block\">oku- | oku<strong>r</strong>um | чета |<br />\nbekle- | bekle<strong>r</strong>im | чакам |<br />\nbaşla- | başla<strong>r</strong>ım | започвам |<br />\nyürü- | yürü<strong>r</strong>üm | вървя |</div>\n<p><strong>Правило 2 — едносричен корен на съгласна →\n<code>-ar/-er</code></strong></p>\n<div class=\"line-block\">yaz- | yaz<strong>ar</strong>ım | пиша |<br />\nbak- | bak<strong>ar</strong>ım | гледам |<br />\niç- | iç<strong>er</strong>im | пия |<br />\ngit- | gid<strong>er</strong>im | отивам <em>(t→d)</em> |<br />\nyap- | yap<strong>ar</strong>ım | правя |</div>\n<p><strong>Правило 3 — многосричен корен на съгласна →\n<code>-ır/-ir/-ur/-ür</code></strong></p>\n<div class=\"line-block\">çalış- | çalış<strong>ır</strong>ım | работя\n|<br />\nöğren- | öğren<strong>ir</strong>im | уча |<br />\notur- | otur<strong>ur</strong>um | седя |<br />\ngötür- | götür<strong>ür</strong>üm | нося |</div>\n<p><strong>13-те изключения</strong> — едносрични, но с тясна гласна.\nЗапомни ги наизуст:</p>\n<p><code>al-ır</code> · <code>bil-ir</code> · <code>bul-ur</code> ·\n<code>dur-ur</code> · <code>gel-ir</code> · <code>gör-ür</code> ·\n<code>kal-ır</code> · <code>ol-ur</code> · <code>öl-ür</code> ·\n<code>san-ır</code> · <code>var-ır</code> · <code>ver-ir</code> ·\n<code>vur-ur</code></p>\n<p><strong>Мнемоника:</strong> почти всички са свързани с основни\nдействия — вземам, зная, намирам, идвам, виждам, оставам, ставам, давам.\nИменно най-употребяваните думи в един език запазват стари форми — същото\nе и в българския („съм“, „ям“, „дам“).</p>\n<p><strong>Внимавай с <code>etmek</code>:</strong> <code>et-</code> е\nедносричен, но следва правило 2 → <code>eder</code>,\n<code>ederim</code>, <code>edersin</code>. Затова:\n<code>yardım ederim</code> (помагам), <code>teşekkür ederim</code>\n(благодаря), <code>rica ederim</code> (моля). Това са едни от\nнай-честите изрази в турския.</p>\n<h3\nid=\"граматика-7.4-отрицанието-е-неправилно-geniş-zamanın-olumsuzu\">Граматика\n7.4 — Отрицанието е неправилно · Geniş zamanın olumsuzu</h3>\n<p>Тук turkish прави нещо особено — 1 лице се различава от\nостаналите:</p>\n<table>\n<thead>\n<tr class=\"header\">\n<th>Лице</th>\n<th>Форма</th>\n<th>Обяснение</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>ben</td>\n<td>gel<strong>mem</strong></td>\n<td>само -me/-ma</td>\n</tr>\n<tr class=\"even\">\n<td>sen</td>\n<td>gel<strong>mez</strong>sin</td>\n<td>-mez/-maz</td>\n</tr>\n<tr class=\"odd\">\n<td>o</td>\n<td>gel<strong>mez</strong></td>\n<td>-mez/-maz</td>\n</tr>\n<tr class=\"even\">\n<td>biz</td>\n<td>gel<strong>meyiz</strong></td>\n<td>-me + -yiz</td>\n</tr>\n<tr class=\"odd\">\n<td>siz</td>\n<td>gel<strong>mez</strong>siniz</td>\n<td>-mez/-maz</td>\n</tr>\n<tr class=\"even\">\n<td>onlar</td>\n<td>gel<strong>mez</strong>ler</td>\n<td>-mez/-maz</td>\n</tr>\n</tbody>\n</table>\n<p>С дебели гласни (<code>yapmak</code>):\n<code>yapmam, yapmazsın, yapmaz, yapmayız, yapmazsınız, yapmazlar</code></p>\n<h3\nid=\"граматика-7.5-кога-се-използва-geniş-zaman-geniş-zamanın-kullanımları\">Граматика\n7.5 — Кога се използва geniş zaman · Geniş zamanın kullanımları</h3>\n<ol type=\"1\">\n<li><strong>Навици:</strong> Her sabah kahve içerim. — Всяка сутрин пия\nкафе.</li>\n<li><strong>Общи истини:</strong> Su yüz derecede kaynar. — Водата кипи\nпри 100 градуса.</li>\n<li><strong>Характер:</strong> Çok çalışır. — Той е много работлив.</li>\n<li><strong>Учтива молба:</strong> Kapıyı kapatır mısınız? — Ще\nзатворите ли вратата?</li>\n<li><strong>Предложение:</strong> Bir çay içer misin? — Ще пиеш ли\nчай?</li>\n<li><strong>Обещание:</strong> Yarın gelirim. — Ще дойда утре.</li>\n<li><strong>Възможност:</strong> Belki gelir. — Може и да дойде.</li>\n</ol>\n<h3\nid=\"граматика-7.6--yor-срещу-geniş-zaman-şimdiki-zaman-ve-geniş-zaman\">Граматика\n7.6 — <code>-yor</code> срещу geniş zaman · Şimdiki zaman ve geniş\nzaman</h3>\n<table>\n<thead>\n<tr class=\"header\">\n<th>Ситуация</th>\n<th>Кое време</th>\n<th>Пример</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Сега, в момента</td>\n<td>-yor</td>\n<td>Şimdi çalışıyorum.</td>\n</tr>\n<tr class=\"even\">\n<td>Навик</td>\n<td>geniş</td>\n<td>Her gün çalışırım.</td>\n</tr>\n<tr class=\"odd\">\n<td>Този период</td>\n<td>-yor</td>\n<td>Bu ay çok çalışıyorum.</td>\n</tr>\n<tr class=\"even\">\n<td>Характер</td>\n<td>geniş</td>\n<td>O çok çalışır.</td>\n</tr>\n<tr class=\"odd\">\n<td>Сигурно бъдеще</td>\n<td>-yor</td>\n<td>Yarın geliyorum.</td>\n</tr>\n<tr class=\"even\">\n<td>Възможно бъдеще</td>\n<td>geniş</td>\n<td>Yarın gelirim.</td>\n</tr>\n<tr class=\"odd\">\n<td>Учтива молба</td>\n<td>geniş</td>\n<td>Yardım eder misiniz?</td>\n</tr>\n</tbody>\n</table>\n<p><strong>Класическа разлика:</strong> - <code>Sigara içiyorum.</code>\n— Пуша (точно сега, в момента). - <code>Sigara içerim.</code> — Пушач\nсъм. - <code>Sigara içmem.</code> — Не пуша (изобщо).</p>\n<h3 id=\"защо-е-така-neden-böyle-6\">Защо е така · Neden böyle</h3>\n<p><strong>Защо се казва „широко“ време?</strong> Защото обхваща широк\nотрязък от време — минало, настояще и бъдеще едновременно.\n<code>Her sabah kahve içerim</code> важи и за вчера, и за днес, и за\nутре. Затова с него се изразяват навици, характер и общи истини — все\nнеща без конкретен момент.</p>\n<p><strong>Защо отрицанието на 1 лице е различно?</strong>\n<code>gelmem</code> вместо очакваното <code>gelmezim</code>. Историческа\nпричина: старата форма е била <code>gelmezim</code>, но с времето е\nизтъркана в говора. Тази неправилност е малка цена — това е единственото\nмясто в турската глаголна система с такова изключение.</p>\n<p><strong>Защо учтивите молби са в geniş zaman?</strong> Защото това\nвреме не твърди нищо конкретно — оставя вратичка.\n<code>Kapıyı kapatır mısınız?</code> буквално е „Затваряте ли обикновено\nвратата?“, което е по-меко от прякото „Затвори вратата!“. Английският\nправи същото с <em>would you</em>.</p>\n<h3 id=\"текст-за-четене-и-превод-okuma-ve-çeviri-metni-5\">Текст за\nчетене и превод · Okuma ve çeviri metni</h3>\n<p><strong>Hafta sonu — Уикендът</strong></p>\n<blockquote>\n<p>Hafta içi çok çalışırım, bu yüzden hafta sonunu çok severim.\nCumartesi sabahı geç kalkarım, genellikle saat onda. Kahvaltıdan sonra\nparka giderim ve orada koşarım. Öğleden sonra bazen arkadaşlarımla\nbuluşurum. Birlikte kahve içeriz ve konuşuruz. Akşam sinemaya gideriz\nveya evde film izleriz. Pazar günü genellikle evde kalırım. Ailemle\nyemek yerim, biraz kitap okurum. Pazar akşamı erken yatarım, çünkü\npazartesi sabahı erken kalkarım.</p>\n</blockquote>\n<p><em>Нови думи:</em> <code>hafta içi</code> — през седмицата;\n<code>bu yüzden</code> — затова; <code>hafta sonu</code> — уикенд;\n<code>buluşmak</code> — срещам се; <code>kalmak</code> — оставам;\n<code>çünkü</code> — защото.</p>\n<p><strong>Въпроси:</strong></p>\n<ol type=\"1\">\n<li>Cumartesi saat kaçta kalkar?</li>\n<li>Parkta ne yapar?</li>\n<li>Pazar günü ne yapar?</li>\n<li>Neden pazar akşamı erken yatar?</li>\n</ol>\n<h3 id=\"упражнения-alıştırmalar-6\">Упражнения · Alıştırmalar</h3>\n<p><strong>Упр. 7.1 — Постави в geniş zaman (ben).</strong> <em>(Geniş\nzamana çevirin (ben).)</em></p>\n<ol type=\"1\">\n<li>gelmek</li>\n<li>çalışmak</li>\n<li>okumak</li>\n<li>bakmak</li>\n<li>görmek</li>\n<li>oturmak</li>\n<li>yazmak</li>\n<li>beklemek</li>\n</ol>\n<p><strong>Упр. 7.2 — Направи отрицателни.</strong> <em>(Olumsuz\nyapın.)</em></p>\n<ol type=\"1\">\n<li>Gelirim.</li>\n<li>Çalışırsın.</li>\n<li>Okur.</li>\n<li>Yazarız.</li>\n<li>Bakarsınız.</li>\n</ol>\n<p><strong>Упр. 7.3 — Избери правилната форма (-yor или geniş\nzaman).</strong> <em>(Doğru biçimi seçin (-yor / geniş zaman).)</em></p>\n<ol type=\"1\">\n<li>Şu anda kitap (okumak) ___ .</li>\n<li>Her gün kahve (içmek) ___ .</li>\n<li>Genellikle erken (kalkmak) ___ .</li>\n<li>Şimdi televizyon (izlemek) ___ .</li>\n</ol>\n<p><strong>Упр. 7.4 — Преведи на турски.</strong> <em>(Türkçeye\nçevirin.)</em></p>\n<ol type=\"1\">\n<li>Всеки ден пия чай.</li>\n<li>Не пуша. (<code>sigara içmek</code> — пуша)</li>\n<li>Ще пиеш ли кафе?</li>\n<li>Той работи в банка.</li>\n<li>Понякога ходим на кино.</li>\n</ol>\n<h3 id=\"допълнителни-упражнения-ek-alıştırmalar-6\">Допълнителни\nупражнения · Ek alıştırmalar</h3>\n<p><strong>Упр. 7.5 — Постави в geniş zaman (внимавай с\nизключенията).</strong> <em>(Geniş zamana çevirin (istisnalara\ndikkat).)</em></p>\n<ol type=\"1\">\n<li>almak (ben)</li>\n<li>bilmek (sen)</li>\n<li>gelmek (o)</li>\n<li>bulmak (biz)</li>\n<li>vermek (siz)</li>\n<li>kalmak (onlar)</li>\n</ol>\n<p><strong>Упр. 7.6 — Учтива молба с geniş zaman.</strong> <em>(Geniş\nzamanla kibar rica.)</em></p>\n<ol type=\"1\">\n<li>Ще пиете ли чай?</li>\n<li>Ще ми помогнете ли?</li>\n<li>Ще затвориш ли вратата? (<code>kapatmak</code>)</li>\n<li>Ще дойдете ли утре?</li>\n</ol>\n<p><strong>Упр. 7.7 — Попълни с наречие: <code>her zaman</code>,\n<code>bazen</code>, <code>genellikle</code>, <code>hiç</code>.</strong>\n<em>(Zarfla tamamlayın: her zaman, bazen, genellikle, hiç.)</em></p>\n<ol type=\"1\">\n<li>Sabahları ___ kahve içerim.</li>\n<li>___ sinemaya gideriz, ama çok sık değil.</li>\n<li>O ___ sigara içmez.</li>\n<li>Pazar günü ___ evde kalırım.</li>\n</ol>\n<p><strong>Упр. 7.8 — Опиши навиците си (5 изречения в geniş\nzaman).</strong> <em>(Alışkanlıklarınızı anlatın (geniş zamanla beş\ncümle).)</em></p>\n<p><strong>Упр. 7.9 — Кое правило? Спрегни за <code>ben</code>.</strong>\n<em>(Hangi kural? „ben“ için çekimleyin.)</em></p>\n<ol type=\"1\">\n<li>yazmak</li>\n<li>çalışmak</li>\n<li>okumak</li>\n<li>gelmek</li>\n<li>görmek</li>\n<li>beklemek</li>\n<li>oturmak</li>\n<li>içmek</li>\n<li>almak</li>\n<li>bilmek</li>\n</ol>\n<p><strong>Упр. 7.10 — Пълна таблица за <code>bakmak</code>.</strong>\n<em>(„bakmak“ için tam tablo.)</em></p>\n<ol type=\"1\">\n<li>ben ___</li>\n<li>sen ___</li>\n<li>o ___</li>\n<li>biz ___</li>\n<li>siz ___</li>\n<li>onlar ___</li>\n</ol>\n<p><strong>Упр. 7.11 — Отрицателна форма (внимавай с 1 лице).</strong>\n<em>(Olumsuz biçim (birinci kişiye dikkat).)</em></p>\n<ol type=\"1\">\n<li>Gelirim.</li>\n<li>Çalışırsın.</li>\n<li>Okur.</li>\n<li>Bakarız.</li>\n<li>Yazarsınız.</li>\n<li>Giderler.</li>\n<li>Alırım.</li>\n<li>Biliriz.</li>\n</ol>\n<p><strong>Упр. 7.12 — Учтива молба с geniş zaman.</strong> <em>(Geniş\nzamanla kibar rica.)</em></p>\n<ol type=\"1\">\n<li>Ще затворите ли вратата?</li>\n<li>Ще ми помогнеш ли?</li>\n<li>Ще ми дадете ли водата?</li>\n<li>Ще пиеш ли чай?</li>\n<li>Ще дойдете ли утре?</li>\n<li>Ще ми кажете ли къде е гарата?</li>\n</ol>\n<p><strong>Упр. 7.13 — <code>-yor</code> или geniş zaman?</strong>\n<em>(-yor mu, geniş zaman mı?)</em></p>\n<ol type=\"1\">\n<li>Şu anda kitap (okumak) ___ .</li>\n<li>Her akşam kitap (okumak) ___ .</li>\n<li>Bu ay çok (çalışmak) ___ .</li>\n<li>O çok (çalışmak) ___ , tembel değil.</li>\n<li>Yarın kesinlikle (gelmek) ___ .</li>\n<li>Belki yarın (gelmek) ___ .</li>\n<li>Sigara (içmek) ___ , hiç sevmem.</li>\n<li>Şimdi ne (yapmak) ___ ?</li>\n</ol>\n<p><strong>Упр. 7.14 — Преведи на турски.</strong> <em>(Türkçeye\nçevirin.)</em></p>\n<ol type=\"1\">\n<li>Всяка сутрин пия чай.</li>\n<li>Не пуша.</li>\n<li>Водата кипи при сто градуса.</li>\n<li>Той е много работлив.</li>\n<li>Ще затворите ли прозореца?</li>\n<li>Обикновено ставам рано.</li>\n<li>Понякога ходя на кино.</li>\n<li>Никога не закъснявам.</li>\n</ol>\n<h3>Тематичен речник · Konu sözlüğü — Тяло и здраве · Vücut ve sağlık</h3><table><thead><tr><th>Türkçe</th><th>Български</th></tr></thead><tbody><tr><td>vücut</td><td>тяло</td></tr><tr><td>baş</td><td>глава</td></tr><tr><td>kafa</td><td>глава (разговорно)</td></tr><tr><td>yüz</td><td>лице</td></tr><tr><td>kulak</td><td>ухо</td></tr><tr><td>burun</td><td>нос</td></tr><tr><td>ağız</td><td>уста</td></tr><tr><td>diş</td><td>зъб</td></tr><tr><td>dil</td><td>език</td></tr><tr><td>boyun</td><td>врат</td></tr><tr><td>omuz</td><td>рамо</td></tr><tr><td>kol</td><td>ръка (от рамото)</td></tr><tr><td>el</td><td>ръка, длан</td></tr><tr><td>parmak</td><td>пръст</td></tr><tr><td>göğüs</td><td>гърди</td></tr><tr><td>karın</td><td>корем</td></tr><tr><td>sırt</td><td>гръб</td></tr><tr><td>bacak</td><td>крак</td></tr><tr><td>ayak</td><td>ходило</td></tr><tr><td>kalp</td><td>сърце</td></tr><tr><td>kan</td><td>кръв</td></tr><tr><td>sağlık</td><td>здраве</td></tr><tr><td>hasta</td><td>болен</td></tr><tr><td>hastalık</td><td>болест</td></tr><tr><td>ilaç</td><td>лекарство</td></tr><tr><td>ağrı</td><td>болка</td></tr><tr><td>öksürük</td><td>кашлица</td></tr><tr><td>saç</td><td>коса</td></tr></tbody></table><p><strong>Упр. 7.15 — Как е на турски?</strong> <em>(Türkçesi nedir?)</em></p><ol type=\"1\"><li>тяло</li><li>ухо</li><li>зъб</li><li>рамо</li><li>корем</li><li>сърце</li><li>болест</li><li>кашлица</li></ol><hr />\n<h2 id=\"урок-8-минало-време-dün-ne-yaptın\">УРОК 8 · Минало време — Dün\nne yaptın?</h2>\n<h3 id=\"речник-sözlük-6\">Речник · Sözlük</h3>\n<table>\n<thead>\n<tr class=\"header\">\n<th>Турски</th>\n<th>Български</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>dün</td>\n<td>вчера</td>\n</tr>\n<tr class=\"even\">\n<td>geçen hafta</td>\n<td>миналата седмица</td>\n</tr>\n<tr class=\"odd\">\n<td>geçen yıl</td>\n<td>миналата година</td>\n</tr>\n<tr class=\"even\">\n<td>önce</td>\n<td>преди</td>\n</tr>\n<tr class=\"odd\">\n<td>sonra</td>\n<td>после, след</td>\n</tr>\n<tr class=\"even\">\n<td>doğmak</td>\n<td>раждам се</td>\n</tr>\n<tr class=\"odd\">\n<td>bitirmek</td>\n<td>завършвам</td>\n</tr>\n<tr class=\"even\">\n<td>taşınmak</td>\n<td>местя се</td>\n</tr>\n<tr class=\"odd\">\n<td>tanışmak</td>\n<td>запознавам се</td>\n</tr>\n<tr class=\"even\">\n<td>başlamak</td>\n<td>започвам</td>\n</tr>\n<tr class=\"odd\">\n<td>unutmak</td>\n<td>забравям</td>\n</tr>\n<tr class=\"even\">\n<td>hatırlamak</td>\n<td>помня</td>\n</tr>\n<tr class=\"odd\">\n<td>kaybetmek</td>\n<td>губя</td>\n</tr>\n<tr class=\"even\">\n<td>bulmak</td>\n<td>намирам</td>\n</tr>\n<tr class=\"odd\">\n<td>hiç</td>\n<td>никак, изобщо</td>\n</tr>\n<tr class=\"even\">\n<td>çok</td>\n<td>много</td>\n</tr>\n<tr class=\"odd\">\n<td>az</td>\n<td>малко</td>\n</tr>\n<tr class=\"even\">\n<td>tatil</td>\n<td>ваканция, отпуск</td>\n</tr>\n<tr class=\"odd\">\n<td>deniz</td>\n<td>море</td>\n</tr>\n<tr class=\"even\">\n<td>dağ</td>\n<td>планина</td>\n</tr>\n</tbody>\n</table>\n<h3\nid=\"граматика-8.1-минало-определено-време--dı--di--du--dü-görülen-geçmiş-zaman\">Граматика\n8.1 — Минало определено време (-dı / -di / -du / -dü) · Görülen geçmiş\nzaman</h3>\n<p>Използва се за завършени действия, които говорещият сам е\nвидял/преживял.</p>\n<p><strong>След <code>ç, f, h, k, p, s, ş, t</code> → -tı / -ti / -tu /\n-tü.</strong></p>\n<p><strong>Спрежение (<code>gelmek</code> — идвам):</strong></p>\n<table>\n<tbody>\n<tr class=\"odd\">\n<td>ben gel<strong>dim</strong></td>\n<td>дойдох</td>\n</tr>\n<tr class=\"even\">\n<td>sen gel<strong>din</strong></td>\n<td>ти дойде</td>\n</tr>\n<tr class=\"odd\">\n<td>o gel<strong>di</strong></td>\n<td>той дойде</td>\n</tr>\n<tr class=\"even\">\n<td>biz gel<strong>dik</strong></td>\n<td>дойдохме</td>\n</tr>\n<tr class=\"odd\">\n<td>siz gel<strong>diniz</strong></td>\n<td>вие дойдохте</td>\n</tr>\n<tr class=\"even\">\n<td>onlar gel<strong>diler</strong></td>\n<td>те дойдоха</td>\n</tr>\n</tbody>\n</table>\n<p><strong>Още примери:</strong></p>\n<table>\n<thead>\n<tr class=\"header\">\n<th>Глагол</th>\n<th>ben-форма</th>\n<th>Превод</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>yazmak</td>\n<td>yaz<strong>dım</strong></td>\n<td>писах</td>\n</tr>\n<tr class=\"even\">\n<td>okumak</td>\n<td>oku<strong>dum</strong></td>\n<td>четох</td>\n</tr>\n<tr class=\"odd\">\n<td>görmek</td>\n<td>gör<strong>düm</strong></td>\n<td>видях</td>\n</tr>\n<tr class=\"even\">\n<td>çalışmak</td>\n<td>çalış<strong>tım</strong></td>\n<td>работих</td>\n</tr>\n<tr class=\"odd\">\n<td>gitmek</td>\n<td>git<strong>tim</strong></td>\n<td>отидох</td>\n</tr>\n<tr class=\"even\">\n<td>yapmak</td>\n<td>yap<strong>tım</strong></td>\n<td>направих</td>\n</tr>\n<tr class=\"odd\">\n<td>içmek</td>\n<td>iç<strong>tim</strong></td>\n<td>пих</td>\n</tr>\n</tbody>\n</table>\n<p><strong>Отрицание:</strong> корен + <code>-ma/-me</code> +\n<code>-dı</code>\n<code>gelmedim, gelmedin, gelmedi, gelmedik, gelmediniz, gelmediler</code></p>\n<p><strong>Въпрос:</strong> частицата стои след глагола\n<code>Geldin mi?</code> — Дойде ли? · <code>Gitmedi mi?</code> — Не\nотиде ли?</p>\n<h3\nid=\"граматика-8.2-минало-време-на-именното-сказуемо-isim-cümlesinde-geçmiş-zaman\">Граматика\n8.2 — Минало време на именното сказуемо · İsim cümlesinde geçmiş\nzaman</h3>\n<ul>\n<li>Ben öğrenci<strong>ydim</strong>. — Аз бях студент.</li>\n<li>O hasta<strong>ydı</strong>. — Той беше болен.</li>\n<li>Biz evde<strong>ydik</strong>. — Ние бяхме вкъщи.</li>\n<li>Hava güzel<strong>di</strong>. — Времето беше хубаво.</li>\n<li>Ben orada değil<strong>dim</strong>. — Аз не бях там.</li>\n<li><code>var</code> → <strong>vardı</strong> (имаше); <code>yok</code>\n→ <strong>yoktu</strong> (нямаше)</li>\n</ul>\n<h3\nid=\"граматика-8.3-съгласната-пред--dı--dı-önünde-ünsüz-benzeşmesi\">Граматика\n8.3 — Съгласната пред <code>-dı</code> · „-dı“ önünde ünsüz\nbenzeşmesi</h3>\n<p>Ако коренът завършва на <strong>ç, f, h, k, p, s, ş, t</strong>\n(„FıSTıKÇı ŞaHaP“), окончанието започва с <code>t</code>:</p>\n<table>\n<thead>\n<tr class=\"header\">\n<th>Корен на</th>\n<th>Окончание</th>\n<th>Пример</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>гласна или мека съгласна</td>\n<td>-dı/-di/-du/-dü</td>\n<td>geldi, okudu, gördü</td>\n</tr>\n<tr class=\"even\">\n<td>ç f h k p s ş t</td>\n<td>-tı/-ti/-tu/-tü</td>\n<td>gitti, yaptı, içti, çalıştı</td>\n</tr>\n</tbody>\n</table>\n<p>Примери: <code>git-</code> → git<strong>ti</strong> ·\n<code>yap-</code> → yap<strong>tı</strong> · <code>iç-</code> →\niç<strong>ti</strong> · <code>çalış-</code> → çalış<strong>tı</strong> ·\n<code>bak-</code> → bak<strong>tı</strong> · <code>konuş-</code> →\nkonuş<strong>tu</strong></p>\n<h3 id=\"граматика-8.4-пълна-таблица-tam-çekim-tablosu\">Граматика 8.4 —\nПълна таблица · Tam çekim tablosu</h3>\n<p><strong>gitmek (отивам):</strong></p>\n<table>\n<thead>\n<tr class=\"header\">\n<th>Лице</th>\n<th>+</th>\n<th>−</th>\n<th>?</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>ben</td>\n<td>gittim</td>\n<td>gitmedim</td>\n<td>gittim mi?</td>\n</tr>\n<tr class=\"even\">\n<td>sen</td>\n<td>gittin</td>\n<td>gitmedin</td>\n<td>gittin mi?</td>\n</tr>\n<tr class=\"odd\">\n<td>o</td>\n<td>gitti</td>\n<td>gitmedi</td>\n<td>gitti mi?</td>\n</tr>\n<tr class=\"even\">\n<td>biz</td>\n<td>gittik</td>\n<td>gitmedik</td>\n<td>gittik mi?</td>\n</tr>\n<tr class=\"odd\">\n<td>siz</td>\n<td>gittiniz</td>\n<td>gitmediniz</td>\n<td>gittiniz mi?</td>\n</tr>\n<tr class=\"even\">\n<td>onlar</td>\n<td>gittiler</td>\n<td>gitmediler</td>\n<td>gittiler mi?</td>\n</tr>\n</tbody>\n</table>\n<p><strong>Забележи:</strong> в отрицателната форма винаги е\n<code>-medi/-madı</code>, защото <code>-me/-ma</code> завършва на\nгласна.</p>\n<h3\nid=\"граматика-8.5-минало-време-на-именното-сказуемо-isim-cümlesinde-geçmiş-zaman\">Граматика\n8.5 — Минало време на именното сказуемо · İsim cümlesinde geçmiş\nzaman</h3>\n<p>Когато няма глагол, а прилагателно или съществително:</p>\n<table>\n<thead>\n<tr class=\"header\">\n<th>Сега</th>\n<th>Минало</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Ben öğrenciyim.</td>\n<td>Ben öğrenci<strong>ydim</strong>.</td>\n</tr>\n<tr class=\"even\">\n<td>Sen hastasın.</td>\n<td>Sen hasta<strong>ydın</strong>.</td>\n</tr>\n<tr class=\"odd\">\n<td>O yorgun.</td>\n<td>O yorgun<strong>du</strong>.</td>\n</tr>\n<tr class=\"even\">\n<td>Biz evdeyiz.</td>\n<td>Biz evde<strong>ydik</strong>.</td>\n</tr>\n<tr class=\"odd\">\n<td>Hava güzel.</td>\n<td>Hava güzel<strong>di</strong>.</td>\n</tr>\n<tr class=\"even\">\n<td>Var.</td>\n<td>Var<strong>dı</strong>. — Имаше.</td>\n</tr>\n<tr class=\"odd\">\n<td>Yok.</td>\n<td>Yok<strong>tu</strong>. — Нямаше.</td>\n</tr>\n</tbody>\n</table>\n<p><strong>Правило за <code>y</code>:</strong> ако думата завършва на\nгласна, се вмъква <code>y</code>: <code>öğrenci</code> →\nöğrenci<strong>ydi</strong>, <code>hasta</code> →\nhasta<strong>ydı</strong></p>\n<h3\nid=\"граматика-8.6-наречия-за-минало-време-geçmiş-zaman-zarfları\">Граматика\n8.6 — Наречия за минало време · Geçmiş zaman zarfları</h3>\n<div class=\"line-block\">dün | вчера | dün akşam — снощи |<br />\nönceki gün | завчера | |<br />\ngeçen hafta | миналата седмица | |<br />\ngeçen ay | миналия месец | |<br />\ngeçen yıl | миналата година | |<br />\nbir saat önce | преди един час | |<br />\niki gün önce | преди два дни | |<br />\nuzun zaman önce | отдавна | |<br />\naz önce / demin | току-що | |<br />\no zaman | тогава | |</div>\n<h3\nid=\"граматика-8.7-разказ-в-минало-време-geçmiş-zamanda-anlatım\">Граматика\n8.7 — Разказ в минало време · Geçmiş zamanda anlatım</h3>\n<p>Типичен разказ подрежда действията с връзки:</p>\n<ul>\n<li><strong>önce</strong> — първо · <strong>sonra</strong> — после ·\n<strong>daha sonra</strong> — по-късно</li>\n<li><strong>ondan sonra</strong> — след това · <strong>en\nsonunda</strong> — накрая</li>\n<li><strong>-dıktan sonra</strong> — след като <em>(по-напред в\nкурса)</em></li>\n</ul>\n<p>Пример: &gt; Dün sabah erken kalktım. <strong>Önce</strong> kahvaltı\nyaptım, <strong>sonra</strong> işe gittim. &gt; Öğlen arkadaşımla yemek\nyedim. <strong>Ondan sonra</strong> markete uğradım. &gt; <strong>En\nsonunda</strong> eve döndüm ve dinlendim.</p>\n<h3 id=\"защо-е-така-neden-böyle-7\">Защо е така · Neden böyle</h3>\n<p><strong>Защо се нарича „свидетелско“ (görülen geçmiş zaman)?</strong>\nЗащото го използваш за неща, които сам си видял или преживял. Турският\nправи разлика между „видях как стана“ и „чух, че е станало“:</p>\n<ul>\n<li><code>Ali geldi.</code> — Али дойде. <em>(бях там)</em></li>\n<li><code>Ali gelmiş.</code> — Али дошъл. <em>(казаха ми / разбрах\nпосле)</em></li>\n</ul>\n<p>Втората форма идва на ниво A2, но е добре да знаеш още отсега, че\nтази разлика съществува — тя няма аналог в българския освен преизказното\nнаклонение.</p>\n<p><strong>Защо <code>evdeydim</code>, а не\n<code>evdedim</code>?</strong> Между две гласни се вмъква\n<code>y</code>: <code>evde</code> завършва на гласна, окончанието\n<code>-idi</code> започва с гласна. Същият механизъм като при\n<code>öğrenciydim</code>, <code>hastaydı</code>.</p>\n<p><strong>Защо <code>yoktu</code>, а не <code>yokdu</code>?</strong>\n<code>yok</code> завършва на <code>k</code> — беззвучна съгласна от\n„FıSTıKÇı ŞaHaP“, затова <code>d</code> → <code>t</code>.</p>\n<h3 id=\"текст-за-четене-и-превод-okuma-ve-çeviri-metni-6\">Текст за\nчетене и превод · Okuma ve çeviri metni</h3>\n<p><strong>Tatilim — Моята ваканция</strong></p>\n<blockquote>\n<p>Geçen yaz ailemle tatile gittik. Antalya’ya uçakla gittik ve orada\nbir hafta kaldık. Otelimiz denize çok yakındı. Her sabah erken kalktık,\nkahvaltı yaptık ve sonra plaja indik. Denizde yüzdük, kumda oynadık.\nÖğleden sonra biraz dinlendik. Bir gün eski şehri gezdik, müzeye gittik\nve çok güzel fotoğraflar çektik. Akşamları lokantada yemek yedik.\nAntalya’nın yemekleri çok lezzetliydi. Hava hep güneşliydi, hiç yağmur\nyağmadı. Tatil çok güzeldi ama çabuk bitti. Gelecek yıl yine gitmek\nistiyoruz.</p>\n</blockquote>\n<p><em>Нови думи:</em> <code>uçakla</code> — със самолет;\n<code>yakın</code> — близо; <code>plaj</code> — плаж; <code>inmek</code>\n— слизам; <code>kum</code> — пясък; <code>oynamak</code> — играя;\n<code>dinlenmek</code> — почивам си; <code>gezmek</code> — разглеждам;\n<code>fotoğraf çekmek</code> — снимам; <code>lezzetli</code> — вкусен;\n<code>güneşli</code> — слънчево; <code>yağmur yağmak</code> — вали дъжд;\n<code>çabuk</code> — бързо; <code>gelecek yıl</code> — следващата\nгодина; <code>yine</code> — отново.</p>\n<p><strong>Въпроси:</strong></p>\n<ol type=\"1\">\n<li>Geçen yaz nereye gittiler?</li>\n<li>Orada ne kadar kaldılar?</li>\n<li>Sabahları ne yaptılar?</li>\n<li>Hava nasıldı?</li>\n</ol>\n<h3 id=\"упражнения-alıştırmalar-7\">Упражнения · Alıştırmalar</h3>\n<p><strong>Упр. 8.1 — Постави в минало време (ben).</strong> <em>(Geçmiş\nzamana çevirin (ben).)</em></p>\n<ol type=\"1\">\n<li>gelmek</li>\n<li>gitmek</li>\n<li>okumak</li>\n<li>yapmak</li>\n<li>görmek</li>\n<li>çalışmak</li>\n<li>içmek</li>\n<li>beklemek</li>\n</ol>\n<p><strong>Упр. 8.2 — Постави глагола в правилната форма.</strong>\n<em>(Fiili doğru biçimde yazın.)</em></p>\n<ol type=\"1\">\n<li>Dün sen nerede (olmak) ___ ?</li>\n<li>Biz sinemaya (gitmek) ___ .</li>\n<li>O bir kitap (okumak) ___ .</li>\n<li>Onlar geç (gelmek) ___ .</li>\n<li>Siz ne (yapmak) ___ ?</li>\n</ol>\n<p><strong>Упр. 8.3 — Направи отрицателни.</strong> <em>(Olumsuz\nyapın.)</em></p>\n<ol type=\"1\">\n<li>Geldim.</li>\n<li>Gördün.</li>\n<li>Çalıştı.</li>\n<li>Yaptık.</li>\n<li>Okudunuz.</li>\n</ol>\n<p><strong>Упр. 8.4 — Преведи на турски.</strong> <em>(Türkçeye\nçevirin.)</em></p>\n<ol type=\"1\">\n<li>Вчера отидох на училище.</li>\n<li>Не видях Али.</li>\n<li>Какво направи вчера?</li>\n<li>Времето беше хубаво.</li>\n<li>Бяхме вкъщи.</li>\n</ol>\n<h3 id=\"допълнителни-упражнения-ek-alıştırmalar-7\">Допълнителни\nупражнения · Ek alıştırmalar</h3>\n<p><strong>Упр. 8.5 — Постави в минало време.</strong> <em>(Geçmiş\nzamana çevirin.)</em></p>\n<ol type=\"1\">\n<li>Dün ne (yapmak, sen) ___ ?</li>\n<li>Geçen hafta Ankara’ya (gitmek, biz) ___ .</li>\n<li>O sabah erken (kalkmak) ___ .</li>\n<li>Onlar bizi (görmek) ___ mü?</li>\n<li>Siz o filmi (izlemek) ___ mü?</li>\n</ol>\n<p><strong>Упр. 8.6 — Преобразувай в минало време.</strong> <em>(Geçmiş\nzamana dönüştürün.)</em></p>\n<ol type=\"1\">\n<li>Okula gidiyorum.</li>\n<li>Kitap okuyorsun.</li>\n<li>Çay içiyor.</li>\n<li>Sinemaya gidiyoruz.</li>\n<li>Türkçe öğreniyorsunuz.</li>\n</ol>\n<p><strong>Упр. 8.7 — Именно сказуемо в минало време.</strong> <em>(İsim\ncümlesinin geçmiş zamanı.)</em></p>\n<ol type=\"1\">\n<li>Hava güzel ___ .</li>\n<li>Ben orada değil ___ .</li>\n<li>Biz çok yorgun ___ .</li>\n<li>Sınıfta kimse yok ___ .</li>\n<li>O zaman öğrenci ___ .</li>\n</ol>\n<p><strong>Упр. 8.8 — Разкажи какво прави вчера (6 изречения).</strong>\n<em>(Dün ne yaptığınızı anlatın (altı cümle).)</em></p>\n<p><strong>Упр. 8.9 — -dı или -tı? Спрегни за <code>ben</code>.</strong>\n<em>(-dı mı, -tı mı? „ben“ için çekimleyin.)</em></p>\n<ol type=\"1\">\n<li>gelmek</li>\n<li>gitmek</li>\n<li>yapmak</li>\n<li>içmek</li>\n<li>okumak</li>\n<li>çalışmak</li>\n<li>görmek</li>\n<li>bakmak</li>\n<li>konuşmak</li>\n<li>beklemek</li>\n</ol>\n<p><strong>Упр. 8.10 — Пълна таблица за <code>yazmak</code>.</strong>\n<em>(„yazmak“ için tam tablo.)</em></p>\n<ol type=\"1\">\n<li>ben ___</li>\n<li>sen ___</li>\n<li>o ___</li>\n<li>biz ___</li>\n<li>siz ___</li>\n<li>onlar ___</li>\n</ol>\n<p><strong>Упр. 8.11 — Преобразувай от сегашно в минало.</strong>\n<em>(Şimdiki zamandan geçmiş zamana çevirin.)</em></p>\n<ol type=\"1\">\n<li>Okula gidiyorum.</li>\n<li>Kitap okuyorsun.</li>\n<li>Çay içiyor.</li>\n<li>Sinemaya gidiyoruz.</li>\n<li>Türkçe öğreniyorsunuz.</li>\n<li>Erken kalkıyorlar.</li>\n<li>Ali’yi bekliyorum.</li>\n<li>Yemek yapıyorsun.</li>\n</ol>\n<p><strong>Упр. 8.12 — Именно сказуемо в минало време.</strong>\n<em>(İsim cümlesinin geçmiş zamanı.)</em></p>\n<ol type=\"1\">\n<li>Ben öğrenci___ .</li>\n<li>Sen hasta___ .</li>\n<li>O çok yorgun___ .</li>\n<li>Biz evde___ .</li>\n<li>Hava çok güzel___ .</li>\n<li>Sınıfta kimse yok___ .</li>\n<li>Masada iki kitap var___ .</li>\n<li>Siz orada değil___ .</li>\n</ol>\n<p><strong>Упр. 8.13 — Направи въпрос и отговори отрицателно.</strong>\n<em>(Soru sorun ve olumsuz cevap verin.)</em></p>\n<p>Пример: Geldin. → Geldin mi? — Hayır, gelmedim.</p>\n<ol type=\"1\">\n<li>Gittin.</li>\n<li>Gördü.</li>\n<li>Yaptık.</li>\n<li>Okudunuz.</li>\n<li>Çalıştılar.</li>\n</ol>\n<p><strong>Упр. 8.14 — Преведи на турски.</strong> <em>(Türkçeye\nçevirin.)</em></p>\n<ol type=\"1\">\n<li>Вчера отидох на училище.</li>\n<li>Не го видях.</li>\n<li>Какво направи снощи?</li>\n<li>Времето беше много хубаво.</li>\n<li>Бяхме уморени.</li>\n<li>В стаята нямаше никого.</li>\n<li>Преди два дни бях в Истанбул.</li>\n<li>Току-що дойдох.</li>\n</ol>\n<h3>Тематичен речник · Konu sözlüğü — Цветове · Renkler</h3><table><thead><tr><th>Türkçe</th><th>Български</th></tr></thead><tbody><tr><td>renk</td><td>цвят</td></tr><tr><td>beyaz</td><td>бял</td></tr><tr><td>ak</td><td>бял (поетично)</td></tr><tr><td>siyah</td><td>черен</td></tr><tr><td>kara</td><td>черен (поетично)</td></tr><tr><td>kırmızı</td><td>червен</td></tr><tr><td>mavi</td><td>син</td></tr><tr><td>sarı</td><td>жълт</td></tr><tr><td>yeşil</td><td>зелен</td></tr><tr><td>turuncu</td><td>оранжев</td></tr><tr><td>pembe</td><td>розов</td></tr><tr><td>mor</td><td>лилав</td></tr><tr><td>kahverengi</td><td>кафяв</td></tr><tr><td>gri</td><td>сив</td></tr></tbody></table><p><strong>Упр. 8.16 — Как е на турски?</strong> <em>(Türkçesi nedir?)</em></p><ol type=\"1\"><li>цвят</li><li>червен</li><li>жълт</li><li>оранжев</li><li>лилав</li><li>кафяв</li></ol><h3>Тематичен речник · Konu sözlüğü — Основни прилагателни · Temel sıfatlar</h3><table><thead><tr><th>Türkçe</th><th>Български</th></tr></thead><tbody><tr><td>çirkin</td><td>грозен</td></tr><tr><td>şişman</td><td>дебел</td></tr><tr><td>zayıf</td><td>слаб</td></tr><tr><td>zengin</td><td>богат</td></tr><tr><td>fakir</td><td>беден</td></tr><tr><td>yoksul</td><td>беден, нуждаещ се</td></tr><tr><td>üzgün</td><td>тъжен</td></tr><tr><td>tok</td><td>сит</td></tr><tr><td>susuz</td><td>жаден, без вода</td></tr><tr><td>kirli</td><td>мръсен</td></tr><tr><td>dolu</td><td>пълен</td></tr><tr><td>boş</td><td>празен</td></tr><tr><td>hızlı</td><td>бърз</td></tr><tr><td>yavaş</td><td>бавен</td></tr><tr><td>sessiz</td><td>тих</td></tr><tr><td>gürültülü</td><td>шумен</td></tr><tr><td>önemli</td><td>важен</td></tr><tr><td>aynı</td><td>същият</td></tr><tr><td>farklı</td><td>различен</td></tr><tr><td>ilk</td><td>първи, начален</td></tr><tr><td>son</td><td>последен</td></tr><tr><td>geniş</td><td>широк</td></tr><tr><td>ılık</td><td>хладък, топличък</td></tr><tr><td>açık</td><td>светъл; отворен</td></tr><tr><td>koyu</td><td>тъмен (за цвят)</td></tr></tbody></table><p><strong>Упр. 8.15 — Как е на турски?</strong> <em>(Türkçesi nedir?)</em></p><ol type=\"1\"><li>грозен</li><li>богат</li><li>тъжен</li><li>сит</li><li>празен</li><li>шумен</li><li>различен</li><li>последен</li></ol><hr />\n<h2 id=\"урок-9-бъдеще-време-yarın-ne-yapacaksın\">УРОК 9 · Бъдеще време —\nYarın ne yapacaksın?</h2>\n<h3 id=\"речник-sözlük-7\">Речник · Sözlük</h3>\n<table>\n<thead>\n<tr class=\"header\">\n<th>Турски</th>\n<th>Български</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>yarın</td>\n<td>утре</td>\n</tr>\n<tr class=\"even\">\n<td>öbür gün</td>\n<td>вдругиден</td>\n</tr>\n<tr class=\"odd\">\n<td>gelecek hafta</td>\n<td>следващата седмица</td>\n</tr>\n<tr class=\"even\">\n<td>gelecek ay</td>\n<td>следващият месец</td>\n</tr>\n<tr class=\"odd\">\n<td>ileride</td>\n<td>в бъдеще</td>\n</tr>\n<tr class=\"even\">\n<td>plan</td>\n<td>план</td>\n</tr>\n<tr class=\"odd\">\n<td>toplantı</td>\n<td>среща, събрание</td>\n</tr>\n<tr class=\"even\">\n<td>randevu</td>\n<td>час, среща (уговорена)</td>\n</tr>\n<tr class=\"odd\">\n<td>seyahat</td>\n<td>пътуване</td>\n</tr>\n<tr class=\"even\">\n<td>bilet</td>\n<td>билет</td>\n</tr>\n<tr class=\"odd\">\n<td>rezervasyon</td>\n<td>резервация</td>\n</tr>\n<tr class=\"even\">\n<td>hazırlanmak</td>\n<td>подготвям се</td>\n</tr>\n<tr class=\"odd\">\n<td>taşınmak</td>\n<td>местя се</td>\n</tr>\n<tr class=\"even\">\n<td>evlenmek</td>\n<td>женя се</td>\n</tr>\n<tr class=\"odd\">\n<td>mezun olmak</td>\n<td>завършвам (учебно заведение)</td>\n</tr>\n<tr class=\"even\">\n<td>belki</td>\n<td>може би</td>\n</tr>\n<tr class=\"odd\">\n<td>kesinlikle</td>\n<td>със сигурност</td>\n</tr>\n</tbody>\n</table>\n<h3 id=\"граматика-9.1-бъдеще-време--acak--ecek-gelecek-zaman\">Граматика\n9.1 — Бъдеще време: -acak / -ecek · Gelecek zaman</h3>\n<p><strong>След гласна се вмъква -y-:</strong> <code>bekle-</code> →\n<code>bekleyecek</code>, <code>oku-</code> → <code>okuyacak</code>.</p>\n<p><strong>Внимание при 1 лице:</strong> <code>k</code> → <code>ğ</code>\n(защото след него идва гласна).</p>\n<p><strong>Спрежение (<code>gelmek</code>):</strong></p>\n<table>\n<tbody>\n<tr class=\"odd\">\n<td>ben gel<strong>eceğim</strong></td>\n<td>ще дойда</td>\n</tr>\n<tr class=\"even\">\n<td>sen gel<strong>eceksin</strong></td>\n<td>ще дойдеш</td>\n</tr>\n<tr class=\"odd\">\n<td>o gel<strong>ecek</strong></td>\n<td>ще дойде</td>\n</tr>\n<tr class=\"even\">\n<td>biz gel<strong>eceğiz</strong></td>\n<td>ще дойдем</td>\n</tr>\n<tr class=\"odd\">\n<td>siz gel<strong>eceksiniz</strong></td>\n<td>ще дойдете</td>\n</tr>\n<tr class=\"even\">\n<td>onlar gel<strong>ecekler</strong></td>\n<td>ще дойдат</td>\n</tr>\n</tbody>\n</table>\n<p><strong>С дебели гласни (<code>yapmak</code>):</strong>\n<code>yapacağım, yapacaksın, yapacak, yapacağız, yapacaksınız, yapacaklar</code></p>\n<p><strong>Отрицание:</strong> корен + <code>-ma/-me</code> +\n<code>-y</code> + <code>acak/ecek</code>\n<code>gelmeyeceğim, gelmeyeceksin, gelmeyecek, gelmeyeceğiz, gelmeyeceksiniz, gelmeyecekler</code>\n<code>yapmayacağım, yapmayacaksın, yapmayacak...</code></p>\n<p><strong>Въпрос:</strong> <code>Gelecek misin?</code> — Ще дойдеш ли?\n· <code>Yapmayacak mısınız?</code> — Няма ли да направите?</p>\n<h3\nid=\"граматика-9.2-разговорни-съкращения-konuşma-dilinde-kısalmalar\">Граматика\n9.2 — Разговорни съкращения · Konuşma dilinde kısalmalar</h3>\n<p>В говоримия език често се чува: <code>geleceğim</code> →\n<strong>gelicem</strong>, <code>yapacağım</code> →\n<strong>yapıcam</strong>, <code>gideceğiz</code> →\n<strong>gidicez</strong>. В писмения език пиши пълната форма.</p>\n<h3 id=\"граматика-9.3-защо-k-става-ğ-k-neden-ğ-olur\">Граматика 9.3 —\nЗащо <code>k</code> става <code>ğ</code> · „k“ neden „ğ“ olur</h3>\n<p>Окончанието е <code>-acak/-ecek</code>. Когато след него идва гласна\n(при <code>ben</code> и <code>biz</code>), крайното <code>k</code> се\nсмекчава на <code>ğ</code>:</p>\n<div class=\"line-block\">gelecek + im | gelece<strong>ğ</strong>im\n|<br />\ngelecek + iz | gelece<strong>ğ</strong>iz |<br />\nyapacak + ım | yapaca<strong>ğ</strong>ım |<br />\nyapacak + ız | yapaca<strong>ğ</strong>ız |</div>\n<p>При останалите лица окончанието започва със съгласна, затова\n<code>k</code> остава:\n<code>geleceksin, gelecek, geleceksiniz, gelecekler</code></p>\n<h3 id=\"граматика-9.4-вмъкване-на-y-kaynaştırma-harfi-y\">Граматика 9.4 —\nВмъкване на <code>y</code> · Kaynaştırma harfi „y“</h3>\n<p>Ако коренът завършва на гласна, се вмъква <code>y</code>:</p>\n<div class=\"line-block\">bekle- | bekle<strong>y</strong>eceğim |<br />\noku- | oku<strong>y</strong>acağım |<br />\nbaşla- | başla<strong>y</strong>acağım |<br />\nyürü- | yürü<strong>y</strong>eceğim |</div>\n<p>Същото при отрицанието — <code>-ma/-me</code> завършва на гласна:\n<code>gelmeyeceğim</code>, <code>yapmayacağım</code>,\n<code>okumayacağım</code></p>\n<h3 id=\"граматика-9.5-пълна-таблица-tam-çekim-tablosu\">Граматика 9.5 —\nПълна таблица · Tam çekim tablosu</h3>\n<p><strong>yapmak (правя):</strong></p>\n<table>\n<thead>\n<tr class=\"header\">\n<th>Лице</th>\n<th>+</th>\n<th>−</th>\n<th>?</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>ben</td>\n<td>yapacağım</td>\n<td>yapmayacağım</td>\n<td>yapacak mıyım?</td>\n</tr>\n<tr class=\"even\">\n<td>sen</td>\n<td>yapacaksın</td>\n<td>yapmayacaksın</td>\n<td>yapacak mısın?</td>\n</tr>\n<tr class=\"odd\">\n<td>o</td>\n<td>yapacak</td>\n<td>yapmayacak</td>\n<td>yapacak mı?</td>\n</tr>\n<tr class=\"even\">\n<td>biz</td>\n<td>yapacağız</td>\n<td>yapmayacağız</td>\n<td>yapacak mıyız?</td>\n</tr>\n<tr class=\"odd\">\n<td>siz</td>\n<td>yapacaksınız</td>\n<td>yapmayacaksınız</td>\n<td>yapacak mısınız?</td>\n</tr>\n<tr class=\"even\">\n<td>onlar</td>\n<td>yapacaklar</td>\n<td>yapmayacaklar</td>\n<td>yapacaklar mı?</td>\n</tr>\n</tbody>\n</table>\n<h3\nid=\"граматика-9.6-бъдеще-срещу--yor-за-бъдещето-gelecek-zaman-ve-şimdiki-zaman\">Граматика\n9.6 — Бъдеще срещу <code>-yor</code> за бъдещето · Gelecek zaman ve\nşimdiki zaman</h3>\n<table>\n<colgroup>\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th>Форма</th>\n<th>Кога</th>\n<th>Пример</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>-yor</td>\n<td>уговорено, сигурно, близко</td>\n<td>Yarın geliyorum. — Утре идвам (уговорено).</td>\n</tr>\n<tr class=\"even\">\n<td>-acak</td>\n<td>план, обещание, прогноза</td>\n<td>Yarın geleceğim. — Ще дойда утре.</td>\n</tr>\n<tr class=\"odd\">\n<td>geniş</td>\n<td>възможност, вежливост</td>\n<td>Yarın gelirim. — Може и да дойда утре.</td>\n</tr>\n</tbody>\n</table>\n<p><strong>Прогноза за времето — винаги <code>-acak</code>:</strong> -\nYarın hava yağmurlu olacak. — Утре ще е дъждовно. - Hafta sonu kar\nyağacak. — През уикенда ще вали сняг.</p>\n<h3\nid=\"граматика-9.7-изрази-за-бъдеще-време-gelecek-zaman-ifadeleri\">Граматика\n9.7 — Изрази за бъдеще време · Gelecek zaman ifadeleri</h
