_ .</li>\n<li>Çok güzel___ .</li>\n<li>Orada kimse yok___ .</li>\n<li>Masada iki kitap var___ .</li>\n</ol>\n<p><strong>Упр. 11.4 — Комбинирай с другите времена.</strong> <em>(Diğer\nzamanlarla birleştirin.)</em></p>\n<ol type=\"1\">\n<li>geliyor + mış (o)</li>\n<li>gelecek + miş (o)</li>\n<li>gelir + miş (o)</li>\n<li>çalışıyor + muş (sen)</li>\n<li>yapacak + mış (onlar)</li>\n</ol>\n<p><strong>Упр. 11.5 — Направи отрицателни.</strong> <em>(Olumsuz\nyapın.)</em></p>\n<ol type=\"1\">\n<li>Gelmiş.</li>\n<li>Yapmışsın.</li>\n<li>Gitmişler.</li>\n<li>Okumuşum.</li>\n<li>Görmüşüz.</li>\n</ol>\n<p><strong>Упр. 11.6 — Преведи на турски.</strong> <em>(Türkçeye\nçevirin.)</em></p>\n<ol type=\"1\">\n<li>Али бил дошъл вчера.</li>\n<li>Валяло е.</li>\n<li>Забравил съм ключа.</li>\n<li>Казват, че щял да дойде утре.</li>\n<li>Оказва се, че си бил прав.</li>\n<li>Имало едно време.</li>\n<li>Айше се била оженила.</li>\n<li>Едно време много пушел.</li>\n</ol>\n<hr />\n<h2 id=\"урок-12-дължимост-и-необходимост-gereklilik\">УРОК 12 · Дължимост\nи необходимост · Gereklilik</h2>\n<h3 id=\"речник-sözlük-10\">Речник · Sözlük</h3>\n<table>\n<thead>\n<tr class=\"header\">\n<th>Турски</th>\n<th>Български</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>lazım</td>\n<td>нужно, необходимо</td>\n</tr>\n<tr class=\"even\">\n<td>gerek / gerekmek</td>\n<td>трябва</td>\n</tr>\n<tr class=\"odd\">\n<td>zorunda</td>\n<td>принуден съм</td>\n</tr>\n<tr class=\"even\">\n<td>mecbur</td>\n<td>длъжен</td>\n</tr>\n<tr class=\"odd\">\n<td>şart</td>\n<td>условие; задължително</td>\n</tr>\n<tr class=\"even\">\n<td>izin</td>\n<td>разрешение</td>\n</tr>\n<tr class=\"odd\">\n<td>kural</td>\n<td>правило</td>\n</tr>\n<tr class=\"even\">\n<td>yasak</td>\n<td>забранено</td>\n</tr>\n<tr class=\"odd\">\n<td>serbest</td>\n<td>свободно, позволено</td>\n</tr>\n<tr class=\"even\">\n<td>dikkat etmek</td>\n<td>внимавам</td>\n</tr>\n<tr class=\"odd\">\n<td>acele etmek</td>\n<td>бързам</td>\n</tr>\n<tr class=\"even\">\n<td>karar vermek</td>\n<td>решавам</td>\n</tr>\n<tr class=\"odd\">\n<td>söz vermek</td>\n<td>обещавам</td>\n</tr>\n<tr class=\"even\">\n<td>yardım etmek</td>\n<td>помагам</td>\n</tr>\n<tr class=\"odd\">\n<td>dinlenmek</td>\n<td>почивам си</td>\n</tr>\n<tr class=\"even\">\n<td>erken</td>\n<td>рано</td>\n</tr>\n<tr class=\"odd\">\n<td>geç</td>\n<td>късно</td>\n</tr>\n<tr class=\"even\">\n<td>hemen</td>\n<td>веднага</td>\n</tr>\n<tr class=\"odd\">\n<td>mutlaka</td>\n<td>непременно</td>\n</tr>\n<tr class=\"even\">\n<td>en azından</td>\n<td>поне</td>\n</tr>\n</tbody>\n</table>\n<h3 id=\"граматика-12.1--malı--meli-трябва\">Граматика 12.1 —\n<code>-malı / -meli</code> (трябва)</h3>\n<p>Най-прекият начин да кажеш „трябва“:</p>\n<p><strong>Корен + -malı / -meli + лично окончание</strong></p>\n<table>\n<thead>\n<tr class=\"header\">\n<th>Лице</th>\n<th>gitmek</th>\n<th>çalışmak</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>ben</td>\n<td>git<strong>meliyim</strong></td>\n<td>çalış<strong>malıyım</strong></td>\n</tr>\n<tr class=\"even\">\n<td>sen</td>\n<td>git<strong>melisin</strong></td>\n<td>çalış<strong>malısın</strong></td>\n</tr>\n<tr class=\"odd\">\n<td>o</td>\n<td>git<strong>meli</strong></td>\n<td>çalış<strong>malı</strong></td>\n</tr>\n<tr class=\"even\">\n<td>biz</td>\n<td>git<strong>meliyiz</strong></td>\n<td>çalış<strong>malıyız</strong></td>\n</tr>\n<tr class=\"odd\">\n<td>siz</td>\n<td>git<strong>melisiniz</strong></td>\n<td>çalış<strong>malısınız</strong></td>\n</tr>\n<tr class=\"even\">\n<td>onlar</td>\n<td>git<strong>meliler</strong></td>\n<td>çalış<strong>malılar</strong></td>\n</tr>\n</tbody>\n</table>\n<p><strong>Отрицание:</strong> корен + <code>-ma/-me</code> +\n<code>-malı</code> <code>gitmemeliyim</code> — не трябва да ходя\n<code>yapmamalısın</code> — не трябва да правиш</p>\n<p><strong>Въпрос:</strong> <code>Gitmeli miyim?</code> — Трябва ли да\nотида?</p>\n<p>Примери: - Daha çok çalışmalıyım. — Трябва да работя повече. - Erken\nyatmalısın. — Трябва да си лягаш рано. - Sigara içmemelisin. — Не трябва\nда пушиш. - Ne yapmalıyım? — Какво трябва да направя?</p>\n<h3 id=\"граматика-12.2-lazım-и-gerek-нужно-е\">Граматика 12.2 —\n<code>lazım</code> и <code>gerek</code> (нужно е)</h3>\n<p>По-меки от <code>-malı</code>. Строят се с отглаголно име на\n<code>-mak/-mek</code> или <code>-ma/-me</code>:</p>\n<table>\n<thead>\n<tr class=\"header\">\n<th>Форма</th>\n<th>Пример</th>\n<th>Превод</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td><strong>-mak lazım</strong> (общо)</td>\n<td>Çalışmak lazım.</td>\n<td>Трябва да се работи.</td>\n</tr>\n<tr class=\"even\">\n<td><strong>-mam lazım</strong> (лично)</td>\n<td>Gitmem lazım.</td>\n<td>Трябва да отида.</td>\n</tr>\n<tr class=\"odd\">\n<td><strong>-man gerek</strong></td>\n<td>Dinlenmen gerek.</td>\n<td>Трябва да си починеш.</td>\n</tr>\n</tbody>\n</table>\n<p><strong>Личните форми на отглаголното име:</strong></p>\n<div class=\"line-block\">ben | gitme<strong>m</strong> lazım | трябва да\nотида |<br />\nsen | gitme<strong>n</strong> lazım | трябва да отидеш |<br />\no | gitme<strong>si</strong> lazım | трябва да отиде |<br />\nbiz | gitme<strong>miz</strong> lazım | трябва да отидем |<br />\nsiz | gitme<strong>niz</strong> lazım | трябва да отидете |<br />\nonlar | gitme<strong>leri</strong> lazım | трябва да отидат |</div>\n<p><code>gerek</code> работи по същия начин: <code>gitmem gerek</code>,\n<code>gitmen gerek</code>…</p>\n<p><strong>Минало време:</strong> <code>Gitmem lazımdı.</code> —\nТрябваше да отида.</p>\n<h3 id=\"граматика-12.3-zorunda-mecbur-принуден-съм\">Граматика 12.3 —\n<code>zorunda / mecbur</code> (принуден съм)</h3>\n<p>По-силно от „трябва“ — означава външна принуда, няма избор:</p>\n<table>\n<colgroup>\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th>Форма</th>\n<th>Пример</th>\n<th>Превод</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td><strong>-mak zorunda</strong></td>\n<td>Çalışmak zorundayım.</td>\n<td>Принуден съм да работя.</td>\n</tr>\n<tr class=\"even\">\n<td><strong>-mak zorunda kalmak</strong></td>\n<td>Gitmek zorunda kaldım.</td>\n<td>Наложи ми се да отида.</td>\n</tr>\n<tr class=\"odd\">\n<td><strong>mecburum</strong></td>\n<td>Gitmeye mecburum.</td>\n<td>Длъжен съм да отида.</td>\n</tr>\n</tbody>\n</table>\n<div class=\"line-block\">ben | gitmek zorunda<strong>yım</strong> |<br />\nsen | gitmek zorunda<strong>sın</strong> |<br />\no | gitmek zorunda |<br />\nbiz | gitmek zorunda<strong>yız</strong> |<br />\nsiz | gitmek zorunda<strong>sınız</strong> |<br />\nonlar | gitmek zorunda<strong>lar</strong> |</div>\n<p><strong>Отрицание:</strong> <code>gitmek zorunda değilim</code> — не\nсъм длъжен да отида</p>\n<h3 id=\"граматика-12.4-степени-на-задължение\">Граматика 12.4 — Степени\nна задължение</h3>\n<p>Подредени от най-мека към най-силна:</p>\n<table>\n<thead>\n<tr class=\"header\">\n<th>Форма</th>\n<th>Пример</th>\n<th>Оттенък</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>iyi olur</td>\n<td>Gitsen iyi olur.</td>\n<td>би било добре да отидеш</td>\n</tr>\n<tr class=\"even\">\n<td>lazım / gerek</td>\n<td>Gitmen lazım.</td>\n<td>нужно е</td>\n</tr>\n<tr class=\"odd\">\n<td>-malı</td>\n<td>Gitmelisin.</td>\n<td>трябва</td>\n</tr>\n<tr class=\"even\">\n<td>zorunda</td>\n<td>Gitmek zorundasın.</td>\n<td>принуден си, няма избор</td>\n</tr>\n<tr class=\"odd\">\n<td>şart</td>\n<td>Gitmen şart.</td>\n<td>задължително е</td>\n</tr>\n</tbody>\n</table>\n<h3 id=\"граматика-12.5-разрешение-и-забрана\">Граматика 12.5 — Разрешение\nи забрана</h3>\n<table>\n<colgroup>\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th>Форма</th>\n<th>Пример</th>\n<th>Превод</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>-abilir miyim?</td>\n<td>Girebilir miyim?</td>\n<td>Може ли да вляза?</td>\n</tr>\n<tr class=\"even\">\n<td>serbest</td>\n<td>Burada park etmek serbest.</td>\n<td>Тук е позволено да се паркира.</td>\n</tr>\n<tr class=\"odd\">\n<td>yasak</td>\n<td>Sigara içmek yasak.</td>\n<td>Пушенето е забранено.</td>\n</tr>\n<tr class=\"even\">\n<td>izin var / yok</td>\n<td>Girmeye izin yok.</td>\n<td>Няма разрешение за влизане.</td>\n</tr>\n<tr class=\"odd\">\n<td>-mayın</td>\n<td>Girmeyin!</td>\n<td>Не влизайте!</td>\n</tr>\n</tbody>\n</table>\n<p>Разговорни отговори: - Olur. — Може. - Olmaz. — Не може. - Tabii. —\nРазбира се.</p>\n<h3 id=\"защо-е-така-neden-böyle-11\">Защо е така · Neden böyle</h3>\n<p><strong>Защо има толкова начини да се каже „трябва“?</strong> Защото\nтурският различава <strong>вътрешна</strong> и <strong>външна</strong>\nнеобходимост, а българският не:</p>\n<ul>\n<li><code>Çalışmalıyım</code> — трябва да работя (аз преценявам, че е\nредно)</li>\n<li><code>Çalışmam lazım</code> — нужно ми е да работя (обстоятелствата\nго налагат)</li>\n<li><code>Çalışmak zorundayım</code> — принуден съм (нямам избор, иначе\nпоследствия)</li>\n</ul>\n<p>Ако кажеш <code>zorunda</code> за нещо доброволно, звучи все едно се\nоплакваш.</p>\n<p><strong>Защо <code>gitmem lazım</code>, а не\n<code>gitmek lazım</code> за „аз трябва“?</strong>\n<code>gitmek lazım</code> е безлично — „трябва да се ходи“, изобщо. За\nда кажеш кой трябва, превръщаш глагола в съществително с притежание:\n<code>gitme-m</code> е буквално „моето отиване“. Тоест: „моето отиване е\nнужно“.</p>\n<p><strong>Защо <code>-malı</code> съдържа <code>-ma</code>, което иначе\nе отрицание?</strong> Съвпадение — това са различни окончания с еднакъв\nвид. Затова отрицателната форма изглежда странно с два пъти\n<code>me</code>: <code>gitmemeliyim</code> = git + me (отрицание) + meli\n(дължимост). Свикваш бързо.</p>\n<h3 id=\"текст-за-четене-и-превод-okuma-ve-çeviri-metni-10\">Текст за\nчетене и превод · Okuma ve çeviri metni</h3>\n<p><strong>Doktorda — При лекаря</strong></p>\n<blockquote>\n<p>— Şikâyetiniz nedir?</p>\n<p>— Son zamanlarda çok yorgunum. Sabahları zor kalkıyorum.</p>\n<p>— Günde kaç saat uyuyorsunuz?</p>\n<p>— Beş, altı saat kadar. Çok işim var, geç yatmak zorunda\nkalıyorum.</p>\n<p>— En azından yedi saat uyumalısınız. Vücudun dinlenmeye ihtiyacı\nvar.</p>\n<p>— Biliyorum ama yapamıyorum.</p>\n<p>— Kahve içiyor musunuz?</p>\n<p>— Günde beş, altı fincan.</p>\n<p>— Bu çok fazla. Akşamları kesinlikle kahve içmemelisiniz. Ayrıca\nbiraz spor yapmanız lazım. Haftada üç kere yürüyüş yeterli olur.</p>\n<p>— Peki, deneyeceğim.</p>\n<p>— Bir de kan tahlili yaptırmanız gerek. Sonuçlara göre tekrar\nkonuşuruz.</p>\n</blockquote>\n<p><em>Нови думи:</em> <code>şikâyet</code> — оплакване;\n<code>son zamanlarda</code> — напоследък; <code>vücut</code> — тяло;\n<code>ihtiyaç</code> — нужда; <code>fincan</code> — чашка;\n<code>ayrıca</code> — освен това; <code>yürüyüş</code> — разходка пеша;\n<code>yeterli</code> — достатъчен; <code>denemek</code> — опитвам;\n<code>kan tahlili</code> — кръвно изследване; <code>sonuç</code> —\nрезултат; <code>-e göre</code> — според.</p>\n<p><strong>Въпроси:</strong></p>\n<ol type=\"1\">\n<li>Hasta neden yorgun?</li>\n<li>Günde kaç saat uyuması lazım?</li>\n<li>Ne içmemeli?</li>\n<li>Doktor başka ne tavsiye ediyor?</li>\n</ol>\n<h3 id=\"упражнения-alıştırmalar-11\">Упражнения · Alıştırmalar</h3>\n<p><strong>Упр. 12.1 — Постави в <code>-malı / -meli</code>.</strong>\n<em>(-malı/-meli ile yazın.)</em></p>\n<ol type=\"1\">\n<li>gitmek (ben)</li>\n<li>çalışmak (sen)</li>\n<li>dinlenmek (o)</li>\n<li>beklemek (biz)</li>\n<li>yapmak (siz)</li>\n<li>gelmek (onlar)</li>\n</ol>\n<p><strong>Упр. 12.2 — Направи отрицателни.</strong> <em>(Olumsuz\nyapın.)</em></p>\n<ol type=\"1\">\n<li>Gitmeliyim.</li>\n<li>Yapmalısın.</li>\n<li>İçmeli.</li>\n<li>Beklemeliyiz.</li>\n<li>Konuşmalısınız.</li>\n</ol>\n<p><strong>Упр. 12.3 — Преобразувай с <code>lazım</code>.</strong>\n<em>(„lazım“ ile yazın.)</em></p>\n<p>Пример: Gitmeliyim. → Gitmem lazım.</p>\n<ol type=\"1\">\n<li>Çalışmalısın.</li>\n<li>Dinlenmeli.</li>\n<li>Beklemeliyiz.</li>\n<li>Gitmelisiniz.</li>\n<li>Yapmalıyım.</li>\n</ol>\n<p><strong>Упр. 12.4 — <code>-malı</code>, <code>lazım</code> или\n<code>zorunda</code>?</strong> <em>(Hangisi uygun?)</em></p>\n<ol type=\"1\">\n<li>Sağlık için spor ___ . (редно е)</li>\n<li>Param yok, çalışmak ___ . (нямам избор)</li>\n<li>Erken yatmak ___ . (нужно е)</li>\n<li>Sigara içmek ___ . (не бива)</li>\n<li>Yarın sınav var, ders çalışmak ___ . (нямам избор)</li>\n</ol>\n<p><strong>Упр. 12.5 — Разрешено или забранено?</strong> <em>(Serbest\nmi, yasak mı?)</em></p>\n<ol type=\"1\">\n<li>Може ли да вляза?</li>\n<li>Пушенето е забранено.</li>\n<li>Тук е позволено да се паркира.</li>\n<li>Не влизайте!</li>\n<li>Може ли да седна тук?</li>\n</ol>\n<p><strong>Упр. 12.6 — Преведи на турски.</strong> <em>(Türkçeye\nçevirin.)</em></p>\n<ol type=\"1\">\n<li>Трябва да работя повече.</li>\n<li>Не трябва да пушиш.</li>\n<li>Трябва да отида.</li>\n<li>Принуден съм да работя.</li>\n<li>Не съм длъжен да отида.</li>\n<li>Какво трябва да направя?</li>\n<li>Трябва да си починеш.</li>\n<li>Наложи ми се да отида.</li>\n</ol>\n<hr />\n<h2 id=\"урок-13-условно-наклонение-şart-kipi\">УРОК 13 · Условно\nнаклонение · Şart kipi</h2>\n<h3 id=\"речник-sözlük-11\">Речник · Sözlük</h3>\n<table>\n<thead>\n<tr class=\"header\">\n<th>Турски</th>\n<th>Български</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>eğer</td>\n<td>ако</td>\n</tr>\n<tr class=\"even\">\n<td>şayet</td>\n<td>ако (книжовно)</td>\n</tr>\n<tr class=\"odd\">\n<td>keşke</td>\n<td>де да, дано беше</td>\n</tr>\n<tr class=\"even\">\n<td>belki</td>\n<td>може би</td>\n</tr>\n<tr class=\"odd\">\n<td>yoksa</td>\n<td>иначе</td>\n</tr>\n<tr class=\"even\">\n<td>aksi takdirde</td>\n<td>в противен случай</td>\n</tr>\n<tr class=\"odd\">\n<td>durum</td>\n<td>положение</td>\n</tr>\n<tr class=\"even\">\n<td>ihtimal</td>\n<td>вероятност</td>\n</tr>\n<tr class=\"odd\">\n<td>fırsat</td>\n<td>възможност, шанс</td>\n</tr>\n<tr class=\"even\">\n<td>şans</td>\n<td>късмет</td>\n</tr>\n<tr class=\"odd\">\n<td>kazanmak</td>\n<td>печеля</td>\n</tr>\n<tr class=\"even\">\n<td>kaybetmek</td>\n<td>губя</td>\n</tr>\n<tr class=\"odd\">\n<td>başarmak</td>\n<td>успявам</td>\n</tr>\n<tr class=\"even\">\n<td>denemek</td>\n<td>опитвам</td>\n</tr>\n<tr class=\"odd\">\n<td>pişman olmak</td>\n<td>съжалявам</td>\n</tr>\n<tr class=\"even\">\n<td>yardımcı olmak</td>\n<td>помагам</td>\n</tr>\n<tr class=\"odd\">\n<td>müsait</td>\n<td>свободен, разполагаем</td>\n</tr>\n<tr class=\"even\">\n<td>meşgul</td>\n<td>зает</td>\n</tr>\n<tr class=\"odd\">\n<td>hazır</td>\n<td>готов</td>\n</tr>\n<tr class=\"even\">\n<td>emin</td>\n<td>сигурен</td>\n</tr>\n</tbody>\n</table>\n<h3 id=\"граматика-13.1-реално-условие--sa--se\">Граматика 13.1 — Реално\nусловие (-sa / -se)</h3>\n<p>За неща, които реално могат да се случат. Обикновено се превежда с\n„ако“:</p>\n<p><strong>Корен + време + -sa / -se + лично окончание</strong></p>\n<table>\n<thead>\n<tr class=\"header\">\n<th>Лице</th>\n<th>gelmek</th>\n<th>Превод</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>ben</td>\n<td>gelir<strong>sem</strong></td>\n<td>ако дойда</td>\n</tr>\n<tr class=\"even\">\n<td>sen</td>\n<td>gelir<strong>sen</strong></td>\n<td>ако дойдеш</td>\n</tr>\n<tr class=\"odd\">\n<td>o</td>\n<td>gelir<strong>se</strong></td>\n<td>ако дойде</td>\n</tr>\n<tr class=\"even\">\n<td>biz</td>\n<td>gelir<strong>sek</strong></td>\n<td>ако дойдем</td>\n</tr>\n<tr class=\"odd\">\n<td>siz</td>\n<td>gelir<strong>seniz</strong></td>\n<td>ако дойдете</td>\n</tr>\n<tr class=\"even\">\n<td>onlar</td>\n<td>gelir<strong>lerse</strong></td>\n<td>ако дойдат</td>\n</tr>\n</tbody>\n</table>\n<p><strong>Забележи:</strong> условието се лепи <strong>след</strong>\nвремето, не за голия корен:</p>\n<table>\n<thead>\n<tr class=\"header\">\n<th>Време</th>\n<th>Условна форма</th>\n<th>Превод</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>geniş</td>\n<td>gelir<strong>se</strong></td>\n<td>ако дойде (обикновено)</td>\n</tr>\n<tr class=\"even\">\n<td>-yor</td>\n<td>geliyor<strong>sa</strong></td>\n<td>ако идва (сега)</td>\n</tr>\n<tr class=\"odd\">\n<td>-dı</td>\n<td>geldi<strong>yse</strong></td>\n<td>ако е дошъл</td>\n</tr>\n<tr class=\"even\">\n<td>-mış</td>\n<td>gelmiş<strong>se</strong></td>\n<td>ако е дошъл (казват)</td>\n</tr>\n<tr class=\"odd\">\n<td>-acak</td>\n<td>gelecek<strong>se</strong></td>\n<td>ако ще дойде</td>\n</tr>\n</tbody>\n</table>\n<p><strong>Отрицание:</strong> <code>gelmezse</code> (ако не дойде),\n<code>gelmiyorsa</code> (ако не идва)</p>\n<p>Примери: - Yarın gelirsen, birlikte yemek yeriz. — Ако дойдеш утре,\nще ядем заедно. - Param olursa, yeni bir araba alacağım. — Ако имам\nпари, ще си купя нова кола. - Yağmur yağarsa, evde kalırız. — Ако вали,\nще си останем вкъщи. - Müsaitsen, seni arayayım. — Ако си свободен, да\nти звънна.</p>\n<p><strong><code>eğer</code> не е задължително</strong> — окончанието\n<code>-se</code> вече казва „ако“. <code>eğer</code> само подсилва:\n<code>Eğer gelirsen…</code> = <code>Gelirsen…</code></p>\n<h3 id=\"граматика-13.2-нереално-условие--saydı--seydi\">Граматика 13.2 —\nНереално условие (-saydı / -seydi)</h3>\n<p>За неща, които НЕ са се случили — съжаление или хипотеза:</p>\n<table>\n<thead>\n<tr class=\"header\">\n<th>Форма</th>\n<th>Пример</th>\n<th>Превод</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>-saydı</td>\n<td>Gelseydin, görürdün.</td>\n<td>Ако беше дошъл, щеше да видиш.</td>\n</tr>\n<tr class=\"even\">\n<td>-saydım</td>\n<td>Param olsaydı, alırdım.</td>\n<td>Ако имах пари, щях да купя.</td>\n</tr>\n</tbody>\n</table>\n<p><strong>Главното изречение е в <code>-ırdı / -erdi</code></strong>\n(geniş zaman в минало):</p>\n<table>\n<thead>\n<tr class=\"header\">\n<th>Лице</th>\n<th>Условие</th>\n<th>Резултат</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>ben</td>\n<td>gelseydim</td>\n<td>görürdüm</td>\n</tr>\n<tr class=\"even\">\n<td>sen</td>\n<td>gelseydin</td>\n<td>görürdün</td>\n</tr>\n<tr class=\"odd\">\n<td>o</td>\n<td>gelseydi</td>\n<td>görürdü</td>\n</tr>\n<tr class=\"even\">\n<td>biz</td>\n<td>gelseydik</td>\n<td>görürdük</td>\n</tr>\n<tr class=\"odd\">\n<td>siz</td>\n<td>gelseydiniz</td>\n<td>görürdünüz</td>\n</tr>\n<tr class=\"even\">\n<td>onlar</td>\n<td>gelselerdi</td>\n<td>görürlerdi</td>\n</tr>\n</tbody>\n</table>\n<p>Примери: - Erken kalksaydım, treni kaçırmazdım. — Ако бях станал\nрано, нямаше да изпусна влака. - Zengin olsaydım, dünyayı gezerdim. —\nАко бях богат, щях да обиколя света. - Beni dinleseydin, bu olmazdı. —\nАко ме беше послушал, това нямаше да стане.</p>\n<h3 id=\"граматика-13.3-keşke-де-да\">Граматика 13.3 — <code>keşke</code>\n(де да)</h3>\n<p>Изразява съжаление или желание:</p>\n<ul>\n<li>Keşke gelseydin. — Де да беше дошъл.</li>\n<li>Keşke param olsa. — Де да имах пари.</li>\n<li>Keşke bunu yapmasaydım. — Де да не бях правил това.</li>\n<li>Keşke daha çok çalışsaydım. — Де да бях учил повече.</li>\n</ul>\n<h3 id=\"граматика-13.4-условие-с-именно-сказуемо\">Граматика 13.4 —\nУсловие с именно сказуемо</h3>\n<table>\n<thead>\n<tr class=\"header\">\n<th>Форма</th>\n<th>Пример</th>\n<th>Превод</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>-ysa / -yse</td>\n<td>Hastaysan, evde kal.</td>\n<td>Ако си болен, остани вкъщи.</td>\n</tr>\n<tr class=\"even\">\n<td></td>\n<td>Müsaitseniz, konuşalım.</td>\n<td>Ако сте свободни, да поговорим.</td>\n</tr>\n<tr class=\"odd\">\n<td></td>\n<td>Varsa, söyle.</td>\n<td>Ако има, кажи.</td>\n</tr>\n<tr class=\"even\">\n<td></td>\n<td>Yoksa, alalım.</td>\n<td>Ако няма, да купим.</td>\n</tr>\n</tbody>\n</table>\n<h3 id=\"граматика-13.5-полезни-условни-изрази\">Граматика 13.5 — Полезни\nусловни изрази</h3>\n<div class=\"line-block\">İstersen | ако искаш |<br />\nİstersen gidelim. | Ако искаш, да тръгваме. |<br />\nOlursa | ако стане |<br />\nMümkünse | ако е възможно |<br />\nGerekirse | ако се наложи |<br />\nYoksa | иначе |<br />\nAcele et, yoksa geç kalacaksın. | Бързай, иначе ще закъснееш. |<br />\nne olursa olsun | каквото и да става |<br />\nkim olursa olsun | който и да е |</div>\n<h3 id=\"защо-е-така-neden-böyle-12\">Защо е така · Neden böyle</h3>\n<p><strong>Защо условието се лепи след времето?</strong> Защото турската\nдума се строи отвътре навън: първо казваш <em>какво</em> действие\n(корен), после <em>кога</em> (време), после <em>при какво условие</em>\n(<code>-se</code>), накрая <em>кой</em> (лице). <code>gel-ir-se-n</code>\n= „идване-обикновено-ако-ти“. Редът никога не се мени.</p>\n<p><strong>Каква е разликата между <code>gelirse</code> и\n<code>geliyorsa</code>?</strong> - <code>Gelirse</code> — ако дойде (в\nбъдеще, все още не е ясно) - <code>Geliyorsa</code> — ако идва (сега, в\nмомента, проверявам факт)</p>\n<p>Второто често значи „ако е вярно, че…“:\n<code>Hasta**ysa**, doktora gitsin.</code> — Ако е болен (както казват),\nнека иде на лекар.</p>\n<p><strong>Защо резултатът при нереалното условие е в\n<code>-ırdı</code>?</strong> Защото <code>-ırdı</code> е „щеше да“ —\ngeniş zaman, преместено в миналото. Логиката е: „при други обстоятелства\nтова би било обичайното развитие“. Английският прави същото с\n<em>would</em>, българският — с „щеше да“.</p>\n<p><strong>Внимание с <code>-sa</code> без време — това е отделно\nнаклонение:</strong></p>\n<table>\n<colgroup>\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th>Форма</th>\n<th>Име</th>\n<th>Значение</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>gel<strong>ir</strong>se</td>\n<td>реално условие <em>(şart)</em></td>\n<td>ако дойде</td>\n</tr>\n<tr class=\"even\">\n<td>gel<strong>se</strong></td>\n<td>желателно-условно <em>(dilek-şart)</em></td>\n<td>да дойдеше, ако би дошъл</td>\n</tr>\n</tbody>\n</table>\n<p><code>gelse</code> изразява желание или отдалечена хипотеза, често с\n<code>keşke</code>: - Keşke gelse. — Де да дойдеше. - Bir gelse de\nkonuşsak. — Ех, да дойдеше, че да си поговорим.</p>\n<p>За обикновено условие в бъдещето <strong>винаги слагай\nвреме</strong>: <code>gelirse</code>, <code>gelecekse</code>. Това е\nчест източник на грешки, защото в българския и двете се превеждат с\n„ако“.</p>\n<h3 id=\"текст-за-четене-и-превод-okuma-ve-çeviri-metni-11\">Текст за\nчетене и превод · Okuma ve çeviri metni</h3>\n<p><strong>Hafta sonu planı — План за уикенда</strong></p>\n<blockquote>\n<p>— Hafta sonu ne yapıyorsun?</p>\n<p>— Henüz bilmiyorum. Hava güzel olursa, dağa gitmek istiyorum.</p>\n<p>— Yağmur yağarsa ne yapacaksın?</p>\n<p>— O zaman evde kalırım, film izlerim. Ama hava tutarsa kesinlikle\nçıkarım.</p>\n<p>— İstersen ben de gelirim. Uzun zamandır doğaya çıkmadım.</p>\n<p>— Tabii, çok iyi olur! Sabah erken kalkabilirsen, saat yedide yola\nçıkalım.</p>\n<p>— Yedi biraz erken ama olur. Keşke geçen hafta da gitseydik, hava\nharikaydı.</p>\n<p>— Biliyorum, ama işim vardı. Neyse, bu hafta telafi ederiz.</p>\n<p>— Bir şey lazım olursa haber ver. Yiyecek ben getirebilirim.</p>\n<p>— Süper. Sen sandviç yaparsan, ben termosla çay getiririm.</p>\n</blockquote>\n<p><em>Нови думи:</em> <code>henüz</code> — още;\n<code>hava tutmak</code> — времето се задържа; <code>doğa</code> —\nприрода; <code>yola çıkmak</code> — тръгвам на път; <code>harika</code>\n— прекрасен; <code>telafi etmek</code> — наваксвам;\n<code>haber vermek</code> — уведомявам; <code>yiyecek</code> — храна;\n<code>termos</code> — термос.</p>\n<p><strong>Въпроси:</strong></p>\n<ol type=\"1\">\n<li>Hava güzel olursa ne yapacak?</li>\n<li>Yağmur yağarsa ne yapacak?</li>\n<li>Saat kaçta yola çıkacaklar?</li>\n<li>Kim ne getirecek?</li>\n</ol>\n<h3 id=\"упражнения-alıştırmalar-12\">Упражнения · Alıştırmalar</h3>\n<p><strong>Упр. 13.1 — Постави в условна форма (geniş zaman +\n-se).</strong> <em>(Şart kipine çevirin.)</em></p>\n<ol type=\"1\">\n<li>gelmek (sen)</li>\n<li>yapmak (o)</li>\n<li>çalışmak (ben)</li>\n<li>gitmek (biz)</li>\n<li>olmak (o)</li>\n<li>istemek (sen)</li>\n</ol>\n<p><strong>Упр. 13.2 — Свържи условието с резултата.</strong>\n<em>(Şartla sonucu eşleştirin.)</em></p>\n<ol type=\"1\">\n<li>Yağmur yağarsa,</li>\n<li>Param olursa,</li>\n<li>Erken kalkarsan,</li>\n<li>Hasta olursan,</li>\n<li>Vaktim olursa,</li>\n</ol>\n<p>а) doktora git. б) evde kalırız. в) sana yardım ederim. г) yeni bir\naraba alacağım. д) treni kaçırmazsın.</p>\n<p><strong>Упр. 13.3 — Нереално условие.</strong> <em>(Gerçek dışı\nşart.)</em></p>\n<p>Пример: gelmek (sen) / görmek (sen) → Gelseydin, görürdün.</p>\n<ol type=\"1\">\n<li>erken kalkmak (ben) / treni kaçırmamak (ben)</li>\n<li>zengin olmak (ben) / dünyayı gezmek (ben)</li>\n<li>beni dinlemek (sen) / bu olmamak</li>\n<li>çalışmak (o) / kazanmak (o)</li>\n</ol>\n<p><strong>Упр. 13.4 — Попълни с <code>keşke</code>.</strong>\n<em>(„keşke“ ile tamamlayın.)</em></p>\n<ol type=\"1\">\n<li>___ gelseydin.</li>\n<li>___ param olsa.</li>\n<li>___ bunu yapmasaydım.</li>\n<li>___ daha çok çalışsaydım.</li>\n</ol>\n<p><strong>Упр. 13.5 — Условие с именно сказуемо.</strong> <em>(İsim\ncümlesiyle şart.)</em></p>\n<ol type=\"1\">\n<li>Hasta___ , evde kal.</li>\n<li>Müsait___ , konuşalım.</li>\n<li>Var___ , söyle.</li>\n<li>Yok___ , alalım.</li>\n<li>Meşgul___ , sonra ararım.</li>\n</ol>\n<p><strong>Упр. 13.6 — Преведи на турски.</strong> <em>(Türkçeye\nçevirin.)</em></p>\n<ol type=\"1\">\n<li>Ако дойдеш утре, ще ядем заедно.</li>\n<li>Ако вали, ще си останем вкъщи.</li>\n<li>Ако имах пари, щях да купя.</li>\n<li>Де да беше дошъл.</li>\n<li>Ако искаш, да тръгваме.</li>\n<li>Бързай, иначе ще закъснееш.</li>\n<li>Ако си болен, остани вкъщи.</li>\n<li>Ако бях станал рано, нямаше да изпусна влака.</li>\n</ol>\n<hr />\n<h2 id=\"урок-14-степенуване-и-сравнение-karşılaştırma\">УРОК 14 ·\nСтепенуване и сравнение · Karşılaştırma</h2>\n<h3 id=\"речник-sözlük-12\">Речник · Sözlük</h3>\n<table>\n<thead>\n<tr class=\"header\">\n<th>Турски</th>\n<th>Български</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>daha</td>\n<td>по-</td>\n</tr>\n<tr class=\"even\">\n<td>en</td>\n<td>най-</td>\n</tr>\n<tr class=\"odd\">\n<td>kadar</td>\n<td>колкото; до</td>\n</tr>\n<tr class=\"even\">\n<td>gibi</td>\n<td>като</td>\n</tr>\n<tr class=\"odd\">\n<td>aynı</td>\n<td>същият</td>\n</tr>\n<tr class=\"even\">\n<td>farklı</td>\n<td>различен</td>\n</tr>\n<tr class=\"odd\">\n<td>benzer</td>\n<td>подобен</td>\n</tr>\n<tr class=\"even\">\n<td>fark</td>\n<td>разлика</td>\n</tr>\n<tr class=\"odd\">\n<td>çoğu</td>\n<td>повечето</td>\n</tr>\n<tr class=\"even\">\n<td>birkaç</td>\n<td>няколко</td>\n</tr>\n<tr class=\"odd\">\n<td>hepsi</td>\n<td>всички</td>\n</tr>\n<tr class=\"even\">\n<td>hiçbiri</td>\n<td>нито един</td>\n</tr>\n<tr class=\"odd\">\n<td>bazıları</td>\n<td>някои</td>\n</tr>\n<tr class=\"even\">\n<td>daha az</td>\n<td>по-малко</td>\n</tr>\n<tr class=\"odd\">\n<td>daha çok</td>\n<td>повече</td>\n</tr>\n<tr class=\"even\">\n<td>en az</td>\n<td>най-малко</td>\n</tr>\n<tr class=\"odd\">\n<td>en çok</td>\n<td>най-много</td>\n</tr>\n<tr class=\"even\">\n<td>yüksek / alçak</td>\n<td>висок / нисък</td>\n</tr>\n<tr class=\"odd\">\n<td>ağır / hafif</td>\n<td>тежък / лек</td>\n</tr>\n<tr class=\"even\">\n<td>hızlı / yavaş</td>\n<td>бърз / бавен</td>\n</tr>\n</tbody>\n</table>\n<h3 id=\"граматика-14.1-сравнителна-степен-daha\">Граматика 14.1 —\nСравнителна степен: <code>daha</code></h3>\n<p>Слага се <strong>пред</strong> прилагателното, точно както\nбългарското „по-“:</p>\n<table>\n<thead>\n<tr class=\"header\">\n<th>Основна</th>\n<th>Сравнителна</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>büyük</td>\n<td><strong>daha</strong> büyük — по-голям</td>\n</tr>\n<tr class=\"even\">\n<td>güzel</td>\n<td><strong>daha</strong> güzel — по-красив</td>\n</tr>\n<tr class=\"odd\">\n<td>iyi</td>\n<td><strong>daha</strong> iyi — по-добър</td>\n</tr>\n<tr class=\"even\">\n<td>çok</td>\n<td><strong>daha</strong> çok — повече</td>\n</tr>\n</tbody>\n</table>\n<p><strong>Обектът на сравнение отива в изходен падеж\n(-dan/-den):</strong></p>\n<ul>\n<li>Ali, Ahmet’<strong>ten</strong> daha uzun. — Али е по-висок от\nАхмет.</li>\n<li>Bu ev, o ev<strong>den</strong> daha büyük. — Тази къща е по-голяма\nот онази.</li>\n<li>Ben sen<strong>den</strong> daha çok çalışıyorum. — Работя повече от\nтеб.</li>\n</ul>\n<p><strong><code>daha</code> може да се изпусне</strong> — изходният\nпадеж вече казва „по-“: <code>Ali, Ahmet'ten uzun.</code> = Али е\nпо-висок от Ахмет.</p>\n<h3 id=\"граматика-14.2-превъзходна-степен-en\">Граматика 14.2 —\nПревъзходна степен: <code>en</code></h3>\n<table>\n<thead>\n<tr class=\"header\">\n<th>Основна</th>\n<th>Превъзходна</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>büyük</td>\n<td><strong>en</strong> büyük — най-голям</td>\n</tr>\n<tr class=\"even\">\n<td>güzel</td>\n<td><strong>en</strong> güzel — най-красив</td>\n</tr>\n<tr class=\"odd\">\n<td>iyi</td>\n<td><strong>en</strong> iyi — най-добър</td>\n</tr>\n</tbody>\n</table>\n<p>Групата, в която сравняваш, е в местен падеж (<code>-da/-de</code>)\nили родителен:</p>\n<ul>\n<li>Sınıf<strong>ta</strong> en iyi öğrenci. — Най-добрият ученик в\nкласа.</li>\n<li>Dünya<strong>nın</strong> en yüksek dağı. — Най-високата планина в\nсвета.</li>\n<li>Bu, en güzel<strong>i</strong>. — Това е най-хубавото.</li>\n</ul>\n<h3 id=\"граматика-14.3-равенство-kadar\">Граматика 14.3 — Равенство:\n<code>kadar</code></h3>\n<p>Означава „колкото“, „като“:</p>\n<ul>\n<li>Ben sen<strong>in kadar</strong> çalışıyorum. — Работя колкото\nтеб.</li>\n<li>O, kardeşi <strong>kadar</strong> uzun. — Той е висок колкото брат\nси.</li>\n<li>Bu <strong>kadar</strong> yeter. — Толкова стига.</li>\n</ul>\n<p><strong>При местоименията — родителен падеж:</strong>\n<code>benim kadar</code>, <code>senin kadar</code>,\n<code>onun kadar</code>, <code>bizim kadar</code>,\n<code>sizin kadar</code>, <code>onlar kadar</code></p>\n<p><strong>При съществителните — основна форма:</strong>\n<code>Ali kadar</code> (колкото Али), <code>bir çocuk kadar</code>\n(колкото дете), <code>ev kadar</code> (голям колкото къща) — не\n<del>Ali’nin kadar</del>.</p>\n<p><strong>Отрицание:</strong> <code>O kadar iyi değil.</code> — Не е\nчак толкова добър.</p>\n<h3 id=\"граматика-14.4-прилика-gibi\">Граматика 14.4 — Прилика:\n<code>gibi</code></h3>\n<ul>\n<li>Baban <strong>gibi</strong> konuşuyorsun. — Говориш като баща\nси.</li>\n<li>Kar <strong>gibi</strong> beyaz. — Бял като сняг.</li>\n<li>Benim <strong>gibi</strong> düşünüyor. — Мисли като мен.</li>\n<li>Ne <strong>gibi</strong>? — Като какво? / Например?</li>\n</ul>\n<p><strong>Разлика <code>kadar</code> / <code>gibi</code>:</strong> -\n<code>senin kadar</code> — колкото теб (по количество, степен) -\n<code>senin gibi</code> — като теб (по начин, вид)</p>\n<h3 id=\"граматика-14.5-усилване-и-отслабване\">Граматика 14.5 — Усилване\nи отслабване</h3>\n<table>\n<thead>\n<tr class=\"header\">\n<th>Дума</th>\n<th>Значение</th>\n<th>Пример</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>çok</td>\n<td>много</td>\n<td>çok güzel</td>\n</tr>\n<tr class=\"even\">\n<td>pek</td>\n<td>доста, много</td>\n<td>pek iyi değil</td>\n</tr>\n<tr class=\"odd\">\n<td>oldukça</td>\n<td>доста</td>\n<td>oldukça büyük</td>\n</tr>\n<tr class=\"even\">\n<td>epey</td>\n<td>доста</td>\n<td>epey pahalı</td>\n</tr>\n<tr class=\"odd\">\n<td>biraz</td>\n<td>малко</td>\n<td>biraz yorgunum</td>\n</tr>\n<tr class=\"even\">\n<td>az</td>\n<td>малко</td>\n<td>az tuzlu</td>\n</tr>\n<tr class=\"odd\">\n<td>fazla</td>\n<td>прекалено</td>\n<td>fazla tuzlu</td>\n</tr>\n<tr class=\"even\">\n<td>en az</td>\n<td>поне</td>\n<td>en az beş kişi</td>\n</tr>\n<tr class=\"odd\">\n<td>neredeyse</td>\n<td>почти</td>\n<td>neredeyse bitti</td>\n</tr>\n<tr class=\"even\">\n<td>tam</td>\n<td>точно</td>\n<td>tam üç saat</td>\n</tr>\n</tbody>\n</table>\n<p><strong>Удвояване за усилване</strong> — типично турско: -\n<code>büyük büyük evler</code> — големи-преголеми къщи -\n<code>yavaş yavaş</code> — полека-лека - <code>tek tek</code> — един по\nедин - <code>bazı bazı</code> — от време на време</p>\n<h3 id=\"граматика-14.6-неправилни-сравнения\">Граматика 14.6 — Неправилни\nсравнения</h3>\n<p>Няколко думи менят формата си:</p>\n<div class=\"line-block\">iyi (добър) | daha iyi | en iyi |<br />\nkötü (лош) | daha kötü | en kötü |<br />\nçok (много) | daha çok / daha fazla | en çok / en fazla |<br />\naz (малко) | daha az | en az |</div>\n<p>Няма истински неправилни форми като английското\n<em>good–better–best</em> — турският винаги ползва <code>daha</code> и\n<code>en</code>.</p>\n<h3 id=\"граматика-14.7-полезни-изрази-за-сравнение\">Граматика 14.7 —\nПолезни изрази за сравнение</h3>\n<div class=\"line-block\">…-e göre | според, спрямо | Geçen yıla göre daha\niyi. |<br />\n…-e kıyasla | в сравнение с | Ona kıyasla ben şanslıyım. |<br />\n…-in aksine | за разлика от | Senin aksine ben erken kalkarım. |<br />\naynı … gibi | точно като | Aynı babası gibi. |<br />\n…den farklı | различен от | Bu ondan farklı. |<br />\nile aynı | същият като | Seninkiyle aynı. |</div>\n<h3 id=\"защо-е-така-neden-böyle-13\">Защо е така · Neden böyle</h3>\n<p><strong>Защо сравнението иска изходен падеж?</strong> Защото турският\nмисли за сравнението като за <strong>отправна точка</strong>:\n<code>Ahmet'ten uzun</code> буквално е „висок, тръгвайки от Ахмет“ —\nАхмет е нивото, от което мериш нагоре. Същото прави и латинският, и\nруският („выше меня“).</p>\n<p><strong>Защо <code>daha</code> може да се изпусне, а <code>en</code>\n— не?</strong> Защото изходният падеж сам по себе си вече значи\nсравнение. При превъзходната степен няма такъв сигнал — без\n<code>en</code> изречението просто описва.</p>\n<p><strong>Защо <code>senin kadar</code>, а не\n<code>seni kadar</code>?</strong> <code>kadar</code> е следлог, който\nиска родителен падеж при местоименията: буквално „в размера на твоето“.\nПри съществителните обаче се ползва основната форма:\n<code>kardeşi kadar</code> (колкото брат си), не <del>kardeşinin\nkadar</del>.</p>\n<p><strong>Защо турският удвоява думи?</strong> Това е жив, продуктивен\nмеханизъм за усилване или „разпръскване“ на значението:\n<code>yavaş yavaş</code> (все по-бавно, полека), <code>ev ev</code>\n(къща по къща), <code>kırmızı kırmızı</code> (червено-червено).\nБългарският го прави рядко („тихо-тихо“), турският — постоянно.</p>\n<h3 id=\"текст-за-четене-и-превод-okuma-ve-çeviri-metni-12\">Текст за\nчетене и превод · Okuma ve çeviri metni</h3>\n<p><strong>İki şehir — Два града</strong></p>\n<blockquote>\n<p>İstanbul ile Ankara Türkiye’nin en büyük iki şehri. İstanbul,\nAnkara’dan çok daha kalabalık — nüfusu neredeyse iki katı. Ama Ankara\nbaşkent ve devlet kurumlarının çoğu orada.</p>\n<p>İstanbul denize yakın, bu yüzden havası Ankara’ya göre daha nemli ve\nılıman. Ankara ise iç kesimde, kışları çok daha soğuk ve kuru geçer.</p>\n<p>Yaşam açısından İstanbul daha hareketli ama aynı zamanda daha pahalı\nve yorucu. Trafiği ülkenin en kötüsü. Ankara daha sakin, ulaşımı daha\nkolay, kiralar daha ucuz.</p>\n<p>Hangisi daha iyi? Bu tamamen kişiye bağlı. Deniz, tarih ve\nhareketlilik istiyorsanız İstanbul; huzur ve düzen istiyorsanız Ankara\nsizin için daha uygun olabilir.</p>\n</blockquote>\n<p><em>Нови думи:</em> <code>kalabalık</code> — многолюден;\n<code>nüfus</code> — население; <code>kat</code> — път (кратност);\n<code>başkent</code> — столица; <code>kurum</code> — институция;\n<code>nemli</code> — влажен; <code>ılıman</code> — умерен;\n<code>iç kesim</code> — вътрешност; <code>kuru</code> — сух;\n<code>açısından</code> — от гледна точка на; <code>hareketli</code> —\nоживен; <code>yorucu</code> — изморителен; <code>ulaşım</code> —\nтранспорт; <code>kira</code> — наем; <code>bağlı</code> — зависи от;\n<code>huzur</code> — спокойствие; <code>düzen</code> — ред;\n<code>uygun</code> — подходящ.</p>\n<p><strong>Въпроси:</strong></p>\n<ol type=\"1\">\n<li>Hangi şehir daha kalabalık?</li>\n<li>Ankara’nın kışları nasıl geçer?</li>\n<li>İstanbul’un en kötü yanı ne?</li>\n<li>Ankara’da ne daha ucuz?</li>\n</ol>\n<h3 id=\"упражнения-alıştırmalar-13\">Упражнения · Alıştırmalar</h3>\n<p><strong>Упр. 14.1 — Направи сравнителна степен.</strong>\n<em>(Karşılaştırma yapın.)</em></p>\n<p>Пример: Ali / Ahmet / uzun → Ali, Ahmet’ten daha uzun.</p>\n<ol type=\"1\">\n<li>bu ev / o ev / büyük</li>\n<li>İstanbul / Ankara / kalabalık</li>\n<li>ben / sen / genç</li>\n<li>tren / otobüs / hızlı</li>\n<li>bu kitap / o kitap / ilginç</li>\n</ol>\n<p><strong>Упр. 14.2 — Направи превъзходна степен.</strong> <em>(En\nüstünlük derecesi yapın.)</em></p>\n<ol type=\"1\">\n<li>sınıf / iyi öğrenci</li>\n<li>dünya / yüksek dağ</li>\n<li>Türkiye / büyük şehir</li>\n<li>aile / küçük çocuk</li>\n</ol>\n<p><strong>Упр. 14.3 — <code>kadar</code> или\n<code>gibi</code>?</strong> <em>(„kadar“ mı, „gibi“ mi?)</em></p>\n<ol type=\"1\">\n<li>Ben senin ___ çalışıyorum. (колкото теб)</li>\n<li>Baban ___ konuşuyorsun. (като баща си)</li>\n<li>Kar ___ beyaz. (като сняг)</li>\n<li>O, kardeşi ___ uzun. (колкото брат си)</li>\n<li>Benim ___ düşünüyor. (като мен)</li>\n</ol>\n<p><strong>Упр. 14.4 — Попълни с подходяща дума за степен.</strong>\n<em>(Uygun derece kelimesini yazın.)</em></p>\n<p>Избери: çok · biraz · fazla · neredeyse · en az</p>\n<ol type=\"1\">\n<li>___ yorgunum, biraz dinleneyim. (малко)</li>\n<li>Bu çorba ___ tuzlu, içemiyorum. (прекалено)</li>\n<li>Film ___ bitti. (почти)</li>\n<li>Toplantıda ___ on kişi vardı. (поне)</li>\n<li>Bu manzara ___ güzel. (много)</li>\n</ol>\n<p><strong>Упр. 14.5 — Преведи изразите за сравнение.</strong>\n<em>(Karşılaştırma ifadelerini çevirin.)</em></p>\n<ol type=\"1\">\n<li>в сравнение с миналата година</li>\n<li>за разлика от теб</li>\n<li>точно като баща си</li>\n<li>различен от този</li>\n<li>същият като твоя</li>\n</ol>\n<p><strong>Упр. 14.6 — Преведи на турски.</strong> <em>(Türkçeye\nçevirin.)</em></p>\n<ol type=\"1\">\n<li>Али е по-висок от Ахмет.</li>\n<li>Това е най-хубавото.</li>\n<li>Работя колкото теб.</li>\n<li>Говориш като баща си.</li>\n<li>Тази къща е по-голяма от онази.</li>\n<li>Най-високата планина в света.</li>\n<li>Не е чак толкова добър.</li>\n<li>Влакът е по-бърз от автобуса.</li>\n</ol>\n<hr />\n<h2 id=\"урок-15-следлози-edatlar\">УРОК 15 · Следлози · Edatlar</h2>\n<h3 id=\"речник-sözlük-13\">Речник · Sözlük</h3>\n<table>\n<thead>\n<tr class=\"header\">\n<th>Турски</th>\n<th>Български</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>ile</td>\n<td>с</td>\n</tr>\n<tr class=\"even\">\n<td>için</td>\n<td>за</td>\n</tr>\n<tr class=\"odd\">\n<td>gibi</td>\n<td>като</td>\n</tr>\n<tr class=\"even\">\n<td>kadar</td>\n<td>до; колкото</td>\n</tr>\n<tr class=\"odd\">\n<td>göre</td>\n<td>според</td>\n</tr>\n<tr class=\"even\">\n<td>doğru</td>\n<td>към</td>\n</tr>\n<tr class=\"odd\">\n<td>karşı</td>\n<td>срещу</td>\n</tr>\n<tr class=\"even\">\n<td>rağmen</td>\n<td>въпреки</td>\n</tr>\n<tr class=\"odd\">\n<td>dolayı / yüzünden</td>\n<td>заради</td>\n</tr>\n<tr class=\"even\">\n<td>sayesinde</td>\n<td>благодарение на</td>\n</tr>\n<tr class=\"odd\">\n<td>beri</td>\n<td>от (време)</td>\n</tr>\n<tr class=\"even\">\n<td>önce</td>\n<td>преди</td>\n</tr>\n<tr class=\"odd\">\n<td>sonra</td>\n<td>след</td>\n</tr>\n<tr class=\"even\">\n<td>başka</td>\n<td>освен</td>\n</tr>\n<tr class=\"odd\">\n<td>ait</td>\n<td>принадлежащ на</td>\n</tr>\n<tr class=\"even\">\n<td>hakkında</td>\n<td>относно</td>\n</tr>\n<tr class=\"odd\">\n<td>arasında</td>\n<td>между</td>\n</tr>\n<tr class=\"even\">\n<td>yerine</td>\n<td>вместо</td>\n</tr>\n<tr class=\"odd\">\n<td>boyunca</td>\n<td>през, в течение на</td>\n</tr>\n<tr class=\"even\">\n<td>itibaren</td>\n<td>считано от</td>\n</tr>\n</tbody>\n</table>\n<h3 id=\"граматика-15.1-какво-е-следлог-edat\">Граматика 15.1 — Какво е\nследлог · Edat</h3>\n<p>Българският слага предлози <strong>пред</strong> думата („с\nприятел“). Турският ги слага <strong>след</strong> нея („arkadaş ile“) —\nзатова се наричат следлози.</p>\n<p>Всеки следлог изисква определен падеж пред себе си. Това е основното,\nкоето трябва да запомниш — самите думи са лесни.</p>\n<h3 id=\"граматика-15.2-следлози-с-основна-форма-без-окончание\">Граматика\n15.2 — Следлози с основна форма (без окончание)</h3>\n<table>\n<thead>\n<tr class=\"header\">\n<th>Следлог</th>\n<th>Значение</th>\n<th>Пример</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>ile (-la/-le)</td>\n<td>с</td>\n<td>arkadaş<strong>la</strong> — с приятел</td>\n</tr>\n<tr class=\"even\">\n<td>için</td>\n<td>за</td>\n<td>senin için — за теб</td>\n</tr>\n<tr class=\"odd\">\n<td>gibi</td>\n<td>като</td>\n<td>kuş gibi — като птица</td>\n</tr>\n<tr class=\"even\">\n<td>kadar</td>\n<td>колкото</td>\n<td>senin kadar — колкото теб</td>\n</tr>\n</tbody>\n</table>\n<p><strong>Важно:</strong> при <strong>местоименията</strong> тези\nследлози искат <strong>родителен падеж</strong>:</p>\n<div class=\"line-block\">benim ile → <strong>benimle</strong> | с мен\n|<br />\nsenin için | за теб |<br />\nonun gibi | като него |<br />\nbizim kadar | колкото нас |</div>\n<p>При съществителните — основна форма: <code>Ali ile</code>,\n<code>Ali için</code>, <code>çocuk gibi</code>.</p>\n<p><strong><code>ile</code> се слива с думата:</strong></p>\n<div class=\"line-block\">След съгласна | -la / -le |\notobüs<strong>le</strong>, tren<strong>le</strong> |<br />\nСлед гласна | -yla / -yle | araba<strong>yla</strong>,\nkedi<strong>yle</strong> |</div>\n<h3 id=\"граматика-15.3-следлози-с-дателен-падеж--a--e\">Граматика 15.3 —\nСледлози с дателен падеж (-a / -e)</h3>\n<table>\n<thead>\n<tr class=\"header\">\n<th>Следлог</th>\n<th>Значение</th>\n<th>Пример</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>göre</td>\n<td>според</td>\n<td>ban<strong>a göre</strong> — според мен</td>\n</tr>\n<tr class=\"even\">\n<td>doğru</td>\n<td>към</td>\n<td>ev<strong>e doğru</strong> — към къщи</td>\n</tr>\n<tr class=\"odd\">\n<td>kadar</td>\n<td>до</td>\n<td>saat üç<strong>e kadar</strong> — до три часа</td>\n</tr>\n<tr class=\"even\">\n<td>karşı</td>\n<td>срещу; към</td>\n<td>sen<strong>e karşı</strong> — срещу теб</td>\n</tr>\n<tr class=\"odd\">\n<td>rağmen</td>\n<td>въпреки</td>\n<td>yağmur<strong>a rağmen</strong> — въпреки дъжда</td>\n</tr>\n<tr class=\"even\">\n<td>ait</td>\n<td>принадлежащ на</td>\n<td>ban<strong>a ait</strong> — мой е</td>\n</tr>\n</tbody>\n</table>\n<p>Примери: - Bana göre bu doğru değil. — Според мен това не е вярно. -\nEve doğru yürüyorum. — Вървя към къщи. - Sabaha kadar çalıştım. —\nРаботих до сутринта. - Hastalığına rağmen işe geldi. — Въпреки болестта\nси дойде на работа.</p>\n<h3 id=\"граматика-15.4-следлози-с-изходен-падеж--dan--den\">Граматика\n15.4 — Следлози с изходен падеж (-dan / -den)</h3>\n<table>\n<thead>\n<tr class=\"header\">\n<th>Следлог</th>\n<th>Значение</th>\n<th>Пример</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>önce</td>\n<td>преди</td>\n<td>yemek<strong>ten önce</strong></td>\n</tr>\n<tr class=\"even\">\n<td>sonra</td>\n<td>след</td>\n<td>ders<strong>ten sonra</strong></td>\n</tr>\n<tr class=\"odd\">\n<td>beri</td>\n<td>от (време насам)</td>\n<td>sabah<strong>tan beri</strong></td>\n</tr>\n<tr class=\"even\">\n<td>dolayı</td>\n<td>заради</td>\n<td>hastalık<strong>tan dolayı</strong></td>\n</tr>\n<tr class=\"odd\">\n<td>başka</td>\n<td>освен</td>\n<td>sen<strong>den başka</strong></td>\n</tr>\n<tr class=\"even\">\n<td>itibaren</td>\n<td>считано от</td>\n<td>yarın<strong>dan itibaren</strong></td>\n</tr>\n</tbody>\n</table>\n<p>Примери: - Yemekten önce ellerini yıka. — Преди ядене си измий\nръцете. - Sabahtan beri seni bekliyorum. — Чакам те от сутринта. -\nYağmurdan dolayı gelemedim. — Заради дъжда не можах да дойда. - Senden\nbaşka kimse yok. — Освен теб няма никого.</p>\n<h3\nid=\"граматика-15.5-следлози-които-всъщност-са-съществителни\">Граматика\n15.5 — „Следлози“, които всъщност са съществителни</h3>\n<p>Тази група се държи различно и си струва да разбереш защо.\n<code>hakkında</code>, <code>yüzünden</code>, <code>sayesinde</code>,\n<code>yerine</code>, <code>arasında</code>, <code>boyunca</code> не са\nистински следлози, а <strong>съществителни с притежателен афикс и\nпадежно окончание</strong>:</p>\n<table>\n<colgroup>\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th>Израз</th>\n<th>Разбор</th>\n<th>Буквално</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>senin <strong>yüzünden</strong></td>\n<td>yüz (лице) + ün (твой) + den (от)</td>\n<td>от твоето лице</td>\n</tr>\n<tr class=\"even\">\n<td>senin <strong>sayesinde</strong></td>\n<td>saye (сянка, закрила) + n (твоя) + de (в)</td>\n<td>в твоята закрила</td>\n</tr>\n<tr class=\"odd\">\n<td>bunun <strong>hakkında</strong></td>\n<td>hak (право, отношение) + ı + nda</td>\n<td>в отношението на това</td>\n</tr>\n<tr class=\"even\">\n<td>onun <strong>yerine</strong></td>\n<td>yer (място) + i + ne</td>\n<td>на неговото място</td>\n</tr>\n<tr class=\"odd\">\n<td>ikisi <strong>arasında</strong></td>\n<td>ara (междина) + sı + nda</td>\n<td>в междината им</td>\n</tr>\n</tbody>\n</table>\n<p>Затова образуват <strong>изафет</strong> и се държат по неговите\nправила:</p>\n<table>\n<colgroup>\n<col style=\"width: 50%\" />\n<col style=\"width: 50%\" />\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th>Пред местоимение → родителен падеж</th>\n<th>Пред съществително → често и без него</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td><strong>senin</strong> yüzünden</td>\n<td>trafik yüzünden <em>(или: trafiğin yüzünden)</em></td>\n</tr>\n<tr class=\"even\">\n<td><strong>bunun</strong> hakkında</td>\n<td>proje hakkında</td>\n</tr>\n<tr class=\"odd\">\n<td><strong>onun</strong> yerine</td>\n<td>çay yerine</td>\n</tr>\n</tbody>\n</table>\n<p><strong><code>boyunca</code> и <code>arasında</code> не искат\nродителен при съществителни:</strong> <code>yıl boyunca</code> (през\nгодината), <code>hayatı boyunca</code> (през живота си),\n<code>ağaçlar arasında</code> (между дърветата), <code>aramızda</code>\n(между нас).</p>\n<p><strong>Разлика <code>yüzünden</code> / <code>sayesinde</code> /\n<code>dolayı</code>:</strong></p>\n<table>\n<colgroup>\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th>Следлог</th>\n<th>Оттенък</th>\n<th>Пример</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>yüzünden</td>\n<td>лоша последица, сочи виновника</td>\n<td>Senin yüzünden geç kaldım.</td>\n</tr>\n<tr class=\"even\">\n<td>sayesinde</td>\n<td>добра последица, благодарност</td>\n<td>Senin sayesinde başardım.</td>\n</tr>\n<tr class=\"odd\">\n<td>dolayı / nedeniyle</td>\n<td>неутрално, книжовно</td>\n<td>Hastalıktan dolayı gelemedi.</td>\n</tr>\n</tbody>\n</table>\n<p>Примери: - Senin yüzünden geç kaldım. — Заради теб закъснях. - Senin\nsayesinde başardım. — Благодарение на теб успях. - Bunun hakkında ne\ndüşünüyorsun? — Какво мислиш за това? - Onun yerine ben gideyim. —\nВместо него да отида аз.</p>\n<p><strong>Разлика <code>yüzünden</code> /\n<code>sayesinde</code>:</strong> - <code>yüzünden</code> — за лоша\nпоследица (заради теб стана беля) - <code>sayesinde</code> — за добра\nпоследица (благодарение на теб успях) - <code>dolayı</code> —\nнеутрално</p>\n<h3 id=\"граматика-15.6-обобщена-таблица\">Граматика 15.6 — Обобщена\nтаблица</h3>\n<table>\n<colgroup>\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th>Група</th>\n<th>Какво искат пред себе си</th>\n<th>Следлози</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td><strong>истински следлози</strong></td>\n<td>основна форма <em>(при местоимения — родителен)</em></td>\n<td>ile, için, gibi, kadar</td>\n</tr>\n<tr class=\"even\">\n<td></td>\n<td>дателен падеж (-a/-e)</td>\n<td>göre, doğru, kadar (до), karşı, rağmen, ait</td>\n</tr>\n<tr class=\"odd\">\n<td></td>\n<td>изходен падеж (-dan/-den)</td>\n<td>önce, sonra, beri, dolayı, başka, itibaren</td>\n</tr>\n<tr class=\"even\">\n<td><strong>изафетни съществителни</strong></td>\n<td>родителен при местоимения, изафет при съществителни</td>\n<td>hakkında, yüzünden, sayesinde, yerine, arasında, boyunca</td>\n</tr>\n</tbody>\n</table>\n<p><strong>Внимание с <code>kadar</code></strong> — има два падежа с\nразлично значение: - <code>senin kadar</code> (основна/родителна) —\nколкото теб - <code>eve kadar</code> (дателна) — до къщи</p>\n<h3 id=\"защо-е-така-neden-böyle-14\">Защо е така · Neden böyle</h3>\n<p><strong>Защо се наричат следлози?</strong> Защото стоят след думата.\nТова не е странно — то следва от общата логика на турския: всичко\nопределящо върви след определяемото, а изречението завършва с глагола.\nТурският е последователно „ляво-надясно нарастващ“ език.</p>\n<p><strong>Защо <code>benimle</code>, а не <code>benle</code>?</strong>\n<code>ile</code> при местоименията изисква родителен падеж — буквално „в\nкомпанията на моето“. Формата <code>benim ile</code> в говора се е сляла\nв <code>benimle</code>. Същото при <code>seninle</code>,\n<code>onunla</code>.</p>\n<p><strong>Защо <code>sabahtan beri</code>, а не\n<code>sabahtan itibaren</code>?</strong> И двете стават, но с оттенък: -\n<code>beri</code> — от тогава до сега, действието продължава:\n<code>Sabahtan beri bekliyorum.</code> - <code>itibaren</code> — считано\nот даден момент, по-официално:\n<code>Yarından itibaren yeni kurallar geçerli.</code></p>\n<p><strong>Защо <code>yüzünden</code> звучи като обвинение?</strong>\nЗащото <code>yüz</code> значи „лице“ и изразът буквално е „от лицето на“\n— сочи виновника. Затова се използва за неприятни последици. За приятни\n— <code>sayesinde</code> (от <code>saye</code> — сянка, закрила): „под\nтвоята закрила успях“.</p>\n<h3 id=\"текст-за-четене-и-превод-okuma-ve-çeviri-metni-13\">Текст за\nчетене и превод · Okuma ve çeviri metni</h3>\n<p><strong>Bir özür mesajı — Извинително съобщение</strong></p>\n<blockquote>\n<p>Merhaba Deniz,</p>\n<p>Dünkü toplantıya gelemedim, çok özür dilerim. Sabahtan beri hastaydım\nve doktora gitmek zorunda kaldım. Ateşim yüzünden hiçbir şey\nyapamadım.</p>\n<p>Toplantı hakkında bilgi verebilir misin? Yeni proje için ne karar\naldınız? Bana göre en önemli konu bütçeydi, ama belki başka şeyler de\nkonuşulmuştur.</p>\n<p>Senin sayesinde geçen ay da işleri yetiştirmiştim, yine yardımına\nihtiyacım var. Notlarını paylaşırsan çok sevinirim.</p>\n<p>Yarından itibaren tekrar ofisteyim. İstersen öğleden sonra bir kahve\niçelim, her şeyi konuşuruz. Saat üçe kadar müsaitim.</p>\n<p>Anlayışın için teşekkürler.</p>\n<p>Sevgiler, Petar</p>\n</blockquote>\n<p><em>Нови думи:</em> <code>özür dilemek</code> — извинявам се;\n<code>ateş</code> — температура; <code>bilgi vermek</code> — информирам;\n<code>karar almak</code> — вземам решение; <code>bütçe</code> — бюджет;\n<code>yetiştirmek</code> — успявам навреме; <code>paylaşmak</code> —\nсподелям; <code>sevinmek</code> — радвам се; <code>anlayış</code> —\nразбиране.</p>\n<p><strong>Въпроси:</strong></p>\n<ol type=\"1\">\n<li>Petar neden toplantıya gelememiş?</li>\n<li>Ona göre en önemli konu neydi?</li>\n<li>Ne zaman tekrar ofiste olacak?</li>\n<li>Saat kaça kadar müsait?</li>\n</ol>\n<h3 id=\"упражнения-alıştırmalar-14\">Упражнения · Alıştırmalar</h3>\n<p><strong>Упр. 15.1 — Кой падеж иска следлогът?</strong> <em>(Edat\nhangi hâli ister?)</em></p>\n<ol type=\"1\">\n<li>ben___ göre</li>\n<li>ev___ doğru</li>\n<li>yemek___ önce</li>\n<li>sen___ yüzünden</li>\n<li>yağmur___ rağmen</li>\n<li>sabah___ beri</li>\n<li>bu___ hakkında</li>\n<li>sen___ başka</li>\n</ol>\n<p><strong>Упр. 15.2 — Свържи с <code>ile</code>.</strong> <em>(„ile“\nile birleştirin.)</em></p>\n<p>Пример: otobüs → otobüsle</p>\n<ol type=\"1\">\n<li>tren</li>\n<li>araba</li>\n<li>arkadaş</li>\n<li>ben</li>\n<li>sen</li>\n<li>kalem</li>\n</ol>\n<p><strong>Упр. 15.3 — <code>yüzünden</code> или\n<code>sayesinde</code>?</strong> <em>(Hangisi uygun?)</em></p>\n<ol type=\"1\">\n<li>Senin ___ başardım. (благодарение)</li>\n<li>Yağmur ___ geç kaldım. (заради, лошо)</li>\n<li>Öğretmenim ___ Türkçe öğrendim. (благодарение)</li>\n<li>Trafik ___ toplantıyı kaçırdım. (заради, лошо)</li>\n</ol>\n<p><strong>Упр. 15.4 — Попълни подходящия следлог.</strong> <em>(Uygun\nedatı yazın.)</em></p>\n<p>Избери: için · gibi · kadar · göre · rağmen · sonra</p>\n<ol type=\"1\">\n<li>Bu hediye senin ___ .</li>\n<li>Kar ___ beyaz.</li>\n<li>Saat üçe ___ buradayım.</li>\n<li>Bana ___ bu doğru değil.</li>\n<li>Yağmura ___ dışarı çıktı.</li>\n<li>Dersten ___ eve gideceğim.</li>\n</ol>\n<p><strong>Упр. 15.5 — Поправи грешката.</strong> <em>(Hatayı\ndüzeltin.)</em></p>\n<ol type=\"1\">\n<li>Ben ile gel.</li>\n<li>Sen göre bu doğru mu?</li>\n<li>Yemek önce ellerini yıka.</li>\n<li>Sen yüzünden geç kaldım.</li>\n<li>Ev doğru yürüyorum.</li>\n</ol>\n<p><strong>Упр. 15.6 — Преведи на турски.</strong> <em>(Türkçeye\nçevirin.)</em></p>\n<ol type=\"1\">\n<li>Според мен това не е вярно.</li>\n<li>Чакам те от сутринта.</li>\n<li>Заради дъжда не можах да дойда.</li>\n<li>Благодарение на теб успях.</li>\n<li>Освен теб няма никого.</li>\n<li>Въпреки болестта си дойде на работа.</li>\n<li>Вместо него да отида аз.</li>\n<li>Какво мислиш за това?</li>\n</ol>\n<hr />\n<h2 id=\"урок-16-афиксът--ki--ki-eki\">УРОК 16 · Афиксът -ki · „-ki“\neki</h2>\n<h3 id=\"речник-sözlük-14\">Речник · Sözlük</h3>\n<table>\n<thead>\n<tr class=\"header\">\n<th>Турски</th>\n<th>Български</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>yukarı</td>\n<td>горе</td>\n</tr>\n<tr class=\"even\">\n<td>aşağı</td>\n<td>долу</td>\n</tr>\n<tr class=\"odd\">\n<td>içeri</td>\n<td>вътре</td>\n</tr>\n<tr class=\"even\">\n<td>dışarı</td>\n<td>вън</td>\n</tr>\n<tr class=\"odd\">\n<td>ileri</td>\n<td>напред</td>\n</tr>\n<tr class=\"even\">\n<td>geri</td>\n<td>назад</td>\n</tr>\n<tr class=\"odd\">\n<td>sağ</td>\n<td>дясно</td>\n</tr>\n<tr class=\"even\">\n<td>sol</td>\n<td>ляво</td>\n</tr>\n<tr class=\"odd\">\n<td>orta</td>\n<td>среда</td>\n</tr>\n<tr class=\"even\">\n<td>köşe</td>\n<td>ъгъл</td>\n</tr>\n<tr class=\"odd\">\n<td>yan</td>\n<td>страна</td>\n</tr>\n<tr class=\"even\">\n<td>alt</td>\n<td>долна част</td>\n</tr>\n<tr class=\"odd\">\n<td>üst</td>\n<td>горна част</td>\n</tr>\n<tr class=\"even\">\n<td>iç</td>\n<td>вътрешност</td>\n</tr>\n<tr class=\"odd\">\n<td>dış</td>\n<td>външност</td>\n</tr>\n<tr class=\"even\">\n<td>ön</td>\n<td>предна част</td>\n</tr>\n<tr class=\"odd\">\n<td>arka</td>\n<td>задна част</td>\n</tr>\n<tr class=\"even\">\n<td>raf</td>\n<td>рафт</td>\n</tr>\n<tr class=\"odd\">\n<td>çekmece</td>\n<td>чекмедже</td>\n</tr>\n<tr class=\"even\">\n<td>dolap</td>\n<td>шкаф</td>\n</tr>\n</tbody>\n</table>\n<h3 id=\"граматика-16.1-какво-прави--ki\">Граматика 16.1 — Какво прави\n<code>-ki</code></h3>\n<p><code>-ki</code> превръща обстоятелство в определение. На български\nсе превежда с „който е…“, „онзи от…“ или просто с прилагателно:</p>\n<table>\n<thead>\n<tr class=\"header\">\n<th>Турски</th>\n<th>Разбор</th>\n<th>Български</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>masa<strong>daki</strong> kitap</td>\n<td>на-масата + който е</td>\n<td>книгата <strong>на масата</strong></td>\n</tr>\n<tr class=\"even\">\n<td>ev<strong>deki</strong> insanlar</td>\n<td>в-къщата + които са</td>\n<td>хората <strong>в къщата</strong></td>\n</tr>\n<tr class=\"odd\">\n<td>dün<strong>kü</strong> toplantı</td>\n<td>вчера + който е</td>\n<td><strong>вчерашното</strong> събрание</td>\n</tr>\n<tr class=\"even\">\n<td>ben<strong>imki</strong></td>\n<td>мой + този</td>\n<td><strong>моят</strong> (този, който е мой)</td>\n</tr>\n</tbody>\n</table>\n<p>Тоест <code>-ki</code> казва: „това нещо, определено чрез мястото или\nвремето си“.</p>\n<h3 id=\"граматика-16.2-трите-основни-употреби\">Граматика 16.2 — Трите\nосновни употреби</h3>\n<p><strong>А) След местен падеж (-daki / -deki):</strong></p>\n<ul>\n<li>masa<strong>daki</strong> kalem — моливът на масата</li>\n<li>çanta<strong>daki</strong> kitaplar — книгите в чантата</li>\n<li>İstanbul’<strong>daki</strong> arkadaşım — приятелят ми в\nИстанбул</li>\n<li>sınıf<strong>taki</strong> öğrenciler — учениците в класната\nстая</li>\n</ul>\n<p><strong>Б) След родителен падеж (-inki) — вместо\nповторение:</strong></p>\n<ul>\n<li>Bu benim kitabım, o da sen<strong>inki</strong>. — Това е моята\nкнига, а онова — твоята.</li>\n<li>Ali’<strong>ninki</strong> daha güzel. — Тази на Али е\nпо-хубава.</li>\n</ul>\n<div class=\"line-block\">benim → <strong>benimki</strong> | моят |<br />\nsenin → <strong>seninki</strong> | твоят |<br />\nonun → <strong>onunki</strong> | неговият |<br />\nbizim → <strong>bizimki</strong> | нашият |<br />\nsizin → <strong>sizinki</strong> | вашият |<br />\nonların → <strong>onlarınki</strong> | техният |</div>\n<p><strong>В) След дума за време — направо, без падеж:</strong></p>\n<ul>\n<li>dün<strong>kü</strong> gazete — вчерашният вестник</li>\n<li>bugün<strong>kü</strong> hava — днешното време</li>\n<li>sabah<strong>ki</strong> toplantı — сутрешното събрание</li>\n<li>geçen yıl<strong>ki</strong> sınav — миналогодишният изпит</li>\n<li>şimdi<strong>ki</strong> durum — сегашното положение</li>\n</ul>\n<h3 id=\"граматика-16.3-гласната-хармония-при--ki\">Граматика 16.3 —\nГласната хармония при <code>-ki</code></h3>\n<p><code>-ki</code> е <strong>почти неизменяемо</strong> — това е една\nот малкото такива морфеми в турския:</p>\n<div class=\"line-block\">Основна форма | -ki | masadaki, evdeki,\nsınıftaki |<br />\nСлед <code>ü</code>, <code>u</code> в думи за време | -kü | dünkü,\nbugünkü |</div>\n<p>Няма форми <code>-kı</code> или <code>-ku</code>: не се казва\n<del>masadakı</del>. Изключението <code>-kü</code> важи само за\n<code>dün</code>, <code>bugün</code>, <code>gün</code> и подобни.</p>\n<h3 id=\"граматика-16.4--ki-се-скланя-като-съществително\">Граматика 16.4\n— <code>-ki</code> се скланя като съществително</h3>\n<p>Щом сложиш <code>-ki</code>, думата става самостоятелна и приема свои\nокончания. <strong>Пред падежно окончание се вмъква\n<code>-n-</code>:</strong></p>\n<div class=\"line-block\">masadaki | масата-който-е |<br />\nmasadaki<strong>n</strong>i | него (винителен) |<br />\nmasadaki<strong>n</strong>e | на него (дателен) |<br />\nmasadaki<strong>n</strong>den | от него (изходен) |<br />\nmasadaki<strong>ler</strong> | тези на масата (мн.ч.) |</div>\n<p>Примери: - Masadakini ver. — Дай ми този от масата. - Çantadakileri\nçıkar. — Извади тези от чантата. - Benimkini beğendim. — Моят ми\nхареса.</p>\n<h3 id=\"граматика-16.5-пространствените-съществителни\">Граматика 16.5 —\nПространствените съществителни</h3>\n<p>Турският няма предлози „върху“, „под“, „до“. Използва съществителни в\nизафет:</p>\n<table>\n<colgroup>\n<col style=\"width: 25%\" />\n<col style=\"width: 25%\" />\n<col style=\"width: 25%\" />\n<col style=\"width: 25%\" />\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th>Съществително</th>\n<th>Значение</th>\n<th>Конструкция</th>\n<th>Пример</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>üst</td>\n<td>горна част</td>\n<td>-in üstünde</td>\n<td>masa<strong>nın üstünde</strong> — върху масата</td>\n</tr>\n<tr class=\"even\">\n<td>alt</td>\n<td>долна част</td>\n<td>-in altında</td>\n<td>masa<strong>nın altında</strong> — под масата</td>\n</tr>\n<tr class=\"odd\">\n<td>iç</td>\n<td>вътрешност</td>\n<td>-in içinde</td>\n<td>çanta<strong>nın içinde</strong> — вътре в чантата</td>\n</tr>\n<tr class=\"even\">\n<td>dış</td>\n<td>външност</td>\n<td>-in dışında</td>\n<td>şehr<strong>in dışında</strong> — извън града</td>\n</tr>\n<tr class=\"odd\">\n<td>ön</td>\n<td>предна част</td>\n<td>-in önünde</td>\n<td>ev<strong>in önünde</strong> — пред къщата</td>\n</tr>\n<tr class=\"even\">\n<td>arka</td>\n<td>задна част</td>\n<td>-in arkasında</td>\n<td>ev<strong>in arkasında</strong> — зад къщата</td>\n</tr>\n<tr class=\"odd\">\n<td>yan</td>\n<td>страна</td>\n<td>-in yanında</td>\n<td>ben<strong>im yanımda</strong> — до мен</td>\n</tr>\n<tr class=\"even\">\n<td>ara</td>\n<td>междина</td>\n<td>-in arasında</td>\n<td>ikis<strong>inin arasında</strong> — между двамата</td>\n</tr>\n<tr class=\"odd\">\n<td>karşı</td>\n<td>отсрещна страна</td>\n<td>-in karşısında</td>\n<td>okul<strong>un karşısında</strong> — срещу училището</td>\n</tr>\n</tbody>\n</table>\n<p><strong>Схемата е винаги една и съща:</strong> родителен падеж +\nпространствената дума с притежателен афикс + падеж</p>\n<p><code>masa-nın üst-ü-nde</code> = „в горната част на масата“</p>\n<p><strong>И трите падежа работят:</strong></p>\n<div class=\"line-block\">masanın üstü<strong>nde</strong> | върху масата\n<em>(къде)</em> |<br />\nmasanın üstü<strong>ne</strong> | върху масата <em>(накъде — сложи го\nтам)</em> |<br />\nmasanın üstü<strong>nden</strong> | от масата <em>(откъде — вземи го\nоттам)</em> |</div>\n<p><strong>Може и без родителен падеж</strong>, когато първата дума е\nобща: <code>masa üstünde</code> е по-разговорно,\n<code>masanın üstünde</code> — по-точно.</p>\n<h3 id=\"граматика-16.6-комбинация--ki-пространствена-дума\">Граматика\n16.6 — Комбинация: <code>-ki</code> + пространствена дума</h3>\n<p>Двете се съчетават често:</p>\n<ul>\n<li>masanın üstü<strong>ndeki</strong> kitap — книгата върху масата</li>\n<li>çantanın içi<strong>ndeki</strong> para — парите вътре в\nчантата</li>\n<li>evin önü<strong>ndeki</strong> araba — колата пред къщата</li>\n</ul>\n<h3 id=\"защо-е-така-neden-böyle-15\">Защо е така · Neden böyle</h3>\n<p><strong>Защо турският има отделен афикс за това?</strong> Защото няма\nотносителни местоимения като „който“. Българският казва „книгата,\n<strong>която</strong> е на масата“ — цяло подчинено изречение. Турският\nсвива всичко в едно определение пред думата:\n<code>masadaki kitap</code>. Това е основният му принцип — определението\nстои преди определяемото и е компактно.</p>\n<p><strong>Защо <code>-ki</code> не спазва гласната хармония?</strong>\nЗащото е заемка от персийски (<code>ke</code>), а заемките често остават\n„замръзнали“. Същото е и с <code>-yor</code>. Изключението\n<code>-kü</code> след <code>dün</code>, <code>bugün</code> е по-късно\nразвитие под влияние на устната реч.</p>\n<p><strong>Защо се появява <code>-n-</code> в\n<code>masadakini</code>?</strong> Защото <code>-ki</code> завършва на\nгласна и след него не може да дойде направо падежно окончание, започващо\nс гласна. Това е същата буква-свръзка, която видя при\n<code>evi-n-de</code> (неговата къща). Турският използва <code>n</code>\nкато универсален съединител.</p>\n<p><strong>Защо пространствените отношения са изафет, а не\nпредлози?</strong> Защото исторически турският изразява всичко чрез\nсъществителни: „върху масата“ = „в горната-част на масата“. Затова тези\nдуми се скланят като нормални съществителни и могат да вземат\nпритежателен афикс за всяко лице: <code>yanımda</code> (до мен),\n<code>yanında</code> (до теб/него), <code>yanımızda</code> (до нас).</p>\n<h3 id=\"текст-за-четене-и-превод-okuma-ve-çeviri-metni-14\">Текст за\nчетене и превод · Okuma ve çeviri metni</h3>\n<p><strong>Kayıp anahtar — Изгубеният ключ</strong></p>\n<blockquote>\n<p>— Anne, anahtarımı bulamıyorum!</p>\n<p>— Masanın üstüne baktın mı?</p>\n<p>— Baktım, orada yok. Çantanın içine de baktım.</p>\n<p>— Dünkü ceketinin cebinde olabilir mi?</p>\n<p>— Ay, doğru! Dün akşamki ceketimi giymemiştim bugün.</p>\n<p>— Dolabın içindeki askıda asılı. Bir bak bakalım.</p>\n<p>— Buldum! Cebindeymiş. Teşekkürler anne.</p>\n<p>— Bir dahaki sefere anahtarını hep aynı yere koy. Kapının yanındaki\nkâsede mesela.</p>\n<p>— Haklısın. Yandaki masada duran o küçük kâse mi?</p>\n<p>— Evet, oradaki. Böylece hiç aramazsın.</p>\n</blockquote>\n<p><em>Нови думи:</em> <code>kayıp</code> — изгубен; <code>ceket</code>\n— сако; <code>cep</code> — джоб; <code>giymek</code> — обличам;\n<code>askı</code> — закачалка; <code>asılı</code> — окачен;\n<code>bir dahaki sefere</code> — следващия път; <code>kâse</code> —\nкупа; <code>mesela</code> — например; <code>durmak</code> — стоя;\n<code>böylece</code> — така.</p>\n<p><strong>Въпроси:</strong></p>\n<ol type=\"1\">\n<li>Çocuk neyi arıyor?</li>\n<li>Anahtar nerede bulunmuş?</li>\n<li>Ceket nerede asılı?</li>\n<li>Anne nereye koymasını söylüyor?</li>\n</ol>\n<h3 id=\"упражнения-alıştırmalar-15\">Упражнения · Alıştırmalar</h3>\n<p><strong>Упр. 16.1 — Направи с <code>-ki</code>.</strong> <em>(„-ki“\nile yapın.)</em></p>\n<p>Пример: masa + kitap → masadaki kitap</p>\n<ol type=\"1\">\n<li>çanta + kalem</li>\n<li>ev + insanlar</li>\n<li>sınıf + öğrenciler</li>\n<li>İstanbul + arkadaşım</li>\n<li>dün + gazete</li>\n<li>bugün + hava</li>\n<li>sabah + toplantı</li>\n<li>şimdi + durum</li>\n</ol>\n<p><strong>Упр. 16.2 — Замени с <code>-ki</code> форма.</strong>\n<em>(„-ki“ biçimiyle değiştirin.)</em></p>\n<p>Пример: benim kitabım → benimki</p>\n<ol type=\"1\">\n<li>senin araban</li>\n<li>onun evi</li>\n<li>bizim okulumuz</li>\n<li>sizin kitabınız</li>\n<li>Ali’nin arabası</li>\n</ol>\n<p><strong>Упр. 16.3 — Постави падежно окончание (внимавай с\n<code>-n-</code>).</strong> <em>(Hâl eki ekleyin.)</em></p>\n<ol type=\"1\">\n<li>masadaki + винителен</li>\n<li>çantadaki + мн.ч. + винителен</li>\n<li>benimki + винителен</li>\n<li>evdeki + дателен</li>\n<li>oradaki + изходен</li>\n</ol>\n<p><strong>Упр. 16.4 — Пространствени изрази.</strong> <em>(Yer\nifadeleri.)</em></p>\n<p>Пример: masa / üst / върху → masanın üstünde</p>\n<ol type=\"1\">\n<li>masa / alt / под</li>\n<li>çanta / iç / вътре в</li>\n<li>ev / ön / пред</li>\n<li>ev / arka / зад</li>\n<li>okul / karşı / срещу</li>\n<li>ben / yan / до</li>\n</ol>\n<p><strong>Упр. 16.5 — Кой падеж? (nerede, nereye, nereden)</strong>\n<em>(Hangi hâl?)</em></p>\n<ol type=\"1\">\n<li>Kitap masanın üstü___ . (къде е)</li>\n<li>Kitabı masanın üstü___ koy. (накъде)</li>\n<li>Kitabı masanın üstü___ al. (откъде)</li>\n<li>Araba evin önü___ duruyor. (къде)</li>\n<li>Arabayı evin önü___ çek. (накъде)</li>\n</ol>\n<p><strong>Упр. 16.6 — Преведи на турски.</strong> <em>(Türkçeye\nçevirin.)</em></p>\n<ol type=\"1\">\n<li>книгата на масата</li>\n<li>вчерашният вестник</li>\n<li>Дай ми този от масата.</li>\n<li>Моят е по-хубав.</li>\n<li>под масата</li>\n<li>пред къщата</li>\n<li>колата пред къщата</li>\n<li>Извади тези от чантата.</li>\n</ol>\n<hr />\n<h2 id=\"урок-17-причастия-sıfat-fiiller-ortaçlar\">УРОК 17 · Причастия ·\nSıfat-fiiller (ortaçlar)</h2>\n<h3 id=\"речник-sözlük-15\">Речник · Sözlük</h3>\n<table>\n<thead>\n<tr class=\"header\">\n<th>Турски</th>\n<th>Български</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>tanımak</td>\n<td>познавам</td>\n</tr>\n<tr class=\"even\">\n<td>bilinmek</td>\n<td>известен съм</td>\n</tr>\n<tr class=\"odd\">\n<td>yaşamak</td>\n<td>живея</td>\n</tr>\n<tr class=\"even\">\n<td>çalışan</td>\n<td>работещ</td>\n</tr>\n<tr class=\"odd\">\n<td>gelen</td>\n<td>идващ</td>\n</tr>\n<tr class=\"even\">\n<td>giden</td>\n<td>заминаващ</td>\n</tr>\n<tr class=\"odd\">\n<td>bilen</td>\n<td>знаещ</td>\n</tr>\n<tr class=\"even\">\n<td>oturan</td>\n<td>живеещ, седящ</td>\n</tr>\n<tr class=\"odd\">\n<td>konuşan</td>\n<td>говорещ</td>\n</tr>\n<tr class=\"even\">\n<td>gören</td>\n<td>виждащ</td>\n</tr>\n<tr class=\"odd\">\n<td>olay</td>\n<td>случка</td>\n</tr>\n<tr class=\"even\">\n<td>kişi</td>\n<td>лице, човек</td>\n</tr>\n<tr class=\"odd\">\n<td>yer</td>\n<td>място</td>\n</tr>\n<tr class=\"even\">\n<td>zaman</td>\n<td>време</td>\n</tr>\n<tr class=\"odd\">\n<td>konu</td>\n<td>тема</td>\n</tr>\n<tr class=\"even\">\n<td>sebep</td>\n<td>причина</td>\n</tr>\n<tr class=\"odd\">\n<td>sonuç</td>\n<td>резултат</td>\n</tr>\n<tr class=\"even\">\n<td>örnek</td>\n<td>пример</td>\n</tr>\n<tr class=\"odd\">\n<td>durum</td>\n<td>положение</td>\n</tr>\n<tr class=\"even\">\n<td>deneyim</td>\n<td>опит</td>\n</tr>\n</tbody>\n</table>\n<h3 id=\"граматика-17.1-какво-е-причастие-sıfat-fiil\">Граматика 17.1 —\nКакво е причастие · Sıfat-fiil</h3>\n<p>Причастието превръща глагол в определение. Българският има същото\n(„работещ човек“, „написана книга“), но турският го използва много\nпо-широко — с него замества цели подчинени изречения.</p>\n<p><strong>Основното правило:</strong> причастието стои\n<strong>пред</strong> думата, която определя, и не се мени по род и\nчисло.</p>\n<table>\n<thead>\n<tr class=\"header\">\n<th>Турски</th>\n<th>Български</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>çalış<strong>an</strong> adam</td>\n<td>работещ<strong>ият</strong> мъж / мъжът, който работи</td>\n</tr>\n<tr class=\"even\">\n<td>gel<strong>en</strong> misafir</td>\n<td>идващият гост / гостът, който идва</td>\n</tr>\n<tr class=\"odd\">\n<td>oku<strong>duğum</strong> kitap</td>\n<td>книгата, която чета/четох</td>\n</tr>\n<tr class=\"even\">\n<td>oku<strong>yacağım</strong> kitap</td>\n<td>книгата, която ще чета</td>\n</tr>\n</tbody>\n</table>\n<h3 id=\"граматика-17.2--an--en-подлогово-причастие\">Граматика 17.2 —\n<code>-an / -en</code> (подлогово причастие)</h3>\n<p>Използва се, когато определяемата дума е <strong>вършителят</strong>\nна действието.</p>\n<p><strong>Корен + -an / -en</strong> <em>(след гласна: -yan /\n-yen)</em></p>\n<table>\n<thead>\n<tr class=\"header\">\n<th>Глагол</th>\n<th>Причастие</th>\n<th>Превод</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>çalışmak</td>\n<td>çalış<strong>an</strong></td>\n<td>работещ</td>\n</tr>\n<tr class=\"even\">\n<td>gelmek</td>\n<td>gel<strong>en</strong></td>\n<td>идващ</td>\n</tr>\n<tr class=\"odd\">\n<td>bilmek</td>\n<td>bil<strong>en</strong></td>\n<td>знаещ</td>\n</tr>\n<tr class=\"even\">\n<td>oturmak</td>\n<td>otur<strong>an</strong></td>\n<td>седящ, живеещ</td>\n</tr>\n<tr class=\"odd\">\n<td>okumak</td>\n<td>oku<strong>yan</strong></td>\n<td>четящ</td>\n</tr>\n<tr class=\"even\">\n<td>beklemek</td>\n<td>bekle<strong>yen</strong></td>\n<td>чакащ</td>\n</tr>\n</tbody>\n</table>\n<p>Примери: - Türkçe bil<strong>en</strong> bir arkadaşım var. — Имам\nприятел, който знае турски. - Burada otur<strong>an</strong> insanlar\nçok kibar. — Хората, които живеят тук, са много любезни. - Dün\ngel<strong>en</strong> misafir kimdi? — Кой беше гостът, който дойде\nвчера? - Kapıda bekle<strong>yen</strong> adam babam. — Мъжът, който\nчака на вратата, е баща ми.</p>\n<p><strong>Отрицание:</strong> <code>çalışmayan</code> (който не\nработи), <code>gelmeyen</code> (който не идва)</p>\n<p><strong>Причастието може да стои само</strong> — тогава е\nсъществително: - Gel<strong>enler</strong> oturdu. — Дошлите седнаха. -\nBil<strong>en</strong> bilir. — Който знае, знае.</p>\n<h3 id=\"граматика-17.3--dık-обектово-причастие\">Граматика 17.3 —\n<code>-dık</code> (обектово причастие)</h3>\n<p>Използва се, когато определяемата дума <strong>НЕ е</strong>\nвършителят, а обект, място, време или обстоятелство. Тогава вършителят\nсе изразява с притежателен афикс.</p>\n<p><strong>Корен + -dık/-dik/-duk/-dük (или -tık/-tik/-tuk/-tük) +\nпритежателен афикс</strong></p>\n<table>\n<thead>\n<tr class=\"header\">\n<th>Лице</th>\n<th>okumak</th>\n<th>Превод</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>ben</td>\n<td>oku<strong>duğum</strong></td>\n<td>който аз чета/четох</td>\n</tr>\n<tr class=\"even\">\n<td>sen</td>\n<td>oku<strong>duğun</strong></td>\n<td>който ти четеш</td>\n</tr>\n<tr class=\"odd\">\n<td>o</td>\n<td>oku<strong>duğu</strong></td>\n<td>който той чете</td>\n</tr>\n<tr class=\"even\">\n<td>biz</td>\n<td>oku<strong>duğumuz</strong></td>\n<td>който ние четем</td>\n</tr>\n<tr class=\"odd\">\n<td>siz</td>\n<td>oku<strong>duğunuz</strong></td>\n<td>който вие четете</td>\n</tr>\n<tr class=\"even\">\n<td>onlar</td>\n<td>oku<strong>dukları</strong></td>\n<td>който те четат</td>\n</tr>\n</tbody>\n</table>\n<p><strong>Внимавай:</strong> <code>k</code> става <code>ğ</code> пред\nгласна (<code>okuduk</code> + <code>um</code> →\n<code>okuduğum</code>).</p>\n<p>Примери: - Oku<strong>duğum</strong> kitap çok güzeldi. — Книгата,\nкоято четох, беше много хубава. - Otur<strong>duğun</strong> ev nerede?\n— Къде е къщата, в която живееш? - Tanı<strong>dığım</strong> biri\ndeğil. — Не е някой, когото познавам. - Ali’nin\nçalış<strong>tığı</strong> şirket büyük. — Фирмата, в която Али работи,\nе голяма.</p>\n<p><strong>Отрицание:</strong> <code>okumadığım</code> (който не чета),\n<code>gitmediğim</code> (където не отидох)</p>\n<h3 id=\"граматика-17.4--acak-бъдещо-причастие\">Граматика 17.4 —\n<code>-acak</code> (бъдещо причастие)</h3>\n<p>Същото като <code>-dık</code>, но за бъдеще:</p>\n<div class=\"line-block\">oku<strong>yacağım</strong> kitap | книгата,\nкоято ще чета |<br />\ngid<strong>eceğim</strong> yer | мястото, където ще отида |<br />\nyap<strong>acağın</strong> iş | работата, която ще вършиш |</div>\n<p>Примери: - Yarın gid<strong>eceğim</strong> yer çok uzak. — Мястото,\nкъдето ще отида утре, е много далече. - Alacağım araba kırmızı olacak. —\nКолата, която ще купя, ще бъде червена.</p>\n<h3 id=\"граматика-17.5-как-да-избереш-между--an-и--dık\">Граматика 17.5 —\nКак да избереш между <code>-an</code> и <code>-dık</code></h3>\n<p>Задай си въпроса: <strong>определяемата дума върши ли\nдействието?</strong></p>\n<table>\n<thead>\n<tr class=\"header\">\n<th>Изречение</th>\n<th>Кой върши действието</th>\n<th>Причастие</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>мъжът, <strong>който</strong> чете</td>\n<td>мъжът чете</td>\n<td>oku<strong>yan</strong> adam</td>\n</tr>\n<tr class=\"even\">\n<td>книгата, <strong>която</strong> чета</td>\n<td>аз чета</td>\n<td>oku<strong>duğum</strong> kitap</td>\n</tr>\n<tr class=\"odd\">\n<td>човекът, <strong>който</strong> дойде</td>\n<td>човекът дойде</td>\n<td>gel<strong>en</strong> adam</td>\n</tr>\n<tr class=\"even\">\n<td>денят, <strong>в който</strong> дойде</td>\n<td>той дойде</td>\n<td>gel<strong>diği</strong> gün</td>\n</tr>\n</tbody>\n</table>\n<p><strong>Проверка на български:</strong> ако можеш да замениш „който“\nс „когото/която/където“ — значи е <code>-dık</code>.</p>\n<h3 id=\"граматика-17.6-полезни-готови-изрази-с-причастия\">Граматика 17.6\n— Полезни готови изрази с причастия</h3>\n<div class=\"line-block\">olan | който е | Sorun olan şey… |<br />\nbulunan | който се намира | Merkezde bulunan otel |<br />\ndenilen / denen | наречен | Ahmet denilen adam |<br />\ngeçen | миналият | geçen hafta |<br />\ngelecek | следващият | gelecek yıl |<br />\nkalan | оставащият | kalan para |<br />\nbilinen | известният | bilinen bir gerçek |<br />\nistediğim | който искам | istediğim gibi |<br />\ndediğim | което казвам | dediğim gibi — както казвам |<br />\ngördüğüm kadarıyla | доколкото виждам | |<br />\nbildiğim kadarıyla | доколкото знам | |</div>\n<h3 id=\"защо-е-така-neden-böyle-16\">Защо е така · Neden böyle</h3>\n<p><strong>Защо турският има две причастия, а българският —\nедно?</strong> Защото българският разчита на относителни местоимения\n(„който, когото, където“), които сами показват ролята. Турският няма\nтакива думи, затова кодира ролята в самото причастие: <code>-an</code> =\nопределяемото е подлог, <code>-dık</code> = определяемото е нещо\nдруго.</p>\n<p>Сравни: - Мъжът, <strong>който</strong> чете →\noku<strong>yan</strong> adam - Книгата, <strong>която</strong> чета →\noku<strong>duğum</strong> kitap</p>\n<p>Едно и също „който“ на български, две различни форми на турски.</p>\n<p><strong>Защо <code>-dık</code> носи притежателен афикс?</strong>\nЗащото трябва да покаже <strong>кой</strong> върши действието — след\nкато определяемото не е вършителят. <code>okuduğum</code> = „моето\nчетено“, <code>okuduğun</code> = „твоето четено“. Буквално е отглаголно\nсъществително с притежание.</p>\n<p><strong>Защо това е трудно за българи?</strong> Защото изисква\nобръщане на реда. Българинът мисли „книгата, която четох“ — първо\nсъществителното, после подчиненото изречение. Турският го иска обратно:\n<code>okuduğum kitap</code> — първо определението, после\nсъществителното. Упражнявай се, като първо намираш кой върши действието,\nпосле подреждаш.</p>\n<p><strong>Полезен ориентир:</strong> ако в българското изречение след\n„който“ идва глагол — най-вероятно е <code>-an</code>. Ако идва подлог\n(„която <strong>аз</strong> четох“) — <code>-dık</code>.</p>\n<h3 id=\"текст-за-четене-и-превод-okuma-ve-çeviri-metni-15\">Текст за\nчетене и превод · Okuma ve çeviri metni</h3>\n<p><strong>Aradığım ev — Къщата, която търся</strong></p>\n<blockquote>\n<p>Uzun zamandır oturduğum daire artık bana küçük geliyor. Bu yüzden\nyeni bir ev arıyorum. Aradığım ev çok büyük olmak zorunda değil, ama\niçinde çalışabileceğim ayrı bir oda olsun istiyorum.</p>\n<p>Şu anda baktığım ilanların çoğu şehir merkezinde. Merkezde bulunan\nevler daha pahalı ama işe yürüyerek gidebilirim. Dışarıda oturan\narkadaşlarım her sabah trafikte bir saat kaybediyor.</p>\n<p>Geçen hafta gördüğüm bir daire çok hoşuma gitti. Balkonu olan, güneş\nalan güzel bir yerdi. Ama istedikleri kira benim ödeyebileceğimden\nfazlaydı.</p>\n<p>Emlakçının söylediğine göre gelecek ay yeni ilanlar çıkacakmış.\nBekleyeceğim. Acele edip yanlış karar vermek istemiyorum.</p>\n</blockquote>\n<p><em>Нови думи:</em> <code>daire</code> — апартамент;\n<code>ayrı</code> — отделен; <code>ilan</code> — обява;\n<code>merkez</code> — център; <code>kaybetmek</code> — губя;\n<code>hoşuna gitmek</code> — харесва ми; <code>balkon</code> — балкон;\n<code>güneş almak</code> — огрява се от слънце; <code>ödemek</code> —\nплащам; <code>emlakçı</code> — брокер; <code>acele etmek</code> —\nприбързвам; <code>yanlış</code> — грешен.</p>\n<p><strong>Въпроси:</strong></p>\n<ol type=\"1\">\n<li>Neden yeni bir ev arıyor?</li>\n<li>Aradığı evde ne olmasını istiyor?</li>\n<li>Geçen hafta gördüğü daire nasıldı?</li>\n<li>Neden o daireyi tutmadı?</li>\n</ol>\n<h3 id=\"упражнения-alıştırmalar-16\">Упражнения · Alıştırmalar</h3>\n<p><strong>Упр. 17.1 — Направи причастие на\n<code>-an / -en</code>.</strong> <em>(„-an/-en“ ortacı yapın.)</em></p>\n<ol type=\"1\">\n<li>çalışmak</li>\n<li>gelmek</li>\n<li>bilmek</li>\n<li>oturmak</li>\n<li>okumak</li>\n<li>beklemek</li>\n<li>konuşmak</li>\n<li>görmek</li>\n</ol>\n<p><strong>Упр. 17.2 — Направи причастие на <code>-dık</code> за\nпосоченото лице.</strong> <em>(„-dık“ ortacı yapın.)</em></p>\n<ol type=\"1\">\n<li>okumak (ben)</li>\n<li>oturmak (sen)</li>\n<li>çalışmak (o)</li>\n<li>görmek (biz)</li>\n<li>yapmak (siz)</li>\n<li>bilmek (onlar)</li>\n</ol>\n<p><strong>Упр. 17.3 — <code>-an</code> или <code>-dık</code>?</strong>\n<em>(„-an“ mı, „-dık“ mı?)</em></p>\n<ol type=\"1\">\n<li>мъжът, който работи → (çalışmak) ___ adam</li>\n<li>книгата, която четох → (okumak, ben) ___ kitap</li>\n<li>гостът, който дойде → (gelmek) ___ misafir</li>\n<li>къщата, в която живееш → (oturmak, sen) ___ ev</li>\n<li>човекът, който знае → (bilmek) ___ kişi</li>\n<li>филмът, който гледахме → (izlemek, biz) ___ film</li>\n</ol>\n<p><strong>Упр. 17.4 — Преобразувай в причастна конструкция.</strong>\n<em>(Ortaç yapısına çevirin.)</em></p>\n<p>Пример: Bir adam çalışıyor. O adam babam. → Çalışan adam babam.</p>\n<ol type=\"1\">\n<li>Bir kız geldi. O kız arkadaşım.</li>\n<li>Bir kitap okudum. O kitap güzeldi.</li>\n<li>Bir evde oturuyorsun. O ev nerede?</li>\n<li>Bir şirkette çalışıyor. O şirket büyük.</li>\n</ol>\n<p><strong>Упр. 17.5 — Бъдещо причастие <code>-acak</code>.</strong>\n<em>(„-acak“ ortacı.)</em></p>\n<ol type=\"1\">\n<li>okumak (ben) + kitap</li>\n<li>gitmek (ben) + yer</li>\n<li>yapmak (sen) + iş</li>\n<li>almak (biz) + araba</li>\n</ol>\n<p><strong>Упр. 17.6 — Преведи на турски.</strong> <em>(Türkçeye\nçevirin.)</em></p>\n<ol type=\"1\">\n<li>Имам приятел, който знае турски.</li>\n<li>Книгата, която четох, беше много хубава.</li>\n<li>Къде е къщата, в която живееш?</li>\n<li>Мъжът, който чака на вратата, е баща ми.</li>\n<li>Мястото, където ще отида утре, е далече.</li>\n<li>Хората, които живеят тук, са любезни.</li>\n<li>доколкото знам</li>\n<li>както казвам</li>\n</ol>\n<hr />\n<h2 id=\"урок-18-дее
