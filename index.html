const SMOOTH = matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth';

/* ================= реч ================= */
let rate = .8, voice = null, playing = false, curEl = null;
function pickVoice(){
  const all = speechSynthesis.getVoices();
  voice = all.find(v => /^tr/i.test(v.lang)) || null;
  const w = document.getElementById('voicewarn');
  w.innerHTML = (!voice && all.length)
    ? '<div class="warn"><strong>Няма турски глас на това устройство.</strong> Текстът няма да се чуе правилно. Добави турски глас и презареди:'
      + '<br>· iPhone — Настройки → Универсален достъп → Съдържание за четене → Гласове → Türkçe'
      + '<br>· Android — Настройки → Език → Синтез на реч → добави турски</div>' : '';
}
speechSynthesis.onvoiceschanged = pickVoice; pickVoice();

/* Реже текста на парчета и решава колко да мълчи след всяко.
   Пунктуацията остава в парчето, за да я чуе и самият глас. */
function chunks(text){
  return text.replace(/^[\u2014\u2013-]\s*/,'')
             .split(/(?<=[.!?\u2026])\s+|(?<=[,;:\u2014\u2013])\s+/)
             .map(s => s.trim()).filter(Boolean)
             .map(s => ({
               t: s,
               gap: /[.!?\u2026]["\u201d\u00bb)]?$/.test(s) ? 620      // край на изречение
                  : /[:;]$/.test(s)                          ? 380      // двоеточие, точка и запетая
                  : /[,\u2014\u2013]$/.test(s)               ? 230      // запетая, тире
                  :                                            300
             }));
}
function speak(text, el, cb){
  speechSynthesis.cancel();
  if(curEl) curEl.classList.remove('speaking');
  curEl = el || null; if(curEl) curEl.classList.add('speaking');
  if(text.length === 1 && LETTER_NAMES[trLower(text)]) text = LETTER_NAMES[trLower(text)];
  const parts = text.length > 40 ? chunks(text) : [{t:text.replace(/^[\u2014\u2013-]\s*/,''), gap:0}];
  let i = 0;
  const finish = () => { if(curEl){curEl.classList.remove('speaking'); curEl=null;} cb && cb(); };
  const next = () => {
    if(i >= parts.length) return finish();
    const p = parts[i++];
    const u = new SpeechSynthesisUtterance(p.t);
    u.lang = 'tr-TR'; if(voice) u.voice = voice; u.rate = rate; u.pitch = 1;
    // при по-бавна скорост паузата също се разтяга
    u.onend = () => setTimeout(next, i >= parts.length ? 0 : Math.round(p.gap / Math.max(rate, .5)));
    u.onerror = finish;
    speechSynthesis.speak(u);
  };
  next();
}

function stop(){
  playing = false; speechSynthesis.cancel();
  if(curEl){curEl.classList.remove('speaking'); curEl=null;}
  document.querySelectorAll('.line.on').forEach(x=>x.classList.remove('on'));
  document.querySelectorAll('.playing').forEach(x=>x.classList.remove('playing'));
}

/* ---- разпознаване на турски текст ---- */
const CYR = /[\u0400-\u04FF]/;
const LAT = /[A-Za-zçğıöşüÇĞİÖŞÜ]/;
const LETTER_NAMES = {a:'a',b:'be',c:'ce','ç':'çe',d:'de',e:'e',f:'fe',g:'ge','ğ':'yumuşak ge',h:'he','ı':'ı',i:'i',j:'je',k:'ke',l:'le',m:'me',n:'ne',o:'o','ö':'ö',p:'pe',r:'re',s:'se','ş':'şe',t:'te',u:'u','ü':'ü',v:'ve',y:'ye',z:'ze'};
function isTr(s){ s = (s||'').trim(); return s.length >= 1 && LAT.test(s) && !CYR.test(s); }
function trLower(s){ return s.replace(/I/g,'ı').replace(/İ/g,'i').toLowerCase(); }
function dedupeLetter(s){
  // клетки като „A a“, „Ç ç“, „I ı“ — една и съща буква в двата регистъра
  const m = s.match(/^(\S)\s+(\S)$/);
  if(m && trLower(m[1]) === trLower(m[2])) return m[2];
  return s;
}
function trPart(s){
  s = (s||'').replace(/\s+/g,' ').trim();
  s = dedupeLetter(s);
  // 1) винаги режи на тирето-разделител: „türkçe — превод“
  for(const sep of [' — ',' – ',' -- ',' - ']){
    const k = s.indexOf(sep);
    if(k > 0){ const head = s.slice(0, k).trim(); if(isTr(head)) return clean(head); }
  }
  // 2) режи преди скоба или двоеточие с обяснение
  const m = s.match(/^([^(\u2014\u2013:]+)/);
  if(m && isTr(m[1])) return clean(m[1]);
  return isTr(s) ? clean(s) : '';
}
function clean(s){
  return s.replace(/\s*\([^)]*\)\s*$/,'')          // скоби накрая
          .replace(/[\s.\-–—]*\b\d[\d:.]*\s*$/,'')     // час/число накрая: 4:15, 1:00
          .replace(/\s*[·•]\s*$/,'')
          .trim();
}


/* ================= учебник: рязане на уроци ================= */
const kids = [...RAW.children];
const CH = [];           // {part, title, nodes[]}
const KEY = {};          // ключ с отговорите по номер на урок
const KEYX = {};         // ключ по заглавие (глави без номер)
let part = '', cur = null, inKey = false, keyCur = null;
for(const n of kids){
  if(n.tagName === 'H1'){
    part = n.textContent.replace(/\s+/g,' ').trim();
    inKey = /КЛЮЧ\s+С\s+ОТГОВОРИТЕ/i.test(part);
    continue;
  }
  if(inKey){                                   // ключът не влиза в навигацията
    if(n.tagName === 'H2'){
      const t = n.textContent.replace(/\s+/g,' ').trim();
      const m = t.match(/(\d+)/);
      const kind = /ЧЕТИВО/i.test(t) ? 'r' : 'l';     // урок и четиво с един номер са различни ключове
      keyCur = m ? (KEY[kind+m[1]] = KEY[kind+m[1]] || [])
                 : (KEYX[t.toLowerCase()] = KEYX[t.toLowerCase()] || []);
      continue;
    }
    if(keyCur) keyCur.push(n);
    continue;
  }
  if(n.tagName === 'H2'){
    cur = {part, title:n.textContent.replace(/\s+/g,' ').trim(), nodes:[n]};
    CH.push(cur); continue;
  }
  if(!cur){ cur = {part:'', title:'Начало', nodes:[]}; CH.push(cur); }
  cur.nodes.push(n);
}
for(let i = CH.length - 1; i >= 0; i--){        // глава, съставена само от отговори → в ключа
  const ch = CH[i];
  const ps = ch.nodes.filter(n => n.tagName === 'P');
  const tags = ps.filter(p => /^[\dПЧНТ]+\.\d+$/.test(p.textContent.trim()));
  if(ps.length && tags.length >= 3 && tags.length >= ps.length * .6 && !ch.nodes.some(n => n.tagName === 'H3')){
    KEYX[ch.title.toLowerCase()] = ch.nodes.filter(n => n.tagName !== 'H2');
    CH.splice(i, 1);
  }
}
CH.forEach(ch => { ch.text = ch.nodes.map(n => n.textContent).join(' ').replace(/\s+/g,' ').toLowerCase(); });

function chId(ch){
  const m = (ch.title||'').match(/^(УРОК|ЧЕТИВО)\s*(\d+)/i);
  if(m) return (/ЧЕТИВО/i.test(m[1]) ? 'r' : 'l') + m[2];
  return 'c:' + (ch.title||'').toLowerCase().replace(/[^\wа-яçğıöşü]+/gi,'-').slice(0,48);
}
function keyFor(ch){
  const m = (ch.title||'').match(/^(УРОК|ЧЕТИВО)\s*(\d+)/i);
  if(m){
    const k = (/ЧЕТИВО/i.test(m[1]) ? 'r' : 'l') + m[2];
    if(KEY[k]) return KEY[k];
  }
  const t = (ch.title||'').toLowerCase();
  for(const k in KEYX){
    if(k.split(/\s+/).some(w => w.length > 5 && t.includes(w))) return KEYX[k];
  }
  return null;
}

/* ---- снимки от Wikipedia (изисква интернет) ---- */
let picCache = {};
try{ picCache = JSON.parse(localStorage.getItem('tr_pics') || '{}'); }catch(e){}
function savePics(){ try{ localStorage.setItem('tr_pics', JSON.stringify(picCache)); }catch(e){} }

function applyPic(fig){
  const t = fig.dataset.wiki, url = picCache[t];
  if(!url || fig.querySelector('img')) return;
  const img = new Image();
  img.alt = fig.dataset.tr; img.loading = 'lazy'; img.referrerPolicy = 'no-referrer';
  img.onload = () => img.classList.add('loaded');
  img.onerror = () => { delete picCache[t]; savePics(); img.remove(); };
  img.src = url;
  fig.querySelector('.pic-img').appendChild(img);
}

async function fetchOne(title){
  const u = 'https://en.wikipedia.org/api/rest_v1/page/summary/' + encodeURIComponent(title.replace(/ /g,'_'));
  const r = await fetch(u, {headers:{'Accept':'application/json'}});
  const d = await r.json();
  const src = (d.thumbnail && d.thumbnail.source) || (d.originalimage && d.originalimage.source);
  if(!src) throw new Error('няма изображение');
  return src;
}

async function loadPics(root){
  const figs = [...root.querySelectorAll('figure.pic[data-wiki]')];
  if(!figs.length) return;
  figs.forEach(applyPic);
  const need = [...new Set(figs.filter(f => !picCache[f.dataset.wiki]).map(f => f.dataset.wiki))];
  let bar = root.querySelector('#picbar');
  if(!bar){
    bar = document.createElement('div'); bar.className = 'picbar'; bar.id = 'picbar';
    const grid = root.querySelector('.picgrid');
    if(grid) grid.parentNode.insertBefore(bar, grid); else root.appendChild(bar);
  }
  if(!need.length){ if(bar) bar.remove(); return; }
  if(bar) bar.textContent = 'Зареждам снимките от Wikipedia… 0 от ' + need.length;

  let ok = 0, fail = 0;
  for(let i = 0; i < need.length; i += 6){
    await Promise.all(need.slice(i, i+6).map(t =>
      fetchOne(t).then(src => { picCache[t] = src; ok++; }).catch(() => { fail++; })
    ));
    savePics();
    figs.forEach(applyPic);
    if(bar) bar.textContent = 'Зареждам снимките от Wikipedia… ' + (ok + fail) + ' от ' + need.length;
  }
  if(bar){
    if(ok) bar.remove();
    else bar.innerHTML = '<strong>Снимките не се заредиха.</strong> Нужен е интернет, а някои прегледвачи блокират външни изображения. '
      + 'Ако файлът е отворен в друго приложение, свали го и го отвори в Safari или Chrome.<br>'
      + '<button class="btn ghost" id="picretry" style="margin-top:8px">Опитай пак</button> '
      + '<button class="btn ghost" id="picclear" style="margin-top:8px">Забрави заредените</button>';
    const rt = root.querySelector('#picretry');
    if(rt) rt.onclick = () => loadPics(root);
    const cl = root.querySelector('#picclear');
    if(cl) cl.onclick = () => { picCache = {}; savePics(); location.reload(); };
  }
}


/* ---- таблици: подсказка за хоризонтален скрол ---- */
function markTables(root){
  root.querySelectorAll('table').forEach(t => {
    if(t.parentNode.classList.contains('tblwrap')) return;
    const w = document.createElement('div'); w.className = 'tblwrap';
    t.parentNode.insertBefore(w, t); w.appendChild(t);
    const hint = document.createElement('span');
    hint.className = 'scrollhint'; hint.textContent = 'плъзни →';
    w.appendChild(hint);
    w.tabIndex = 0;                               // скролът е достъпен и от клавиатура
    w.setAttribute('role', 'region');
    w.setAttribute('aria-label', 'Таблица (плъзга се настрани)');
    const upd = () => {
      w.classList.toggle('more', w.scrollWidth - w.clientWidth > 4);
      w.classList.toggle('end', w.scrollLeft + w.clientWidth >= w.scrollWidth - 4);
    };
    w.addEventListener('scroll', upd, {passive:true});
    upd(); setTimeout(upd, 150); addEventListener('resize', upd);
  });
}

/* ---- бутон за изслушване на цял текст ---- */
function addReadAll(root){
  root.querySelectorAll('blockquote').forEach(bq => {
    const ps = [...bq.querySelectorAll('p')].filter(p => p.dataset.tr);
    if(ps.length < 2) return;
    const b = document.createElement('button');
    b.className = 'btn ghost readall'; b.textContent = '▶ Чуй текста';
    b.onclick = () => {
      stop(); playing = true;
      let i = 0;
      const next = () => {
        if(!playing || i >= ps.length) return;
        const p = ps[i++];
        p.scrollIntoView({block:'center', behavior:SMOOTH});
        speak(p.dataset.tr, p, () => setTimeout(next, 300));
      };
      next();
    };
    bq.parentNode.insertBefore(b, bq);
  });

function norm(s){
  return (s||'').toLowerCase()
    .replace(/I/g,'ı')
    .replace(/[.,!?;:…"'’]/g,'')
    .replace(/\s+/g,' ')
    .replace(/___+/g,'')
    .trim();
}
function accepts(given, correct){
  const g = norm(given).replace(/^\d+\s*[-–—.)]\s*/,'');
  if(!g) return false;
  // варианти в скоби: „kimsin (или: sen kimsin)“
  // „1-в“ → достатъчно е да се напише само „в“
  correct = correct.replace(/^\s*\d+\s*[-–—.)]\s*/,'');
  const alts = [correct.replace(/\s*\([^)]*\)/g,'')];
  const m = correct.match(/\((?:или|veya)[:\s]*([^)]+)\)/i);
  if(m) alts.push(m[1]);
  const extra = correct.match(/\(([^)]+)\)/);
  if(extra) alts.push(correct.replace(/[()]/g,''));
  return alts.some(a => {
    const c = norm(a);
    if(!c) return false;
    if(g === c) return true;
    // отговор само с окончанието: „-im“ при пълен отговор „öğretmenim“
    const gg = g.replace(/^-/,'');
    return c.endsWith(gg) && gg.length >= 2 && c.length - gg.length <= 12;
  });
}

        inp.classList.remove('ok','bad'); fb.className = 'exfb'; fb.textContent = '';
        if(!inp.value.trim()){ empty++; fb.className='exfb try'; fb.textContent='Още не е попълнено'; return; }
        if(accepts(inp.value, cor)){ inp.classList.add('ok'); fb.className='exfb ok'; fb.textContent='Вярно'; ok++; return; }
        inp.classList.add('bad');
        r.dataset.t = (+(r.dataset.t || 0)) + 1;
        if(+r.dataset.t < 2){ fb.className='exfb try'; fb.textContent='Не е вярно — опитай пак.'; }
        else { fb.className='exfb bad'; fb.textContent='Вярното е: ' + cor; }
      });
      btns.querySelector('.exscore').textContent =
        ok + ' от ' + Math.min(rows.length, key.length) + ' верни' + (empty ? ' · ' + empty + ' непопълнени' : '');
      btns.querySelector('.check').textContent = 'Провери пак';
    };
    btns.querySelector('.check').onclick = check;
    btns.querySelector('.show').onclick = () => {
      rows.forEach((r, i) => { r.dataset.t = 2; if(key[i] !== undefined) r.querySelector('input').value = key[i]; });
      check();
    };
    btns.querySelector('.clear').onclick = () => {
      inputs().forEach(i => { i.value=''; i.classList.remove('ok','bad'); });
      rows.forEach(r => { r.dataset.t = 0; const f=r.querySelector('.exfb'); f.className='exfb'; f.textContent=''; });
      btns.querySelector('.check').textContent = 'Провери';
      btns.querySelector('.exscore').textContent='';
    };
    box.addEventListener('keydown', e => { if(e.key === 'Enter'){ e.preventDefault(); check(); } });
  });
}


/* ---- търсачка в речника ---- */
function addDictSearch(root, ch){
  const label = ((ch && ch.part) || '') + ' ' + ((ch && ch.title) || '');
  if(!/РЕЧНИК|SÖZLÜK/i.test(label)) return;
  const tables = [...root.querySelectorAll('table')];
  const figs = [...root.querySelectorAll('figure.pic')];
  if(!tables.length && !figs.length) return;
  const box = document.createElement('div'); box.className = 'dictsearch';
  box.innerHTML = '<input type="search" placeholder="Търси дума на турски или български…" '
    + 'aria-label="Търсене в речника" autocomplete="off" autocapitalize="off" spellcheck="false">'
    + '<div class="dicthint" role="status" aria-live="polite"></div>';
  const anchor = root.querySelector('h2');
  if(anchor && anchor.nextSibling) root.insertBefore(box, anchor.nextSibling);
  else root.insertBefore(box, root.firstChild);
  const inp = box.querySelector('input'), hint = box.querySelector('.dicthint');
  const rows = [];
  tables.forEach(t => t.querySelectorAll('tbody tr').forEach(r => rows.push(r)));
  const low = s => (s||'').replace(/I/g,'ı').replace(/İ/g,'i').toLowerCase();
  inp.oninput = () => {
    const q = low(inp.value.trim());
    if(!q){
      rows.forEach(r => r.classList.remove('hidden'));
      figs.forEach(f => f.classList.remove('hidden'));
      root.querySelectorAll('table, .tblwrap, h2, h3').forEach(e => e.classList.remove('hidden'));
      hint.textContent = ''; return;
    }
    let n = 0;
    figs.forEach(f => {
      const hit = low(f.textContent).includes(q);
      f.classList.toggle('hidden', !hit);
      if(hit) n++;
    });
    rows.forEach(r => {
      const hit = low(r.textContent).includes(q);
      r.classList.toggle('hidden', !hit);
      if(hit) n++;
    });
    tables.forEach(t => {
      const any = [...t.querySelectorAll('tbody tr')].some(r => !r.classList.contains('hidden'));
      t.classList.toggle('hidden', !any);
      const wrap = t.closest('.tblwrap') || t;
      wrap.classList.toggle('hidden', !any);
      let p = wrap.previousElementSibling;
      while(p && !/^H[23]$/.test(p.tagName)) p = p.previousElementSibling;
      if(p) p.classList.toggle('hidden', !any);
    });
    hint.textContent = n ? (n === 1 ? 'Една дума' : n + ' думи') : 'Няма такава дума в този речник.';
  };
}

const PASS_PCT = 0.7;
let passed = {};
try{ passed = JSON.parse(localStorage.getItem('tr_passed') || '{}'); }catch(e){}
function savePassed(){ try{ localStorage.setItem('tr_passed', JSON.stringify(passed)); }catch(e){} }

function lessonNo(title){
  const m = (title||'').match(/^УРОК\s*(\d+)/);
  return m ? m[1] : null;
}

function shuffled(a){
  const b = a.slice();
  for(let i = b.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [b[i], b[j]] = [b[j], b[i]];
  }
  return b;
}

function buildQuiz(root, lesson){
  const qs = TESTS[lesson];
  if(!qs || !qs.length) return;
  const need = Math.max(2, Math.min(qs.length - 1, Math.ceil(qs.length * PASS_PCT)));
  const box = document.createElement('section'); box.className = 'quiz';
  box.innerHTML = '<h3>Тест · Ünite testi</h3>'
    + '<p class="qsub">' + qs.length + ' въпроса. За да отбележиш урока като научен, '
    + 'трябват поне ' + need + ' верни отговора. Може да го решаваш колкото пъти искаш.</p>';

  const picked = shuffled(qs);
  const state = new Array(picked.length).fill(null);
  picked.forEach((q, i) => {
    const it = document.createElement('div'); it.className = 'qitem';
    it.innerHTML = '<div class="qtext"><b>' + (i+1) + '.</b> ' + q.q + '</div>';
    const wrap = document.createElement('div'); wrap.className = 'qopts';
    shuffled(q.o).forEach(o => {
      const b = document.createElement('button');
      b.className = 'qopt'; b.textContent = o;
      b.type = 'button'; b.lang = 'tr';
      b.setAttribute('aria-pressed', 'false');
      b.onclick = () => {
        if(box.dataset.done) return;
        [...wrap.children].forEach(x => { x.classList.remove('sel'); x.setAttribute('aria-pressed','false'); });
        b.classList.add('sel'); b.setAttribute('aria-pressed','true'); state[i] = o;
      };
      wrap.appendChild(b);
    });
    it.appendChild(wrap);
    box.appendChild(it);
  });

  const foot = document.createElement('div'); foot.className = 'quizfoot';
  foot.innerHTML = '<button class="btn qcheck">Провери теста</button>'
    + '<button class="btn ghost qretry" hidden>Нов опит</button>'
    + '<span class="qresult"></span>';
  box.appendChild(foot);

  const res = foot.querySelector('.qresult');
  foot.querySelector('.qcheck').onclick = () => {
    const unanswered = state.filter(x => x === null).length;
    if(unanswered){
      res.className = 'qresult fail';
      res.textContent = unanswered === 1 ? 'Остана един въпрос без отговор.'
        : 'Остават ' + unanswered + ' въпроса без отговор.';
      return;
    }
    box.dataset.done = '1';
    let ok = 0;
    [...box.querySelectorAll('.qitem')].forEach((it, i) => {
      const correct = picked[i].a;
      [...it.querySelectorAll('.qopt')].forEach(b => {
        b.classList.remove('sel'); b.disabled = true;
        if(b.textContent === correct){ b.classList.add('ok'); b.setAttribute('aria-label', b.textContent + ' — верният отговор'); }
        else if(b.textContent === state[i]){ b.classList.add('bad'); b.setAttribute('aria-label', b.textContent + ' — твоят отговор, грешен'); }
      });
      if(state[i] === correct) ok++;
    });
    const done = ok >= need;
    res.className = 'qresult ' + (done ? 'pass' : 'fail');
    res.textContent = done
      ? ok + ' от ' + picked.length + ' верни. Тестът е минат — вече можеш да отбележиш урока като научен.'
      : ok + ' от ' + picked.length + ' верни, нужни са ' + need + '. Виж кои са грешните и опитай пак.';
    foot.querySelector('.qretry').hidden = false;
    if(done){ passed[lesson] = true; savePassed(); }
    updateDoneBtn();
  };
  foot.querySelector('.qretry').onclick = () => {
    const parent = box.parentNode;
    box.remove();
    buildQuizAt(parent, lesson);
  };
  return box;
}

function buildQuizAt(parent, lesson){
  const q = buildQuiz(parent, lesson);
  if(q) parent.appendChild(q);
}

function markTr(root){
  root.querySelectorAll('td,li,blockquote p,p,figure.pic').forEach(el => {
    if(el.querySelector('table,ul,ol')) return;
    const t = el.dataset.tr || trPart(el.textContent);
    if(!t) return;
    el.classList.add('tr-say');
    el.dataset.tr = t;
    el.setAttribute('aria-label', 'Чуй на турски: ' + t);
    if(el.tagName === 'FIGURE') el.setAttribute('role', 'button');
    // цялата клетка/ред е на турски → маркирай езика, за да се чете правилно
    if(el.textContent.replace(/\s+/g,' ').trim() === t) el.lang = 'tr';
    if(el.tagName !== 'TD') el.tabIndex = 0;      // клетките не влизат в tab реда
  });
}

function shortTitle(t){
  const m = (t||'').match(/^УРОК\s*(\d+)/i);
  if(m) return 'Урок ' + m[1];
  return (t||'').split(' · ')[0];
}

    if(!h.id) h.id = 'sec-' + i + '-' + Math.random().toString(36).slice(2,6);
    const a = document.createElement('button');   // бутон, не <a href="#…">: в iframe-а
    a.type = 'button';                              // всеки href отваря външен диалог
    a.textContent = h.textContent.replace(/\s+/g,' ').trim();
    a.onclick = () => h.scrollIntoView({block:'start', behavior:SMOOTH});
    nav.appendChild(a);
  });
  const h2 = box.querySelector('h2');
  if(h2 && h2.nextSibling) box.insertBefore(nav, h2.nextSibling); else box.insertBefore(nav, box.firstChild);
}

/* ключът с отговорите — сгънат в края на урока, не в навигацията */
function addAnswerKey(root, ch){
  const nodes = keyFor(ch);
  if(!nodes || !nodes.length) return;
  const d = document.createElement('details'); d.className = 'ansbox';
  const sum = document.createElement('summary');
  sum.textContent = 'Ключ с отговорите · Cevap anahtarı';
  d.appendChild(sum);
  nodes.forEach(n => d.appendChild(n.cloneNode(true)));
  d.addEventListener('toggle', () => { if(d.open){ markTr(d); markTables(d); } }, {once:false});
  root.appendChild(d);
}

function showChapter(i){
  stop(); idx = Math.max(0, Math.min(CH.length-1, i));
  const ch = CH[idx];
  view.innerHTML = '';
  const box = document.createElement('article'); box.className = 'card card--plain';
  if(ch.part) box.innerHTML = '<div class="crumb">' + ch.part + '</div>';
  ch.nodes.forEach(n => box.appendChild(n.cloneNode(true)));
  view.appendChild(box);
  markTr(box);
  markTables(box);
  addDictSearch(box, ch);
  buildExercises(box);
  addReadAll(box);
  addToc(box);
  loadPics(box);

  const lesson = lessonNo(ch.title);
  if(lesson && TESTS[lesson]) buildQuizAt(view, lesson);
  addAnswerKey(view, ch);

  const pg = document.createElement('div'); pg.className = 'pager';
  const label = k => CH[k] ? shortTitle(CH[k].title) : '';
  pg.innerHTML = '<button id="prev">← ' + (idx > 0 ? label(idx-1) : 'Назад') + '</button>'
    + '<button id="next">' + (idx < CH.length-1 ? label(idx+1) : 'Напред') + ' →</button>';
  view.appendChild(pg);
  pg.querySelector('#prev').disabled = idx === 0;
  pg.querySelector('#next').disabled = idx === CH.length-1;
  pg.querySelector('#prev').onclick = () => { showChapter(idx-1); scrollTo(0,0); };
  pg.querySelector('#next').onclick = () => { showChapter(idx+1); scrollTo(0,0); };

  setScreen('chapter');
  document.getElementById('title').textContent = shortTitle(ch.title);
  updateDoneBtn();
  try{ localStorage.setItem('tr_last_id', chId(ch)); }catch(e){}
  buildNav();
}

/* ---------- групиране по нива ---------- */
const GROUPS = [
  {id:'howto', name:'Как да ползваш',  sub:'Карта, нотация, термини',    part:/КАК ДА ПОЛЗВАШ/,  bar:false},
  {id:'a1',    name:'Ниво A1',         sub:'Основи · уроци 1–10',        part:/УЧЕБНИК A1/,      bar:true, tag:'A1'},
  {id:'a2',    name:'Ниво A2',         sub:'Част II · уроци 11–20',      part:/ЧАСТ II(?!I)/,    bar:true, tag:'A2'},
  {id:'b1',    name:'Ниво B1',         sub:'Част III · уроци 21–27',     part:/ЧАСТ III/,        bar:true, tag:'B1'},
  {id:'read',  name:'Четива',          sub:'Текстове с речник и въпроси',part:/ЧЕТИВА/,          bar:true},
  {id:'dlg',   name:'Диалози',         sub:'Десет озвучени ситуации',    part:null,              bar:false},
  {id:'dict',  name:'Речник',          sub:'По уроци и азбучен',         part:/^РЕЧНИК/,         bar:false},
  {id:'pics',  name:'Картинен речник', sub:'Четири теми със снимки',     part:/КАРТИНЕН/,        bar:false},
  {id:'app',   name:'Приложения',      sub:'Справочни таблици',          part:/ПРИЛОЖЕНИЯ/,      bar:false},
];
function groupOf(ch){
  const g = GROUPS.find(g => g.part && g.part.test((ch && ch.part) || ''));
  return g ? g.id : 'howto';
}
function groupItems(id){
  const out = [];
  CH.forEach((ch, i) => { if(groupOf(ch) === id) out.push(i); });
  return out;
}
function groupProgress(id){
  const items = groupItems(id);
  const done = items.filter(i => isDone(i)).length;
  return {done, total: items.length, pct: items.length ? Math.round(done/items.length*100) : 0};
}
const escH = t => String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
const lowTr = t => (t||'').replace(/I/g,'ı').replace(/İ/g,'i').toLowerCase();

/* ---------- инсталация (PWA) ---------- */
let deferredPrompt = null;
const isStandalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
const isIOS = /iP(hone|ad|od)/.test(navigator.platform || '') ||
              (/Mac/.test(navigator.platform || '') && navigator.maxTouchPoints > 1);
async function installNow(){
  if(deferredPrompt){
    deferredPrompt.prompt();
    const { outcome } = await deferredPrompt.userChoice;
    deferredPrompt = null;
    if(outcome === 'accepted'){ const ib = document.getElementById('install'); if(ib) ib.hidden = true; }
    return;
  }
  toast('Отвори менюто за споделяне в Safari и избери „Към началния екран“.');
}

let screen = 'home';                      // home | list | chapter
const home = document.getElementById('home');

function setScreen(name){
  screen = name;
  home.hidden = (name !== 'home' && name !== 'list') || tab !== 'book';
  view.hidden = name !== 'chapter' || tab !== 'book';
  const b = document.getElementById('menu');

function barHtml(p){
  return '<div class="bar' + (p.total && p.done === p.total ? ' done' : '') + '">'
       + '<i style="width:' + p.pct + '%"></i></div>';
}

function chapterRow(i, hit){
  const ch = CH[i];
  const ln = lessonNo(ch.title);
  const testDone = ln && TESTS[ln] && passed[ln];
  const dn = isDone(i);
  const el = document.createElement('div');
  el.className = 'navitem' + (i === idx && screen === 'chapter' ? ' cur' : '')
    + (dn ? ' done' : '') + (!dn && testDone ? ' tested' : '');
  el.setAttribute('role','button'); el.tabIndex = 0;
  el.innerHTML = '<span class="dot" aria-hidden="true"></span><span>' + escH(ch.title)
    + (hit ? '<span class="hit">' + escH(hit) + '</span>' : '') + '</span>';
  const go = () => { tab = 'book'; setTab('book'); showChapter(i); scrollTo(0,0); };
  el.onclick = go;
  el.onkeydown = e => { if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); go(); } };
  return el;
}
function dialogRow(d, di){
  const el = document.createElement('div');
  el.className = 'navitem'; el.setAttribute('role','button'); el.tabIndex = 0;
  el.innerHTML = '<span class="dot" aria-hidden="true"></span><span>' + escH(d.tag + ' · ' + d.title)
    + '<span class="hit">' + escH(d.sub) + '</span></span>';
  const go = () => {
    setTab('dlg');
    const c = document.getElementById('dlg-' + di);
    if(c) setTimeout(() => c.scrollIntoView({block:'start', behavior:SMOOTH}), 60);
  };
  el.onclick = go;
  el.onkeydown = e => { if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); go(); } };

}

/* ---- начален екран ---- */
function showHome(q){
  home.innerHTML = '';
  setScreen('home');

  const box = document.createElement('div'); box.className = 'hsearch';
  box.innerHTML = '<input id="search" type="search" placeholder="Търси урок, тема или дума…" '
    + 'autocomplete="off" aria-label="Търсене в учебника">';
  home.appendChild(box);
  const inp = box.querySelector('input');
  inp.value = q || '';
  inp.oninput = () => renderHomeBody(inp.value);

  const body = document.createElement('div'); body.id = 'homebody';
  home.appendChild(body);
  renderHomeBody(q || '');
  if(q) inp.focus();
}

function renderHomeBody(q){
  const body = document.getElementById('homebody');
  if(!body) return;
  body.innerHTML = '';
  const qq = lowTr(q).trim();

  /* търсене → плосък резултат */
  if(qq){
    let shown = 0, last = null;
    CH.forEach((ch, i) => {
      let hit = '';
      const inTitle = lowTr(ch.title).includes(qq) || lowTr(ch.part).includes(qq);
      const k = ch.text.indexOf(qq);
      if(!inTitle && k < 0) return;
      if(!inTitle && k >= 0){
        hit = ch.text.slice(Math.max(0, k - 28), k + qq.length + 32).trim();
        hit = (k > 28 ? '…' : '') + hit + '…';
      }
      shown++;
      if(ch.part !== last){ last = ch.part;
        const h = document.createElement('div'); h.className = 'htitle';
        h.textContent = ch.part || '—'; body.appendChild(h);
      }
      body.appendChild(chapterRow(i, hit));
    });
    let head = false;
    DIALOGS.forEach((d, di) => {
      const hay = lowTr(d.title + ' ' + d.sub + ' ' + d.vocab + ' ' +
        d.lines.map(l => l[1] + ' ' + l[2]).join(' '));
      if(!hay.includes(qq)) return;
      shown++;
      if(!head){ head = true;
        const h = document.createElement('div'); h.className = 'htitle';
        h.textContent = 'ДИАЛОЗИ'; body.appendChild(h);
      }
      body.appendChild(dialogRow(d, di));
    });
    if(!shown){
      const e = document.createElement('p');
      e.style.color = 'var(--text-muted)';
      e.textContent = 'Нищо не съвпада с „' + q.trim() + '“. Пробвай друга дума или само част от нея.';
      body.appendChild(e);
    }
    return;
  }

  /* продължи оттам, докъдето си стигнал */
  let lastIdx = -1;
  try{
    const lid = localStorage.getItem('tr_last_id');
    if(lid) lastIdx = CH.findIndex(c => chId(c) === lid);
  }catch(e){}
  if(lastIdx >= 0){
    const h = document.createElement('div'); h.className = 'htitle';
    h.textContent = 'Продължи'; body.appendChild(h);
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'lvl-card cont';
    b.innerHTML = '<span class="lvl-head"><span class="lvl-name">' + escH(shortTitle(CH[lastIdx].title))
      + '</span><span class="lvl-tag">оттук</span></span>'
      + '<span class="lvl-sub">' + escH(CH[lastIdx].title) + '</span>';
    b.onclick = () => { setTab('book'); showChapter(lastIdx); scrollTo(0,0); };
    body.appendChild(b);
  }

  /* общ прогрес */
  const all = CH.map((_, i) => i).filter(i => {
    const g = GROUPS.find(x => x.id === groupOf(CH[i]));
    return g && g.bar;
  });
  const allDone = all.filter(i => isDone(i)).length;
  const t = document.createElement('div'); t.className = 'htitle'; t.textContent = 'Нива';
  body.appendChild(t);
  const tot = document.createElement('div'); tot.className = 'total';
  tot.innerHTML = '<b>Общ прогрес</b><span>' + allDone + ' / ' + all.length + '</span>';
  body.appendChild(tot);
  const tb = document.createElement('div');
  tb.innerHTML = barHtml({done: allDone, total: all.length,
                          pct: all.length ? Math.round(allDone/all.length*100) : 0});
  tb.firstChild.style.marginTop = '0';
  body.appendChild(tb);

  /* картите */
  const wrap = document.createElement('div'); wrap.className = 'lvlwrap';
  wrap.style.marginTop = 'var(--s4)';
  const here = tab === 'dlg' ? 'dlg' : groupOf(CH[idx]);
  GROUPS.forEach(g => {
    const n = g.id === 'dlg' ? DIALOGS.length : groupItems(g.id).length;
    if(!n) return;
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'lvl-card' + (g.bar ? '' : ' plain') + (g.id === here && screen === 'chapter' ? ' cur' : '');
    let inner = '<span class="lvl-head"><span class="lvl-name">' + g.name + '</span>'
      + (g.tag ? '<span class="lvl-tag">' + g.tag + '</span>' : '') + '</span>'
      + '<span class="lvl-sub">' + g.sub + '</span>';
    if(g.bar){
      const p = groupProgress(g.id);
      inner += barHtml(p) + '<div class="lvl-meta"><b>' + p.done + '</b> от ' + p.total + ' научени</div>';
    } else {
      inner += '<div class="lvl-meta">' + n + (g.id === 'dlg' ? ' диалога' : ' глави') + '</div>';
    }
    b.innerHTML = inner;
    b.onclick = () => showList(g.id);
    wrap.appendChild(b);
  });
  body.appendChild(wrap);

  /* настройки */
  const set = document.createElement('div'); set.className = 'hset';
  set.innerHTML = '<span class="lbl">Шрифт</span>'
    + '<button id="fsdown" aria-label="По-малък шрифт">A−</button>'
    + '<button id="fsup" aria-label="По-голям шрифт">A+</button>'
    + '<button id="theme">◐ Тъмна</button>'
    + '<button id="install" hidden>⤓ Инсталирай</button>'
    + '<span class="ver">v45</span>';
  body.appendChild(set);
  wireSettings();
}

/* ---- списък с главите на едно ниво ---- */
function showList(id){
  const g = GROUPS.find(x => x.id === id);
  if(!g) return;
  home.innerHTML = '';
  setScreen('list');

  const back = document.createElement('button');
  back.className = 'backrow'; back.type = 'button';
  back.textContent = '‹  Всички нива';
  back.onclick = () => { showHome(''); scrollTo(0,0); };
  home.appendChild(back);

  const head = document.createElement('div'); head.className = 'grouphead';
  let h = '<div class="lvl-name">' + g.name + '</div>'
        + '<div class="lvl-sub">' + g.sub + '</div>';
  if(g.bar){
    const p = groupProgress(id);
    h += barHtml(p) + '<div class="lvl-meta"><b>' + p.done + '</b> от ' + p.total
       + ' научени · ' + p.pct + '%</div>';
  }
  head.innerHTML = h;
  home.appendChild(head);

  if(id === 'dlg') DIALOGS.forEach((d, di) => home.appendChild(dialogRow(d, di)));
  else groupItems(id).forEach(i => home.appendChild(chapterRow(i, '')));

  const leg = document.createElement('div'); leg.className = 'legend';
  leg.innerHTML = '<span><i class="dot"></i>не е започнат</span>'
    + '<span><i class="dot" style="border-color:var(--goldui);border-radius:2px"></i>тестът е минат</span>'
    + '<span><i class="dot" style="background:var(--accent);border-color:var(--accent)"></i>научен</span>';
  home.appendChild(leg);
  scrollTo(0, 0);
}

function renderDialogs(){
  dlgWrap.innerHTML = '';
  const bar = document.createElement('div'); bar.className = 'dlgbar';
  const levels = ['Всички', ...[...new Set(DIALOGS.map(d => d.lvl))]];
  levels.forEach((lv, k) => {
    const b = document.createElement('button');

    b.onclick = () => {
      [...bar.children].forEach(x => x.setAttribute('aria-pressed', 'false'));
      b.setAttribute('aria-pressed', 'true');
      dlgWrap.querySelectorAll('.card--dialog').forEach(c => {
        c.style.display = (k === 0 || c.dataset.lvl === lv) ? '' : 'none';
      });
    };
    bar.appendChild(b);
  });
  dlgWrap.appendChild(bar);
  DIALOGS.forEach(d => {
    const card = document.createElement('section'); card.className = 'card card--dialog'; card.dataset.lvl = d.lvl;
    card.id = 'dlg-' + DIALOGS.indexOf(d);
    card.innerHTML =
      '<div class="dhead"><div class="dtag">'+d.lvl+' · '+d.tag+'</div><h2 class="dtitle">'+d.title+'</h2><p class="dsub">'+d.sub+'</p></div>'+
      '<ul class="lines"></ul><div class="vocab">'+d.vocab+'</div>'+
      '<div class="dfoot"><button class="btn play-all">▶ Чуй диалога</button><button class="btn ghost hide">Скрий превода</button></div>';
    const ul = card.querySelector('.lines');
    d.lines.forEach(([who, tr, bg]) => {
      const li = document.createElement('li'); li.className = 'line ' + (who==='A'?'a':'b');
      const esc = t => t.replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
      li.innerHTML = '<span class="who" aria-hidden="true">'+who+'</span>'+
        '<span class="txt"><span class="tr" lang="tr">'+tr+'</span><span class="bg">'+bg+'</span></span>'+
        '<button class="say" type="button" aria-label="Чуй репликата: '+esc(tr)+'">▶</button>';
      li.querySelector('.say').onclick = () => { stop(); li.classList.add('on'); speak(tr, null, () => li.classList.remove('on')); };
      ul.appendChild(li);
    });
    card.querySelector('.play-all').onclick = () => {
      stop(); playing = true; card.classList.add('playing');
      const items = [...card.querySelectorAll('.line')]; let i = 0;
      const next = () => {
        items.forEach(x=>x.classList.remove('on'));
        if(!playing || i >= d.lines.length){ card.classList.remove('playing'); return; }
        items[i].classList.add('on');
        items[i].scrollIntoView({block:'center', behavior:SMOOTH});
        speak(d.lines[i][1], null, () => { i++; setTimeout(next, 320); });
      };
      next();
    };
    card.querySelector('.hide').onclick = e => {
      const h = card.classList.toggle('hidebg');
      e.target.textContent = h ? 'Покажи превода' : 'Скрий превода';
    };
    dlgWrap.appendChild(card);
  });
}

function wireSettings(){

  if(th){
    const cur = document.documentElement.dataset.theme === 'dark';
    th.textContent = cur ? '☀ Светла' : '◐ Тъмна';
    th.setAttribute('aria-label', cur ? 'Включи светлата тема' : 'Включи тъмната тема');
    th.onclick = () => setTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark');
  }
  const up = document.getElementById('fsup'), dn = document.getElementById('fsdown');

let toastT = null;
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('on');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 3200);
}

function updateDoneBtn(){
  const b = document.getElementById('markdone');
  b.style.display = (tab === 'book' && screen === 'chapter') ? 'grid' : 'none';
  const lesson = lessonNo(CH[idx] && CH[idx].title);
  const locked = lesson && TESTS[lesson] && !passed[lesson];
  const dn = isDone(idx);
  b.classList.toggle('locked', !!locked && !dn);
  b.classList.toggle('isdone', dn);
  b.textContent = dn ? '✓' : (locked ? '🔒' : '✓');
  b.setAttribute('aria-pressed', dn ? 'true' : 'false');
  b.setAttribute('aria-label', locked && !dn ? 'Заключено — мини теста след урока'
    : (dn ? 'Отбелязан като научен' : 'Отбележи като научен'));
  b.dataset.locked = locked ? '1' : '';
}
document.getElementById('markdone').onclick = () => {
  const b = document.getElementById('markdone');
  const lesson = lessonNo(CH[idx] && CH[idx].title);
  if(lesson && TESTS[lesson] && !passed[lesson]){
    const q = view.querySelector('.quiz');
    toast('Първо мини теста в края на урока — после ще можеш да го отбележиш като научен.');
    if(q) q.scrollIntoView({block:'start', behavior:SMOOTH});
    b.animate([{transform:'scale(1)'},{transform:'scale(1.15)'},{transform:'scale(1)'}], {duration:260});
    return;
  }
  const id = chId(CH[idx]);
  if(done[id]) delete done[id]; else done[id] = true;
  saveDone();
  toast(done[id] ? 'Урокът е отбелязан като научен.' : 'Урокът вече не е отбелязан като научен.');
  updateDoneBtn();
  const g = groupOf(CH[idx]);
  if(GROUPS.find(x => x.id === g && x.bar)){
    const p = groupProgress(g);
    if(p.done === p.total) toast('Готово — цялото ниво „' + GROUPS.find(x=>x.id===g).name + '“ е завършено.');
  }
  buildNav();
};

function setTab(t, keep){
  tab = t; stop();
  try{ localStorage.setItem('tr_tab', t); }catch(e){}
  const book = t === 'book';
  dlgWrap.hidden = book;
  document.getElementById('tabBook').setAttribute('aria-pressed', book);
  document.getElementById('tabDlg').setAttribute('aria-pressed', !book);
  document.getElementById('tabname').textContent = book ? 'Учебник' : 'Диалози';
  document.getElementById('markdone').style.display = (book && screen === 'chapter') ? 'grid' : 'none';
  if(!book){
    home.hidden = true; view.hidden = true;
    document.getElementById('title').textContent = 'Аудио диалози A1–B1';
    document.getElementById('menu').style.visibility = 'visible';
  } else if(!keep){
    showHome('');                              // табът „Учебник“ води на началния екран
    document.getElementById('title').textContent = 'Турски език';
  }
  scrollTo(0,0);
}
document.getElementById('tabBook').onclick = () => setTab('book');
document.getElementById('tabDlg').onclick = () => setTab('dlg');
document.getElementById('stopAll').onclick = stop;
function setRate(v){
  rate = parseFloat(v);
  document.querySelectorAll('.bottom [data-rate]').forEach(x =>
    x.setAttribute('aria-pressed', parseFloat(x.dataset.rate) === rate));
  try{ localStorage.setItem('tr_rate', rate); }catch(e){}
}
document.querySelectorAll('.bottom [data-rate]').forEach(b => b.onclick = () => setRate(b.dataset.rate));

/* ---- размери на лентите, тема, шрифт, „нагоре“ ---- */
function syncBars(){
  const nb = document.querySelector('.bottom'), tb = document.querySelector('.top');
  if(nb.offsetHeight) document.documentElement.style.setProperty('--h-navbar', nb.offsetHeight + 'px');
  if(tb.offsetHeight) document.documentElement.style.setProperty('--h-topbar', tb.offsetHeight + 'px');
}
addEventListener('resize', syncBars);
addEventListener('orientationchange', () => setTimeout(syncBars, 200));

function setTheme(t){
  document.documentElement.dataset.theme = t;
  const tb = document.getElementById('theme');
  if(tb){
    tb.textContent = t === 'dark' ? '☀ Светла' : '◐ Тъмна';
    tb.setAttribute('aria-label', t === 'dark' ? 'Включи светлата тема' : 'Включи тъмната тема');
  }
  document.querySelector('meta[name=theme-color]').setAttribute('content', t === 'dark' ? '#081119' : '#0E2338');
  try{ localStorage.setItem('tr_theme', t); }catch(e){}
  setTimeout(syncBars, 0);
}

function setFs(px){
  px = Math.max(14, Math.min(22, px));
  document.documentElement.style.setProperty('--fs', px + 'px');
  try{ localStorage.setItem('tr_fs', px); }catch(e){}
  setTimeout(syncBars, 0);
}
const curFs = () => parseInt(getComputedStyle(document.documentElement).getPropertyValue('--fs'), 10) || 16;

const totop = document.getElementById('totop');
totop.onclick = () => scrollTo({top:0, behavior:SMOOTH});
addEventListener('scroll', () => totop.classList.toggle('on', scrollY > 700), {passive:true});

/* ---- възстановяване на настройките ---- */
try{
  const th = localStorage.getItem('tr_theme');
  setTheme(th || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));
  const fs = parseInt(localStorage.getItem('tr_fs') || '0', 10);
  if(fs) setFs(fs);
  const rt = parseFloat(localStorage.getItem('tr_rate') || '0');
  if(rt) setRate(rt);
}catch(e){}

try{
  if(!localStorage.getItem('tr_tip')){
    const tip = document.getElementById('tip');
    tip.hidden = false;
    document.getElementById('tipok').onclick = () => {
      tip.hidden = true;
      try{ localStorage.setItem('tr_tip', '1'); }catch(e){}
      syncBars();
    };
  }
}catch(e){}

/* ---------------- PWA: инсталация и обновяване ---------------- */
addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  deferredPrompt = e;
  const ib = document.getElementById('install');
  if(ib) ib.hidden = false;
});
addEventListener('appinstalled', () => {
  deferredPrompt = null;
  const ib = document.getElementById('install');
  if(ib) ib.hidden = true;
  toast('Готово — приложението е на началния екран.');
});

if('serviceWorker' in navigator){
  addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').then(reg => {
      reg.addEventListener('updatefound', () => {
        const sw = reg.installing;
        if(!sw) return;
        sw.addEventListener('statechange', () => {
          if(sw.state === 'installed' && navigator.serviceWorker.controller){
            toast('Има ново издание. Затвори и отвори приложението.');
          }
        });
      });
    }).catch(() => {});
    let reloading = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if(reloading) return; reloading = true;
    });
  });
}

/* бързи връзки от иконата: ?tab=dlg, ?go=dict */
const QP = new URLSearchParams(location.search);

renderDialogs();

let start = 0;
try{
  const lid = localStorage.getItem('tr_last_id');
  if(lid){ const k = CH.findIndex(c => chId(c) === lid); if(k >= 0) start = k; }
  else { const old = parseInt(localStorage.getItem('tr_last') || '0', 10); if(old && CH[old]) start = old; }
}catch(e){}

let startTab = 'book';
try{ startTab = localStorage.getItem('tr_tab') === 'dlg' ? 'dlg' : 'book'; }catch(e){}
if(QP.get('tab') === 'dlg') startTab = 'dlg';
if(QP.get('go') === 'dict'){
  const k = CH.findIndex(c => /Азбучен речник/i.test(c.title));
  if(k >= 0){ start = k; startTab = 'book'; }
}
idx = start;
if(startTab === 'dlg') setTab('dlg');
else if(QP.get('go') === 'dict') showChapter(start);   // бърза връзка → направо главата
else { setTab('book', true); showHome(''); }           // иначе началният екран
syncBars();
addEventListener('load', syncBars);
</script>
</body>
</html>
