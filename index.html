i</strong> | неговата майка |<br />\nkapı | kapı<strong>sı</strong> | неговата врата |<br />\nütü | ütü<strong>sü</strong> | неговата ютия |</div>\n<p><strong>Изключение:</strong> <code>su</code> (вода) →\n<code>su**yu**</code>, <code>ne</code> → <code>ne**yi**</code>.</p>\n<h3\nid=\"граматика-3.6-кога-изафетът-е-определен-и-кога-не-belirtili-ve-belirtisiz-tamlama\">Граматика\n3.6 — Кога изафетът е определен и кога не · Belirtili ve belirtisiz\ntamlama</h3>\n<p>Сравни двете форми:</p>\n<table>\n<colgroup>\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th>Форма</th>\n<th>Пример</th>\n<th>Значение</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td><strong>Определен</strong> (двете думи с окончание)</td>\n<td>Türk’<strong>ün</strong> kahve<strong>si</strong></td>\n<td>кафето на турчина (на конкретния човек)</td>\n</tr>\n<tr class=\"even\">\n<td><strong>Неопределен</strong> (само втората)</td>\n<td>Türk kahve<strong>si</strong></td>\n<td>турско кафе (вид кафе)</td>\n</tr>\n</tbody>\n</table>\n<p>Още двойки:</p>\n<ul>\n<li>öğrenci<strong>nin</strong> kitab<strong>ı</strong> — книгата на\nученика ↔︎ öğrenci kitab<strong>ı</strong> — ученическа книга</li>\n<li>ev<strong>in</strong> kapı<strong>sı</strong> — вратата на къщата ↔︎\nev kapı<strong>sı</strong> — входна врата</li>\n<li>çocuğ<strong>un</strong> oda<strong>sı</strong> — стаята на детето ↔︎\nçocuk oda<strong>sı</strong> — детска стая</li>\n</ul>\n<p><strong>Правило:</strong> ако можеш да кажеш „на кого/на какво“ —\nопределен изафет. Ако е вид или предназначение — неопределен.</p>\n<h3\nid=\"граматика-3.7-верижен-изафет-zincirleme-isim-tamlaması\">Граматика\n3.7 — Верижен изафет · Zincirleme isim tamlaması</h3>\n<p>Изафетът може да се навърже:</p>\n<ul>\n<li>ev<strong>in</strong> kapı<strong>sın</strong>ın\nanahtar<strong>ı</strong> — ключът на вратата на къщата</li>\n<li>Türkiye’<strong>nin</strong> başkent<strong>i</strong> — столицата\nна Турция</li>\n<li>okul<strong>un</strong> müdür<strong>ün</strong>ün\noda<strong>sı</strong> — стаята на директора на училището</li>\n</ul>\n<p>Всяка нова брънка добавя <code>-nın/-nin</code> към предишната.</p>\n<h3 id=\"граматика-3.8-притежание-с-var-yok-sahiplik-var-yok\">Граматика\n3.8 — Притежание с <code>var / yok</code> · Sahiplik: var / yok</h3>\n<p>„Имам X“ = <strong>притежателят в родителен падеж + предметът с\nпритежателен афикс + var</strong></p>\n<div class=\"line-block\">Benim kitabım var. | Имам книга. |<br />\nSenin araban var mı? | Имаш ли кола? |<br />\nOnun kardeşi yok. | Той няма брат. |<br />\nBizim evimiz var. | Имаме къща. |<br />\nSizin çocuğunuz var mı? | Имате ли деца? |<br />\nOnların parası yok. | Те нямат пари. |</div>\n<p>Отрицание и въпрос: - Benim zamanım yok. — Нямам време. - Senin paran\nvar mı? — Имаш ли пари? - Hayır, yok. — Не, нямам.</p>\n<h3 id=\"защо-е-така-neden-böyle-2\">Защо е така · Neden böyle</h3>\n<p><strong>Защо притежанието се изразява два пъти?</strong>\n<code>benim kitabım</code> съдържа „мой“ два пъти — веднъж в\nместоимението, веднъж в окончанието. Това е като българското „моята моя\nкнига“ — излишно, затова местоимението обикновено се изпуска: просто\n<code>kitabım</code>. Оставя се само за наблягане:\n„<strong>моята</strong> книга, не твоята“.</p>\n<p><strong>Защо <code>kitap</code> става <code>kitabım</code>?</strong>\nКрайните <code>p, ç, t, k</code> са „твърди“ и между две гласни се\nсмекчават — езикът не обича да спира рязко насред дума. Затова\n<code>kitap + ım</code> → <code>kitabım</code>, <code>sokak + ım</code>\n→ <code>sokağım</code>. Същото явление има и в български: „нося“ →\n„ношка“ не звучи, затова казваме „носач“.</p>\n<p><strong>Защо в изафета и двете думи получават окончание?</strong>\nЗащото турският маркира и притежателя, и притежаваното:\n<code>oda-nın</code> казва „това е притежателят“, <code>kapı-sı</code>\nказва „това е притежаваното“. Така връзката е ясна дори ако думите се\nразделят от други думи в изречението.</p>\n<h3 id=\"текст-за-четене-и-превод-okuma-ve-çeviri-metni-1\">Текст за\nчетене и превод · Okuma ve çeviri metni</h3>\n<p><strong>Ailem — Моето семейство</strong></p>\n<blockquote>\n<p>Benim adım Emre. Ailem büyük değil. Annem, babam, bir ablam ve bir\nkardeşim var. Annemin adı Fatma, babamın adı Kemal. Annem öğretmen,\nbabam mühendis. Ablamın adı Zeynep. O doktor ve İstanbul’da çalışıyor.\nKardeşim küçük, o öğrenci. Bizim evimiz Ankara’da. Evimiz büyük ve\nbahçemiz var. Bir de kedimiz var, adı Pamuk.</p>\n</blockquote>\n<p><em>Нови думи:</em> <code>çalışıyor</code> — работи;\n<code>bahçe</code> — градина; <code>bir de</code> — освен това;\n<code>kedi</code> — котка; <code>Pamuk</code> — Памук (име,\n„памук“).</p>\n<p><strong>Въпроси:</strong></p>\n<ol type=\"1\">\n<li>Emre’nin ailesi büyük mü?</li>\n<li>Annesinin adı ne?</li>\n<li>Ablası nerede çalışıyor?</li>\n<li>Onların kedisi var mı?</li>\n</ol>\n<h3 id=\"упражнения-alıştırmalar-2\">Упражнения · Alıştırmalar</h3>\n<p><strong>Упр. 3.1 — Постави притежателен афикс за 1 л. ед.ч.\n(benim).</strong> <em>(Birinci tekil kişi iyelik ekini koyun\n(benim).)</em></p>\n<ol type=\"1\">\n<li>ev</li>\n<li>kitap</li>\n<li>araba</li>\n<li>anne</li>\n<li>okul</li>\n<li>göz</li>\n<li>arkadaş</li>\n<li>sokak</li>\n</ol>\n<p><strong>Упр. 3.2 — Постави правилното окончание.</strong> <em>(Doğru\neki koyun.)</em></p>\n<ol type=\"1\">\n<li>senin ev___</li>\n<li>onun araba___</li>\n<li>bizim okul___</li>\n<li>sizin kitap___</li>\n<li>onların ev___</li>\n<li>benim anne___</li>\n</ol>\n<p><strong>Упр. 3.3 — Направи изафет.</strong> <em>(İsim tamlaması\nkurun.)</em></p>\n<ol type=\"1\">\n<li>Ali + ev</li>\n<li>öğretmen + kitap</li>\n<li>Türk + kahve</li>\n<li>ders + kitap</li>\n<li>oda + kapı</li>\n<li>okul + bahçe</li>\n</ol>\n<p><strong>Упр. 3.4 — Преведи на турски.</strong> <em>(Türkçeye\nçevirin.)</em></p>\n<ol type=\"1\">\n<li>Моята майка е учителка.</li>\n<li>Чия е тази книга?</li>\n<li>Това е колата на Ахмет.</li>\n<li>Нашата къща е в София.</li>\n<li>Имам един брат. (букв.: моят брат има)</li>\n</ol>\n<h3 id=\"допълнителни-упражнения-ek-alıştırmalar-2\">Допълнителни\nупражнения · Ek alıştırmalar</h3>\n<p><strong>Упр. 3.5 — Постави притежателния афикс за\n<code>onun</code>.</strong> <em>(„onun“ için iyelik ekini\nkoyun.)</em></p>\n<ol type=\"1\">\n<li>ev</li>\n<li>araba</li>\n<li>kitap</li>\n<li>anne</li>\n<li>okul</li>\n<li>arkadaş</li>\n</ol>\n<p><strong>Упр. 3.6 — Преведи изафетите.</strong> <em>(İsim\ntamlamalarını çevirin.)</em></p>\n<ol type=\"1\">\n<li>вратата на стаята</li>\n<li>учебник</li>\n<li>турско кафе</li>\n<li>колата на баща ми</li>\n<li>името на учителката</li>\n</ol>\n<p><strong>Упр. 3.7 — Отговори на въпроса „Kimin?“</strong>\n<em>(„Kimin?“ sorusuna cevap verin.)</em></p>\n<ol type=\"1\">\n<li>Bu kimin kitabı? (мой)</li>\n<li>Bu kimin arabası? (на Ахмет)</li>\n<li>Bunlar kimin defterleri? (наши)</li>\n<li>O kimin evi? (техен)</li>\n</ol>\n<p><strong>Упр. 3.8 — Разкажи за семейството си (5 изречения).</strong>\n<em>(Ailenizi anlatın (beş cümle).)</em></p>\n<p>Използвай: <code>Annem …</code>, <code>Babam …</code>,\n<code>Bir kardeşim var</code>, <code>Bizim evimiz …</code>.</p>\n<p><strong>Упр. 3.9 — Постави притежателния афикс за всички\nлица.</strong> <em>(Bütün kişiler için iyelik ekini koyun.)</em></p>\n<p>Пример: ev → evim, evin, evi, evimiz, eviniz, evleri</p>\n<ol type=\"1\">\n<li>kitap</li>\n<li>araba</li>\n<li>okul</li>\n<li>anne</li>\n<li>arkadaş</li>\n<li>göz</li>\n</ol>\n<p><strong>Упр. 3.10 — Определен или неопределен изафет?\nПреведи.</strong> <em>(Belirtili mi, belirtisiz mi tamlama?\nÇevirin.)</em></p>\n<ol type=\"1\">\n<li>вратата на къщата</li>\n<li>входна врата</li>\n<li>детска стая</li>\n<li>стаята на детето</li>\n<li>турско кафе</li>\n<li>кафето на Ахмет</li>\n<li>учебник</li>\n<li>книгата на учителя</li>\n</ol>\n<p><strong>Упр. 3.11 — Направи верижен изафет.</strong> <em>(Zincirleme\nisim tamlaması kurun.)</em></p>\n<ol type=\"1\">\n<li>ev + kapı + anahtar</li>\n<li>Türkiye + başkent</li>\n<li>okul + bahçe + kapı</li>\n<li>öğretmen + oda + pencere</li>\n</ol>\n<p><strong>Упр. 3.12 — Преведи с „имам / нямам“.</strong> <em>(„var /\nyok“ ile çevirin.)</em></p>\n<ol type=\"1\">\n<li>Имам две сестри.</li>\n<li>Нямам време.</li>\n<li>Имаш ли кола?</li>\n<li>Той има голяма къща.</li>\n<li>Нямаме пари.</li>\n<li>Имате ли деца?</li>\n<li>Те имат котка.</li>\n<li>Нямам брат.</li>\n</ol>\n<p><strong>Упр. 3.13 — Попълни с правилното окончание.</strong>\n<em>(Doğru ekle tamamlayın.)</em></p>\n<ol type=\"1\">\n<li>Ali___ arabası çok yeni.</li>\n<li>Oda___ kapısı açık.</li>\n<li>Benim anne___ öğretmen.</li>\n<li>Türkiye___ başkenti Ankara.</li>\n<li>Onun kardeş___ öğrenci.</li>\n<li>Bizim ev___ Sofya’da.</li>\n</ol>\n<hr />\n<h2 id=\"урок-4-падежи-okula-gidiyorum\">УРОК 4 · Падежи — Okula\ngidiyorum</h2><figure class=\"illus\">\n<svg viewBox=\"0 0 400 230\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Падежите около къщата\">\n<path d=\"M200 60 L262 105 L262 172 L138 172 L138 105 Z\" fill=\"#EAF2F6\" stroke=\"#17618F\" stroke-width=\"2\"/>\n<path d=\"M200 60 L262 105 L138 105 Z\" fill=\"#17618F\" opacity=\".15\"/>\n<rect x=\"186\" y=\"136\" width=\"28\" height=\"36\" fill=\"#17618F\" opacity=\".55\"/>\n<text x=\"200\" y=\"126\" text-anchor=\"middle\" font-size=\"17\" font-weight=\"700\" fill=\"#0E2338\">ev</text>\n<text x=\"200\" y=\"196\" text-anchor=\"middle\" font-size=\"11\" fill=\"#5C6B72\">къща</text>\n<g stroke=\"#2FA3A0\" stroke-width=\"2\" fill=\"none\" marker-end=\"url(#ah)\">\n<path d=\"M62 100 L126 118\"/><path d=\"M338 100 L274 118\"/>\n</g>\n<defs><marker id=\"ah\" markerWidth=\"8\" markerHeight=\"8\" refX=\"7\" refY=\"4\" orient=\"auto\">\n<path d=\"M0 0 L8 4 L0 8 z\" fill=\"#2FA3A0\"/></marker></defs>\n<g font-size=\"13\" font-weight=\"600\" fill=\"#0E2338\">\n<text x=\"10\" y=\"86\">ev<tspan fill=\"#C24632\">e</tspan></text>\n<text x=\"10\" y=\"122\" font-size=\"10\" font-weight=\"400\" fill=\"#5C6B72\">към къщата · nereye?</text>\n<text x=\"300\" y=\"86\">ev<tspan fill=\"#C24632\">den</tspan></text>\n<text x=\"300\" y=\"122\" font-size=\"10\" font-weight=\"400\" fill=\"#5C6B72\">от къщата · nereden?</text>\n<text x=\"200\" y=\"42\" text-anchor=\"middle\">ev<tspan fill=\"#C24632\">de</tspan>\n<tspan font-size=\"10\" font-weight=\"400\" fill=\"#5C6B72\"> — в къщата · nerede?</tspan></text>\n<text x=\"200\" y=\"218\" text-anchor=\"middle\">ev<tspan fill=\"#C24632\">i</tspan>\n<tspan font-size=\"10\" font-weight=\"400\" fill=\"#5C6B72\"> — къщата (определен обект)</tspan></text>\n</g>\n</svg>\n<figcaption>Петте основни форми на съществителното.</figcaption></figure>\n<h3 id=\"речник-sözlük-3\">Речник · Sözlük</h3>\n<table>\n<thead>\n<tr class=\"header\">\n<th>Турски</th>\n<th>Български</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>gitmek</td>\n<td>отивам</td>\n</tr>\n<tr class=\"even\">\n<td>gelmek</td>\n<td>идвам</td>\n</tr>\n<tr class=\"odd\">\n<td>bakmak</td>\n<td>гледам</td>\n</tr>\n<tr class=\"even\">\n<td>almak</td>\n<td>вземам, купувам</td>\n</tr>\n<tr class=\"odd\">\n<td>vermek</td>\n<td>давам</td>\n</tr>\n<tr class=\"even\">\n<td>görmek</td>\n<td>виждам</td>\n</tr>\n<tr class=\"odd\">\n<td>sevmek</td>\n<td>обичам</td>\n</tr>\n<tr class=\"even\">\n<td>istemek</td>\n<td>искам</td>\n</tr>\n<tr class=\"odd\">\n<td>pazar</td>\n<td>пазар</td>\n</tr>\n<tr class=\"even\">\n<td>market</td>\n<td>магазин</td>\n</tr>\n<tr class=\"odd\">\n<td>hastane</td>\n<td>болница</td>\n</tr>\n<tr class=\"even\">\n<td>lokanta / restoran</td>\n<td>ресторант</td>\n</tr>\n<tr class=\"odd\">\n<td>kütüphane</td>\n<td>библиотека</td>\n</tr>\n<tr class=\"even\">\n<td>sinema</td>\n<td>кино</td>\n</tr>\n<tr class=\"odd\">\n<td>iş yeri</td>\n<td>месторабота</td>\n</tr>\n<tr class=\"even\">\n<td>otobüs</td>\n<td>автобус</td>\n</tr>\n<tr class=\"odd\">\n<td>tren</td>\n<td>влак</td>\n</tr>\n<tr class=\"even\">\n<td>uçak</td>\n<td>самолет</td>\n</tr>\n<tr class=\"odd\">\n<td>yol</td>\n<td>път</td>\n</tr>\n<tr class=\"even\">\n<td>nereye</td>\n<td>накъде</td>\n</tr>\n<tr class=\"odd\">\n<td>nereden</td>\n<td>откъде</td>\n</tr>\n<tr class=\"even\">\n<td>şimdi</td>\n<td>сега</td>\n</tr>\n<tr class=\"odd\">\n<td>bugün</td>\n<td>днес</td>\n</tr>\n<tr class=\"even\">\n<td>yarın</td>\n<td>утре</td>\n</tr>\n<tr class=\"odd\">\n<td>dün</td>\n<td>вчера</td>\n</tr>\n</tbody>\n</table>\n<h3 id=\"граматика-4.1-дателен-падеж--a--e-към-на-yönelme-hâli\">Граматика\n4.1 — Дателен падеж: -a / -e (към, на) · Yönelme hâli</h3>\n<p>Въпрос: <strong>nereye?</strong> (накъде?), <strong>kime?</strong>\n(на кого?)</p>\n<table>\n<thead>\n<tr class=\"header\">\n<th>Последна гласна</th>\n<th>Окончание</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>a, ı, o, u</td>\n<td><strong>-a</strong></td>\n</tr>\n<tr class=\"even\">\n<td>e, i, ö, ü</td>\n<td><strong>-e</strong></td>\n</tr>\n</tbody>\n</table>\n<p>След гласна се вмъква <strong>-y-</strong>:\n<code>okul → okula</code>, но <code>araba → arabaya</code>.</p>\n<ul>\n<li>Okul<strong>a</strong> gidiyorum. — Отивам на училище.</li>\n<li>Ev<strong>e</strong> geliyorum. — Идвам вкъщи.</li>\n<li>İstanbul’<strong>a</strong> gidiyoruz. — Отиваме в Истанбул.</li>\n<li>Anneme para verdim. — Дадох пари на майка ми.</li>\n</ul>\n<h3 id=\"граматика-4.2-изходен-падеж--dan--den-от-ayrılma-hâli\">Граматика\n4.2 — Изходен падеж: -dan / -den (от) · Ayrılma hâli</h3>\n<p>Въпрос: <strong>nereden?</strong> (откъде?)</p>\n<p>След <code>ç, f, h, k, p, s, ş, t</code> → <strong>-tan /\n-ten</strong>.</p>\n<ul>\n<li>Okul<strong>dan</strong> geliyorum. — Идвам от училище.</li>\n<li>Ev<strong>den</strong> çıktım. — Излязох от къщи.</li>\n<li>Sofya’<strong>dan</strong> geldim. — Дойдох от София.</li>\n<li>Market<strong>ten</strong> ekmek aldım. — Купих хляб от\nмагазина.</li>\n</ul>\n<h3\nid=\"граматика-4.3-винителен-падеж--ı--i--u--ü-belirtme-hâli\">Граматика\n4.3 — Винителен падеж: -ı / -i / -u / -ü · Belirtme hâli</h3>\n<p>Използва се само за <strong>определен, конкретен</strong> обект. След\nгласна се вмъква <strong>-y-</strong>.</p>\n<ul>\n<li>Kitap okuyorum. — Чета книга. <em>(неопределено — без\nокончание)</em></li>\n<li>Kitab<strong>ı</strong> okuyorum. — Чета книгата. <em>(конкретна\nкнига)</em></li>\n<li>Ali’<strong>yi</strong> gördüm. — Видях Али.</li>\n<li>Araba<strong>yı</strong> aldım. — Купих колата.</li>\n<li>Sen<strong>i</strong> seviyorum. — Обичам те.</li>\n</ul>\n<p><strong>Собствените имена и личните местоимения винаги вземат\nокончание:</strong>\n<code>beni, seni, onu, bizi, sizi, onları</code>.</p>\n<h3\nid=\"граматика-4.4-обобщение-на-падежите-думата-ev-hâl-eklerinin-özeti\">Граматика\n4.4 — Обобщение на падежите (думата <code>ev</code>) · Hâl eklerinin\nözeti</h3>\n<table>\n<thead>\n<tr class=\"header\">\n<th>Падеж</th>\n<th>Форма</th>\n<th>Въпрос</th>\n<th>Превод</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>основна</td>\n<td>ev</td>\n<td>ne?</td>\n<td>къща</td>\n</tr>\n<tr class=\"even\">\n<td>винителен</td>\n<td>evi</td>\n<td>neyi?</td>\n<td>къщата (обект)</td>\n</tr>\n<tr class=\"odd\">\n<td>дателен</td>\n<td>eve</td>\n<td>nereye?</td>\n<td>към къщата</td>\n</tr>\n<tr class=\"even\">\n<td>местен</td>\n<td>evde</td>\n<td>nerede?</td>\n<td>в къщата</td>\n</tr>\n<tr class=\"odd\">\n<td>изходен</td>\n<td>evden</td>\n<td>nereden?</td>\n<td>от къщата</td>\n</tr>\n</tbody>\n</table>\n<p>С притежателен афикс се вмъква <strong>-n-</strong>:\n<code>evim → evim**i**</code>, <code>evine</code>, <code>evinde</code>,\n<code>evinden</code>; <code>arabası → arabası**n**a</code>,\n<code>arabası**n**da</code>, <code>arabası**n**dan</code>.</p>\n<h3\nid=\"граматика-4.5-кога-винителният-падеж-се-слага-и-кога-не-belirtme-hâli-ne-zaman-kullanılır\">Граматика\n4.5 — Кога винителният падеж се слага и кога не · Belirtme hâli ne zaman\nkullanılır</h3>\n<p>Това е една от най-честите грешки. Правилото:</p>\n<p><strong>СЛАГА СЕ</strong> окончание <code>-ı/-i/-u/-ü</code>, когато\nобектът е <strong>определен</strong>:</p>\n<ul>\n<li>Kitab<strong>ı</strong> okudum. — Прочетох книгата. <em>(конкретна\nкнига)</em></li>\n<li>Ali’<strong>yi</strong> gördüm. — Видях Али. <em>(собствено\nиме)</em></li>\n<li>Sen<strong>i</strong> bekliyorum. — Чакам те.\n<em>(местоимение)</em></li>\n<li>Bu film<strong>i</strong> izledim. — Гледах този филм.\n<em>(bu/şu/o)</em></li>\n<li>Araba<strong>mı</strong> sattım. — Продадох си колата. <em>(с\nпритежателен афикс)</em></li>\n</ul>\n<p><strong>НЕ СЕ СЛАГА</strong>, когато обектът е неопределен или\nобщ:</p>\n<ul>\n<li>Kitap okudum. — Четох книга (каквато и да е).</li>\n<li>Su içiyorum. — Пия вода.</li>\n<li>Her gün ekmek alırım. — Всеки ден купувам хляб.</li>\n</ul>\n<p><strong>Сравни:</strong></p>\n<table>\n<thead>\n<tr class=\"header\">\n<th>Без окончание</th>\n<th>С окончание</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Film izliyorum. — Гледам филм.</td>\n<td>Filmi izliyorum. — Гледам филма.</td>\n</tr>\n<tr class=\"even\">\n<td>Kahve içtim. — Пих кафе.</td>\n<td>Kahveyi içtim. — Изпих кафето.</td>\n</tr>\n<tr class=\"odd\">\n<td>Araba aldım. — Купих кола.</td>\n<td>Arabayı aldım. — Купих колата.</td>\n</tr>\n</tbody>\n</table>\n<h3\nid=\"граматика-4.6-глаголи-които-изискват-определен-падеж-hâl-eki-isteyen-fiiller\">Граматика\n4.6 — Глаголи, които изискват определен падеж · Hâl eki isteyen\nfiiller</h3>\n<p>Много турски глаголи „управляват“ падеж, различен от българския. Тези\nтрябва да се запомнят:</p>\n<p><strong>С дателен падеж (-a/-e):</strong></p>\n<div class=\"line-block\">başlamak | започвам (нещо) | Derse başladık.\n|<br />\nbinmek | качвам се | Otobüse bindim. |<br />\ngitmek | отивам | Okula gidiyorum. |<br />\nbakmak | гледам | Pencereye bakıyorum. |<br />\ninanmak | вярвам | Sana inanıyorum. |<br />\nsormak | питам | Öğretmene sordum. |<br />\nsöylemek | казвам (на) | Bana söyledi. |<br />\nyardım etmek | помагам | Ona yardım ettim. |</div>\n<p><strong>С изходен падеж (-dan/-den):</strong></p>\n<div class=\"line-block\">inmek | слизам | Otobüsten indim. |<br />\nkorkmak | страхувам се | Köpekten korkuyorum. |<br />\nhoşlanmak | харесвам | Bu müzikten hoşlanıyorum. |<br />\nnefret etmek | мразя | Yalandan nefret ederim. |<br />\nçıkmak | излизам | Evden çıktım. |</div>\n<p><strong>С винителен падеж:</strong></p>\n<div class=\"line-block\">sevmek | обичам | Seni seviyorum. |<br />\nbeklemek | чакам | Otobüsü bekliyorum. |<br />\naramak | търся / звъня | Seni aradım. |</div>\n<h3\nid=\"граматика-4.7-двойни-падежи-в-едно-изречение-bir-cümlede-birkaç-hâl-eki\">Граматика\n4.7 — Двойни падежи в едно изречение · Bir cümlede birkaç hâl eki</h3>\n<p>Едно изречение може да съдържа няколко падежа наведнъж:</p>\n<ul>\n<li><p><strong>Ben</strong> okul<strong>dan</strong>\nev<strong>e</strong> kitap<strong>ları</strong> götürüyorum. — Нося\nкнигите от училище вкъщи.</p></li>\n<li><p><strong>Annem</strong> market<strong>ten</strong>\nban<strong>a</strong> çikolata al<strong>dı</strong>. — Мама ми купи\nшоколад от магазина.</p></li>\n<li><p><strong>Öğretmen</strong> öğrenci<strong>ye</strong>\nsoru<strong>yu</strong> sordu. — Учителят зададе въпроса на\nученика.</p></li>\n</ul>\n<p>Ред на думите (обичаен, но гъвкав): <strong>подлог → време → място →\nадресат → обект → глагол</strong></p>\n<h3 id=\"защо-е-така-neden-böyle-3\">Защо е така · Neden böyle</h3>\n<p><strong>Защо понякога има винителен падеж, а понякога не?</strong>\nЗащото турският няма определителен член („книгата“), но му трябва начин\nда покаже дали става дума за конкретно нещо. Тази работа я върши\nвинителният падеж:</p>\n<ul>\n<li><code>Kitap okuyorum</code> = „чета някаква книга“ (≈ англ. <em>a\nbook</em>)</li>\n<li><code>Kitabı okuyorum</code> = „чета книгата“ (≈ англ. <em>the\nbook</em>)</li>\n</ul>\n<p>Тоест окончанието <code>-ı</code> тук работи като нашето „-та“.</p>\n<p><strong>Защо <code>otobüse binmek</code>, а не\n<code>otobüsü binmek</code>?</strong> Защото турският мисли за качването\nкато движение <strong>към</strong> нещо — „качвам се към автобуса“.\nЗатова е дателен падеж. По същата логика слизането е движение\n<strong>от</strong> нещо: <code>otobüsten inmek</code>. Тези глаголи\nтрябва да се учат заедно с падежа си, като в немския.</p>\n<p><strong>Защо собствените имена се пишат с апостроф?</strong>\n<code>Ali'ye</code>, <code>İstanbul'da</code> — апострофът показва къде\nсвършва името и започва окончанието, за да не се чете като част от\nимето. При нарицателните имена не се слага апостроф.</p>\n<h3 id=\"текст-за-четене-и-превод-okuma-ve-çeviri-metni-2\">Текст за\nчетене и превод · Okuma ve çeviri metni</h3>\n<p><strong>Bir gün — Един ден</strong></p>\n<blockquote>\n<p>Sabah saat yedide evden çıkıyorum. Otobüs durağına yürüyorum. Otobüs\nbeni okula götürüyor. Okulda arkadaşlarımı görüyorum. Öğleden sonra\nkütüphaneye gidiyorum ve orada kitap okuyorum. Akşam markete uğruyorum,\nekmek ve süt alıyorum. Sonra eve dönüyorum. Evde annemle çay içiyoruz ve\nkonuşuyoruz.</p>\n</blockquote>\n<p><em>Нови думи:</em> <code>sabah</code> — сутрин; <code>durak</code> —\nспирка; <code>yürümek</code> — вървя; <code>götürmek</code> — водя,\nоткарвам; <code>öğleden sonra</code> — следобед; <code>uğramak</code> —\nотбивам се; <code>ekmek</code> — хляб; <code>süt</code> — мляко;\n<code>dönmek</code> — връщам се; <code>içmek</code> — пия;\n<code>konuşmak</code> — говоря.</p>\n<p><strong>Въпроси:</strong></p>\n<ol type=\"1\">\n<li>Saat kaçta evden çıkıyor?</li>\n<li>Nereye yürüyor?</li>\n<li>Marketten ne alıyor?</li>\n<li>Evde ne yapıyorlar?</li>\n</ol>\n<h3 id=\"упражнения-alıştırmalar-3\">Упражнения · Alıştırmalar</h3>\n<p><strong>Упр. 4.1 — Постави дателен падеж (-a/-e).</strong>\n<em>(Yönelme hâli ekleyin (-a/-e).)</em></p>\n<ol type=\"1\">\n<li>okul</li>\n<li>ev</li>\n<li>İstanbul</li>\n<li>sinema</li>\n<li>araba</li>\n<li>iş</li>\n</ol>\n<p><strong>Упр. 4.2 — Постави изходен падеж\n(-dan/-den/-tan/-ten).</strong> <em>(Ayrılma hâli ekleyin\n(-dan/-den/-tan/-ten).)</em></p>\n<ol type=\"1\">\n<li>ev</li>\n<li>okul</li>\n<li>market</li>\n<li>Sofya</li>\n<li>sınıf</li>\n<li>şehir</li>\n</ol>\n<p><strong>Упр. 4.3 — Постави винителен падеж.</strong> <em>(Belirtme\nhâli ekleyin.)</em></p>\n<ol type=\"1\">\n<li>kitap</li>\n<li>araba</li>\n<li>ev</li>\n<li>Ali</li>\n<li>su</li>\n<li>öğretmen</li>\n</ol>\n<p><strong>Упр. 4.4 — Попълни правилния падеж.</strong> <em>(Doğru hâl\nekini yazın.)</em></p>\n<ol type=\"1\">\n<li>Ben okul___ gidiyorum. (към)</li>\n<li>O ev___ geliyor. (от)</li>\n<li>Biz sınıf___ oturuyoruz. (в)</li>\n<li>Kitab___ okuyorum. (определен обект)</li>\n<li>Anne___ telefon ediyorum. (на)</li>\n</ol>\n<p><strong>Упр. 4.5 — Преведи на турски.</strong> <em>(Türkçeye\nçevirin.)</em></p>\n<ol type=\"1\">\n<li>Отивам в Истанбул.</li>\n<li>Идвам от училище.</li>\n<li>Виждам Али.</li>\n<li>Той е вкъщи.</li>\n<li>Купувам хляб от магазина.</li>\n</ol>\n<h3 id=\"допълнителни-упражнения-ek-alıştırmalar-3\">Допълнителни\nупражнения · Ek alıştırmalar</h3>\n<p><strong>Упр. 4.6 — Постави правилния падеж.</strong> <em>(Doğru hâl\nekini koyun.)</em></p>\n<ol type=\"1\">\n<li>Her sabah okul___ gidiyorum.</li>\n<li>Akşam iş___ dönüyorum.</li>\n<li>Kitab___ masaya koydum.</li>\n<li>Ali___ bir mektup yazdım.</li>\n<li>İstanbul___ çok seviyorum.</li>\n<li>Market___ süt aldım.</li>\n</ol>\n<p><strong>Упр. 4.7 — Отговори на въпроса.</strong> <em>(Soruya cevap\nverin.)</em></p>\n<ol type=\"1\">\n<li>Nereye gidiyorsun? (на училище)</li>\n<li>Nereden geliyorsun? (от вкъщи)</li>\n<li>Nerede oturuyorsun? (в София)</li>\n<li>Kimi bekliyorsun? (Айше)</li>\n</ol>\n<p><strong>Упр. 4.8 — Nereye, nerede или nereden?</strong> <em>(Nereye,\nnerede, nereden?)</em></p>\n<ol type=\"1\">\n<li>___ oturuyorsun? — Sofya’da.</li>\n<li>___ gidiyorsun? — Okula.</li>\n<li>___ geliyorsun? — Marketten.</li>\n<li>___ çalışıyorsun? — Bir bankada.</li>\n</ol>\n<p><strong>Упр. 4.9 — Съедини в изречение.</strong> <em>(Cümle\nkurun.)</em></p>\n<ol type=\"1\">\n<li>ben / ev / gitmek</li>\n<li>o / okul / gelmek</li>\n<li>biz / sinema / gitmek</li>\n<li>sen / market / ekmek / almak</li>\n</ol>\n<p><strong>Упр. 4.10 — Със или без винителен падеж?</strong>\n<em>(Belirtme hâli ekli mi, eksiz mi?)</em></p>\n<ol type=\"1\">\n<li>Dün akşam film ___ izledim. (конкретен филм)</li>\n<li>Her gün gazete ___ okurum. (каквато и да е)</li>\n<li>Ali ___ gördün mü? (собствено име)</li>\n<li>Su ___ içiyorum. (просто вода)</li>\n<li>Bu kitap ___ çok sevdim. (тази книга)</li>\n<li>Ekmek ___ aldım. (хляб изобщо)</li>\n<li>Araba ___ sattı. (своята кола)</li>\n<li>Kahve ___ ister misin? (кафе изобщо)</li>\n</ol>\n<p><strong>Упр. 4.11 — Кой падеж иска глаголът?</strong> <em>(Fiil hangi\nhâli ister?)</em></p>\n<ol type=\"1\">\n<li>Otobüs___ bindim.</li>\n<li>Otobüs___ indim.</li>\n<li>Köpek___ korkuyorum.</li>\n<li>Ders___ başladık.</li>\n<li>Sen___ inanıyorum.</li>\n<li>Öğretmen___ sordum.</li>\n<li>Seni___ bekliyorum.</li>\n<li>Ev___ çıktım.</li>\n</ol>\n<p><strong>Упр. 4.12 — Постави всички падежни форми.</strong> <em>(Bütün\nhâl eklerini yazın.)</em></p>\n<p>Пример: okul → okulu, okula, okulda, okuldan</p>\n<ol type=\"1\">\n<li>ev</li>\n<li>araba</li>\n<li>kitap</li>\n<li>şehir</li>\n<li>sokak</li>\n<li>anne</li>\n</ol>\n<p><strong>Упр. 4.13 — Съедини в едно изречение с всички\nпадежи.</strong> <em>(Bütün hâl ekleriyle tek cümle kurun.)</em></p>\n<p>Пример: ben / market / ev / ekmek / götürmek → Ben marketten eve\nekmek götürüyorum.</p>\n<ol type=\"1\">\n<li>o / okul / ev / kitap / getirmek</li>\n<li>anne / market / ben / çikolata / almak</li>\n<li>öğretmen / öğrenci / soru / sormak</li>\n<li>biz / İstanbul / Ankara / tren / gitmek</li>\n</ol>\n<p><strong>Упр. 4.14 — Преведи на турски.</strong> <em>(Türkçeye\nçevirin.)</em></p>\n<ol type=\"1\">\n<li>Чакам автобуса.</li>\n<li>Обичам те.</li>\n<li>Страхувам се от кучета.</li>\n<li>Качих се на автобуса.</li>\n<li>Слязох от автобуса.</li>\n<li>Помогнах му.</li>\n<li>Питах учителя.</li>\n<li>Гледам през прозореца.</li>\n</ol>\n<hr />\n<h2 id=\"падежите-подробно-hâl-ekleri-ayrıntılı\">ПАДЕЖИТЕ ПОДРОБНО · Hâl\nekleri ayrıntılı</h2><figure class=\"illus\">\n<svg viewBox=\"0 0 400 230\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Падежите около къщата\">\n<path d=\"M200 60 L262 105 L262 172 L138 172 L138 105 Z\" fill=\"#EAF2F6\" stroke=\"#17618F\" stroke-width=\"2\"/>\n<path d=\"M200 60 L262 105 L138 105 Z\" fill=\"#17618F\" opacity=\".15\"/>\n<rect x=\"186\" y=\"136\" width=\"28\" height=\"36\" fill=\"#17618F\" opacity=\".55\"/>\n<text x=\"200\" y=\"126\" text-anchor=\"middle\" font-size=\"17\" font-weight=\"700\" fill=\"#0E2338\">ev</text>\n<text x=\"200\" y=\"196\" text-anchor=\"middle\" font-size=\"11\" fill=\"#5C6B72\">къща</text>\n<g stroke=\"#2FA3A0\" stroke-width=\"2\" fill=\"none\" marker-end=\"url(#ah)\">\n<path d=\"M62 100 L126 118\"/><path d=\"M338 100 L274 118\"/>\n</g>\n<defs><marker id=\"ah\" markerWidth=\"8\" markerHeight=\"8\" refX=\"7\" refY=\"4\" orient=\"auto\">\n<path d=\"M0 0 L8 4 L0 8 z\" fill=\"#2FA3A0\"/></marker></defs>\n<g font-size=\"13\" font-weight=\"600\" fill=\"#0E2338\">\n<text x=\"10\" y=\"86\">ev<tspan fill=\"#C24632\">e</tspan></text>\n<text x=\"10\" y=\"122\" font-size=\"10\" font-weight=\"400\" fill=\"#5C6B72\">към къщата · nereye?</text>\n<text x=\"300\" y=\"86\">ev<tspan fill=\"#C24632\">den</tspan></text>\n<text x=\"300\" y=\"122\" font-size=\"10\" font-weight=\"400\" fill=\"#5C6B72\">от къщата · nereden?</text>\n<text x=\"200\" y=\"42\" text-anchor=\"middle\">ev<tspan fill=\"#C24632\">de</tspan>\n<tspan font-size=\"10\" font-weight=\"400\" fill=\"#5C6B72\"> — в къщата · nerede?</tspan></text>\n<text x=\"200\" y=\"218\" text-anchor=\"middle\">ev<tspan fill=\"#C24632\">i</tspan>\n<tspan font-size=\"10\" font-weight=\"400\" fill=\"#5C6B72\"> — къщата (определен обект)</tspan></text>\n</g>\n</svg>\n<figcaption>Петте основни форми на съществителното.</figcaption></figure>\n<p>Това е най-важната глава в A1. Ако разбереш падежите, половината\nтурска граматика става лесна. Прочети я сега бегло, върни се към нея\nслед Урок 4 и я използвай като справочник, докато не ти влезе в\nкръвта.</p>\n<h3 id=\"каква-работа-вършат-падежите\">Каква работа вършат падежите</h3>\n<p>Българският показва ролята на думата с <strong>предлог</strong> и с\n<strong>словоред</strong>. Турският я показва с\n<strong>окончание</strong> в края на думата — и затова редът на думите е\nсвободен.</p>\n<table>\n<thead>\n<tr class=\"header\">\n<th>Български</th>\n<th>Турски</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Отивам <strong>в</strong> училище</td>\n<td>Okul<strong>a</strong> gidiyorum</td>\n</tr>\n<tr class=\"even\">\n<td>Идвам <strong>от</strong> училище</td>\n<td>Okul<strong>dan</strong> geliyorum</td>\n</tr>\n<tr class=\"odd\">\n<td><strong>В</strong> училище съм</td>\n<td>Okul<strong>da</strong>yım</td>\n</tr>\n<tr class=\"even\">\n<td>Обичам училище<strong>то</strong></td>\n<td>Okul<strong>u</strong> seviyorum</td>\n</tr>\n<tr class=\"odd\">\n<td>Вратата <strong>на</strong> училището</td>\n<td>Okul<strong>un</strong> kapısı</td>\n</tr>\n</tbody>\n</table>\n<p>Забележи: една и съща дума <code>okul</code>, пет различни окончания,\nпет различни значения.</p>\n<hr />\n<h3 id=\"основен-падеж-yalın-hâl\">1. Основен падеж · Yalın hâl</h3>\n<p><strong>Окончание:</strong> няма <strong>Въпрос:</strong>\n<em>ne?</em> (какво?), <em>kim?</em> (кой?)</p>\n<p>Това е формата от речника. Използва се, когато думата е:</p>\n<ul>\n<li><strong>подлог:</strong> <code>Ali geldi.</code> — Али дойде.</li>\n<li><strong>неопределено допълнение:</strong>\n<code>Kitap okuyorum.</code> — Чета книга (каквато и да е).</li>\n<li><strong>именно сказуемо:</strong> <code>O doktor.</code> — Той е\nлекар.</li>\n</ul>\n<hr />\n<h3 id=\"винителен-падеж-belirtme-hâli\">2. Винителен падеж · Belirtme\nhâli</h3>\n<p><strong>Окончание:</strong> -ı / -i / -u / -ü <em>(след гласна: -yı /\n-yi / -yu / -yü)</em> <strong>Въпрос:</strong> <em>neyi?</em> (какво?),\n<em>kimi?</em> (кого?)</p>\n<table>\n<colgroup>\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th>Последна гласна</th>\n<th>Окончание</th>\n<th>Пример</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>a, ı</td>\n<td>-ı</td>\n<td>kız → kız<strong>ı</strong></td>\n</tr>\n<tr class=\"even\">\n<td>e, i</td>\n<td>-i</td>\n<td>ev → ev<strong>i</strong></td>\n</tr>\n<tr class=\"odd\">\n<td>o, u</td>\n<td>-u</td>\n<td>okul → okul<strong>u</strong></td>\n</tr>\n<tr class=\"even\">\n<td>ö, ü</td>\n<td>-ü</td>\n<td>göz → göz<strong>ü</strong></td>\n</tr>\n<tr class=\"odd\">\n<td>завършва на гласна</td>\n<td>-yı/-yi/-yu/-yü</td>\n<td>araba → araba<strong>yı</strong>, kedi →\nkedi<strong>yi</strong></td>\n</tr>\n</tbody>\n</table>\n<p><strong>Кога СЕ СЛАГА</strong> — когато обектът е определен, тоест\nзнаем за кое конкретно нещо говорим:</p>\n<table>\n<thead>\n<tr class=\"header\">\n<th>Случай</th>\n<th>Пример</th>\n<th>Превод</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>собствено име</td>\n<td>Ali’<strong>yi</strong> gördüm</td>\n<td>Видях Али</td>\n</tr>\n<tr class=\"even\">\n<td>местоимение</td>\n<td>Sen<strong>i</strong> bekliyorum</td>\n<td>Чакам те</td>\n</tr>\n<tr class=\"odd\">\n<td>с bu / şu / o</td>\n<td>Bu film<strong>i</strong> izledim</td>\n<td>Гледах този филм</td>\n</tr>\n<tr class=\"even\">\n<td>с притежателен афикс</td>\n<td>Kitab<strong>ım</strong>ı kaybettim</td>\n<td>Загубих си книгата</td>\n</tr>\n<tr class=\"odd\">\n<td>вече споменато</td>\n<td>Kitab<strong>ı</strong> okudum</td>\n<td>Прочетох книгата</td>\n</tr>\n<tr class=\"even\">\n<td>единствено по рода си</td>\n<td>Güneş<strong>i</strong> görüyorum</td>\n<td>Виждам слънцето</td>\n</tr>\n</tbody>\n</table>\n<p><strong>Кога НЕ СЕ СЛАГА</strong> — когато обектът е неопределен или\nобщ:</p>\n<table>\n<thead>\n<tr class=\"header\">\n<th>Пример</th>\n<th>Превод</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Kitap okuyorum</td>\n<td>Чета книга</td>\n</tr>\n<tr class=\"even\">\n<td>Su içiyorum</td>\n<td>Пия вода</td>\n</tr>\n<tr class=\"odd\">\n<td>Her gün ekmek alırım</td>\n<td>Всеки ден купувам хляб</td>\n</tr>\n<tr class=\"even\">\n<td>Türkçe öğreniyorum</td>\n<td>Уча турски</td>\n</tr>\n</tbody>\n</table>\n<p><strong>Двойката за сравнение:</strong></p>\n<table>\n<thead>\n<tr class=\"header\">\n<th>Без окончание</th>\n<th>С окончание</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Film izliyorum. — Гледам филм.</td>\n<td>Filmi izliyorum. — Гледам филма.</td>\n</tr>\n<tr class=\"even\">\n<td>Araba aldım. — Купих кола.</td>\n<td>Arabayı aldım. — Купих колата.</td>\n</tr>\n<tr class=\"odd\">\n<td>Çay içtim. — Пих чай.</td>\n<td>Çayı içtim. — Изпих чая.</td>\n</tr>\n<tr class=\"even\">\n<td>Mektup yazdım. — Писах писмо.</td>\n<td>Mektubu yazdım. — Написах писмото.</td>\n</tr>\n</tbody>\n</table>\n<p><strong>Правило за проверка:</strong> ако на български можеш да\nсложиш „-та/-ът/-то“ или „този“, на турски трябва окончание.</p>\n<p><strong>Внимание:</strong> ако между обекта и глагола застане друга\nдума, окончанието става задължително дори при неопределен обект:\n<code>Dün bir kitap aldım.</code> но\n<code>Bir kitab**ı** dün aldım.</code></p>\n<hr />\n<h3 id=\"дателен-падеж-yönelme-hâli\">3. Дателен падеж · Yönelme hâli</h3>\n<p><strong>Окончание:</strong> -a / -e <em>(след гласна: -ya / -ye)</em>\n<strong>Въпрос:</strong> <em>nereye?</em> (накъде?), <em>kime?</em> (на\nкого?), <em>neye?</em> (на какво?)</p>\n<table>\n<colgroup>\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th>Последна гласна</th>\n<th>Окончание</th>\n<th>Пример</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>a, ı, o, u</td>\n<td>-a</td>\n<td>okul → okul<strong>a</strong></td>\n</tr>\n<tr class=\"even\">\n<td>e, i, ö, ü</td>\n<td>-e</td>\n<td>ev → ev<strong>e</strong></td>\n</tr>\n<tr class=\"odd\">\n<td>завършва на гласна</td>\n<td>-ya / -ye</td>\n<td>araba → araba<strong>ya</strong>, kedi →\nkedi<strong>ye</strong></td>\n</tr>\n</tbody>\n</table>\n<p><strong>Значения:</strong></p>\n<table>\n<thead>\n<tr class=\"header\">\n<th>Значение</th>\n<th>Пример</th>\n<th>Превод</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>посока</td>\n<td>İstanbul’<strong>a</strong> gidiyorum</td>\n<td>Отивам в Истанбул</td>\n</tr>\n<tr class=\"even\">\n<td>получател</td>\n<td>Ali’<strong>ye</strong> verdim</td>\n<td>Дадох на Али</td>\n</tr>\n<tr class=\"odd\">\n<td>цел</td>\n<td>Sinema<strong>ya</strong> gidiyoruz</td>\n<td>Отиваме на кино</td>\n</tr>\n<tr class=\"even\">\n<td>до момент</td>\n<td>Saat üç<strong>e</strong> kadar</td>\n<td>До три часа</td>\n</tr>\n<tr class=\"odd\">\n<td>цена (за)</td>\n<td>Yüz lira<strong>ya</strong> aldım</td>\n<td>Купих го за сто лири</td>\n</tr>\n<tr class=\"even\">\n<td>според</td>\n<td>Ban<strong>a</strong> göre</td>\n<td>Според мен</td>\n</tr>\n</tbody>\n</table>\n<p><strong>Личните местоимения са неправилни:</strong></p>\n<div class=\"line-block\">ben → <strong>bana</strong> | на мен |<br />\nsen → <strong>sana</strong> | на теб |<br />\no → <strong>ona</strong> | на него |<br />\nbiz → <strong>bize</strong> | на нас |<br />\nsiz → <strong>size</strong> | на вас |<br />\nonlar → <strong>onlara</strong> | на тях |</div>\n<p><em>Внимавай:</em> <code>bana</code>, а не <code>bene</code>;\n<code>sana</code>, а не <code>sene</code>.</p>\n<hr />\n<h3 id=\"местен-падеж-bulunma-hâli\">4. Местен падеж · Bulunma hâli</h3>\n<p><strong>Окончание:</strong> -da / -de / -ta / -te\n<strong>Въпрос:</strong> <em>nerede?</em> (къде?), <em>kimde?</em> (у\nкого?)</p>\n<table>\n<thead>\n<tr class=\"header\">\n<th>Условие</th>\n<th>Окончание</th>\n<th>Пример</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>задна гласна, мека съгласна</td>\n<td>-da</td>\n<td>okul<strong>da</strong></td>\n</tr>\n<tr class=\"even\">\n<td>предна гласна, мека съгласна</td>\n<td>-de</td>\n<td>ev<strong>de</strong></td>\n</tr>\n<tr class=\"odd\">\n<td>задна гласна, след ç f h k p s ş t</td>\n<td>-ta</td>\n<td>kitap<strong>ta</strong></td>\n</tr>\n<tr class=\"even\">\n<td>предна гласна, след ç f h k p s ş t</td>\n<td>-te</td>\n<td>çiçek<strong>te</strong></td>\n</tr>\n</tbody>\n</table>\n<p><strong>Бележка за подбора:</strong> гласната се избира по\n<strong>последната гласна</strong> на думата, съгласната — по\n<strong>последната съгласна</strong>. Двете решения са независими:</p>\n<table>\n<thead>\n<tr class=\"header\">\n<th>Дума</th>\n<th>Последна гласна</th>\n<th>Последна съгласна</th>\n<th>Резултат</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>kitap</td>\n<td>a (задна)</td>\n<td>p (твърда)</td>\n<td>kitap<strong>ta</strong></td>\n</tr>\n<tr class=\"even\">\n<td>sınıf</td>\n<td>ı (задна)</td>\n<td>f (твърда)</td>\n<td>sınıf<strong>ta</strong></td>\n</tr>\n<tr class=\"odd\">\n<td>sokak</td>\n<td>a (задна)</td>\n<td>k (твърда)</td>\n<td>sokak<strong>ta</strong></td>\n</tr>\n<tr class=\"even\">\n<td>çiçek</td>\n<td>e (предна)</td>\n<td>k (твърда)</td>\n<td>çiçek<strong>te</strong></td>\n</tr>\n<tr class=\"odd\">\n<td>ev</td>\n<td>e (предна)</td>\n<td>v (мека)</td>\n<td>ev<strong>de</strong></td>\n</tr>\n<tr class=\"even\">\n<td>okul</td>\n<td>u (задна)</td>\n<td>l (мека)</td>\n<td>okul<strong>da</strong></td>\n</tr>\n</tbody>\n</table>\n<p><strong>Значения:</strong></p>\n<table>\n<thead>\n<tr class=\"header\">\n<th>Значение</th>\n<th>Пример</th>\n<th>Превод</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>място</td>\n<td>Ev<strong>de</strong>yim</td>\n<td>Вкъщи съм</td>\n</tr>\n<tr class=\"even\">\n<td>време</td>\n<td>Saat üç<strong>te</strong></td>\n<td>В три часа</td>\n</tr>\n<tr class=\"odd\">\n<td>у някого</td>\n<td>Kitap ben<strong>de</strong></td>\n<td>Книгата е у мен</td>\n</tr>\n<tr class=\"even\">\n<td>цена/мярка</td>\n<td>Yüz lira<strong>da</strong> anlaştık</td>\n<td>Спазарихме се на сто лири</td>\n</tr>\n<tr class=\"odd\">\n<td>състояние</td>\n<td>İyi bir durum<strong>da</strong></td>\n<td>В добро състояние</td>\n</tr>\n</tbody>\n</table>\n<hr />\n<h3 id=\"изходен-падеж-ayrılma-hâli\">5. Изходен падеж · Ayrılma hâli</h3>\n<p><strong>Окончание:</strong> -dan / -den / -tan / -ten\n<strong>Въпрос:</strong> <em>nereden?</em> (откъде?), <em>kimden?</em>\n(от кого?)</p>\n<p>Подборът е по същата логика като при местния падеж:\n<code>ev**den**</code>, <code>okul**dan**</code>,\n<code>kitap**tan**</code>, <code>sokak**tan**</code>,\n<code>çiçek**ten**</code></p>\n<p><strong>Значения:</strong></p>\n<table>\n<thead>\n<tr class=\"header\">\n<th>Значение</th>\n<th>Пример</th>\n<th>Превод</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>източник</td>\n<td>Ev<strong>den</strong> geliyorum</td>\n<td>Идвам от вкъщи</td>\n</tr>\n<tr class=\"even\">\n<td>от кого</td>\n<td>Ali’<strong>den</strong> duydum</td>\n<td>Чух го от Али</td>\n</tr>\n<tr class=\"odd\">\n<td>материал</td>\n<td>Tahta<strong>dan</strong> yapılmış</td>\n<td>Направено е от дърво</td>\n</tr>\n<tr class=\"even\">\n<td>причина</td>\n<td>Soğuk<strong>tan</strong> hastalandım</td>\n<td>Разболях се от студа</td>\n</tr>\n<tr class=\"odd\">\n<td>част от цяло</td>\n<td>Öğrenciler<strong>den</strong> biri</td>\n<td>Един от учениците</td>\n</tr>\n<tr class=\"even\">\n<td>сравнение</td>\n<td>Ben<strong>den</strong> uzun</td>\n<td>По-висок от мен</td>\n</tr>\n<tr class=\"odd\">\n<td>през</td>\n<td>Pencere<strong>den</strong> baktım</td>\n<td>Гледах през прозореца</td>\n</tr>\n<tr class=\"even\">\n<td>преди</td>\n<td>Yemek<strong>ten</strong> önce</td>\n<td>Преди ядене</td>\n</tr>\n<tr class=\"odd\">\n<td>след</td>\n<td>Ders<strong>ten</strong> sonra</td>\n<td>След урока</td>\n</tr>\n</tbody>\n</table>\n<hr />\n<h3 id=\"родителен-падеж-ilgi-hâli\">6. Родителен падеж · İlgi hâli</h3>\n<p><strong>Окончание:</strong> -ın / -in / -un / -ün <em>(след гласна:\n-nın / -nin / -nun / -nün)</em> <strong>Въпрос:</strong> <em>kimin?</em>\n(чий?), <em>neyin?</em> (на какво?)</p>\n<table>\n<thead>\n<tr class=\"header\">\n<th>Пример</th>\n<th>Превод</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>ev<strong>in</strong> kapısı</td>\n<td>вратата на къщата</td>\n</tr>\n<tr class=\"even\">\n<td>Ali’<strong>nin</strong> arabası</td>\n<td>колата на Али</td>\n</tr>\n<tr class=\"odd\">\n<td>araba<strong>nın</strong> rengi</td>\n<td>цветът на колата</td>\n</tr>\n<tr class=\"even\">\n<td>öğrenci<strong>nin</strong> kitabı</td>\n<td>книгата на ученика</td>\n</tr>\n</tbody>\n</table>\n<p>Родителният падеж никога не стои сам — той винаги е първата част на\nизафет, а втората дума получава притежателен афикс. Затова е разгледан\nподробно в Урок 3.</p>\n<p><strong>Личните местоимения:</strong></p>\n<div class=\"line-block\">benim | мой | senin | твой |<br />\nonun | негов | bizim | наш |<br />\nsizin | ваш | onların | техен |</div>\n<hr />\n<h3 id=\"пълна-таблица-една-дума-във-всички-падежи\">Пълна таблица: една\nдума във всички падежи</h3>\n<p><strong>ev (къща) — мека съгласна, предна гласна:</strong></p>\n<table>\n<thead>\n<tr class=\"header\">\n<th>Падеж</th>\n<th>Форма</th>\n<th>Превод</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>yalın</td>\n<td>ev</td>\n<td>къща</td>\n</tr>\n<tr class=\"even\">\n<td>belirtme</td>\n<td>evi</td>\n<td>къщата (обект)</td>\n</tr>\n<tr class=\"odd\">\n<td>yönelme</td>\n<td>eve</td>\n<td>към къщата</td>\n</tr>\n<tr class=\"even\">\n<td>bulunma</td>\n<td>evde</td>\n<td>в къщата</td>\n</tr>\n<tr class=\"odd\">\n<td>ayrılma</td>\n<td>evden</td>\n<td>от къщата</td>\n</tr>\n<tr class=\"even\">\n<td>ilgi</td>\n<td>evin</td>\n<td>на къщата</td>\n</tr>\n</tbody>\n</table>\n<p><strong>kitap (книга) — твърда съгласна, задна гласна:</strong></p>\n<div class=\"line-block\">yalın | kitap |<br />\nbelirtme | kitabı <em>(p → b)</em> |<br />\nyönelme | kitaba <em>(p → b)</em> |<br />\nbulunma | kitapta |<br />\nayrılma | kitaptan |<br />\nilgi | kitabın <em>(p → b)</em> |</div>\n<p><strong>Забележи:</strong> пред окончание, започващо с\n<strong>гласна</strong>, крайното <code>p</code> се смекчава в\n<code>b</code>. Пред окончание, започващо със <strong>съгласна</strong>,\nостава <code>p</code>.</p>\n<p><strong>araba (кола) — завършва на гласна:</strong></p>\n<div class=\"line-block\">yalın | araba |<br />\nbelirtme | arabayı |<br />\nyönelme | arabaya |<br />\nbulunma | arabada |<br />\nayrılma | arabadan |<br />\nilgi | arabanın |</div>\n<hr />\n<h3 id=\"падежи-върху-дума-с-притежателен-афикс\">Падежи върху дума с\nпритежателен афикс</h3>\n<p>Когато думата вече има притежание, пред падежното окончание се вмъква\n<strong>-n-</strong> (за 3 лице) или окончанието се лепи направо (за\nдругите лица):</p>\n<p><strong>evim (моята къща):</strong></p>\n<div class=\"line-block\">evim<strong>i</strong> | моята къща (обект)\n|<br />\nevim<strong>e</strong> | към моята къща |<br />\nevim<strong>de</strong> | в моята къща |<br />\nevim<strong>den</strong> | от моята къща |</div>\n<p><strong>evi (неговата къща) — тук се появява -n-:</strong></p>\n<div class=\"line-block\">evi<strong>n</strong>i | неговата къща (обект)\n|<br />\nevi<strong>n</strong>e | към неговата къща |<br />\nevi<strong>n</strong>de | в неговата къща |<br />\nevi<strong>n</strong>den | от неговата къща |</div>\n<p><em>Защо?</em> Защото без <code>n</code> формите биха се сблъскали:\n<code>evi + e</code> е неизговоримо, а <code>evi + de</code> би се\nобъркало с „evde“.</p>\n<p><strong>Внимание с двусмислието:</strong> <code>evinde</code> може да\nзначи „в твоята къща“ (ev-in-de) или „в неговата къща“ (ev-i-n-de).\nКонтекстът решава.</p>\n<hr />\n<h3 id=\"собствени-имена\">Собствени имена</h3>\n<p>Пред окончанието се пише <strong>апостроф</strong>:</p>\n<div class=\"line-block\">İstanbul’<strong>da</strong> | в Истанбул\n|<br />\nAnkara’<strong>ya</strong> | към Анкара |<br />\nAli’<strong>yi</strong> | Али (обект) |<br />\nAyşe’<strong>nin</strong> | на Айше |<br />\nTürkiye’<strong>den</strong> | от Турция |</div>\n<p>Апострофът показва къде свършва името. При нарицателни имена не се\nпише.</p>\n<hr />\n<h3 id=\"глаголи-с-фиксиран-падеж\">Глаголи с фиксиран падеж</h3>\n<p>Много глаголи изискват определен падеж, който не съвпада с\nбългарския. Тези се учат наизуст, заедно с падежа:</p>\n<p><strong>Дателен падеж (-a / -e):</strong></p>\n<div class=\"line-block\">başlamak | започвам | Ders<strong>e</strong>\nbaşladık |<br />\nbinmek | качвам се | Otobüs<strong>e</strong> bindim |<br />\nbakmak | гледам | Pencere<strong>ye</strong> baktım |<br />\ninanmak | вярвам | San<strong>a</strong> inanıyorum |<br />\nsormak | питам | Öğretmen<strong>e</strong> sordum |<br />\nsöylemek | казвам на | Ban<strong>a</strong> söyledi |<br />\nyardım etmek | помагам | On<strong>a</strong> yardım ettim |<br />\ngitmek | отивам | Okul<strong>a</strong> gidiyorum |<br />\nçıkmak | качвам се / излизам нагоре | Dağ<strong>a</strong> çıktık\n|<br />\nkızmak | сърдя се на | Ban<strong>a</strong> kızdı |<br />\nâşık olmak | влюбвам се в | On<strong>a</strong> âşık oldum |</div>\n<p><strong>Изходен падеж (-dan / -den):</strong></p>\n<div class=\"line-block\">inmek | слизам | Otobüs<strong>ten</strong>\nindim |<br />\nkorkmak | страхувам се от | Köpek<strong>ten</strong> korkuyorum |<br />\nhoşlanmak | харесвам | Bu müzik<strong>ten</strong> hoşlanıyorum |<br />\nnefret etmek | мразя | Yalan<strong>dan</strong> nefret ederim |<br />\nçıkmak | излизам от | Ev<strong>den</strong> çıktım |<br />\nbahsetmek | говоря за | Sen<strong>den</strong> bahsettik |<br />\nvazgeçmek | отказвам се от | Fikrim<strong>den</strong> vazgeçtim\n|<br />\nanlamak | разбирам от | Müzik<strong>ten</strong> anlarım |</div>\n<p><strong>Винителен падеж:</strong></p>\n<div class=\"line-block\">sevmek | обичам | Sen<strong>i</strong>\nseviyorum |<br />\nbeklemek | чакам | Otobüs<strong>ü</strong> bekliyorum |<br />\naramak | търся / звъня | Sen<strong>i</strong> aradım |<br />\ntanımak | познавам | On<strong>u</strong> tanıyorum |<br />\ndinlemek | слушам | Müziğ<strong>i</strong> dinliyorum |</div>\n<p><strong>Внимавай с двата смисъла на <code>çıkmak</code>:</strong>\n<code>evden çıkmak</code> (излизам от къщи) ↔︎ <code>dağa çıkmak</code>\n(качвам се на планина).</p>\n<hr />\n<h3 id=\"как-да-се-упражняваш\">Как да се упражняваш</h3>\n<p>Вземи всяка нова дума и я изговори в шестте падежа наведнъж:</p>\n<blockquote>\n<p><strong>masa</strong> — masayı, masaya, masada, masadan, masanın\n<strong>öğrenci</strong> — öğrenciyi, öğrenciye, öğrencide, öğrenciden,\nöğrencinin <strong>sokak</strong> — sokağı, sokağa, sokakta, sokaktan,\nsokağın</p>\n</blockquote>\n<p>След двадесет думи хармонията и асимилацията ще ти станат\nавтоматични.</p>\n<hr />\n<h3 id=\"чести-грешки\">Чести грешки</h3>\n<table>\n<colgroup>\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th>Грешно</th>\n<th>Правилно</th>\n<th>Защо</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td><del>bene</del></td>\n<td>bana</td>\n<td>неправилно местоимение</td>\n</tr>\n<tr class=\"even\">\n<td><del>sene</del></td>\n<td>sana</td>\n<td>неправилно местоимение</td>\n</tr>\n<tr class=\"odd\">\n<td><del>otobüsü bindim</del></td>\n<td>otobüse bindim</td>\n<td><code>binmek</code> иска дателен</td>\n</tr>\n<tr class=\"even\">\n<td><del>kitapı</del></td>\n<td>kitabı</td>\n<td>смекчаване p → b пред гласна</td>\n</tr>\n<tr class=\"odd\">\n<td><del>sokakta gidiyorum</del></td>\n<td>sokakta yürüyorum / sokağa gidiyorum</td>\n<td>място vs. посока</td>\n</tr>\n<tr class=\"even\">\n<td><del>evimde</del> за „от моята къща“</td>\n<td>evimden</td>\n<td>сбъркан падеж</td>\n</tr>\n<tr class=\"odd\">\n<td><del>İstanbulda</del></td>\n<td>İstanbul’da</td>\n<td>липсва апостроф</td>\n</tr>\n<tr class=\"even\">\n<td><del>kitapta okudum</del></td>\n<td>kitabı okudum</td>\n<td>обектът иска винителен</td>\n</tr>\n</tbody>\n</table>\n<hr />\n<h3\nid=\"упражнения-към-главата-за-падежите-hâl-ekleri-alıştırmaları\">Упражнения\nкъм главата за падежите · Hâl ekleri alıştırmaları</h3>\n<p><strong>Упр. П.1 — Постави думата в шестте падежа.</strong>\n<em>(Kelimeyi bütün hâllerde yazın.)</em></p>\n<p>Пример: ev → evi, eve, evde, evden, evin</p>\n<ol type=\"1\">\n<li>okul</li>\n<li>araba</li>\n<li>kitap</li>\n<li>sokak</li>\n<li>öğrenci</li>\n<li>göz</li>\n<li>şehir</li>\n<li>kapı</li>\n</ol>\n<p><strong>Упр. П.2 — Кой падеж липсва?</strong> <em>(Hangi hâl eki\neksik?)</em></p>\n<ol type=\"1\">\n<li>Ben İstanbul___ gidiyorum.</li>\n<li>O ev___ geliyor.</li>\n<li>Biz sınıf___ oturuyoruz.</li>\n<li>Kitab___ okudum.</li>\n<li>Bu araba Ali___ .</li>\n<li>Okul___ çıktım.</li>\n<li>Öğretmen___ sordum.</li>\n<li>Köpek___ korkuyorum.</li>\n</ol>\n<p><strong>Упр. П.3 — Със или без винителен падеж?</strong>\n<em>(Belirtme hâli ekli mi, eksiz mi?)</em></p>\n<ol type=\"1\">\n<li>Dün akşam film ___ izledim. (конкретния филм)</li>\n<li>Her gün gazete ___ okurum. (вестник изобщо)</li>\n<li>Bu kitap ___ çok sevdim. (тази книга)</li>\n<li>Su ___ içiyorum. (вода изобщо)</li>\n<li>Ali ___ gördüm. (собствено име)</li>\n<li>Türkçe ___ öğreniyorum. (турски изобщо)</li>\n<li>Araban ___ sattın mı? (твоята кола)</li>\n<li>Ekmek ___ aldım. (хляб изобщо)</li>\n</ol>\n<p><strong>Упр. П.4 — Кой падеж иска глаголът?</strong> <em>(Fiil hangi\nhâli ister?)</em></p>\n<ol type=\"1\">\n<li>Otobüs___ bindim.</li>\n<li>Otobüs___ indim.</li>\n<li>Sen___ inanıyorum.</li>\n<li>Köpek___ korkuyorum.</li>\n<li>Müzik___ dinliyorum.</li>\n<li>Ders___ başladık.</li>\n<li>Ev___ çıktım.</li>\n<li>Sen___ bekliyorum.</li>\n<li>On___ yardım ettim.</li>\n<li>Bu müzik___ hoşlanıyorum.</li>\n</ol>\n<p><strong>Упр. П.5 — Личните местоимения в дателен падеж.</strong>\n<em>(Kişi zamirleri yönelme hâlinde.)</em></p>\n<ol type=\"1\">\n<li>ben ___</li>\n<li>sen ___</li>\n<li>o ___</li>\n<li>biz ___</li>\n<li>siz ___</li>\n<li>onlar ___</li>\n</ol>\n<p><strong>Упр. П.6 — Падеж върху дума с притежателен афикс.</strong>\n<em>(İyelik ekli kelimeye hâl eki.)</em></p>\n<p>Пример: evim → evimi, evime, evimde, evimden</p>\n<ol type=\"1\">\n<li>kitabım</li>\n<li>arabası</li>\n<li>okulumuz</li>\n<li>evi</li>\n<li>annem</li>\n<li>odası</li>\n</ol>\n<p><strong>Упр. П.7 — Поправи грешката.</strong> <em>(Hatayı\ndüzeltin.)</em></p>\n<ol type=\"1\">\n<li>Bene verdi.</li>\n<li>Otobüsü bindim.</li>\n<li>Kitapı okudum.</li>\n<li>İstanbulda yaşıyorum.</li>\n<li>Sene söyledim.</li>\n<li>Evimde çıktım. (излязох от къщи)</li>\n</ol>\n<p><strong>Упр. П.8 — Преведи на турски.</strong> <em>(Türkçeye\nçevirin.)</em></p>\n<ol type=\"1\">\n<li>Отивам в Истанбул.</li>\n<li>Идвам от училище.</li>\n<li>Вкъщи съм.</li>\n<li>Прочетох книгата.</li>\n<li>Дадох му пари.</li>\n<li>Страхувам се от кучета.</li>\n<li>Купих го за сто лири.</li>\n<li>Гледах през прозореца.</li>\n<li>Разболях се от студа.</li>\n<li>По-висок си от мен.</li>\n</ol>\n<hr />\n<h2 id=\"урок-5-сегашно-време-ne-yapıyorsun\">УРОК 5 · Сегашно време — Ne\nyapıyorsun?</h2><figure class=\"illus\">\n<svg viewBox=\"0 0 400 170\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Строеж на глаголната форма\">\n<g font-size=\"14\" font-weight=\"700\" text-anchor=\"middle\">\n<rect x=\"14\" y=\"40\" width=\"86\" height=\"46\" rx=\"9\" fill=\"#17618F\"/><text x=\"57\" y=\"69\" fill=\"#fff\">gel-</text>\n<rect x=\"108\" y=\"40\" width=\"96\" height=\"46\" rx=\"9\" fill=\"#2FA3A0\"/><text x=\"156\" y=\"69\" fill=\"#06262A\">-iyor-</text>\n<rect x=\"212\" y=\"40\" width=\"80\" height=\"46\" rx=\"9\" fill=\"#C24632\"/><text x=\"252\" y=\"69\" fill=\"#fff\">-um</text>\n<rect x=\"300\" y=\"40\" width=\"86\" height=\"46\" rx=\"9\" fill=\"#fff\" stroke=\"#D6DCD8\"/><text x=\"343\" y=\"69\" fill=\"#0E2338\">=</text>\n</g>\n<g font-size=\"10\" text-anchor=\"middle\" fill=\"#5C6B72\">\n<text x=\"57\" y=\"104\">корен</text><text x=\"156\" y=\"104\">време</text><text x=\"252\" y=\"104\">лице</text>\n</g>\n<text x=\"200\" y=\"140\" text-anchor=\"middle\" font-size=\"19\" font-weight=\"700\" fill=\"#0E2338\">geliyorum\n<tspan font-size=\"12\" font-weight=\"400\" fill=\"#5C6B72\"> — идвам</tspan></text>\n<text x=\"200\" y=\"160\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"#5C6B72\">турската дума расте надясно: всяко значение е отделно парче</text>\n</svg>\n<figcaption>Аглутинация: думата се сглобява като кубчета.</figcaption></figure>\n<h3 id=\"речник-sözlük-4\">Речник · Sözlük</h3>\n<table>\n<thead>\n<tr class=\"header\">\n<th>Турски</th>\n<th>Български</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>yapmak</td>\n<td>правя</td>\n</tr>\n<tr class=\"even\">\n<td>okumak</td>\n<td>чета, уча</td>\n</tr>\n<tr class=\"odd\">\n<td>yazmak</td>\n<td>пиша</td>\n</tr>\n<tr class=\"even\">\n<td>içmek</td>\n<td>пия</td>\n</tr>\n<tr class=\"odd\">\n<td>yemek</td>\n<td>ям; ястие</td>\n</tr>\n<tr class=\"even\">\n<td>çalışmak</td>\n<td>работя, уча</td>\n</tr>\n<tr class=\"odd\">\n<td>uyumak</td>\n<td>спя</td>\n</tr>\n<tr class=\"even\">\n<td>oturmak</td>\n<td>седя, живея</td>\n</tr>\n<tr class=\"odd\">\n<td>dinlemek</td>\n<td>слушам</td>\n</tr>\n<tr class=\"even\">\n<td>izlemek</td>\n<td>гледам (филм)</td>\n</tr>\n<tr class=\"odd\">\n<td>konuşmak</td>\n<td>говоря</td>\n</tr>\n<tr class=\"even\">\n<td>beklemek</td>\n<td>чакам</td>\n</tr>\n<tr class=\"odd\">\n<td>başlamak</td>\n<td>започвам</td>\n</tr>\n<tr class=\"even\">\n<td>bitirmek</td>\n<td>завършвам</td>\n</tr>\n<tr class=\"odd\">\n<td>müzik</td>\n<td>музика</td>\n</tr>\n<tr class=\"even\">\n<td>film</td>\n<td>филм</td>\n</tr>\n<tr class=\"odd\">\n<td>yemek yapmak</td>\n<td>готвя</td>\n</tr>\n<tr class=\"even\">\n<td>su</td>\n<td>вода</td>\n</tr>\n<tr class=\"odd\">\n<td>çay</td>\n<td>чай</td>\n</tr>\n<tr class=\"even\">\n<td>kahve</td>\n<td>кафе</td>\n</tr>\n</tbody>\n</table>\n<h3\nid=\"граматика-5.1-сегашно-продължително-време-şimdiki-zaman--ıyor-şimdiki-zaman\">Граматика\n5.1 — Сегашно продължително време (şimdiki zaman): -(ı)yor · Şimdiki\nzaman</h3>\n<p>Означава действие, което се случва сега или в момента изобщо.</p>\n<p><strong>Образуване:</strong> корен на глагола (без\n<code>-mak/-mek</code>) + <code>-ıyor / -iyor / -uyor / -üyor</code> +\nлично окончание.</p>\n<table>\n<thead>\n<tr class=\"header\">\n<th>Лице</th>\n<th>Окончание</th>\n<th>Пример: <code>gelmek</code></th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>ben</td>\n<td>-um</td>\n<td>gel<strong>iyorum</strong></td>\n</tr>\n<tr class=\"even\">\n<td>sen</td>\n<td>-sun</td>\n<td>gel<strong>iyorsun</strong></td>\n</tr>\n<tr class=\"odd\">\n<td>o</td>\n<td>—</td>\n<td>gel<strong>iyor</strong></td>\n</tr>\n<tr class=\"even\">\n<td>biz</td>\n<td>-uz</td>\n<td>gel<strong>iyoruz</strong></td>\n</tr>\n<tr class=\"odd\">\n<td>siz</td>\n<td>-sunuz</td>\n<td>gel<strong>iyorsunuz</strong></td>\n</tr>\n<tr class=\"even\">\n<td>onlar</td>\n<td>-lar</td>\n<td>gel<strong>iyorlar</strong></td>\n</tr>\n</tbody>\n</table>\n<p><strong>Внимание:</strong> личните окончания след <code>-yor</code>\nвинаги са с <strong>-u-</strong>, защото <code>yor</code> съдържа\n<code>o</code>.</p>\n<p><strong>Ако коренът свършва на гласна, тя отпада:</strong> -\n<code>beklemek</code> → bekl<strong>iyorum</strong> (не beklemiyorum!) -\n<code>okumak</code> → ok<strong>uyorum</strong> - <code>yemek</code> →\ny<strong>iyorum</strong> (неправилно) - <code>demek</code> →\nd<strong>iyorum</strong> (неправилно)</p>\n<p><strong>Отрицание:</strong> корен + <code>-mı/-mi/-mu/-mü</code> +\n<code>yor</code> - gelmiyorum — не идвам - çalışmıyorsun — не работиш -\nokumuyor — не чете - görmüyoruz — не виждаме</p>\n<p><strong>Въпрос:</strong> <code>mu</code> (винаги <code>mu</code>,\nзащото пред него е <code>o</code>) - Geliyor musun? — Идваш ли? -\nÇalışıyor mu? — Работи ли? - Gelmiyor musunuz? — Не идвате ли?</p>\n<h3 id=\"граматика-5.2-редът-на-думите-kelime-sırası\">Граматика 5.2 —\nРедът на думите · Kelime sırası</h3>\n<p>Турското изречение е: <strong>подлог + допълнение + глагол</strong>.\nГлаголът е винаги накрая.</p>\n<ul>\n<li>Ben <strong>okulda Türkçe öğreniyorum.</strong> — Аз уча турски в\nучилище.</li>\n<li>Ayşe <strong>her gün kahve içiyor.</strong> — Айше пие кафе всеки\nден.</li>\n</ul>\n<h3 id=\"граматика-5.3-полезни-наречия-за-време-zaman-zarfları\">Граматика\n5.3 — Полезни наречия за време · Zaman zarfları</h3>\n<p><code>şimdi</code> (сега), <code>her gün</code> (всеки ден),\n<code>bugün</code> (днес), <code>şu anda</code> (в момента),\n<code>bazen</code> (понякога), <code>her zaman</code> (винаги),\n<code>hiç</code> (никога — с отрицание), <code>sık sık</code>\n(често).</p>\n<h3\nid=\"граматика-5.4-как-се-отнема-окончанието--mak-mek-mastar-eki-ve-fiil-kökü\">Граматика\n5.4 — Как се отнема окончанието <code>-mak/-mek</code> · Mastar eki ve\nfiil kökü</h3>\n<p>Всеки турски глагол в речника завършва на <code>-mak</code> или\n<code>-mek</code>. Това е инфинитивът. За да го спрегнеш, махаш това\nокончание и остава <strong>коренът</strong>:</p>\n<table>\n<thead>\n<tr class=\"header\">\n<th>Инфинитив</th>\n<th>Корен</th>\n<th>Значение</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>gel<strong>mek</strong></td>\n<td>gel-</td>\n<td>идвам</td>\n</tr>\n<tr class=\"even\">\n<td>yaz<strong>mak</strong></td>\n<td>yaz-</td>\n<td>пиша</td>\n</tr>\n<tr class=\"odd\">\n<td>oku<strong>mak</strong></td>\n<td>oku-</td>\n<td>чета</td>\n</tr>\n<tr class=\"even\">\n<td>görüş<strong>mek</strong></td>\n<td>görüş-</td>\n<td>виждам се</td>\n</tr>\n<tr class=\"odd\">\n<td>başla<strong>mak</strong></td>\n<td>başla-</td>\n<td>започвам</td>\n</tr>\n</tbody>\n</table>\n<p><strong>Кое окончание — -mak или -mek?</strong> Ако последната гласна\nна корена е дебела (a, ı, o, u) → <strong>-mak</strong>. Ако е тънка (e,\ni, ö, ü) → <strong>-mek</strong>.</p>\n<h3\nid=\"граматика-5.5-крайната-гласна-пред--yor--yor-önünde-ünlü-düşmesi\">Граматика\n5.5 — Крайната гласна пред <code>-yor</code> · „-yor“ önünde ünlü\ndüşmesi</h3>\n<p>Ако коренът завършва на гласна, тя <strong>отпада</strong> пред\n<code>-yor</code>:</p>\n<div class=\"line-block\">bekle- | bekl<strong>iyor</strong>um | не\nbeklemiyorum (това значи „не чакам“!) |<br />\noku- | ok<strong>uyor</strong>um | |<br />\nbaşla- | başl<strong>ıyor</strong>um | |<br />\nsöyle- | söyl<strong>üyor</strong>um | |<br />\nanla- | anl<strong>ıyor</strong>um | |<br />\nyürü- | yür<strong>üyor</strong>um | |</div>\n<p><strong>Два глагола със стеснена гласна — <code>yemek</code> и\n<code>demek</code>:</strong></p>\n<p>Корените са <code>ye-</code> и <code>de-</code>. Пред\n<code>-yor</code> гласната <code>e</code> не отпада, а се\n<strong>стеснява</strong> до <code>i</code>:</p>\n<div class=\"line-block\">yemek (ям) | y<strong>iyor</strong>um,\ny<strong>iyor</strong>sun, y<strong>iyor</strong>,\ny<strong>iyor</strong>uz |<br />\ndemek (казвам) | d<strong>iyor</strong>um, d<strong>iyor</strong>sun,\nd<strong>iyor</strong>, d<strong>iyor</strong>uz |</div>\n<p><strong>Само пред <code>-yor</code> и <code>-ecek</code>.</strong> В\nдругите времена коренът остава непроменен: <code>yedim</code> (ядох),\n<code>yerim</code> (ям обикновено), <code>dedim</code> (казах),\n<code>derim</code> (казвам обикновено). Пред бъдеще време пак се\nстеснява: <code>yiyeceğim</code>, <code>diyeceğim</code>.</p>\n<p>В отрицателната форма <code>e</code> се запазва:\n<code>yemiyorum</code> (не ям), <code>demiyorum</code> (не казвам).\nВнимавай — <code>yemiyorum</code> прилича на положителна форма, но е\nотрицание.</p>\n<h3\nid=\"граматика-5.6-пълна-таблица-на--yor-şimdiki-zaman-tam-tablo\">Граматика\n5.6 — Пълна таблица на <code>-yor</code> · Şimdiki zaman tam tablo</h3>\n<p><strong>gelmek (идвам) — утвърдително, отрицателно,\nвъпрос:</strong></p>\n<table>\n<thead>\n<tr class=\"header\">\n<th>Лице</th>\n<th>+</th>\n<th>−</th>\n<th>?</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>ben</td>\n<td>geliyorum</td>\n<td>gelmiyorum</td>\n<td>geliyor muyum?</td>\n</tr>\n<tr class=\"even\">\n<td>sen</td>\n<td>geliyorsun</td>\n<td>gelmiyorsun</td>\n<td>geliyor musun?</td>\n</tr>\n<tr class=\"odd\">\n<td>o</td>\n<td>geliyor</td>\n<td>gelmiyor</td>\n<td>geliyor mu?</td>\n</tr>\n<tr class=\"even\">\n<td>biz</td>\n<td>geliyoruz</td>\n<td>gelmiyoruz</td>\n<td>geliyor muyuz?</td>\n</tr>\n<tr class=\"odd\">\n<td>siz</td>\n<td>geliyorsunuz</td>\n<td>gelmiyorsunuz</td>\n<td>geliyor musunuz?</td>\n</tr>\n<tr class=\"even\">\n<td>onlar</td>\n<td>geliyorlar</td>\n<td>gelmiyorlar</td>\n<td>geliyorlar mı?</td>\n</tr>\n</tbody>\n</table>\n<p><strong>Отрицателен въпрос:</strong> <code>Gelmiyor musun?</code> —\nНе идваш ли?</p>\n<h3\nid=\"граматика-5.7-какво-още-означава--yor-şimdiki-zamanın-kullanımları\">Граматика\n5.7 — Какво още означава <code>-yor</code> · Şimdiki zamanın\nkullanımları</h3>\n<p>Сегашното продължително време на турски покрива повече, отколкото в\nбългарския:</p>\n<ol type=\"1\">\n<li><strong>Сега, в момента:</strong> Şu anda kitap okuyorum. — Точно\nсега чета книга.</li>\n<li><strong>В този период:</strong> Bu yıl Türkçe öğreniyorum. — Тази\nгодина уча турски.</li>\n<li><strong>Близко бъдеще:</strong> Yarın geliyorum. — Утре идвам.</li>\n<li><strong>Постоянно състояние:</strong> Sofya’da oturuyorum. — Живея в\nСофия.</li>\n<li><strong>Ядосано/емоционално:</strong> Sürekli geç kalıyorsun! —\nПостоянно закъсняваш!</li>\n</ol>\n<h3\nid=\"граматика-5.8-наречия-за-честота-и-мястото-им-sıklık-zarfları\">Граматика\n5.8 — Наречия за честота и мястото им · Sıklık zarfları</h3>\n<p>Наречието стои преди глагола, но след подлога:</p>\n<ul>\n<li>Ben <strong>her gün</strong> kahve içiyorum.</li>\n<li>O <strong>şimdi</strong> çalışıyor.</li>\n<li>Biz <strong>bazen</strong> sinemaya gidiyoruz.</li>\n</ul>\n<div class=\"line-block\">şimdi / şu anda | сега / в момента |<br />\nbugün | днес |<br />\nher gün | всеки ден |<br />\nher zaman | винаги |<br />\nsık sık | често |<br />\nbazen | понякога |<br />\nnadiren | рядко |<br />\nhiç | никога (с отрицание) |<br />\nartık | вече, отсега нататък |<br />\nhâlâ | все още |</div>\n<h3 id=\"защо-е-така-neden-böyle-4\">Защо е така · Neden böyle</h3>\n<p><strong>Защо <code>-yor</code> не спазва гласната хармония?</strong>\nЗащото не е старо турско окончание — произлиза от глагола\n<code>yorımak</code> („вървя“), който е бил самостоятелна дума. Затова е\n„замръзнал“ във вида <code>yor</code> и не се мени. Затова и личните\nокончания след него са винаги с <code>u</code>: <code>geliyorum</code>,\nа не <code>geliyorım</code>.</p>\n<p><strong>Защо крайната гласна отпада: <code>bekle-</code> →\n<code>bekliyorum</code>?</strong> Две гласни една до друга са неудобни\nза изговор (<code>bekleiyorum</code>). Турският решава това по два\nначина: или маха едната гласна (при <code>-yor</code>), или вмъква\nсъгласната <code>y</code> (при повечето други окончания:\n<code>bekle-y-eceğim</code>).</p>\n<p><strong>Защо <code>gelmiyorum</code> (не идвам), а не\n<code>gelmeyorum</code>?</strong> Отрицанието е <code>-me</code>, а\nкрайната му гласна отпада пред <code>-yor</code>, както при всеки корен.\nОстава <code>-m</code>, но тогава думата би станала неизговорима, затова\nсе вмъква тясна гласна по хармония: <code>gel-m-i-yor-um</code>.</p>\n<h3 id=\"текст-за-четене-и-превод-okuma-ve-çeviri-metni-3\">Текст за\nчетене и превод · Okuma ve çeviri metni</h3>\n<p><strong>Ne yapıyorsun? — Какво правиш?</strong></p>\n<blockquote>\n<p>— Alo, Mehmet? Ne yapıyorsun?</p>\n<p>— Merhaba Deniz. Şu anda evdeyim, kitap okuyorum. Sen ne\nyapıyorsun?</p>\n<p>— Ben kafedeyim, arkadaşlarımla kahve içiyoruz. Sen de geliyor\nmusun?</p>\n<p>— Bugün gelmiyorum, çok çalışıyorum. Yarın sınavım var.</p>\n<p>— Ne sınavı?</p>\n<p>— Türkçe sınavı. Şimdi yeni kelimeler öğreniyorum ama çok zor.</p>\n<p>— Zor değil, sen çok iyi Türkçe konuşuyorsun!</p>\n<p>— Teşekkür ederim. Yarın akşam görüşüyor muyuz?</p>\n<p>— Tabii, yarın akşam sinemaya gidiyoruz.</p>\n</blockquote>\n<p><em>Нови думи:</em> <code>alo</code> — ало; <code>kafe</code> —\nкафене; <code>arkadaşlarımla</code> — с приятелите ми;\n<code>sınav</code> — изпит; <code>kelime</code> — дума; <code>zor</code>\n— труден; <code>tabii</code> — разбира се.</p>\n<p><strong>Въпроси:</strong></p>\n<ol type=\"1\">\n<li>Mehmet şimdi ne yapıyor?</li>\n<li>Deniz nerede?</li>\n<li>Mehmet neden gelmiyor?</li>\n<li>Yarın akşam ne yapıyorlar?</li>\n</ol>\n<h3 id=\"упражнения-alıştırmalar-4\">Упражнения · Alıştırmalar</h3>\n<p><strong>Упр. 5.1 — Спрегни в сегашно време (ben).</strong>\n<em>(Şimdiki zamanda çekimleyin (ben).)</em></p>\n<ol type=\"1\">\n<li>gelmek</li>\n<li>okumak</li>\n<li>çalışmak</li>\n<li>beklemek</li>\n<li>görmek</li>\n<li>uyumak</li>\n</ol>\n<p><strong>Упр. 5.2 — Постави глагола в правилната форма.</strong>\n<em>(Fiili doğru biçimde yazın.)</em></p>\n<ol type=\"1\">\n<li>Sen ne (yapmak) ___ ?</li>\n<li>O müzik (dinlemek) ___ .</li>\n<li>Biz Türkçe (öğrenmek) ___ .</li>\n<li>Onlar okula (gitmek) ___ .</li>\n<li>Siz çay (içmek) ___ .</li>\n</ol>\n<p><strong>Упр. 5.3 — Направи отрицателни.</strong> <em>(Olumsuz\nyapın.)</em></p>\n<ol type=\"1\">\n<li>Geliyorum.</li>\n<li>Çalışıyorsun.</li>\n<li>Okuyor.</li>\n<li>Görüyoruz.</li>\n<li>Bekliyorsunuz.</li>\n</ol>\n<p><strong>Упр. 5.4 — Направи въпроси.</strong> <em>(Soru cümleleri\nyapın.)</em></p>\n<ol type=\"1\">\n<li>Sen çalışıyorsun.</li>\n<li>O geliyor.</li>\n<li>Siz Türkçe konuşuyorsunuz.</li>\n</ol>\n<p><strong>Упр. 5.5 — Преведи на турски.</strong> <em>(Türkçeye\nçevirin.)</em></p>\n<ol type=\"1\">\n<li>Какво правиш?</li>\n<li>Чета книга.</li>\n<li>Не работя днес.</li>\n<li>Идваш ли утре?</li>\n<li>Учим турски в училище.</li>\n</ol>\n<h3 id=\"допълнителни-упражнения-ek-alıştırmalar-4\">Допълнителни\nупражнения · Ek alıştırmalar</h3>\n<p><strong>Упр. 5.6 — Постави в сегашно време (внимавай с гласната в\nкрая на корена).</strong> <em>(Şimdiki zamana çevirin (kök sonundaki\nünlüye dikkat).)</em></p>\n<ol type=\"1\">\n<li>beklemek (ben)</li>\n<li>okumak (sen)</li>\n<li>yemek (o)</li>\n<li>demek (biz)</li>\n<li>başlamak (siz)</li>\n<li>uyumak (onlar)</li>\n</ol>\n<p><strong>Упр. 5.7 — Отговори отрицателно.</strong> <em>(Olumsuz cevap\nverin.)</em></p>\n<ol type=\"1\">\n<li>Şimdi çalışıyor musun?</li>\n<li>Ali geliyor mu?</li>\n<li>Türkçe konuşuyorlar mı?</li>\n<li>Kahve içiyor musunuz?</li>\n</ol>\n<p><strong>Упр. 5.8 — Подреди думите в изречение.</strong>\n<em>(Kelimeleri sıralayıp cümle kurun.)</em></p>\n<ol type=\"1\">\n<li>okulda / ben / Türkçe / öğreniyorum</li>\n<li>her / o / gün / içiyor / kahve</li>\n<li>gidiyoruz / biz / sinemaya / akşam</li>\n<li>ne / sen / yapıyorsun / şimdi</li>\n</ol>\n<p><strong>Упр. 5.9 — Напиши какво правиш сега (4 изречения).</strong>\n<em>(Şu anda ne yaptığınızı yazın (dört cümle).)</em></p>\n<p><strong>Упр. 5.10 — Намери корена и спрегни за\n<code>ben</code>.</strong> <em>(Fiil kökünü bulun ve „ben“ için\nçekimleyin.)</em></p>\n<ol type=\"1\">\n<li>beklemek</li>\n<li>okumak</li>\n<li>başlamak</li>\n<li>söylemek</li>\n<li>anlamak</li>\n<li>yürümek</li>\n<li>yemek</li>\n<li>demek</li>\n</ol>\n<p><strong>Упр. 5.11 — Попълни цялата таблица за\n<code>çalışmak</code>.</strong> <em>(„çalışmak“ için tabloyu\ntamamlayın.)</em></p>\n<ol type=\"1\">\n<li>ben ___</li>\n<li>sen ___</li>\n<li>o ___</li>\n<li>biz ___</li>\n<li>siz ___</li>\n<li>onlar ___</li>\n</ol>\n<p><strong>Упр. 5.12 — Направи отрицателен въпрос.</strong> <em>(Olumsuz\nsoru yapın.)</em></p>\n<p>Пример: Geliyorsun. → Gelmiyor musun?</p>\n<ol type=\"1\">\n<li>Çalışıyorsun.</li>\n<li>O anlıyor.</li>\n<li>Siz geliyorsunuz.</li>\n<li>Onlar biliyorlar.</li>\n<li>Biz gidiyoruz.</li>\n<li>Sen yiyorsun.</li>\n</ol>\n<p><strong>Упр. 5.13 — Постави наречието на правилното място.</strong>\n<em>(Zarfı doğru yere koyun.)</em></p>\n<ol type=\"1\">\n<li>Ben kahve içiyorum. (her sabah)</li>\n<li>O çalışıyor. (şimdi)</li>\n<li>Biz sinemaya gidiyoruz. (bazen)</li>\n<li>Sen geç kalıyorsun. (sürekli)</li>\n<li>Onlar Türkçe konuşuyorlar. (çok iyi)</li>\n</ol>\n<p><strong>Упр. 5.14 — Кое значение има <code>-yor</code> тук?</strong>\n<em>(Burada -yor hangi anlamda?)</em></p>\n<p>Избери: (а) сега · (б) този период · (в) близко бъдеще · (г)\nпостоянно състояние</p>\n<ol type=\"1\">\n<li>Şu anda ders çalışıyorum.</li>\n<li>Bu yıl üniversiteye gidiyorum.</li>\n<li>Yarın İstanbul’a uçuyorum.</li>\n<li>Sofya’da oturuyorum.</li>\n</ol>\n<p><strong>Упр. 5.15 — Преведи на турски.</strong> <em>(Türkçeye\nçevirin.)</em></p>\n<ol type=\"1\">\n<li>Какво правиш в момента?</li>\n<li>Не разбирам.</li>\n<li>Не работиш ли днес?</li>\n<li>Живея в София.</li>\n<li>Утре идвам.</li>\n<li>Постоянно закъсняваш!</li>\n<li>Учим турски тази година.</li>\n<li>Понякога ходим на кино.</li>\n</ol>\n<hr />\n<h2 id=\"урок-6-числа-и-часът-saat-kaç\">УРОК 6 · Числа и часът — Saat\nkaç?</h2><figure class=\"illus\">\n<svg viewBox=\"0 0 400 210\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Часовник\">\n<circle cx=\"110\" cy=\"105\" r=\"78\" fill=\"#fff\" stroke=\"#17618F\" stroke-width=\"2\"/>\n<g stroke=\"#D6DCD8\" stroke-width=\"2\">\n<path d=\"M110 32 V44\"/><path d=\"M110 166 V178\"/><path d=\"M37 105 H49\"/><path d=\"M171 105 H183\"/>\n</g>\n<g font-size=\"12\" fill=\"#0E2338\" text-anchor=\"middle\" font-weight=\"600\">\n<text x=\"110\" y=\"58\">12</text><text x=\"162\" y=\"110\">3</text><text x=\"110\" y=\"160\">6</text><text x=\"58\" y=\"110\">9</text>\n</g>\n<path d=\"M110 105 L110 62\" stroke=\"#0E2338\" stroke-width=\"3.5\" stroke-linecap=\"round\"/>\n<path d=\"M110 105 L150 118\" stroke=\"#C24632\" stroke-width=\"3\" stroke-linecap=\"round\"/>\n<circle cx=\"110\" cy=\"105\" r=\"4\" fill=\"#C24632\"/>\n<g font-size=\"12.5\" fill=\"#0E2338\">\n<text x=\"206\" y=\"52\" font-weight=\"700\" fill=\"#17618F\">до 30 минути</text>\n<text x=\"206\" y=\"72\">saat dörd<tspan fill=\"#C24632\">ü</tspan> on <tspan fill=\"#C24632\">geçiyor</tspan></text>\n<text x=\"206\" y=\"88\" font-size=\"10\" fill=\"#5C6B72\">4:10 — минава четири и десет</text>\n<text x=\"206\" y=\"124\" font-weight=\"700\" fill=\"#17618F\">след 30 минути</text>\n<text x=\"206\" y=\"144\">saat beş<tspan fill=\"#C24632\">e</tspan> on <tspan fill=\"#C24632\">var</tspan></text>\n<text x=\"206\" y=\"160\" font-size=\"10\" fill=\"#5C6B72\">4:50 — без десет пет</text>\n<text x=\"206\" y=\"184\">saat beş <tspan fill=\"#C24632\">buçuk</tspan>\n<tspan font-size=\"10\" fill=\"#5C6B72\"> — 5:30</tspan></text>\n</g>\n</svg>\n<figcaption>Часът: „минава“ иска -i, „без“ иска -e.</figcaption></figure>\n<h3 id=\"речник-числата-sözlük-sayılar\">Речник — числата · Sözlük —\nsayılar</h3>\n<table>\n<tbody>\n<tr class=\"odd\">\n<td>0</td>\n<td>sıfır</td>\n<td>11</td>\n<td>on bir</td>\n</tr>\n<tr class=\"even\">\n<td>1</td>\n<td>bir</td>\n<td>12</td>\n<td>on iki</td>\n</tr>\n<tr class=\"odd\">\n<td>2</td>\n<td>iki</td>\n<td>20</td>\n<td>yirmi</td>\n</tr>\n<tr class=\"even\">\n<td>3</td>\n<td>üç</td>\n<td>30</td>\n<td>otuz</td>\n</tr>\n<tr class=\"odd\">\n<td>4</td>\n<td>dört</td>\n<td>40</td>\n<td>kırk</td>\n</tr>\n<tr class=\"even\">\n<td>5</td>\n<td>beş</td>\n<td>50</td>\n<td>elli</td>\n</tr>\n<tr class=\"odd\">\n<td>6</td>\n<td>altı</td>\n<td>60</td>\n<td>altmış</td>\n</tr>\n<tr class=\"even\">\n<td>7</td>\n<td>yedi</td>\n<td>70</td>\n<td>yetmiş</td>\n</tr>\n<tr class=\"odd\">\n<td>8</td>\n<td>sekiz</td>\n<td>80</td>\n<td>seksen</td>\n</tr>\n<tr class=\"even\">\n<td>9</td>\n<td>dokuz</td>\n<td>90</td>\n<td>doksan</td>\n</tr>\n<tr class=\"odd\">\n<td>10</td>\n<td>on</td>\n<td>100</td>\n<td>yüz</td>\n</tr>\n</tbody>\n</table>\n<p><code>1 000</code> — bin · <code>1 000 000</code> — milyon ·\n<code>1 000 000 000</code> — milyar</p>\n<p>Числата се пишат разделно и просто се редят: - 25 — yirmi beş - 148 —\nyüz kırk sekiz - 2026 — iki bin yirmi altı</p>\n<p><em>Забележка:</em> пред <code>yüz</code> и <code>bin</code> не се\nказва <code>bir</code>: <strong>yüz</strong> (100), <strong>bin</strong>\n(1000), но <code>bir milyon</code> (1 000 000).</p>\n<h3\nid=\"граматика-6.1-редни-числителни--ıncı--inci-sıra-sayıları\">Граматика\n6.1 — Редни числителни: -ıncı / -inci · Sıra sayıları</h3>\n<table>\n<tbody>\n<tr class=\"odd\">\n<td>birinci</td>\n<td>първи</td>\n</tr>\n<tr class=\"even\">\n<td>ikinci</td>\n<td>втори</td>\n</tr>\n<tr class=\"odd\">\n<td>üçüncü</td>\n<td>трети</td>\n</tr>\n<tr class=\"even\">\n<td>dördüncü</td>\n<td>четвърти</td>\n</tr>\n<tr class=\"odd\">\n<td>beşinci</td>\n<td>пети</td>\n</tr>\n<tr class=\"even\">\n<td>altıncı</td>\n<td>шести</td>\n</tr>\n<tr class=\"odd\">\n<td>yedinci</td>\n<td>седми</td>\n</tr>\n<tr class=\"even\">\n<td>sekizinci</td>\n<td>осми</td>\n</tr>\n<tr class=\"odd\">\n<td>dokuzuncu</td>\n<td>девети</td>\n</tr>\n<tr class=\"even\">\n<td>onuncu</td>\n<td>десети</td>\n</tr>\n</tbody>\n</table>\n<h3 id=\"граматика-6.2-дни-и-месеци-günler-ve-aylar\">Граматика 6.2 — Дни\nи месеци · Günler ve aylar</h3>\n<p><strong>Günler (дни):</strong> Pazartesi (понеделник), Salı\n(вторник), Çarşamba (сряда), Perşembe (четвъртък), Cuma (петък),\nCumartesi (събота), Pazar (неделя)</p>\n<p><strong>Aylar (месеци):</strong> Ocak, Şubat, Mart, Nisan, Mayıs,\nHaziran, Temmuz, Ağustos, Eylül, Ekim, Kasım, Aralık</p>\n<p><strong>Mevsimler (сезони):</strong> ilkbahar (пролет), yaz (лято),\nsonbahar (есен), kış (зима)</p>\n<h3 id=\"граматика-6.3-часът-saat\">Граматика 6.3 — Часът · Saat</h3>\n<p><strong>Въпрос: Saat kaç?</strong> — Колко е часът?</p>\n<ul>\n<li>Saat bir. — 1:00</li>\n<li>Saat üç. — 3:00</li>\n<li>Saat beş buçuk. — 5:30 (<code>buçuk</code> — и половина)</li>\n<li>Saat dört<strong>i</strong> çeyrek geçiyor. — 4:15 (минава четири и\nчетвърт)</li>\n<li>Saat beş<strong>e</strong> çeyrek var. — 4:45 (без четвърт пет)</li>\n<li>Saat yedi<strong>yi</strong> yirmi geçiyor. — 7:20</li>\n<li>Saat dokuz<strong>a</strong> on var. — 8:50</li>\n</ul>\n<p><strong>Правило:</strong> - „минава“ → часът + винителен падеж +\nминути + <strong>geçiyor</strong> - „без“ → следващият час + дателен\nпадеж + минути + <strong>var</strong></p>\n<p><strong>Въпрос: Saat kaçta?</strong> — В колко часа? - Saat\nyedi<strong>de</strong> kalkıyorum. — Ставам в седем часа. - Saat sekiz\nbuçuk<strong>ta</strong> okula gidiyorum. — Отивам на училище в 8:30. -\nSaat bir<strong>de</strong> yemek yiyorum. — Ям в един часа.</p>\n<h3 id=\"граматика-6.4-числата-в-детайли-sayılar-ayrıntılı\">Граматика 6.4\n— Числата в детайли · Sayılar ayrıntılı</h3>\n<p><strong>Съставяне на числа</strong> — просто се редят от голямото към\nмалкото, разделно:</p>\n<div class=\"line-block\">21 | yirmi bir |<br />\n99 | doksan dokuz |<br />\n256 | iki yüz elli altı |<br />\n1 340 | bin üç yüz kırk |<br />\n15 000 | on beş bin |<br />\n2 000 000 | iki milyon |</div>\n<p><strong>Важни разлики от българския:</strong></p>\n<ul>\n<li>Пред <code>yüz</code> (100) и <code>bin</code> (1000) НЕ се казва\n<code>bir</code>: <code>yüz lira</code> (100 лири),\n<code>bin kişi</code> (1000 души) Но: <code>bir milyon</code>,\n<code>bir milyar</code> — тук <code>bir</code> е задължително.</li>\n<li>След число съществителното е в <strong>единствено число</strong>:\n<code>beş kitap</code> (пет книги), <code>on öğrenci</code> (десет\nученици) Никога <del>beş kitaplar</del>.</li>\n</ul>\n<h3 id=\"граматика-6.5-дати-tarihler\">Граматика 6.5 — Дати ·\nTarihler</h3>\n<p>Редът е като българския: <strong>ден + месец + година</strong></p>\n<ul>\n<li>5 Mart 2026 — beş Mart iki bin yirmi altı</li>\n<li>Bugün on iki Ağustos. — Днес е дванадесети август.</li>\n<li>1985’te doğdum. — Роден съм през 1985.</li>\n</ul>\n<p><strong>„На коя дата?“</strong> — с местен падеж: - Sınav beş\nMart’<strong>ta</strong>. — Изпитът е на пети март. - Doğum günüm\nOcak’<strong>ta</strong>. — Рожденият ми ден е през януари. -\n2026’<strong>da</strong> — през 2026</p>\n<h3 id=\"граматика-6.6-часът-пълна-схема-saat-tam-şema\">Граматика 6.6 —\nЧасът: пълна схема · Saat: tam şema</h3>\n<p><strong>„Колко е часът?“ — Saat kaç?</strong></p>\n<table>\n<thead>\n<tr class=\"header\">\n<th>Часът</th>\n<th>Турски</th>\n<th>Буквално</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>3:00</td>\n<td>Saat üç.</td>\n<td>часът три</td>\n</tr>\n<tr class=\"even\">\n<td>3:05</td>\n<td>Saat üçü beş geçiyor.</td>\n<td>минава три с пет</td>\n</tr>\n<tr class=\"odd\">\n<td>3:15</td>\n<td>Saat üçü çeyrek geçiyor.</td>\n<td>минава три с четвърт</td>\n</tr>\n<tr class=\"even\">\n<td>3:30</td>\n<td>Saat üç buçuk.</td>\n<td>три и половина</td>\n</tr>\n<tr class=\"odd\">\n<td>3:45</td>\n<td>Saat dörde çeyrek var.</td>\n<td>до четири има четвърт</td>\n</tr>\n<tr class=\"even\">\n<td>3:50</td>\n<td>Saat dörde on var.</td>\n<td>до четири има десет</td>\n</tr>\n<tr class=\"odd\">\n<td>12:00</td>\n<td>Saat on iki.</td>\n<td>—</td>\n</tr>\n</tbody>\n</table>\n<p><strong>Правилото:</strong> - До половина (<code>geçiyor</code>):\nчасът във <strong>винителен</strong> падеж + минути + geçiyor - След\nполовина (<code>var</code>): <strong>следващият</strong> час в\n<strong>дателен</strong> падеж + минути + var</p>\n<p><strong>„В колко часа?“ — Saat kaçta?</strong> — добавя се местен\nпадеж:</p>\n<div class=\"line-block\">Saat üç<strong>te</strong> | в три часа |<br />\nSaat üç buçuk<strong>ta</strong> | в три и половина |<br />\nSaat üçü çeyrek geçe | в три и четвърт |<br />\nSaat dörde çeyrek kala | в три и четиридесет и пет |</div>\n<h3 id=\"граматика-6.7-части-на-деня-günün-bölümleri\">Граматика 6.7 —\nЧасти на деня · Günün bölümleri</h3>\n<div class=\"line-block\">sabah | сутрин | sabahleyin — сутринта |<br />\nöğle | обед | öğleyin — по обед |<br />\nöğleden sonra | следобед | |<br />\nakşam | вечер | akşamleyin — вечерта |<br />\ngece | нощ | geceleyin — през нощта |<br />\ndün | вчера | dün akşam — снощи |<br />\nbugün | днес | bu sabah — тази сутрин |<br />\nyarın | утре | yarın akşam — утре вечер |</div>\n<p>За навик се използва множествено число: - Sabah<strong>ları</strong>\nkoşarım. — Сутрин (обикновено) тичам. - Akşam<strong>ları</strong> kitap\nokurum. — Вечер чета книга.</p>\n<h3 id=\"защо-е-така-neden-böyle-5\">Защо е така · Neden böyle</h3>\n<p><strong>Защо „минава“ иска винителен, а „без“ — дателен?</strong>\nПогледни буквалния превод:</p>\n<ul>\n<li><code>Saat üçü beş geçiyor</code> = „Часът минава\n<strong>три</strong>-та с пет“ — три е обектът, който бива задминат,\nзатова е във винителен падеж.</li>\n<li><code>Saat dörde beş var</code> = „До <strong>четири</strong> има\nпет“ — четири е целта, посоката, затова е в дателен падеж.</li>\n</ul>\n<p>Щом го погледнеш като движение — минаваме покрай тричасовата отметка\nкъм четири — падежите стават логични.</p>\n<p><strong>Защо след число съществителното е в единствено\nчисло?</strong> Същата логика като при <code>-lar</code>: числото вече\nноси информацията за множество. <code>iki saat</code> (два часа),\n<code>beş dakika</code> (пет минути).</p>\n<p><strong>Защо <code>sabahları</code> е в множествено число?</strong>\nЗащото не говорим за една конкретна сутрин, а за сутрините изобщо —\nнавик. <code>Sabah kalkıyorum</code> = сутринта (тази) ставам.\n<code>Sabahları kalkarım</code> = сутрин (обикновено) ставам.</p>\n<h3 id=\"текст-за-четене-и-превод-okuma-ve-çeviri-metni-4\">Текст за\nчетене и превод · Okuma ve çeviri metni</h3>\n<p><strong>Benim günüm — Моят ден</strong></p>\n<blockquote>\n<p>Her sabah saat altı buçukta kalkıyorum. Yediye çeyrek kala kahvaltı\nyapıyorum. Kahvaltıda peynir, zeytin ve ekmek yiyorum, çay içiyorum.\nSaat yedi buçukta evden çıkıyorum. İşe otobüsle gidiyorum, yolculuk\nyirmi dakika sürüyor. Saat sekizde işe başlıyorum. Öğle yemeğini saat on\nikide yiyorum. Saat beşte iş bitiyor. Akşam saat yedide eve dönüyorum.\nAkşam yemeğinden sonra biraz televizyon izliyorum veya kitap okuyorum.\nSaat on birde yatıyorum.</p>\n</blockquote>\n<p><em>Нови думи:</em> <code>kalkmak</code> — ставам;\n<code>kahvaltı</code> — закуска; <code>peynir</code> — сирене;\n<code>zeytin</code> — маслина; <code>otobüsle</code> — с автобус;\n<co
