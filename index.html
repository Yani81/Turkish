s=\"line-block\">iyi (добър) | daha iyi | en iyi |<br />\nkötü (лош) | daha kötü | en kötü |<br />\nçok (много) | daha çok / daha fazla | en çok / en fazla |<br />\naz (малко) | daha az | en az |</div>\n<p>Няма истински неправилни форми като английското\n<em>good–better–best</em> — турският винаги ползва <code>daha</code> и\n<code>en</code>.</p>\n<h3 id=\"граматика-14.7-полезни-изрази-за-сравнение\">Граматика 14.7 —\nПолезни изрази за сравнение</h3>\n<div class=\"line-block\">…-e göre | според, спрямо | Geçen yıla göre daha\niyi. |<br />\n…-e kıyasla | в сравнение с | Ona kıyasla ben şanslıyım. |<br />\n…-in aksine | за разлика от | Senin aksine ben erken kalkarım. |<br />\naynı … gibi | точно като | Aynı babası gibi. |<br />\n…den farklı | различен от | Bu ondan farklı. |<br />\nile aynı | същият като | Seninkiyle aynı. |</div>\n<h3 id=\"защо-е-така-neden-böyle-13\">Защо е така · Neden böyle</h3>\n<p><strong>Защо сравнението иска изходен падеж?</strong> Защото турският\nмисли за сравнението като за <strong>отправна точка</strong>:\n<code>Ahmet'ten uzun</code> буквално е „висок, тръгвайки от Ахмет“ —\nАхмет е нивото, от което мериш нагоре. Същото прави и латинският, и\nруският („выше меня“).</p>\n<p><strong>Защо <code>daha</code> може да се изпусне, а <code>en</code>\n— не?</strong> Защото изходният падеж сам по себе си вече значи\nсравнение. При превъзходната степен няма такъв сигнал — без\n<code>en</code> изречението просто описва.</p>\n<p><strong>Защо <code>senin kadar</code>, а не\n<code>seni kadar</code>?</strong> <code>kadar</code> е следлог, който\nиска родителен падеж при местоименията: буквално „в размера на твоето“.\nПри съществителните обаче се ползва основната форма:\n<code>kardeşi kadar</code> (колкото брат си), не <del>kardeşinin\nkadar</del>.</p>\n<p><strong>Защо турският удвоява думи?</strong> Това е жив, продуктивен\nмеханизъм за усилване или „разпръскване“ на значението:\n<code>yavaş yavaş</code> (все по-бавно, полека), <code>ev ev</code>\n(къща по къща), <code>kırmızı kırmızı</code> (червено-червено).\nБългарският го прави рядко („тихо-тихо“), турският — постоянно.</p>\n<h3 id=\"текст-за-четене-и-превод-okuma-ve-çeviri-metni-12\">Текст за\nчетене и превод · Okuma ve çeviri metni</h3>\n<p><strong>İki şehir — Два града</strong></p>\n<blockquote>\n<p>İstanbul ile Ankara Türkiye’nin en büyük iki şehri. İstanbul,\nAnkara’dan çok daha kalabalık — nüfusu neredeyse iki katı. Ama Ankara\nbaşkent ve devlet kurumlarının çoğu orada.</p>\n<p>İstanbul denize yakın, bu yüzden havası Ankara’ya göre daha nemli ve\nılıman. Ankara ise iç kesimde, kışları çok daha soğuk ve kuru geçer.</p>\n<p>Yaşam açısından İstanbul daha hareketli ama aynı zamanda daha pahalı\nve yorucu. Trafiği ülkenin en kötüsü. Ankara daha sakin, ulaşımı daha\nkolay, kiralar daha ucuz.</p>\n<p>Hangisi daha iyi? Bu tamamen kişiye bağlı. Deniz, tarih ve\nhareketlilik istiyorsanız İstanbul; huzur ve düzen istiyorsanız Ankara\nsizin için daha uygun olabilir.</p>\n</blockquote>\n<p><em>Нови думи:</em> <code>kalabalık</code> — многолюден;\n<code>nüfus</code> — население; <code>kat</code> — път (кратност);\n<code>başkent</code> — столица; <code>kurum</code> — институция;\n<code>nemli</code> — влажен; <code>ılıman</code> — умерен;\n<code>iç kesim</code> — вътрешност; <code>kuru</code> — сух;\n<code>açısından</code> — от гледна точка на; <code>hareketli</code> —\nоживен; <code>yorucu</code> — изморителен; <code>ulaşım</code> —\nтранспорт; <code>kira</code> — наем; <code>bağlı</code> — зависи от;\n<code>huzur</code> — спокойствие; <code>düzen</code> — ред;\n<code>uygun</code> — подходящ.</p>\n<p><strong>Въпроси:</strong></p>\n<ol type=\"1\">\n<li>Hangi şehir daha kalabalık?</li>\n<li>Ankara’nın kışları nasıl geçer?</li>\n<li>İstanbul’un en kötü yanı ne?</li>\n<li>Ankara’da ne daha ucuz?</li>\n</ol>\n<h3 id=\"упражнения-alıştırmalar-13\">Упражнения · Alıştırmalar</h3>\n<p><strong>Упр. 14.1 — Направи сравнителна степен.</strong>\n<em>(Karşılaştırma yapın.)</em></p>\n<p>Пример: Ali / Ahmet / uzun → Ali, Ahmet’ten daha uzun.</p>\n<ol type=\"1\">\n<li>bu ev / o ev / büyük</li>\n<li>İstanbul / Ankara / kalabalık</li>\n<li>ben / sen / genç</li>\n<li>tren / otobüs / hızlı</li>\n<li>bu kitap / o kitap / ilginç</li>\n</ol>\n<p><strong>Упр. 14.2 — Направи превъзходна степен.</strong> <em>(En\nüstünlük derecesi yapın.)</em></p>\n<ol type=\"1\">\n<li>sınıf / iyi öğrenci</li>\n<li>dünya / yüksek dağ</li>\n<li>Türkiye / büyük şehir</li>\n<li>aile / küçük çocuk</li>\n</ol>\n<p><strong>Упр. 14.3 — <code>kadar</code> или\n<code>gibi</code>?</strong> <em>(„kadar“ mı, „gibi“ mi?)</em></p>\n<ol type=\"1\">\n<li>Ben senin ___ çalışıyorum. (колкото теб)</li>\n<li>Baban ___ konuşuyorsun. (като баща си)</li>\n<li>Kar ___ beyaz. (като сняг)</li>\n<li>O, kardeşi ___ uzun. (колкото брат си)</li>\n<li>Benim ___ düşünüyor. (като мен)</li>\n</ol>\n<p><strong>Упр. 14.4 — Попълни с подходяща дума за степен.</strong>\n<em>(Uygun derece kelimesini yazın.)</em></p>\n<p>Избери: çok · biraz · fazla · neredeyse · en az</p>\n<ol type=\"1\">\n<li>___ yorgunum, biraz dinleneyim. (малко)</li>\n<li>Bu çorba ___ tuzlu, içemiyorum. (прекалено)</li>\n<li>Film ___ bitti. (почти)</li>\n<li>Toplantıda ___ on kişi vardı. (поне)</li>\n<li>Bu manzara ___ güzel. (много)</li>\n</ol>\n<p><strong>Упр. 14.5 — Преведи изразите за сравнение.</strong>\n<em>(Karşılaştırma ifadelerini çevirin.)</em></p>\n<ol type=\"1\">\n<li>в сравнение с миналата година</li>\n<li>за разлика от теб</li>\n<li>точно като баща си</li>\n<li>различен от този</li>\n<li>същият като твоя</li>\n</ol>\n<p><strong>Упр. 14.6 — Преведи на турски.</strong> <em>(Türkçeye\nçevirin.)</em></p>\n<ol type=\"1\">\n<li>Али е по-висок от Ахмет.</li>\n<li>Това е най-хубавото.</li>\n<li>Работя колкото теб.</li>\n<li>Говориш като баща си.</li>\n<li>Тази къща е по-голяма от онази.</li>\n<li>Най-високата планина в света.</li>\n<li>Не е чак толкова добър.</li>\n<li>Влакът е по-бърз от автобуса.</li>\n</ol>\n<h3>Тематичен речник · Konu sözlüğü — Пазаруване: цени и размери · Alışveriş</h3><table><thead><tr><th>Türkçe</th><th>Български</th></tr></thead><tbody><tr><td>kaç para?</td><td>колко струва?</td></tr><tr><td>ne kadar?</td><td>колко?</td></tr><tr><td>fiyat etiketi</td><td>етикет с цена</td></tr><tr><td>ucuzluk</td><td>намаление</td></tr><tr><td>indirimli</td><td>с намаление</td></tr><tr><td>pahalıya gelmek</td><td>излиза скъпо</td></tr><tr><td>hesaplı</td><td>изгоден</td></tr><tr><td>kaliteli</td><td>качествен</td></tr><tr><td>kalitesiz</td><td>некачествен</td></tr><tr><td>sahte</td><td>фалшив</td></tr><tr><td>orijinal</td><td>оригинален</td></tr><tr><td>marka</td><td>марка</td></tr><tr><td>beden</td><td>размер (дреха)</td></tr><tr><td>numara</td><td>номер (обувки)</td></tr><tr><td>küçük beden</td><td>малък размер</td></tr><tr><td>orta beden</td><td>среден размер</td></tr><tr><td>büyük beden</td><td>голям размер</td></tr><tr><td>dar gelmek</td><td>стяга ми</td></tr><tr><td>bol gelmek</td><td>широко ми е</td></tr><tr><td>tam olmak</td><td>става ми точно</td></tr><tr><td>denemek</td><td>пробвам</td></tr><tr><td>kabin</td><td>пробна</td></tr><tr><td>ayna</td><td>огледало</td></tr><tr><td>renk</td><td>цвят</td></tr><tr><td>desen</td><td>шарка</td></tr><tr><td>kumaş</td><td>плат</td></tr><tr><td>pamuklu</td><td>памучен</td></tr><tr><td>yünlü</td><td>вълнен</td></tr><tr><td>deri</td><td>кожа</td></tr><tr><td>raf</td><td>рафт</td></tr><tr><td>reyon</td><td>щанд, отдел</td></tr><tr><td>sepet</td><td>кошница</td></tr><tr><td>araba (market)</td><td>количка</td></tr><tr><td>kasa</td><td>каса</td></tr><tr><td>sıraya girmek</td><td>заставам на опашка</td></tr><tr><td>poşet</td><td>найлонова торбичка</td></tr><tr><td>nakit mi, kart mı?</td><td>в брой или с карта?</td></tr><tr><td>fiş almak</td><td>вземам касова бележка</td></tr><tr><td>değişim</td><td>замяна</td></tr><tr><td>iade</td><td>връщане на стока</td></tr><tr><td>garanti belgesi</td><td>гаранционна карта</td></tr><tr><td>son kullanma tarihi</td><td>срок на годност</td></tr><tr><td>kilo</td><td>килограм</td></tr><tr><td>adet</td><td>брой</td></tr><tr><td>yarım kilo</td><td>половин килограм</td></tr><tr><td>çeyrek</td><td>четвърт</td></tr></tbody></table><p><strong>Упр. 14.7 — Как е на турски?</strong> <em>(Türkçesi nedir?)</em></p><ol type=\"1\"><li>колко струва?</li><li>с намаление</li><li>размер (дреха)</li><li>пробна</li><li>стяга ми</li><li>плат</li><li>каса</li><li>връщане на стока</li><li>срок на годност</li><li>половин килограм</li></ol><h3>Тематичен речник · Konu sözlüğü — Дрехи · Kıyafetler</h3><table><thead><tr><th>Türkçe</th><th>Български</th></tr></thead><tbody><tr><td>alışveriş</td><td>пазаруване</td></tr><tr><td>indirim</td><td>намаление</td></tr><tr><td>kıyafet</td><td>облекло</td></tr><tr><td>giysi</td><td>дреха</td></tr><tr><td>elbise</td><td>рокля</td></tr><tr><td>gömlek</td><td>риза</td></tr><tr><td>tişört</td><td>тениска</td></tr><tr><td>pantolon</td><td>панталон</td></tr><tr><td>kot pantolon</td><td>дънки</td></tr><tr><td>etek</td><td>пола</td></tr><tr><td>ceket</td><td>сако, яке</td></tr><tr><td>mont</td><td>зимно яке</td></tr><tr><td>palto</td><td>палто</td></tr><tr><td>ayakkabı</td><td>обувки</td></tr><tr><td>bot</td><td>боти</td></tr><tr><td>çorap</td><td>чорапи</td></tr><tr><td>şapka</td><td>шапка</td></tr><tr><td>atkı</td><td>шал</td></tr><tr><td>eldiven</td><td>ръкавици</td></tr><tr><td>kemer</td><td>колан</td></tr><tr><td>çanta</td><td>чанта</td></tr><tr><td>kredi kartı</td><td>кредитна карта</td></tr></tbody></table><p><strong>Упр. 14.8 — Как е на турски?</strong> <em>(Türkçesi nedir?)</em></p><ol type=\"1\"><li>намаление</li><li>риза</li><li>дънки</li><li>пола</li><li>зимно яке</li><li>обувки</li><li>шал</li><li>колан</li></ol><h3>Тематичен речник · Konu sözlüğü — Материали и мода · Malzemeler ve moda</h3><table><thead><tr><th>Türkçe</th><th>Български</th></tr></thead><tbody><tr><td>alışveriş merkezi</td><td>търговски център</td></tr><tr><td>ambalaj</td><td>опаковка</td></tr><tr><td>paket</td><td>пакет</td></tr><tr><td>moda</td><td>мода</td></tr><tr><td>model</td><td>модел</td></tr><tr><td>pamuk</td><td>памук</td></tr><tr><td>yün</td><td>вълна</td></tr><tr><td>ipek</td><td>коприна</td></tr><tr><td>plastik</td><td>пластмаса</td></tr><tr><td>cam</td><td>стъкло</td></tr><tr><td>ahşap</td><td>дърво (материал)</td></tr><tr><td>metal</td><td>метал</td></tr><tr><td>altın</td><td>злато</td></tr><tr><td>gümüş</td><td>сребро</td></tr><tr><td>kuyumcu</td><td>златар</td></tr></tbody></table><p><strong>Упр. 14.9 — Как е на турски?</strong> <em>(Türkçesi nedir?)</em></p><ol type=\"1\"><li>опаковка</li><li>памук</li><li>вълна</li><li>коприна</li><li>стъкло</li><li>злато</li><li>сребро</li><li>златар</li></ol><hr />\n<h2 id=\"урок-15-следлози-edatlar\">УРОК 15 · Следлози · Edatlar</h2>\n<h3 id=\"речник-sözlük-13\">Речник · Sözlük</h3>\n<table>\n<thead>\n<tr class=\"header\">\n<th>Турски</th>\n<th>Български</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>ile</td>\n<td>с</td>\n</tr>\n<tr class=\"even\">\n<td>için</td>\n<td>за</td>\n</tr>\n<tr class=\"odd\">\n<td>gibi</td>\n<td>като</td>\n</tr>\n<tr class=\"even\">\n<td>kadar</td>\n<td>до; колкото</td>\n</tr>\n<tr class=\"odd\">\n<td>göre</td>\n<td>според</td>\n</tr>\n<tr class=\"even\">\n<td>doğru</td>\n<td>към</td>\n</tr>\n<tr class=\"odd\">\n<td>karşı</td>\n<td>срещу</td>\n</tr>\n<tr class=\"even\">\n<td>rağmen</td>\n<td>въпреки</td>\n</tr>\n<tr class=\"odd\">\n<td>dolayı / yüzünden</td>\n<td>заради</td>\n</tr>\n<tr class=\"even\">\n<td>sayesinde</td>\n<td>благодарение на</td>\n</tr>\n<tr class=\"odd\">\n<td>beri</td>\n<td>от (време)</td>\n</tr>\n<tr class=\"even\">\n<td>önce</td>\n<td>преди</td>\n</tr>\n<tr class=\"odd\">\n<td>sonra</td>\n<td>след</td>\n</tr>\n<tr class=\"even\">\n<td>başka</td>\n<td>освен</td>\n</tr>\n<tr class=\"odd\">\n<td>ait</td>\n<td>принадлежащ на</td>\n</tr>\n<tr class=\"even\">\n<td>hakkında</td>\n<td>относно</td>\n</tr>\n<tr class=\"odd\">\n<td>arasında</td>\n<td>между</td>\n</tr>\n<tr class=\"even\">\n<td>yerine</td>\n<td>вместо</td>\n</tr>\n<tr class=\"odd\">\n<td>boyunca</td>\n<td>през, в течение на</td>\n</tr>\n<tr class=\"even\">\n<td>itibaren</td>\n<td>считано от</td>\n</tr>\n</tbody>\n</table>\n<h3 id=\"граматика-15.1-какво-е-следлог-edat\">Граматика 15.1 — Какво е\nследлог · Edat</h3>\n<p>Българският слага предлози <strong>пред</strong> думата („с\nприятел“). Турският ги слага <strong>след</strong> нея („arkadaş ile“) —\nзатова се наричат следлози.</p>\n<p>Всеки следлог изисква определен падеж пред себе си. Това е основното,\nкоето трябва да запомниш — самите думи са лесни.</p>\n<h3 id=\"граматика-15.2-следлози-с-основна-форма-без-окончание\">Граматика\n15.2 — Следлози с основна форма (без окончание)</h3>\n<table>\n<thead>\n<tr class=\"header\">\n<th>Следлог</th>\n<th>Значение</th>\n<th>Пример</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>ile (-la/-le)</td>\n<td>с</td>\n<td>arkadaş<strong>la</strong> — с приятел</td>\n</tr>\n<tr class=\"even\">\n<td>için</td>\n<td>за</td>\n<td>senin için — за теб</td>\n</tr>\n<tr class=\"odd\">\n<td>gibi</td>\n<td>като</td>\n<td>kuş gibi — като птица</td>\n</tr>\n<tr class=\"even\">\n<td>kadar</td>\n<td>колкото</td>\n<td>senin kadar — колкото теб</td>\n</tr>\n</tbody>\n</table>\n<p><strong>Важно:</strong> при <strong>местоименията</strong> тези\nследлози искат <strong>родителен падеж</strong>:</p>\n<div class=\"line-block\">benim ile → <strong>benimle</strong> | с мен\n|<br />\nsenin için | за теб |<br />\nonun gibi | като него |<br />\nbizim kadar | колкото нас |</div>\n<p>При съществителните — основна форма: <code>Ali ile</code>,\n<code>Ali için</code>, <code>çocuk gibi</code>.</p>\n<p><strong><code>ile</code> се слива с думата:</strong></p>\n<div class=\"line-block\">След съгласна | -la / -le |\notobüs<strong>le</strong>, tren<strong>le</strong> |<br />\nСлед гласна | -yla / -yle | araba<strong>yla</strong>,\nkedi<strong>yle</strong> |</div>\n<h3 id=\"граматика-15.3-следлози-с-дателен-падеж--a--e\">Граматика 15.3 —\nСледлози с дателен падеж (-a / -e)</h3>\n<table>\n<thead>\n<tr class=\"header\">\n<th>Следлог</th>\n<th>Значение</th>\n<th>Пример</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>göre</td>\n<td>според</td>\n<td>ban<strong>a göre</strong> — според мен</td>\n</tr>\n<tr class=\"even\">\n<td>doğru</td>\n<td>към</td>\n<td>ev<strong>e doğru</strong> — към къщи</td>\n</tr>\n<tr class=\"odd\">\n<td>kadar</td>\n<td>до</td>\n<td>saat üç<strong>e kadar</strong> — до три часа</td>\n</tr>\n<tr class=\"even\">\n<td>karşı</td>\n<td>срещу; към</td>\n<td>sen<strong>e karşı</strong> — срещу теб</td>\n</tr>\n<tr class=\"odd\">\n<td>rağmen</td>\n<td>въпреки</td>\n<td>yağmur<strong>a rağmen</strong> — въпреки дъжда</td>\n</tr>\n<tr class=\"even\">\n<td>ait</td>\n<td>принадлежащ на</td>\n<td>ban<strong>a ait</strong> — мой е</td>\n</tr>\n</tbody>\n</table>\n<p>Примери: - Bana göre bu doğru değil. — Според мен това не е вярно. -\nEve doğru yürüyorum. — Вървя към къщи. - Sabaha kadar çalıştım. —\nРаботих до сутринта. - Hastalığına rağmen işe geldi. — Въпреки болестта\nси дойде на работа.</p>\n<h3 id=\"граматика-15.4-следлози-с-изходен-падеж--dan--den\">Граматика\n15.4 — Следлози с изходен падеж (-dan / -den)</h3>\n<table>\n<thead>\n<tr class=\"header\">\n<th>Следлог</th>\n<th>Значение</th>\n<th>Пример</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>önce</td>\n<td>преди</td>\n<td>yemek<strong>ten önce</strong></td>\n</tr>\n<tr class=\"even\">\n<td>sonra</td>\n<td>след</td>\n<td>ders<strong>ten sonra</strong></td>\n</tr>\n<tr class=\"odd\">\n<td>beri</td>\n<td>от (време насам)</td>\n<td>sabah<strong>tan beri</strong></td>\n</tr>\n<tr class=\"even\">\n<td>dolayı</td>\n<td>заради</td>\n<td>hastalık<strong>tan dolayı</strong></td>\n</tr>\n<tr class=\"odd\">\n<td>başka</td>\n<td>освен</td>\n<td>sen<strong>den başka</strong></td>\n</tr>\n<tr class=\"even\">\n<td>itibaren</td>\n<td>считано от</td>\n<td>yarın<strong>dan itibaren</strong></td>\n</tr>\n</tbody>\n</table>\n<p>Примери: - Yemekten önce ellerini yıka. — Преди ядене си измий\nръцете. - Sabahtan beri seni bekliyorum. — Чакам те от сутринта. -\nYağmurdan dolayı gelemedim. — Заради дъжда не можах да дойда. - Senden\nbaşka kimse yok. — Освен теб няма никого.</p>\n<h3\nid=\"граматика-15.5-следлози-които-всъщност-са-съществителни\">Граматика\n15.5 — „Следлози“, които всъщност са съществителни</h3>\n<p>Тази група се държи различно и си струва да разбереш защо.\n<code>hakkında</code>, <code>yüzünden</code>, <code>sayesinde</code>,\n<code>yerine</code>, <code>arasında</code>, <code>boyunca</code> не са\nистински следлози, а <strong>съществителни с притежателен афикс и\nпадежно окончание</strong>:</p>\n<table>\n<colgroup>\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th>Израз</th>\n<th>Разбор</th>\n<th>Буквално</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>senin <strong>yüzünden</strong></td>\n<td>yüz (лице) + ün (твой) + den (от)</td>\n<td>от твоето лице</td>\n</tr>\n<tr class=\"even\">\n<td>senin <strong>sayesinde</strong></td>\n<td>saye (сянка, закрила) + n (твоя) + de (в)</td>\n<td>в твоята закрила</td>\n</tr>\n<tr class=\"odd\">\n<td>bunun <strong>hakkında</strong></td>\n<td>hak (право, отношение) + ı + nda</td>\n<td>в отношението на това</td>\n</tr>\n<tr class=\"even\">\n<td>onun <strong>yerine</strong></td>\n<td>yer (място) + i + ne</td>\n<td>на неговото място</td>\n</tr>\n<tr class=\"odd\">\n<td>ikisi <strong>arasında</strong></td>\n<td>ara (междина) + sı + nda</td>\n<td>в междината им</td>\n</tr>\n</tbody>\n</table>\n<p>Затова образуват <strong>изафет</strong> и се държат по неговите\nправила:</p>\n<table>\n<colgroup>\n<col style=\"width: 50%\" />\n<col style=\"width: 50%\" />\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th>Пред местоимение → родителен падеж</th>\n<th>Пред съществително → често и без него</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td><strong>senin</strong> yüzünden</td>\n<td>trafik yüzünden <em>(или: trafiğin yüzünden)</em></td>\n</tr>\n<tr class=\"even\">\n<td><strong>bunun</strong> hakkında</td>\n<td>proje hakkında</td>\n</tr>\n<tr class=\"odd\">\n<td><strong>onun</strong> yerine</td>\n<td>çay yerine</td>\n</tr>\n</tbody>\n</table>\n<p><strong><code>boyunca</code> и <code>arasında</code> не искат\nродителен при съществителни:</strong> <code>yıl boyunca</code> (през\nгодината), <code>hayatı boyunca</code> (през живота си),\n<code>ağaçlar arasında</code> (между дърветата), <code>aramızda</code>\n(между нас).</p>\n<p><strong>Разлика <code>yüzünden</code> / <code>sayesinde</code> /\n<code>dolayı</code>:</strong></p>\n<table>\n<colgroup>\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th>Следлог</th>\n<th>Оттенък</th>\n<th>Пример</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>yüzünden</td>\n<td>лоша последица, сочи виновника</td>\n<td>Senin yüzünden geç kaldım.</td>\n</tr>\n<tr class=\"even\">\n<td>sayesinde</td>\n<td>добра последица, благодарност</td>\n<td>Senin sayesinde başardım.</td>\n</tr>\n<tr class=\"odd\">\n<td>dolayı / nedeniyle</td>\n<td>неутрално, книжовно</td>\n<td>Hastalıktan dolayı gelemedi.</td>\n</tr>\n</tbody>\n</table>\n<p>Примери: - Senin yüzünden geç kaldım. — Заради теб закъснях. - Senin\nsayesinde başardım. — Благодарение на теб успях. - Bunun hakkında ne\ndüşünüyorsun? — Какво мислиш за това? - Onun yerine ben gideyim. —\nВместо него да отида аз.</p>\n<p><strong>Разлика <code>yüzünden</code> /\n<code>sayesinde</code>:</strong> - <code>yüzünden</code> — за лоша\nпоследица (заради теб стана беля) - <code>sayesinde</code> — за добра\nпоследица (благодарение на теб успях) - <code>dolayı</code> —\nнеутрално</p>\n<h3 id=\"граматика-15.6-обобщена-таблица\">Граматика 15.6 — Обобщена\nтаблица</h3>\n<table>\n<colgroup>\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th>Група</th>\n<th>Какво искат пред себе си</th>\n<th>Следлози</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td><strong>истински следлози</strong></td>\n<td>основна форма <em>(при местоимения — родителен)</em></td>\n<td>ile, için, gibi, kadar</td>\n</tr>\n<tr class=\"even\">\n<td></td>\n<td>дателен падеж (-a/-e)</td>\n<td>göre, doğru, kadar (до), karşı, rağmen, ait</td>\n</tr>\n<tr class=\"odd\">\n<td></td>\n<td>изходен падеж (-dan/-den)</td>\n<td>önce, sonra, beri, dolayı, başka, itibaren</td>\n</tr>\n<tr class=\"even\">\n<td><strong>изафетни съществителни</strong></td>\n<td>родителен при местоимения, изафет при съществителни</td>\n<td>hakkında, yüzünden, sayesinde, yerine, arasında, boyunca</td>\n</tr>\n</tbody>\n</table>\n<p><strong>Внимание с <code>kadar</code></strong> — има два падежа с\nразлично значение: - <code>senin kadar</code> (основна/родителна) —\nколкото теб - <code>eve kadar</code> (дателна) — до къщи</p>\n<h3 id=\"защо-е-така-neden-böyle-14\">Защо е така · Neden böyle</h3>\n<p><strong>Защо се наричат следлози?</strong> Защото стоят след думата.\nТова не е странно — то следва от общата логика на турския: всичко\nопределящо върви след определяемото, а изречението завършва с глагола.\nТурският е последователно „ляво-надясно нарастващ“ език.</p>\n<p><strong>Защо <code>benimle</code>, а не <code>benle</code>?</strong>\n<code>ile</code> при местоименията изисква родителен падеж — буквално „в\nкомпанията на моето“. Формата <code>benim ile</code> в говора се е сляла\nв <code>benimle</code>. Същото при <code>seninle</code>,\n<code>onunla</code>.</p>\n<p><strong>Защо <code>sabahtan beri</code>, а не\n<code>sabahtan itibaren</code>?</strong> И двете стават, но с оттенък: -\n<code>beri</code> — от тогава до сега, действието продължава:\n<code>Sabahtan beri bekliyorum.</code> - <code>itibaren</code> — считано\nот даден момент, по-официално:\n<code>Yarından itibaren yeni kurallar geçerli.</code></p>\n<p><strong>Защо <code>yüzünden</code> звучи като обвинение?</strong>\nЗащото <code>yüz</code> значи „лице“ и изразът буквално е „от лицето на“\n— сочи виновника. Затова се използва за неприятни последици. За приятни\n— <code>sayesinde</code> (от <code>saye</code> — сянка, закрила): „под\nтвоята закрила успях“.</p>\n<h3 id=\"текст-за-четене-и-превод-okuma-ve-çeviri-metni-13\">Текст за\nчетене и превод · Okuma ve çeviri metni</h3>\n<p><strong>Bir özür mesajı — Извинително съобщение</strong></p>\n<blockquote>\n<p>Merhaba Deniz,</p>\n<p>Dünkü toplantıya gelemedim, çok özür dilerim. Sabahtan beri hastaydım\nve doktora gitmek zorunda kaldım. Ateşim yüzünden hiçbir şey\nyapamadım.</p>\n<p>Toplantı hakkında bilgi verebilir misin? Yeni proje için ne karar\naldınız? Bana göre en önemli konu bütçeydi, ama belki başka şeyler de\nkonuşulmuştur.</p>\n<p>Senin sayesinde geçen ay da işleri yetiştirmiştim, yine yardımına\nihtiyacım var. Notlarını paylaşırsan çok sevinirim.</p>\n<p>Yarından itibaren tekrar ofisteyim. İstersen öğleden sonra bir kahve\niçelim, her şeyi konuşuruz. Saat üçe kadar müsaitim.</p>\n<p>Anlayışın için teşekkürler.</p>\n<p>Sevgiler, Petar</p>\n</blockquote>\n<p><em>Нови думи:</em> <code>özür dilemek</code> — извинявам се;\n<code>ateş</code> — температура; <code>bilgi vermek</code> — информирам;\n<code>karar almak</code> — вземам решение; <code>bütçe</code> — бюджет;\n<code>yetiştirmek</code> — успявам навреме; <code>paylaşmak</code> —\nсподелям; <code>sevinmek</code> — радвам се; <code>anlayış</code> —\nразбиране.</p>\n<p><strong>Въпроси:</strong></p>\n<ol type=\"1\">\n<li>Petar neden toplantıya gelememiş?</li>\n<li>Ona göre en önemli konu neydi?</li>\n<li>Ne zaman tekrar ofiste olacak?</li>\n<li>Saat kaça kadar müsait?</li>\n</ol>\n<h3 id=\"упражнения-alıştırmalar-14\">Упражнения · Alıştırmalar</h3>\n<p><strong>Упр. 15.1 — Кой падеж иска следлогът?</strong> <em>(Edat\nhangi hâli ister?)</em></p>\n<ol type=\"1\">\n<li>ben___ göre</li>\n<li>ev___ doğru</li>\n<li>yemek___ önce</li>\n<li>sen___ yüzünden</li>\n<li>yağmur___ rağmen</li>\n<li>sabah___ beri</li>\n<li>bu___ hakkında</li>\n<li>sen___ başka</li>\n</ol>\n<p><strong>Упр. 15.2 — Свържи с <code>ile</code>.</strong> <em>(„ile“\nile birleştirin.)</em></p>\n<p>Пример: otobüs → otobüsle</p>\n<ol type=\"1\">\n<li>tren</li>\n<li>araba</li>\n<li>arkadaş</li>\n<li>ben</li>\n<li>sen</li>\n<li>kalem</li>\n</ol>\n<p><strong>Упр. 15.3 — <code>yüzünden</code> или\n<code>sayesinde</code>?</strong> <em>(Hangisi uygun?)</em></p>\n<ol type=\"1\">\n<li>Senin ___ başardım. (благодарение)</li>\n<li>Yağmur ___ geç kaldım. (заради, лошо)</li>\n<li>Öğretmenim ___ Türkçe öğrendim. (благодарение)</li>\n<li>Trafik ___ toplantıyı kaçırdım. (заради, лошо)</li>\n</ol>\n<p><strong>Упр. 15.4 — Попълни подходящия следлог.</strong> <em>(Uygun\nedatı yazın.)</em></p>\n<p>Избери: için · gibi · kadar · göre · rağmen · sonra</p>\n<ol type=\"1\">\n<li>Bu hediye senin ___ .</li>\n<li>Kar ___ beyaz.</li>\n<li>Saat üçe ___ buradayım.</li>\n<li>Bana ___ bu doğru değil.</li>\n<li>Yağmura ___ dışarı çıktı.</li>\n<li>Dersten ___ eve gideceğim.</li>\n</ol>\n<p><strong>Упр. 15.5 — Поправи грешката.</strong> <em>(Hatayı\ndüzeltin.)</em></p>\n<ol type=\"1\">\n<li>Ben ile gel.</li>\n<li>Sen göre bu doğru mu?</li>\n<li>Yemek önce ellerini yıka.</li>\n<li>Sen yüzünden geç kaldım.</li>\n<li>Ev doğru yürüyorum.</li>\n</ol>\n<p><strong>Упр. 15.6 — Преведи на турски.</strong> <em>(Türkçeye\nçevirin.)</em></p>\n<ol type=\"1\">\n<li>Според мен това не е вярно.</li>\n<li>Чакам те от сутринта.</li>\n<li>Заради дъжда не можах да дойда.</li>\n<li>Благодарение на теб успях.</li>\n<li>Освен теб няма никого.</li>\n<li>Въпреки болестта си дойде на работа.</li>\n<li>Вместо него да отида аз.</li>\n<li>Какво мислиш за това?</li>\n</ol>\n<h3>Тематичен речник · Konu sözlüğü — Пътуване и почивка · Seyahat ve tatil</h3><table><thead><tr><th>Türkçe</th><th>Български</th></tr></thead><tbody><tr><td>tatil</td><td>ваканция, почивка</td></tr><tr><td>gezi</td><td>екскурзия</td></tr><tr><td>gezinti</td><td>разходка</td></tr><tr><td>bavul</td><td>куфар</td></tr><tr><td>valiz</td><td>куфар (по-малък)</td></tr><tr><td>vize</td><td>виза</td></tr><tr><td>rezervasyon</td><td>резервация</td></tr><tr><td>danışma</td><td>информация (гише)</td></tr><tr><td>resepsiyon</td><td>рецепция</td></tr><tr><td>pansiyon</td><td>пансион</td></tr><tr><td>kamp</td><td>къмпинг</td></tr><tr><td>çadır</td><td>палатка</td></tr><tr><td>manzara</td><td>гледка, пейзаж</td></tr><tr><td>hediyelik eşya</td><td>сувенир</td></tr><tr><td>sergi</td><td>изложба</td></tr><tr><td>konser</td><td>концерт</td></tr><tr><td>fotoğraf çekmek</td><td>снимам</td></tr><tr><td>güneşlenmek</td><td>печа се на слънце</td></tr><tr><td>kalmak</td><td>отсядам; оставам</td></tr></tbody></table><p><strong>Упр. 15.7 — Как е на турски?</strong> <em>(Türkçesi nedir?)</em></p><ol type=\"1\"><li>ваканция</li><li>куфар</li><li>виза</li><li>резервация</li><li>рецепция</li><li>палатка</li><li>гледка</li><li>сувенир</li></ol><hr />\n<h2 id=\"урок-16-афиксът--ki--ki-eki\">УРОК 16 · Афиксът -ki · „-ki“\neki</h2>\n<h3 id=\"речник-sözlük-14\">Речник · Sözlük</h3>\n<table>\n<thead>\n<tr class=\"header\">\n<th>Турски</th>\n<th>Български</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>yukarı</td>\n<td>горе</td>\n</tr>\n<tr class=\"even\">\n<td>aşağı</td>\n<td>долу</td>\n</tr>\n<tr class=\"odd\">\n<td>içeri</td>\n<td>вътре</td>\n</tr>\n<tr class=\"even\">\n<td>dışarı</td>\n<td>вън</td>\n</tr>\n<tr class=\"odd\">\n<td>ileri</td>\n<td>напред</td>\n</tr>\n<tr class=\"even\">\n<td>geri</td>\n<td>назад</td>\n</tr>\n<tr class=\"odd\">\n<td>sağ</td>\n<td>дясно</td>\n</tr>\n<tr class=\"even\">\n<td>sol</td>\n<td>ляво</td>\n</tr>\n<tr class=\"odd\">\n<td>orta</td>\n<td>среда</td>\n</tr>\n<tr class=\"even\">\n<td>köşe</td>\n<td>ъгъл</td>\n</tr>\n<tr class=\"odd\">\n<td>yan</td>\n<td>страна</td>\n</tr>\n<tr class=\"even\">\n<td>alt</td>\n<td>долна част</td>\n</tr>\n<tr class=\"odd\">\n<td>üst</td>\n<td>горна част</td>\n</tr>\n<tr class=\"even\">\n<td>iç</td>\n<td>вътрешност</td>\n</tr>\n<tr class=\"odd\">\n<td>dış</td>\n<td>външност</td>\n</tr>\n<tr class=\"even\">\n<td>ön</td>\n<td>предна част</td>\n</tr>\n<tr class=\"odd\">\n<td>arka</td>\n<td>задна част</td>\n</tr>\n<tr class=\"even\">\n<td>raf</td>\n<td>рафт</td>\n</tr>\n<tr class=\"odd\">\n<td>çekmece</td>\n<td>чекмедже</td>\n</tr>\n<tr class=\"even\">\n<td>dolap</td>\n<td>шкаф</td>\n</tr>\n</tbody>\n</table>\n<h3 id=\"граматика-16.1-какво-прави--ki\">Граматика 16.1 — Какво прави\n<code>-ki</code></h3>\n<p><code>-ki</code> превръща обстоятелство в определение. На български\nсе превежда с „който е…“, „онзи от…“ или просто с прилагателно:</p>\n<table>\n<thead>\n<tr class=\"header\">\n<th>Турски</th>\n<th>Разбор</th>\n<th>Български</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>masa<strong>daki</strong> kitap</td>\n<td>на-масата + който е</td>\n<td>книгата <strong>на масата</strong></td>\n</tr>\n<tr class=\"even\">\n<td>ev<strong>deki</strong> insanlar</td>\n<td>в-къщата + които са</td>\n<td>хората <strong>в къщата</strong></td>\n</tr>\n<tr class=\"odd\">\n<td>dün<strong>kü</strong> toplantı</td>\n<td>вчера + който е</td>\n<td><strong>вчерашното</strong> събрание</td>\n</tr>\n<tr class=\"even\">\n<td>ben<strong>imki</strong></td>\n<td>мой + този</td>\n<td><strong>моят</strong> (този, който е мой)</td>\n</tr>\n</tbody>\n</table>\n<p>Тоест <code>-ki</code> казва: „това нещо, определено чрез мястото или\nвремето си“.</p>\n<h3 id=\"граматика-16.2-трите-основни-употреби\">Граматика 16.2 — Трите\nосновни употреби</h3>\n<p><strong>А) След местен падеж (-daki / -deki):</strong></p>\n<ul>\n<li>masa<strong>daki</strong> kalem — моливът на масата</li>\n<li>çanta<strong>daki</strong> kitaplar — книгите в чантата</li>\n<li>İstanbul’<strong>daki</strong> arkadaşım — приятелят ми в\nИстанбул</li>\n<li>sınıf<strong>taki</strong> öğrenciler — учениците в класната\nстая</li>\n</ul>\n<p><strong>Б) След родителен падеж (-inki) — вместо\nповторение:</strong></p>\n<ul>\n<li>Bu benim kitabım, o da sen<strong>inki</strong>. — Това е моята\nкнига, а онова — твоята.</li>\n<li>Ali’<strong>ninki</strong> daha güzel. — Тази на Али е\nпо-хубава.</li>\n</ul>\n<div class=\"line-block\">benim → <strong>benimki</strong> | моят |<br />\nsenin → <strong>seninki</strong> | твоят |<br />\nonun → <strong>onunki</strong> | неговият |<br />\nbizim → <strong>bizimki</strong> | нашият |<br />\nsizin → <strong>sizinki</strong> | вашият |<br />\nonların → <strong>onlarınki</strong> | техният |</div>\n<p><strong>В) След дума за време — направо, без падеж:</strong></p>\n<ul>\n<li>dün<strong>kü</strong> gazete — вчерашният вестник</li>\n<li>bugün<strong>kü</strong> hava — днешното време</li>\n<li>sabah<strong>ki</strong> toplantı — сутрешното събрание</li>\n<li>geçen yıl<strong>ki</strong> sınav — миналогодишният изпит</li>\n<li>şimdi<strong>ki</strong> durum — сегашното положение</li>\n</ul>\n<h3 id=\"граматика-16.3-гласната-хармония-при--ki\">Граматика 16.3 —\nГласната хармония при <code>-ki</code></h3>\n<p><code>-ki</code> е <strong>почти неизменяемо</strong> — това е една\nот малкото такива морфеми в турския:</p>\n<div class=\"line-block\">Основна форма | -ki | masadaki, evdeki,\nsınıftaki |<br />\nСлед <code>ü</code>, <code>u</code> в думи за време | -kü | dünkü,\nbugünkü |</div>\n<p>Няма форми <code>-kı</code> или <code>-ku</code>: не се казва\n<del>masadakı</del>. Изключението <code>-kü</code> важи само за\n<code>dün</code>, <code>bugün</code>, <code>gün</code> и подобни.</p>\n<h3 id=\"граматика-16.4--ki-се-скланя-като-съществително\">Граматика 16.4\n— <code>-ki</code> се скланя като съществително</h3>\n<p>Щом сложиш <code>-ki</code>, думата става самостоятелна и приема свои\nокончания. <strong>Пред падежно окончание се вмъква\n<code>-n-</code>:</strong></p>\n<div class=\"line-block\">masadaki | масата-който-е |<br />\nmasadaki<strong>n</strong>i | него (винителен) |<br />\nmasadaki<strong>n</strong>e | на него (дателен) |<br />\nmasadaki<strong>n</strong>den | от него (изходен) |<br />\nmasadaki<strong>ler</strong> | тези на масата (мн.ч.) |</div>\n<p>Примери: - Masadakini ver. — Дай ми този от масата. - Çantadakileri\nçıkar. — Извади тези от чантата. - Benimkini beğendim. — Моят ми\nхареса.</p>\n<h3 id=\"граматика-16.5-пространствените-съществителни\">Граматика 16.5 —\nПространствените съществителни</h3>\n<p>Турският няма предлози „върху“, „под“, „до“. Използва съществителни в\nизафет:</p>\n<table>\n<colgroup>\n<col style=\"width: 25%\" />\n<col style=\"width: 25%\" />\n<col style=\"width: 25%\" />\n<col style=\"width: 25%\" />\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th>Съществително</th>\n<th>Значение</th>\n<th>Конструкция</th>\n<th>Пример</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>üst</td>\n<td>горна част</td>\n<td>-in üstünde</td>\n<td>masa<strong>nın üstünde</strong> — върху масата</td>\n</tr>\n<tr class=\"even\">\n<td>alt</td>\n<td>долна част</td>\n<td>-in altında</td>\n<td>masa<strong>nın altında</strong> — под масата</td>\n</tr>\n<tr class=\"odd\">\n<td>iç</td>\n<td>вътрешност</td>\n<td>-in içinde</td>\n<td>çanta<strong>nın içinde</strong> — вътре в чантата</td>\n</tr>\n<tr class=\"even\">\n<td>dış</td>\n<td>външност</td>\n<td>-in dışında</td>\n<td>şehr<strong>in dışında</strong> — извън града</td>\n</tr>\n<tr class=\"odd\">\n<td>ön</td>\n<td>предна част</td>\n<td>-in önünde</td>\n<td>ev<strong>in önünde</strong> — пред къщата</td>\n</tr>\n<tr class=\"even\">\n<td>arka</td>\n<td>задна част</td>\n<td>-in arkasında</td>\n<td>ev<strong>in arkasında</strong> — зад къщата</td>\n</tr>\n<tr class=\"odd\">\n<td>yan</td>\n<td>страна</td>\n<td>-in yanında</td>\n<td>ben<strong>im yanımda</strong> — до мен</td>\n</tr>\n<tr class=\"even\">\n<td>ara</td>\n<td>междина</td>\n<td>-in arasında</td>\n<td>ikis<strong>inin arasında</strong> — между двамата</td>\n</tr>\n<tr class=\"odd\">\n<td>karşı</td>\n<td>отсрещна страна</td>\n<td>-in karşısında</td>\n<td>okul<strong>un karşısında</strong> — срещу училището</td>\n</tr>\n</tbody>\n</table>\n<p><strong>Схемата е винаги една и съща:</strong> родителен падеж +\nпространствената дума с притежателен афикс + падеж</p>\n<p><code>masa-nın üst-ü-nde</code> = „в горната част на масата“</p>\n<p><strong>И трите падежа работят:</strong></p>\n<div class=\"line-block\">masanın üstü<strong>nde</strong> | върху масата\n<em>(къде)</em> |<br />\nmasanın üstü<strong>ne</strong> | върху масата <em>(накъде — сложи го\nтам)</em> |<br />\nmasanın üstü<strong>nden</strong> | от масата <em>(откъде — вземи го\nоттам)</em> |</div>\n<p><strong>Може и без родителен падеж</strong>, когато първата дума е\nобща: <code>masa üstünde</code> е по-разговорно,\n<code>masanın üstünde</code> — по-точно.</p>\n<h3 id=\"граматика-16.6-комбинация--ki-пространствена-дума\">Граматика\n16.6 — Комбинация: <code>-ki</code> + пространствена дума</h3>\n<p>Двете се съчетават често:</p>\n<ul>\n<li>masanın üstü<strong>ndeki</strong> kitap — книгата върху масата</li>\n<li>çantanın içi<strong>ndeki</strong> para — парите вътре в\nчантата</li>\n<li>evin önü<strong>ndeki</strong> araba — колата пред къщата</li>\n</ul>\n<h3 id=\"защо-е-така-neden-böyle-15\">Защо е така · Neden böyle</h3>\n<p><strong>Защо турският има отделен афикс за това?</strong> Защото няма\nотносителни местоимения като „който“. Българският казва „книгата,\n<strong>която</strong> е на масата“ — цяло подчинено изречение. Турският\nсвива всичко в едно определение пред думата:\n<code>masadaki kitap</code>. Това е основният му принцип — определението\nстои преди определяемото и е компактно.</p>\n<p><strong>Защо <code>-ki</code> не спазва гласната хармония?</strong>\nЗащото е заемка от персийски (<code>ke</code>), а заемките често остават\n„замръзнали“. Същото е и с <code>-yor</code>. Изключението\n<code>-kü</code> след <code>dün</code>, <code>bugün</code> е по-късно\nразвитие под влияние на устната реч.</p>\n<p><strong>Защо се появява <code>-n-</code> в\n<code>masadakini</code>?</strong> Защото <code>-ki</code> завършва на\nгласна и след него не може да дойде направо падежно окончание, започващо\nс гласна. Това е същата буква-свръзка, която видя при\n<code>evi-n-de</code> (неговата къща). Турският използва <code>n</code>\nкато универсален съединител.</p>\n<p><strong>Защо пространствените отношения са изафет, а не\nпредлози?</strong> Защото исторически турският изразява всичко чрез\nсъществителни: „върху масата“ = „в горната-част на масата“. Затова тези\nдуми се скланят като нормални съществителни и могат да вземат\nпритежателен афикс за всяко лице: <code>yanımda</code> (до мен),\n<code>yanında</code> (до теб/него), <code>yanımızda</code> (до нас).</p>\n<h3 id=\"текст-за-четене-и-превод-okuma-ve-çeviri-metni-14\">Текст за\nчетене и превод · Okuma ve çeviri metni</h3>\n<p><strong>Kayıp anahtar — Изгубеният ключ</strong></p>\n<blockquote>\n<p>— Anne, anahtarımı bulamıyorum!</p>\n<p>— Masanın üstüne baktın mı?</p>\n<p>— Baktım, orada yok. Çantanın içine de baktım.</p>\n<p>— Dünkü ceketinin cebinde olabilir mi?</p>\n<p>— Ay, doğru! Dün akşamki ceketimi giymemiştim bugün.</p>\n<p>— Dolabın içindeki askıda asılı. Bir bak bakalım.</p>\n<p>— Buldum! Cebindeymiş. Teşekkürler anne.</p>\n<p>— Bir dahaki sefere anahtarını hep aynı yere koy. Kapının yanındaki\nkâsede mesela.</p>\n<p>— Haklısın. Yandaki masada duran o küçük kâse mi?</p>\n<p>— Evet, oradaki. Böylece hiç aramazsın.</p>\n</blockquote>\n<p><em>Нови думи:</em> <code>kayıp</code> — изгубен; <code>ceket</code>\n— сако; <code>cep</code> — джоб; <code>giymek</code> — обличам;\n<code>askı</code> — закачалка; <code>asılı</code> — окачен;\n<code>bir dahaki sefere</code> — следващия път; <code>kâse</code> —\nкупа; <code>mesela</code> — например; <code>durmak</code> — стоя;\n<code>böylece</code> — така.</p>\n<p><strong>Въпроси:</strong></p>\n<ol type=\"1\">\n<li>Çocuk neyi arıyor?</li>\n<li>Anahtar nerede bulunmuş?</li>\n<li>Ceket nerede asılı?</li>\n<li>Anne nereye koymasını söylüyor?</li>\n</ol>\n<h3 id=\"упражнения-alıştırmalar-15\">Упражнения · Alıştırmalar</h3>\n<p><strong>Упр. 16.1 — Направи с <code>-ki</code>.</strong> <em>(„-ki“\nile yapın.)</em></p>\n<p>Пример: masa + kitap → masadaki kitap</p>\n<ol type=\"1\">\n<li>çanta + kalem</li>\n<li>ev + insanlar</li>\n<li>sınıf + öğrenciler</li>\n<li>İstanbul + arkadaşım</li>\n<li>dün + gazete</li>\n<li>bugün + hava</li>\n<li>sabah + toplantı</li>\n<li>şimdi + durum</li>\n</ol>\n<p><strong>Упр. 16.2 — Замени с <code>-ki</code> форма.</strong>\n<em>(„-ki“ biçimiyle değiştirin.)</em></p>\n<p>Пример: benim kitabım → benimki</p>\n<ol type=\"1\">\n<li>senin araban</li>\n<li>onun evi</li>\n<li>bizim okulumuz</li>\n<li>sizin kitabınız</li>\n<li>Ali’nin arabası</li>\n</ol>\n<p><strong>Упр. 16.3 — Постави падежно окончание (внимавай с\n<code>-n-</code>).</strong> <em>(Hâl eki ekleyin.)</em></p>\n<ol type=\"1\">\n<li>masadaki + винителен</li>\n<li>çantadaki + мн.ч. + винителен</li>\n<li>benimki + винителен</li>\n<li>evdeki + дателен</li>\n<li>oradaki + изходен</li>\n</ol>\n<p><strong>Упр. 16.4 — Пространствени изрази.</strong> <em>(Yer\nifadeleri.)</em></p>\n<p>Пример: masa / üst / върху → masanın üstünde</p>\n<ol type=\"1\">\n<li>masa / alt / под</li>\n<li>çanta / iç / вътре в</li>\n<li>ev / ön / пред</li>\n<li>ev / arka / зад</li>\n<li>okul / karşı / срещу</li>\n<li>ben / yan / до</li>\n</ol>\n<p><strong>Упр. 16.5 — Кой падеж? (nerede, nereye, nereden)</strong>\n<em>(Hangi hâl?)</em></p>\n<ol type=\"1\">\n<li>Kitap masanın üstü___ . (къде е)</li>\n<li>Kitabı masanın üstü___ koy. (накъде)</li>\n<li>Kitabı masanın üstü___ al. (откъде)</li>\n<li>Araba evin önü___ duruyor. (къде)</li>\n<li>Arabayı evin önü___ çek. (накъде)</li>\n</ol>\n<p><strong>Упр. 16.6 — Преведи на турски.</strong> <em>(Türkçeye\nçevirin.)</em></p>\n<ol type=\"1\">\n<li>книгата на масата</li>\n<li>вчерашният вестник</li>\n<li>Дай ми този от масата.</li>\n<li>Моят е по-хубав.</li>\n<li>под масата</li>\n<li>пред къщата</li>\n<li>колата пред къщата</li>\n<li>Извади тези от чантата.</li>\n</ol>\n<h3>Тематичен речник · Konu sözlüğü — Институции и услуги · Kurumlar ve hizmetler</h3><table><thead><tr><th>Türkçe</th><th>Български</th></tr></thead><tbody><tr><td>belediye</td><td>община</td></tr><tr><td>valilik</td><td>областна управа</td></tr><tr><td>karakol</td><td>полицейски участък</td></tr><tr><td>adliye</td><td>съдебна палата</td></tr><tr><td>itfaiye</td><td>пожарна</td></tr><tr><td>muhtar</td><td>кмет на квартал или село</td></tr><tr><td>fotoğrafçı</td><td>фотограф</td></tr><tr><td>postacı</td><td>пощальон</td></tr><tr><td>güvenlik</td><td>охрана, сигурност</td></tr><tr><td>kontrat</td><td>договор</td></tr><tr><td>form</td><td>формуляр</td></tr><tr><td>kasiyer</td><td>касиер</td></tr><tr><td>eczacı</td><td>аптекар</td></tr><tr><td>terzi</td><td>шивач</td></tr><tr><td>tamirci</td><td>майстор, ремонтчик</td></tr></tbody></table><p><strong>Упр. 16.7 — Как е на турски?</strong> <em>(Türkçesi nedir?)</em></p><ol type=\"1\"><li>община</li><li>полицейски участък</li><li>пожарна</li><li>пощальон</li><li>охрана</li><li>формуляр</li><li>касиер</li><li>шивач</li></ol><hr />\n<h2 id=\"урок-17-причастия-sıfat-fiiller-ortaçlar\">УРОК 17 · Причастия ·\nSıfat-fiiller (ortaçlar)</h2>\n<h3 id=\"речник-sözlük-15\">Речник · Sözlük</h3>\n<table>\n<thead>\n<tr class=\"header\">\n<th>Турски</th>\n<th>Български</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>tanımak</td>\n<td>познавам</td>\n</tr>\n<tr class=\"even\">\n<td>bilinmek</td>\n<td>известен съм</td>\n</tr>\n<tr class=\"odd\">\n<td>yaşamak</td>\n<td>живея</td>\n</tr>\n<tr class=\"even\">\n<td>çalışan</td>\n<td>работещ</td>\n</tr>\n<tr class=\"odd\">\n<td>gelen</td>\n<td>идващ</td>\n</tr>\n<tr class=\"even\">\n<td>giden</td>\n<td>заминаващ</td>\n</tr>\n<tr class=\"odd\">\n<td>bilen</td>\n<td>знаещ</td>\n</tr>\n<tr class=\"even\">\n<td>oturan</td>\n<td>живеещ, седящ</td>\n</tr>\n<tr class=\"odd\">\n<td>konuşan</td>\n<td>говорещ</td>\n</tr>\n<tr class=\"even\">\n<td>gören</td>\n<td>виждащ</td>\n</tr>\n<tr class=\"odd\">\n<td>olay</td>\n<td>случка</td>\n</tr>\n<tr class=\"even\">\n<td>kişi</td>\n<td>лице, човек</td>\n</tr>\n<tr class=\"odd\">\n<td>yer</td>\n<td>място</td>\n</tr>\n<tr class=\"even\">\n<td>zaman</td>\n<td>време</td>\n</tr>\n<tr class=\"odd\">\n<td>konu</td>\n<td>тема</td>\n</tr>\n<tr class=\"even\">\n<td>sebep</td>\n<td>причина</td>\n</tr>\n<tr class=\"odd\">\n<td>sonuç</td>\n<td>резултат</td>\n</tr>\n<tr class=\"even\">\n<td>örnek</td>\n<td>пример</td>\n</tr>\n<tr class=\"odd\">\n<td>durum</td>\n<td>положение</td>\n</tr>\n<tr class=\"even\">\n<td>deneyim</td>\n<td>опит</td>\n</tr>\n</tbody>\n</table>\n<h3 id=\"граматика-17.1-какво-е-причастие-sıfat-fiil\">Граматика 17.1 —\nКакво е причастие · Sıfat-fiil</h3>\n<p>Причастието превръща глагол в определение. Българският има същото\n(„работещ човек“, „написана книга“), но турският го използва много\nпо-широко — с него замества цели подчинени изречения.</p>\n<p><strong>Основното правило:</strong> причастието стои\n<strong>пред</strong> думата, която определя, и не се мени по род и\nчисло.</p>\n<table>\n<thead>\n<tr class=\"header\">\n<th>Турски</th>\n<th>Български</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>çalış<strong>an</strong> adam</td>\n<td>работещ<strong>ият</strong> мъж / мъжът, който работи</td>\n</tr>\n<tr class=\"even\">\n<td>gel<strong>en</strong> misafir</td>\n<td>идващият гост / гостът, който идва</td>\n</tr>\n<tr class=\"odd\">\n<td>oku<strong>duğum</strong> kitap</td>\n<td>книгата, която чета/четох</td>\n</tr>\n<tr class=\"even\">\n<td>oku<strong>yacağım</strong> kitap</td>\n<td>книгата, която ще чета</td>\n</tr>\n</tbody>\n</table>\n<h3 id=\"граматика-17.2--an--en-подлогово-причастие\">Граматика 17.2 —\n<code>-an / -en</code> (подлогово причастие)</h3>\n<p>Използва се, когато определяемата дума е <strong>вършителят</strong>\nна действието.</p>\n<p><strong>Корен + -an / -en</strong> <em>(след гласна: -yan /\n-yen)</em></p>\n<table>\n<thead>\n<tr class=\"header\">\n<th>Глагол</th>\n<th>Причастие</th>\n<th>Превод</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>çalışmak</td>\n<td>çalış<strong>an</strong></td>\n<td>работещ</td>\n</tr>\n<tr class=\"even\">\n<td>gelmek</td>\n<td>gel<strong>en</strong></td>\n<td>идващ</td>\n</tr>\n<tr class=\"odd\">\n<td>bilmek</td>\n<td>bil<strong>en</strong></td>\n<td>знаещ</td>\n</tr>\n<tr class=\"even\">\n<td>oturmak</td>\n<td>otur<strong>an</strong></td>\n<td>седящ, живеещ</td>\n</tr>\n<tr class=\"odd\">\n<td>okumak</td>\n<td>oku<strong>yan</strong></td>\n<td>четящ</td>\n</tr>\n<tr class=\"even\">\n<td>beklemek</td>\n<td>bekle<strong>yen</strong></td>\n<td>чакащ</td>\n</tr>\n</tbody>\n</table>\n<p>Примери: - Türkçe bil<strong>en</strong> bir arkadaşım var. — Имам\nприятел, който знае турски. - Burada otur<strong>an</strong> insanlar\nçok kibar. — Хората, които живеят тук, са много любезни. - Dün\ngel<strong>en</strong> misafir kimdi? — Кой беше гостът, който дойде\nвчера? - Kapıda bekle<strong>yen</strong> adam babam. — Мъжът, който\nчака на вратата, е баща ми.</p>\n<p><strong>Отрицание:</strong> <code>çalışmayan</code> (който не\nработи), <code>gelmeyen</code> (който не идва)</p>\n<p><strong>Причастието може да стои само</strong> — тогава е\nсъществително: - Gel<strong>enler</strong> oturdu. — Дошлите седнаха. -\nBil<strong>en</strong> bilir. — Който знае, знае.</p>\n<h3 id=\"граматика-17.3--dık-обектово-причастие\">Граматика 17.3 —\n<code>-dık</code> (обектово причастие)</h3>\n<p>Използва се, когато определяемата дума <strong>НЕ е</strong>\nвършителят, а обект, място, време или обстоятелство. Тогава вършителят\nсе изразява с притежателен афикс.</p>\n<p><strong>Корен + -dık/-dik/-duk/-dük (или -tık/-tik/-tuk/-tük) +\nпритежателен афикс</strong></p>\n<table>\n<thead>\n<tr class=\"header\">\n<th>Лице</th>\n<th>okumak</th>\n<th>Превод</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>ben</td>\n<td>oku<strong>duğum</strong></td>\n<td>който аз чета/четох</td>\n</tr>\n<tr class=\"even\">\n<td>sen</td>\n<td>oku<strong>duğun</strong></td>\n<td>който ти четеш</td>\n</tr>\n<tr class=\"odd\">\n<td>o</td>\n<td>oku<strong>duğu</strong></td>\n<td>който той чете</td>\n</tr>\n<tr class=\"even\">\n<td>biz</td>\n<td>oku<strong>duğumuz</strong></td>\n<td>който ние четем</td>\n</tr>\n<tr class=\"odd\">\n<td>siz</td>\n<td>oku<strong>duğunuz</strong></td>\n<td>който вие четете</td>\n</tr>\n<tr class=\"even\">\n<td>onlar</td>\n<td>oku<strong>dukları</strong></td>\n<td>който те четат</td>\n</tr>\n</tbody>\n</table>\n<p><strong>Внимавай:</strong> <code>k</code> става <code>ğ</code> пред\nгласна (<code>okuduk</code> + <code>um</code> →\n<code>okuduğum</code>).</p>\n<p>Примери: - Oku<strong>duğum</strong> kitap çok güzeldi. — Книгата,\nкоято четох, беше много хубава. - Otur<strong>duğun</strong> ev nerede?\n— Къде е къщата, в която живееш? - Tanı<strong>dığım</strong> biri\ndeğil. — Не е някой, когото познавам. - Ali’nin\nçalış<strong>tığı</strong> şirket büyük. — Фирмата, в която Али работи,\nе голяма.</p>\n<p><strong>Отрицание:</strong> <code>okumadığım</code> (който не чета),\n<code>gitmediğim</code> (където не отидох)</p>\n<h3 id=\"граматика-17.4--acak-бъдещо-причастие\">Граматика 17.4 —\n<code>-acak</code> (бъдещо причастие)</h3>\n<p>Същото като <code>-dık</code>, но за бъдеще:</p>\n<div class=\"line-block\">oku<strong>yacağım</strong> kitap | книгата,\nкоято ще чета |<br />\ngid<strong>eceğim</strong> yer | мястото, където ще отида |<br />\nyap<strong>acağın</strong> iş | работата, която ще вършиш |</div>\n<p>Примери: - Yarın gid<strong>eceğim</strong> yer çok uzak. — Мястото,\nкъдето ще отида утре, е много далече. - Alacağım araba kırmızı olacak. —\nКолата, която ще купя, ще бъде червена.</p>\n<h3 id=\"граматика-17.5-как-да-избереш-между--an-и--dık\">Граматика 17.5 —\nКак да избереш между <code>-an</code> и <code>-dık</code></h3>\n<p>Задай си въпроса: <strong>определяемата дума върши ли\nдействието?</strong></p>\n<table>\n<thead>\n<tr class=\"header\">\n<th>Изречение</th>\n<th>Кой върши действието</th>\n<th>Причастие</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>мъжът, <strong>който</strong> чете</td>\n<td>мъжът чете</td>\n<td>oku<strong>yan</strong> adam</td>\n</tr>\n<tr class=\"even\">\n<td>книгата, <strong>която</strong> чета</td>\n<td>аз чета</td>\n<td>oku<strong>duğum</strong> kitap</td>\n</tr>\n<tr class=\"odd\">\n<td>човекът, <strong>който</strong> дойде</td>\n<td>човекът дойде</td>\n<td>gel<strong>en</strong> adam</td>\n</tr>\n<tr class=\"even\">\n<td>денят, <strong>в който</strong> дойде</td>\n<td>той дойде</td>\n<td>gel<strong>diği</strong> gün</td>\n</tr>\n</tbody>\n</table>\n<p><strong>Проверка на български:</strong> ако можеш да замениш „който“\nс „когото/която/където“ — значи е <code>-dık</code>.</p>\n<h3 id=\"граматика-17.6-полезни-готови-изрази-с-причастия\">Граматика 17.6\n— Полезни готови изрази с причастия</h3>\n<div class=\"line-block\">olan | който е | Sorun olan şey… |<br />\nbulunan | който се намира | Merkezde bulunan otel |<br />\ndenilen / denen | наречен | Ahmet denilen adam |<br />\ngeçen | миналият | geçen hafta |<br />\ngelecek | следващият | gelecek yıl |<br />\nkalan | оставащият | kalan para |<br />\nbilinen | известният | bilinen bir gerçek |<br />\nistediğim | който искам | istediğim gibi |<br />\ndediğim | което казвам | dediğim gibi — както казвам |<br />\ngördüğüm kadarıyla | доколкото виждам | |<br />\nbildiğim kadarıyla | доколкото знам | |</div>\n<h3 id=\"защо-е-така-neden-böyle-16\">Защо е така · Neden böyle</h3>\n<p><strong>Защо турският има две причастия, а българският —\nедно?</strong> Защото българският разчита на относителни местоимения\n(„който, когото, където“), които сами показват ролята. Турският няма\nтакива думи, затова кодира ролята в самото причастие: <code>-an</code> =\nопределяемото е подлог, <code>-dık</code> = определяемото е нещо\nдруго.</p>\n<p>Сравни: - Мъжът, <strong>който</strong> чете →\noku<strong>yan</strong> adam - Книгата, <strong>която</strong> чета →\noku<strong>duğum</strong> kitap</p>\n<p>Едно и също „който“ на български, две различни форми на турски.</p>\n<p><strong>Защо <code>-dık</code> носи притежателен афикс?</strong>\nЗащото трябва да покаже <strong>кой</strong> върши действието — след\nкато определяемото не е вършителят. <code>okuduğum</code> = „моето\nчетено“, <code>okuduğun</code> = „твоето четено“. Буквално е отглаголно\nсъществително с притежание.</p>\n<p><strong>Защо това е трудно за българи?</strong> Защото изисква\nобръщане на реда. Българинът мисли „книгата, която четох“ — първо\nсъществителното, после подчиненото изречение. Турският го иска обратно:\n<code>okuduğum kitap</code> — първо определението, после\nсъществителното. Упражнявай се, като първо намираш кой върши действието,\nпосле подреждаш.</p>\n<p><strong>Полезен ориентир:</strong> ако в българското изречение след\n„който“ идва глагол — най-вероятно е <code>-an</code>. Ако идва подлог\n(„която <strong>аз</strong> четох“) — <code>-dık</code>.</p>\n<h3 id=\"текст-за-четене-и-превод-okuma-ve-çeviri-metni-15\">Текст за\nчетене и превод · Okuma ve çeviri metni</h3>\n<p><strong>Aradığım ev — Къщата, която търся</strong></p>\n<blockquote>\n<p>Uzun zamandır oturduğum daire artık bana küçük geliyor. Bu yüzden\nyeni bir ev arıyorum. Aradığım ev çok büyük olmak zorunda değil, ama\niçinde çalışabileceğim ayrı bir oda olsun istiyorum.</p>\n<p>Şu anda baktığım ilanların çoğu şehir merkezinde. Merkezde bulunan\nevler daha pahalı ama işe yürüyerek gidebilirim. Dışarıda oturan\narkadaşlarım her sabah trafikte bir saat kaybediyor.</p>\n<p>Geçen hafta gördüğüm bir daire çok hoşuma gitti. Balkonu olan, güneş\nalan güzel bir yerdi. Ama istedikleri kira benim ödeyebileceğimden\nfazlaydı.</p>\n<p>Emlakçının söylediğine göre gelecek ay yeni ilanlar çıkacakmış.\nBekleyeceğim. Acele edip yanlış karar vermek istemiyorum.</p>\n</blockquote>\n<p><em>Нови думи:</em> <code>daire</code> — апартамент;\n<code>ayrı</code> — отделен; <code>ilan</code> — обява;\n<code>merkez</code> — център; <code>kaybetmek</code> — губя;\n<code>hoşuna gitmek</code> — харесва ми; <code>balkon</code> — балкон;\n<code>güneş almak</code> — огрява се от слънце; <code>ödemek</code> —\nплащам; <code>emlakçı</code> — брокер; <code>acele etmek</code> —\nприбързвам; <code>yanlış</code> — грешен.</p>\n<p><strong>Въпроси:</strong></p>\n<ol type=\"1\">\n<li>Neden yeni bir ev arıyor?</li>\n<li>Aradığı evde ne olmasını istiyor?</li>\n<li>Geçen hafta gördüğü daire nasıldı?</li>\n<li>Neden o daireyi tutmadı?</li>\n</ol>\n<h3 id=\"упражнения-alıştırmalar-16\">Упражнения · Alıştırmalar</h3>\n<p><strong>Упр. 17.1 — Направи причастие на\n<code>-an / -en</code>.</strong> <em>(„-an/-en“ ortacı yapın.)</em></p>\n<ol type=\"1\">\n<li>çalışmak</li>\n<li>gelmek</li>\n<li>bilmek</li>\n<li>oturmak</li>\n<li>okumak</li>\n<li>beklemek</li>\n<li>konuşmak</li>\n<li>görmek</li>\n</ol>\n<p><strong>Упр. 17.2 — Направи причастие на <code>-dık</code> за\nпосоченото лице.</strong> <em>(„-dık“ ortacı yapın.)</em></p>\n<ol type=\"1\">\n<li>okumak (ben)</li>\n<li>oturmak (sen)</li>\n<li>çalışmak (o)</li>\n<li>görmek (biz)</li>\n<li>yapmak (siz)</li>\n<li>bilmek (onlar)</li>\n</ol>\n<p><strong>Упр. 17.3 — <code>-an</code> или <code>-dık</code>?</strong>\n<em>(„-an“ mı, „-dık“ mı?)</em></p>\n<ol type=\"1\">\n<li>мъжът, който работи → (çalışmak) ___ adam</li>\n<li>книгата, която четох → (okumak, ben) ___ kitap</li>\n<li>гостът, който дойде → (gelmek) ___ misafir</li>\n<li>къщата, в която живееш → (oturmak, sen) ___ ev</li>\n<li>човекът, който знае → (bilmek) ___ kişi</li>\n<li>филмът, който гледахме → (izlemek, biz) ___ film</li>\n</ol>\n<p><strong>Упр. 17.4 — Преобразувай в причастна конструкция.</strong>\n<em>(Ortaç yapısına çevirin.)</em></p>\n<p>Пример: Bir adam çalışıyor. O adam babam. → Çalışan adam babam.</p>\n<ol type=\"1\">\n<li>Bir kız geldi. O kız arkadaşım.</li>\n<li>Bir kitap okudum. O kitap güzeldi.</li>\n<li>Bir evde oturuyorsun. O ev nerede?</li>\n<li>Bir şirkette çalışıyor. O şirket büyük.</li>\n</ol>\n<p><strong>Упр. 17.5 — Бъдещо причастие <code>-acak</code>.</strong>\n<em>(„-acak“ ortacı.)</em></p>\n<ol type=\"1\">\n<li>okumak (ben) + kitap</li>\n<li>gitmek (ben) + yer</li>\n<li>yapmak (sen) + iş</li>\n<li>almak (biz) + araba</li>\n</ol>\n<p><strong>Упр. 17.6 — Преведи на турски.</strong> <em>(Türkçeye\nçevirin.)</em></p>\n<ol type=\"1\">\n<li>Имам приятел, който знае турски.</li>\n<li>Книгата, която четох, беше много хубава.</li>\n<li>Къде е къщата, в която живееш?</li>\n<li>Мъжът, който чака на вратата, е баща ми.</li>\n<li>Мястото, където ще отида утре, е далече.</li>\n<li>Хората, които живеят тук, са любезни.</li>\n<li>доколкото знам</li>\n<li>както казвам</li>\n</ol>\n<h3>Тематичен речник · Konu sözlüğü — География и климат · Coğrafya ve iklim</h3><table><thead><tr><th>Türkçe</th><th>Български</th></tr></thead><tbody><tr><td>tepe</td><td>хълм</td></tr><tr><td>vadi</td><td>долина</td></tr><tr><td>okyanus</td><td>океан</td></tr><tr><td>ada</td><td>остров</td></tr><tr><td>yarımada</td><td>полуостров</td></tr><tr><td>kıyı</td><td>бряг</td></tr><tr><td>çöl</td><td>пустиня</td></tr><tr><td>gökyüzü</td><td>небе</td></tr><tr><td>yıldız</td><td>звезда</td></tr><tr><td>iklim</td><td>климат</td></tr><tr><td>yıldırım</td><td>гръм, мълния</td></tr><tr><td>deprem</td><td>земетресение</td></tr><tr><td>çevre</td><td>околна среда</td></tr><tr><td>doğal</td><td>естествен</td></tr><tr><td>orman</td><td>гора</td></tr><tr><td>dere</td><td>поток</td></tr></tbody></table><p><strong>Упр. 17.7 — Как е на турски?</strong> <em>(Türkçesi nedir?)</em></p><ol type=\"1\"><li>хълм</li><li>долина</li><li>остров</li><li>бряг</li><li>климат</li><li>земетресение</li><li>околна среда</li><li>естествен</li></ol><hr />\n<h2 id=\"урок-18-деепричастия-zarf-fiiller-ulaçlar\">УРОК 18 ·\nДеепричастия · Zarf-fiiller (ulaçlar)</h2>\n<h3 id=\"речник-sözlük-16\">Речник · Sözlük</h3>\n<table>\n<thead>\n<tr class=\"header\">\n<th>Турски</th>\n<th>Български</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>koşmak</td>\n<td>тичам</td>\n</tr>\n<tr class=\"even\">\n<td>gülmek</td>\n<td>смея се</td>\n</tr>\n<tr class=\"odd\">\n<td>ağlamak</td>\n<td>плача</td>\n</tr>\n<tr class=\"even\">\n<td>düşünmek</td>\n<td>мисля</td>\n</tr>\n<tr class=\"odd\">\n<td>şarkı söylemek</td>\n<td>пея</td>\n</tr>\n<tr class=\"even\">\n<td>dinlenmek</td>\n<td>почивам</td>\n</tr>\n<tr class=\"odd\">\n<td>beklemek</td>\n<td>чакам</td>\n</tr>\n<tr class=\"even\">\n<td>aramak</td>\n<td>търся; звъня</td>\n</tr>\n<tr class=\"odd\">\n<td>bulmak</td>\n<td>намирам</td>\n</tr>\n<tr class=\"even\">\n<td>kalkmak</td>\n<td>ставам</td>\n</tr>\n<tr class=\"odd\">\n<td>oturmak</td>\n<td>сядам</td>\n</tr>\n<tr class=\"even\">\n<td>girmek</td>\n<td>влизам</td>\n</tr>\n<tr class=\"odd\">\n<td>çıkmak</td>\n<td>излизам</td>\n</tr>\n<tr class=\"even\">\n<td>dönmek</td>\n<td>връщам се</td>\n</tr>\n<tr class=\"odd\">\n<td>bitirmek</td>\n<td>завършвам</td>\n</tr>\n<tr class=\"even\">\n<td>başlamak</td>\n<td>започвам</td>\n</tr>\n<tr class=\"odd\">\n<td>devam etmek</td>\n<td>продължавам</td>\n</tr>\n<tr class=\"even\">\n<td>durmak</td>\n<td>спирам</td>\n</tr>\n<tr class=\"odd\">\n<td>unutmak</td>\n<td>забравям</td>\n</tr>\n<tr class=\"even\">\n<td>hatırlamak</td>\n<td>спомням си</td>\n</tr>\n</tbody>\n</table>\n<h3 id=\"граматика-18.1-какво-е-деепричастие-zarf-fiil\">Граматика 18.1 —\nКакво е деепричастие · Zarf-fiil</h3>\n<p>Деепричастието свързва две действия в едно изречение, без съюз.\nБългарският има подобно („тичайки“, „като дойде“), но турският разполага\nс десетки такива форми и ги използва постоянно.</p>\n<p><strong>Основно правило:</strong> деепричастието стои в първата част,\nглавният глагол — накрая, и той носи времето и лицето.</p>\n<p><code>Eve gel**ince** seni ara**dım**.</code> — Като се прибрах, ти\nзвъннах. <em>(<code>gelince</code> няма време и лице — те са в\n<code>aradım</code>)</em></p>\n<h3 id=\"граматика-18.2--arak--erek-като-чрез\">Граматика 18.2 —\n<code>-arak / -erek</code> (като, чрез)</h3>\n<p>Показва <strong>начин</strong> на извършване:</p>\n<ul>\n<li>Koş<strong>arak</strong> geldim. — Дойдох тичайки.</li>\n<li>Gül<strong>erek</strong> konuştu. — Говореше смеейки се.</li>\n<li>Otobüsle gid<strong>erek</strong> vardık. — Стигнахме с\nавтобус.</li>\n<li>Çalış<strong>arak</strong> öğrenirsin. — Като работиш, ще\nнаучиш.</li>\n</ul>\n<p><strong>След гласна: -yarak / -yerek</strong> —\n<code>okuyarak</code>, <code>bekleyerek</code></p>\n<p><strong>Специална форма:</strong> <code>olarak</code> — „като, в\nкачеството на“ <code>Öğretmen olarak çalışıyorum.</code> — Работя като\nучител.</p>\n<h3 id=\"граматика-18.3--ıp--ip--up--üp-и-после\">Граматика 18.3 —\n<code>-ıp / -ip / -up / -üp</code> (и, после)</h3>\n<p>Свързва две последователни действия на <strong>един и същ\nподлог</strong>. Заменя „и“ — така не се повтаря времето:</p>\n<ul>\n<li>Kalk<strong>ıp</strong> gitti. — Стана и си тръгна.</li>\n<li>Yemek yiy<strong>ip</strong> uyudum. — Ядох и заспах.</li>\n<li>Eve gel<strong>ip</strong> duş aldım. — Прибрах се и се\nизкъпах.</li>\n</ul>\n<p>Сравни: - <code>Kalktı ve gitti.</code> — правилно, но по-тежко -\n<code>Kalkıp gitti.</code> — по-естествено за турския</p>\n<p><strong>Важно:</strong> двете действия трябва да имат <strong>един\nподлог</strong>. Не може <del>Ben gelip o gitti</del>.</p>\n<p><strong>Отрицание:</strong> <code>-mayıp / -meyip</code> —\n<code>gitmeyip kaldı</code> (не отиде, а остана)</p>\n<h3 id=\"граматика-18.4--ınca--ince-когато-щом\">Граматика 18.4 —\n<code>-ınca / -ince</code> (когато, щом)</h3>\n<p>Показва <strong>момент</strong> — щом стане едното, става\nдругото:</p>\n<ul>\n<li>Eve gel<strong>ince</strong> beni ara. — Като се прибереш, звънни\nми.</li>\n<li>Yağmur yağ<strong>ınca</strong> içeri girdik. — Щом заваля, влязохме\nвътре.</li>\n<li>Onu gör<strong>ünce</strong> çok sevindim. — Като го видях, много се\nзарадвах.</li>\n</ul>\n<p><strong>След гласна: -yınca / -yince</strong> —\n<code>okuyunca</code>, <code>bekleyince</code></p>\n<h3 id=\"граматика-18.5--ken-докато-когато\">Граматика 18.5 —\n<code>-ken</code> (докато, когато)</h3>\n<p>Показва <strong>едновременност</strong>. Прикача се към време, не към\nкорен:</p>\n<table>\n<thead>\n<tr class=\"header\">\n<th>Форма</th>\n<th>Пример</th>\n<th>Превод</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>geniş + ken</td>\n<td>gel<strong>irken</strong></td>\n<td>докато идвах</td>\n</tr>\n<tr class=\"even\">\n<td>-yor + ken</td>\n<td>çalışıyor<strong>ken</strong></td>\n<td>докато работех</td>\n</tr>\n<tr class=\"odd\">\n<td>-acak + ken</td>\n<td>gidecek<strong>ken</strong></td>\n<td>тъкмо щях да отида</td>\n</tr>\n<tr class=\"even\">\n<td>именно</td>\n<td>öğrenci<strong>yken</strong></td>\n<td>докато бях студент</td>\n</tr>\n<tr class=\"odd\">\n<td>çocuk<strong>ken</strong></td>\n<td>докато бях дете</td>\n<td></td>\n</tr>\n</tbody>\n</table>\n<p>Примери: - Eve gid<strong>erken</strong> Ali’yi gördüm. — Докато се\nприбирах, видях Али. - Çocuk<strong>ken</strong> çok yaramazdım. — Като\nдете бях много палав. - Tam çıkacak<strong>ken</strong> telefon çaldı. —\nТъкмо щях да изляза, телефонът звънна.</p>\n<p><strong><code>-ken</code> никога не се мени по хармония</strong> —\nвинаги <code>-ken</code>, не <code>-kan</code>.</p>\n<h3 id=\"граматика-18.6--madan-без-да-преди-да\">Граматика 18.6 —\n<code>-madan</code> (без да, преди да)</h3>\n<table>\n<thead>\n<tr class=\"header\">\n<th>Значение</th>\n<th>Пример</th>\n<th>Превод</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>без да</td>\n<td>Söyle<strong>meden</strong> gitti.</td>\n<td>Тръгна си без да каже.</td>\n</tr>\n<tr class=\"even\">\n<td>преди да</td>\n<td>Gel<strong>meden</strong> önce ara.</td>\n<td>Обади се, преди да дойдеш.</td>\n</tr>\n</tbody>\n</table>\n<ul>\n<li>Bakmadan geçti. — Мина без да погледне.</li>\n<li>Yemek yemeden çıkma. — Не излизай, без да ядеш.</li>\n<li>Ders bitmeden çıkmayın. — Не излизайте, преди да свърши урокът.</li>\n</ul>\n<h3 id=\"граматика-18.7--dıkça-колкото-повече-всеки-път-когато\">Граматика\n18.7 — <code>-dıkça</code> (колкото повече, всеки път когато)</h3>\n<ul>\n<li>Gör<strong>dükçe</strong> özlüyorum. — Всеки път като го видя, ми\nлипсва.</li>\n<li>Çalış<strong>tıkça</strong> öğreniyorsun. — Колкото повече работиш,\nтолкова повече учиш.</li>\n<li>Zaman geç<strong>tikçe</strong> unutulur. — С течение на времето се\nзабравя.</li>\n</ul>\n<h3 id=\"граматика-18.8-обобщение\">Граматика 18.8 — Обобщение</h3>\n<table>\n<thead>\n<tr class=\"header\">\n<th>Деепричастие</th>\n<th>Значение</th>\n<th>Пример</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>-arak / -erek</td>\n<td>как, чрез</td>\n<td>koşarak — тичайки</td>\n</tr>\n<tr class=\"even\">\n<td>-ıp</td>\n<td>и, после</td>\n<td>kalkıp — като стана</td>\n</tr>\n<tr class=\"odd\">\n<td>-ınca</td>\n<td>щом, когато</td>\n<td>gelince — щом дойде</td>\n</tr>\n<tr class=\"even\">\n<td>-ken</td>\n<td>докато</td>\n<td>gelirken — докато идваше</td>\n</tr>\n<tr class=\"odd\">\n<td>-madan</td>\n<td>без да / преди да</td>\n<td>söylemeden — без да каже</td>\n</tr>\n<tr class=\"even\">\n<td>-dıkça</td>\n<td>колкото повече</td>\n<td>gördükçe — всеки път като види</td>\n</tr>\n<tr class=\"odd\">\n<td>-dığı zaman</td>\n<td>когато</td>\n<td>geldiği zaman — когато дойде</td>\n</tr>\n<tr class=\"even\">\n<td>-dığında</td>\n<td>когато</td>\n<td>geldiğinde — когато дойде</td>\n</tr>\n</tbody>\n</table>\n<p><strong><code>-ınca</code> срещу <code>-dığında</code>:</strong>\nпочти еднакви. <code>-ınca</code> е по-разговорно, <code>-dığında</code>\n— по-книжовно и позволява да се уточни лицето.</p>\n<h3 id=\"защо-е-така-neden-böyle-17\">Защо е така · Neden böyle</h3>\n<p><strong>Защо турският избягва съюзи като „и“ и „когато“?</strong>\nЗащото е език на окончанията, не на служебните думи. Там, където\nбългарският реди изречения със съюзи, турският ги свива в едно изречение\nс деепричастие. Резултатът е по-компактен, но изисква ново мислене.</p>\n<p>Сравни: - Български: „Стана <strong>и</strong> си тръгна.“ (два\nглагола, един съюз) - Турски: <code>Kalkıp gitti.</code> (едно\nдеепричастие + един глагол)</p>\n<p><strong>Защо <code>-ıp</code> иска един и същ подлог?</strong> Защото\nдеепричастието няма собствено лице — то „взима назаем“ лицето на главния\nглагол. Затова <code>Kalkıp gitti</code> може да значи само „той стана и\nтой си тръгна“. Ако подлозите са различни, нужно е пълно изречение:\n<code>Ben geldim, o gitti.</code></p>\n<p><strong>Каква е разликата между <code>-arak</code> и\n<code>-ıp</code>?</strong> - <code>-arak</code> = <strong>как</strong>\nсе върши действието: <code>Koşarak geldi</code> — дойде тичайки\n<em>(едновременно)</em> - <code>-ıp</code> = <strong>после</strong>:\n<code>Koşup geldi</code> — потича и дойде <em>(последователно)</em></p>\n<p>Тънка, но реална разлика. Ако замениш едното с другото, турчинът ще\nразбере, но ще звучи леко накриво.</p>\n<p><strong>Защо <code>-ken</code> се лепи за времето, а не за\nкорена?</strong> Защото маркира едновременност с нещо конкретно, а\nвремето казва с какво: <code>gelirken</code> (докато идвах, обичайно),\n<code>geliyorken</code> (точно докато идвах в този момент). Втората\nформа е по-рядка, но възможна.</p>\n<h3 id=\"текст-за-четене-и-превод-okuma-ve-çeviri-metni-16\">Текст за\nчетене и превод · Okuma ve çeviri metni</h3>\n<p><strong>Sabah telaşı — Сутрешната суетня</strong></p>\n<blockquote>\n<p>Bu sabah alarm çalmadan uyandım. Saate bakınca çok erken olduğunu\ngördüm ama tekrar uyuyamadım. Kalkıp mutfağa gittim, kahve yaparak güne\nbaşladım.</p>\n<p>Kahvaltı ederken telefonuma baktım. Patronumdan bir mesaj gelmişti:\ntoplantı bir saat öne alınmış. Görünce paniğe kapıldım. Hemen duş alıp\ngiyindim.</p>\n<p>Evden çıkarken anahtarımı unuttum. Kapı arkamdan kapanınca fark\nettim. Neyse ki komşuda yedek anahtar vardı.</p>\n<p>Koşarak otobüs durağına gittim ama otobüs tam ben varmadan kalktı.\nTaksi çağırmak zorunda kaldım. Trafik açıldıkça hızlandık ve şansıma tam\nvaktinde vardım.</p>\n<p>Toplantı başlamadan iki dakika önce yerime oturdum. Kimse geç\nkaldığımı anlamadı.</p>\n</blockquote>\n<p><em>Нови думи:</em> <code>telaş</code> — суетня;\n<code>alarm çalmak</code> — звъни будилникът; <code>uyanmak</code> —\nсъбуждам се; <code>öne almak</code> — премествам по-рано;\n<code>paniğe kapılmak</code> — изпадам в паника; <code>giyinmek</code> —\nобличам се; <code>fark etmek</code> — забелязвам; <code>neyse ki</code>\n— за щастие; <code>yedek</code> — резервен; <code>çağırmak</code> —\nвикам; <code>hızlanmak</code> — ускорявам; <code>şansıma</code> — за мой\nкъсмет; <code>tam vaktinde</code> — точно навреме.</p>\n<p><strong>Въпроси:</strong></p>\n<ol type=\"1\">\n<li>Nasıl uyandı?</li>\n<li>Patronundan ne mesaj gelmiş?</li>\n<li>Anahtarını ne zaman unuttuğunu fark etti?</li>\n<li>Toplantıya zamanında yetişti mi?</li>\n</ol>\n<h3 id=\"упражнения-alıştırmalar-17\">Упражнения · Alıştırmalar</h3>\n<p><strong>Упр. 18.1 — Направи деепричастие на\n<code>-arak / -erek</code>.</strong> <em>(„-arak/-erek“ yapın.)</em></p>\n<ol type=\"1\">\n<li>koşmak</li>\n<li>gülmek</li>\n<li>çalışmak</li>\n<li>okumak</li>\n<li>beklemek</li>\n<li>düşünmek</li>\n</ol>\n<p><strong>Упр. 18.2 — Свържи двете изречения с\n<code>-ıp</code>.</strong> <em>(„-ıp“ ile birleştirin.)</em></p>\n<p>Пример: Kalktı. Gitti. → Kalkıp gitti.</p>\n<ol type=\"1\">\n<li>Yemek yedi. Uyudu.</li>\n<li>Eve geldim. Duş aldım.</li>\n<li>Kitabı aldı. Okudu.</li>\n<li>Kalktık. Çıktık.</li>\n</ol>\n<p><strong>Упр. 18.3 — Свържи с <code>-ınca / -ince</code>.</strong>\n<em>(„-ınca“ ile birleştirin.)</em></p>\n<p>Пример: Eve geldim. Seni aradım. → Eve gelince seni aradım.</p>\n<ol type=\"1\">\n<li>Yağmur yağdı. İçeri girdik.</li>\n<li>Onu gördüm. Çok sevindim.</li>\n<li>Ders bitti. Eve gittik.</li>\n<li>Telefon çaldı. Uyandım.</li>\n</ol>\n<p><strong>Упр. 18.4 — Постави <code>-ken</code>.</strong> <em>(„-ken“\nekleyin.)</em></p>\n<ol type=\"1\">\n<li>gelmek (docато идвам)</li>\n<li>çalışmak (докато работя)</li>\n<li>çocuk (докато бях дете)</li>\n<li>öğrenci (докато бях студент)</li>\n<li>çıkmak (тъкмо щях да изляза)</li>\n</ol>\n<p><strong>Упр. 18.5 — Кое деепричастие?</strong> <em>(Hangi\nzarf-fiil?)</em></p>\n<p>Избери: -arak · -ıp · -ınca · -ken · -madan · -dıkça</p>\n<ol type=\"1\">\n<li>Дойдох тичайки. → Koş___ geldim.</li>\n<li>Стана и си тръгна. → Kalk___ gitti.</li>\n<li>Щом се прибереш, звънни. → Eve gel___ beni ara.</li>\n<li>Докато се прибирах, видях Али. → Eve gid___ Ali’yi gördüm.</li>\n<li>Тръгна си без да каже. → Söyle___ gitti.</li>\n<li>Колкото повече работиш, толкова повече учиш. → Çalış___\nöğreniyorsun.</li>\n</ol>\n<p><strong>Упр. 18.6 — Преведи на турски.</strong> <em>(Türkçeye\nçevirin.)</em></p>\n<ol type=\"1\">\n<li>Дойдох тичайки.</li>\n<li>Стана и си тръгна.</li>\n<li>Като се прибереш, звънни ми.</li>\n<li>Докато бях дете, бях много палав.</li>\n<li>Тръгна си без да каже.</li>\n<li>Обади се, преди да дойдеш.</li>\n<li>Работя като учител.</li>\n<li>Тъкмо щях да изляза, телефонът звънна.</li>\n</ol>\n<h3>Тематичен речник · Konu sözlüğü — Кухня и готвене · Mutfak ve pişirme</h3><table><thead><tr><th>Türkçe</th><th>Български</th></tr></thead><tbody><tr><td>malzeme</td><td>съставка, материал</td></tr><tr><td>tava</td><td>тиган</td></tr><tr><td>tepsi</td><td>тава</td></tr><tr><td>bardak</td><td>чаша (стъклена)</td></tr><tr><td>kupa</td><td>чаша (порцеланова)</td></tr><tr><td>sürahi</td><td>кана</td></tr><tr><td>yağ</td><td>мазнина, олио</td></tr><tr><td>un</td><td>брашно</td></tr><tr><td>maya</td><td>мая</td></tr><tr><td>fırınlamak</td><td>пека във фурна</td></tr><tr><td>dilimlemek</td><td>режа на резени</td></tr><tr><td>rendelemek</td><td>стържа на ренде</td></tr><tr><td>tatmak</td><td>опитвам на вкус</td></tr><tr><td>doymak</td><td>наяждам се</td></tr><tr><td>lezzet</td><td>вкус</td></tr><tr><td>tuzluk</td><td>солница</td></tr></tbody></table><p><strong>Упр. 18.7 — Как е на турски?</strong> <em>(Türkçesi nedir?)</em></p><ol type=\"1\"><li>съставка</li><li>тиган</li><li>тава</li><li>кана</li><li>брашно</li><li>мая</li><li>режа на резени</li><li>наяждам се</li></ol><hr />\n<h2\nid=\"урок-19-отглаголни-имена-и-подчинени-изречения-isim-fiiller\">УРОК 19\n· Отглаголни имена и подчинени изречения · İsim-fiiller</h2>\n<h3 id=\"речник-sözlük-17\">Речник · Sözlük</h3>\n<table>\n<thead>\n<tr class=\"header\">\n<th>Турски</th>\n<th>Български</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>söylemek</td>\n<td>казвам</td>\n</tr>\n<tr class=\"even\">\n<td>bilmek</td>\n<td>зная</td>\n</tr>\n<tr class=\"odd\">\n<td>sanmak</td>\n<td>смятам</td>\n</tr>\n<tr class=\"even\">\n<td>düşünmek</td>\n<td>мисля</td>\n</tr>\n<tr class=\"odd\">\n<td>ummak</td>\n<td>надявам се</td>\n</tr>\n<tr class=\"even\">\n<td>istemek</td>\n<td>искам</td>\n</tr>\n<tr class=\"odd\">\n<td>beğenmek</td>\n<td>харесвам</td>\n</tr>\n<tr class=\"even\">\n<td>duymak</td>\n<td>чувам</td>\n</tr>\n<tr class=\"odd\">\n<td>görmek</td>\n<td>виждам</td>\n</tr>\n<tr class=\"even\">\n<td>anlamak</td>\n<td>разбирам</td>\n</tr>\n<tr class=\"odd\">\n<td>fark etmek</td>\n<td>забелязвам</td>\n</tr>\n<tr class=\"even\">\n<td>hatırlamak</td>\n<td>спомням си</td>\n</tr>\n<tr class=\"odd\">\n<td>unutmak</td>\n<td>забравям</td>\n</tr>\n<tr class=\"even\">\n<td>öğrenmek</td>\n<td>научавам</td>\n</tr>\n<tr class=\"odd\">\n<td>inanmak</td>\n<td>вярвам</td>\n</tr>\n<tr class=\"even\">\n<td>eminim</td>\n<td>сигурен съм</td>\n</tr>\n<tr class=\"odd\">\n<td>doğru</td>\n<td>вярно</td>\n</tr>\n<tr class=\"even\">\n<td>yanlış</td>\n<td>грешно</td>\n</tr>\n<tr class=\"odd\">\n<td>gerçek</td>\n<td>истина</td>\n</tr>\n<tr class=\"even\">\n<td>galiba</td>\n<td>вероятно</td>\n</tr>\n</tbody>\n</table>\n<h3 id=\"граматика-19.1-проблемът\">Граматика 19.1 — Проблемът</h3>\n<p>Българският казва: „Знам, <strong>че</strong> той идва.“ Турският\nняма такъв съюз — вместо това <strong>превръща цялото подчинено\nизречение в съществително</strong>:</p>\n<table>\n<colgroup>\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th>Български</th>\n<th>Турски</th>\n<th>Буквално</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Знам, че идва.</td>\n<td>Gel<strong>diğini</strong> biliyorum.</td>\n<td>Знам неговото идване.</td>\n</tr>\n<tr class=\"even\">\n<td>Искам да отида.</td>\n<td>Git<strong>mek</strong> istiyorum.</td>\n<td>Искам отиване.</td>\n</tr>\n<tr class=\"odd\">\n<td>Радвам се, че дойде.</td>\n<td>Gel<strong>diğine</strong> sevindim.</td>\n<td>Зарадвах се на неговото дошло.</td>\n</tr>\n</tbody>\n</table>\n<p>Това е най-голямата структурна разлика между двата езика. Затова\nурокът е дълъг.</p>\n<h3 id=\"граматика-19.2-трите-отглаголни-имена\">Граматика 19.2 — Трите\nотглаголни имена</h3>\n<table>\n<colgroup>\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th>Окончание</th>\n<th>Име</th>\n<th>Кога се използва</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td><strong>-mak / -mek</strong></td>\n<td>инфинитив</td>\n<td>абстрактно действие, след определени глаголи</td>\n</tr>\n<tr class=\"even\">\n<td><strong>-ma / -me</strong></td>\n<td>отглаголно име</td>\n<td>конкретно действие, приема притежание и падеж</td>\n</tr>\n<tr class=\"odd\">\n<td><strong>-dık / -acak</strong></td>\n<td>подчинено изречение</td>\n<td>факт с определено лице и време</td>\n</tr>\n</tbody>\n</table>\n<h3 id=\"граматика-19.3--mak--mek-инфинитив\">Граматика 19.3 —\n<code>-mak / -mek</code> (инфинитив)</h3>\n<p>Използва се, когато подлогът на двата глагола е <strong>един и\nсъщ</strong>:</p>\n<ul>\n<li>Git<strong>mek</strong> istiyorum. — Искам да отида.</li>\n<li>Yüz<strong>mek</strong> öğreniyorum. — Уча се да плувам.</li>\n<li>Türkçe konuş<strong>mak</strong> zor değil. — Не е трудно да се\nговори турски.</li>\n<li>Sigara iç<strong>mek</strong> yasak. — Пушенето е забранено.</li>\n</ul>\n<p><strong>Пада в дателен падеж пред някои глаголи:</strong>\n<code>başlamak</code> (започвам) → <code>okuma**ya** başladım</code> —\nзапочнах да чета <em>(тук <code>-mak</code> става <code>-ma</code>,\nзащото приема падеж)</em></p>\n<p><strong>Глаголи, след които идва <code>-mak</code>:</strong> istemek\n(искам), sevmek (обичам), bilmek (умея), unutmak (забравям), zorunda\nolmak (принуден съм), lazım/gerek (трябва)</p>\n<h3 id=\"граматика-19.4--ma--me-отглаголно-име\">Граматика 19.4 —\n<code>-ma / -me</code> (отглаголно име)</h3>\n<p>За разлика от <code>-mak</code>, приема <strong>притежателен афикс и\nпадеж</strong>. Използва се, когато подлозите на двете действия са\n<strong>различни</strong>:</p>\n<table>\n<thead>\n<tr class=\"header\">\n<th>Лице</th>\n<th>gelmek</th>\n<th>Превод</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>ben</td>\n<td>gel<strong>mem</strong></td>\n<td>моето идване</td>\n</tr>\n<tr class=\"even\">\n<td>sen</td>\n<td>gel<strong>men</strong></td>\n<td>твоето идване</td>\n</tr>\n<tr class=\"odd\">\n<td>o</td>\n<td>gel<strong>mesi</strong></td>\n<td>неговото идване</td>\n</tr>\n<tr class=\"even\">\n<td>biz</td>\n<td>gel<strong>memiz</strong></td>\n<td>нашето идване</td>\n</tr>\n<tr class=\"odd\">\n<td>siz</td>\n<td>gel<strong>meniz</strong></td>\n<td>вашето идване</td>\n</tr>\n<tr class=\"even\">\n<td>onlar</td>\n<td>gel<strong>meleri</strong></td>\n<td>тяхното идване</td>\n</tr>\n</tbody>\n</table>\n<p>Примери: - Gel<strong>meni</strong> istiyorum. — Искам ти да дойдеш.\n- Ali’nin gel<strong>mesi</strong>ni bekliyorum. — Чакам Али да дойде. -\nErken kalk<strong>mam</strong> lazım. — Трябва да ставам рано. - Sigara\niç<strong>men</strong>e izin yok. — Нямаш разрешение да пушиш.</p>\n<p><strong>Сравни:</strong> - <code>Gitmek istiyorum.</code> — Искам\n<strong>аз</strong> да отида. <em>(един подлог → -mek)</em> -\n<code>Gitmeni istiyorum.</code> — Искам <strong>ти</strong> да отидеш.\n<em>(различни подлози → -me)</em></p>\n<h3 id=\"граматика-19.5--dık-и--acak-подчинено-изречение\">Граматика 19.5\n— <code>-dık</code> и <code>-acak</code> (подчинено изречение)</h3>\n<p>Тук вече има <strong>време</strong>. Използват се след глаголи за\nзнание, възприятие и мнение:</p>\n<table>\n<colgroup>\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th>Окончание</th>\n<th>Време</th>\n<th>Пример</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>-dık</td>\n<td>минало и сегашно</td>\n<td>Gel<strong>diğini</strong> biliyorum. — Знам, че е дошъл / че\nидва.</td>\n</tr>\n<tr class=\"even\">\n<td>-acak</td>\n<td>бъдеще</td>\n<td>Gel<strong>eceğini</strong> biliyorum. — Знам, че ще дойде.</td>\n</tr>\n</tbody>\n</table>\n<p><strong>Спрежение (<code>gelmek</code>, с\n<code>-dık</code>):</strong></p>\n<div class=\"line-block\">ben | gel<strong>diğim</strong> | че съм дошъл\n|<br />\nsen | gel<strong>diğin</strong> | че си дошъл |<br />\no | gel<strong>diği</strong> | че е дошъл |<br />\nbiz | gel<strong>diğimiz</strong> | че сме дошли |<br />\nsiz | gel<strong>diğiniz</strong> | че сте дошли |<br />\nonlar | gel<strong>dikleri</strong> | че са дошли |</div>\n<p><strong>Падежът зависи от главния глагол:</strong></p>\n<table>\n<thead>\n<tr class=\"header\">\n<th>Главен глагол</th>\n<th>Падеж</th>\n<th>Пример</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>bilmek (знам)</td>\n<td>винителен</td>\n<td>Geldiğin<strong>i</strong> biliyorum.</td>\n</tr>\n<tr class=\"even\">\n<td>söylemek (казвам)</td>\n<td>винителен</td>\n<td>Geldiğin<strong>i</strong> söyledi.</td>\n</tr>\n<tr class=\"odd\">\n<td>duymak (чувам)</td>\n<td>винителен</td>\n<td>Geldiğin<strong>i</strong> duydum.</td>\n</tr>\n<tr class=\"even\">\n<td>sevinmek (радвам се)</td>\n<td>дателен</td>\n<td>Geldiğin<strong>e</strong> sevindim.</td>\n</tr>\n<tr class=\"odd\">\n<td>inanmak (вярвам)</td>\n<td>дателен</td>\n<td>Geldiğin<strong>e</strong> inanmıyorum.</td>\n</tr>\n<tr class=\"even\">\n<td>emin olmak (сигурен съм)</td>\n<td>изходен</td>\n<td>Geldiğin<strong>den</strong> eminim.</td>\n</tr>\n<tr class=\"odd\">\n<td>korkmak (страхувам се)</td>\n<td>изходен</td>\n<td>Geleceğin<strong>den</strong> korkuyorum.</td>\n</tr>\n</tbody>\n</table>\n<p>Примери: - Ali’nin geldiğini duydum. — Чух, че Али е дошъл. - Yarın\nyağmur yağacağını söylediler. — Казаха, че утре ще вали. - Haklı\nolduğunu biliyorum. — Знам, че си прав. - Beni sevmediğini anladım. —\nРазбрах, че не ме обичаш.</p>\n<h3 id=\"граматика-19.6-как-да-избереш-формата\">Граматика 19.6 — Как да\nизбереш формата</h3>\n<p>Три въпроса подред:</p>\n<p><strong>1. Има ли различен подлог?</strong> Не → <code>-mak</code> ·\nДа → продължи</p>\n<p><strong>2. Има ли собствено време (минало/бъдеще)?</strong> Не\n(желание, нужда) → <code>-ma</code> · Да (факт) → продължи</p>\n<p><strong>3. Кое време?</strong> Минало/сегашно → <code>-dık</code> ·\nБъдеще → <code>-acak</code></p>\n<table>\n<thead>\n<tr class=\"header\">\n<th>Изречение</th>\n<th>Форма</th>\n<th>Турски</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Искам да отида.</td>\n<td>-mek</td>\n<td>Gitmek istiyorum.</td>\n</tr>\n<tr class=\"even\">\n<td>Искам ти да отидеш.</td>\n<td>-me</td>\n<td>Gitmeni istiyorum.</td>\n</tr>\n<tr class=\"odd\">\n<td>Знам, че отиде.</td>\n<td>-dık</td>\n<td>Gittiğini biliyorum.</td>\n</tr>\n<tr class=\"even\">\n<td>Знам, че ще отиде.</td>\n<td>-acak</td>\n<td>Gideceğini biliyorum.</td>\n</tr>\n</tbody>\n</table>\n<h3 id=\"граматика-19.7-готови-изрази\">Граматика 19.7 — Готови\nизрази</h3>\n<div class=\"line-block\">olduğu gibi | както си е | Olduğu gibi bırak.\n|<br />\nolduğu için | понеже е | Hasta olduğu için gelmedi. |<br />\nolduğunu | че е | Doğru olduğunu biliyorum. |<br />\nsöylediğim gibi | както казах | |<br />\nbildiğim kadarıyla | доколкото знам | |<br />\ngördüğüm kad
