3>\n<div class=\"line-block\">yarın | утре |<br />\nöbür gün / yarından sonra | вдругиден |<br />\ngelecek hafta | следващата седмица |<br />\ngelecek ay | следващият месец |<br />\ngelecek yıl / seneye | следващата година |<br />\nbir saat sonra | след един час |<br />\niki gün sonra | след два дни |<br />\nyakında | скоро |<br />\nileride | в бъдеще |<br />\ner ya da geç | рано или късно |</div>\n<h3\nid=\"граматика-9.8-разговорни-съкращения-konuşma-dilinde-kısalmalar\">Граматика\n9.8 — Разговорни съкращения · Konuşma dilinde kısalmalar</h3>\n<p>В говора формите се съкращават силно. Разпознавай ги, но пиши\nпълните:</p>\n<table>\n<thead>\n<tr class=\"header\">\n<th>Пълна форма</th>\n<th>Разговорно</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>geleceğim</td>\n<td>gelicem</td>\n</tr>\n<tr class=\"even\">\n<td>yapacağım</td>\n<td>yapıcam</td>\n</tr>\n<tr class=\"odd\">\n<td>gideceğiz</td>\n<td>gidicez</td>\n</tr>\n<tr class=\"even\">\n<td>olacak</td>\n<td>olcak</td>\n</tr>\n<tr class=\"odd\">\n<td>bakacağım</td>\n<td>bakıcam</td>\n</tr>\n</tbody>\n</table>\n<h3 id=\"защо-е-така-neden-böyle-8\">Защо е така · Neden böyle</h3>\n<p><strong>Защо <code>-acak</code> става <code>-acağ</code> при „аз“ и\n„ние“?</strong> Защото след него идва гласна (<code>-ım</code>,\n<code>-ız</code>). Между две гласни <code>k</code> се смекчава в\n<code>ğ</code> — същото правило, което видя при\n<code>kitap → kitabım</code> и <code>sokak → sokağım</code>. При другите\nлица окончанието започва със съгласна (<code>-sın</code>,\n<code>-lar</code>), затова <code>k</code> остава.</p>\n<p><strong>Кога да използвам <code>-yor</code>, а кога\n<code>-acak</code> за бъдещето?</strong> Разликата е в сигурността:</p>\n<ul>\n<li><code>Yarın geliyorum</code> — уговорено е, билетът е купен, няма да\nсе промени.</li>\n<li><code>Yarın geleceğim</code> — възнамерявам, обещавам.</li>\n<li><code>Yarın gelirim</code> — може и да дойда, ако стане.</li>\n</ul>\n<p>Българският прави същото с „идвам утре“ срещу „ще дойда утре“.</p>\n<p><strong>Защо в говора се чува <code>gelicem</code>?</strong> Дългите\nформи се изтъркват в бързата реч: <code>geleceğim</code> →\n<code>gelcem</code> → <code>gelicem</code>. Разпознавай ги при слушане,\nно пиши пълните форми.</p>\n<h3 id=\"текст-за-четене-и-превод-okuma-ve-çeviri-metni-7\">Текст за\nчетене и превод · Okuma ve çeviri metni</h3>\n<p><strong>Gelecek planlarım — Плановете ми за бъдещето</strong></p>\n<blockquote>\n<p>Bu yıl üniversiteyi bitireceğim. Haziranda mezun olacağım ve sonra\nbir ay tatil yapacağım. Arkadaşlarımla Yunanistan’a gideceğiz. Biletleri\ngelecek hafta alacağız. Tatilden sonra iş arayacağım. Belki İstanbul’a\ntaşınacağım, çünkü orada daha çok iş var. Ailem beni destekleyecek. İlk\nyıl kolay olmayacak ama çalışacağım ve başaracağım. Beş yıl sonra kendi\nşirketimi kuracağım. Bu benim en büyük hayalim.</p>\n</blockquote>\n<p><em>Нови думи:</em> <code>üniversite</code> — университет;\n<code>Yunanistan</code> — Гърция; <code>iş aramak</code> — търся работа;\n<code>daha çok</code> — повече; <code>desteklemek</code> — подкрепям;\n<code>kolay</code> — лесен; <code>başarmak</code> — успявам;\n<code>kendi</code> — собствен; <code>şirket</code> — фирма;\n<code>kurmak</code> — основавам; <code>hayal</code> — мечта.</p>\n<p><strong>Въпроси:</strong></p>\n<ol type=\"1\">\n<li>Ne zaman mezun olacak?</li>\n<li>Tatilde nereye gidecekler?</li>\n<li>Neden İstanbul’a taşınacak?</li>\n<li>Beş yıl sonra ne yapacak?</li>\n</ol>\n<h3 id=\"упражнения-alıştırmalar-8\">Упражнения · Alıştırmalar</h3>\n<p><strong>Упр. 9.1 — Постави в бъдеще време (ben).</strong>\n<em>(Gelecek zamana çevirin (ben).)</em></p>\n<ol type=\"1\">\n<li>gelmek</li>\n<li>yapmak</li>\n<li>okumak</li>\n<li>gitmek</li>\n<li>beklemek</li>\n<li>görmek</li>\n</ol>\n<p><strong>Упр. 9.2 — Постави глагола в правилната форма.</strong>\n<em>(Fiili doğru biçimde yazın.)</em></p>\n<ol type=\"1\">\n<li>Yarın sen ne (yapmak) ___ ?</li>\n<li>Biz sinemaya (gitmek) ___ .</li>\n<li>O yarın (gelmek) ___ .</li>\n<li>Onlar bilet (almak) ___ .</li>\n<li>Siz burada (beklemek) ___ .</li>\n</ol>\n<p><strong>Упр. 9.3 — Направи отрицателни.</strong> <em>(Olumsuz\nyapın.)</em></p>\n<ol type=\"1\">\n<li>Geleceğim.</li>\n<li>Yapacaksın.</li>\n<li>Gidecek.</li>\n<li>Okuyacağız.</li>\n<li>Bekleyeceksiniz.</li>\n</ol>\n<p><strong>Упр. 9.4 — Преведи на турски.</strong> <em>(Türkçeye\nçevirin.)</em></p>\n<ol type=\"1\">\n<li>Утре ще отида в Истанбул.</li>\n<li>Няма да дойда.</li>\n<li>Какво ще правиш утре?</li>\n<li>Ще купим билетите следващата седмица.</li>\n<li>Ще се видим ли утре?</li>\n</ol>\n<h3 id=\"допълнителни-упражнения-ek-alıştırmalar-8\">Допълнителни\nупражнения · Ek alıştırmalar</h3>\n<p><strong>Упр. 9.5 — Постави в бъдеще време.</strong> <em>(Gelecek\nzamana çevirin.)</em></p>\n<ol type=\"1\">\n<li>Yarın hava nasıl (olmak) ___ ?</li>\n<li>Gelecek yıl İstanbul’a (taşınmak, biz) ___ .</li>\n<li>O bu akşam (gelmek) ___ mi?</li>\n<li>Onlar bileti internetten (almak) ___ .</li>\n<li>Ben sana yarın (yazmak) ___ .</li>\n</ol>\n<p><strong>Упр. 9.6 — Преобразувай от сегашно в бъдеще.</strong>\n<em>(Şimdiki zamandan gelecek zamana çevirin.)</em></p>\n<ol type=\"1\">\n<li>Okula gidiyorum.</li>\n<li>Kitap okuyorsun.</li>\n<li>İş arıyor.</li>\n<li>Tatile çıkıyoruz.</li>\n<li>Erken yatıyorsunuz.</li>\n</ol>\n<p><strong>Упр. 9.7 — Отговори отрицателно.</strong> <em>(Olumsuz cevap\nverin.)</em></p>\n<ol type=\"1\">\n<li>Yarın gelecek misin?</li>\n<li>O bu işi yapacak mı?</li>\n<li>Onlar tatile çıkacaklar mı?</li>\n<li>Bize yardım edecek misiniz?</li>\n</ol>\n<p><strong>Упр. 9.8 — Напиши 5 плана за следващата година.</strong>\n<em>(Gelecek yıl için beş plan yazın.)</em></p>\n<p><strong>Упр. 9.9 — Спрегни в бъдеще време за <code>ben</code> и\n<code>biz</code>.</strong> <em>(„ben“ ve „biz“ için gelecek zamanda\nçekimleyin.)</em></p>\n<ol type=\"1\">\n<li>gelmek</li>\n<li>yapmak</li>\n<li>okumak</li>\n<li>beklemek</li>\n<li>gitmek</li>\n<li>görmek</li>\n<li>başlamak</li>\n<li>yürümek</li>\n</ol>\n<p><strong>Упр. 9.10 — Пълна таблица за <code>almak</code>.</strong>\n<em>(„almak“ için tam tablo.)</em></p>\n<ol type=\"1\">\n<li>ben ___</li>\n<li>sen ___</li>\n<li>o ___</li>\n<li>biz ___</li>\n<li>siz ___</li>\n<li>onlar ___</li>\n</ol>\n<p><strong>Упр. 9.11 — Направи отрицателни.</strong> <em>(Olumsuz\nyapın.)</em></p>\n<ol type=\"1\">\n<li>Geleceğim.</li>\n<li>Yapacaksın.</li>\n<li>Okuyacak.</li>\n<li>Bekleyeceğiz.</li>\n<li>Gideceksiniz.</li>\n<li>Başlayacaklar.</li>\n</ol>\n<p><strong>Упр. 9.12 — Направи въпрос.</strong> <em>(Soru cümlesi\nyapın.)</em></p>\n<ol type=\"1\">\n<li>Yarın geleceksin.</li>\n<li>O bu işi yapacak.</li>\n<li>Biz tatile çıkacağız.</li>\n<li>Siz bize yardım edeceksiniz.</li>\n<li>Onlar bilet alacaklar.</li>\n</ol>\n<p><strong>Упр. 9.13 — <code>-yor</code> или\n<code>-acak</code>?</strong> <em>(-yor mu, -acak mı?)</em></p>\n<ol type=\"1\">\n<li>Yarın hava yağmurlu (olmak) ___ . (прогноза)</li>\n<li>Yarın saat üçte (gelmek) ___ . (уговорено)</li>\n<li>Gelecek yıl İstanbul’a (taşınmak) ___ . (план)</li>\n<li>Bu akşam sinemaya (gitmek) ___ . (билетите са купени)</li>\n<li>Bir gün Japonya’ya (gitmek) ___ . (мечта)</li>\n</ol>\n<p><strong>Упр. 9.14 — Преведи на турски.</strong> <em>(Türkçeye\nçevirin.)</em></p>\n<ol type=\"1\">\n<li>Утре ще отида в Истанбул.</li>\n<li>Няма да дойда.</li>\n<li>Какво ще правиш следващата седмица?</li>\n<li>Утре ще вали дъжд.</li>\n<li>След два дни ще се върна.</li>\n<li>Ще ни помогнете ли?</li>\n<li>Няма да работим в събота.</li>\n<li>Скоро ще започна нова работа.</li>\n</ol>\n<h3>Тематичен речник · Konu sözlüğü — Природа и животни · Doğa ve hayvanlar</h3><table><thead><tr><th>Türkçe</th><th>Български</th></tr></thead><tbody><tr><td>doğa</td><td>природа</td></tr><tr><td>güneş</td><td>слънце</td></tr><tr><td>güneşli</td><td>слънчево</td></tr><tr><td>yağmur</td><td>дъжд</td></tr><tr><td>yağmurlu</td><td>дъждовно</td></tr><tr><td>kar</td><td>сняг</td></tr><tr><td>karlı</td><td>снежно</td></tr><tr><td>rüzgâr</td><td>вятър</td></tr><tr><td>rüzgârlı</td><td>ветровито</td></tr><tr><td>bulut</td><td>облак</td></tr><tr><td>bulutlu</td><td>облачно</td></tr><tr><td>deniz</td><td>море</td></tr><tr><td>göl</td><td>езеро</td></tr><tr><td>nehir</td><td>река</td></tr><tr><td>ırmak</td><td>река (голяма)</td></tr><tr><td>dağ</td><td>планина</td></tr><tr><td>orman</td><td>гора</td></tr><tr><td>plaj</td><td>плаж</td></tr><tr><td>kumsal</td><td>пясъчен бряг</td></tr><tr><td>hayvan</td><td>животно</td></tr><tr><td>kedi</td><td>котка</td></tr><tr><td>köpek</td><td>куче</td></tr><tr><td>kuş</td><td>птица</td></tr><tr><td>at</td><td>кон</td></tr><tr><td>inek</td><td>крава</td></tr><tr><td>koyun</td><td>овца</td></tr><tr><td>sinek</td><td>муха</td></tr></tbody></table><p><strong>Упр. 9.15 — Как е на турски?</strong> <em>(Türkçesi nedir?)</em></p><ol type=\"1\"><li>природа</li><li>дъжд</li><li>вятър</li><li>езеро</li><li>планина</li><li>гора</li><li>птица</li><li>овца</li></ol><hr />\n<h2 id=\"урок-10-заповед-желание-и-възможност\">УРОК 10 · Заповед, желание\nи възможност</h2>\n<h3 id=\"речник-sözlük-8\">Речник · Sözlük</h3>\n<table>\n<thead>\n<tr class=\"header\">\n<th>Турски</th>\n<th>Български</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>gel!</td>\n<td>ела!</td>\n</tr>\n<tr class=\"even\">\n<td>bak!</td>\n<td>виж!</td>\n</tr>\n<tr class=\"odd\">\n<td>dur!</td>\n<td>спри!</td>\n</tr>\n<tr class=\"even\">\n<td>otur!</td>\n<td>седни!</td>\n</tr>\n<tr class=\"odd\">\n<td>dinle!</td>\n<td>слушай!</td>\n</tr>\n<tr class=\"even\">\n<td>acele etmek</td>\n<td>бързам</td>\n</tr>\n<tr class=\"odd\">\n<td>yardım</td>\n<td>помощ</td>\n</tr>\n<tr class=\"even\">\n<td>ile (-la / -le)</td>\n<td>с</td>\n</tr>\n<tr class=\"odd\">\n<td>için</td>\n<td>за, заради</td>\n</tr>\n<tr class=\"even\">\n<td>kadar</td>\n<td>до; колкото</td>\n</tr>\n<tr class=\"odd\">\n<td>gibi</td>\n<td>като</td>\n</tr>\n<tr class=\"even\">\n<td>önce</td>\n<td>преди</td>\n</tr>\n<tr class=\"odd\">\n<td>sonra</td>\n<td>след</td>\n</tr>\n<tr class=\"even\">\n<td>lazım</td>\n<td>нужно е</td>\n</tr>\n<tr class=\"odd\">\n<td>mümkün</td>\n<td>възможно</td>\n</tr>\n<tr class=\"even\">\n<td>yasak</td>\n<td>забранено</td>\n</tr>\n<tr class=\"odd\">\n<td>tehlikeli</td>\n<td>опасно</td>\n</tr>\n</tbody>\n</table>\n<h3\nid=\"граматика-10.1-повелително-наклонение-emir-kipi-emir-kipi\">Граматика\n10.1 — Повелително наклонение (emir kipi) · Emir kipi</h3>\n<table>\n<thead>\n<tr class=\"header\">\n<th>Лице</th>\n<th>Форма</th>\n<th>Пример</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>sen (ти)</td>\n<td>самият корен</td>\n<td><strong>Gel!</strong> — Ела! · <strong>Bak!</strong> — Виж!</td>\n</tr>\n<tr class=\"even\">\n<td>siz (вие, учтиво)</td>\n<td>-ın / -in / -un / -ün</td>\n<td><strong>Gelin!</strong> · <strong>Bakın!</strong></td>\n</tr>\n<tr class=\"odd\">\n<td>siz (много учтиво)</td>\n<td>-ınız / -iniz</td>\n<td><strong>Geliniz!</strong> · <strong>Buyurunuz!</strong></td>\n</tr>\n<tr class=\"even\">\n<td>o (нека той)</td>\n<td>-sın / -sin / -sun / -sün</td>\n<td><strong>Gelsin!</strong> — Нека дойде!</td>\n</tr>\n<tr class=\"odd\">\n<td>onlar</td>\n<td>-sınlar / -sinler</td>\n<td><strong>Gelsinler!</strong></td>\n</tr>\n</tbody>\n</table>\n<p><em>След гласна се вмъква <code>-y-</code>: <code>bekle</code> →\n<code>bekleyin</code>.</em></p>\n<p><strong>Отрицание:</strong> корен + <code>-ma/-me</code>\n<code>Gelme!</code> — Не идвай! · <code>Gelmeyin!</code> — Не идвайте! ·\n<code>Unutma!</code> — Не забравяй!</p>\n<p><strong>Учтиви форми:</strong> <code>Lütfen oturun.</code> — Моля,\nседнете. · <code>Buyurun.</code> — Заповядайте.</p>\n<h3 id=\"граматика-10.2-искам-да-istemek-istemek-ile\">Граматика 10.2 —\n„Искам да…“ — istemek · „istemek“ ile</h3>\n<p><strong>Инфинитив + istemek:</strong> - Gitmek istiyorum. — Искам да\nотида. - Türkçe öğrenmek istiyorum. — Искам да уча турски. - Ne yapmak\nistiyorsun? — Какво искаш да правиш? - Gelmek istemiyorum. — Не искам да\nдойда.</p>\n<p><strong>Съществително + istemek</strong> (винителен падеж или без\nнего): - Bir çay istiyorum. — Искам чай. - Su ister misiniz? — Желаете\nли вода?</p>\n<h3\nid=\"граматика-10.3-мога--abilmek--ebilmek-yeterlilik--abilmek\">Граматика\n10.3 — „Мога“ — -abilmek / -ebilmek · Yeterlilik: -abilmek</h3>\n<p><strong>Образуване:</strong> корен + <code>-abil / -ebil</code> +\nокончание за време. След гласна се вмъква <code>-y-</code>:\n<code>bekle-</code> → <code>bekleyebilirim</code>.</p>\n<ul>\n<li>Gel<strong>ebilirim</strong>. — Мога да дойда.</li>\n<li>Türkçe konuş<strong>abiliyorum</strong>. — Мога да говоря\nтурски.</li>\n<li>Yarın gel<strong>ebilir misin</strong>? — Можеш ли да дойдеш\nутре?</li>\n<li>Burada oturabilir miyim? — Мога ли да седна тук?</li>\n</ul>\n<p><strong>Отрицание — „не мога“ (-ama / -eme):</strong></p>\n<table>\n<tbody>\n<tr class=\"odd\">\n<td>ben gel<strong>emem</strong></td>\n<td>не мога да дойда</td>\n</tr>\n<tr class=\"even\">\n<td>sen gel<strong>emezsin</strong></td>\n<td>не можеш да дойдеш</td>\n</tr>\n<tr class=\"odd\">\n<td>o gel<strong>emez</strong></td>\n<td>не може да дойде</td>\n</tr>\n<tr class=\"even\">\n<td>biz gel<strong>eyiz</strong> → gel<strong>emeyiz</strong></td>\n<td>не можем</td>\n</tr>\n<tr class=\"odd\">\n<td>siz gel<strong>emezsiniz</strong></td>\n<td>не можете</td>\n</tr>\n<tr class=\"even\">\n<td>onlar gel<strong>emezler</strong></td>\n<td>не могат</td>\n</tr>\n</tbody>\n</table>\n<ul>\n<li>Bugün gelemem. — Днес не мога да дойда.</li>\n<li>Anlayamıyorum. — Не мога да разбера.</li>\n</ul>\n<h3 id=\"граматика-10.4-полезни-служебни-думи-edatlar\">Граматика 10.4 —\nПолезни служебни думи · Edatlar</h3>\n<p><strong>ile (-la / -le) — „с“:</strong> - Ali <strong>ile</strong> /\nAli’<strong>yle</strong> — с Али - otobüs <strong>ile</strong> /\notobüs<strong>le</strong> — с автобус - arkadaşım<strong>la</strong> — с\nмоя приятел - <em>С местоимения:</em> benimle, seninle, onunla, bizimle,\nsizinle, onlarla</p>\n<p><strong>için — „за“:</strong> - Senin <strong>için</strong> aldım. —\nКупих го за теб. - Bunun <strong>için</strong> geldim. — Затова\nдойдох.</p>\n<p><strong>önce / sonra:</strong> - Yemek<strong>ten önce</strong> —\nпреди ядене - Ders<strong>ten sonra</strong> — след урока - İki gün\n<strong>önce</strong> — преди два дни - Bir hafta <strong>sonra</strong>\n— след една седмица</p>\n<h3\nid=\"граматика-10.5-всички-форми-на-повелителното-наклонение-emir-kipinin-bütün-biçimleri\">Граматика\n10.5 — Всички форми на повелителното наклонение · Emir kipinin bütün\nbiçimleri</h3>\n<table>\n<thead>\n<tr class=\"header\">\n<th>Лице</th>\n<th>Утвърдително</th>\n<th>Отрицателно</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>sen</td>\n<td>Gel!</td>\n<td>Gelme!</td>\n</tr>\n<tr class=\"even\">\n<td>o</td>\n<td>Gelsin!</td>\n<td>Gelmesin!</td>\n</tr>\n<tr class=\"odd\">\n<td>siz</td>\n<td>Gelin!</td>\n<td>Gelmeyin!</td>\n</tr>\n<tr class=\"even\">\n<td>siz (много учтиво)</td>\n<td>Geliniz!</td>\n<td>Gelmeyiniz!</td>\n</tr>\n<tr class=\"odd\">\n<td>onlar</td>\n<td>Gelsinler!</td>\n<td>Gelmesinler!</td>\n</tr>\n</tbody>\n</table>\n<p><strong>Няма форма за <code>ben</code> и <code>biz</code></strong> —\nза тях се използва желателното наклонение: - Gide<strong>yim</strong> —\nда отида / нека отида - Gide<strong>lim</strong> — да отидем / хайде да\nотидем</p>\n<h3\nid=\"граматика-10.6-желателно-наклонение--ayım--eyim-istek-kipi\">Граматика\n10.6 — Желателно наклонение (-ayım / -eyim) · İstek kipi</h3>\n<div class=\"line-block\">ben | gel<strong>eyim</strong> | да дойда\n|<br />\nbiz | gel<strong>elim</strong> | да дойдем / хайде да дойдем |</div>\n<p>Употреба: - Ne yapayım? — Какво да правя? - Sana yardım edeyim mi? —\nДа ти помогна ли? - Hadi gidelim! — Хайде да тръгваме! - Bir kahve\niçelim mi? — Да пием ли по едно кафе? - Yarın buluşalım. — Нека се\nсрещнем утре.</p>\n<h3\nid=\"граматика-10.7-възможност--abilmek--ebilmek-yeterlilik-fiili\">Граматика\n10.7 — Възможност: -abilmek / -ebilmek · Yeterlilik fiili</h3>\n<p><strong>Утвърдително:</strong> корен + <code>-abil/-ebil</code> +\nокончание за време</p>\n<div class=\"line-block\">gelebilirim | мога да дойда |<br />\ngelebiliyorum | мога да дойда (в момента) |<br />\ngelebildim | можах да дойда |<br />\ngelebileceğim | ще мога да дойда |</div>\n<p><strong>Отрицателно („не мога“):</strong> корен +\n<code>-ama/-eme</code></p>\n<table>\n<colgroup>\n<col style=\"width: 50%\" />\n<col style=\"width: 50%\" />\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th>Време</th>\n<th>Форма</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>geniş</td>\n<td>gel<strong>emem</strong>, gel<strong>emezsin</strong>,\ngel<strong>emez</strong>,\ngel<strong>eyiz</strong>→gel<strong>emeyiz</strong></td>\n</tr>\n<tr class=\"even\">\n<td>-yor</td>\n<td>gel<strong>emiyorum</strong>, anla<strong>yamıyorum</strong></td>\n</tr>\n<tr class=\"odd\">\n<td>минало</td>\n<td>gel<strong>emedim</strong></td>\n</tr>\n<tr class=\"even\">\n<td>бъдеще</td>\n<td>gel<strong>emeyeceğim</strong></td>\n</tr>\n</tbody>\n</table>\n<p><strong>Разлика:</strong> - <code>Gelmem.</code> — Не идвам (не\nискам). - <code>Gelemem.</code> — Не мога да дойда (няма как).</p>\n<h3\nid=\"граматика-10.8-служебните-думи-в-детайли-edatlar-ayrıntılı\">Граматика\n10.8 — Служебните думи в детайли · Edatlar ayrıntılı</h3>\n<p><strong>ile (-la / -le)</strong> — „с“, „чрез“</p>\n<div class=\"line-block\">С човек | Ali ile / Ali’yle — с Али |<br />\nС предмет | kalem ile / kalemle — с молив |<br />\nПревозно средство | otobüsle, trenle, uçakla, arabayla |<br />\nС местоимение | benimle, seninle, onunla, bizimle, sizinle, onlarla\n|</div>\n<p><strong>için</strong> — „за“, „заради“</p>\n<ul>\n<li>Senin için — за теб</li>\n<li>Ne için? — За какво?</li>\n<li>Bunun için geldim. — За това дойдох.</li>\n<li>Sağlık için spor yapıyorum. — Спортувам заради здравето.</li>\n</ul>\n<p><strong>önce / sonra</strong> — с изходен падеж</p>\n<ul>\n<li>yemek<strong>ten</strong> önce — преди ядене</li>\n<li>ders<strong>ten</strong> sonra — след урока</li>\n<li>iki gün önce — преди два дни</li>\n<li>bir hafta sonra — след една седмица</li>\n</ul>\n<p><strong>kadar</strong> — „до“, „толкова колкото“</p>\n<ul>\n<li>Saat üçe kadar — до три часа</li>\n<li>Eve kadar — до вкъщи</li>\n<li>Senin kadar — колкото теб</li>\n</ul>\n<h3 id=\"граматика-10.9-учтивите-изрази-kibar-ifadeler\">Граматика 10.9 —\nУчтивите изрази · Kibar ifadeler</h3>\n<div class=\"line-block\">Buyurun. | Заповядайте. |<br />\nAfiyet olsun. | Добър апетит. |<br />\nKolay gelsin. | Лека работа. |<br />\nGeçmiş olsun. | Оздравявай. |<br />\nEline sağlık. | Благодаря за храната (към готвача). |<br />\nHoş geldiniz. — Hoş bulduk. | Добре дошли. — Добре заварили. |<br />\nGüle güle kullan. | Да го носиш със здраве. |<br />\nBaşınız sağ olsun. | Съболезнования. |<br />\nAllah kolaylık versin. | Да ти е леко. |<br />\nRica ederim. | Моля, няма защо. |</div>\n<h3 id=\"защо-е-така-neden-böyle-9\">Защо е така · Neden böyle</h3>\n<p><strong>Защо повелителната форма за „ти“ е самият корен?</strong>\nЗащото това е най-краткото възможно нареждане — без никакво окончание.\n<code>Gel!</code> е чистият глаголен корен. Турският е последователен:\nколкото по-учтиво, толкова по-дълга формата: <code>Gel!</code> →\n<code>Gelin!</code> → <code>Geliniz!</code> →\n<code>Gelir misiniz?</code></p>\n<p><strong>Каква е разликата между <code>gelmem</code> и\n<code>gelemem</code>?</strong> Едната буква мени всичко:</p>\n<ul>\n<li><code>gelmem</code> = не идвам (не искам, отказвам)</li>\n<li><code>gel**e**mem</code> = не мога да дойда (няма как, зает\nсъм)</li>\n</ul>\n<p>Първото е за воля, второто — за възможност. <code>-e-</code> е знакът\nна възможността.</p>\n<p><strong>Защо <code>-abilmek</code> съдържа <code>bil</code>\n(зная)?</strong> Защото формата идва от <code>gel-e bil-mek</code> — „да\nдойда зная“, тоест „умея да дойда“. С времето двете думи са се слели в\nедно окончание. Затова в положителната форма се вижда <code>bil</code>,\nа в отрицателната изчезва: <code>gelemem</code> (не съм в\nсъстояние).</p>\n<h3 id=\"текст-за-четене-и-превод-okuma-ve-çeviri-metni-8\">Текст за\nчетене и превод · Okuma ve çeviri metni</h3>\n<p><strong>Lokantada — В ресторанта</strong></p>\n<blockquote>\n<p>— Buyurun efendim, ne alırsınız?</p>\n<p>— Menüye bakabilir miyim, lütfen?</p>\n<p>— Tabii, buyurun.</p>\n<p>— Teşekkür ederim. Bugün ne tavsiye edersiniz?</p>\n<p>— Bugün mercimek çorbası ve İskender kebap çok güzel.</p>\n<p>— O zaman bir mercimek çorbası ve bir İskender istiyorum.</p>\n<p>— İçecek ne alırsınız?</p>\n<p>— Ayran alabilir miyim?</p>\n<p>— Elbette. Tatlı da ister misiniz?</p>\n<p>— Sonra karar vereceğim, teşekkürler.</p>\n<p>— Afiyet olsun! <em>(yemekten sonra)</em> — Hesabı alabilir miyim,\nlütfen?</p>\n<p>— Hemen getiriyorum efendim.</p>\n</blockquote>\n<p><em>Нови думи:</em> <code>efendim</code> — господине/госпожо;\n<code>menü</code> — меню; <code>tavsiye etmek</code> — препоръчвам;\n<code>mercimek çorbası</code> — леща супа; <code>içecek</code> —\nнапитка; <code>ayran</code> — айрян; <code>elbette</code> — разбира се;\n<code>tatlı</code> — десерт; <code>karar vermek</code> — решавам;\n<code>afiyet olsun</code> — добър апетит; <code>hesap</code> — сметка;\n<code>hemen</code> — веднага; <code>getirmek</code> — донасям.</p>\n<p><strong>Въпроси:</strong></p>\n<ol type=\"1\">\n<li>Müşteri ne yemek istiyor?</li>\n<li>Ne içecek alıyor?</li>\n<li>Tatlı istiyor mu?</li>\n<li>Sonunda ne istiyor?</li>\n</ol>\n<h3 id=\"упражнения-alıştırmalar-9\">Упражнения · Alıştırmalar</h3>\n<p><strong>Упр. 10.1 — Направи повелителна форма за <code>sen</code> и\n<code>siz</code>.</strong> <em>(„sen“ ve „siz“ için emir biçimi\nyapın.)</em></p>\n<ol type=\"1\">\n<li>gelmek</li>\n<li>bakmak</li>\n<li>oturmak</li>\n<li>beklemek</li>\n<li>dinlemek</li>\n</ol>\n<p><strong>Упр. 10.2 — Преведи с „искам да“.</strong> <em>(„istemek“ ile\nçevirin.)</em></p>\n<ol type=\"1\">\n<li>Искам да отида в Истанбул.</li>\n<li>Искам да уча турски.</li>\n<li>Не искам да работя днес.</li>\n<li>Какво искаш да ядеш?</li>\n</ol>\n<p><strong>Упр. 10.3 — Постави формата за възможност\n(-abilmek).</strong> <em>(Yeterlilik biçimini yazın\n(-abilmek).)</em></p>\n<ol type=\"1\">\n<li>Ben yarın (gelmek) ___ . (мога)</li>\n<li>Sen Türkçe (konuşmak) ___ mı? (можеш ли)</li>\n<li>O bugün (gelmek) ___ . (не може)</li>\n<li>Biz sana (yardım etmek) ___ . (можем)</li>\n</ol>\n<p><strong>Упр. 10.4 — Попълни с <code>ile</code>, <code>için</code>,\n<code>önce</code> или <code>sonra</code>.</strong> <em>(„ile, için,\nönce, sonra“ ile tamamlayın.)</em></p>\n<ol type=\"1\">\n<li>Arkadaşım___ sinemaya gidiyorum.</li>\n<li>Bu hediye senin ___ .</li>\n<li>Dersten ___ eve gideceğim.</li>\n<li>Yemekten ___ ellerini yıka.</li>\n</ol>\n<p><strong>Упр. 10.5 — Преведи на турски.</strong> <em>(Türkçeye\nçevirin.)</em></p>\n<ol type=\"1\">\n<li>Моля, седнете.</li>\n<li>Не забравяй!</li>\n<li>Мога ли да седна тук?</li>\n<li>Днес не мога да дойда.</li>\n<li>Отивам на кино с приятеля си.</li>\n</ol>\n<h3 id=\"допълнителни-упражнения-ek-alıştırmalar-9\">Допълнителни\nупражнения · Ek alıştırmalar</h3>\n<p><strong>Упр. 10.6 — Повелително наклонение: отрицателна\nформа.</strong> <em>(Emir kipi: olumsuz biçim.)</em></p>\n<ol type=\"1\">\n<li>gelmek (sen)</li>\n<li>unutmak (sen)</li>\n<li>konuşmak (siz)</li>\n<li>geç kalmak (siz)</li>\n<li>beklemek (sen)</li>\n</ol>\n<p><strong>Упр. 10.7 — „Мога / не мога“.</strong> <em>(„-abilmek /\n-amamak“.)</em></p>\n<ol type=\"1\">\n<li>Yarın sana (yardım etmek) ___ . (мога)</li>\n<li>Bu kelimeyi (anlamak) ___ . (не мога)</li>\n<li>Burada (sigara içmek) ___ . (не може)</li>\n<li>Pencereyi (açmak) ___ mıyım? (мога ли)</li>\n</ol>\n<p><strong>Упр. 10.8 — Учтиви изрази: какво ще кажеш?</strong>\n<em>(Kibar ifadeler: ne dersiniz?)</em></p>\n<ol type=\"1\">\n<li>Влизаш в магазин.</li>\n<li>Някой ти помага.</li>\n<li>Искаш сметката в ресторант.</li>\n<li>Тръгваш си от гости.</li>\n<li>Не разбра какво каза човекът.</li>\n</ol>\n<p><strong>Упр. 10.9 — Напиши диалог в кафене (6 реплики).</strong>\n<em>(Kafede bir diyalog yazın (altı replik).)</em></p>\n<p><strong>Упр. 10.10 — Направи всички повелителни форми.</strong>\n<em>(Bütün emir biçimlerini yazın.)</em></p>\n<p>Пример: gelmek → Gel! Gelsin! Gelin! Gelmesin!</p>\n<ol type=\"1\">\n<li>bakmak</li>\n<li>oturmak</li>\n<li>beklemek</li>\n<li>gitmek</li>\n<li>konuşmak</li>\n</ol>\n<p><strong>Упр. 10.11 — Желателно наклонение: <code>-eyim</code> или\n<code>-elim</code>?</strong> <em>(İstek kipi: -eyim mi, -elim\nmi?)</em></p>\n<ol type=\"1\">\n<li>Ne yap___ ? (аз)</li>\n<li>Hadi git___ ! (ние)</li>\n<li>Sana yardım ed___ mi? (аз)</li>\n<li>Bir kahve iç___ mi? (ние)</li>\n<li>Yarın buluş___ . (ние)</li>\n<li>Sana bir şey sor___ mu? (аз)</li>\n</ol>\n<p><strong>Упр. 10.12 — „Мога“ или „не мога“?</strong> <em>(„-abilmek“\nmi, „-amamak“ mı?)</em></p>\n<ol type=\"1\">\n<li>Yarın sana yardım ___ . (мога, geniş)</li>\n<li>Bu kelimeyi ___ . (не мога да разбера, -yor)</li>\n<li>Dün ___ . (не можах да дойда)</li>\n<li>Burada sigara ___ . (не може да се пуши)</li>\n<li>Yarın ___ . (ще мога да дойда)</li>\n<li>Türkçe ___ . (мога да говоря, -yor)</li>\n</ol>\n<p><strong>Упр. 10.13 — Попълни с <code>ile</code>, <code>için</code>,\n<code>önce</code>, <code>sonra</code> или <code>kadar</code>.</strong>\n<em>(„ile, için, önce, sonra, kadar“ ile tamamlayın.)</em></p>\n<ol type=\"1\">\n<li>Arkadaşım___ sinemaya gidiyorum.</li>\n<li>Bu hediye senin ___ .</li>\n<li>Yemek___ ___ ellerini yıka.</li>\n<li>Ders___ ___ eve gideceğim.</li>\n<li>Saat üçe ___ buradayım.</li>\n<li>Okula otobüs___ gidiyorum.</li>\n<li>Sağlık ___ spor yapıyorum.</li>\n<li>İki gün ___ İstanbul’daydım.</li>\n</ol>\n<p><strong>Упр. 10.14 — Какво ще кажеш в тази ситуация?</strong> <em>(Bu\ndurumda ne dersiniz?)</em></p>\n<ol type=\"1\">\n<li>Влизаш в магазин.</li>\n<li>Някой работи усилено.</li>\n<li>Приятелят ти е болен.</li>\n<li>Сядате на маса да ядете.</li>\n<li>Гост влиза в дома ти.</li>\n<li>Приятел си купи нова кола.</li>\n</ol>\n<p><strong>Упр. 10.15 — Преведи на турски.</strong> <em>(Türkçeye\nçevirin.)</em></p>\n<ol type=\"1\">\n<li>Моля, седнете.</li>\n<li>Не забравяй!</li>\n<li>Нека да отидем на кино.</li>\n<li>Да ти помогна ли?</li>\n<li>Мога ли да седна тук?</li>\n<li>Днес не мога да дойда.</li>\n<li>Отивам с приятеля си.</li>\n<li>Преди ядене си измий ръцете.</li>\n</ol>\n<hr />\n<h1 id=\"част-ii-ниво-a2\">ЧАСТ II · НИВО A2</h1>\n<p>На това ниво спираш да строиш прости изречения и започваш да свързваш\nмисли. Ключовите нови неща са: преразказното минало време (нещо, което\nбългарският има, а повечето езици — не), условните изречения,\nпричастията и деепричастията — турският начин да се каже „човекът, който\nдойде“ и „като дойдох, видях“.</p>\n<p>Уроците са построени като в Част I: речник, граматика с обяснения,\n„Защо е така“, текст за четене и упражнения с ключ.</p>\n<h3>Тематичен речник · Konu sözlüğü — В ресторанта и кафенето · Lokantada ve kafede</h3><table><thead><tr><th>Türkçe</th><th>Български</th></tr></thead><tbody><tr><td>garson</td><td>сервитьор</td></tr><tr><td>menü</td><td>меню</td></tr><tr><td>sipariş</td><td>поръчка</td></tr><tr><td>sipariş vermek</td><td>поръчвам</td></tr><tr><td>başlangıç</td><td>предястие</td></tr><tr><td>ana yemek</td><td>основно ястие</td></tr><tr><td>çorba</td><td>супа</td></tr><tr><td>salata</td><td>салата</td></tr><tr><td>meze</td><td>мезе</td></tr><tr><td>ızgara</td><td>скара</td></tr><tr><td>kebap</td><td>кебап</td></tr><tr><td>pilav</td><td>пилаф</td></tr><tr><td>makarna</td><td>макарони</td></tr><tr><td>balık</td><td>риба</td></tr><tr><td>tavuk</td><td>пиле</td></tr><tr><td>et</td><td>месо</td></tr><tr><td>etsiz</td><td>без месо</td></tr><tr><td>vejetaryen</td><td>вегетарианец</td></tr><tr><td>acı</td><td>лют</td></tr><tr><td>tuzsuz</td><td>без сол</td></tr><tr><td>az pişmiş</td><td>леко изпечено</td></tr><tr><td>iyi pişmiş</td><td>добре изпечено</td></tr><tr><td>içecek</td><td>напитка</td></tr><tr><td>meşrubat</td><td>безалкохолна напитка</td></tr><tr><td>gazoz</td><td>газирана напитка</td></tr><tr><td>maden suyu</td><td>минерална вода</td></tr><tr><td>taze sıkılmış</td><td>прясно изцеден</td></tr><tr><td>sade kahve</td><td>кафе без захар</td></tr><tr><td>orta şekerli</td><td>със средно захар</td></tr><tr><td>çay bardağı</td><td>чаша за чай</td></tr><tr><td>tabak</td><td>чиния</td></tr><tr><td>çatal</td><td>вилица</td></tr><tr><td>bıçak</td><td>нож</td></tr><tr><td>kaşık</td><td>лъжица</td></tr><tr><td>peçete</td><td>салфетка</td></tr><tr><td>tuzluk</td><td>солница</td></tr><tr><td>hesap</td><td>сметка</td></tr><tr><td>bahşiş</td><td>бакшиш</td></tr><tr><td>servis ücreti</td><td>такса обслужване</td></tr><tr><td>rezervasyon yapmak</td><td>резервирам</td></tr><tr><td>masa ayırtmak</td><td>запазвам маса</td></tr><tr><td>paket servis</td><td>за вкъщи</td></tr><tr><td>burada mı, paket mi?</td><td>тук или за вкъщи?</td></tr><tr><td>afiyet şeker olsun</td><td>да ти е сладко</td></tr><tr><td>doydum</td><td>наядох се</td></tr><tr><td>nefis</td><td>превъзходен</td></tr></tbody></table><p><strong>Упр. 10.16 — Как е на турски?</strong> <em>(Türkçesi nedir?)</em></p><ol type=\"1\"><li>сервитьор</li><li>поръчка</li><li>предястие</li><li>основно ястие</li><li>минерална вода</li><li>вилица</li><li>салфетка</li><li>бакшиш</li><li>резервирам</li><li>за вкъщи</li></ol><h3>Тематичен речник · Konu sözlüğü — Храна и напитки · Yiyecek ve içecek</h3><table><thead><tr><th>Türkçe</th><th>Български</th></tr></thead><tbody><tr><td>içecek</td><td>напитка</td></tr><tr><td>akşam yemeği</td><td>вечеря</td></tr><tr><td>Türk kahvesi</td><td>турско кафе</td></tr><tr><td>meyve suyu</td><td>плодов сок</td></tr><tr><td>bira</td><td>бира</td></tr><tr><td>şarap</td><td>вино</td></tr><tr><td>yumurta</td><td>яйце</td></tr><tr><td>bal</td><td>мед</td></tr><tr><td>reçel</td><td>сладко, конфитюр</td></tr><tr><td>köfte</td><td>кюфте</td></tr><tr><td>döner</td><td>дюнер</td></tr><tr><td>meyve</td><td>плод</td></tr><tr><td>elma</td><td>ябълка</td></tr><tr><td>muz</td><td>банан</td></tr><tr><td>portakal</td><td>портокал</td></tr><tr><td>limon</td><td>лимон</td></tr><tr><td>üzüm</td><td>грозде</td></tr><tr><td>karpuz</td><td>диня</td></tr><tr><td>domates</td><td>домат</td></tr><tr><td>salatalık</td><td>краставица</td></tr><tr><td>patates</td><td>картоф</td></tr><tr><td>soğan</td><td>лук</td></tr><tr><td>sarımsak</td><td>чесън</td></tr><tr><td>biber</td><td>чушка</td></tr><tr><td>şeker</td><td>захар</td></tr><tr><td>karabiber</td><td>черен пипер</td></tr><tr><td>zeytinyağı</td><td>зехтин</td></tr><tr><td>dondurma</td><td>сладолед</td></tr><tr><td>pasta</td><td>торта</td></tr><tr><td>lezzetli</td><td>вкусен</td></tr></tbody></table><p><strong>Упр. 10.17 — Как е на турски?</strong> <em>(Türkçesi nedir?)</em></p><ol type=\"1\"><li>напитка</li><li>яйце</li><li>ябълка</li><li>грозде</li><li>картоф</li><li>чесън</li><li>зехтин</li><li>сладолед</li></ol><hr />\n<h2 id=\"урок-11-преразказно-минало-време-öğrenilen-geçmiş-zaman\">УРОК 11\n· Преразказно минало време · Öğrenilen geçmiş zaman</h2>\n<h3 id=\"речник-sözlük-9\">Речник · Sözlük</h3>\n<table>\n<thead>\n<tr class=\"header\">\n<th>Турски</th>\n<th>Български</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>duymak</td>\n<td>чувам</td>\n</tr>\n<tr class=\"even\">\n<td>söylemek</td>\n<td>казвам</td>\n</tr>\n<tr class=\"odd\">\n<td>anlatmak</td>\n<td>разказвам</td>\n</tr>\n<tr class=\"even\">\n<td>haber</td>\n<td>новина</td>\n</tr>\n<tr class=\"odd\">\n<td>galiba</td>\n<td>май, вероятно</td>\n</tr>\n<tr class=\"even\">\n<td>demek ki</td>\n<td>значи, излиза че</td>\n</tr>\n<tr class=\"odd\">\n<td>meğer</td>\n<td>оказва се</td>\n</tr>\n<tr class=\"even\">\n<td>rüya</td>\n<td>сън (насън)</td>\n</tr>\n<tr class=\"odd\">\n<td>masal</td>\n<td>приказка</td>\n</tr>\n<tr class=\"even\">\n<td>eskiden</td>\n<td>едно време</td>\n</tr>\n<tr class=\"odd\">\n<td>sanırım</td>\n<td>мисля че</td>\n</tr>\n<tr class=\"even\">\n<td>öyle mi?</td>\n<td>нима?</td>\n</tr>\n<tr class=\"odd\">\n<td>gerçekten</td>\n<td>наистина</td>\n</tr>\n<tr class=\"even\">\n<td>yalan</td>\n<td>лъжа</td>\n</tr>\n<tr class=\"odd\">\n<td>doğru</td>\n<td>вярно, истина</td>\n</tr>\n<tr class=\"even\">\n<td>olay</td>\n<td>случка, събитие</td>\n</tr>\n<tr class=\"odd\">\n<td>kaza</td>\n<td>злополука</td>\n</tr>\n<tr class=\"even\">\n<td>hava durumu</td>\n<td>прогноза за времето</td>\n</tr>\n<tr class=\"odd\">\n<td>gazete</td>\n<td>вестник</td>\n</tr>\n<tr class=\"even\">\n<td>dedikodu</td>\n<td>клюка</td>\n</tr>\n</tbody>\n</table>\n<h3\nid=\"граматика-11.1-какво-е-преразказно-време-öğrenilen-geçmiş-zaman\">Граматика\n11.1 — Какво е преразказно време · Öğrenilen geçmiş zaman</h3>\n<p>Турският има <strong>две минали времена</strong> и разликата между\nтях е като в българския:</p>\n<table>\n<colgroup>\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th>Форма</th>\n<th>Значение</th>\n<th>Пример</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td><strong>-dı</strong> (görülen)</td>\n<td>видях го, преживях го</td>\n<td>Ali geldi. — Али дойде.</td>\n</tr>\n<tr class=\"even\">\n<td><strong>-mış</strong> (öğrenilen)</td>\n<td>чух го, разбрах после</td>\n<td>Ali gelmiş. — Али бил дошъл.</td>\n</tr>\n</tbody>\n</table>\n<p>Българският прави същото с преизказното наклонение („дошъл“, „бил\nнаправил“), затова тази граматика ти е по-лесна, отколкото на англичанин\nили немец.</p>\n<h3 id=\"граматика-11.2-образуване\">Граматика 11.2 — Образуване</h3>\n<p><strong>Корен + -mış / -miş / -muş / -müş + лично\nокончание</strong></p>\n<table>\n<thead>\n<tr class=\"header\">\n<th>Лице</th>\n<th>gelmek</th>\n<th>yapmak</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>ben</td>\n<td>gel<strong>mişim</strong></td>\n<td>yap<strong>mışım</strong></td>\n</tr>\n<tr class=\"even\">\n<td>sen</td>\n<td>gel<strong>mişsin</strong></td>\n<td>yap<strong>mışsın</strong></td>\n</tr>\n<tr class=\"odd\">\n<td>o</td>\n<td>gel<strong>miş</strong></td>\n<td>yap<strong>mış</strong></td>\n</tr>\n<tr class=\"even\">\n<td>biz</td>\n<td>gel<strong>mişiz</strong></td>\n<td>yap<strong>mışız</strong></td>\n</tr>\n<tr class=\"odd\">\n<td>siz</td>\n<td>gel<strong>mişsiniz</strong></td>\n<td>yap<strong>mışsınız</strong></td>\n</tr>\n<tr class=\"even\">\n<td>onlar</td>\n<td>gel<strong>mişler</strong></td>\n<td>yap<strong>mışlar</strong></td>\n</tr>\n</tbody>\n</table>\n<p><strong>Няма асимилация на съгласната.</strong> За разлика от\n<code>-dı</code>, окончанието <code>-mış</code> започва със звучно\n<code>m</code>, затова никога не се обеззвучава: <code>gitmiş</code>,\n<code>yapmış</code>, <code>içmiş</code>, <code>çalışmış</code>. Сравни:\n<code>git-**t**i</code> (с асимилация) ↔︎ <code>git-**m**iş</code>\n(без).</p>\n<p><strong>Двойната форма за 3 л. мн.ч.:</strong> <code>gelmişler</code>\n(по-често) и <code>gelmiş</code> (когато подлогът е ясен от контекста).\nТурският изпуска <code>-ler</code> при глагола, ако подлогът вече е в\nмножествено число: <code>Çocuklar gelmiş.</code> е също толкова\nправилно, колкото <code>Çocuklar gelmişler.</code></p>\n<p><strong>Отрицание:</strong> корен + <code>-ma/-me</code> +\n<code>-mış</code>\n<code>gelmemiş, yapmamış, gitmemiş, okumamış</code></p>\n<p><strong>Въпрос:</strong> <code>Gelmiş mi?</code> — Дошъл ли е (както\nказват)?</p>\n<h3 id=\"граматика-11.3-четирите-употреби\">Граматика 11.3 — Четирите\nупотреби</h3>\n<p><strong>1. Чужда информация (най-честата):</strong> - Ali dün gelmiş.\n— Али бил дошъл вчера (казаха ми). - Hava yarın yağmurlu olacakmış. —\nВремето утре щяло да е дъждовно (по прогнозата). - Duydun mu? Ayşe\nevlenmiş! — Чу ли? Айше се била оженила!</p>\n<p><strong>2. Заключение от следа (осъзнаване след факта):</strong> -\nYağmur yağmış. — Валяло е. <em>(виждам мокрите улици)</em> - Çok\nyorulmuşum. — Много съм се уморил. <em>(усещам го чак сега)</em> -\nAnahtarı evde unutmuşum. — Забравил съм ключа вкъщи. <em>(осъзнавам го\nпред вратата)</em></p>\n<p><strong>3. Приказки и разкази:</strong> - Bir varmış, bir yokmuş. —\nИмало едно време. <em>(стандартното начало на турска приказка)</em> -\nPadişahın üç oğlu varmış. — Падишахът имал трима сина.</p>\n<p><strong>4. Учудване или ирония:</strong> - Demek çok çalışıyormuşsun!\n— Значи много си бил работлив! <em>(със съмнение)</em> - Meğer\nhaklıymışsın. — Оказва се, че си бил прав.</p>\n<h3 id=\"граматика-11.4-с-именно-сказуемо\">Граматика 11.4 — С именно\nсказуемо</h3>\n<p>Прикача се <code>-ymış</code> (след гласна) или <code>-mış</code>\n(след съгласна):</p>\n<table>\n<thead>\n<tr class=\"header\">\n<th>Сега</th>\n<th>Преразказно</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>O doktor.</td>\n<td>O doktor<strong>muş</strong>. — Той бил лекар.</td>\n</tr>\n<tr class=\"even\">\n<td>Hasta.</td>\n<td>Hasta<strong>ymış</strong>. — Бил болен.</td>\n</tr>\n<tr class=\"odd\">\n<td>Evde.</td>\n<td>Evde<strong>ymiş</strong>. — Бил вкъщи.</td>\n</tr>\n<tr class=\"even\">\n<td>Var.</td>\n<td>Var<strong>mış</strong>. — Имало.</td>\n</tr>\n<tr class=\"odd\">\n<td>Yok.</td>\n<td>Yok<strong>muş</strong>. — Нямало.</td>\n</tr>\n<tr class=\"even\">\n<td>Öğrenciyim.</td>\n<td>Öğrenci<strong>ymiş</strong>im. — Аз съм бил студент.</td>\n</tr>\n</tbody>\n</table>\n<h3 id=\"граматика-11.5-комбинации-с-други-времена\">Граматика 11.5 —\nКомбинации с други времена</h3>\n<p><code>-mış</code> може да се прикачи към друго време и тогава\nпреразказва него:</p>\n<table>\n<thead>\n<tr class=\"header\">\n<th>Форма</th>\n<th>Значение</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>geliyor<strong>muş</strong></td>\n<td>идвал (в момента, казват)</td>\n</tr>\n<tr class=\"even\">\n<td>gelecek<strong>miş</strong></td>\n<td>щял да дойде</td>\n</tr>\n<tr class=\"odd\">\n<td>gelir<strong>miş</strong></td>\n<td>идвал (обикновено, казват)</td>\n</tr>\n<tr class=\"even\">\n<td>geliyor<strong>muş</strong>um</td>\n<td>аз съм идвал (оказва се)</td>\n</tr>\n</tbody>\n</table>\n<p>Примери: - Ayşe şimdi çalışıyormuş. — Айше сега работела. - Yarın\ngelmeyecekmiş. — Утре нямало да дойде. - Eskiden çok sigara içermiş. —\nЕдно време много пушел.</p>\n<h3 id=\"граматика-11.6-кога-не-се-използва--mış\">Граматика 11.6 — Кога\nНЕ се използва <code>-mış</code></h3>\n<p>Ако си бил свидетел, винаги <code>-dı</code>, дори за далечно\nминало:</p>\n<ul>\n<li>✓ Dün Ali’yi gördüm. — Вчера видях Али.</li>\n<li>✗ <del>Dün Ali’yi görmüşüm.</del> <em>(освен ако не си бил пиян и не\nпомниш)</em></li>\n</ul>\n<p>За собствени действия <code>-mış</code> звучи странно, освен при\nосъзнаване: - <code>Uyumuşum.</code> — Заспал съм бил. <em>(правилно —\nосъзнаваш го при събуждане)</em> - <code>Dün sinemaya gitmişim.</code> —\nзвучи все едно не помниш дали си ходил.</p>\n<h3 id=\"защо-е-така-neden-böyle-10\">Защо е така · Neden böyle</h3>\n<p><strong>Защо турският изобщо има това време?</strong> Защото\nкултурата държи на разграничението „видях“ / „казаха ми“ — говорещият\nпоема или не поема отговорност за истинността. В новините ще чуеш\n<code>-mış</code> за непотвърдена информация и <code>-dı</code> за\nпроверена. Българският има същия механизъм, но го използваме\nпо-хлабаво.</p>\n<p><strong>Защо <code>yağmur yağmış</code> е за нещо, което сам\nвиждаш?</strong> Защото не си видял <strong>самото валене</strong> —\nвиждаш само следата. Логиката е: „заключавам от доказателство“, а не\n„присъствах“. Затова и <code>çok yorulmuşum</code> (уморил съм се) —\nумората е настъпила неусетно, осъзнаваш я после.</p>\n<p><strong>Защо приказките са в <code>-mış</code>?</strong> Защото\nразказвачът не е присъствал. <code>Bir varmış, bir yokmuş</code> е\nточният аналог на нашето „Имало едно време“ — и двата езика използват\nпреизказ за приказка. Ако турчин започне приказка с <code>-dı</code>,\nзвучи все едно твърди, че се е случило наистина.</p>\n<p><strong>Внимание:</strong> <code>-mış</code> понякога звучи като\nнедоверие. <code>Hastaymış</code> може да значи „бил болен“ (неутрално)\nили „уж бил болен“ (със съмнение) — интонацията решава. Не го използвай\nза неща, които знаеш със сигурност, за да не прозвучиш саркастично.</p>\n<h3 id=\"текст-за-четене-и-превод-okuma-ve-çeviri-metni-9\">Текст за\nчетене и превод · Okuma ve çeviri metni</h3>\n<p><strong>Dedikodu — Клюка</strong></p>\n<blockquote>\n<p>— Duydun mu? Ayşe işten ayrılmış!</p>\n<p>— Öyle mi? Neden peki?</p>\n<p>— Bilmiyorum ama yeni bir iş bulmuş diyorlar. Maaşı da çok daha\niyiymiş.</p>\n<p>— Demek ki iyi olmuş. Peki nerede çalışacakmış?</p>\n<p>— Bir bankada. Geçen hafta görüşmeye gitmiş ve hemen kabul\netmişler.</p>\n<p>— Vay! Hiç bahsetmemişti bana.</p>\n<p>— Bana da söylememiş. Ortak arkadaşımızdan duydum.</p>\n<p>— Neyse, ona bir mesaj atayım. Tebrik ederim, diyeyim.</p>\n<p>— İyi olur. Ama sakın benden duyduğunu söyleme!</p>\n</blockquote>\n<p><em>Нови думи:</em> <code>işten ayrılmak</code> — напускам работа;\n<code>maaş</code> — заплата; <code>görüşme</code> — интервю;\n<code>kabul etmek</code> — приемам; <code>bahsetmek</code> — споменавам;\n<code>ortak</code> — общ; <code>mesaj atmak</code> — пращам съобщение;\n<code>tebrik etmek</code> — поздравявам; <code>sakın</code> — да не си\nпосмял.</p>\n<p><strong>Въпроси:</strong></p>\n<ol type=\"1\">\n<li>Ayşe ne yapmış?</li>\n<li>Yeni işi nasılmış?</li>\n<li>Nerede çalışacakmış?</li>\n<li>Konuşan kişi haberi kimden duymuş?</li>\n</ol>\n<h3 id=\"упражнения-alıştırmalar-10\">Упражнения · Alıştırmalar</h3>\n<p><strong>Упр. 11.1 — Постави в преразказно време.</strong>\n<em>(Öğrenilen geçmiş zamana çevirin.)</em></p>\n<ol type=\"1\">\n<li>gelmek (o)</li>\n<li>yapmak (sen)</li>\n<li>gitmek (onlar)</li>\n<li>okumak (ben)</li>\n<li>içmek (o)</li>\n<li>çalışmak (biz)</li>\n<li>görmek (siz)</li>\n<li>beklemek (o)</li>\n</ol>\n<p><strong>Упр. 11.2 — <code>-dı</code> или <code>-mış</code>?</strong>\n<em>(-dı mı, -mış mı?)</em></p>\n<ol type=\"1\">\n<li>Dün Ali’yi (görmek) ___ . (бях там)</li>\n<li>Ayşe evlenmiş, ben de (duymak) ___ . (чух го)</li>\n<li>Yağmur (yağmak) ___ , yerler ıslak. (виждам следата)</li>\n<li>Geçen yıl İstanbul’a (gitmek) ___ . (аз ходих)</li>\n<li>Anahtarı evde (unutmak) ___ . (осъзнавам сега)</li>\n<li>Sabah kahvaltı (yapmak) ___ . (аз го направих)</li>\n</ol>\n<p><strong>Упр. 11.3 — Именно сказуемо в преразказно време.</strong>\n<em>(İsim cümlesini -mış ile yazın.)</em></p>\n<ol type=\"1\">\n<li>O doktor___ .</li>\n<li>Hasta___ .</li>\n<li>Evde___ .</li>\n<li>Çok güzel___ .</li>\n<li>Orada kimse yok___ .</li>\n<li>Masada iki kitap var___ .</li>\n</ol>\n<p><strong>Упр. 11.4 — Комбинирай с другите времена.</strong> <em>(Diğer\nzamanlarla birleştirin.)</em></p>\n<ol type=\"1\">\n<li>geliyor + mış (o)</li>\n<li>gelecek + miş (o)</li>\n<li>gelir + miş (o)</li>\n<li>çalışıyor + muş (sen)</li>\n<li>yapacak + mış (onlar)</li>\n</ol>\n<p><strong>Упр. 11.5 — Направи отрицателни.</strong> <em>(Olumsuz\nyapın.)</em></p>\n<ol type=\"1\">\n<li>Gelmiş.</li>\n<li>Yapmışsın.</li>\n<li>Gitmişler.</li>\n<li>Okumuşum.</li>\n<li>Görmüşüz.</li>\n</ol>\n<p><strong>Упр. 11.6 — Преведи на турски.</strong> <em>(Türkçeye\nçevirin.)</em></p>\n<ol type=\"1\">\n<li>Али бил дошъл вчера.</li>\n<li>Валяло е.</li>\n<li>Забравил съм ключа.</li>\n<li>Казват, че щял да дойде утре.</li>\n<li>Оказва се, че си бил прав.</li>\n<li>Имало едно време.</li>\n<li>Айше се била оженила.</li>\n<li>Едно време много пушел.</li>\n</ol>\n<h3>Тематичен речник · Konu sözlüğü — Характер и чувства · Karakter ve duygular</h3><table><thead><tr><th>Türkçe</th><th>Български</th></tr></thead><tbody><tr><td>kızgınlık</td><td>ядосване</td></tr><tr><td>kaygı</td><td>тревога</td></tr><tr><td>şaşkınlık</td><td>изненада, удивление</td></tr><tr><td>stres</td><td>стрес</td></tr><tr><td>sakinlik</td><td>спокойствие</td></tr><tr><td>kibar</td><td>любезен</td></tr><tr><td>nazik</td><td>внимателен, деликатен</td></tr><tr><td>kaba</td><td>груб</td></tr><tr><td>çalışkan</td><td>работлив</td></tr><tr><td>tembel</td><td>мързелив</td></tr><tr><td>cömert</td><td>щедър</td></tr><tr><td>cimri</td><td>стиснат</td></tr><tr><td>dürüst</td><td>честен</td></tr><tr><td>yalancı</td><td>лъжец</td></tr><tr><td>komik</td><td>смешен</td></tr><tr><td>sinirli</td><td>нервен</td></tr><tr><td>cesur</td><td>смел</td></tr><tr><td>korkak</td><td>страхлив</td></tr><tr><td>sabırlı</td><td>търпелив</td></tr><tr><td>sabırsız</td><td>нетърпелив</td></tr><tr><td>sempatik</td><td>симпатичен</td></tr><tr><td>utangaç</td><td>срамежлив</td></tr></tbody></table><p><strong>Упр. 11.7 — Как е на турски?</strong> <em>(Türkçesi nedir?)</em></p><ol type=\"1\"><li>любезен</li><li>груб</li><li>работлив</li><li>мързелив</li><li>щедър</li><li>стиснат</li><li>смел</li><li>срамежлив</li></ol><hr />\n<h2 id=\"урок-12-дължимост-и-необходимост-gereklilik\">УРОК 12 · Дължимост\nи необходимост · Gereklilik</h2>\n<h3 id=\"речник-sözlük-10\">Речник · Sözlük</h3>\n<table>\n<thead>\n<tr class=\"header\">\n<th>Турски</th>\n<th>Български</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>lazım</td>\n<td>нужно, необходимо</td>\n</tr>\n<tr class=\"even\">\n<td>gerek / gerekmek</td>\n<td>трябва</td>\n</tr>\n<tr class=\"odd\">\n<td>zorunda</td>\n<td>принуден съм</td>\n</tr>\n<tr class=\"even\">\n<td>mecbur</td>\n<td>длъжен</td>\n</tr>\n<tr class=\"odd\">\n<td>şart</td>\n<td>условие; задължително</td>\n</tr>\n<tr class=\"even\">\n<td>izin</td>\n<td>разрешение</td>\n</tr>\n<tr class=\"odd\">\n<td>kural</td>\n<td>правило</td>\n</tr>\n<tr class=\"even\">\n<td>yasak</td>\n<td>забранено</td>\n</tr>\n<tr class=\"odd\">\n<td>serbest</td>\n<td>свободно, позволено</td>\n</tr>\n<tr class=\"even\">\n<td>dikkat etmek</td>\n<td>внимавам</td>\n</tr>\n<tr class=\"odd\">\n<td>acele etmek</td>\n<td>бързам</td>\n</tr>\n<tr class=\"even\">\n<td>karar vermek</td>\n<td>решавам</td>\n</tr>\n<tr class=\"odd\">\n<td>söz vermek</td>\n<td>обещавам</td>\n</tr>\n<tr class=\"even\">\n<td>yardım etmek</td>\n<td>помагам</td>\n</tr>\n<tr class=\"odd\">\n<td>dinlenmek</td>\n<td>почивам си</td>\n</tr>\n<tr class=\"even\">\n<td>erken</td>\n<td>рано</td>\n</tr>\n<tr class=\"odd\">\n<td>geç</td>\n<td>късно</td>\n</tr>\n<tr class=\"even\">\n<td>hemen</td>\n<td>веднага</td>\n</tr>\n<tr class=\"odd\">\n<td>mutlaka</td>\n<td>непременно</td>\n</tr>\n<tr class=\"even\">\n<td>en azından</td>\n<td>поне</td>\n</tr>\n</tbody>\n</table>\n<h3 id=\"граматика-12.1--malı--meli-трябва\">Граматика 12.1 —\n<code>-malı / -meli</code> (трябва)</h3>\n<p>Най-прекият начин да кажеш „трябва“:</p>\n<p><strong>Корен + -malı / -meli + лично окончание</strong></p>\n<table>\n<thead>\n<tr class=\"header\">\n<th>Лице</th>\n<th>gitmek</th>\n<th>çalışmak</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>ben</td>\n<td>git<strong>meliyim</strong></td>\n<td>çalış<strong>malıyım</strong></td>\n</tr>\n<tr class=\"even\">\n<td>sen</td>\n<td>git<strong>melisin</strong></td>\n<td>çalış<strong>malısın</strong></td>\n</tr>\n<tr class=\"odd\">\n<td>o</td>\n<td>git<strong>meli</strong></td>\n<td>çalış<strong>malı</strong></td>\n</tr>\n<tr class=\"even\">\n<td>biz</td>\n<td>git<strong>meliyiz</strong></td>\n<td>çalış<strong>malıyız</strong></td>\n</tr>\n<tr class=\"odd\">\n<td>siz</td>\n<td>git<strong>melisiniz</strong></td>\n<td>çalış<strong>malısınız</strong></td>\n</tr>\n<tr class=\"even\">\n<td>onlar</td>\n<td>git<strong>meliler</strong></td>\n<td>çalış<strong>malılar</strong></td>\n</tr>\n</tbody>\n</table>\n<p><strong>Отрицание:</strong> корен + <code>-ma/-me</code> +\n<code>-malı</code> <code>gitmemeliyim</code> — не трябва да ходя\n<code>yapmamalısın</code> — не трябва да правиш</p>\n<p><strong>Въпрос:</strong> <code>Gitmeli miyim?</code> — Трябва ли да\nотида?</p>\n<p>Примери: - Daha çok çalışmalıyım. — Трябва да работя повече. - Erken\nyatmalısın. — Трябва да си лягаш рано. - Sigara içmemelisin. — Не трябва\nда пушиш. - Ne yapmalıyım? — Какво трябва да направя?</p>\n<h3 id=\"граматика-12.2-lazım-и-gerek-нужно-е\">Граматика 12.2 —\n<code>lazım</code> и <code>gerek</code> (нужно е)</h3>\n<p>По-меки от <code>-malı</code>. Строят се с отглаголно име на\n<code>-mak/-mek</code> или <code>-ma/-me</code>:</p>\n<table>\n<thead>\n<tr class=\"header\">\n<th>Форма</th>\n<th>Пример</th>\n<th>Превод</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td><strong>-mak lazım</strong> (общо)</td>\n<td>Çalışmak lazım.</td>\n<td>Трябва да се работи.</td>\n</tr>\n<tr class=\"even\">\n<td><strong>-mam lazım</strong> (лично)</td>\n<td>Gitmem lazım.</td>\n<td>Трябва да отида.</td>\n</tr>\n<tr class=\"odd\">\n<td><strong>-man gerek</strong></td>\n<td>Dinlenmen gerek.</td>\n<td>Трябва да си починеш.</td>\n</tr>\n</tbody>\n</table>\n<p><strong>Личните форми на отглаголното име:</strong></p>\n<div class=\"line-block\">ben | gitme<strong>m</strong> lazım | трябва да\nотида |<br />\nsen | gitme<strong>n</strong> lazım | трябва да отидеш |<br />\no | gitme<strong>si</strong> lazım | трябва да отиде |<br />\nbiz | gitme<strong>miz</strong> lazım | трябва да отидем |<br />\nsiz | gitme<strong>niz</strong> lazım | трябва да отидете |<br />\nonlar | gitme<strong>leri</strong> lazım | трябва да отидат |</div>\n<p><code>gerek</code> работи по същия начин: <code>gitmem gerek</code>,\n<code>gitmen gerek</code>…</p>\n<p><strong>Минало време:</strong> <code>Gitmem lazımdı.</code> —\nТрябваше да отида.</p>\n<h3 id=\"граматика-12.3-zorunda-mecbur-принуден-съм\">Граматика 12.3 —\n<code>zorunda / mecbur</code> (принуден съм)</h3>\n<p>По-силно от „трябва“ — означава външна принуда, няма избор:</p>\n<table>\n<colgroup>\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th>Форма</th>\n<th>Пример</th>\n<th>Превод</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td><strong>-mak zorunda</strong></td>\n<td>Çalışmak zorundayım.</td>\n<td>Принуден съм да работя.</td>\n</tr>\n<tr class=\"even\">\n<td><strong>-mak zorunda kalmak</strong></td>\n<td>Gitmek zorunda kaldım.</td>\n<td>Наложи ми се да отида.</td>\n</tr>\n<tr class=\"odd\">\n<td><strong>mecburum</strong></td>\n<td>Gitmeye mecburum.</td>\n<td>Длъжен съм да отида.</td>\n</tr>\n</tbody>\n</table>\n<div class=\"line-block\">ben | gitmek zorunda<strong>yım</strong> |<br />\nsen | gitmek zorunda<strong>sın</strong> |<br />\no | gitmek zorunda |<br />\nbiz | gitmek zorunda<strong>yız</strong> |<br />\nsiz | gitmek zorunda<strong>sınız</strong> |<br />\nonlar | gitmek zorunda<strong>lar</strong> |</div>\n<p><strong>Отрицание:</strong> <code>gitmek zorunda değilim</code> — не\nсъм длъжен да отида</p>\n<h3 id=\"граматика-12.4-степени-на-задължение\">Граматика 12.4 — Степени\nна задължение</h3>\n<p>Подредени от най-мека към най-силна:</p>\n<table>\n<thead>\n<tr class=\"header\">\n<th>Форма</th>\n<th>Пример</th>\n<th>Оттенък</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>iyi olur</td>\n<td>Gitsen iyi olur.</td>\n<td>би било добре да отидеш</td>\n</tr>\n<tr class=\"even\">\n<td>lazım / gerek</td>\n<td>Gitmen lazım.</td>\n<td>нужно е</td>\n</tr>\n<tr class=\"odd\">\n<td>-malı</td>\n<td>Gitmelisin.</td>\n<td>трябва</td>\n</tr>\n<tr class=\"even\">\n<td>zorunda</td>\n<td>Gitmek zorundasın.</td>\n<td>принуден си, няма избор</td>\n</tr>\n<tr class=\"odd\">\n<td>şart</td>\n<td>Gitmen şart.</td>\n<td>задължително е</td>\n</tr>\n</tbody>\n</table>\n<h3 id=\"граматика-12.5-разрешение-и-забрана\">Граматика 12.5 — Разрешение\nи забрана</h3>\n<table>\n<colgroup>\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th>Форма</th>\n<th>Пример</th>\n<th>Превод</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>-abilir miyim?</td>\n<td>Girebilir miyim?</td>\n<td>Може ли да вляза?</td>\n</tr>\n<tr class=\"even\">\n<td>serbest</td>\n<td>Burada park etmek serbest.</td>\n<td>Тук е позволено да се паркира.</td>\n</tr>\n<tr class=\"odd\">\n<td>yasak</td>\n<td>Sigara içmek yasak.</td>\n<td>Пушенето е забранено.</td>\n</tr>\n<tr class=\"even\">\n<td>izin var / yok</td>\n<td>Girmeye izin yok.</td>\n<td>Няма разрешение за влизане.</td>\n</tr>\n<tr class=\"odd\">\n<td>-mayın</td>\n<td>Girmeyin!</td>\n<td>Не влизайте!</td>\n</tr>\n</tbody>\n</table>\n<p>Разговорни отговори: - Olur. — Може. - Olmaz. — Не може. - Tabii. —\nРазбира се.</p>\n<h3 id=\"защо-е-така-neden-böyle-11\">Защо е така · Neden böyle</h3>\n<p><strong>Защо има толкова начини да се каже „трябва“?</strong> Защото\nтурският различава <strong>вътрешна</strong> и <strong>външна</strong>\nнеобходимост, а българският не:</p>\n<ul>\n<li><code>Çalışmalıyım</code> — трябва да работя (аз преценявам, че е\nредно)</li>\n<li><code>Çalışmam lazım</code> — нужно ми е да работя (обстоятелствата\nго налагат)</li>\n<li><code>Çalışmak zorundayım</code> — принуден съм (нямам избор, иначе\nпоследствия)</li>\n</ul>\n<p>Ако кажеш <code>zorunda</code> за нещо доброволно, звучи все едно се\nоплакваш.</p>\n<p><strong>Защо <code>gitmem lazım</code>, а не\n<code>gitmek lazım</code> за „аз трябва“?</strong>\n<code>gitmek lazım</code> е безлично — „трябва да се ходи“, изобщо. За\nда кажеш кой трябва, превръщаш глагола в съществително с притежание:\n<code>gitme-m</code> е буквално „моето отиване“. Тоест: „моето отиване е\nнужно“.</p>\n<p><strong>Защо <code>-malı</code> съдържа <code>-ma</code>, което иначе\nе отрицание?</strong> Съвпадение — това са различни окончания с еднакъв\nвид. Затова отрицателната форма изглежда странно с два пъти\n<code>me</code>: <code>gitmemeliyim</code> = git + me (отрицание) + meli\n(дължимост). Свикваш бързо.</p>\n<h3 id=\"текст-за-четене-и-превод-okuma-ve-çeviri-metni-10\">Текст за\nчетене и превод · Okuma ve çeviri metni</h3>\n<p><strong>Doktorda — При лекаря</strong></p>\n<blockquote>\n<p>— Şikâyetiniz nedir?</p>\n<p>— Son zamanlarda çok yorgunum. Sabahları zor kalkıyorum.</p>\n<p>— Günde kaç saat uyuyorsunuz?</p>\n<p>— Beş, altı saat kadar. Çok işim var, geç yatmak zorunda\nkalıyorum.</p>\n<p>— En azından yedi saat uyumalısınız. Vücudun dinlenmeye ihtiyacı\nvar.</p>\n<p>— Biliyorum ama yapamıyorum.</p>\n<p>— Kahve içiyor musunuz?</p>\n<p>— Günde beş, altı fincan.</p>\n<p>— Bu çok fazla. Akşamları kesinlikle kahve içmemelisiniz. Ayrıca\nbiraz spor yapmanız lazım. Haftada üç kere yürüyüş yeterli olur.</p>\n<p>— Peki, deneyeceğim.</p>\n<p>— Bir de kan tahlili yaptırmanız gerek. Sonuçlara göre tekrar\nkonuşuruz.</p>\n</blockquote>\n<p><em>Нови думи:</em> <code>şikâyet</code> — оплакване;\n<code>son zamanlarda</code> — напоследък; <code>vücut</code> — тяло;\n<code>ihtiyaç</code> — нужда; <code>fincan</code> — чашка;\n<code>ayrıca</code> — освен това; <code>yürüyüş</code> — разходка пеша;\n<code>yeterli</code> — достатъчен; <code>denemek</code> — опитвам;\n<code>kan tahlili</code> — кръвно изследване; <code>sonuç</code> —\nрезултат; <code>-e göre</code> — според.</p>\n<p><strong>Въпроси:</strong></p>\n<ol type=\"1\">\n<li>Hasta neden yorgun?</li>\n<li>Günde kaç saat uyuması lazım?</li>\n<li>Ne içmemeli?</li>\n<li>Doktor başka ne tavsiye ediyor?</li>\n</ol>\n<h3 id=\"упражнения-alıştırmalar-11\">Упражнения · Alıştırmalar</h3>\n<p><strong>Упр. 12.1 — Постави в <code>-malı / -meli</code>.</strong>\n<em>(-malı/-meli ile yazın.)</em></p>\n<ol type=\"1\">\n<li>gitmek (ben)</li>\n<li>çalışmak (sen)</li>\n<li>dinlenmek (o)</li>\n<li>beklemek (biz)</li>\n<li>yapmak (siz)</li>\n<li>gelmek (onlar)</li>\n</ol>\n<p><strong>Упр. 12.2 — Направи отрицателни.</strong> <em>(Olumsuz\nyapın.)</em></p>\n<ol type=\"1\">\n<li>Gitmeliyim.</li>\n<li>Yapmalısın.</li>\n<li>İçmeli.</li>\n<li>Beklemeliyiz.</li>\n<li>Konuşmalısınız.</li>\n</ol>\n<p><strong>Упр. 12.3 — Преобразувай с <code>lazım</code>.</strong>\n<em>(„lazım“ ile yazın.)</em></p>\n<p>Пример: Gitmeliyim. → Gitmem lazım.</p>\n<ol type=\"1\">\n<li>Çalışmalısın.</li>\n<li>Dinlenmeli.</li>\n<li>Beklemeliyiz.</li>\n<li>Gitmelisiniz.</li>\n<li>Yapmalıyım.</li>\n</ol>\n<p><strong>Упр. 12.4 — <code>-malı</code>, <code>lazım</code> или\n<code>zorunda</code>?</strong> <em>(Hangisi uygun?)</em></p>\n<ol type=\"1\">\n<li>Sağlık için spor ___ . (редно е)</li>\n<li>Param yok, çalışmak ___ . (нямам избор)</li>\n<li>Erken yatmak ___ . (нужно е)</li>\n<li>Sigara içmek ___ . (не бива)</li>\n<li>Yarın sınav var, ders çalışmak ___ . (нямам избор)</li>\n</ol>\n<p><strong>Упр. 12.5 — Разрешено или забранено?</strong> <em>(Serbest\nmi, yasak mı?)</em></p>\n<ol type=\"1\">\n<li>Може ли да вляза?</li>\n<li>Пушенето е забранено.</li>\n<li>Тук е позволено да се паркира.</li>\n<li>Не влизайте!</li>\n<li>Може ли да седна тук?</li>\n</ol>\n<p><strong>Упр. 12.6 — Преведи на турски.</strong> <em>(Türkçeye\nçevirin.)</em></p>\n<ol type=\"1\">\n<li>Трябва да работя повече.</li>\n<li>Не трябва да пушиш.</li>\n<li>Трябва да отида.</li>\n<li>Принуден съм да работя.</li>\n<li>Не съм длъжен да отида.</li>\n<li>Какво трябва да направя?</li>\n<li>Трябва да си починеш.</li>\n<li>Наложи ми се да отида.</li>\n</ol>\n<h3>Тематичен речник · Konu sözlüğü — Училище и учебни неща · Okul eşyaları</h3><table><thead><tr><th>Türkçe</th><th>Български</th></tr></thead><tbody><tr><td>sınav</td><td>изпит</td></tr><tr><td>imtihan</td><td>изпит (книжно)</td></tr><tr><td>sınıf</td><td>клас; класна стая</td></tr><tr><td>fakülte</td><td>факултет</td></tr><tr><td>bölüm</td><td>специалност, отдел</td></tr><tr><td>not</td><td>оценка; бележка</td></tr><tr><td>mezun olmak</td><td>завършвам образование</td></tr><tr><td>kayıt</td><td>записване</td></tr><tr><td>kayıt olmak</td><td>записвам се</td></tr><tr><td>burs</td><td>стипендия</td></tr><tr><td>sözlük</td><td>речник</td></tr><tr><td>kitaplık</td><td>библиотека (мебел)</td></tr><tr><td>sayfa</td><td>страница</td></tr><tr><td>silgi</td><td>гумичка</td></tr><tr><td>kalemtıraş</td><td>острилка</td></tr><tr><td>cetvel</td><td>линийка</td></tr><tr><td>defter</td><td>тетрадка</td></tr></tbody></table><p><strong>Упр. 12.8 — Как е на турски?</strong> <em>(Türkçesi nedir?)</em></p><ol type=\"1\"><li>изпит</li><li>факултет</li><li>специалност</li><li>завършвам образование</li><li>стипендия</li><li>гумичка</li><li>острилка</li><li>тетрадка</li></ol><h3>Тематичен речник · Konu sözlüğü — Домакинство и ежедневие · Ev işleri</h3><table><thead><tr><th>Türkçe</th><th>Български</th></tr></thead><tbody><tr><td>kiracı</td><td>наемател</td></tr><tr><td>site</td><td>затворен комплекс</td></tr><tr><td>müstakil ev</td><td>самостоятелна къща</td></tr><tr><td>mobilya</td><td>мебели</td></tr><tr><td>beyaz eşya</td><td>електроуреди</td></tr><tr><td>ütü</td><td>ютия</td></tr><tr><td>süpürge</td><td>прахосмукачка, метла</td></tr><tr><td>süpürmek</td><td>мета, чистя с прахосмукачка</td></tr><tr><td>ütülemek</td><td>гладя</td></tr><tr><td>yıkamak</td><td>мия, пера</td></tr><tr><td>kurulamak</td><td>подсушавам</td></tr><tr><td>silmek</td><td>бърша</td></tr><tr><td>toz almak</td><td>бърша прах</td></tr><tr><td>tamir etmek</td><td>поправям</td></tr><tr><td>alet</td><td>инструмент</td></tr><tr><td>ampul</td><td>крушка</td></tr><tr><td>fiş</td><td>щепсел; касова бележка</td></tr><tr><td>çöp</td><td>боклук</td></tr><tr><td>çöp kutusu</td><td>кофа за боклук</td></tr><tr><td>düzenli</td><td>подреден</td></tr><tr><td>dağınık</td><td>разхвърлян</td></tr></tbody></table><p><strong>Упр. 12.7 — Как е на турски?</strong> <em>(Türkçesi nedir?)</em></p><ol type=\"1\"><li>наемател</li><li>мебели</li><li>ютия</li><li>гладя</li><li>бърша прах</li><li>крушка</li><li>боклук</li><li>разхвърлян</li></ol><hr />\n<h2 id=\"урок-13-условно-наклонение-şart-kipi\">УРОК 13 · Условно\nнаклонение · Şart kipi</h2>\n<h3 id=\"речник-sözlük-11\">Речник · Sözlük</h3>\n<table>\n<thead>\n<tr class=\"header\">\n<th>Турски</th>\n<th>Български</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>eğer</td>\n<td>ако</td>\n</tr>\n<tr class=\"even\">\n<td>şayet</td>\n<td>ако (книжовно)</td>\n</tr>\n<tr class=\"odd\">\n<td>keşke</td>\n<td>де да, дано беше</td>\n</tr>\n<tr class=\"even\">\n<td>belki</td>\n<td>може би</td>\n</tr>\n<tr class=\"odd\">\n<td>yoksa</td>\n<td>иначе</td>\n</tr>\n<tr class=\"even\">\n<td>aksi takdirde</td>\n<td>в противен случай</td>\n</tr>\n<tr class=\"odd\">\n<td>durum</td>\n<td>положение</td>\n</tr>\n<tr class=\"even\">\n<td>ihtimal</td>\n<td>вероятност</td>\n</tr>\n<tr class=\"odd\">\n<td>fırsat</td>\n<td>възможност, шанс</td>\n</tr>\n<tr class=\"even\">\n<td>şans</td>\n<td>късмет</td>\n</tr>\n<tr class=\"odd\">\n<td>kazanmak</td>\n<td>печеля</td>\n</tr>\n<tr class=\"even\">\n<td>kaybetmek</td>\n<td>губя</td>\n</tr>\n<tr class=\"odd\">\n<td>başarmak</td>\n<td>успявам</td>\n</tr>\n<tr class=\"even\">\n<td>denemek</td>\n<td>опитвам</td>\n</tr>\n<tr class=\"odd\">\n<td>pişman olmak</td>\n<td>съжалявам</td>\n</tr>\n<tr class=\"even\">\n<td>yardımcı olmak</td>\n<td>помагам</td>\n</tr>\n<tr class=\"odd\">\n<td>müsait</td>\n<td>свободен, разполагаем</td>\n</tr>\n<tr class=\"even\">\n<td>meşgul</td>\n<td>зает</td>\n</tr>\n<tr class=\"odd\">\n<td>hazır</td>\n<td>готов</td>\n</tr>\n<tr class=\"even\">\n<td>emin</td>\n<td>сигурен</td>\n</tr>\n</tbody>\n</table>\n<h3 id=\"граматика-13.1-реално-условие--sa--se\">Граматика 13.1 — Реално\nусловие (-sa / -se)</h3>\n<p>За неща, които реално могат да се случат. Обикновено се превежда с\n„ако“:</p>\n<p><strong>Корен + време + -sa / -se + лично окончание</strong></p>\n<table>\n<thead>\n<tr class=\"header\">\n<th>Лице</th>\n<th>gelmek</th>\n<th>Превод</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>ben</td>\n<td>gelir<strong>sem</strong></td>\n<td>ако дойда</td>\n</tr>\n<tr class=\"even\">\n<td>sen</td>\n<td>gelir<strong>sen</strong></td>\n<td>ако дойдеш</td>\n</tr>\n<tr class=\"odd\">\n<td>o</td>\n<td>gelir<strong>se</strong></td>\n<td>ако дойде</td>\n</tr>\n<tr class=\"even\">\n<td>biz</td>\n<td>gelir<strong>sek</strong></td>\n<td>ако дойдем</td>\n</tr>\n<tr class=\"odd\">\n<td>siz</td>\n<td>gelir<strong>seniz</strong></td>\n<td>ако дойдете</td>\n</tr>\n<tr class=\"even\">\n<td>onlar</td>\n<td>gelir<strong>lerse</strong></td>\n<td>ако дойдат</td>\n</tr>\n</tbody>\n</table>\n<p><strong>Забележи:</strong> условието се лепи <strong>след</strong>\nвремето, не за голия корен:</p>\n<table>\n<thead>\n<tr class=\"header\">\n<th>Време</th>\n<th>Условна форма</th>\n<th>Превод</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>geniş</td>\n<td>gelir<strong>se</strong></td>\n<td>ако дойде (обикновено)</td>\n</tr>\n<tr class=\"even\">\n<td>-yor</td>\n<td>geliyor<strong>sa</strong></td>\n<td>ако идва (сега)</td>\n</tr>\n<tr class=\"odd\">\n<td>-dı</td>\n<td>geldi<strong>yse</strong></td>\n<td>ако е дошъл</td>\n</tr>\n<tr class=\"even\">\n<td>-mış</td>\n<td>gelmiş<strong>se</strong></td>\n<td>ако е дошъл (казват)</td>\n</tr>\n<tr class=\"odd\">\n<td>-acak</td>\n<td>gelecek<strong>se</strong></td>\n<td>ако ще дойде</td>\n</tr>\n</tbody>\n</table>\n<p><strong>Отрицание:</strong> <code>gelmezse</code> (ако не дойде),\n<code>gelmiyorsa</code> (ако не идва)</p>\n<p>Примери: - Yarın gelirsen, birlikte yemek yeriz. — Ако дойдеш утре,\nще ядем заедно. - Param olursa, yeni bir araba alacağım. — Ако имам\nпари, ще си купя нова кола. - Yağmur yağarsa, evde kalırız. — Ако вали,\nще си останем вкъщи. - Müsaitsen, seni arayayım. — Ако си свободен, да\nти звънна.</p>\n<p><strong><code>eğer</code> не е задължително</strong> — окончанието\n<code>-se</code> вече казва „ако“. <code>eğer</code> само подсилва:\n<code>Eğer gelirsen…</code> = <code>Gelirsen…</code></p>\n<h3 id=\"граматика-13.2-нереално-условие--saydı--seydi\">Граматика 13.2 —\nНереално условие (-saydı / -seydi)</h3>\n<p>За неща, които НЕ са се случили — съжаление или хипотеза:</p>\n<table>\n<thead>\n<tr class=\"header\">\n<th>Форма</th>\n<th>Пример</th>\n<th>Превод</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>-saydı</td>\n<td>Gelseydin, görürdün.</td>\n<td>Ако беше дошъл, щеше да видиш.</td>\n</tr>\n<tr class=\"even\">\n<td>-saydım</td>\n<td>Param olsaydı, alırdım.</td>\n<td>Ако имах пари, щях да купя.</td>\n</tr>\n</tbody>\n</table>\n<p><strong>Главното изречение е в <code>-ırdı / -erdi</code></strong>\n(geniş zaman в минало):</p>\n<table>\n<thead>\n<tr class=\"header\">\n<th>Лице</th>\n<th>Условие</th>\n<th>Резултат</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>ben</td>\n<td>gelseydim</td>\n<td>görürdüm</td>\n</tr>\n<tr class=\"even\">\n<td>sen</td>\n<td>gelseydin</td>\n<td>görürdün</td>\n</tr>\n<tr class=\"odd\">\n<td>o</td>\n<td>gelseydi</td>\n<td>görürdü</td>\n</tr>\n<tr class=\"even\">\n<td>biz</td>\n<td>gelseydik</td>\n<td>görürdük</td>\n</tr>\n<tr class=\"odd\">\n<td>siz</td>\n<td>gelseydiniz</td>\n<td>görürdünüz</td>\n</tr>\n<tr class=\"even\">\n<td>onlar</td>\n<td>gelselerdi</td>\n<td>görürlerdi</td>\n</tr>\n</tbody>\n</table>\n<p>Примери: - Erken kalksaydım, treni kaçırmazdım. — Ако бях станал\nрано, нямаше да изпусна влака. - Zengin olsaydım, dünyayı gezerdim. —\nАко бях богат, щях да обиколя света. - Beni dinleseydin, bu olmazdı. —\nАко ме беше послушал, това нямаше да стане.</p>\n<h3 id=\"граматика-13.3-keşke-де-да\">Граматика 13.3 — <code>keşke</code>\n(де да)</h3>\n<p>Изразява съжаление или желание:</p>\n<ul>\n<li>Keşke gelseydin. — Де да беше дошъл.</li>\n<li>Keşke param olsa. — Де да имах пари.</li>\n<li>Keşke bunu yapmasaydım. — Де да не бях правил това.</li>\n<li>Keşke daha çok çalışsaydım. — Де да бях учил повече.</li>\n</ul>\n<h3 id=\"граматика-13.4-условие-с-именно-сказуемо\">Граматика 13.4 —\nУсловие с именно сказуемо</h3>\n<table>\n<thead>\n<tr class=\"header\">\n<th>Форма</th>\n<th>Пример</th>\n<th>Превод</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>-ysa / -yse</td>\n<td>Hastaysan, evde kal.</td>\n<td>Ако си болен, остани вкъщи.</td>\n</tr>\n<tr class=\"even\">\n<td></td>\n<td>Müsaitseniz, konuşalım.</td>\n<td>Ако сте свободни, да поговорим.</td>\n</tr>\n<tr class=\"odd\">\n<td></td>\n<td>Varsa, söyle.</td>\n<td>Ако има, кажи.</td>\n</tr>\n<tr class=\"even\">\n<td></td>\n<td>Yoksa, alalım.</td>\n<td>Ако няма, да купим.</td>\n</tr>\n</tbody>\n</table>\n<h3 id=\"граматика-13.5-полезни-условни-изрази\">Граматика 13.5 — Полезни\nусловни изрази</h3>\n<div class=\"line-block\">İstersen | ако искаш |<br />\nİstersen gidelim. | Ако искаш, да тръгваме. |<br />\nOlursa | ако стане |<br />\nMümkünse | ако е възможно |<br />\nGerekirse | ако се наложи |<br />\nYoksa | иначе |<br />\nAcele et, yoksa geç kalacaksın. | Бързай, иначе ще закъснееш. |<br />\nne olursa olsun | каквото и да става |<br />\nkim olursa olsun | който и да е |</div>\n<h3 id=\"защо-е-така-neden-böyle-12\">Защо е така · Neden böyle</h3>\n<p><strong>Защо условието се лепи след времето?</strong> Защото турската\nдума се строи отвътре навън: първо казваш <em>какво</em> действие\n(корен), после <em>кога</em> (време), после <em>при какво условие</em>\n(<code>-se</code>), накрая <em>кой</em> (лице). <code>gel-ir-se-n</code>\n= „идване-обикновено-ако-ти“. Редът никога не се мени.</p>\n<p><strong>Каква е разликата между <code>gelirse</code> и\n<code>geliyorsa</code>?</strong> - <code>Gelirse</code> — ако дойде (в\nбъдеще, все още не е ясно) - <code>Geliyorsa</code> — ако идва (сега, в\nмомента, проверявам факт)</p>\n<p>Второто често значи „ако е вярно, че…“:\n<code>Hasta**ysa**, doktora gitsin.</code> — Ако е болен (както казват),\nнека иде на лекар.</p>\n<p><strong>Защо резултатът при нереалното условие е в\n<code>-ırdı</code>?</strong> Защото <code>-ırdı</code> е „щеше да“ —\ngeniş zaman, преместено в миналото. Логиката е: „при други обстоятелства\nтова би било обичайното развитие“. Английският прави същото с\n<em>would</em>, българският — с „щеше да“.</p>\n<p><strong>Внимание с <code>-sa</code> без време — това е отделно\nнаклонение:</strong></p>\n<table>\n<colgroup>\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th>Форма</th>\n<th>Име</th>\n<th>Значение</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>gel<strong>ir</strong>se</td>\n<td>реално условие <em>(şart)</em></td>\n<td>ако дойде</td>\n</tr>\n<tr class=\"even\">\n<td>gel<strong>se</strong></td>\n<td>желателно-условно <em>(dilek-şart)</em></td>\n<td>да дойдеше, ако би дошъл</td>\n</tr>\n</tbody>\n</table>\n<p><code>gelse</code> изразява желание или отдалечена хипотеза, често с\n<code>keşke</code>: - Keşke gelse. — Де да дойдеше. - Bir gelse de\nkonuşsak. — Ех, да дойдеше, че да си поговорим.</p>\n<p>За обикновено условие в бъдещето <strong>винаги слагай\nвреме</strong>: <code>gelirse</code>, <code>gelecekse</code>. Това е\nчест източник на грешки, защото в българския и двете се превеждат с\n„ако“.</p>\n<h3 id=\"текст-за-четене-и-превод-okuma-ve-çeviri-metni-11\">Текст за\nчетене и превод · Okuma ve çeviri metni</h3>\n<p><strong>Hafta sonu planı — План за уикенда</strong></p>\n<blockquote>\n<p>— Hafta sonu ne yapıyorsun?</p>\n<p>— Henüz bilmiyorum. Hava güzel olursa, dağa gitmek istiyorum.</p>\n<p>— Yağmur yağarsa ne yapacaksın?</p>\n<p>— O zaman evde kalırım, film izlerim. Ama hava tutarsa kesinlikle\nçıkarım.</p>\n<p>— İstersen ben de gelirim. Uzun zamandır doğaya çıkmadım.</p>\n<p>— Tabii, çok iyi olur! Sabah erken kalkabilirsen, saat yedide yola\nçıkalım.</p>\n<p>— Yedi biraz erken ama olur. Keşke geçen hafta da gitseydik, hava\nharikaydı.</p>\n<p>— Biliyorum, ama işim vardı. Neyse, bu hafta telafi ederiz.</p>\n<p>— Bir şey lazım olursa haber ver. Yiyecek ben getirebilirim.</p>\n<p>— Süper. Sen sandviç yaparsan, ben termosla çay getiririm.</p>\n</blockquote>\n<p><em>Нови думи:</em> <code>henüz</code> — още;\n<code>hava tutmak</code> — времето се задържа; <code>doğa</code> —\nприрода; <code>yola çıkmak</code> — тръгвам на път; <code>harika</code>\n— прекрасен; <code>telafi etmek</code> — наваксвам;\n<code>haber vermek</code> — уведомявам; <code>yiyecek</code> — храна;\n<code>termos</code> — термос.</p>\n<p><strong>Въпроси:</strong></p>\n<ol type=\"1\">\n<li>Hava güzel olursa ne yapacak?</li>\n<li>Yağmur yağarsa ne yapacak?</li>\n<li>Saat kaçta yola çıkacaklar?</li>\n<li>Kim ne getirecek?</li>\n</ol>\n<h3 id=\"упражнения-alıştırmalar-12\">Упражнения · Alıştırmalar</h3>\n<p><strong>Упр. 13.1 — Постави в условна форма (geniş zaman +\n-se).</strong> <em>(Şart kipine çevirin.)</em></p>\n<ol type=\"1\">\n<li>gelmek (sen)</li>\n<li>yapmak (o)</li>\n<li>çalışmak (ben)</li>\n<li>gitmek (biz)</li>\n<li>olmak (o)</li>\n<li>istemek (sen)</li>\n</ol>\n<p><strong>Упр. 13.2 — Свържи условието с резултата.</strong>\n<em>(Şartla sonucu eşleştirin.)</em></p>\n<ol type=\"1\">\n<li>Yağmur yağarsa,</li>\n<li>Param olursa,</li>\n<li>Erken kalkarsan,</li>\n<li>Hasta olursan,</li>\n<li>Vaktim olursa,</li>\n</ol>\n<p>а) doktora git. б) evde kalırız. в) sana yardım ederim. г) yeni bir\naraba alacağım. д) treni kaçırmazsın.</p>\n<p><strong>Упр. 13.3 — Нереално условие.</strong> <em>(Gerçek dışı\nşart.)</em></p>\n<p>Пример: gelmek (sen) / görmek (sen) → Gelseydin, görürdün.</p>\n<ol type=\"1\">\n<li>erken kalkmak (ben) / treni kaçırmamak (ben)</li>\n<li>zengin olmak (ben) / dünyayı gezmek (ben)</li>\n<li>beni dinlemek (sen) / bu olmamak</li>\n<li>çalışmak (o) / kazanmak (o)</li>\n</ol>\n<p><strong>Упр. 13.4 — Попълни с <code>keşke</code>.</strong>\n<em>(„keşke“ ile tamamlayın.)</em></p>\n<ol type=\"1\">\n<li>___ gelseydin.</li>\n<li>___ param olsa.</li>\n<li>___ bunu yapmasaydım.</li>\n<li>___ daha çok çalışsaydım.</li>\n</ol>\n<p><strong>Упр. 13.5 — Условие с именно сказуемо.</strong> <em>(İsim\ncümlesiyle şart.)</em></p>\n<ol type=\"1\">\n<li>Hasta___ , evde kal.</li>\n<li>Müsait___ , konuşalım.</li>\n<li>Var___ , söyle.</li>\n<li>Yok___ , alalım.</li>\n<li>Meşgul___ , sonra ararım.</li>\n</ol>\n<p><strong>Упр. 13.6 — Преведи на турски.</strong> <em>(Türkçeye\nçevirin.)</em></p>\n<ol type=\"1\">\n<li>Ако дойдеш утре, ще ядем заедно.</li>\n<li>Ако вали, ще си останем вкъщи.</li>\n<li>Ако имах пари, щях да купя.</li>\n<li>Де да беше дошъл.</li>\n<li>Ако искаш, да тръгваме.</li>\n<li>Бързай, иначе ще закъснееш.</li>\n<li>Ако си болен, остани вкъщи.</li>\n<li>Ако бях станал рано, нямаше да изпусна влака.</li>\n</ol>\n<h3>Тематичен речник · Konu sözlüğü — Медицина · Sağlık (devam)</h3><table><thead><tr><th>Türkçe</th><th>Български</th></tr></thead><tbody><tr><td>tedavi</td><td>лечение</td></tr><tr><td>ameliyat</td><td>операция</td></tr><tr><td>rapor</td><td>болничен лист</td></tr><tr><td>tansiyon</td><td>кръвно налягане</td></tr><tr><td>nabız</td><td>пулс</td></tr><tr><td>hap</td><td>хапче</td></tr><tr><td>tablet</td><td>таблетка</td></tr><tr><td>merhem</td><td>мехлем</td></tr><tr><td>krem</td><td>крем</td></tr><tr><td>yara</td><td>рана</td></tr><tr><td>yara bandı</td><td>лейкопласт</td></tr><tr><td>sargı bezi</td><td>бинт</td></tr><tr><td>kırık</td><td>счупване; счупен</td></tr><tr><td>çıkık</td><td>изкълчване</td></tr><tr><td>karaciğer</td><td>черен дроб</td></tr><tr><td>akciğer</td><td>бял дроб</td></tr><tr><td>kemik</td><td>кост</td></tr><tr><td>kas</td><td>мускул</td></tr><tr><td>cilt</td><td>кожа</td></tr><tr><td>alerji</td><td>алергия</td></tr><tr><td>ateşlenmek</td><td>вдигам температура</td></tr><tr><td>bayılmak</td><td>припадам</td></tr><tr><td>iyileşmek</td><td>оздравявам</td></tr><tr><td>muayene etmek</td><td>преглеждам</td></tr></tbody></table><p><strong>Упр. 13.7 — Как е на турски?</strong> <em>(Türkçesi nedir?)</em></p><ol type=\"1\"><li>лечение</li><li>операция</li><li>кръвно налягане</li><li>хапче</li><li>рана</li><li>кост</li><li>алергия</li><li>оздравявам</li></ol><hr />\n<h2 id=\"урок-14-степенуване-и-сравнение-karşılaştırma\">УРОК 14 ·\nСтепенуване и сравнение · Karşılaştırma</h2>\n<h3 id=\"речник-sözlük-12\">Речник · Sözlük</h3>\n<table>\n<thead>\n<tr class=\"header\">\n<th>Турски</th>\n<th>Български</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>daha</td>\n<td>по-</td>\n</tr>\n<tr class=\"even\">\n<td>en</td>\n<td>най-</td>\n</tr>\n<tr class=\"odd\">\n<td>kadar</td>\n<td>колкото; до</td>\n</tr>\n<tr class=\"even\">\n<td>gibi</td>\n<td>като</td>\n</tr>\n<tr class=\"odd\">\n<td>aynı</td>\n<td>същият</td>\n</tr>\n<tr class=\"even\">\n<td>farklı</td>\n<td>различен</td>\n</tr>\n<tr class=\"odd\">\n<td>benzer</td>\n<td>подобен</td>\n</tr>\n<tr class=\"even\">\n<td>fark</td>\n<td>разлика</td>\n</tr>\n<tr class=\"odd\">\n<td>çoğu</td>\n<td>повечето</td>\n</tr>\n<tr class=\"even\">\n<td>birkaç</td>\n<td>няколко</td>\n</tr>\n<tr class=\"odd\">\n<td>hepsi</td>\n<td>всички</td>\n</tr>\n<tr class=\"even\">\n<td>hiçbiri</td>\n<td>нито един</td>\n</tr>\n<tr class=\"odd\">\n<td>bazıları</td>\n<td>някои</td>\n</tr>\n<tr class=\"even\">\n<td>daha az</td>\n<td>по-малко</td>\n</tr>\n<tr class=\"odd\">\n<td>daha çok</td>\n<td>повече</td>\n</tr>\n<tr class=\"even\">\n<td>en az</td>\n<td>най-малко</td>\n</tr>\n<tr class=\"odd\">\n<td>en çok</td>\n<td>най-много</td>\n</tr>\n<tr class=\"even\">\n<td>yüksek / alçak</td>\n<td>висок / нисък</td>\n</tr>\n<tr class=\"odd\">\n<td>ağır / hafif</td>\n<td>тежък / лек</td>\n</tr>\n<tr class=\"even\">\n<td>hızlı / yavaş</td>\n<td>бърз / бавен</td>\n</tr>\n</tbody>\n</table>\n<h3 id=\"граматика-14.1-сравнителна-степен-daha\">Граматика 14.1 —\nСравнителна степен: <code>daha</code></h3>\n<p>Слага се <strong>пред</strong> прилагателното, точно както\nбългарското „по-“:</p>\n<table>\n<thead>\n<tr class=\"header\">\n<th>Основна</th>\n<th>Сравнителна</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>büyük</td>\n<td><strong>daha</strong> büyük — по-голям</td>\n</tr>\n<tr class=\"even\">\n<td>güzel</td>\n<td><strong>daha</strong> güzel — по-красив</td>\n</tr>\n<tr class=\"odd\">\n<td>iyi</td>\n<td><strong>daha</strong> iyi — по-добър</td>\n</tr>\n<tr class=\"even\">\n<td>çok</td>\n<td><strong>daha</strong> çok — повече</td>\n</tr>\n</tbody>\n</table>\n<p><strong>Обектът на сравнение отива в изходен падеж\n(-dan/-den):</strong></p>\n<ul>\n<li>Ali, Ahmet’<strong>ten</strong> daha uzun. — Али е по-висок от\nАхмет.</li>\n<li>Bu ev, o ev<strong>den</strong> daha büyük. — Тази къща е по-голяма\nот онази.</li>\n<li>Ben sen<strong>den</strong> daha çok çalışıyorum. — Работя повече от\nтеб.</li>\n</ul>\n<p><strong><code>daha</code> може да се изпусне</strong> — изходният\nпадеж вече казва „по-“: <code>Ali, Ahmet'ten uzun.</code> = Али е\nпо-висок от Ахмет.</p>\n<h3 id=\"граматика-14.2-превъзходна-степен-en\">Граматика 14.2 —\nПревъзходна степен: <code>en</code></h3>\n<table>\n<thead>\n<tr class=\"header\">\n<th>Основна</th>\n<th>Превъзходна</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>büyük</td>\n<td><strong>en</strong> büyük — най-голям</td>\n</tr>\n<tr class=\"even\">\n<td>güzel</td>\n<td><strong>en</strong> güzel — най-красив</td>\n</tr>\n<tr class=\"odd\">\n<td>iyi</td>\n<td><strong>en</strong> iyi — най-добър</td>\n</tr>\n</tbody>\n</table>\n<p>Групата, в която сравняваш, е в местен падеж (<code>-da/-de</code>)\nили родителен:</p>\n<ul>\n<li>Sınıf<strong>ta</strong> en iyi öğrenci. — Най-добрият ученик в\nкласа.</li>\n<li>Dünya<strong>nın</strong> en yüksek dağı. — Най-високата планина в\nсвета.</li>\n<li>Bu, en güzel<strong>i</strong>. — Това е най-хубавото.</li>\n</ul>\n<h3 id=\"граматика-14.3-равенство-kadar\">Граматика 14.3 — Равенство:\n<code>kadar</code></h3>\n<p>Означава „колкото“, „като“:</p>\n<ul>\n<li>Ben sen<strong>in kadar</strong> çalışıyorum. — Работя колкото\nтеб.</li>\n<li>O, kardeşi <strong>kadar</strong> uzun. — Той е висок колкото брат\nси.</li>\n<li>Bu <strong>kadar</strong> yeter. — Толкова стига.</li>\n</ul>\n<p><strong>При местоименията — родителен падеж:</strong>\n<code>benim kadar</code>, <code>senin kadar</code>,\n<code>onun kadar</code>, <code>bizim kadar</code>,\n<code>sizin kadar</code>, <code>onlar kadar</code></p>\n<p><strong>При съществителните — основна форма:</strong>\n<code>Ali kadar</code> (колкото Али), <code>bir çocuk kadar</code>\n(колкото дете), <code>ev kadar</code> (голям колкото къща) — не\n<del>Ali’nin kadar</del>.</p>\n<p><strong>Отрицание:</strong> <code>O kadar iyi değil.</code> — Не е\nчак толкова добър.</p>\n<h3 id=\"граматика-14.4-прилика-gibi\">Граматика 14.4 — Прилика:\n<code>gibi</code></h3>\n<ul>\n<li>Baban <strong>gibi</strong> konuşuyorsun. — Говориш като баща\nси.</li>\n<li>Kar <strong>gibi</strong> beyaz. — Бял като сняг.</li>\n<li>Benim <strong>gibi</strong> düşünüyor. — Мисли като мен.</li>\n<li>Ne <strong>gibi</strong>? — Като какво? / Например?</li>\n</ul>\n<p><strong>Разлика <code>kadar</code> / <code>gibi</code>:</strong> -\n<code>senin kadar</code> — колкото теб (по количество, степен) -\n<code>senin gibi</code> — като теб (по начин, вид)</p>\n<h3 id=\"граматика-14.5-усилване-и-отслабване\">Граматика 14.5 — Усилване\nи отслабване</h3>\n<table>\n<thead>\n<tr class=\"header\">\n<th>Дума</th>\n<th>Значение</th>\n<th>Пример</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>çok</td>\n<td>много</td>\n<td>çok güzel</td>\n</tr>\n<tr class=\"even\">\n<td>pek</td>\n<td>доста, много</td>\n<td>pek iyi değil</td>\n</tr>\n<tr class=\"odd\">\n<td>oldukça</td>\n<td>доста</td>\n<td>oldukça büyük</td>\n</tr>\n<tr class=\"even\">\n<td>epey</td>\n<td>доста</td>\n<td>epey pahalı</td>\n</tr>\n<tr class=\"odd\">\n<td>biraz</td>\n<td>малко</td>\n<td>biraz yorgunum</td>\n</tr>\n<tr class=\"even\">\n<td>az</td>\n<td>малко</td>\n<td>az tuzlu</td>\n</tr>\n<tr class=\"odd\">\n<td>fazla</td>\n<td>прекалено</td>\n<td>fazla tuzlu</td>\n</tr>\n<tr class=\"even\">\n<td>en az</td>\n<td>поне</td>\n<td>en az beş kişi</td>\n</tr>\n<tr class=\"odd\">\n<td>neredeyse</td>\n<td>почти</td>\n<td>neredeyse bitti</td>\n</tr>\n<tr class=\"even\">\n<td>tam</td>\n<td>точно</td>\n<td>tam üç saat</td>\n</tr>\n</tbody>\n</table>\n<p><strong>Удвояване за усилване</strong> — типично турско: -\n<code>büyük büyük evler</code> — големи-преголеми къщи -\n<code>yavaş yavaş</code> — полека-лека - <code>tek tek</code> — един по\nедин - <code>bazı bazı</code> — от време на време</p>\n<h3 id=\"граматика-14.6-неправилни-сравнения\">Граматика 14.6 — Неправилни\nсравнения</h3>\n<p>Няколко думи менят формата си:</p>\n<div clas
