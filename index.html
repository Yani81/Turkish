1 0 10 30A15 15 0 0 1 32 6z\" stroke=\"#C9A227\"/></svg></span><figcaption><b>ay</b><span>луна</span></figcaption></figure>\n<figure class=\"pic tr-say\" data-tr=\"yıldız\" data-wiki=\"Star\"><span class=\"pic-img\"><svg viewBox=\"0 0 48 48\" xmlns=\"http://www.w3.org/2000/svg\" aria-hidden=\"true\" fill=\"none\" stroke=\"#17618F\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M24 6l5.5 12 13 1.5-9.5 9 2.5 13L24 35l-11.5 6.5 2.5-13-9.5-9 13-1.5z\" stroke=\"#C9A227\"/></svg></span><figcaption><b>yıldız</b><span>звезда</span></figcaption></figure>\n<figure class=\"pic tr-say\" data-tr=\"çiçek\" data-wiki=\"Flower\"><span class=\"pic-img\"><svg viewBox=\"0 0 48 48\" xmlns=\"http://www.w3.org/2000/svg\" aria-hidden=\"true\" fill=\"none\" stroke=\"#17618F\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"24\" cy=\"20\" r=\"4\"/><path d=\"M24 16c0-6-8-6-8 0s8 6 8 0zM24 24c0 6 8 6 8 0s-8-6-8 0zM20 20c-6 0-6 8 0 8s6-8 0-8zM28 20c6 0 6-8 0-8s-6 8 0 8z\"/><path d=\"M24 28v14\"/></svg></span><figcaption><b>çiçek</b><span>цвете</span></figcaption></figure>\n<figure class=\"pic tr-say\" data-tr=\"kedi\" data-wiki=\"Cat\"><span class=\"pic-img\"><svg viewBox=\"0 0 48 48\" xmlns=\"http://www.w3.org/2000/svg\" aria-hidden=\"true\" fill=\"none\" stroke=\"#17618F\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 18l-2-8 8 4M36 18l2-8-8 4\"/><path d=\"M24 14c8 0 12 6 12 12s-5 12-12 12-12-5-12-12 4-12 12-12z\"/><circle cx=\"19\" cy=\"25\" r=\"1.6\" fill=\"#0E2338\" stroke=\"none\"/><circle cx=\"29\" cy=\"25\" r=\"1.6\" fill=\"#0E2338\" stroke=\"none\"/><path d=\"M24 29v2M20 33h8M8 28h8M32 28h8\"/></svg></span><figcaption><b>kedi</b><span>котка</span></figcaption></figure>\n</div><h1 id=\"ключ-с-отговорите\">КЛЮЧ С ОТГОВОРИТЕ</h1>\n<h2 id=\"урок-1-1\">Урок 1</h2>\n<p><strong>1.1</strong></p>\n<ol type=\"1\">\n<li>öğretmenim</li>\n<li>doktorsun</li>\n<li>Bulgarız</li>\n<li>avukatsınız</li>\n<li>aşçıyım</li>\n<li>mühendissin</li>\n</ol>\n<p><strong>1.2</strong></p>\n<ol type=\"1\">\n<li>Ben öğrenci değilim.</li>\n<li>Sen Türk değilsin.</li>\n<li>O doktor değil.</li>\n<li>Biz mühendis değiliz.</li>\n<li>Siz öğretmen değilsiniz.</li>\n</ol>\n<p><strong>1.3</strong></p>\n<ol type=\"1\">\n<li>Sen öğrenci misin?</li>\n<li>O avukat mı?</li>\n<li>Siz Bulgar mısınız?</li>\n<li>Onlar Türk mü?</li>\n</ol>\n<p><strong>1.4</strong></p>\n<ol type=\"1\">\n<li>Merhaba, ben İvan’ım.</li>\n<li>Sen öğretmen misin?</li>\n<li>Hayır, ben öğretmen değilim, ben mühendisim.</li>\n<li>Memnun oldum.</li>\n<li>Teşekkür ederim, iyiyim.</li>\n</ol>\n<p><strong>1.5</strong> 1-в · 2-а · 3-б · 4-д · 5-г</p>\n<p><strong>1.6</strong></p>\n<ol type=\"1\">\n<li>Ben öğrenciyim.</li>\n<li>Sen doktorsun.</li>\n<li>O Türk.</li>\n<li>Biz mühendisiz.</li>\n<li>Siz avukatsınız.</li>\n</ol>\n<p><strong>1.7</strong> kimsin (или: sen kimsin) · oldum · müsün ·\ndeğilim · ım · yapıyorsun · im</p>\n<p><strong>1.8</strong> Примерни отговори: Benim adım … · Bulgarım,\nSofyalıyım. · Mühendisim. · İyiyim, teşekkür ederim.</p>\n<p><strong>1.9</strong></p>\n<ol type=\"1\">\n<li>Ne</li>\n<li>Nereden</li>\n<li>Kaç</li>\n<li>Kim</li>\n<li>Nereye</li>\n<li>Nasıl</li>\n<li>Ne zaman</li>\n<li>Neden</li>\n</ol>\n<p><strong>1.10</strong></p>\n<ol type=\"1\">\n<li>mühendisim</li>\n<li>aşçısın</li>\n<li>avukat</li>\n<li>doktoruz</li>\n<li>şoförsünüz</li>\n<li>öğrenciler</li>\n<li>Bulgarım</li>\n<li>Türksün</li>\n<li>öğretmeniz</li>\n<li>mühendissiniz</li>\n</ol>\n<p><strong>1.11</strong></p>\n<ol type=\"1\">\n<li>Evet, doktorum. / Hayır, doktor değilim.</li>\n<li>Evet, Türk. / Hayır, Türk değil.</li>\n<li>Evet, mühendisiz. / Hayır, mühendis değiliz.</li>\n<li>Evet, öğretmenler. / Hayır, öğretmen değiller.</li>\n<li>Evet, Bulgarım. / Hayır, Bulgar değilim.</li>\n<li>Evet, avukat. / Hayır, avukat değil.</li>\n</ol>\n<p><strong>1.12</strong></p>\n<ol type=\"1\">\n<li>Kaç yaşındasın?</li>\n<li>Otuz yaşındayım.</li>\n<li>Nerelisiniz?</li>\n<li>O doktor değil, mühendis.</li>\n<li>Siz öğretmen misiniz?</li>\n<li>Neden gelmiyorsun?</li>\n<li>Ne zaman geliyorsun?</li>\n<li>Adın ne?</li>\n</ol>\n<h2 id=\"урок-2-1\">Урок 2</h2>\n<p><strong>Въпроси към текста:</strong></p>\n<ol type=\"1\">\n<li>Odada iki sandalye var. ·</li>\n<li>Masada bir bilgisayar, kitaplar ve defterler var. ·</li>\n<li>Hayır, odada televizyon yok. ·</li>\n<li>Kalemler çantada.</li>\n</ol>\n<p><strong>2.1</strong> evler · kitaplar · öğretmenler · arabalar ·\ngözler · okullar · şehirler · çocuklar</p>\n<p><strong>2.2</strong> okulda · evde · sınıfta · masada · çantada ·\nİzmir’de · sokakta · şehirde</p>\n<p><strong>2.3</strong></p>\n<ol type=\"1\">\n<li>var</li>\n<li>yok</li>\n<li>var</li>\n<li>yok</li>\n</ol>\n<p><strong>2.4</strong></p>\n<ol type=\"1\">\n<li>Bu bir kitap.</li>\n<li>Şu ne?</li>\n<li>Odada iki masa var.</li>\n<li>Çantada kalem yok.</li>\n<li>Bu evler eski.</li>\n</ol>\n<p><strong>2.5</strong> parkta · bahçede · dolapta · sokakta · otobüste\n· hastanede · mutfakta · denizde</p>\n<p><strong>2.6</strong></p>\n<ol type=\"1\">\n<li>Evet, var.</li>\n<li>Hayır, yok.</li>\n<li>Evet, var.</li>\n<li>Hayır, yok.</li>\n</ol>\n<p><strong>2.7</strong></p>\n<ol type=\"1\">\n<li>büyük ev</li>\n<li>yeni kitap</li>\n<li>güzel şehir</li>\n<li>eski araba</li>\n</ol>\n<p><strong>2.8</strong> Примерен отговор: Odam küçük ama güzel. Odamda\nbir masa ve iki sandalye var. Masada kitaplar var. Odada televizyon yok.\nPencere büyük.</p>\n<p><strong>2.9</strong></p>\n<ol type=\"1\">\n<li>okullar → okullarda</li>\n<li>kitaplar → kitaplarda</li>\n<li>sokaklar → sokaklarda</li>\n<li>bahçeler → bahçelerde</li>\n<li>şehirler → şehirlerde</li>\n<li>arabalar → arabalarda</li>\n<li>sınıflar → sınıflarda</li>\n<li>öğrenciler → öğrencilerde</li>\n</ol>\n<p><strong>2.10</strong></p>\n<ol type=\"1\">\n<li>б</li>\n<li>г</li>\n<li>в</li>\n<li>д</li>\n<li>е</li>\n<li>ж</li>\n<li>з</li>\n<li>а</li>\n</ol>\n<p><strong>2.11</strong></p>\n<ol type=\"1\">\n<li>Odada televizyon yok.</li>\n<li>Bahçede ağaç var.</li>\n<li>Çantada bir kalem var.</li>\n<li>Sınıfta öğrenci yok.</li>\n<li>Evde bahçe var.</li>\n<li>Sokakta araba yok.</li>\n</ol>\n<p><strong>2.12</strong></p>\n<ol type=\"1\">\n<li>Benim bir arabam var.</li>\n<li>Senin kardeşin var mı?</li>\n<li>Onun parası yok.</li>\n<li>Bizim büyük bir evimiz var.</li>\n<li>Sizin zamanınız var mı?</li>\n<li>Onların çocukları yok.</li>\n</ol>\n<p><strong>2.13</strong></p>\n<ol type=\"1\">\n<li>eski bir ev</li>\n<li>iki yeni kitap</li>\n<li>güzel bir kız</li>\n<li>bu pahalı araba</li>\n<li>büyük bir şehir</li>\n<li>sıcak bir çay</li>\n</ol>\n<h2 id=\"урок-3-1\">Урок 3</h2>\n<p><strong>Въпроси към текста:</strong></p>\n<ol type=\"1\">\n<li>Hayır, büyük değil. ·</li>\n<li>Annesinin adı Fatma. ·</li>\n<li>İstanbul’da çalışıyor. ·</li>\n<li>Evet, bir kedileri var, adı Pamuk.</li>\n</ol>\n<p><strong>3.1</strong> evim · kitabım · arabam · annem · okulum · gözüm\n· arkadaşım · sokağım</p>\n<p><strong>3.2</strong></p>\n<ol type=\"1\">\n<li>evin</li>\n<li>arabası</li>\n<li>okulumuz</li>\n<li>kitabınız</li>\n<li>evleri</li>\n<li>annem</li>\n</ol>\n<p><strong>3.3</strong></p>\n<ol type=\"1\">\n<li>Ali’nin evi</li>\n<li>öğretmenin kitabı</li>\n<li>Türk kahvesi</li>\n<li>ders kitabı</li>\n<li>odanın kapısı</li>\n<li>okul bahçesi</li>\n</ol>\n<p><strong>3.4</strong></p>\n<ol type=\"1\">\n<li>Annem öğretmen.</li>\n<li>Bu kitap kimin?</li>\n<li>Bu Ahmet’in arabası.</li>\n<li>Bizim evimiz Sofya’da.</li>\n<li>Bir kardeşim var.</li>\n</ol>\n<p><strong>3.5</strong> evi · arabası · kitabı · annesi · okulu ·\narkadaşı</p>\n<p><strong>3.6</strong></p>\n<ol type=\"1\">\n<li>odanın kapısı</li>\n<li>ders kitabı</li>\n<li>Türk kahvesi</li>\n<li>babamın arabası</li>\n<li>öğretmenin adı</li>\n</ol>\n<p><strong>3.7</strong></p>\n<ol type=\"1\">\n<li>Benim kitabım.</li>\n<li>Ahmet’in arabası.</li>\n<li>Bizim defterlerimiz.</li>\n<li>Onların evi.</li>\n</ol>\n<p><strong>3.8</strong> Примерен отговор: Ailem büyük değil. Annem\nöğretmen, babam mühendis. Bir kardeşim var, o öğrenci. Bizim evimiz\nSofya’da. Bir de kedimiz var.</p>\n<p><strong>3.9</strong></p>\n<ol type=\"1\">\n<li>kitabım, kitabın, kitabı, kitabımız, kitabınız, kitapları</li>\n<li>arabam, araban, arabası, arabamız, arabanız, arabaları</li>\n<li>okulum, okulun, okulu, okulumuz, okulunuz, okulları</li>\n<li>annem, annen, annesi, annemiz, anneniz, anneleri</li>\n<li>arkadaşım, arkadaşın, arkadaşı, arkadaşımız, arkadaşınız,\narkadaşları</li>\n<li>gözüm, gözün, gözü, gözümüz, gözünüz, gözleri</li>\n</ol>\n<p><strong>3.10</strong></p>\n<ol type=\"1\">\n<li>evin kapısı</li>\n<li>ev kapısı</li>\n<li>çocuk odası</li>\n<li>çocuğun odası</li>\n<li>Türk kahvesi</li>\n<li>Ahmet’in kahvesi</li>\n<li>ders kitabı</li>\n<li>öğretmenin kitabı</li>\n</ol>\n<p><strong>3.11</strong></p>\n<ol type=\"1\">\n<li>evin kapısının anahtarı</li>\n<li>Türkiye’nin başkenti</li>\n<li>okulun bahçesinin kapısı</li>\n<li>öğretmenin odasının penceresi</li>\n</ol>\n<p><strong>3.12</strong></p>\n<ol type=\"1\">\n<li>Benim iki ablam var.</li>\n<li>Benim zamanım yok.</li>\n<li>Senin araban var mı?</li>\n<li>Onun büyük bir evi var.</li>\n<li>Bizim paramız yok.</li>\n<li>Sizin çocuğunuz var mı?</li>\n<li>Onların kedisi var.</li>\n<li>Benim kardeşim yok.</li>\n</ol>\n<p><strong>3.13</strong></p>\n<ol type=\"1\">\n<li>Ali’nin</li>\n<li>Odanın</li>\n<li>annem</li>\n<li>Türkiye’nin</li>\n<li>kardeşi</li>\n<li>evimiz</li>\n</ol>\n<h2 id=\"урок-4-1\">Урок 4</h2>\n<p><strong>Въпроси към текста:</strong></p>\n<ol type=\"1\">\n<li>Saat yedide evden çıkıyor. ·</li>\n<li>Otobüs durağına yürüyor. ·</li>\n<li>Ekmek ve süt alıyor. ·</li>\n<li>Annesiyle çay içiyorlar ve konuşuyorlar.</li>\n</ol>\n<p><strong>4.1</strong> okula · eve · İstanbul’a · sinemaya · arabaya ·\nişe</p>\n<p><strong>4.2</strong> evden · okuldan · marketten · Sofya’dan ·\nsınıftan · şehirden</p>\n<p><strong>4.3</strong> kitabı · arabayı · evi · Ali’yi · suyu ·\nöğretmeni</p>\n<p><strong>4.4</strong></p>\n<ol type=\"1\">\n<li>okula</li>\n<li>evden</li>\n<li>sınıfta</li>\n<li>Kitabı</li>\n<li>Anneme</li>\n</ol>\n<p><strong>4.5</strong></p>\n<ol type=\"1\">\n<li>İstanbul’a gidiyorum.</li>\n<li>Okuldan geliyorum.</li>\n<li>Ali’yi görüyorum.</li>\n<li>O evde.</li>\n<li>Marketten ekmek alıyorum.</li>\n</ol>\n<p><strong>4.6</strong></p>\n<ol type=\"1\">\n<li>okula</li>\n<li>işten</li>\n<li>Kitabı</li>\n<li>Ali’ye</li>\n<li>İstanbul’u</li>\n<li>Marketten</li>\n</ol>\n<p><strong>4.7</strong></p>\n<ol type=\"1\">\n<li>Okula gidiyorum.</li>\n<li>Evden geliyorum.</li>\n<li>Sofya’da oturuyorum.</li>\n<li>Ayşe’yi bekliyorum.</li>\n</ol>\n<p><strong>4.8</strong></p>\n<ol type=\"1\">\n<li>Nerede ·</li>\n<li>Nereye ·</li>\n<li>Nereden ·</li>\n<li>Nerede</li>\n</ol>\n<p><strong>4.9</strong></p>\n<ol type=\"1\">\n<li>Ben eve gidiyorum.</li>\n<li>O okuldan geliyor.</li>\n<li>Biz sinemaya gidiyoruz.</li>\n<li>Sen marketten ekmek alıyorsun.</li>\n</ol>\n<p><strong>4.10</strong></p>\n<ol type=\"1\">\n<li>filmi</li>\n<li>gazete</li>\n<li>Ali’yi</li>\n<li>Su</li>\n<li>kitabı</li>\n<li>Ekmek</li>\n<li>Arabasını</li>\n<li>Kahve</li>\n</ol>\n<p><strong>4.11</strong></p>\n<ol type=\"1\">\n<li>Otobüse</li>\n<li>Otobüsten</li>\n<li>Köpekten</li>\n<li>Derse</li>\n<li>Sana</li>\n<li>Öğretmene</li>\n<li>Seni</li>\n<li>Evden</li>\n</ol>\n<p><strong>4.12</strong></p>\n<ol type=\"1\">\n<li>evi, eve, evde, evden</li>\n<li>arabayı, arabaya, arabada, arabadan</li>\n<li>kitabı, kitaba, kitapta, kitaptan</li>\n<li>şehri, şehre, şehirde, şehirden</li>\n<li>sokağı, sokağa, sokakta, sokaktan</li>\n<li>anneyi, anneye, annede, anneden</li>\n</ol>\n<p><strong>4.13</strong></p>\n<ol type=\"1\">\n<li>O okuldan eve kitap getiriyor.</li>\n<li>Annem marketten bana çikolata aldı.</li>\n<li>Öğretmen öğrenciye soru sordu.</li>\n<li>Biz İstanbul’dan Ankara’ya trenle gidiyoruz.</li>\n</ol>\n<p><strong>4.14</strong></p>\n<ol type=\"1\">\n<li>Otobüsü bekliyorum.</li>\n<li>Seni seviyorum.</li>\n<li>Köpekten korkuyorum.</li>\n<li>Otobüse bindim.</li>\n<li>Otobüsten indim.</li>\n<li>Ona yardım ettim.</li>\n<li>Öğretmene sordum.</li>\n<li>Pencereden bakıyorum.</li>\n</ol>\n<h2 id=\"урок-5-1\">Урок 5</h2>\n<p><strong>Въпроси към текста:</strong></p>\n<ol type=\"1\">\n<li>Evde kitap okuyor. ·</li>\n<li>Deniz kafede. ·</li>\n<li>Çünkü çok çalışıyor, yarın sınavı var. ·</li>\n<li>Sinemaya gidiyorlar.</li>\n</ol>\n<p><strong>5.1</strong> geliyorum · okuyorum · çalışıyorum · bekliyorum\n· görüyorum · uyuyorum</p>\n<p><strong>5.2</strong></p>\n<ol type=\"1\">\n<li>yapıyorsun</li>\n<li>dinliyor</li>\n<li>öğreniyoruz</li>\n<li>gidiyorlar</li>\n<li>içiyorsunuz</li>\n</ol>\n<p><strong>5.3</strong> gelmiyorum · çalışmıyorsun · okumuyor ·\ngörmüyoruz · beklemiyorsunuz</p>\n<p><strong>5.4</strong></p>\n<ol type=\"1\">\n<li>Sen çalışıyor musun?</li>\n<li>O geliyor mu?</li>\n<li>Siz Türkçe konuşuyor musunuz?</li>\n</ol>\n<p><strong>5.5</strong></p>\n<ol type=\"1\">\n<li>Ne yapıyorsun?</li>\n<li>Kitap okuyorum.</li>\n<li>Bugün çalışmıyorum.</li>\n<li>Yarın geliyor musun?</li>\n<li>Okulda Türkçe öğreniyoruz.</li>\n</ol>\n<p><strong>5.6</strong> bekliyorum · okuyorsun · yiyor · diyoruz ·\nbaşlıyorsunuz · uyuyorlar</p>\n<p><strong>5.7</strong></p>\n<ol type=\"1\">\n<li>Hayır, çalışmıyorum.</li>\n<li>Hayır, gelmiyor.</li>\n<li>Hayır, konuşmuyorlar.</li>\n<li>Hayır, içmiyoruz.</li>\n</ol>\n<p><strong>5.8</strong></p>\n<ol type=\"1\">\n<li>Ben okulda Türkçe öğreniyorum.</li>\n<li>O her gün kahve içiyor.</li>\n<li>Biz akşam sinemaya gidiyoruz.</li>\n<li>Sen şimdi ne yapıyorsun?</li>\n</ol>\n<p><strong>5.9</strong> Примерен отговор: Şu anda evdeyim. Kitap\nokuyorum. Çay içiyorum. Müzik dinliyorum.</p>\n<p><strong>5.10</strong></p>\n<ol type=\"1\">\n<li>bekliyorum</li>\n<li>okuyorum</li>\n<li>başlıyorum</li>\n<li>söylüyorum</li>\n<li>anlıyorum</li>\n<li>yürüyorum</li>\n<li>yiyorum</li>\n<li>diyorum</li>\n</ol>\n<p><strong>5.11</strong></p>\n<ol type=\"1\">\n<li>çalışıyorum</li>\n<li>çalışıyorsun</li>\n<li>çalışıyor</li>\n<li>çalışıyoruz</li>\n<li>çalışıyorsunuz</li>\n<li>çalışıyorlar</li>\n</ol>\n<p><strong>5.12</strong></p>\n<ol type=\"1\">\n<li>Çalışmıyor musun?</li>\n<li>O anlamıyor mu?</li>\n<li>Siz gelmiyor musunuz?</li>\n<li>Onlar bilmiyorlar mı?</li>\n<li>Biz gitmiyor muyuz?</li>\n<li>Sen yemiyor musun?</li>\n</ol>\n<p><strong>5.13</strong></p>\n<ol type=\"1\">\n<li>Ben her sabah kahve içiyorum.</li>\n<li>O şimdi çalışıyor.</li>\n<li>Biz bazen sinemaya gidiyoruz.</li>\n<li>Sen sürekli geç kalıyorsun.</li>\n<li>Onlar çok iyi Türkçe konuşuyorlar.</li>\n</ol>\n<p><strong>5.14</strong></p>\n<ol type=\"1\">\n<li>а</li>\n<li>б</li>\n<li>в</li>\n<li>г</li>\n</ol>\n<p><strong>5.15</strong></p>\n<ol type=\"1\">\n<li>Şu anda ne yapıyorsun?</li>\n<li>Anlamıyorum.</li>\n<li>Bugün çalışmıyor musun?</li>\n<li>Sofya’da oturuyorum.</li>\n<li>Yarın geliyorum.</li>\n<li>Sürekli geç kalıyorsun!</li>\n<li>Bu yıl Türkçe öğreniyoruz.</li>\n<li>Bazen sinemaya gidiyoruz.</li>\n</ol>\n<h2 id=\"урок-6-1\">Урок 6</h2>\n<p><strong>Въпроси към текста:</strong></p>\n<ol type=\"1\">\n<li>Saat altı buçukta kalkıyor. ·</li>\n<li>Peynir, zeytin ve ekmek yiyor. ·</li>\n<li>Otobüsle gidiyor. ·</li>\n<li>Saat yedide eve dönüyor.</li>\n</ol>\n<p><strong>6.1</strong></p>\n<ol type=\"1\">\n<li>yedi</li>\n<li>on beş</li>\n<li>kırk iki</li>\n<li>yüz</li>\n<li>üç yüz altmış beş</li>\n<li>bin dokuz yüz doksan sekiz</li>\n</ol>\n<p><strong>6.2</strong></p>\n<ol type=\"1\">\n<li>Saat üç.</li>\n<li>Saat altı buçuk.</li>\n<li>Saat dokuzu çeyrek geçiyor.</li>\n<li>Saat on bire çeyrek var.</li>\n<li>Saat ikiyi yirmi geçiyor.</li>\n</ol>\n<p><strong>6.3</strong></p>\n<ol type=\"1\">\n<li>yedide</li>\n<li>sekize</li>\n<li>dördü</li>\n<li>bir buçukta</li>\n</ol>\n<p><strong>6.4</strong></p>\n<ol type=\"1\">\n<li>Saat kaç?</li>\n<li>Saat altı buçuk.</li>\n<li>Saat yedide kalkıyorum.</li>\n<li>Bugün pazartesi.</li>\n<li>Sınav beş Mart’ta.</li>\n</ol>\n<p><strong>6.5</strong></p>\n<ol type=\"1\">\n<li>Saat sekiz.</li>\n<li>Saat on bir buçuk.</li>\n<li>Saat biri çeyrek geçiyor.</li>\n<li>Saat altıya çeyrek var.</li>\n<li>Saat yediyi yirmi beş geçiyor.</li>\n<li>Saat on iki.</li>\n</ol>\n<p><strong>6.6</strong></p>\n<ol type=\"1\">\n<li>otuz beş ·</li>\n<li>yirmi sekiz ·</li>\n<li>yirmi beş ·</li>\n<li>kırk iki</li>\n</ol>\n<p><strong>6.7</strong></p>\n<ol type=\"1\">\n<li>Salı ·</li>\n<li>Perşembe ·</li>\n<li>Pazar ·</li>\n<li>Cuma</li>\n</ol>\n<p><strong>6.8</strong> Примерни отговори: Saat yedide kalkıyorum. ·\nSaat sekizde gidiyorum. · Saat on birde yatıyorum. · Bugün\npazartesi.</p>\n<p><strong>6.9</strong></p>\n<ol type=\"1\">\n<li>yirmi bir</li>\n<li>kırk yedi</li>\n<li>doksan dokuz</li>\n<li>yüz beş</li>\n<li>üç yüz seksen</li>\n<li>bin iki yüz elli</li>\n<li>on iki bin</li>\n<li>iki milyon</li>\n</ol>\n<p><strong>6.10</strong></p>\n<ol type=\"1\">\n<li>otuz beş</li>\n<li>otuz beş</li>\n<li>yetmiş iki</li>\n<li>yirmi</li>\n<li>yetmiş iki</li>\n<li>altmış bir</li>\n</ol>\n<p><strong>6.11</strong></p>\n<ol type=\"1\">\n<li>Saat iki.</li>\n<li>Saat dördü on geçiyor.</li>\n<li>Saat altıyı çeyrek geçiyor.</li>\n<li>Saat sekiz buçuk.</li>\n<li>Saat ona çeyrek var.</li>\n<li>Saat on ikiye on var.</li>\n<li>Saat biri yirmi beş geçiyor.</li>\n<li>Saat bire yirmi beş var.</li>\n</ol>\n<p><strong>6.12</strong></p>\n<ol type=\"1\">\n<li>dokuzda</li>\n<li>bir buçukta</li>\n<li>yedide</li>\n<li>on ikide</li>\n<li>sekizde</li>\n<li>üçte</li>\n</ol>\n<p><strong>6.13</strong></p>\n<ol type=\"1\">\n<li>beş Mart</li>\n<li>on iki Ağustos iki bin yirmi altı</li>\n<li>Sınav on Mayıs’ta.</li>\n<li>Bin dokuz yüz doksanda doğdum.</li>\n<li>Doğum günüm Ocak’ta.</li>\n</ol>\n<p><strong>6.14</strong></p>\n<ol type=\"1\">\n<li>Bugün … (напр. pazartesi).</li>\n<li>Saat … .</li>\n<li>Saat yedide kalkıyorum.</li>\n<li>Doğum günüm …’ta.</li>\n<li>Bir yılda on iki ay var.</li>\n<li>Bir haftada yedi gün var.</li>\n</ol>\n<h2 id=\"урок-7-1\">Урок 7</h2>\n<p><strong>Въпроси към текста:</strong></p>\n<ol type=\"1\">\n<li>Genellikle saat onda kalkar. ·</li>\n<li>Parkta koşar. ·</li>\n<li>Genellikle evde kalır, ailesiyle yemek yer ve kitap okur. ·</li>\n<li>Çünkü pazartesi sabahı erken kalkar.</li>\n</ol>\n<p><strong>7.1</strong> gelirim · çalışırım · okurum · bakarım · görürüm\n· otururum · yazarım · beklerim</p>\n<p><strong>7.2</strong></p>\n<ol type=\"1\">\n<li>Gelmem.</li>\n<li>Çalışmazsın.</li>\n<li>Okumaz.</li>\n<li>Yazmayız.</li>\n<li>Bakmazsınız.</li>\n</ol>\n<p><strong>7.3</strong></p>\n<ol type=\"1\">\n<li>okuyorum</li>\n<li>içerim</li>\n<li>kalkarım</li>\n<li>izliyorum</li>\n</ol>\n<p><strong>7.4</strong></p>\n<ol type=\"1\">\n<li>Her gün çay içerim.</li>\n<li>Sigara içmem.</li>\n<li>Kahve içer misin?</li>\n<li>Bankada çalışır.</li>\n<li>Bazen sinemaya gideriz.</li>\n</ol>\n<p><strong>7.5</strong> alırım · bilirsin · gelir · buluruz · verirsiniz\n· kalırlar</p>\n<p><strong>7.6</strong></p>\n<ol type=\"1\">\n<li>Çay içer misiniz?</li>\n<li>Bana yardım eder misiniz?</li>\n<li>Kapıyı kapatır mısın?</li>\n<li>Yarın gelir misiniz?</li>\n</ol>\n<p><strong>7.7</strong></p>\n<ol type=\"1\">\n<li>her zaman ·</li>\n<li>Bazen ·</li>\n<li>hiç ·</li>\n<li>genellikle</li>\n</ol>\n<p><strong>7.8</strong> Примерен отговор: Her sabah erken kalkarım.\nKahvaltıda çay içerim. İşe otobüsle giderim. Akşamları kitap okurum.\nHafta sonu geç kalkarım.</p>\n<p><strong>7.9</strong></p>\n<ol type=\"1\">\n<li>yazarım</li>\n<li>çalışırım</li>\n<li>okurum</li>\n<li>gelirim</li>\n<li>görürüm</li>\n<li>beklerim</li>\n<li>otururum</li>\n<li>içerim</li>\n<li>alırım</li>\n<li>bilirim</li>\n</ol>\n<p><strong>7.10</strong></p>\n<ol type=\"1\">\n<li>bakarım</li>\n<li>bakarsın</li>\n<li>bakar</li>\n<li>bakarız</li>\n<li>bakarsınız</li>\n<li>bakarlar</li>\n</ol>\n<p><strong>7.11</strong></p>\n<ol type=\"1\">\n<li>Gelmem.</li>\n<li>Çalışmazsın.</li>\n<li>Okumaz.</li>\n<li>Bakmayız.</li>\n<li>Yazmazsınız.</li>\n<li>Gitmezler.</li>\n<li>Almam.</li>\n<li>Bilmeyiz.</li>\n</ol>\n<p><strong>7.12</strong></p>\n<ol type=\"1\">\n<li>Kapıyı kapatır mısınız?</li>\n<li>Bana yardım eder misin?</li>\n<li>Suyu verir misiniz?</li>\n<li>Çay içer misin?</li>\n<li>Yarın gelir misiniz?</li>\n<li>Tren istasyonu nerede, söyler misiniz?</li>\n</ol>\n<p><strong>7.13</strong></p>\n<ol type=\"1\">\n<li>okuyorum</li>\n<li>okurum</li>\n<li>çalışıyorum</li>\n<li>çalışır</li>\n<li>geliyorum</li>\n<li>gelir</li>\n<li>içmem</li>\n<li>yapıyorsun</li>\n</ol>\n<p><strong>7.14</strong></p>\n<ol type=\"1\">\n<li>Her sabah çay içerim.</li>\n<li>Sigara içmem.</li>\n<li>Su yüz derecede kaynar.</li>\n<li>O çok çalışır.</li>\n<li>Pencereyi kapatır mısınız?</li>\n<li>Genellikle erken kalkarım.</li>\n<li>Bazen sinemaya giderim.</li>\n<li>Hiç geç kalmam.</li>\n</ol>\n<h2 id=\"урок-8-1\">Урок 8</h2>\n<p><strong>Въпроси към текста:</strong></p>\n<ol type=\"1\">\n<li>Antalya’ya gittiler. ·</li>\n<li>Bir hafta kaldılar. ·</li>\n<li>Erken kalktılar, kahvaltı yaptılar ve plaja indiler. ·</li>\n<li>Hava hep güneşliydi.</li>\n</ol>\n<p><strong>8.1</strong> geldim · gittim · okudum · yaptım · gördüm ·\nçalıştım · içtim · bekledim</p>\n<p><strong>8.2</strong></p>\n<ol type=\"1\">\n<li>oldun</li>\n<li>gittik</li>\n<li>okudu</li>\n<li>geldiler</li>\n<li>yaptınız</li>\n</ol>\n<p><strong>8.3</strong></p>\n<ol type=\"1\">\n<li>Gelmedim.</li>\n<li>Görmedin.</li>\n<li>Çalışmadı.</li>\n<li>Yapmadık.</li>\n<li>Okumadınız.</li>\n</ol>\n<p><strong>8.4</strong></p>\n<ol type=\"1\">\n<li>Dün okula gittim.</li>\n<li>Ali’yi görmedim.</li>\n<li>Dün ne yaptın?</li>\n<li>Hava güzeldi.</li>\n<li>Evdeydik.</li>\n</ol>\n<p><strong>8.5</strong></p>\n<ol type=\"1\">\n<li>yaptın</li>\n<li>gittik</li>\n<li>kalktı</li>\n<li>gördüler</li>\n<li>izlediniz</li>\n</ol>\n<p><strong>8.6</strong></p>\n<ol type=\"1\">\n<li>Okula gittim.</li>\n<li>Kitap okudun.</li>\n<li>Çay içti.</li>\n<li>Sinemaya gittik.</li>\n<li>Türkçe öğrendiniz.</li>\n</ol>\n<p><strong>8.7</strong></p>\n<ol type=\"1\">\n<li>-di (güzeldi) ·</li>\n<li>-dim (değildim) ·</li>\n<li>-dik (yorgunduk) ·</li>\n<li>-tu (yoktu) ·</li>\n<li>-ydi (öğrenciydi)</li>\n</ol>\n<p><strong>8.8</strong> Примерен отговор: Dün saat yedide kalktım.\nKahvaltı yaptım. İşe gittim. Öğlen arkadaşımla yemek yedim. Akşam eve\ndöndüm. Biraz televizyon izledim.</p>\n<p><strong>8.9</strong></p>\n<ol type=\"1\">\n<li>geldim</li>\n<li>gittim</li>\n<li>yaptım</li>\n<li>içtim</li>\n<li>okudum</li>\n<li>çalıştım</li>\n<li>gördüm</li>\n<li>baktım</li>\n<li>konuştum</li>\n<li>bekledim</li>\n</ol>\n<p><strong>8.10</strong></p>\n<ol type=\"1\">\n<li>yazdım</li>\n<li>yazdın</li>\n<li>yazdı</li>\n<li>yazdık</li>\n<li>yazdınız</li>\n<li>yazdılar</li>\n</ol>\n<p><strong>8.11</strong></p>\n<ol type=\"1\">\n<li>Okula gittim.</li>\n<li>Kitap okudun.</li>\n<li>Çay içti.</li>\n<li>Sinemaya gittik.</li>\n<li>Türkçe öğrendiniz.</li>\n<li>Erken kalktılar.</li>\n<li>Ali’yi bekledim.</li>\n<li>Yemek yaptın.</li>\n</ol>\n<p><strong>8.12</strong></p>\n<ol type=\"1\">\n<li>öğrenciydim</li>\n<li>hastaydın</li>\n<li>yorgundu</li>\n<li>evdeydik</li>\n<li>güzeldi</li>\n<li>yoktu</li>\n<li>vardı</li>\n<li>değildiniz</li>\n</ol>\n<p><strong>8.13</strong></p>\n<ol type=\"1\">\n<li>Gittin mi? — Hayır, gitmedim.</li>\n<li>Gördü mü? — Hayır, görmedi.</li>\n<li>Yaptık mı? — Hayır, yapmadık.</li>\n<li>Okudunuz mu? — Hayır, okumadık.</li>\n<li>Çalıştılar mı? — Hayır, çalışmadılar.</li>\n</ol>\n<p><strong>8.14</strong></p>\n<ol type=\"1\">\n<li>Dün okula gittim.</li>\n<li>Onu görmedim.</li>\n<li>Dün akşam ne yaptın?</li>\n<li>Hava çok güzeldi.</li>\n<li>Yorgunduk.</li>\n<li>Odada kimse yoktu.</li>\n<li>İki gün önce İstanbul’daydım.</li>\n<li>Az önce geldim.</li>\n</ol>\n<h2 id=\"урок-9-1\">Урок 9</h2>\n<p><strong>Въпроси към текста:</strong></p>\n<ol type=\"1\">\n<li>Haziranda mezun olacak. ·</li>\n<li>Yunanistan’a gidecekler. ·</li>\n<li>Çünkü orada daha çok iş var. ·</li>\n<li>Kendi şirketini kuracak.</li>\n</ol>\n<p><strong>9.1</strong> geleceğim · yapacağım · okuyacağım · gideceğim ·\nbekleyeceğim · göreceğim</p>\n<p><strong>9.2</strong></p>\n<ol type=\"1\">\n<li>yapacaksın</li>\n<li>gideceğiz</li>\n<li>gelecek</li>\n<li>alacaklar</li>\n<li>bekleyeceksiniz</li>\n</ol>\n<p><strong>9.3</strong></p>\n<ol type=\"1\">\n<li>Gelmeyeceğim.</li>\n<li>Yapmayacaksın.</li>\n<li>Gitmeyecek.</li>\n<li>Okumayacağız.</li>\n<li>Beklemeyeceksiniz.</li>\n</ol>\n<p><strong>9.4</strong></p>\n<ol type=\"1\">\n<li>Yarın İstanbul’a gideceğim.</li>\n<li>Gelmeyeceğim.</li>\n<li>Yarın ne yapacaksın?</li>\n<li>Biletleri gelecek hafta alacağız.</li>\n<li>Yarın görüşecek miyiz?</li>\n</ol>\n<p><strong>9.5</strong></p>\n<ol type=\"1\">\n<li>olacak</li>\n<li>taşınacağız</li>\n<li>gelecek</li>\n<li>alacaklar</li>\n<li>yazacağım</li>\n</ol>\n<p><strong>9.6</strong></p>\n<ol type=\"1\">\n<li>Okula gideceğim.</li>\n<li>Kitap okuyacaksın.</li>\n<li>İş arayacak.</li>\n<li>Tatile çıkacağız.</li>\n<li>Erken yatacaksınız.</li>\n</ol>\n<p><strong>9.7</strong></p>\n<ol type=\"1\">\n<li>Hayır, gelmeyeceğim.</li>\n<li>Hayır, yapmayacak.</li>\n<li>Hayır, çıkmayacaklar.</li>\n<li>Hayır, etmeyeceğiz.</li>\n</ol>\n<p><strong>9.8</strong> Примерен отговор: Gelecek yıl Türkçe kursuna\nbaşlayacağım. Yeni bir iş arayacağım. Ailemle tatile gideceğim. Daha çok\nkitap okuyacağım. Spor yapacağım.</p>\n<p><strong>9.9</strong></p>\n<ol type=\"1\">\n<li>geleceğim, geleceğiz</li>\n<li>yapacağım, yapacağız</li>\n<li>okuyacağım, okuyacağız</li>\n<li>bekleyeceğim, bekleyeceğiz</li>\n<li>gideceğim, gideceğiz</li>\n<li>göreceğim, göreceğiz</li>\n<li>başlayacağım, başlayacağız</li>\n<li>yürüyeceğim, yürüyeceğiz</li>\n</ol>\n<p><strong>9.10</strong></p>\n<ol type=\"1\">\n<li>alacağım</li>\n<li>alacaksın</li>\n<li>alacak</li>\n<li>alacağız</li>\n<li>alacaksınız</li>\n<li>alacaklar</li>\n</ol>\n<p><strong>9.11</strong></p>\n<ol type=\"1\">\n<li>Gelmeyeceğim.</li>\n<li>Yapmayacaksın.</li>\n<li>Okumayacak.</li>\n<li>Beklemeyeceğiz.</li>\n<li>Gitmeyeceksiniz.</li>\n<li>Başlamayacaklar.</li>\n</ol>\n<p><strong>9.12</strong></p>\n<ol type=\"1\">\n<li>Yarın gelecek misin?</li>\n<li>O bu işi yapacak mı?</li>\n<li>Biz tatile çıkacak mıyız?</li>\n<li>Siz bize yardım edecek misiniz?</li>\n<li>Onlar bilet alacaklar mı?</li>\n</ol>\n<p><strong>9.13</strong></p>\n<ol type=\"1\">\n<li>olacak</li>\n<li>geliyorum</li>\n<li>taşınacağım</li>\n<li>gidiyoruz</li>\n<li>gideceğim</li>\n</ol>\n<p><strong>9.14</strong></p>\n<ol type=\"1\">\n<li>Yarın İstanbul’a gideceğim.</li>\n<li>Gelmeyeceğim.</li>\n<li>Gelecek hafta ne yapacaksın?</li>\n<li>Yarın yağmur yağacak.</li>\n<li>İki gün sonra döneceğim.</li>\n<li>Bize yardım edecek misiniz?</li>\n<li>Cumartesi çalışmayacağız.</li>\n<li>Yakında yeni bir işe başlayacağım.</li>\n</ol>\n<h2 id=\"урок-10-1\">Урок 10</h2>\n<p><strong>Въпроси към текста:</strong></p>\n<ol type=\"1\">\n<li>Mercimek çorbası ve İskender kebap istiyor. ·</li>\n<li>Ayran alıyor. ·</li>\n<li>Sonra karar verecek. ·</li>\n<li>Hesabı istiyor.</li>\n</ol>\n<p><strong>10.1</strong></p>\n<ol type=\"1\">\n<li>Gel! / Gelin!</li>\n<li>Bak! / Bakın!</li>\n<li>Otur! / Oturun!</li>\n<li>Bekle! / Bekleyin!</li>\n<li>Dinle! / Dinleyin!</li>\n</ol>\n<p><strong>10.2</strong></p>\n<ol type=\"1\">\n<li>İstanbul’a gitmek istiyorum.</li>\n<li>Türkçe öğrenmek istiyorum.</li>\n<li>Bugün çalışmak istemiyorum.</li>\n<li>Ne yemek istiyorsun?</li>\n</ol>\n<p><strong>10.3</strong></p>\n<ol type=\"1\">\n<li>gelebilirim</li>\n<li>konuşabiliyor musun (или: konuşabilir misin)</li>\n<li>gelemez</li>\n<li>yardım edebiliriz</li>\n</ol>\n<p><strong>10.4</strong></p>\n<ol type=\"1\">\n<li>Arkadaşımla</li>\n<li>için</li>\n<li>sonra</li>\n<li>önce</li>\n</ol>\n<p><strong>10.5</strong></p>\n<ol type=\"1\">\n<li>Lütfen oturun.</li>\n<li>Unutma!</li>\n<li>Burada oturabilir miyim?</li>\n<li>Bugün gelemem.</li>\n<li>Arkadaşımla sinemaya gidiyorum.</li>\n</ol>\n<p><strong>10.6</strong></p>\n<ol type=\"1\">\n<li>Gelme!</li>\n<li>Unutma!</li>\n<li>Konuşmayın!</li>\n<li>Geç kalmayın!</li>\n<li>Bekleme!</li>\n</ol>\n<p><strong>10.7</strong></p>\n<ol type=\"1\">\n<li>yardım edebilirim</li>\n<li>anlayamıyorum</li>\n<li>içemezsiniz</li>\n<li>açabilir</li>\n</ol>\n<p><strong>10.8</strong></p>\n<ol type=\"1\">\n<li>Merhaba / İyi günler.</li>\n<li>Teşekkür ederim.</li>\n<li>Hesabı alabilir miyim, lütfen?</li>\n<li>Hoşça kalın. / Görüşürüz.</li>\n<li>Efendim? / Tekrar eder misiniz, lütfen?</li>\n</ol>\n<p><strong>10.9</strong> Примерен отговор: — Buyurun, ne alırsınız? —\nBir çay lütfen. — Şekerli mi? — Sade olsun. — Başka bir şey? — Hayır,\nteşekkür ederim.</p>\n<hr />\n<h1 id=\"приложения\">ПРИЛОЖЕНИЯ</h1>\n<h2 id=\"приложение-1-гласната-хармония-накратко\">Приложение 1 — Гласната\nхармония накратко</h2>\n<table>\n<thead>\n<tr class=\"header\">\n<th>Последна гласна</th>\n<th>2-фолд (a/e)</th>\n<th>4-фолд (ı/i/u/ü)</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>a, ı</td>\n<td>a</td>\n<td>ı</td>\n</tr>\n<tr class=\"even\">\n<td>e, i</td>\n<td>e</td>\n<td>i</td>\n</tr>\n<tr class=\"odd\">\n<td>o, u</td>\n<td>a</td>\n<td>u</td>\n</tr>\n<tr class=\"even\">\n<td>ö, ü</td>\n<td>e</td>\n<td>ü</td>\n</tr>\n</tbody>\n</table>\n<h2 id=\"приложение-2-всички-времена-на-gelmek-ben-форма\">Приложение 2 —\nВсички времена на <code>gelmek</code> (ben-форма)</h2>\n<table>\n<thead>\n<tr class=\"header\">\n<th>Време</th>\n<th>Форма</th>\n<th>Превод</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Сегашно продълж.</td>\n<td>geliyorum</td>\n<td>идвам (сега)</td>\n</tr>\n<tr class=\"even\">\n<td>Широко сегашно</td>\n<td>gelirim</td>\n<td>идвам (обикновено)</td>\n</tr>\n<tr class=\"odd\">\n<td>Минало определено</td>\n<td>geldim</td>\n<td>дойдох</td>\n</tr>\n<tr class=\"even\">\n<td>Бъдеще</td>\n<td>geleceğim</td>\n<td>ще дойда</td>\n</tr>\n<tr class=\"odd\">\n<td>Възможност</td>\n<td>gelebilirim</td>\n<td>мога да дойда</td>\n</tr>\n<tr class=\"even\">\n<td>Желание</td>\n<td>gelmek istiyorum</td>\n<td>искам да дойда</td>\n</tr>\n</tbody>\n</table>\n<h2 id=\"приложение-3-съгласни-промени\">Приложение 3 — Съгласни\nпромени</h2>\n<p><strong>Твърди съгласни (fıstıkçı şahap): ç, f, h, k, p, s, ş,\nt</strong> → окончанието започва с <code>t</code> вместо <code>d</code>:\n<code>-ta/-te</code>, <code>-tan/-ten</code>, <code>-tı/-ti</code></p>\n<p><strong>Омекотяване пред гласна:</strong> p→b · ç→c · t→d · k→ğ (k→g\nпри едносрични)</p>\n<h2 id=\"приложение-4-речник-на-глаголите-от-част-1\">Приложение 4 —\nРечник на глаголите от Част 1</h2>\n<p>almak (вземам) · bakmak (гледам) · başlamak (започвам) · beklemek\n(чакам) · bilmek (зная) · bitirmek (завършвам) · bulmak (намирам) ·\nçalışmak (работя) · demek (казвам) · dinlemek (слушам) · dönmek (връщам\nсе) · gelmek (идвам) · gezmek (разхождам се) · gitmek (отивам) · görmek\n(виждам) · içmek (пия) · istemek (искам) · izlemek (гледам) · kalkmak\n(ставам) · kalmak (оставам) · konuşmak (говоря) · okumak (чета) ·\noturmak (седя, живея) · sevmek (обичам) · unutmak (забравям) · uyumak\n(спя) · vermek (давам) · yapmak (правя) · yazmak (пиша) · yemek (ям) ·\nyürümek (вървя)</p>\n<hr />\n<p><em>Край на Част 1 (ниво A1).</em> <em>Следва Част 2 (A2): минало\nнеопределено време (-mış), условно наклонение, сравнение, деепричастия,\n„преди да / след като“, страдателен залог, по-дълги текстове.</em></p>\n<p><strong>10.10</strong></p>\n<ol type=\"1\">\n<li>Bak! Baksın! Bakın! Bakmasın!</li>\n<li>Otur! Otursun! Oturun! Oturmasın!</li>\n<li>Bekle! Beklesin! Bekleyin! Beklemesin!</li>\n<li>Git! Gitsin! Gidin! Gitmesin!</li>\n<li>Konuş! Konuşsun! Konuşun! Konuşmasın!</li>\n</ol>\n<p><strong>10.11</strong></p>\n<ol type=\"1\">\n<li>yapayım</li>\n<li>gidelim</li>\n<li>edeyim</li>\n<li>içelim</li>\n<li>buluşalım</li>\n<li>sorayım</li>\n</ol>\n<p><strong>10.12</strong></p>\n<ol type=\"1\">\n<li>edebilirim</li>\n<li>anlayamıyorum</li>\n<li>gelemedim</li>\n<li>içemezsiniz</li>\n<li>gelebileceğim</li>\n<li>konuşabiliyorum</li>\n</ol>\n<p><strong>10.13</strong></p>\n<ol type=\"1\">\n<li>Arkadaşımla</li>\n<li>için</li>\n<li>Yemekten önce</li>\n<li>Dersten sonra</li>\n<li>kadar</li>\n<li>otobüsle</li>\n<li>için</li>\n<li>önce</li>\n</ol>\n<p><strong>10.14</strong></p>\n<ol type=\"1\">\n<li>Merhaba. / İyi günler.</li>\n<li>Kolay gelsin.</li>\n<li>Geçmiş olsun.</li>\n<li>Afiyet olsun.</li>\n<li>Hoş geldiniz.</li>\n<li>Güle güle kullan.</li>\n</ol>\n<p><strong>10.15</strong></p>\n<ol type=\"1\">\n<li>Lütfen oturun.</li>\n<li>Unutma!</li>\n<li>Sinemaya gidelim.</li>\n<li>Sana yardım edeyim mi?</li>\n<li>Burada oturabilir miyim?</li>\n<li>Bugün gelemem.</li>\n<li>Arkadaşımla gidiyorum.</li>\n<li>Yemekten önce ellerini yıka.</li>\n</ol>\n<h2 id=\"глава-за-падежите\">Глава за падежите</h2>\n<p><strong>П.1</strong></p>\n<ol type=\"1\">\n<li>okulu, okula, okulda, okuldan, okulun</li>\n<li>arabayı, arabaya, arabada, arabadan, arabanın</li>\n<li>kitabı, kitaba, kitapta, kitaptan, kitabın</li>\n<li>sokağı, sokağa, sokakta, sokaktan, sokağın</li>\n<li>öğrenciyi, öğrenciye, öğrencide, öğrenciden, öğrencinin</li>\n<li>gözü, göze, gözde, gözden, gözün</li>\n<li>şehri, şehre, şehirde, şehirden, şehrin</li>\n<li>kapıyı, kapıya, kapıda, kapıdan, kapının</li>\n</ol>\n<p><strong>П.2</strong></p>\n<ol type=\"1\">\n<li>İstanbul’a</li>\n<li>evden</li>\n<li>sınıfta</li>\n<li>Kitabı</li>\n<li>Ali’nin</li>\n<li>Okuldan</li>\n<li>Öğretmene</li>\n<li>Köpekten</li>\n</ol>\n<p><strong>П.3</strong></p>\n<ol type=\"1\">\n<li>filmi</li>\n<li>gazete</li>\n<li>kitabı</li>\n<li>Su</li>\n<li>Ali’yi</li>\n<li>Türkçe</li>\n<li>Arabanı</li>\n<li>Ekmek</li>\n</ol>\n<p><strong>П.4</strong></p>\n<ol type=\"1\">\n<li>Otobüse</li>\n<li>Otobüsten</li>\n<li>Sana</li>\n<li>Köpekten</li>\n<li>Müziği</li>\n<li>Derse</li>\n<li>Evden</li>\n<li>Seni</li>\n<li>Ona</li>\n<li>müzikten</li>\n</ol>\n<p><strong>П.5</strong></p>\n<ol type=\"1\">\n<li>bana</li>\n<li>sana</li>\n<li>ona</li>\n<li>bize</li>\n<li>size</li>\n<li>onlara</li>\n</ol>\n<p><strong>П.6</strong></p>\n<ol type=\"1\">\n<li>kitabımı, kitabıma, kitabımda, kitabımdan</li>\n<li>arabasını, arabasına, arabasında, arabasından</li>\n<li>okulumuzu, okulumuza, okulumuzda, okulumuzdan</li>\n<li>evini, evine, evinde, evinden</li>\n<li>annemi, anneme, annemde, annemden</li>\n<li>odasını, odasına, odasında, odasından</li>\n</ol>\n<p><strong>П.7</strong></p>\n<ol type=\"1\">\n<li>Bana verdi.</li>\n<li>Otobüse bindim.</li>\n<li>Kitabı okudum.</li>\n<li>İstanbul’da yaşıyorum.</li>\n<li>Sana söyledim.</li>\n<li>Evimden çıktım.</li>\n</ol>\n<p><strong>П.8</strong></p>\n<ol type=\"1\">\n<li>İstanbul’a gidiyorum.</li>\n<li>Okuldan geliyorum.</li>\n<li>Evdeyim.</li>\n<li>Kitabı okudum.</li>\n<li>Ona para verdim.</li>\n<li>Köpekten korkuyorum.</li>\n<li>Yüz liraya aldım.</li>\n<li>Pencereden baktım.</li>\n<li>Soğuktan hastalandım.</li>\n<li>Benden uzunsun.</li>\n</ol>\n<h1 id=\"ключ-с-отговорите-a2\">КЛЮЧ С ОТГОВОРИТЕ · A2</h1>\n<h2 id=\"урок-11-1\">Урок 11</h2>\n<p><strong>11.1</strong></p>\n<ol type=\"1\">\n<li>gelmiş</li>\n<li>yapmışsın</li>\n<li>gitmişler</li>\n<li>okumuşum</li>\n<li>içmiş</li>\n<li>çalışmışız</li>\n<li>görmüşsünüz</li>\n<li>beklemiş</li>\n</ol>\n<p><strong>11.2</strong></p>\n<ol type=\"1\">\n<li>gördüm</li>\n<li>duydum</li>\n<li>yağmış</li>\n<li>gittim</li>\n<li>unutmuşum</li>\n<li>yaptım</li>\n</ol>\n<p><strong>11.3</strong></p>\n<ol type=\"1\">\n<li>doktormuş</li>\n<li>Hastaymış</li>\n<li>Evdeymiş</li>\n<li>güzelmiş</li>\n<li>yokmuş</li>\n<li>varmış</li>\n</ol>\n<p><strong>11.4</strong></p>\n<ol type=\"1\">\n<li>geliyormuş</li>\n<li>gelecekmiş</li>\n<li>gelirmiş</li>\n<li>çalışıyormuşsun</li>\n<li>yapacaklarmış</li>\n</ol>\n<p><strong>11.5</strong></p>\n<ol type=\"1\">\n<li>Gelmemiş.</li>\n<li>Yapmamışsın.</li>\n<li>Gitmemişler.</li>\n<li>Okumamışım.</li>\n<li>Görmemişiz.</li>\n</ol>\n<p><strong>11.6</strong></p>\n<ol type=\"1\">\n<li>Ali dün gelmiş.</li>\n<li>Yağmur yağmış.</li>\n<li>Anahtarı unutmuşum.</li>\n<li>Yarın gelecekmiş.</li>\n<li>Meğer haklıymışsın.</li>\n<li>Bir varmış, bir yokmuş.</li>\n<li>Ayşe evlenmiş.</li>\n<li>Eskiden çok sigara içermiş.</li>\n</ol>\n<h2 id=\"урок-12-1\">Урок 12</h2>\n<p><strong>12.1</strong></p>\n<ol type=\"1\">\n<li>gitmeliyim</li>\n<li>çalışmalısın</li>\n<li>dinlenmeli</li>\n<li>beklemeliyiz</li>\n<li>yapmalısınız</li>\n<li>gelmeliler</li>\n</ol>\n<p><strong>12.2</strong></p>\n<ol type=\"1\">\n<li>Gitmemeliyim.</li>\n<li>Yapmamalısın.</li>\n<li>İçmemeli.</li>\n<li>Beklememeliyiz.</li>\n<li>Konuşmamalısınız.</li>\n</ol>\n<p><strong>12.3</strong></p>\n<ol type=\"1\">\n<li>Çalışman lazım.</li>\n<li>Dinlenmesi lazım.</li>\n<li>Beklememiz lazım.</li>\n<li>Gitmeniz lazım.</li>\n<li>Yapmam lazım.</li>\n</ol>\n<p><strong>12.4</strong></p>\n<ol type=\"1\">\n<li>yapmalı</li>\n<li>zorundayım</li>\n<li>lazım</li>\n<li>içmemelisin</li>\n<li>zorundayım</li>\n</ol>\n<p><strong>12.5</strong></p>\n<ol type=\"1\">\n<li>Girebilir miyim?</li>\n<li>Sigara içmek yasak.</li>\n<li>Burada park etmek serbest.</li>\n<li>Girmeyin!</li>\n<li>Burada oturabilir miyim?</li>\n</ol>\n<p><strong>12.6</strong></p>\n<ol type=\"1\">\n<li>Daha çok çalışmalıyım.</li>\n<li>Sigara içmemelisin.</li>\n<li>Gitmem lazım.</li>\n<li>Çalışmak zorundayım.</li>\n<li>Gitmek zorunda değilim.</li>\n<li>Ne yapmalıyım?</li>\n<li>Dinlenmen lazım.</li>\n<li>Gitmek zorunda kaldım.</li>\n</ol>\n<h2 id=\"урок-13-1\">Урок 13</h2>\n<p><strong>13.1</strong></p>\n<ol type=\"1\">\n<li>gelirsen</li>\n<li>yaparsa</li>\n<li>çalışırsam</li>\n<li>gidersek</li>\n<li>olursa</li>\n<li>istersen</li>\n</ol>\n<p><strong>13.2</strong></p>\n<ol type=\"1\">\n<li>б</li>\n<li>г</li>\n<li>д</li>\n<li>а</li>\n<li>в</li>\n</ol>\n<p><strong>13.3</strong></p>\n<ol type=\"1\">\n<li>Erken kalksaydım, treni kaçırmazdım.</li>\n<li>Zengin olsaydım, dünyayı gezerdim.</li>\n<li>Beni dinleseydin, bu olmazdı.</li>\n<li>Çalışsaydı, kazanırdı.</li>\n</ol>\n<p><strong>13.4</strong></p>\n<ol type=\"1\">\n<li>Keşke</li>\n<li>Keşke</li>\n<li>Keşke</li>\n<li>Keşke</li>\n</ol>\n<p><strong>13.5</strong></p>\n<ol type=\"1\">\n<li>Hastaysan</li>\n<li>Müsaitseniz</li>\n<li>Varsa</li>\n<li>Yoksa</li>\n<li>Meşgulsen</li>\n</ol>\n<p><strong>13.6</strong></p>\n<ol type=\"1\">\n<li>Yarın gelirsen, birlikte yemek yeriz.</li>\n<li>Yağmur yağarsa, evde kalırız.</li>\n<li>Param olsaydı, alırdım.</li>\n<li>Keşke gelseydin.</li>\n<li>İstersen gidelim.</li>\n<li>Acele et, yoksa geç kalacaksın.</li>\n<li>Hastaysan, evde kal.</li>\n<li>Erken kalksaydım, treni kaçırmazdım.</li>\n</ol>\n<h2 id=\"урок-14-1\">Урок 14</h2>\n<p><strong>14.1</strong></p>\n<ol type=\"1\">\n<li>Bu ev, o evden daha büyük.</li>\n<li>İstanbul, Ankara’dan daha kalabalık.</li>\n<li>Ben senden daha gencim.</li>\n<li>Tren, otobüsten daha hızlı.</li>\n<li>Bu kitap, o kitaptan daha ilginç.</li>\n</ol>\n<p><strong>14.2</strong></p>\n<ol type=\"1\">\n<li>Sınıfın en iyi öğrencisi.</li>\n<li>Dünyanın en yüksek dağı.</li>\n<li>Türkiye’nin en büyük şehri.</li>\n<li>Ailenin en küçük çocuğu.</li>\n</ol>\n<p><strong>14.3</strong></p>\n<ol type=\"1\">\n<li>kadar</li>\n<li>gibi</li>\n<li>gibi</li>\n<li>kadar</li>\n<li>gibi</li>\n</ol>\n<p><strong>14.4</strong></p>\n<ol type=\"1\">\n<li>Biraz</li>\n<li>fazla</li>\n<li>neredeyse</li>\n<li>en az</li>\n<li>çok</li>\n</ol>\n<p><strong>14.5</strong></p>\n<ol type=\"1\">\n<li>geçen yıla göre</li>\n<li>senin aksine</li>\n<li>aynı babası gibi</li>\n<li>bundan farklı</li>\n<li>seninkiyle aynı</li>\n</ol>\n<p><strong>14.6</strong></p>\n<ol type=\"1\">\n<li>Ali, Ahmet’ten daha uzun.</li>\n<li>Bu, en güzeli.</li>\n<li>Senin kadar çalışıyorum.</li>\n<li>Baban gibi konuşuyorsun.</li>\n<li>Bu ev, o evden daha büyük.</li>\n<li>Dünyanın en yüksek dağı.</li>\n<li>O kadar iyi değil.</li>\n<li>Tren, otobüsten daha hızlı.</li>\n</ol>\n<h2 id=\"урок-15-1\">Урок 15</h2>\n<p><strong>15.1</strong></p>\n<ol type=\"1\">\n<li>bana göre</li>\n<li>eve doğru</li>\n<li>yemekten önce</li>\n<li>senin yüzünden</li>\n<li>yağmura rağmen</li>\n<li>sabahtan beri</li>\n<li>bunun hakkında</li>\n<li>senden başka</li>\n</ol>\n<p><strong>15.2</strong></p>\n<ol type=\"1\">\n<li>trenle</li>\n<li>arabayla</li>\n<li>arkadaşla</li>\n<li>benimle</li>\n<li>seninle</li>\n<li>kalemle</li>\n</ol>\n<p><strong>15.3</strong></p>\n<ol type=\"1\">\n<li>sayesinde</li>\n<li>yüzünden</li>\n<li>sayesinde</li>\n<li>yüzünden</li>\n</ol>\n<p><strong>15.4</strong></p>\n<ol type=\"1\">\n<li>için</li>\n<li>gibi</li>\n<li>kadar</li>\n<li>göre</li>\n<li>rağmen</li>\n<li>sonra</li>\n</ol>\n<p><strong>15.5</strong></p>\n<ol type=\"1\">\n<li>Benimle gel.</li>\n<li>Sana göre bu doğru mu?</li>\n<li>Yemekten önce ellerini yıka.</li>\n<li>Senin yüzünden geç kaldım.</li>\n<li>Eve doğru yürüyorum.</li>\n</ol>\n<p><strong>15.6</strong></p>\n<ol type=\"1\">\n<li>Bana göre bu doğru değil.</li>\n<li>Sabahtan beri seni bekliyorum.</li>\n<li>Yağmurdan dolayı gelemedim.</li>\n<li>Senin sayesinde başardım.</li>\n<li>Senden başka kimse yok.</li>\n<li>Hastalığına rağmen işe geldi.</li>\n<li>Onun yerine ben gideyim.</li>\n<li>Bunun hakkında ne düşünüyorsun?</li>\n</ol>\n<h2 id=\"урок-16-1\">Урок 16</h2>\n<p><strong>16.1</strong></p>\n<ol type=\"1\">\n<li>çantadaki kalem</li>\n<li>evdeki insanlar</li>\n<li>sınıftaki öğrenciler</li>\n<li>İstanbul’daki arkadaşım</li>\n<li>dünkü gazete</li>\n<li>bugünkü hava</li>\n<li>sabahki toplantı</li>\n<li>şimdiki durum</li>\n</ol>\n<p><strong>16.2</strong></p>\n<ol type=\"1\">\n<li>seninki</li>\n<li>onunki</li>\n<li>bizimki</li>\n<li>sizinki</li>\n<li>Ali’ninki</li>\n</ol>\n<p><strong>16.3</strong></p>\n<ol type=\"1\">\n<li>masadakini</li>\n<li>çantadakileri</li>\n<li>benimkini</li>\n<li>evdekine</li>\n<li>oradakinden</li>\n</ol>\n<p><strong>16.4</strong></p>\n<ol type=\"1\">\n<li>masanın altında</li>\n<li>çantanın içinde</li>\n<li>evin önünde</li>\n<li>evin arkasında</li>\n<li>okulun karşısında</li>\n<li>benim yanımda</li>\n</ol>\n<p><strong>16.5</strong></p>\n<ol type=\"1\">\n<li>üstünde</li>\n<li>üstüne</li>\n<li>üstünden</li>\n<li>önünde</li>\n<li>önüne</li>\n</ol>\n<p><strong>16.6</strong></p>\n<ol type=\"1\">\n<li>masadaki kitap</li>\n<li>dünkü gazete</li>\n<li>Masadakini ver.</li>\n /* ================= реч ================= */
let rate = .8, voice = null, playing = false, curEl = null;
function pickVoice(){
  const all = speechSynthesis.getVoices();
  voice = all.find(v => /^tr/i.test(v.lang)) || null;
  const w = document.getElementById('voicewarn');
  w.innerHTML = (!voice && all.length)
    ? '<div class="warn">Няма турски глас на устройството. iPhone: Настройки → Универсален достъп → Съдържание за четене → Гласове → Türkçe. Android: Настройки → Език → Синтез на реч → добави турски.</div>' : '';
}
speechSynthesis.onvoiceschanged = pickVoice; pickVoice();

function sentences(text){
  return text.replace(/^[\u2014\u2013-]\s*/,'')
             .split(/(?<=[.!?\u2026])\s+|(?<=[,;:])\s+(?=\S{12,})/)
             .map(s => s.trim()).filter(Boolean);
}
function speak(text, el, cb){
  speechSynthesis.cancel();
  if(curEl) curEl.classList.remove('speaking');
  curEl = el || null; if(curEl) curEl.classList.add('speaking');
  if(text.length === 1 && LETTER_NAMES[trLower(text)]) text = LETTER_NAMES[trLower(text)];
  const parts = text.length > 90 ? sentences(text) : [text.replace(/^[\u2014\u2013-]\s*/,'')];
  let i = 0;
  const finish = () => { if(curEl){curEl.classList.remove('speaking'); curEl=null;} cb && cb(); };
  const next = () => {
    if(i >= parts.length) return finish();
    const u = new SpeechSynthesisUtterance(parts[i++]);
    u.lang = 'tr-TR'; if(voice) u.voice = voice; u.rate = rate; u.pitch = 1;
    u.onend = () => setTimeout(next, 260);
    u.onerror = finish;
    speechSynthesis.speak(u);
  };
  next();
}

function stop(){
  playing = false; speechSynthesis.cancel();
  if(curEl){curEl.classList.remove('speaking'); curEl=null;}
  document.querySelectorAll('.line.on').forEach(x=>x.classList.remove('on'));
  document.querySelectorAll('.playing').forEach(x=>x.classList.remove('playing'));
}

/* ---- разпознаване на турски текст ---- */
const CYR = /[\u0400-\u04FF]/;
const LAT = /[A-Za-zçğıöşüÇĞİÖŞÜ]/;
const LETTER_NAMES = {a:'a',b:'be',c:'ce','ç':'çe',d:'de',e:'e',f:'fe',g:'ge','ğ':'yumuşak ge',h:'he','ı':'ı',i:'i',j:'je',k:'ke',l:'le',m:'me',n:'ne',o:'o','ö':'ö',p:'pe',r:'re',s:'se','ş':'şe',t:'te',u:'u','ü':'ü',v:'ve',y:'ye',z:'ze'};
function isTr(s){ s = (s||'').trim(); return s.length >= 1 && LAT.test(s) && !CYR.test(s); }
function trLower(s){ return s.replace(/I/g,'ı').replace(/İ/g,'i').toLowerCase(); }
function dedupeLetter(s){
  // клетки като „A a“, „Ç ç“, „I ı“ — една и съща буква в двата регистъра
  const m = s.match(/^(\S)\s+(\S)$/);
  if(m && trLower(m[1]) === trLower(m[2])) return m[2];
  return s;
}
function trPart(s){
  s = (s||'').replace(/\s+/g,' ').trim();
  s = dedupeLetter(s);
  // 1) винаги режи на тирето-разделител: „türkçe — превод“
  for(const sep of [' — ',' – ',' -- ',' - ']){
    const k = s.indexOf(sep);
    if(k > 0){ const head = s.slice(0, k).trim(); if(isTr(head)) return clean(head); }
  }
  // 2) режи преди скоба или двоеточие с обяснение
  const m = s.match(/^([^(\u2014\u2013:]+)/);
  if(m && isTr(m[1])) return clean(m[1]);
  return isTr(s) ? clean(s) : '';
}
function clean(s){
  return s.replace(/\s*\([^)]*\)\s*$/,'')          // скоби накрая
          .replace(/[\s.\-–—]*\b\d[\d:.]*\s*$/,'')     // час/число накрая: 4:15, 1:00
          .replace(/\s*[·•]\s*$/,'')
          .trim();
}

const kids = [...RAW.children];
const CH = [];           // {part, title, nodes[]}
let part = '', cur = null;
for(const n of kids){
  if(n.tagName === 'H1'){ part = n.textContent.trim(); continue; }
  if(n.tagName === 'H2'){
    cur = {part, title:n.textContent.replace(/\s+/g,' ').trim(), nodes:[n]};

  }

  cur.nodes.push(n);
}

/* ---- снимки от Wikipedia (изисква интернет) ---- */
let picCache = {};
try{ picCache = JSON.parse(localStorage.getItem('tr_pics') || '{}'); }catch(e){}
function savePics(){ try{ localStorage.setItem('tr_pics', JSON.stringify(picCache)); }catch(e){} }

function applyPic(fig){
  const t = fig.dataset.wiki, url = picCache[t];
  if(!url || fig.querySelector('img')) return;
  const img = new Image();
  img.alt = fig.dataset.tr; img.loading = 'lazy'; img.referrerPolicy = 'no-referrer';
  img.onload = () => img.classList.add('loaded');
  img.onerror = () => { delete picCache[t]; savePics(); img.remove(); };
  img.src = url;
  fig.querySelector('.pic-img').appendChild(img);
}

async function fetchOne(title){
  const u = 'https://en.wikipedia.org/api/rest_v1/page/summary/' + encodeURIComponent(title.replace(/ /g,'_'));
  const r = await fetch(u, {headers:{'Accept':'application/json'}});
  const d = await r.json();
  const src = (d.thumbnail && d.thumbnail.source) || (d.originalimage && d.originalimage.source);
  if(!src) throw new Error('няма изображение');
  return src;
}

async function loadPics(root){
  const figs = [...root.querySelectorAll('figure.pic[data-wiki]')];
  if(!figs.length) return;
  figs.forEach(applyPic);
  const need = [...new Set(figs.filter(f => !picCache[f.dataset.wiki]).map(f => f.dataset.wiki))];
  let bar = root.querySelector('#picbar');
  if(!bar){
    bar = document.createElement('div'); bar.className = 'picbar'; bar.id = 'picbar';
    const grid = root.querySelector('.picgrid');
    if(grid) grid.parentNode.insertBefore(bar, grid); else root.appendChild(bar);
  }
  if(!need.length){ if(bar) bar.remove(); return; }
  if(bar) bar.textContent = 'Зареждам снимки от Wikipedia…';

  let ok = 0, fail = 0;
  for(let i = 0; i < need.length; i += 6){
    await Promise.all(need.slice(i, i+6).map(t =>
      fetchOne(t).then(src => { picCache[t] = src; ok++; }).catch(() => { fail++; })
    ));
    savePics();
    figs.forEach(applyPic);
    if(bar) bar.textContent = 'Зареждам снимки… ' + (ok + fail) + '/' + need.length;
  }
  if(bar){
    if(ok) bar.remove();
    else bar.innerHTML = 'Снимките не се заредиха — няма интернет или прегледът блокира външни заявки. '
      + 'Свали файла и го отвори в Safari/Chrome. <button class="btn ghost" id="picretry">Опитай пак</button> '
      + '<button class="btn ghost" id="picclear">Изчисти кеша</button>';
    const rt = root.querySelector('#picretry');
    if(rt) rt.onclick = () => loadPics(root);
    const cl = root.querySelector('#picclear');
    if(cl) cl.onclick = () => { picCache = {}; savePics(); location.reload(); };
  }
}


/* ---- бутон за изслушване на цял текст ---- */
function addReadAll(root){
  root.querySelectorAll('blockquote').forEach(bq => {
    const ps = [...bq.querySelectorAll('p')].filter(p => p.dataset.tr);
    if(ps.length < 2) return;
    const b = document.createElement('button');
    b.className = 'btn ghost readall'; b.textContent = '▶ Чуй целия текст';
    b.onclick = () => {
      stop(); playing = true;
      let i = 0;
      const next = () => {
        if(!playing || i >= ps.length) return;
        const p = ps[i++];
        p.scrollIntoView({block:'center', behavior:'smooth'});
        speak(p.dataset.tr, p, () => setTimeout(next, 300));
      };
      next();
    };
    bq.parentNode.insertBefore(b, bq);
  });

function norm(s){
  return (s||'').toLowerCase()
    .replace(/I/g,'ı')
    .replace(/[.,!?;:…"'’]/g,'')
    .replace(/\s+/g,' ')
    .replace(/___+/g,'')
    .trim();
}
function accepts(given, correct){
  const g = norm(given).replace(/^\d+\s*[-–—.)]\s*/,'');
  if(!g) return false;
  // варианти в скоби: „kimsin (или: sen kimsin)“
  // „1-в“ → достатъчно е да се напише само „в“
  correct = correct.replace(/^\s*\d+\s*[-–—.)]\s*/,'');
  const alts = [correct.replace(/\s*\([^)]*\)/g,'')];
  const m = correct.match(/\((?:или|veya)[:\s]*([^)]+)\)/i);
  if(m) alts.push(m[1]);
  const extra = correct.match(/\(([^)]+)\)/);
  if(extra) alts.push(correct.replace(/[()]/g,''));
  return alts.some(a => {
    const c = norm(a);
    if(!c) return false;
    if(g === c) return true;
    // отговор само с окончанието: „-im“ при пълен отговор „öğretmenim“
    const gg = g.replace(/^-/,'');
    return c.endsWith(gg) && gg.length >= 2 && c.length - gg.length <= 12;
  });
}

          inp.classList.remove('ok','bad');
          if(!inp.value.trim()) return;
          if(accepts(inp.value, cor)){ inp.classList.add('ok'); ok++; }
          else { inp.classList.add('bad'); inp.title = 'Правилно: ' + cor; }
        });
        btns.querySelector('.exscore').textContent = ok + '/' + Math.min(gaps.length, key.length);
      };
      btns.querySelector('.check').onclick = check;
      btns.querySelector('.show').onclick = () => { gaps.forEach((g,i)=>{ if(key[i]!==undefined) g.value=key[i].replace(/\s*\([^)]*\)/,''); }); check(); };

/* ---- търсачка в речника ---- */
function addDictSearch(root){
  const h1 = root.querySelector('h1');
  if(!h1 || !/РЕЧНИК/.test(h1.textContent)) return;
  const tables = [...root.querySelectorAll('table')];
  if(!tables.length) return;
  const box = document.createElement('div'); box.className = 'dictsearch';
  box.innerHTML = '<input type="search" placeholder="Търси дума на турски или български…" '
    + 'autocomplete="off" autocapitalize="off" spellcheck="false">'
    + '<div class="dicthint"></div>';
  h1.parentNode.insertBefore(box, h1.nextSibling);
  const inp = box.querySelector('input'), hint = box.querySelector('.dicthint');
  const rows = [];
  tables.forEach(t => t.querySelectorAll('tbody tr').forEach(r => rows.push(r)));
  const low = s => (s||'').replace(/I/g,'ı').replace(/İ/g,'i').toLowerCase();
  inp.oninput = () => {
    const q = low(inp.value.trim());
    if(!q){
      rows.forEach(r => r.classList.remove('hidden'));
      root.querySelectorAll('table, h2, h3').forEach(e => e.classList.remove('hidden'));
      hint.textContent = ''; return;
    }
    let n = 0;
    rows.forEach(r => {
      const hit = low(r.textContent).includes(q);
      r.classList.toggle('hidden', !hit);
      if(hit) n++;
    });
    tables.forEach(t => {
      const any = [...t.querySelectorAll('tbody tr')].some(r => !r.classList.contains('hidden'));
      t.classList.toggle('hidden', !any);
      let p = t.previousElementSibling;
      while(p && !/^H[23]$/.test(p.tagName)) p = p.previousElementSibling;
      if(p) p.classList.toggle('hidden', !any);
    });
    hint.textContent = n ? ('Намерени: ' + n) : 'Няма съвпадение';
  };
}

const PASS_PCT = 0.7;
let passed = {};
try{ passed = JSON.parse(localStorage.getItem('tr_passed') || '{}'); }catch(e){}
function savePassed(){ try{ localStorage.setItem('tr_passed', JSON.stringify(passed)); }catch(e){} }

function lessonNo(title){
  const m = (title||'').match(/^УРОК\s*(\d+)/);
  return m ? m[1] : null;
}

function shuffled(a){
  const b = a.slice();
  for(let i = b.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [b[i], b[j]] = [b[j], b[i]];
  }
  return b;
}

function buildQuiz(root, lesson){
  const qs = TESTS[lesson];
  if(!qs || !qs.length) return;
  const need = Math.ceil(qs.length * PASS_PCT);
  const box = document.createElement('section'); box.className = 'quiz';
  box.innerHTML = '<h3>Тест · Ünite testi</h3>'
    + '<p class="qsub">' + qs.length + ' въпроса. За да отбележиш урока като научен, '
    + 'трябват поне ' + need + ' верни отговора.</p>';

  const picked = shuffled(qs);
  const state = new Array(picked.length).fill(null);
  picked.forEach((q, i) => {
    const it = document.createElement('div'); it.className = 'qitem';
    it.innerHTML = '<div class="qtext"><b>' + (i+1) + '.</b> ' + q.q + '</div>';
    const wrap = document.createElement('div'); wrap.className = 'qopts';
    shuffled(q.o).forEach(o => {
      const b = document.createElement('button');
      b.className = 'qopt'; b.textContent = o;
      b.onclick = () => {
        if(box.dataset.done) return;
        [...wrap.children].forEach(x => x.classList.remove('sel'));
        b.classList.add('sel'); state[i] = o;
      };
      wrap.appendChild(b);
    });
    it.appendChild(wrap);
    box.appendChild(it);
  });

  const foot = document.createElement('div'); foot.className = 'quizfoot';
  foot.innerHTML = '<button class="btn qcheck">Провери теста</button>'
    + '<button class="btn ghost qretry" hidden>Опитай пак</button>'
    + '<span class="qresult"></span>';
  box.appendChild(foot);

  const res = foot.querySelector('.qresult');
  foot.querySelector('.qcheck').onclick = () => {
    const unanswered = state.filter(x => x === null).length;
    if(unanswered){ res.className = 'qresult fail'; res.textContent = 'Остават ' + unanswered + ' без отговор.'; return; }
    box.dataset.done = '1';
    let ok = 0;
    [...box.querySelectorAll('.qitem')].forEach((it, i) => {
      const correct = picked[i].a;
      [...it.querySelectorAll('.qopt')].forEach(b => {
        b.classList.remove('sel');
        if(b.textContent === correct) b.classList.add('ok');
        else if(b.textContent === state[i]) b.classList.add('bad');
      });
      if(state[i] === correct) ok++;
    });
    const done = ok >= need;
    res.className = 'qresult ' + (done ? 'pass' : 'fail');
    res.textContent = ok + '/' + picked.length + (done ? ' — урокът е отключен ✓' : ' — нужни са ' + need);
    foot.querySelector('.qretry').hidden = false;
    if(done){ passed[lesson] = true; savePassed(); }
    updateDoneBtn();
  };
  foot.querySelector('.qretry').onclick = () => {
    const parent = box.parentNode;
    box.remove();
    buildQuizAt(parent, lesson);
  };
  return box;
}

function buildQuizAt(parent, lesson){
  const q = buildQuiz(parent, lesson);
  if(q) parent.appendChild(q);
}

  loadPics(box);

  const lesson = lessonNo(ch.title);
  if(lesson && TESTS[lesson]) buildQuizAt(view, lesson);

  const pg = document.createElement('div'); pg.className = 'pager';
  pg.innerHTML = '<button id="prev">← Назад</button><button id="next">Напред →</button>';
  view.appendChild(pg);
  pg.querySelector('#prev').disabled = idx === 0;
  pg.querySelector('#next').disabled = idx === CH.length-1;
  pg.querySelector('#prev').onclick = () => { showChapter(idx-1); scrollTo(0,0); };
  pg.querySelector('#next').onclick = () => { showChapter(idx+1); scrollTo(0,0); };

  document.getElementById('title').textContent = ch.title.replace(/^УРОК\s*/,'Урок ');
  updateDoneBtn();
  try{ localStorage.setItem('tr_last', idx); }catch(e){}
  buildNav(document.getElementById('search').value);
}

function buildNav(q){
  const list = document.getElementById('navlist');
  q = (q||'').toLowerCase().trim();
  list.innerHTML = '';
  let last = null;
  CH.forEach((ch, i) => {
    if(q && !ch.title.toLowerCase().includes(q) && !ch.part.toLowerCase().includes(q)) return;
    if(ch.part !== last){ last = ch.part;
      const h = document.createElement('div'); h.className='part'; h.textContent = ch.part || '—'; list.appendChild(h);
    }
    const it = document.createElement('div');
    const ln = lessonNo(ch.title);
    const testDone = ln && TESTS[ln] && passed[ln];
    it.className = 'navitem' + (i===idx && tab==='book' ? ' cur':'')
      + (done[i] ? ' done':'') + (!done[i] && testDone ? ' tested':'');
    it.innerHTML = '<span class="dot"></span><span>' + ch.title + '</span>';
    it.onclick = () => { tab='book'; setTab('book'); showChapter(i); closeDrawer(); scrollTo(0,0); };
    list.appendChild(it);
  });
}

function renderDialogs(){
  dlgWrap.innerHTML = '';
  DIALOGS.forEach(d => {
    const card = document.createElement('section'); card.className = 'dialog';
    card.innerHTML =
      '<div class="dhead"><div class="dtag">'+d.lvl+' · '+d.tag+'</div><h2 class="dtitle">'+d.title+'</h2><p class="dsub">'+d.sub+'</p></div>'+
      '<ul class="lines"></ul><div class="vocab">'+d.vocab+'</div>'+
      '<div class="dfoot"><button class="btn play-all">▶ Целия диалог</button><button class="btn ghost hide">Скрий превода</button></div>';
    const ul = card.querySelector('.lines');
    d.lines.forEach(([who, tr, bg]) => {
      const li = document.createElement('li'); li.className = 'line ' + (who==='A'?'a':'b');
      li.innerHTML = '<span class="who">'+who+'</span><span class="txt"><span class="tr">'+tr+'</span><span class="bg">'+bg+'</span></span><button class="say">▶</button>';
      li.querySelector('.say').onclick = () => { stop(); li.classList.add('on'); speak(tr, null, () => li.classList.remove('on')); };
      ul.appendChild(li);
    });
    card.querySelector('.play-all').onclick = () => {
      stop(); playing = true; card.classList.add('playing');
      const items = [...card.querySelectorAll('.line')]; let i = 0;
      const next = () => {
        items.forEach(x=>x.classList.remove('on'));
        if(!playing || i >= d.lines.length){ card.classList.remove('playing'); return; }
        items[i].classList.add('on');
        items[i].scrollIntoView({block:'center', behavior:'smooth'});
        speak(d.lines[i][1], null, () => { i++; setTimeout(next, 320); });
      };
      next();
    };
    card.querySelector('.hide').onclick = e => {
      const h = card.classList.toggle('hidebg');
      e.target.textContent = h ? 'Покажи превода' : 'Скрий превода';
    };
    dlgWrap.appendChild(card);
  });
}

/* ================= взаимодействие ================= */
document.addEventListener('click', e => {
  if(e.target.closest('button,a,input')) return;
  const el = e.target.closest('.tr-say');
  if(el && el.dataset.tr){ speak(el.dataset.tr, el); }
});

/* маркирай текст → бутон „Чуй“ */
const selbtn = document.getElementById('selbtn');
document.addEventListener('selectionchange', () => {
  const s = document.getSelection(); const t = s && s.toString().trim();
  if(t && t.length > 1 && isTr(t)){
    const r = s.getRangeAt(0).getBoundingClientRect();
    selbtn.style.display = 'block';
    selbtn.style.left = Math.max(10, Math.min(window.innerWidth-110, r.left + r.width/2 - 45)) + 'px';
    selbtn.style.top = Math.max(70, r.top - 46) + 'px';
    selbtn.dataset.t = t;
  } else selbtn.style.display = 'none';
});
selbtn.onclick = () => { speak(selbtn.dataset.t); selbtn.style.display='none'; };

const scrim = document.getElementById('scrim'), drawer = document.getElementById('drawer');
function closeDrawer(){ drawer.classList.remove('open'); scrim.classList.remove('open'); }
document.getElementById('menu').onclick = () => { drawer.classList.add('open'); scrim.classList.add('open'); buildNav(document.getElementById('search').value); };
scrim.onclick = closeDrawer;
document.getElementById('search').oninput = e => buildNav(e.target.value);

function updateDoneBtn(){
  const b = document.getElementById('markdone');
  const lesson = lessonNo(CH[idx] && CH[idx].title);
  const locked = lesson && TESTS[lesson] && !passed[lesson];
  b.style.opacity = done[idx] ? 1 : (locked ? .25 : .5);
  b.title = locked ? 'Мини теста, за да отбележиш урока' : 'Отбележи като научен';
  b.dataset.locked = locked ? '1' : '';
}
document.getElementById('markdone').onclick = () => {
  const b = document.getElementById('markdone');
  const lesson = lessonNo(CH[idx] && CH[idx].title);
  if(lesson && TESTS[lesson] && !passed[lesson]){
    const q = view.querySelector('.quiz');
    if(q) q.scrollIntoView({block:'start', behavior:'smooth'});
    b.animate([{transform:'scale(1)'},{transform:'scale(1.15)'},{transform:'scale(1)'}], {duration:260});
    return;
  }
  done[idx] = !done[idx]; saveDone();
  updateDoneBtn();
  buildNav(document.getElementById('search').value);
};

function setTab(t){
  tab = t; stop();
  const book = t === 'book';
  view.hidden = !book; dlgWrap.hidden = book;
  document.getElementById('tabBook').setAttribute('aria-pressed', book);
  document.getElementById('tabDlg').setAttribute('aria-pressed', !book);
  document.getElementById('tabname').textContent = book ? 'Учебник' : 'Диалози';
  document.getElementById('markdone').style.display = book ? 'grid' : 'none';
  if(!book) document.getElementById('title').textContent = 'Аудио диалози A1–B1';
  else showChapter(idx);
  scrollTo(0,0);
}
document.getElementById('tabBook').onclick = () => setTab('book');
document.getElementById('tabDlg').onclick = () => setTab('dlg');
document.getElementById('stopAll').onclick = stop;
document.querySelectorAll('.bottom [data-rate]').forEach(b => b.onclick = () => {
  rate = parseFloat(b.dataset.rate);
  document.querySelectorAll('.bottom [data-rate]').forEach(x => x.setAttribute('aria-pressed', x === b));
});

renderDialogs();
let start = 0; try{ start = parseInt(localStorage.getItem('tr_last')||'0',10) || 0; }catch(e){}
showChapter(start);

/* ================= PWA: инсталиране офлайн + известие за нова версия ================= */
function showToast(html, actions){
  const t = document.createElement('div');
  t.style.cssText = 'position:fixed;left:12px;right:12px;bottom:64px;z-index:70;'
    + 'background:rgba(14,35,56,.97);color:#EAF1F0;border-radius:12px;padding:12px 14px;'
    + 'font:14px/1.35 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;'
    + 'box-shadow:0 8px 24px rgba(0,0,0,.28);display:flex;gap:10px;align-items:center;flex-wrap:wrap';
  t.innerHTML = html;
  document.body.appendChild(t);
  if(actions) actions(t);
  return t;
}

if('serviceWorker' in navigator){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').then(reg => {
      reg.addEventListener('updatefound', () => {
        const nw = reg.installing;
        if(!nw) return;
        nw.addEventListener('statechange', () => {
          if(nw.state === 'installed' && navigator.serviceWorker.controller){
            showToast(
              '<span style="flex:1">Има нова версия на приложението.</span>'
              + '<button id="swReload" style="border:1px solid var(--turkuaz);background:var(--turkuaz);'
              + 'color:#06262A;font:600 13px/1 inherit;padding:8px 12px;border-radius:8px">Презареди</button>',
              (t) => t.querySelector('#swReload').onclick = () => location.reload()
            );
          }
        });
      });
    }).catch(() => {});
  });
}

window.addEventListener('offline', () => {
  showToast('<span>Няма връзка с интернет — учебникът и диалозите работят офлайн; '
    + 'новите снимки в речника няма да се заредят.</span>');
});
</script>
