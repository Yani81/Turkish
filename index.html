<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E2338">
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icons/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Türkçe">
<meta name="mobile-web-app-capable" content="yes">
<title>Türkçe · Учебник и диалози</title>
<style>
:root{
  --ink:#0E2338; --iznik:#17618F; --turkuaz:#2FA3A0; --bole:#C24632;
  --sand:#ECEFEA; --card:#fff; --line:#D6DCD8; --muted:#5C6B72; --gold:#C9A227;
  --nav:56px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--sand);color:var(--ink);
 font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
 padding-bottom:calc(var(--nav) + env(safe-area-inset-bottom) + 8px);}

/* ---------- Горна лента ---------- */
.top{position:sticky;top:0;z-index:40;background:var(--ink);color:#EAF1F0;
 padding:calc(8px + env(safe-area-inset-top)) 12px 8px;display:flex;gap:10px;align-items:center;
 border-bottom:3px solid var(--turkuaz)}
.top h1{font:600 15px/1.2 "Iowan Old Style","Palatino Linotype",Georgia,serif;margin:0;flex:1;letter-spacing:.01em}
.top .sub{display:block;font:500 10.5px/1.2 ui-monospace,Menlo,monospace;color:var(--turkuaz);letter-spacing:.16em;text-transform:uppercase}
.iconbtn{border:1px solid #34506A;background:transparent;color:#EAF1F0;width:38px;height:38px;
 border-radius:9px;display:grid;place-items:center;cursor:pointer;font-size:17px;flex:0 0 auto}

/* ---------- Съдържание ---------- */
.wrap{max-width:760px;margin:0 auto;padding:0 14px}
#view{padding-top:14px}
.crumb{font:600 10.5px/1 ui-monospace,Menlo,monospace;letter-spacing:.18em;color:var(--bole);text-transform:uppercase;margin:2px 0 8px}
h1,h2,h3,h4{font-family:"Iowan Old Style","Palatino Linotype",Georgia,serif;line-height:1.2}
#view h1{font-size:23px;color:var(--iznik);margin:6px 0 14px}
#view h2{font-size:21px;margin:4px 0 12px;padding-bottom:8px;border-bottom:2px solid var(--iznik)}
#view h3{font-size:16.5px;margin:20px 0 8px;color:var(--iznik)}
#view h4{font-size:15px;margin:16px 0 6px}
#view p{margin:10px 0}
#view ul,#view ol{padding-left:22px;margin:10px 0}
#view li{margin:5px 0}
#view table{border-collapse:collapse;width:100%;margin:12px 0;font-size:14px;display:block;overflow-x:auto}
#view th,#view td{border:1px solid var(--line);padding:6px 9px;text-align:left;vertical-align:top}
#view th{background:#E4EDF2;font-family:ui-monospace,Menlo,monospace;font-size:12px;letter-spacing:.05em}
#view tbody tr:nth-child(even) td{background:#FAFBFA}
#view blockquote{border-left:4px solid var(--gold);background:#FCFAF2;margin:12px 0;padding:10px 14px;border-radius:0 8px 8px 0}
#view blockquote p{margin:6px 0}
#view hr{border:0;border-top:1px solid var(--line);margin:20px 0}
#view code{font-family:ui-monospace,Menlo,monospace;font-size:13px;background:#E8EEEB;padding:1px 4px;border-radius:4px}
#view strong{font-weight:700}
.sec{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 16px 20px;margin-bottom:14px}

/* турски текст, който може да се чуе */
.tr-say{cursor:pointer;border-bottom:1px dotted rgba(47,163,160,.75)}
.tr-say.speaking{background:#E4F5F3;border-radius:4px}
td.tr-say{border-bottom:1px solid var(--line);box-shadow:inset 0 -2px 0 rgba(47,163,160,.35)}
td.tr-say.speaking{background:#E4F5F3!important}

.pager{display:flex;gap:8px;margin:4px 0 18px}
.pager button{flex:1;border:1px solid var(--iznik);background:#fff;color:var(--iznik);
 padding:12px;border-radius:10px;font:600 13px/1 inherit;cursor:pointer}
.pager button:disabled{opacity:.35}


#view figure.illus{margin:16px 0;padding:12px 10px 8px;background:#fff;border:1px solid var(--line);border-radius:12px;text-align:center}
#view figure.illus svg{width:100%;height:auto;max-width:460px}
#view figure.illus figcaption{font-size:12.5px;color:var(--muted);margin-top:8px;font-style:italic}

#view .picgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px;margin:14px 0}
#view figure.pic{margin:0;padding:10px 6px 8px;background:#fff;border:1px solid var(--line);border-radius:12px;text-align:center;cursor:pointer}
#view figure.pic .pic-img{display:block;height:72px;margin-bottom:6px;position:relative;border-radius:8px;overflow:hidden;background:#F4F7F6}
#view figure.pic svg{width:44px;height:44px;display:block;margin:14px auto 0}
#view figure.pic img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .3s}
#view figure.pic img.loaded{opacity:1}
#view .readall{margin:10px 0 4px}
#view .picbar{background:#FFF3E0;border:1px solid var(--gold);padding:10px 12px;border-radius:10px;font-size:13px;margin:12px 0}
#view .piccredit{font-size:11.5px;color:var(--muted);margin:10px 0 0}
#view figure.pic figcaption{font-size:12.5px;line-height:1.3}
#view figure.pic b{display:block;color:var(--ink);font-weight:700}
#view figure.pic span{color:var(--muted);font-size:11.5px}
#view figure.pic.speaking{background:#E4F5F3;border-color:var(--turkuaz)}

#view ol{padding-left:24px}
#view ol li{margin:7px 0}
#view h3{scroll-margin-top:70px}

#view blockquote p{margin:7px 0;padding-left:2px}
#view blockquote p + p{border-top:1px dotted rgba(201,162,39,.35);padding-top:8px}

/* ---------- интерактивни упражнения ---------- */
#view .exwrap{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:14px 0}
#view .exwrap > p:first-child{margin-top:0}
#view .exwrap em{display:block;color:var(--iznik);font-size:13px;font-style:normal;margin-top:2px}
#view .exrow{display:flex;gap:8px;align-items:flex-start;margin:8px 0}
#view .exnum{flex:0 0 22px;color:var(--muted);font:600 13px/1.9 ui-monospace,Menlo,monospace}
#view .exq{flex:1;min-width:0}
#view .exq .qt{font-size:15px}
#view .exwrap input.exin{width:100%;margin-top:5px;padding:9px 11px;border:1px solid var(--line);
 border-radius:9px;font:15px/1.3 inherit;background:#FBFCFB;color:var(--ink)}
#view .exwrap input.exin:focus{border-color:var(--iznik);background:#fff;outline:none}
#view .exwrap input.ok{border-color:#2E9E5B;background:#EDF9F1}
#view .exwrap input.bad{border-color:var(--bole);background:#FDEFEC}
#view .exfb{font-size:12.5px;margin-top:4px}
#view .exfb.ok{color:#2E7D48}
#view .exfb.bad{color:var(--bole)}
#view .exbtns{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
#view .exscore{font:600 13px/1 ui-monospace,Menlo,monospace;color:var(--muted);align-self:center}
#view .exfree{background:#FCFAF2;border:1px dashed var(--gold);border-radius:9px;padding:10px 12px;font-size:14px;margin-top:8px}

#view .exgap{line-height:2.4;margin:8px 0}
#view input.gapin{display:inline-block;width:9ch;margin:0 3px;padding:5px 8px;text-align:center;
 border:1px solid var(--iznik);border-radius:7px;background:#fff;font:15px/1 inherit;vertical-align:baseline}
#view input.gapin.ok{border-color:#2E9E5B;background:#EDF9F1}
#view input.gapin.bad{border-color:var(--bole);background:#FDEFEC}

#view .dictsearch{position:sticky;top:60px;z-index:20;background:var(--sand);padding:8px 0 10px;margin:0 0 6px}
#view .dictsearch input{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:10px;
 font:15px/1 inherit;background:#fff;color:var(--ink)}
#view .dictsearch input:focus{border-color:var(--iznik);outline:none}
#view tr.hidden,#view table.hidden,#view h2.hidden,#view h3.hidden{display:none}
#view .dicthint{font-size:12.5px;color:var(--muted);margin:4px 0 0}

/* ---------- тест след урока ---------- */
#view .quiz{background:#fff;border:2px solid var(--iznik);border-radius:14px;padding:16px;margin:22px 0 10px}
#view .quiz h3{margin:0 0 4px;color:var(--iznik);font-size:17px}
#view .quiz .qsub{color:var(--muted);font-size:13px;margin:0 0 14px}
#view .qitem{margin:14px 0;padding-top:12px;border-top:1px dashed var(--line)}
#view .qitem:first-of-type{border-top:0;padding-top:0}
#view .qtext{font-size:15px;margin-bottom:8px}
#view .qtext b{color:var(--iznik)}
#view .qopts{display:grid;gap:7px}
#view .qopt{border:1px solid var(--line);background:#FBFCFB;border-radius:9px;padding:11px 13px;
 font:15px/1.25 inherit;text-align:left;cursor:pointer;color:var(--ink)}
#view .qopt:active{background:#EEF4F3}
#view .qopt.sel{border-color:var(--iznik);background:#EAF2F6}
#view .qopt.ok{border-color:#2E9E5B;background:#EDF9F1}
#view .qopt.bad{border-color:var(--bole);background:#FDEFEC}
#view .quizfoot{margin-top:16px;display:flex;gap:9px;align-items:center;flex-wrap:wrap}
#view .qresult{font:600 14px/1.3 inherit;flex:1;min-width:140px}
#view .qresult.pass{color:#2E7D48}
#view .qresult.fail{color:var(--bole)}
#view .quizlock{background:#FFF3E0;border:1px solid var(--gold);border-radius:10px;padding:11px 13px;
 font-size:13.5px;margin:14px 0 0}
/* ---------- Диалози ---------- */
.dialog{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:14px;overflow:hidden}
.dhead{padding:14px 16px 11px;border-bottom:1px dashed var(--line)}
.dtag{font:600 10.5px/1 ui-monospace,Menlo,monospace;letter-spacing:.18em;color:var(--bole);text-transform:uppercase}
.dtitle{font-size:19px;margin:6px 0 2px;font-weight:600;font-family:"Iowan Old Style",Georgia,serif}
.dsub{margin:0;color:var(--muted);font-size:13px}
.lines{list-style:none;margin:0;padding:6px 0}
.line{display:flex;gap:11px;align-items:flex-start;padding:10px 14px;border-left:3px solid transparent;transition:background .18s,opacity .18s}
.line.on{background:#F0F8F7;border-left-color:var(--turkuaz)}
.playing .line:not(.on){opacity:.4}
.who{flex:0 0 28px;width:28px;height:28px;display:grid;place-items:center;color:#fff;
 font:700 11px/1 ui-monospace,Menlo,monospace;margin-top:2px;
 clip-path:polygon(30% 0,70% 0,100% 30%,100% 70%,70% 100%,30% 100%,0 70%,0 30%)}
.a .who{background:var(--iznik)} .b .who{background:var(--bole)}
.txt{flex:1;min-width:0}
.tr{font-size:16.5px;font-weight:500}
.bg{font-size:13px;color:var(--muted);margin-top:3px;display:block}
.hidebg .bg{display:none}
.say{flex:0 0 auto;border:1px solid var(--line);background:#fff;border-radius:9px;width:32px;height:32px;
 display:grid;place-items:center;cursor:pointer;color:var(--iznik);font-size:12px}
.dfoot{display:flex;gap:8px;padding:11px 14px 14px;border-top:1px dashed var(--line);flex-wrap:wrap}
.btn{border:1px solid var(--iznik);background:var(--iznik);color:#fff;font:600 13px/1 inherit;
 padding:10px 13px;border-radius:9px;cursor:pointer}
.btn.ghost{background:#fff;color:var(--iznik)}
.vocab{padding:0 14px 14px;font-size:13px;color:var(--muted)}
.vocab b{color:var(--ink);font-weight:600}

/* ---------- Чекмедже с уроци ---------- */
.scrim{position:fixed;inset:0;background:rgba(14,35,56,.55);opacity:0;pointer-events:none;transition:opacity .2s;z-index:50}
.scrim.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;bottom:0;left:0;width:min(86vw,360px);background:#fff;z-index:51;
 transform:translateX(-100%);transition:transform .22s ease;display:flex;flex-direction:column}
.drawer.open{transform:none}
.dtop{padding:calc(12px + env(safe-area-inset-top)) 14px 10px;background:var(--ink);color:#EAF1F0}
.dtop input{width:100%;margin-top:10px;padding:10px 12px;border-radius:9px;border:1px solid #34506A;
 background:#152E48;color:#fff;font:14px/1 inherit}
.dtop input::placeholder{color:#7E95A3}
.navlist{overflow-y:auto;flex:1;padding:6px 0 20px}
.part{font:600 10.5px/1 ui-monospace,Menlo,monospace;letter-spacing:.16em;color:var(--bole);
 padding:14px 16px 6px;text-transform:uppercase}
.navitem{display:flex;gap:9px;align-items:center;padding:10px 16px;cursor:pointer;font-size:14.5px;border-bottom:1px solid #F0F2F0}
.navitem:hover{background:#F4F8F7}
.navitem.cur{background:#E9F3F2;font-weight:600;color:var(--iznik)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--line);flex:0 0 auto}
.navitem.done .dot{background:var(--turkuaz)}
.navitem.tested .dot{background:var(--gold)}

/* ---------- Долна навигация ---------- */
.bottom{position:fixed;left:0;right:0;bottom:0;z-index:45;background:rgba(14,35,56,.97);
 padding:7px 10px calc(7px + env(safe-area-inset-bottom));display:flex;gap:6px;align-items:center;justify-content:center;
 font:600 11.5px/1 ui-monospace,Menlo,monospace;letter-spacing:.05em;color:#CBDBDA;flex-wrap:wrap}
.bottom button{border:1px solid #34506A;background:transparent;color:#CBDBDA;padding:9px 11px;border-radius:8px;font:inherit;cursor:pointer}
.bottom button[aria-pressed="true"]{background:var(--turkuaz);border-color:var(--turkuaz);color:#06262A}
.warn{background:#FFF3E0;border:1px solid var(--gold);padding:12px 14px;border-radius:10px;font-size:13.5px;margin:12px 0}
#selbtn{position:fixed;z-index:60;display:none;background:var(--turkuaz);color:#06262A;border:0;
 border-radius:999px;padding:9px 15px;font:700 13px/1 inherit;box-shadow:0 4px 14px rgba(0,0,0,.25);cursor:pointer}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
</style>
</head>
<body>

<div class="top">
  <button class="iconbtn" id="menu" aria-label="Уроци">☰</button>
  <h1><span class="sub" id="tabname">Учебник</span><span id="title">Турски език</span></h1>
  <button class="iconbtn" id="markdone" aria-label="Отбележи като научен" title="Отбележи като научен">✓</button>
</div>

<div class="wrap">
  <div id="voicewarn"></div>
  <div id="view"></div>
  <div id="dialogs" hidden></div>
</div>

<div class="scrim" id="scrim"></div>
<nav class="drawer" id="drawer">
  <div class="dtop">
    <strong style="font:600 13px/1 ui-monospace,Menlo,monospace;letter-spacing:.14em">СЪДЪРЖАНИЕ</strong>
    <input id="search" placeholder="Търси урок или дума…" autocomplete="off">
  </div>
  <div class="navlist" id="navlist"></div>
</nav>

<button id="selbtn">▶ Чуй</button>

<div class="bottom">
  <button id="tabBook" aria-pressed="true">Учебник</button>
  <button id="tabDlg">Диалози</button>
  <span style="opacity:.6">|</span>
  <button data-rate="0.6">0.6×</button>
  <button data-rate="0.8" aria-pressed="true">0.8×</button>
  <button data-rate="1">1×</button>
  <button id="stopAll">■</button>
  <span style="opacity:.5;font-size:10.5px">v30</span>
</div>

<script>
/* ================= данни ================= */
const DIALOGS = [
{lvl:"A1",tag:"Урок 1",title:"Tanışma",sub:"Запознанство",vocab:"<b>memnun oldum</b> приятно ми е · <b>nereli</b> откъде е · <b>ne iş yapmak</b> с какво се занимавам",
 lines:[
 ["A","Merhaba! Ben Ayşe.","Здравей! Аз съм Айше."],
 ["B","Merhaba Ayşe. Benim adım Petar.","Здравей, Айше. Моето име е Петър."],
 ["A","Memnun oldum. Sen nerelisin?","Приятно ми е. Ти откъде си?"],
 ["B","Bulgaristan'dan geliyorum. Sofyalıyım.","От България съм. От София съм."],
 ["A","Ne iş yapıyorsun?","С какво се занимаваш?"],
 ["B","Mühendisim. Sen?","Инженер съм. Ти?"],
 ["A","Ben öğretmenim. Türkçen çok iyi!","Аз съм учителка. Турският ти е много добър!"],
 ["B","Teşekkür ederim, hâlâ öğreniyorum.","Благодаря, още уча."]
 ]},

{lvl:"A1",tag:"Урок 2",title:"Kafede",sub:"В кафенето",vocab:"<b>ne alırsınız</b> какво ще желаете · <b>şekerli/sade</b> със захар/без · <b>hesap</b> сметка",
 lines:[
 ["A","Hoş geldiniz! Ne alırsınız?","Добре дошли! Какво ще желаете?"],
 ["B","Bir Türk kahvesi lütfen.","Едно турско кафе, моля."],
 ["A","Şekerli mi, sade mi?","Със захар или без?"],
 ["B","Orta şekerli olsun.","Средно сладко."],
 ["A","Yanında su getireyim mi?","Да донеса ли вода към него?"],
 ["B","Evet, lütfen. Bir de tatlı var mı?","Да, моля. Има ли и десерт?"],
 ["A","Baklava ve sütlaç var.","Има баклава и мляко с ориз."],
 ["B","Sütlaç alayım. Hesabı da getirir misiniz?","Ще взема сютлач. Ще донесете ли и сметката?"]
 ]},

{lvl:"A1",tag:"Урок 3",title:"Yol sormak",sub:"Питане за път",vocab:"<b>sağa/sola sapmak</b> завивам надясно/наляво · <b>düz gitmek</b> вървя направо · <b>karşısında</b> срещу",
 lines:[
 ["A","Affedersiniz, tren istasyonu nerede?","Извинете, къде е гарата?"],
 ["B","Buradan düz gidin, sonra sağa sapın.","Оттук вървете направо, после завийте надясно."],
 ["A","Uzak mı?","Далече ли е?"],
 ["B","Hayır, yürüyerek on dakika.","Не, пеша десет минути."],
 ["A","Otobüs de var mı?","Има ли и автобус?"],
 ["B","Evet, 12 numara. Durak postanenin karşısında.","Да, номер 12. Спирката е срещу пощата."],
 ["A","Çok teşekkür ederim!","Много благодаря!"],
 ["B","Rica ederim, iyi yolculuklar.","Моля, приятен път."]
 ]},

{lvl:"A2",tag:"Урок 4",title:"Markette",sub:"В магазина",vocab:"<b>kaç para</b> колко струва · <b>kilo</b> килограм · <b>poşet</b> торбичка · <b>bozuk para</b> дребни",
 lines:[
 ["A","Merhaba, domates kaç para?","Здравейте, доматите колко струват?"],
 ["B","Kilosu kırk lira.","Килото е четиридесет лири."],
 ["A","İki kilo alayım. Peynir de var mı?","Ще взема два килограма. Има ли и сирене?"],
 ["B","Beyaz peynir mi, kaşar mı?","Бяло сирене или кашкавал?"],
 ["A","Beyaz peynir, yarım kilo.","Бяло сирене, половин килограм."],
 ["B","Başka bir şey?","Нещо друго?"],
 ["A","Bir de ekmek. Hepsi ne kadar tuttu?","И един хляб. Колко стана всичко?"],
 ["B","Yüz on lira. Poşet ister misiniz?","Сто и десет лири. Желаете ли торбичка?"],
 ["A","Gerek yok, çantam var. Buyurun.","Няма нужда, имам чанта. Заповядайте."]
 ]},

{lvl:"A2",tag:"Урок 5",title:"Otelde",sub:"На рецепцията",vocab:"<b>rezervasyon</b> резервация · <b>kahvaltı dahil</b> със закуска · <b>oda anahtarı</b> ключ от стаята",
 lines:[
 ["A","İyi akşamlar, rezervasyonum var. Adım Petar Ivanov.","Добър вечер, имам резервация. Казвам се Петър Иванов."],
 ["B","Hoş geldiniz. Üç gece, tek kişilik oda, doğru mu?","Добре дошли. Три нощувки, единична стая, вярно ли е?"],
 ["A","Doğru. Kahvaltı dahil mi?","Вярно. Закуската включена ли е?"],
 ["B","Evet, saat yedi ile onda arası.","Да, между седем и десет часа."],
 ["A","Wi-Fi şifresi nedir?","Каква е паролата за Wi-Fi?"],
 ["B","Odanızda kartın üzerinde yazıyor.","Пише го на картата в стаята ви."],
 ["A","Odam kaçıncı katta?","На кой етаж е стаята ми?"],
 ["B","Dördüncü katta, 412 numara. Buyurun anahtarınız.","На четвъртия етаж, номер 412. Заповядайте ключа."]
 ]},

RAW.innerHTML = "<h1 id=\"учебник-a1-уроци-и-упражнения\">УЧЕБНИК A1 · УРОЦИ И\nУПРАЖНЕНИЯ</h1>\n<hr />\n<h3 id=\"как-да-работиш-с-учебника\">Как да работиш с учебника</h3>\n<p>Всеки урок има еднаква структура:</p>\n<ol type=\"1\">\n<li><strong>Речник</strong> — новите думи с превод</li>\n<li><strong>Граматика</strong> — правилото с таблици</li>\n<li><strong>Примери</strong> — изречения с превод</li>\n<li><strong>Текст за четене и превод</strong></li>\n<li><strong>Упражнения</strong></li>\n</ol>\n<p><strong>Ключът с отговорите на всички упражнения е в края на\nучебника.</strong> Прави упражненията писмено и чак после гледай\nотговорите.</p>\n<hr />\n<h2 id=\"въведение-азбука-и-произношение\">ВЪВЕДЕНИЕ: АЗБУКА И\nПРОИЗНОШЕНИЕ</h2><figure class=\"illus\">\n<svg viewBox=\"0 0 400 150\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Поздрави през деня\">\n<line x1=\"24\" y1=\"96\" x2=\"376\" y2=\"96\" stroke=\"#D6DCD8\" stroke-width=\"2\"/>\n<g text-anchor=\"middle\">\n<g fill=\"#C9A227\"><circle cx=\"80\" cy=\"96\" r=\"9\"/></g>\n<circle cx=\"190\" cy=\"96\" r=\"9\" fill=\"#2FA3A0\"/>\n<circle cx=\"290\" cy=\"96\" r=\"9\" fill=\"#17618F\"/>\n<circle cx=\"360\" cy=\"96\" r=\"9\" fill=\"#0E2338\"/>\n<g font-size=\"12.5\" font-weight=\"700\" fill=\"#0E2338\">\n<text x=\"80\" y=\"66\">günaydın</text><text x=\"190\" y=\"66\">iyi günler</text>\n<text x=\"290\" y=\"46\">iyi akşamlar</text><text x=\"352\" y=\"66\">iyi geceler</text>\n</g>\n<g font-size=\"10\" fill=\"#5C6B72\">\n<text x=\"80\" y=\"122\">сутрин</text><text x=\"190\" y=\"122\">ден</text><text x=\"290\" y=\"122\">вечер</text><text x=\"358\" y=\"122\">нощ</text>\n</g>\n</g>\n</svg>\n<figcaption>Поздравът се сменя с часа на деня.</figcaption></figure>\n<p>Турската азбука е латинска, има <strong>29 букви</strong>. Няма Q, W,\nX. Има Ç, Ğ, I, İ, Ö, Ş, Ü.</p>\n<p>Турският се чете както се пише — една буква = един звук.</p>\n<table>\n<colgroup>\n<col style=\"width: 25%\" />\n<col style=\"width: 25%\" />\n<col style=\"width: 25%\" />\n<col style=\"width: 25%\" />\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th>Буква</th>\n<th>Звук</th>\n<th>Пример</th>\n<th>Превод</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>A a</td>\n<td>а</td>\n<td><strong>a</strong>ta</td>\n<td>прародител</td>\n</tr>\n<tr class=\"even\">\n<td>B b</td>\n<td>б</td>\n<td><strong>b</strong>aba</td>\n<td>баща</td>\n</tr>\n<tr class=\"odd\">\n<td>C c</td>\n<td>дж</td>\n<td><strong>c</strong>am</td>\n<td>стъкло</td>\n</tr>\n<tr class=\"even\">\n<td>Ç ç</td>\n<td>ч</td>\n<td><strong>ç</strong>ay</td>\n<td>чай</td>\n</tr>\n<tr class=\"odd\">\n<td>D d</td>\n<td>д</td>\n<td><strong>d</strong>ost</td>\n<td>приятел</td>\n</tr>\n<tr class=\"even\">\n<td>E e</td>\n<td>е</td>\n<td><strong>e</strong>v</td>\n<td>къща</td>\n</tr>\n<tr class=\"odd\">\n<td>F f</td>\n<td>ф</td>\n<td><strong>f</strong>il</td>\n<td>слон</td>\n</tr>\n<tr class=\"even\">\n<td>G g</td>\n<td>г</td>\n<td><strong>g</strong>öz</td>\n<td>око</td>\n</tr>\n<tr class=\"odd\">\n<td>Ğ ğ</td>\n<td>не се чете (удължава гласната преди себе си)</td>\n<td>da<strong>ğ</strong></td>\n<td>планина</td>\n</tr>\n<tr class=\"even\">\n<td>H h</td>\n<td>х (леко)</td>\n<td><strong>h</strong>ava</td>\n<td>въздух</td>\n</tr>\n<tr class=\"odd\">\n<td>I ı</td>\n<td>ъ</td>\n<td>k<strong>ı</strong>z</td>\n<td>момиче</td>\n</tr>\n<tr class=\"even\">\n<td>İ i</td>\n<td>и</td>\n<td><strong>i</strong>ki</td>\n<td>две</td>\n</tr>\n<tr class=\"odd\">\n<td>J j</td>\n<td>ж</td>\n<td><strong>j</strong>apon</td>\n<td>японец</td>\n</tr>\n<tr class=\"even\">\n<td>K k</td>\n<td>к</td>\n<td><strong>k</strong>itap</td>\n<td>книга</td>\n</tr>\n<tr class=\"odd\">\n<td>L l</td>\n<td>л</td>\n<td><strong>l</strong>imon</td>\n<td>лимон</td>\n</tr>\n<tr class=\"even\">\n<td>M m</td>\n<td>м</td>\n<td><strong>m</strong>asa</td>\n<td>маса</td>\n</tr>\n<tr class=\"odd\">\n<td>N n</td>\n<td>н</td>\n<td><strong>n</strong>e</td>\n<td>какво</td>\n</tr>\n<tr class=\"even\">\n<td>O o</td>\n<td>о</td>\n<td><strong>o</strong>kul</td>\n<td>училище</td>\n</tr>\n<tr class=\"odd\">\n<td>Ö ö</td>\n<td>ьо (като нем. ö)</td>\n<td><strong>ö</strong>ğrenci</td>\n<td>ученик</td>\n</tr>\n<tr class=\"even\">\n<td>P p</td>\n<td>п</td>\n<td><strong>p</strong>ara</td>\n<td>пари</td>\n</tr>\n<tr class=\"odd\">\n<td>R r</td>\n<td>р</td>\n<td><strong>r</strong>enk</td>\n<td>цвят</td>\n</tr>\n<tr class=\"even\">\n<td>S s</td>\n<td>с</td>\n<td><strong>s</strong>u</td>\n<td>вода</td>\n</tr>\n<tr class=\"odd\">\n<td>Ş ş</td>\n<td>ш</td>\n<td><strong>ş</strong>eker</td>\n<td>захар</td>\n</tr>\n<tr class=\"even\">\n<td>T t</td>\n<td>т</td>\n<td><strong>t</strong>uz</td>\n<td>сол</td>\n</tr>\n<tr class=\"odd\">\n<td>U u</td>\n<td>у</td>\n<td><strong>u</strong>zun</td>\n<td>дълъг</td>\n</tr>\n<tr class=\"even\">\n<td>Ü ü</td>\n<td>ю (като нем. ü)</td>\n<td><strong>ü</strong>züm</td>\n<td>грозде</td>\n</tr>\n<tr class=\"odd\">\n<td>V v</td>\n<td>в</td>\n<td><strong>v</strong>ar</td>\n<td>има</td>\n</tr>\n<tr class=\"even\">\n<td>Y y</td>\n<td>й</td>\n<td><strong>y</strong>ol</td>\n<td>път</td>\n</tr>\n<tr class=\"odd\">\n<td>Z z</td>\n<td>з</td>\n<td><strong>z</strong>aman</td>\n<td>време</td>\n</tr>\n</tbody>\n</table>\n<h3 id=\"важни-бележки-за-произношението-telaffuz-notları\">Важни бележки\nза произношението · Telaffuz notları</h3>\n<ul>\n<li><strong>I ı</strong> (без точка) = българското <strong>ъ</strong>:\n<code>kız</code> (къз) — момиче, <code>kırmızı</code> (кърмъзъ) —\nчервен.</li>\n<li><strong>İ i</strong> (с точка) = <strong>и</strong>. Главната буква\nна <code>i</code> е <code>İ</code>: <code>İstanbul</code>,\n<code>İzmir</code>.</li>\n<li><strong>Ö</strong> и <strong>Ü</strong> — устните са закръглени като\nза „о“/„у“, но езикът е в позиция за „е“/„и“.</li>\n<li><strong>Ğ ğ</strong> (yumuşak g) — никога не стои в началото на\nдума. Между гласни почти не се чува, а гласната преди нея се удължава:\n<code>dağ</code> → „даа“, <code>öğretmen</code> → „ьоретмен“.</li>\n<li><strong>C</strong> = дж, а <strong>Ç</strong> = ч. Внимавай:\n<code>cam</code> (джам) ≠ <code>çam</code> (чам, бор).</li>\n<li><strong>E</strong> пред <code>m, n, l, r</code> звучи по-отворено\n(като „ае“): <code>ben</code>, <code>gel</code>.</li>\n</ul>\n<h3 id=\"ударение-vurgu\">Ударение · Vurgu</h3>\n<p>По правило ударението е <strong>на последната сричка</strong>:\n<code>kitáp</code>, <code>öğrencí</code>, <code>arkadaşím</code>.</p>\n<p>Изключения (ударението пада в началото или средата): - Географски\nимена: <code>Í-stanbul</code>, <code>Án-kara</code>,\n<code>Búl-garistan</code> - Наречия: <code>şímdi</code> (сега),\n<code>nérede</code> (къде), <code>sónra</code> (после) - Отрицателна\nчастица <code>-ma/-me</code> дърпа ударението пред себе си:\n<code>gélme</code> (не идвай)</p>\n<hr />\n<h2 id=\"как-работи-турският-език-türkçe-nasıl-işler\">КАК РАБОТИ ТУРСКИЯТ\nЕЗИК · Türkçe nasıl işler</h2>\n<p>Преди да започнеш уроците, прочети това. Турският е устроен различно\nот българския и щом разбереш принципа, всичко останало става\nлогично.</p>\n<h3 id=\"основната-идея-думата-се-сглобява-eklemeli-dil\">Основната идея:\nдумата се сглобява · Eklemeli dil</h3>\n<p>Турският е <strong>аглутинативен</strong> (турски: <em>eklemeli</em>\n— „лепящ“) език. Това значи, че значенията се добавят като отделни\nпарченца — <strong>окончания</strong> — едно след друго в края на\nдумата. Всяко парченце има точно едно значение и не се слива с\nостаналите.</p>\n<p>Сравни:</p>\n<table>\n<colgroup>\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th>Турски</th>\n<th>Разбор</th>\n<th>Български</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>ev</td>\n<td>ev</td>\n<td>къща</td>\n</tr>\n<tr class=\"even\">\n<td>ev<strong>ler</strong></td>\n<td>ev + мн.ч.</td>\n<td>къщи</td>\n</tr>\n<tr class=\"odd\">\n<td>ev<strong>ler</strong>im</td>\n<td>ev + мн.ч. + мой</td>\n<td>моите къщи</td>\n</tr>\n<tr class=\"even\">\n<td>ev<strong>ler</strong>im<strong>de</strong></td>\n<td>ev + мн.ч. + мой + в</td>\n<td>в моите къщи</td>\n</tr>\n<tr class=\"odd\">\n<td>ev<strong>ler</strong>im<strong>de</strong>ki</td>\n<td>ev + мн.ч. + мой + в + който е</td>\n<td>който е в моите къщи</td>\n</tr>\n</tbody>\n</table>\n<p>В българския за същото трябват няколко думи и предлози. В турския —\nедна дума. Затова турската дума расте надясно и <strong>редът на\nокончанията е винаги един и същ</strong>:</p>\n<p><strong>корен → множествено число → притежание → падеж</strong></p>\n<p><code>ev-ler-im-de</code> — никога <code>ev-de-ler-im</code>.</p>\n<h3 id=\"какво-е-корен-kök\">Какво е „корен“ · Kök</h3>\n<p>Коренът е думата без никакви окончания — това, което намираш в\nречника. При глаголите речникът дава инфинитив (<code>gelmek</code>), а\nкоренът е това, което остава след махане на <code>-mek/-mak</code>:\n<code>gel-</code>.</p>\n<p>Всяко спрежение започва от корена: <code>gel-iyor-um</code>,\n<code>gel-di-m</code>, <code>gel-ecek-sin</code>.</p>\n<h3 id=\"какво-е-окончание-афикс-ek\">Какво е „окончание“ (афикс) ·\nEk</h3>\n<p>Окончанието е парченце без самостоятелно значение, което се лепи за\nкорена. В този учебник ще срещаш два вида:</p>\n<ul>\n<li><strong>Словоизменителни</strong> — променят формата:\n<code>-ler</code> (мн.ч.), <code>-de</code> (в), <code>-im</code>\n(мой)</li>\n<li><strong>Словообразувателни</strong> — правят нова дума:\n<code>göz</code> (око) → <code>göz-lük</code> (очила), <code>iş</code>\n(работа) → <code>iş-çi</code> (работник)</li>\n</ul>\n<h3 id=\"защо-гласните-се-менят-ünlü-uyumu\">Защо гласните се менят · Ünlü\nuyumu</h3>\n<p>Понеже окончанията се лепят едно за друго, турският ги „настройва“\nтака, че думата да звучи гладко. Това е <strong>гласната\nхармония</strong>: гласната в окончанието се приспособява към последната\nгласна в думата.</p>\n<p>Не е произвол — езикът избягва скокове между предната и задната част\nна устата: <code>ev-de</code> (двете гласни са предни),\n<code>okul-da</code> (двете са задни).</p>\n<p>Ще срещнеш две системи: - <strong>двойна</strong> (a/e) — за\nокончания като <code>-lar/-ler</code>, <code>-da/-de</code>,\n<code>-a/-e</code> - <strong>четворна</strong> (ı/i/u/ü) — за окончания\nкато <code>-ım/-im/-um/-üm</code>, <code>-ı/-i/-u/-ü</code></p>\n<h3 id=\"какво-е-падеж-hâl-durum\">Какво е „падеж“ · Hâl / durum</h3>\n<p>Падежът показва <strong>ролята на съществителното</strong> в\nизречението. В българския това го вършат предлозите (в, от, към) и\nсловоредът. В турския — окончание в края на думата.</p>\n<table>\n<thead>\n<tr class=\"header\">\n<th>Български</th>\n<th>Турски</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td><strong>в</strong> къщата</td>\n<td>ev<strong>de</strong></td>\n</tr>\n<tr class=\"even\">\n<td><strong>от</strong> къщата</td>\n<td>ev<strong>den</strong></td>\n</tr>\n<tr class=\"odd\">\n<td><strong>към</strong> къщата</td>\n<td>ev<strong>e</strong></td>\n</tr>\n</tbody>\n</table>\n<p>Шестте турски падежа:</p>\n<table>\n<thead>\n<tr class=\"header\">\n<th>Падеж</th>\n<th>Турски</th>\n<th>Окончание</th>\n<th>Въпрос</th>\n<th>Пример</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>основен</td>\n<td>yalın hâl</td>\n<td>—</td>\n<td>ne? kim?</td>\n<td>ev</td>\n</tr>\n<tr class=\"even\">\n<td>винителен</td>\n<td>belirtme hâli</td>\n<td>-ı/-i/-u/-ü</td>\n<td>neyi? kimi?</td>\n<td>evi</td>\n</tr>\n<tr class=\"odd\">\n<td>дателен</td>\n<td>yönelme hâli</td>\n<td>-a/-e</td>\n<td>nereye? kime?</td>\n<td>eve</td>\n</tr>\n<tr class=\"even\">\n<td>местен</td>\n<td>bulunma hâli</td>\n<td>-da/-de</td>\n<td>nerede? kimde?</td>\n<td>evde</td>\n</tr>\n<tr class=\"odd\">\n<td>изходен</td>\n<td>ayrılma hâli</td>\n<td>-dan/-den</td>\n<td>nereden? kimden?</td>\n<td>evden</td>\n</tr>\n<tr class=\"even\">\n<td>родителен</td>\n<td>ilgi hâli</td>\n<td>-ın/-in/-un/-ün</td>\n<td>kimin? neyin?</td>\n<td>evin</td>\n</tr>\n</tbody>\n</table>\n<h3 id=\"какво-е-изафет-isim-tamlaması\">Какво е „изафет“ · İsim\ntamlaması</h3>\n<p>Това е турският начин две съществителни да се свържат — там, където\nбългарският казва „на“ или прави прилагателно.</p>\n<ul>\n<li><code>oda-nın kapı-sı</code> — вратата <strong>на</strong>\nстаята</li>\n<li><code>ders kitab-ı</code> — учеб<strong>ник</strong> (книга за\nурок)</li>\n</ul>\n<p>Особеното е, че <strong>и двете думи</strong> получават окончание, а\nне само едната. Подробно в Урок 3.</p>\n<h3 id=\"какво-е-лице-kişi\">Какво е „лице“ · Kişi</h3>\n<p>Лицето показва <strong>кой</strong> върши действието: аз, ти, той,\nние, вие, те. В турския лицето се вижда от окончанието на глагола,\nзатова местоимението често се изпуска:</p>\n<ul>\n<li><code>Geliyorum.</code> — Идвам. <em>(окончанието <code>-um</code>\nвече казва „аз“)</em></li>\n<li><code>Ben geliyorum.</code> — <strong>Аз</strong> идвам. <em>(с\nнаблягане)</em></li>\n</ul>\n<h3 id=\"какво-е-наклонение-kip\">Какво е „наклонение“ · Kip</h3>\n<p>Наклонението показва <strong>отношението</strong> на говорещия към\nдействието:</p>\n<table>\n<colgroup>\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th>Наклонение</th>\n<th>Турски</th>\n<th>Пример</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>изявително (факт)</td>\n<td>haber kipi</td>\n<td>Geliyor. — Идва.</td>\n</tr>\n<tr class=\"even\">\n<td>повелително (заповед)</td>\n<td>emir kipi</td>\n<td>Gel! — Ела!</td>\n</tr>\n<tr class=\"odd\">\n<td>желателно (нека)</td>\n<td>istek kipi</td>\n<td>Gelelim. — Нека дойдем.</td>\n</tr>\n<tr class=\"even\">\n<td>условно (ако)</td>\n<td>şart kipi</td>\n<td>Gelirse — ако дойде</td>\n</tr>\n<tr class=\"odd\">\n<td>необходимост (трябва)</td>\n<td>gereklilik kipi</td>\n<td>Gelmeli. — Трябва да дойде.</td>\n</tr>\n</tbody>\n</table>\n<h3 id=\"редът-на-думите-kelime-sırası\">Редът на думите · Kelime\nsırası</h3>\n<p>Турското изречение завършва с глагола. Основната схема е:</p>\n<p><strong>подлог → допълнение → глагол</strong> (SOV)</p>\n<ul>\n<li>Ben (подлог) kitap (допълнение) okuyorum (глагол).</li>\n<li>Ali (подлог) Ayşe’yi (допълнение) seviyor (глагол).</li>\n</ul>\n<p>Българският е SVO („Аз чета книга“), турският е SOV („Аз книга\nчета“). Всичко останало — време, място, начин — стои между подлога и\nглагола:</p>\n<blockquote>\n<p><strong>Ben</strong> <em>dün akşam</em> <em>evde</em>\n<em>arkadaşımla</em> <strong>film izledim.</strong> Аз гледах филм снощи\nвкъщи с приятеля си.</p>\n</blockquote>\n<h3 id=\"пет-неща-които-турският-няма\">Пет неща, които турският НЯМА</h3>\n<p>Това улеснява много:</p>\n<ol type=\"1\">\n<li><strong>Няма род</strong> — <code>o</code> е и „той“, и „тя“, и\n„то“. Няма мъжки/женски прилагателни.</li>\n<li><strong>Няма определителен член</strong> като „-та, -ът“.\nОпределеността се показва иначе.</li>\n<li><strong>Няма глагол „съм“ като дума</strong> — той е окончание:\n<code>öğrenci-yim</code> (студент съм).</li>\n<li><strong>Няма глагол „имам“</strong> — казва се „моята книга\nсъществува“: <code>kitabım var</code>.</li>\n<li><strong>Няма неправилни глаголи</strong> (почти) — всички се спрягат\nпо едни и същи правила.</li>\n</ol>\n<h3 id=\"и-три-които-има-а-българският-няма\">И три, които има, а\nбългарският няма</h3>\n<ol type=\"1\">\n<li><strong>Гласна хармония</strong> — окончанията се менят според\nдумата.</li>\n<li><strong>Изафет</strong> — двете свързани съществителни получават\nокончания.</li>\n<li><strong>Свидетелско/несвидетелско минало</strong> —\n<code>geldi</code> (видях го да идва) срещу <code>gelmiş</code> (казаха\nми, че е дошъл). Това идва на ниво A2.</li>\n</ol>\n<hr />\n<h2 id=\"урок-1-merhaba-здравей\">УРОК 1 · Merhaba! — Здравей!</h2><figure class=\"illus\">\n<svg viewBox=\"0 0 400 150\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Поздрави през деня\">\n<line x1=\"24\" y1=\"96\" x2=\"376\" y2=\"96\" stroke=\"#D6DCD8\" stroke-width=\"2\"/>\n<g text-anchor=\"middle\">\n<g fill=\"#C9A227\"><circle cx=\"80\" cy=\"96\" r=\"9\"/></g>\n<circle cx=\"190\" cy=\"96\" r=\"9\" fill=\"#2FA3A0\"/>\n<circle cx=\"290\" cy=\"96\" r=\"9\" fill=\"#17618F\"/>\n<circle cx=\"360\" cy=\"96\" r=\"9\" fill=\"#0E2338\"/>\n<g font-size=\"12.5\" font-weight=\"700\" fill=\"#0E2338\">\n<text x=\"80\" y=\"66\">günaydın</text><text x=\"190\" y=\"66\">iyi günler</text>\n<text x=\"290\" y=\"46\">iyi akşamlar</text><text x=\"352\" y=\"66\">iyi geceler</text>\n</g>\n<g font-size=\"10\" fill=\"#5C6B72\">\n<text x=\"80\" y=\"122\">сутрин</text><text x=\"190\" y=\"122\">ден</text><text x=\"290\" y=\"122\">вечер</text><text x=\"358\" y=\"122\">нощ</text>\n</g>\n</g>\n</svg>\n<figcaption>Поздравът се сменя с часа на деня.</figcaption></figure>\n<h3 id=\"речник-sözlük\">Речник · Sözlük</h3>\n<table>\n<thead>\n<tr class=\"header\">\n<th>Турски</th>\n<th>Български</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>merhaba</td>\n<td>здравей / здравейте</td>\n</tr>\n<tr class=\"even\">\n<td>günaydın</td>\n<td>добро утро</td>\n</tr>\n<tr class=\"odd\">\n<td>iyi günler</td>\n<td>добър ден</td>\n</tr>\n<tr class=\"even\">\n<td>iyi akşamlar</td>\n<td>добър вечер</td>\n</tr>\n<tr class=\"odd\">\n<td>iyi geceler</td>\n<td>лека нощ</td>\n</tr>\n<tr class=\"even\">\n<td>hoşça kal / hoşça kalın</td>\n<td>остани/останете си със здраве</td>\n</tr>\n<tr class=\"odd\">\n<td>güle güle</td>\n<td>довиждане (на този, който си тръгва)</td>\n</tr>\n<tr class=\"even\">\n<td>görüşürüz</td>\n<td>ще се видим</td>\n</tr>\n<tr class=\"odd\">\n<td>teşekkür ederim</td>\n<td>благодаря</td>\n</tr>\n<tr class=\"even\">\n<td>rica ederim</td>\n<td>моля / няма защо</td>\n</tr>\n<tr class=\"odd\">\n<td>lütfen</td>\n<td>моля (при молба)</td>\n</tr>\n<tr class=\"even\">\n<td>evet</td>\n<td>да</td>\n</tr>\n<tr class=\"odd\">\n<td>hayır</td>\n<td>не</td>\n</tr>\n<tr class=\"even\">\n<td>ad / isim</td>\n<td>име</td>\n</tr>\n<tr class=\"odd\">\n<td>öğrenci</td>\n<td>ученик, студент</td>\n</tr>\n<tr class=\"even\">\n<td>öğretmen</td>\n<td>учител</td>\n</tr>\n<tr class=\"odd\">\n<td>doktor</td>\n<td>лекар</td>\n</tr>\n<tr class=\"even\">\n<td>mühendis</td>\n<td>инженер</td>\n</tr>\n<tr class=\"odd\">\n<td>avukat</td>\n<td>адвокат</td>\n</tr>\n<tr class=\"even\">\n<td>aşçı</td>\n<td>готвач</td>\n</tr>\n<tr class=\"odd\">\n<td>şoför</td>\n<td>шофьор</td>\n</tr>\n<tr class=\"even\">\n<td>Türk</td>\n<td>турчин</td>\n</tr>\n<tr class=\"odd\">\n<td>Bulgar</td>\n<td>българин</td>\n</tr>\n<tr class=\"even\">\n<td>nasılsın? / nasılsınız?</td>\n<td>как си? / как сте?</td>\n</tr>\n<tr class=\"odd\">\n<td>iyiyim</td>\n<td>добре съм</td>\n</tr>\n<tr class=\"even\">\n<td>memnun oldum</td>\n<td>приятно ми е</td>\n</tr>\n</tbody>\n</table>\n<h3 id=\"граматика-1.1-лични-местоимения-kişi-zamirleri\">Граматика 1.1 —\nЛични местоимения · Kişi zamirleri</h3>\n<table>\n<thead>\n<tr class=\"header\">\n<th>Турски</th>\n<th>Български</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>ben</td>\n<td>аз</td>\n</tr>\n<tr class=\"even\">\n<td>sen</td>\n<td>ти</td>\n</tr>\n<tr class=\"odd\">\n<td>o</td>\n<td>той / тя / то</td>\n</tr>\n<tr class=\"even\">\n<td>biz</td>\n<td>ние</td>\n</tr>\n<tr class=\"odd\">\n<td>siz</td>\n<td>вие</td>\n</tr>\n<tr class=\"even\">\n<td>onlar</td>\n<td>те</td>\n</tr>\n</tbody>\n</table>\n<p>Забележи: турският няма род. <code>o</code> = „той“, „тя“ и „то“.</p>\n<h3\nid=\"граматика-1.2-сказуемни-окончания-аз-съм-ти-си-ek-fiil-kişi-ekleri\">Граматика\n1.2 — Сказуемни окончания (аз съм, ти си…) · Ek fiil (kişi ekleri)</h3>\n<p>В турския няма глагол „съм“ като отделна дума. Окончанието се лепи за\nдумата:</p>\n<table>\n<thead>\n<tr class=\"header\">\n<th>Лице</th>\n<th>След <strong>e, i</strong></th>\n<th>След <strong>a, ı</strong></th>\n<th>След <strong>o, u</strong></th>\n<th>След <strong>ö, ü</strong></th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>ben</td>\n<td>-(y)im</td>\n<td>-(y)ım</td>\n<td>-(y)um</td>\n<td>-(y)üm</td>\n</tr>\n<tr class=\"even\">\n<td>sen</td>\n<td>-sin</td>\n<td>-sın</td>\n<td>-sun</td>\n<td>-sün</td>\n</tr>\n<tr class=\"odd\">\n<td>o</td>\n<td>-dir</td>\n<td>-dır</td>\n<td>-dur</td>\n<td>-dür</td>\n</tr>\n<tr class=\"even\">\n<td>biz</td>\n<td>-(y)iz</td>\n<td>-(y)ız</td>\n<td>-(y)uz</td>\n<td>-(y)üz</td>\n</tr>\n<tr class=\"odd\">\n<td>siz</td>\n<td>-siniz</td>\n<td>-sınız</td>\n<td>-sunuz</td>\n<td>-sünüz</td>\n</tr>\n<tr class=\"even\">\n<td>onlar</td>\n<td>-dirler</td>\n<td>-dırlar</td>\n<td>-durlar</td>\n<td>-dürler</td>\n</tr>\n</tbody>\n</table>\n<p>Коя гласна избираме, зависи от <strong>последната гласна на\nдумата</strong> (виж Урок 2 — гласна хармония).</p>\n<p><strong><code>y</code> се вмъква само ако думата свършва на\nгласна:</strong> <code>öğrenci</code> + <code>im</code> →\n<code>öğrenciyim</code>.</p>\n<p>За 3 л. ед.ч. окончанието <code>-dir</code> в говоримия език\nобикновено се изпуска: <code>O doktor.</code> — Той е лекар.</p>\n<p><strong>Примери:</strong></p>\n<ul>\n<li>Ben öğrenciyim. — Аз съм студент.</li>\n<li>Sen öğretmensin. — Ти си учител.</li>\n<li>O doktor. — Той/тя е лекар.</li>\n<li>Biz Bulgarız. — Ние сме българи.</li>\n<li>Siz mühendissiniz. — Вие сте инженер(и).</li>\n<li>Onlar Türk. — Те са турци.</li>\n</ul>\n<h3 id=\"граматика-1.3-отрицание-değil-olumsuzluk-değil\">Граматика 1.3 —\nОтрицание: değil · Olumsuzluk: değil</h3>\n<p><code>değil</code> = „не съм / не си / не е…“. Пише се отделно, а\nокончанието се лепи за него.</p>\n<table>\n<tbody>\n<tr class=\"odd\">\n<td>ben değilim</td>\n<td>не съм</td>\n</tr>\n<tr class=\"even\">\n<td>sen değilsin</td>\n<td>не си</td>\n</tr>\n<tr class=\"odd\">\n<td>o değil</td>\n<td>не е</td>\n</tr>\n<tr class=\"even\">\n<td>biz değiliz</td>\n<td>не сме</td>\n</tr>\n<tr class=\"odd\">\n<td>siz değilsiniz</td>\n<td>не сте</td>\n</tr>\n<tr class=\"even\">\n<td>onlar değil(ler)</td>\n<td>не са</td>\n</tr>\n</tbody>\n</table>\n<ul>\n<li>Ben doktor değilim. — Аз не съм лекар.</li>\n<li>Sen Türk değilsin. — Ти не си турчин.</li>\n<li>Biz öğrenci değiliz. — Ние не сме студенти.</li>\n</ul>\n<h3 id=\"граматика-1.4-въпрос-mı-mi-mu-mü-soru-eki\">Граматика 1.4 —\nВъпрос: mı / mi / mu / mü · Soru eki</h3>\n<p>Въпросителната частица се пише <strong>отделно</strong>, но\nокончанието се лепи за нея:</p>\n<ul>\n<li>Sen öğrenci misin? — Ти студент ли си?</li>\n<li>O doktor mu? — Той лекар ли е?</li>\n<li>Siz Bulgar mısınız? — Вие българи ли сте?</li>\n<li>Ben geç miyim? — Аз късен ли съм? (<code>y</code> след гласна)</li>\n</ul>\n<p>Изборът на гласна: след <strong>e, i</strong> → <code>mi</code>; след\n<strong>a, ı</strong> → <code>mı</code>; след <strong>o, u</strong> →\n<code>mu</code>; след <strong>ö, ü</strong> → <code>mü</code>.</p>\n<h3 id=\"защо-е-така-neden-böyle\">Защо е така · Neden böyle</h3>\n<p><strong>Защо няма „съм“?</strong> Турският го изразява с окончание,\nнаречено <em>ek fiil</em> („окончание-глагол“). <code>Öğrenciyim</code>\nбуквално е „студент-съм“ — една дума. Същото окончание се лепи и за\n<code>değil</code> (не съм) и за въпросителната частица <code>mi</code>.\nЗатова, щом научиш тези шест окончания, ще можеш да строиш изречения без\nнито един глагол.</p>\n<p><strong>Защо <code>değil</code> се пише отделно, а окончанието —\nне?</strong> Защото <code>değil</code> е самостоятелна дума („не е\nтака“), а <code>-im</code>, <code>-sin</code> са окончания. Затова:\n<code>öğrenci değilim</code> (три части: студент + не + аз), но\n<code>öğrenciyim</code> (една дума).</p>\n<p><strong>Защо въпросителната частица се пише отделно, а окончанието се\nлепи за нея?</strong> <code>mi</code> е дума, но „приема“ лицето върху\nсебе си: <code>öğrenci misin?</code> — частицата носи <code>-sin</code>.\nПравилото е просто: лицето винаги отива на последното парче в\nизречението.</p>\n<h3 id=\"диалог-за-четене-и-превод-okuma-ve-çeviri-diyaloğu\">Диалог за\nчетене и превод · Okuma ve çeviri diyaloğu</h3>\n<p><strong>Tanışma — Запознанство</strong></p>\n<blockquote>\n<p>— Merhaba! Ben Ayşe.</p>\n<p>— Merhaba Ayşe. Benim adım Petar.</p>\n<p>— Memnun oldum Petar. Sen Türk müsün?</p>\n<p>— Hayır, Türk değilim. Ben Bulgarım.</p>\n<p>— Öğrenci misin?</p>\n<p>— Evet, öğrenciyim. Sen ne iş yapıyorsun?</p>\n<p>— Ben öğretmenim.</p>\n<p>— Çok güzel! Nasılsın?</p>\n<p>— İyiyim, teşekkür ederim. Sen nasılsın?</p>\n<p>— Ben de iyiyim.</p>\n<p>— Görüşürüz Petar!</p>\n<p>— Güle güle Ayşe!</p>\n</blockquote>\n<p><em>Нови изрази:</em> <code>benim adım</code> — моето име;\n<code>ne iş yapıyorsun?</code> — с какво се занимаваш?;\n<code>çok güzel</code> — много хубаво; <code>ben de</code> — аз\nсъщо.</p>\n<h3 id=\"упражнения-alıştırmalar\">Упражнения · Alıştırmalar</h3>\n<p><strong>Упр. 1.1 — Постави правилното окончание.</strong> <em>(Doğru\neki koyun.)</em></p>\n<ol type=\"1\">\n<li>Ben öğretmen___ .</li>\n<li>Sen doktor___ .</li>\n<li>Biz Bulgar___ .</li>\n<li>Siz avukat___ .</li>\n<li>Ben aşçı___ .</li>\n<li>Sen mühendis___ .</li>\n</ol>\n<p><strong>Упр. 1.2 — Направи изреченията отрицателни.</strong>\n<em>(Cümleleri olumsuz yapın.)</em></p>\n<ol type=\"1\">\n<li>Ben öğrenciyim.</li>\n<li>Sen Türksün.</li>\n<li>O doktor.</li>\n<li>Biz mühendisiz.</li>\n<li>Siz öğretmensiniz.</li>\n</ol>\n<p><strong>Упр. 1.3 — Направи въпрос.</strong> <em>(Soru cümlesi\nyapın.)</em></p>\n<ol type=\"1\">\n<li>Sen öğrencisin.</li>\n<li>O avukat.</li>\n<li>Siz Bulgarsınız.</li>\n<li>Onlar Türk.</li>\n</ol>\n<p><strong>Упр. 1.4 — Преведи на турски.</strong> <em>(Türkçeye\nçevirin.)</em></p>\n<ol type=\"1\">\n<li>Здравей, аз съм Иван.</li>\n<li>Ти учител ли си?</li>\n<li>Не, аз не съм учител, аз съм инженер.</li>\n<li>Приятно ми е.</li>\n<li>Благодаря, добре съм.</li>\n</ol>\n<h3 id=\"допълнителни-упражнения-ek-alıştırmalar\">Допълнителни упражнения\n· Ek alıştırmalar</h3>\n<p><strong>Упр. 1.5 — Свържи въпроса с отговора.</strong> <em>(Soruyla\ncevabı eşleştirin.)</em></p>\n<ol type=\"1\">\n<li>Nasılsın?</li>\n<li>Adın ne?</li>\n<li>Sen Türk müsün?</li>\n<li>Ne iş yapıyorsun?</li>\n<li>Nerelisin?</li>\n</ol>\n<p>а) Benim adım Elif.<br />\nб) Hayır, Bulgarım.<br />\nв) İyiyim, teşekkür ederim.<br />\nг) Sofyalıyım.<br />\nд) Doktorum.</p>\n<p><strong>Упр. 1.6 — Поправи грешката.</strong> <em>(Hatayı\ndüzeltin.)</em></p>\n<ol type=\"1\">\n<li>Ben öğrencisin.</li>\n<li>Sen doktorum.</li>\n<li>O Türkim.</li>\n<li>Biz mühendissiniz.</li>\n<li>Siz avukatız.</li>\n</ol>\n<p><strong>Упр. 1.7 — Попълни диалога.</strong> <em>(Diyaloğu\ntamamlayın.)</em></p>\n<p>— Merhaba! Ben Deniz. Sen ___ ?<br />\n— Ben Petar. Memnun ___ .<br />\n— Sen Türk ___ ?<br />\n— Hayır, Türk ___ . Ben Bulgar___ .<br />\n— Ne iş ___ ?<br />\n— Öğretmen___ .</p>\n<p><strong>Упр. 1.8 — Отговори за себе си.</strong> <em>(Kendiniz için\ncevap verin.)</em></p>\n<ol type=\"1\">\n<li>Adın ne?</li>\n<li>Nerelisin?</li>\n<li>Ne iş yapıyorsun?</li>\n<li>Nasılsın?</li>\n</ol>\n<p><strong>Упр. 1.9 — Попълни с правилната въпросителна дума.</strong>\n<em>(Doğru soru kelimesiyle tamamlayın.)</em></p>\n<ol type=\"1\">\n<li>___ yapıyorsun? — Kitap okuyorum.</li>\n<li>___ geliyorsun? — Sofya’dan.</li>\n<li>___ yaşındasın? — Yirmi beş.</li>\n<li>___ o? — O benim kardeşim.</li>\n<li>___ gidiyorsun? — Okula.</li>\n<li>___ sın? — İyiyim, teşekkürler.</li>\n<li>___ geliyorsun? — Yarın.</li>\n<li>___ gelmiyorsun? — Çünkü hastayım.</li>\n</ol>\n<p><strong>Упр. 1.10 — Свържи лицето с окончанието.</strong>\n<em>(Kişiyle eki eşleştirin.)</em></p>\n<ol type=\"1\">\n<li>Ben mühendis___</li>\n<li>Sen aşçı___</li>\n<li>O avukat___</li>\n<li>Biz doktor___</li>\n<li>Siz şoför___</li>\n<li>Onlar öğrenci___</li>\n<li>Ben Bulgar___</li>\n<li>Sen Türk___</li>\n<li>Biz öğretmen___</li>\n<li>Siz mühendis___</li>\n</ol>\n<p><strong>Упр. 1.11 — Отговори утвърдително и отрицателно.</strong>\n<em>(Olumlu ve olumsuz cevap verin.)</em></p>\n<p>Пример: Sen öğrenci misin? → Evet, öğrenciyim. / Hayır, öğrenci\ndeğilim.</p>\n<ol type=\"1\">\n<li>Sen doktor musun?</li>\n<li>O Türk mü?</li>\n<li>Siz mühendis misiniz?</li>\n<li>Onlar öğretmen mi?</li>\n<li>Sen Bulgar mısın?</li>\n<li>O avukat mı?</li>\n</ol>\n<p><strong>Упр. 1.12 — Преведи на турски.</strong> <em>(Türkçeye\nçevirin.)</em></p>\n<ol type=\"1\">\n<li>На колко години си?</li>\n<li>Аз съм на тридесет години.</li>\n<li>Откъде сте?</li>\n<li>Той не е лекар, той е инженер.</li>\n<li>Вие учители ли сте?</li>\n<li>Защо не идваш?</li>\n<li>Кога идваш?</li>\n<li>Как се казваш?</li>\n</ol>\n<hr />\n<h2 id=\"урок-2-bu-ne-какво-е-това\">УРОК 2 · Bu ne? — Какво е това?</h2><figure class=\"illus\">\n<svg viewBox=\"0 0 400 210\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Дебели и тънки гласни\">\n<rect x=\"8\" y=\"8\" width=\"184\" height=\"194\" rx=\"12\" fill=\"#EAF2F6\" stroke=\"#17618F\"/>\n<rect x=\"208\" y=\"8\" width=\"184\" height=\"194\" rx=\"12\" fill=\"#FBEDEA\" stroke=\"#C24632\"/>\n<text x=\"100\" y=\"34\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"700\" fill=\"#17618F\">ДЕБЕЛИ (задни)</text>\n<text x=\"300\" y=\"34\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"700\" fill=\"#C24632\">ТЪНКИ (предни)</text>\n<g font-size=\"30\" font-weight=\"600\" text-anchor=\"middle\" fill=\"#0E2338\">\n<text x=\"55\" y=\"90\">a</text><text x=\"145\" y=\"90\">ı</text>\n<text x=\"55\" y=\"150\">o</text><text x=\"145\" y=\"150\">u</text>\n<text x=\"255\" y=\"90\">e</text><text x=\"345\" y=\"90\">i</text>\n<text x=\"255\" y=\"150\">ö</text><text x=\"345\" y=\"150\">ü</text>\n</g>\n<g font-size=\"10\" text-anchor=\"middle\" fill=\"#5C6B72\">\n<text x=\"55\" y=\"106\">-a / -ı</text><text x=\"145\" y=\"106\">-a / -ı</text>\n<text x=\"55\" y=\"166\">-a / -u</text><text x=\"145\" y=\"166\">-a / -u</text>\n<text x=\"255\" y=\"106\">-e / -i</text><text x=\"345\" y=\"106\">-e / -i</text>\n<text x=\"255\" y=\"166\">-e / -ü</text><text x=\"345\" y=\"166\">-e / -ü</text>\n</g>\n<text x=\"200\" y=\"196\" text-anchor=\"middle\" font-size=\"11\" fill=\"#5C6B72\">окончанието следва последната гласна на думата</text>\n</svg>\n<figcaption>Гласната хармония: думата „тегли“ окончанието към своята група.</figcaption></figure>\n<h3 id=\"речник-sözlük-1\">Речник · Sözlük</h3>\n<table>\n<thead>\n<tr class=\"header\">\n<th>Турски</th>\n<th>Български</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>bu</td>\n<td>този, тази, това (близко)</td>\n</tr>\n<tr class=\"even\">\n<td>şu</td>\n<td>онзи (по-далече, посочено)</td>\n</tr>\n<tr class=\"odd\">\n<td>o</td>\n<td>онзи, онова (далечно)</td>\n</tr>\n<tr class=\"even\">\n<td>ne</td>\n<td>какво</td>\n</tr>\n<tr class=\"odd\">\n<td>kim</td>\n<td>кой</td>\n</tr>\n<tr class=\"even\">\n<td>nerede</td>\n<td>къде</td>\n</tr>\n<tr class=\"odd\">\n<td>masa</td>\n<td>маса</td>\n</tr>\n<tr class=\"even\">\n<td>sandalye</td>\n<td>стол</td>\n</tr>\n<tr class=\"odd\">\n<td>kitap</td>\n<td>книга</td>\n</tr>\n<tr class=\"even\">\n<td>defter</td>\n<td>тетрадка</td>\n</tr>\n<tr class=\"odd\">\n<td>kalem</td>\n<td>молив, химикал</td>\n</tr>\n<tr class=\"even\">\n<td>çanta</td>\n<td>чанта</td>\n</tr>\n<tr class=\"odd\">\n<td>ev</td>\n<td>къща, дом</td>\n</tr>\n<tr class=\"even\">\n<td>oda</td>\n<td>стая</td>\n</tr>\n<tr class=\"odd\">\n<td>okul</td>\n<td>училище</td>\n</tr>\n<tr class=\"even\">\n<td>sınıf</td>\n<td>клас, класна стая</td>\n</tr>\n<tr class=\"odd\">\n<td>araba</td>\n<td>кола</td>\n</tr>\n<tr class=\"even\">\n<td>şehir</td>\n<td>град</td>\n</tr>\n<tr class=\"odd\">\n<td>köy</td>\n<td>село</td>\n</tr>\n<tr class=\"even\">\n<td>var</td>\n<td>има</td>\n</tr>\n<tr class=\"odd\">\n<td>yok</td>\n<td>няма</td>\n</tr>\n<tr class=\"even\">\n<td>ve</td>\n<td>и</td>\n</tr>\n<tr class=\"odd\">\n<td>ama</td>\n<td>но</td>\n</tr>\n<tr class=\"even\">\n<td>çok</td>\n<td>много</td>\n</tr>\n<tr class=\"odd\">\n<td>güzel</td>\n<td>хубав, красив</td>\n</tr>\n<tr class=\"even\">\n<td>büyük</td>\n<td>голям</td>\n</tr>\n<tr class=\"odd\">\n<td>küçük</td>\n<td>малък</td>\n</tr>\n<tr class=\"even\">\n<td>yeni</td>\n<td>нов</td>\n</tr>\n<tr class=\"odd\">\n<td>eski</td>\n<td>стар</td>\n</tr>\n</tbody>\n</table>\n<h3 id=\"граматика-2.1-гласна-хармония-ünlü-uyumu-ünlü-uyumu\">Граматика\n2.1 — Гласна хармония (ünlü uyumu) · Ünlü uyumu</h3>\n<p>Това е <strong>най-важното правило в турския език</strong>. Гласните\nв окончанията се приспособяват към последната гласна на думата.</p>\n<p>Турските гласни се делят така:</p>\n<ul>\n<li><strong>Дебели (задни):</strong> a, ı, o, u</li>\n<li><strong>Тънки (предни):</strong> e, i, ö, ü</li>\n</ul>\n<p><strong>Малка (двойна) хармония — окончания с\n<code>a/e</code>:</strong></p>\n<table>\n<thead>\n<tr class=\"header\">\n<th>Последна гласна в думата</th>\n<th>Окончание</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>a, ı, o, u</td>\n<td><strong>-a</strong></td>\n</tr>\n<tr class=\"even\">\n<td>e, i, ö, ü</td>\n<td><strong>-e</strong></td>\n</tr>\n</tbody>\n</table>\n<p>Примери: <code>masa</code> → <code>masalar</code>, <code>ev</code> →\n<code>evler</code>, <code>okul</code> → <code>okullar</code>,\n<code>göz</code> → <code>gözler</code>.</p>\n<p><strong>Голяма (четворна) хармония — окончания с\n<code>ı/i/u/ü</code>:</strong></p>\n<table>\n<thead>\n<tr class=\"header\">\n<th>Последна гласна в думата</th>\n<th>Окончание</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>a, ı</td>\n<td><strong>-ı</strong></td>\n</tr>\n<tr class=\"even\">\n<td>e, i</td>\n<td><strong>-i</strong></td>\n</tr>\n<tr class=\"odd\">\n<td>o, u</td>\n<td><strong>-u</strong></td>\n</tr>\n<tr class=\"even\">\n<td>ö, ü</td>\n<td><strong>-ü</strong></td>\n</tr>\n</tbody>\n</table>\n<p>Примери: <code>kız</code> → <code>kızım</code>, <code>ev</code> →\n<code>evim</code>, <code>okul</code> → <code>okulum</code>,\n<code>göz</code> → <code>gözüm</code>.</p>\n<h3 id=\"граматика-2.2-множествено-число--lar--ler-çoğul-eki\">Граматика\n2.2 — Множествено число: -lar / -ler · Çoğul eki</h3>\n<table>\n<thead>\n<tr class=\"header\">\n<th>Ед.ч.</th>\n<th>Мн.ч.</th>\n<th>Превод</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>kitap</td>\n<td>kitap<strong>lar</strong></td>\n<td>книги</td>\n</tr>\n<tr class=\"even\">\n<td>ev</td>\n<td>ev<strong>ler</strong></td>\n<td>къщи</td>\n</tr>\n<tr class=\"odd\">\n<td>okul</td>\n<td>okul<strong>lar</strong></td>\n<td>училища</td>\n</tr>\n<tr class=\"even\">\n<td>öğrenci</td>\n<td>öğrenci<strong>ler</strong></td>\n<td>студенти</td>\n</tr>\n<tr class=\"odd\">\n<td>çocuk</td>\n<td>çocuk<strong>lar</strong></td>\n<td>деца</td>\n</tr>\n</tbody>\n</table>\n<p><strong>Важно:</strong> след число НЕ се слага\n<code>-lar/-ler</code>: <code>beş kitap</code> (пет книги), не <del>beş\nkitaplar</del>.</p>\n<h3\nid=\"граматика-2.3-показателни-местоимения-işaret-zamirleri\">Граматика\n2.3 — Показателни местоимения · İşaret zamirleri</h3>\n<ul>\n<li><strong>Bu</strong> — това (тук, до мен): <code>Bu bir kitap.</code>\n— Това е книга.</li>\n<li><strong>Şu</strong> — това/онова (малко по-далече, посочвам):\n<code>Şu masa.</code> — Онази маса.</li>\n<li><strong>O</strong> — онова (далече): <code>O ev büyük.</code> —\nОнази къща е голяма.</li>\n</ul>\n<p>Мн.ч.: <code>bunlar</code>, <code>şunlar</code>,\n<code>onlar</code>.</p>\n<ul>\n<li>Bu ne? — Bu bir kalem. → Какво е това? — Това е молив.</li>\n<li>Bunlar ne? — Bunlar kitaplar. → Какви са тези? — Това са книги.</li>\n<li>Bu kim? — Bu Ali. → Кой е този? — Това е Али.</li>\n</ul>\n<h3 id=\"граматика-2.4-местен-падеж--da--de-в-на-bulunma-hâli\">Граматика\n2.4 — Местен падеж: -da / -de (в, на) · Bulunma hâli</h3>\n<p>Отговаря на въпроса <strong>nerede?</strong> (къде?).</p>\n<table>\n<thead>\n<tr class=\"header\">\n<th>Последна гласна</th>\n<th>Окончание</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>a, ı, o, u</td>\n<td><strong>-da</strong></td>\n</tr>\n<tr class=\"even\">\n<td>e, i, ö, ü</td>\n<td><strong>-de</strong></td>\n</tr>\n</tbody>\n</table>\n<p><strong>Правило за твърдите съгласни:</strong> ако думата свършва на\n<code>ç, f, h, k, p, s, ş, t</code> (запомни ги с израза\n<strong>„FıSTıKÇı ŞaHaP“</strong>), окончанието става <strong>-ta /\n-te</strong>.</p>\n<table>\n<thead>\n<tr class=\"header\">\n<th>Дума</th>\n<th>+ местен падеж</th>\n<th>Превод</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>ev</td>\n<td>ev<strong>de</strong></td>\n<td>вкъщи</td>\n</tr>\n<tr class=\"even\">\n<td>okul</td>\n<td>okul<strong>da</strong></td>\n<td>в училище</td>\n</tr>\n<tr class=\"odd\">\n<td>kitap</td>\n<td>kitap<strong>ta</strong></td>\n<td>в книгата</td>\n</tr>\n<tr class=\"even\">\n<td>sınıf</td>\n<td>sınıf<strong>ta</strong></td>\n<td>в класната стая</td>\n</tr>\n<tr class=\"odd\">\n<td>İstanbul</td>\n<td>İstanbul’<strong>da</strong></td>\n<td>в Истанбул</td>\n</tr>\n</tbody>\n</table>\n<p><em>Собствените имена се пишат с апостроф пред окончанието:\n<code>Ali'de</code>, <code>Sofya'da</code>.</em></p>\n<h3 id=\"граматика-2.5-var-yok-има-няма-var-yok\">Граматика 2.5 — var /\nyok (има / няма) · var / yok</h3>\n<p>Глаголът стои <strong>накрая</strong> на изречението.</p>\n<ul>\n<li>Masada bir kitap var. — На масата има книга.</li>\n<li>Odada sandalye yok. — В стаята няма стол.</li>\n<li>Sınıfta öğrenciler var mı? — В класната стая има ли ученици?</li>\n<li>Evet, var. / Hayır, yok. — Да, има. / Не, няма.</li>\n</ul>\n<h3\nid=\"граматика-1.5-кога-се-изпуска--dir--dir-eki-ne-zaman-düşer\">Граматика\n1.5 — Кога се изпуска <code>-dir</code> · „-dir“ eki ne zaman düşer</h3>\n<p>Окончанието за 3 л. ед.ч. <code>-dir/-dır/-dur/-dür</code> в\nговоримия език почти винаги отпада:</p>\n<ul>\n<li>O doktor. — Той е лекар. <em>(обичайно)</em></li>\n<li>O doktordur. — Той е лекар. <em>(официално, в документи и\nучебници)</em></li>\n</ul>\n<p><code>-dir</code> се запазва в три случая:</p>\n<ol type=\"1\">\n<li><strong>Официален стил:</strong> <code>Toplantı saat üçtedir.</code>\n— Срещата е в три часа.</li>\n<li><strong>Общи истини:</strong> <code>Dünya yuvarlaktır.</code> —\nЗемята е кръгла.</li>\n<li><strong>Предположение:</strong> <code>Şimdi evdedir.</code> —\nСигурно вече си е вкъщи.</li>\n</ol>\n<h3 id=\"граматика-1.6-учтивото-siz-nezaket-siz\">Граматика 1.6 — Учтивото\n<code>siz</code> · Nezaket „siz“</h3>\n<p>Както в българския, <code>siz</code> е и „вие“ (мн.ч.), и учтива\nформа към един човек:</p>\n<ul>\n<li>Siz öğretmen misiniz? — Вие учител(ка) ли сте? <em>(към един човек,\nучтиво)</em></li>\n<li>Siz öğretmen misiniz? — Вие учители ли сте? <em>(към\nгрупа)</em></li>\n</ul>\n<p>Правило: към непознат, по-възрастен или в работна среда — винаги\n<code>siz</code>. Между приятели и връстници — <code>sen</code>.</p>\n<h3 id=\"граматика-1.7-въпросителни-думи-soru-kelimeleri\">Граматика 1.7 —\nВъпросителни думи · Soru kelimeleri</h3>\n<table>\n<thead>\n<tr class=\"header\">\n<th>Дума</th>\n<th>Значение</th>\n<th>Пример</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>ne</td>\n<td>какво</td>\n<td>Bu ne? — Какво е това?</td>\n</tr>\n<tr class=\"even\">\n<td>kim</td>\n<td>кой</td>\n<td>O kim? — Кой е той?</td>\n</tr>\n<tr class=\"odd\">\n<td>nerede</td>\n<td>къде</td>\n<td>Ali nerede? — Къде е Али?</td>\n</tr>\n<tr class=\"even\">\n<td>nereli</td>\n<td>откъде (по произход)</td>\n<td>Nerelisin? — Откъде си?</td>\n</tr>\n<tr class=\"odd\">\n<td>nasıl</td>\n<td>как</td>\n<td>Nasılsın? — Как си?</td>\n</tr>\n<tr class=\"even\">\n<td>kaç</td>\n<td>колко (брой)</td>\n<td>Kaç yaşındasın? — На колко години си?</td>\n</tr>\n<tr class=\"odd\">\n<td>ne zaman</td>\n<td>кога</td>\n<td>Ne zaman geliyorsun? — Кога идваш?</td>\n</tr>\n<tr class=\"even\">\n<td>neden / niçin</td>\n<td>защо</td>\n<td>Neden gelmiyorsun? — Защо не идваш?</td>\n</tr>\n</tbody>\n</table>\n<p><strong>Важно:</strong> въпросителната дума стои непосредствено пред\nглагола, а не в началото: <code>Sen ne yapıyorsun?</code> (не <del>Ne\nsen yapıyorsun?</del>)</p>\n<h3 id=\"граматика-1.8-възраст-yaş\">Граматика 1.8 — Възраст · Yaş</h3>\n<p>Възрастта се казва с <code>yaşında</code> (буквално „на…\nвъзраст“):</p>\n<ul>\n<li>Kaç yaşındasın? — На колко години си?</li>\n<li>Yirmi beş yaşındayım. — На двадесет и пет съм.</li>\n<li>O otuz yaşında. — Той е на тридесет.</li>\n<li>Kardeşim on iki yaşında. — Брат ми е на дванадесет.</li>\n</ul>\n<h3\nid=\"граматика-2.6-изключения-от-гласната-хармония-ünlü-uyumunun-istisnaları\">Граматика\n2.6 — Изключения от гласната хармония · Ünlü uyumunun istisnaları</h3>\n<p>Някои думи и окончания НЕ спазват хармонията:</p>\n<p><strong>А) Заемки</strong> (най-често от арабски, персийски и\nфренски). При тях последната съгласна се изговаря меко (палатализирано),\nзатова окончанието е тънко, макар гласната да е дебела:</p>\n<table>\n<thead>\n<tr class=\"header\">\n<th>Дума</th>\n<th>Очаквано по правилото</th>\n<th>Действително</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>saat (час)</td>\n<td><del>saatta</del></td>\n<td>saat<strong>te</strong>, saat<strong>i</strong></td>\n</tr>\n<tr class=\"even\">\n<td>kalp (сърце)</td>\n<td><del>kalpı</del></td>\n<td>kalb<strong>i</strong></td>\n</tr>\n<tr class=\"odd\">\n<td>hâl (положение)</td>\n<td><del>hâla</del></td>\n<td>hâl<strong>e</strong>, hâl<strong>i</strong></td>\n</tr>\n<tr class=\"even\">\n<td>rol (роля)</td>\n<td><del>rolu</del></td>\n<td>rol<strong>ü</strong></td>\n</tr>\n<tr class=\"odd\">\n<td>harf (буква)</td>\n<td><del>harfı</del></td>\n<td>harf<strong>i</strong></td>\n</tr>\n<tr class=\"even\">\n<td>kabul (приемане)</td>\n<td><del>kabulu</del></td>\n<td>kabul<strong>ü</strong></td>\n</tr>\n<tr class=\"odd\">\n<td>gol (гол)</td>\n<td><del>golu</del></td>\n<td>gol<strong>ü</strong></td>\n</tr>\n</tbody>\n</table>\n<p>Забележи общото: завършват на <code>l</code>, <code>t</code>,\n<code>f</code>, <code>p</code> след дебела гласна, но се произнасят\nмеко. Учат се поединично — не са много.</p>\n<p><strong>Б) Окончания, които никога не се менят:</strong></p>\n<table>\n<thead>\n<tr class=\"header\">\n<th>Окончание</th>\n<th>Значение</th>\n<th>Пример</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>-yor</td>\n<td>сегашно време</td>\n<td>geliyor, bakıyor, gülüyor</td>\n</tr>\n<tr class=\"even\">\n<td>-ken</td>\n<td>докато</td>\n<td>gelirken, okurken</td>\n</tr>\n<tr class=\"odd\">\n<td>-leyin</td>\n<td>по (време на деня)</td>\n<td>sabahleyin, akşamleyin</td>\n</tr>\n<tr class=\"even\">\n<td>-(i)mtırak</td>\n<td>нещо като</td>\n<td>yeşilimtırak (зеленикав)</td>\n</tr>\n<tr class=\"odd\">\n<td>-gil</td>\n<td>семейството на</td>\n<td>Ali<strong>gil</strong> (у Алиеви)</td>\n</tr>\n</tbody>\n</table>\n<p><strong>В) Съставни думи</strong> — всяка част пази своята хармония:\n<code>bugün</code> (bu + gün), <code>hanımeli</code>,\n<code>Çanakkale</code></p>\n<h3\nid=\"граматика-2.7-bir-неопределителен-член-belirsizlik-sıfatı-bir\">Граматика\n2.7 — <code>bir</code> — неопределителен член · Belirsizlik sıfatı\n„bir“</h3>\n<p><code>bir</code> означава „един“, но и „някакъв, един“:</p>\n<ul>\n<li>Bu bir kitap. — Това е (една) книга.</li>\n<li>Masada bir kalem var. — На масата има един/някакъв молив.</li>\n<li>Bir arkadaşım geldi. — Дойде един мой приятел.</li>\n</ul>\n<p><strong>Кога се слага и кога не:</strong></p>\n<table>\n<colgroup>\n<col style=\"width: 50%\" />\n<col style=\"width: 50%\" />\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th>Без <code>bir</code></th>\n<th>С <code>bir</code></th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>O öğretmen. — Той е учител. <em>(професия като качество)</em></td>\n<td>O bir öğretmen. — Той е учител. <em>(причислява го към\nгрупата)</em></td>\n</tr>\n<tr class=\"even\">\n<td>Kitap okuyorum. — Чета книга. <em>(занимание изобщо)</em></td>\n<td>Bir kitap okuyorum. — Чета една книга. <em>(конкретен, но неназован\nекземпляр)</em></td>\n</tr>\n</tbody>\n</table>\n<p>При професия и националност <code>bir</code> обикновено се пропуска:\n<code>O doktor.</code>, <code>Ben Bulgarım.</code> — не <del>O bir\ndoktor</del> в неутрален контекст.</p>\n<h3 id=\"граматика-2.8-прилагателните-sıfatlar\">Граматика 2.8 —\nПрилагателните · Sıfatlar</h3>\n<p>Прилагателното стои <strong>пред</strong> съществителното и не се\nмени по число и род:</p>\n<ul>\n<li>büyük ev — голяма къща</li>\n<li>büyük evler — големи къщи</li>\n<li>güzel kız — красиво момиче</li>\n<li>güzel kızlar — красиви момичета</li>\n</ul>\n<p><strong>Мястото на <code>bir</code> мени смисъла</strong> — тънкост,\nкоято българите често бъркат:</p>\n<table>\n<colgroup>\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th>Ред</th>\n<th>Пример</th>\n<th>Значение</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>прилагателно + <strong>bir</strong> + съществително</td>\n<td><strong>büyük bir ev</strong></td>\n<td>голяма къща <em>(неутрално, обичайното)</em></td>\n</tr>\n<tr class=\"even\">\n<td><strong>bir</strong> + прилагателно + съществително</td>\n<td><strong>bir büyük ev</strong></td>\n<td>една голяма къща <em>(наблягане на бройката)</em></td>\n</tr>\n</tbody>\n</table>\n<p>В огромното мнозинство случаи верният ред е\n<code>büyük bir ev</code>. Формата <code>bir büyük ev</code> се среща\nпри изброяване или контраст: <code>Bir büyük, bir küçük ev aldık.</code>\n— Купихме една голяма и една малка къща.</p>\n<p><strong>Основни двойки прилагателни:</strong></p>\n<div class=\"line-block\">büyük / küçük | голям / малък |<br />\nuzun / kısa | дълъг / къс |<br />\nyeni / eski | нов / стар |<br />\niyi / kötü | добър / лош |<br />\ngüzel / çirkin | красив / грозен |<br />\nkolay / zor | лесен / труден |<br />\nucuz / pahalı | евтин / скъп |<br />\ntemiz / kirli | чист / мръсен |<br />\nsıcak / soğuk | горещ / студен |<br />\naçık / kapalı | отворен / затворен |</div>\n<h3\nid=\"граматика-2.9-ред-на-думите-в-изречението-с-varyok-varyok-cümlesinde-kelime-sırası\">Граматика\n2.9 — Ред на думите в изречението с <code>var/yok</code> · „var/yok“\ncümlesinde kelime sırası</h3>\n<p>Основната схема е: <strong>място (в местен падеж) + предмет +\nvar/yok</strong></p>\n<ul>\n<li>Masa<strong>da</strong> kitap var. — На масата има книга.</li>\n<li>Oda<strong>da</strong> kimse yok. — В стаята няма никого.</li>\n<li>Bahçe<strong>de</strong> iki ağaç var. — В градината има две\nдървета.</li>\n</ul>\n<p>За притежание („имам“) се използва същата схема: -\nBen<strong>im</strong> bir araba<strong>m</strong> var. — Имам кола. -\nSen<strong>in</strong> kardeş<strong>in</strong> var mı? — Имаш ли\nбрат/сестра? - On<strong>un</strong> para<strong>sı</strong> yok. — Той\nняма пари.</p>\n<h3 id=\"защо-е-така-neden-böyle-1\">Защо е така · Neden böyle</h3>\n<p><strong>Защо <code>-lar/-ler</code> изчезва след число?</strong>\nЗащото числото вече казва, че са много. Турският не повтаря една и съща\nинформация два пъти. <code>beş kitap</code> — „пет книга“. Същото важи и\nза <code>çok</code>, <code>az</code>, <code>birkaç</code>:\n<code>çok kitap</code> (много книги), <code>birkaç öğrenci</code>\n(няколко ученици).</p>\n<p><strong>Защо <code>d</code> става <code>t</code> в\n<code>sınıfta</code>?</strong> Заради лекотата на изговора. След\nбеззвучна съгласна (<code>ç, f, h, k, p, s, ş, t</code>) езикът трудно\nпреминава към звучното <code>d</code>, затова то се обеззвучава в\n<code>t</code>. Същото прави и българският: „сграда“ но „скъп“.\nМнемониката е измислена дума <strong>„FıSTıKÇı ŞaHaP“</strong> (Шахап,\nпродавачът на шам-фъстък) — в нея са всичките осем букви.</p>\n<p><strong>Защо <code>var</code> и <code>yok</code> стоят в\nкрая?</strong> Защото те са сказуемото — а сказуемото в турския винаги е\nнакрая. <code>Masada kitap var.</code> = „На-масата книга има.“</p>\n<h3 id=\"текст-за-четене-и-превод-okuma-ve-çeviri-metni\">Текст за четене\nи превод · Okuma ve çeviri metni</h3>\n<p><strong>Benim odam — Моята стая</strong></p>\n<blockquote>\n<p>Bu benim odam. Odam çok büyük değil ama çok güzel. Odada bir masa,\niki sandalye ve bir yatak var. Masada bir bilgisayar, kitaplar ve\ndefterler var. Kalemler çantada. Duvarda bir harita var. Odada\ntelevizyon yok. Pencere büyük ve odam çok aydınlık. Ben odamı çok\nseviyorum.</p>\n</blockquote>\n<p><em>Нови думи:</em> <code>yatak</code> — легло;\n<code>bilgisayar</code> — компютър; <code>duvar</code> — стена;\n<code>harita</code> — карта; <code>pencere</code> — прозорец;\n<code>aydınlık</code> — светъл; <code>seviyorum</code> — обичам.</p>\n<p><strong>Въпроси към текста (отговори на турски):</strong></p>\n<ol type=\"1\">\n<li>Odada kaç sandalye var?</li>\n<li>Masada ne var?</li>\n<li>Odada televizyon var mı?</li>\n<li>Kalemler nerede?</li>\n</ol>\n<h3 id=\"упражнения-alıştırmalar-1\">Упражнения · Alıştırmalar</h3>\n<p><strong>Упр. 2.1 — Постави в множествено число.</strong> <em>(Çoğul\nyapın.)</em></p>\n<ol type=\"1\">\n<li>ev</li>\n<li>kitap</li>\n<li>öğretmen</li>\n<li>araba</li>\n<li>göz</li>\n<li>okul</li>\n<li>şehir</li>\n<li>çocuk</li>\n</ol>\n<p><strong>Упр. 2.2 — Постави местен падеж (-da/-de/-ta/-te).</strong>\n<em>(Bulunma hâli ekleyin (-da/-de/-ta/-te).)</em></p>\n<ol type=\"1\">\n<li>okul</li>\n<li>ev</li>\n<li>sınıf</li>\n<li>masa</li>\n<li>çanta</li>\n<li>İzmir</li>\n<li>sokak</li>\n<li>şehir</li>\n</ol>\n<p><strong>Упр. 2.3 — Попълни с <code>var</code> или\n<code>yok</code>.</strong> <em>(„var“ veya „yok“ ile\ntamamlayın.)</em></p>\n<ol type=\"1\">\n<li>Masada bir kitap ___ . (има)</li>\n<li>Odada televizyon ___ . (няма)</li>\n<li>Sınıfta öğrenciler ___ . (има)</li>\n<li>Evde su ___ . (няма)</li>\n</ol>\n<p><strong>Упр. 2.4 — Преведи на турски.</strong> <em>(Türkçeye\nçevirin.)</em></p>\n<ol type=\"1\">\n<li>Това е книга.</li>\n<li>Какво е онова?</li>\n<li>В стаята има две маси.</li>\n<li>В чантата няма молив.</li>\n<li>Тези къщи са стари.</li>\n</ol>\n<h3 id=\"допълнителни-упражнения-ek-alıştırmalar-1\">Допълнителни\nупражнения · Ek alıştırmalar</h3>\n<p><strong>Упр. 2.5 — Кое окончание: -da, -de, -ta или -te?</strong>\n<em>(Hangi ek: -da, -de, -ta, -te?)</em></p>\n<ol type=\"1\">\n<li>park</li>\n<li>bahçe</li>\n<li>dolap</li>\n<li>sokak</li>\n<li>otobüs</li>\n<li>hastane</li>\n<li>mutfak</li>\n<li>deniz</li>\n</ol>\n<p><strong>Упр. 2.6 — Отговори на въпроса с <code>var</code> или\n<code>yok</code>.</strong> <em>(Soruya „var“ veya „yok“ ile cevap\nverin.)</em></p>\n<ol type=\"1\">\n<li>Sınıfta öğretmen var mı? (да)</li>\n<li>Çantanda kitap var mı? (не)</li>\n<li>Evde su var mı? (да)</li>\n<li>Odada televizyon var mı? (не)</li>\n</ol>\n<p><strong>Упр. 2.7 — Постави прилагателното на правилното\nмясто.</strong> <em>(Sıfatı doğru yere koyun.)</em></p>\n<ol type=\"1\">\n<li>ev / büyük → …</li>\n<li>kitap / yeni → …</li>\n<li>şehir / güzel → …</li>\n<li>araba / eski → …</li>\n</ol>\n<p><strong>Упр. 2.8 — Опиши стаята си (5 изречения).</strong>\n<em>(Odanızı anlatın (beş cümle).)</em></p>\n<p>Използвай: <code>Odamda … var / yok</code>,\n<code>… büyük / küçük</code>, <code>… masada</code>.</p>\n<p><strong>Упр. 2.9 — Постави в множествено число и добави местен\nпадеж.</strong> <em>(Çoğul yapın ve bulunma hâli ekleyin.)</em></p>\n<p>Пример: ev → evler → evlerde</p>\n<ol type=\"1\">\n<li>okul</li>\n<li>kitap</li>\n<li>sokak</li>\n<li>bahçe</li>\n<li>şehir</li>\n<li>araba</li>\n<li>sınıf</li>\n<li>öğrenci</li>\n</ol>\n<p><strong>Упр. 2.10 — Свържи противоположните прилагателни.</strong>\n<em>(Zıt anlamlı sıfatları eşleştirin.)</em></p>\n<ol type=\"1\">\n<li>büyük</li>\n<li>yeni</li>\n<li>uzun</li>\n<li>ucuz</li>\n<li>sıcak</li>\n<li>temiz</li>\n<li>kolay</li>\n<li>açık</li>\n</ol>\n<p>а) kapalı б) küçük в) kısa г) eski д) pahalı е) soğuk ж) kirli з)\nzor</p>\n<p><strong>Упр. 2.11 — Направи изречения с <code>var</code> или\n<code>yok</code>.</strong> <em>(„var“ veya „yok“ ile cümle\nkurun.)</em></p>\n<p>Пример: masa / kitap (има) → Masada bir kitap var.</p>\n<ol type=\"1\">\n<li>oda / televizyon (няма)</li>\n<li>bahçe / ağaç (има)</li>\n<li>çanta / kalem (има)</li>\n<li>sınıf / öğrenci (няма)</li>\n<li>ev / bahçe (има)</li>\n<li>sokak / araba (няма)</li>\n</ol>\n<p><strong>Упр. 2.12 — Преведи изразите за притежание.</strong>\n<em>(Sahiplik ifadelerini çevirin.)</em></p>\n<ol type=\"1\">\n<li>Имам една кола.</li>\n<li>Имаш ли брат?</li>\n<li>Той няма пари.</li>\n<li>Имаме голяма къща.</li>\n<li>Имате ли време? (<code>zaman</code>)</li>\n<li>Те нямат деца. (<code>çocuk</code>)</li>\n</ol>\n<p><strong>Упр. 2.13 — Постави прилагателното на мястото му.</strong>\n<em>(Sıfatı doğru yere koyun.)</em></p>\n<ol type=\"1\">\n<li>ev / eski / bir</li>\n<li>kitap / yeni / iki</li>\n<li>kız / güzel / bir</li>\n<li>araba / pahalı / bu</li>\n<li>şehir / büyük / bir</li>\n<li>çay / sıcak / bir</li>\n</ol>\n<hr />\n<h2 id=\"урок-3-benim-kitabım-моята-книга\">УРОК 3 · Benim kitabım — Моята\nкнига</h2><figure class=\"illus\">\n<svg viewBox=\"0 0 400 190\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Семейно дърво\">\n<g stroke=\"#D6DCD8\" stroke-width=\"2\" fill=\"none\">\n<path d=\"M120 46 H280\"/><path d=\"M200 46 V78\"/><path d=\"M90 100 H310\"/>\n<path d=\"M90 100 V78\"/><path d=\"M200 100 V78\"/><path d=\"M310 100 V78\"/>\n</g>\n<g text-anchor=\"middle\">\n<g fill=\"#17618F\"><circle cx=\"120\" cy=\"34\" r=\"22\"/><circle cx=\"280\" cy=\"34\" r=\"22\"/></g>\n<g fill=\"#fff\" font-size=\"12\" font-weight=\"700\"><text x=\"120\" y=\"38\">anne</text><text x=\"280\" y=\"38\">baba</text></g>\n<g fill=\"#fff\" font-size=\"9\"><text x=\"120\" y=\"70\" fill=\"#5C6B72\">майка</text><text x=\"280\" y=\"70\" fill=\"#5C6B72\">баща</text></g>\n<g fill=\"#C24632\"><circle cx=\"90\" cy=\"126\" r=\"22\"/><circle cx=\"200\" cy=\"126\" r=\"22\"/><circle cx=\"310\" cy=\"126\" r=\"22\"/></g>\n<g fill=\"#fff\" font-size=\"11.5\" font-weight=\"700\"><text x=\"90\" y=\"130\">abla</text><text x=\"200\" y=\"130\">ben</text><text x=\"310\" y=\"130\">kardeş</text></g>\n<g font-size=\"9\" fill=\"#5C6B72\"><text x=\"90\" y=\"164\">по-голяма сестра</text><text x=\"200\" y=\"164\">аз</text><text x=\"310\" y=\"164\">по-малък брат/сестра</text></g>\n</g>\n</svg>\n<figcaption>Aile — семейството. Турският различава по-голям и по-малък брат/сестра.</figcaption></figure>\n<h3 id=\"речник-sözlük-2\">Речник · Sözlük</h3>\n<table>\n<thead>\n<tr class=\"header\">\n<th>Турски</th>\n<th>Български</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>anne</td>\n<td>майка</td>\n</tr>\n<tr class=\"even\">\n<td>baba</td>\n<td>баща</td>\n</tr>\n<tr class=\"odd\">\n<td>kardeş</td>\n<td>брат/сестра (по-малък)</td>\n</tr>\n<tr class=\"even\">\n<td>abi / ağabey</td>\n<td>по-голям брат</td>\n</tr>\n<tr class=\"odd\">\n<td>abla</td>\n<td>по-голяма сестра</td>\n</tr>\n<tr class=\"even\">\n<td>oğul</td>\n<td>син</td>\n</tr>\n<tr class=\"odd\">\n<td>kız</td>\n<td>дъщеря; момиче</td>\n</tr>\n<tr class=\"even\">\n<td>eş</td>\n<td>съпруг(а)</td>\n</tr>\n<tr class=\"odd\">\n<td>aile</td>\n<td>семейство</td>\n</tr>\n<tr class=\"even\">\n<td>arkadaş</td>\n<td>приятел</td>\n</tr>\n<tr class=\"odd\">\n<td>komşu</td>\n<td>съсед</td>\n</tr>\n<tr class=\"even\">\n<td>ad</td>\n<td>име</td>\n</tr>\n<tr class=\"odd\">\n<td>soyad</td>\n<td>фамилия</td>\n</tr>\n<tr class=\"even\">\n<td>iş</td>\n<td>работа</td>\n</tr>\n<tr class=\"odd\">\n<td>adres</td>\n<td>адрес</td>\n</tr>\n<tr class=\"even\">\n<td>telefon</td>\n<td>телефон</td>\n</tr>\n<tr class=\"odd\">\n<td>kimin</td>\n<td>чий</td>\n</tr>\n<tr class=\"even\">\n<td>kaç</td>\n<td>колко</td>\n</tr>\n<tr class=\"odd\">\n<td>kapı</td>\n<td>врата</td>\n</tr>\n<tr class=\"even\">\n<td>anahtar</td>\n<td>ключ</td>\n</tr>\n<tr class=\"odd\">\n<td>para</td>\n<td>пари</td>\n</tr>\n<tr class=\"even\">\n<td>oda</td>\n<td>стая</td>\n</tr>\n</tbody>\n</table>\n<h3 id=\"граматика-3.1-притежателни-афикси-iyelik-ekleri\">Граматика 3.1 —\nПритежателни афикси · İyelik ekleri</h3>\n<p>„Моята книга“ = <code>benim kitabım</code>. Местоимението може да се\nизпусне; окончанието е задължително.</p>\n<table>\n<colgroup>\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th>Лице</th>\n<th>След съгласна</th>\n<th>След гласна</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>benim (моят)</td>\n<td>-ım / -im / -um / -üm</td>\n<td>-m</td>\n</tr>\n<tr class=\"even\">\n<td>senin (твоят)</td>\n<td>-ın / -in / -un / -ün</td>\n<td>-n</td>\n</tr>\n<tr class=\"odd\">\n<td>onun (неговият)</td>\n<td>-ı / -i / -u / -ü</td>\n<td>-sı / -si / -su / -sü</td>\n</tr>\n<tr class=\"even\">\n<td>bizim (нашият)</td>\n<td>-ımız / -imiz / -umuz / -ümüz</td>\n<td>-mız / -miz / -muz / -müz</td>\n</tr>\n<tr class=\"odd\">\n<td>sizin (вашият)</td>\n<td>-ınız / -iniz / -unuz / -ünüz</td>\n<td>-nız / -niz / -nuz / -nüz</td>\n</tr>\n<tr class=\"even\">\n<td>onların (техният)</td>\n<td>-ları / -leri</td>\n<td>-ları / -leri</td>\n</tr>\n</tbody>\n</table>\n<p><strong>Пример с <code>ev</code> (къща):</strong></p>\n<table>\n<tbody>\n<tr class=\"odd\">\n<td>benim ev<strong>im</strong></td>\n<td>моята къща</td>\n</tr>\n<tr class=\"even\">\n<td>senin ev<strong>in</strong></td>\n<td>твоята къща</td>\n</tr>\n<tr class=\"odd\">\n<td>onun ev<strong>i</strong></td>\n<td>неговата къща</td>\n</tr>\n<tr class=\"even\">\n<td>bizim ev<strong>imiz</strong></td>\n<td>нашата къща</td>\n</tr>\n<tr class=\"odd\">\n<td>sizin ev<strong>iniz</strong></td>\n<td>вашата къща</td>\n</tr>\n<tr class=\"even\">\n<td>onların ev<strong>leri</strong></td>\n<td>тяхната къща</td>\n</tr>\n</tbody>\n</table>\n<p><strong>Пример с <code>araba</code> (кола, свършва на\nгласна):</strong>\n<code>arabam, araban, arabası, arabamız, arabanız, arabaları</code></p>\n<h3\nid=\"граматика-3.2-омекотяване-на-съгласната-ünsüz-yumuşaması\">Граматика\n3.2 — Омекотяване на съгласната · Ünsüz yumuşaması</h3>\n<p>Ако думата свършва на <strong>p, ç, t, k</strong> и след нея идва\nокончание, започващо с гласна, съгласната се смекчава:</p>\n<table>\n<tbody>\n<tr class=\"odd\">\n<td>p → b</td>\n<td>kitap → kita<strong>b</strong>ım</td>\n</tr>\n<tr class=\"even\">\n<td>ç → c</td>\n<td>ağaç → ağa<strong>c</strong>ım</td>\n</tr>\n<tr class=\"odd\">\n<td>t → d</td>\n<td>kanat → kana<strong>d</strong>ı</td>\n</tr>\n<tr class=\"even\">\n<td>k → ğ</td>\n<td>sokak → soka<strong>ğ</strong>ım</td>\n</tr>\n<tr class=\"odd\">\n<td>k → g (едносрични думи)</td>\n<td>renk → ren<strong>g</strong>i</td>\n</tr>\n</tbody>\n</table>\n<p><em>Изключения (не се смекчават):</em> <code>at → atı</code> (кон),\n<code>saat → saati</code>, <code>devlet → devleti</code>,\n<code>top → topu</code>.</p>\n<h3\nid=\"граматика-3.3-изафет-съществително-съществително-isim-tamlaması\">Граматика\n3.3 — Изафет: съществително + съществително · İsim tamlaması</h3>\n<p><strong>А) Определен изафет (притежание между две конкретни\nнеща):</strong> Първата дума получава <code>-ın/-in/-un/-ün</code>,\nвтората получава <code>-ı/-i/-u/-ü</code>.</p>\n<ul>\n<li>Ali’<strong>nin</strong> ev<strong>i</strong> — къщата на Али</li>\n<li>öğretmen<strong>in</strong> kitab<strong>ı</strong> — книгата на\nучителя</li>\n<li>kapı<strong>nın</strong> anahtar<strong>ı</strong> — ключът на\nвратата</li>\n</ul>\n<p><strong>Б) Неопределен изафет (вид, тип — като сложна дума):</strong>\nСамо втората дума получава окончание.</p>\n<ul>\n<li>ders kitab<strong>ı</strong> — учебник (книга за урок)</li>\n<li>Türk kahve<strong>si</strong> — турско кафе</li>\n<li>otobüs bilet<strong>i</strong> — билет за автобус</li>\n<li>diş fırça<strong>sı</strong> — четка за зъби</li>\n</ul>\n<h3 id=\"граматика-3.4-въпрос-kimin-чий-kimin-sorusu\">Граматика 3.4 —\nВъпрос „kimin?“ (чий?) · „Kimin?“ sorusu</h3>\n<ul>\n<li>Bu kimin kitabı? — Чия е тази книга?</li>\n<li>Bu benim kitabım. — Това е моята книга.</li>\n<li>Bu araba kimin? — Чия е тази кола?</li>\n<li>Ahmet’in. — На Ахмет.</li>\n</ul>\n<h3\nid=\"граматика-3.5-вмъкване-на-буква-пред-притежателния-афикс-iyelik-ekinden-önce-kaynaştırma\">Граматика\n3.5 — Вмъкване на буква пред притежателния афикс · İyelik ekinden önce\nkaynaştırma</h3>\n<p>Когато думата свършва на <strong>гласна</strong>, преди окончанието\nза 3 лице се вмъква <code>-s-</code>:</p>\n<div class=\"line-block\">araba | araba<strong>sı</strong> | неговата кола\n|<br />\nanne | anne<strong>s
