причастия-zarf-fiiller-ulaçlar\">УРОК 18 ·\nДеепричастия · Zarf-fiiller (ulaçlar)</h2>\n<h3 id=\"речник-sözlük-16\">Речник · Sözlük</h3>\n<table>\n<thead>\n<tr class=\"header\">\n<th>Турски</th>\n<th>Български</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>koşmak</td>\n<td>тичам</td>\n</tr>\n<tr class=\"even\">\n<td>gülmek</td>\n<td>смея се</td>\n</tr>\n<tr class=\"odd\">\n<td>ağlamak</td>\n<td>плача</td>\n</tr>\n<tr class=\"even\">\n<td>düşünmek</td>\n<td>мисля</td>\n</tr>\n<tr class=\"odd\">\n<td>şarkı söylemek</td>\n<td>пея</td>\n</tr>\n<tr class=\"even\">\n<td>dinlenmek</td>\n<td>почивам</td>\n</tr>\n<tr class=\"odd\">\n<td>beklemek</td>\n<td>чакам</td>\n</tr>\n<tr class=\"even\">\n<td>aramak</td>\n<td>търся; звъня</td>\n</tr>\n<tr class=\"odd\">\n<td>bulmak</td>\n<td>намирам</td>\n</tr>\n<tr class=\"even\">\n<td>kalkmak</td>\n<td>ставам</td>\n</tr>\n<tr class=\"odd\">\n<td>oturmak</td>\n<td>сядам</td>\n</tr>\n<tr class=\"even\">\n<td>girmek</td>\n<td>влизам</td>\n</tr>\n<tr class=\"odd\">\n<td>çıkmak</td>\n<td>излизам</td>\n</tr>\n<tr class=\"even\">\n<td>dönmek</td>\n<td>връщам се</td>\n</tr>\n<tr class=\"odd\">\n<td>bitirmek</td>\n<td>завършвам</td>\n</tr>\n<tr class=\"even\">\n<td>başlamak</td>\n<td>започвам</td>\n</tr>\n<tr class=\"odd\">\n<td>devam etmek</td>\n<td>продължавам</td>\n</tr>\n<tr class=\"even\">\n<td>durmak</td>\n<td>спирам</td>\n</tr>\n<tr class=\"odd\">\n<td>unutmak</td>\n<td>забравям</td>\n</tr>\n<tr class=\"even\">\n<td>hatırlamak</td>\n<td>спомням си</td>\n</tr>\n</tbody>\n</table>\n<h3 id=\"граматика-18.1-какво-е-деепричастие-zarf-fiil\">Граматика 18.1 —\nКакво е деепричастие · Zarf-fiil</h3>\n<p>Деепричастието свързва две действия в едно изречение, без съюз.\nБългарският има подобно („тичайки“, „като дойде“), но турският разполага\nс десетки такива форми и ги използва постоянно.</p>\n<p><strong>Основно правило:</strong> деепричастието стои в първата част,\nглавният глагол — накрая, и той носи времето и лицето.</p>\n<p><code>Eve gel**ince** seni ara**dım**.</code> — Като се прибрах, ти\nзвъннах. <em>(<code>gelince</code> няма време и лице — те са в\n<code>aradım</code>)</em></p>\n<h3 id=\"граматика-18.2--arak--erek-като-чрез\">Граматика 18.2 —\n<code>-arak / -erek</code> (като, чрез)</h3>\n<p>Показва <strong>начин</strong> на извършване:</p>\n<ul>\n<li>Koş<strong>arak</strong> geldim. — Дойдох тичайки.</li>\n<li>Gül<strong>erek</strong> konuştu. — Говореше смеейки се.</li>\n<li>Otobüsle gid<strong>erek</strong> vardık. — Стигнахме с\nавтобус.</li>\n<li>Çalış<strong>arak</strong> öğrenirsin. — Като работиш, ще\nнаучиш.</li>\n</ul>\n<p><strong>След гласна: -yarak / -yerek</strong> —\n<code>okuyarak</code>, <code>bekleyerek</code></p>\n<p><strong>Специална форма:</strong> <code>olarak</code> — „като, в\nкачеството на“ <code>Öğretmen olarak çalışıyorum.</code> — Работя като\nучител.</p>\n<h3 id=\"граматика-18.3--ıp--ip--up--üp-и-после\">Граматика 18.3 —\n<code>-ıp / -ip / -up / -üp</code> (и, после)</h3>\n<p>Свързва две последователни действия на <strong>един и същ\nподлог</strong>. Заменя „и“ — така не се повтаря времето:</p>\n<ul>\n<li>Kalk<strong>ıp</strong> gitti. — Стана и си тръгна.</li>\n<li>Yemek yiy<strong>ip</strong> uyudum. — Ядох и заспах.</li>\n<li>Eve gel<strong>ip</strong> duş aldım. — Прибрах се и се\nизкъпах.</li>\n</ul>\n<p>Сравни: - <code>Kalktı ve gitti.</code> — правилно, но по-тежко -\n<code>Kalkıp gitti.</code> — по-естествено за турския</p>\n<p><strong>Важно:</strong> двете действия трябва да имат <strong>един\nподлог</strong>. Не може <del>Ben gelip o gitti</del>.</p>\n<p><strong>Отрицание:</strong> <code>-mayıp / -meyip</code> —\n<code>gitmeyip kaldı</code> (не отиде, а остана)</p>\n<h3 id=\"граматика-18.4--ınca--ince-когато-щом\">Граматика 18.4 —\n<code>-ınca / -ince</code> (когато, щом)</h3>\n<p>Показва <strong>момент</strong> — щом стане едното, става\nдругото:</p>\n<ul>\n<li>Eve gel<strong>ince</strong> beni ara. — Като се прибереш, звънни\nми.</li>\n<li>Yağmur yağ<strong>ınca</strong> içeri girdik. — Щом заваля, влязохме\nвътре.</li>\n<li>Onu gör<strong>ünce</strong> çok sevindim. — Като го видях, много се\nзарадвах.</li>\n</ul>\n<p><strong>След гласна: -yınca / -yince</strong> —\n<code>okuyunca</code>, <code>bekleyince</code></p>\n<h3 id=\"граматика-18.5--ken-докато-когато\">Граматика 18.5 —\n<code>-ken</code> (докато, когато)</h3>\n<p>Показва <strong>едновременност</strong>. Прикача се към време, не към\nкорен:</p>\n<table>\n<thead>\n<tr class=\"header\">\n<th>Форма</th>\n<th>Пример</th>\n<th>Превод</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>geniş + ken</td>\n<td>gel<strong>irken</strong></td>\n<td>докато идвах</td>\n</tr>\n<tr class=\"even\">\n<td>-yor + ken</td>\n<td>çalışıyor<strong>ken</strong></td>\n<td>докато работех</td>\n</tr>\n<tr class=\"odd\">\n<td>-acak + ken</td>\n<td>gidecek<strong>ken</strong></td>\n<td>тъкмо щях да отида</td>\n</tr>\n<tr class=\"even\">\n<td>именно</td>\n<td>öğrenci<strong>yken</strong></td>\n<td>докато бях студент</td>\n</tr>\n<tr class=\"odd\">\n<td>çocuk<strong>ken</strong></td>\n<td>докато бях дете</td>\n<td></td>\n</tr>\n</tbody>\n</table>\n<p>Примери: - Eve gid<strong>erken</strong> Ali’yi gördüm. — Докато се\nприбирах, видях Али. - Çocuk<strong>ken</strong> çok yaramazdım. — Като\nдете бях много палав. - Tam çıkacak<strong>ken</strong> telefon çaldı. —\nТъкмо щях да изляза, телефонът звънна.</p>\n<p><strong><code>-ken</code> никога не се мени по хармония</strong> —\nвинаги <code>-ken</code>, не <code>-kan</code>.</p>\n<h3 id=\"граматика-18.6--madan-без-да-преди-да\">Граматика 18.6 —\n<code>-madan</code> (без да, преди да)</h3>\n<table>\n<thead>\n<tr class=\"header\">\n<th>Значение</th>\n<th>Пример</th>\n<th>Превод</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>без да</td>\n<td>Söyle<strong>meden</strong> gitti.</td>\n<td>Тръгна си без да каже.</td>\n</tr>\n<tr class=\"even\">\n<td>преди да</td>\n<td>Gel<strong>meden</strong> önce ara.</td>\n<td>Обади се, преди да дойдеш.</td>\n</tr>\n</tbody>\n</table>\n<ul>\n<li>Bakmadan geçti. — Мина без да погледне.</li>\n<li>Yemek yemeden çıkma. — Не излизай, без да ядеш.</li>\n<li>Ders bitmeden çıkmayın. — Не излизайте, преди да свърши урокът.</li>\n</ul>\n<h3 id=\"граматика-18.7--dıkça-колкото-повече-всеки-път-когато\">Граматика\n18.7 — <code>-dıkça</code> (колкото повече, всеки път когато)</h3>\n<ul>\n<li>Gör<strong>dükçe</strong> özlüyorum. — Всеки път като го видя, ми\nлипсва.</li>\n<li>Çalış<strong>tıkça</strong> öğreniyorsun. — Колкото повече работиш,\nтолкова повече учиш.</li>\n<li>Zaman geç<strong>tikçe</strong> unutulur. — С течение на времето се\nзабравя.</li>\n</ul>\n<h3 id=\"граматика-18.8-обобщение\">Граматика 18.8 — Обобщение</h3>\n<table>\n<thead>\n<tr class=\"header\">\n<th>Деепричастие</th>\n<th>Значение</th>\n<th>Пример</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>-arak / -erek</td>\n<td>как, чрез</td>\n<td>koşarak — тичайки</td>\n</tr>\n<tr class=\"even\">\n<td>-ıp</td>\n<td>и, после</td>\n<td>kalkıp — като стана</td>\n</tr>\n<tr class=\"odd\">\n<td>-ınca</td>\n<td>щом, когато</td>\n<td>gelince — щом дойде</td>\n</tr>\n<tr class=\"even\">\n<td>-ken</td>\n<td>докато</td>\n<td>gelirken — докато идваше</td>\n</tr>\n<tr class=\"odd\">\n<td>-madan</td>\n<td>без да / преди да</td>\n<td>söylemeden — без да каже</td>\n</tr>\n<tr class=\"even\">\n<td>-dıkça</td>\n<td>колкото повече</td>\n<td>gördükçe — всеки път като види</td>\n</tr>\n<tr class=\"odd\">\n<td>-dığı zaman</td>\n<td>когато</td>\n<td>geldiği zaman — когато дойде</td>\n</tr>\n<tr class=\"even\">\n<td>-dığında</td>\n<td>когато</td>\n<td>geldiğinde — когато дойде</td>\n</tr>\n</tbody>\n</table>\n<p><strong><code>-ınca</code> срещу <code>-dığında</code>:</strong>\nпочти еднакви. <code>-ınca</code> е по-разговорно, <code>-dığında</code>\n— по-книжовно и позволява да се уточни лицето.</p>\n<h3 id=\"защо-е-така-neden-böyle-17\">Защо е така · Neden böyle</h3>\n<p><strong>Защо турският избягва съюзи като „и“ и „когато“?</strong>\nЗащото е език на окончанията, не на служебните думи. Там, където\nбългарският реди изречения със съюзи, турският ги свива в едно изречение\nс деепричастие. Резултатът е по-компактен, но изисква ново мислене.</p>\n<p>Сравни: - Български: „Стана <strong>и</strong> си тръгна.“ (два\nглагола, един съюз) - Турски: <code>Kalkıp gitti.</code> (едно\nдеепричастие + един глагол)</p>\n<p><strong>Защо <code>-ıp</code> иска един и същ подлог?</strong> Защото\nдеепричастието няма собствено лице — то „взима назаем“ лицето на главния\nглагол. Затова <code>Kalkıp gitti</code> може да значи само „той стана и\nтой си тръгна“. Ако подлозите са различни, нужно е пълно изречение:\n<code>Ben geldim, o gitti.</code></p>\n<p><strong>Каква е разликата между <code>-arak</code> и\n<code>-ıp</code>?</strong> - <code>-arak</code> = <strong>как</strong>\nсе върши действието: <code>Koşarak geldi</code> — дойде тичайки\n<em>(едновременно)</em> - <code>-ıp</code> = <strong>после</strong>:\n<code>Koşup geldi</code> — потича и дойде <em>(последователно)</em></p>\n<p>Тънка, но реална разлика. Ако замениш едното с другото, турчинът ще\nразбере, но ще звучи леко накриво.</p>\n<p><strong>Защо <code>-ken</code> се лепи за времето, а не за\nкорена?</strong> Защото маркира едновременност с нещо конкретно, а\nвремето казва с какво: <code>gelirken</code> (докато идвах, обичайно),\n<code>geliyorken</code> (точно докато идвах в този момент). Втората\nформа е по-рядка, но възможна.</p>\n<h3 id=\"текст-за-четене-и-превод-okuma-ve-çeviri-metni-16\">Текст за\nчетене и превод · Okuma ve çeviri metni</h3>\n<p><strong>Sabah telaşı — Сутрешната суетня</strong></p>\n<blockquote>\n<p>Bu sabah alarm çalmadan uyandım. Saate bakınca çok erken olduğunu\ngördüm ama tekrar uyuyamadım. Kalkıp mutfağa gittim, kahve yaparak güne\nbaşladım.</p>\n<p>Kahvaltı ederken telefonuma baktım. Patronumdan bir mesaj gelmişti:\ntoplantı bir saat öne alınmış. Görünce paniğe kapıldım. Hemen duş alıp\ngiyindim.</p>\n<p>Evden çıkarken anahtarımı unuttum. Kapı arkamdan kapanınca fark\nettim. Neyse ki komşuda yedek anahtar vardı.</p>\n<p>Koşarak otobüs durağına gittim ama otobüs tam ben varmadan kalktı.\nTaksi çağırmak zorunda kaldım. Trafik açıldıkça hızlandık ve şansıma tam\nvaktinde vardım.</p>\n<p>Toplantı başlamadan iki dakika önce yerime oturdum. Kimse geç\nkaldığımı anlamadı.</p>\n</blockquote>\n<p><em>Нови думи:</em> <code>telaş</code> — суетня;\n<code>alarm çalmak</code> — звъни будилникът; <code>uyanmak</code> —\nсъбуждам се; <code>öne almak</code> — премествам по-рано;\n<code>paniğe kapılmak</code> — изпадам в паника; <code>giyinmek</code> —\nобличам се; <code>fark etmek</code> — забелязвам; <code>neyse ki</code>\n— за щастие; <code>yedek</code> — резервен; <code>çağırmak</code> —\nвикам; <code>hızlanmak</code> — ускорявам; <code>şansıma</code> — за мой\nкъсмет; <code>tam vaktinde</code> — точно навреме.</p>\n<p><strong>Въпроси:</strong></p>\n<ol type=\"1\">\n<li>Nasıl uyandı?</li>\n<li>Patronundan ne mesaj gelmiş?</li>\n<li>Anahtarını ne zaman unuttuğunu fark etti?</li>\n<li>Toplantıya zamanında yetişti mi?</li>\n</ol>\n<h3 id=\"упражнения-alıştırmalar-17\">Упражнения · Alıştırmalar</h3>\n<p><strong>Упр. 18.1 — Направи деепричастие на\n<code>-arak / -erek</code>.</strong> <em>(„-arak/-erek“ yapın.)</em></p>\n<ol type=\"1\">\n<li>koşmak</li>\n<li>gülmek</li>\n<li>çalışmak</li>\n<li>okumak</li>\n<li>beklemek</li>\n<li>düşünmek</li>\n</ol>\n<p><strong>Упр. 18.2 — Свържи двете изречения с\n<code>-ıp</code>.</strong> <em>(„-ıp“ ile birleştirin.)</em></p>\n<p>Пример: Kalktı. Gitti. → Kalkıp gitti.</p>\n<ol type=\"1\">\n<li>Yemek yedi. Uyudu.</li>\n<li>Eve geldim. Duş aldım.</li>\n<li>Kitabı aldı. Okudu.</li>\n<li>Kalktık. Çıktık.</li>\n</ol>\n<p><strong>Упр. 18.3 — Свържи с <code>-ınca / -ince</code>.</strong>\n<em>(„-ınca“ ile birleştirin.)</em></p>\n<p>Пример: Eve geldim. Seni aradım. → Eve gelince seni aradım.</p>\n<ol type=\"1\">\n<li>Yağmur yağdı. İçeri girdik.</li>\n<li>Onu gördüm. Çok sevindim.</li>\n<li>Ders bitti. Eve gittik.</li>\n<li>Telefon çaldı. Uyandım.</li>\n</ol>\n<p><strong>Упр. 18.4 — Постави <code>-ken</code>.</strong> <em>(„-ken“\nekleyin.)</em></p>\n<ol type=\"1\">\n<li>gelmek (docато идвам)</li>\n<li>çalışmak (докато работя)</li>\n<li>çocuk (докато бях дете)</li>\n<li>öğrenci (докато бях студент)</li>\n<li>çıkmak (тъкмо щях да изляза)</li>\n</ol>\n<p><strong>Упр. 18.5 — Кое деепричастие?</strong> <em>(Hangi\nzarf-fiil?)</em></p>\n<p>Избери: -arak · -ıp · -ınca · -ken · -madan · -dıkça</p>\n<ol type=\"1\">\n<li>Дойдох тичайки. → Koş___ geldim.</li>\n<li>Стана и си тръгна. → Kalk___ gitti.</li>\n<li>Щом се прибереш, звънни. → Eve gel___ beni ara.</li>\n<li>Докато се прибирах, видях Али. → Eve gid___ Ali’yi gördüm.</li>\n<li>Тръгна си без да каже. → Söyle___ gitti.</li>\n<li>Колкото повече работиш, толкова повече учиш. → Çalış___\nöğreniyorsun.</li>\n</ol>\n<p><strong>Упр. 18.6 — Преведи на турски.</strong> <em>(Türkçeye\nçevirin.)</em></p>\n<ol type=\"1\">\n<li>Дойдох тичайки.</li>\n<li>Стана и си тръгна.</li>\n<li>Като се прибереш, звънни ми.</li>\n<li>Докато бях дете, бях много палав.</li>\n<li>Тръгна си без да каже.</li>\n<li>Обади се, преди да дойдеш.</li>\n<li>Работя като учител.</li>\n<li>Тъкмо щях да изляза, телефонът звънна.</li>\n</ol>\n<hr />\n<h2\nid=\"урок-19-отглаголни-имена-и-подчинени-изречения-isim-fiiller\">УРОК 19\n· Отглаголни имена и подчинени изречения · İsim-fiiller</h2>\n<h3 id=\"речник-sözlük-17\">Речник · Sözlük</h3>\n<table>\n<thead>\n<tr class=\"header\">\n<th>Турски</th>\n<th>Български</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>söylemek</td>\n<td>казвам</td>\n</tr>\n<tr class=\"even\">\n<td>bilmek</td>\n<td>зная</td>\n</tr>\n<tr class=\"odd\">\n<td>sanmak</td>\n<td>смятам</td>\n</tr>\n<tr class=\"even\">\n<td>düşünmek</td>\n<td>мисля</td>\n</tr>\n<tr class=\"odd\">\n<td>ummak</td>\n<td>надявам се</td>\n</tr>\n<tr class=\"even\">\n<td>istemek</td>\n<td>искам</td>\n</tr>\n<tr class=\"odd\">\n<td>beğenmek</td>\n<td>харесвам</td>\n</tr>\n<tr class=\"even\">\n<td>duymak</td>\n<td>чувам</td>\n</tr>\n<tr class=\"odd\">\n<td>görmek</td>\n<td>виждам</td>\n</tr>\n<tr class=\"even\">\n<td>anlamak</td>\n<td>разбирам</td>\n</tr>\n<tr class=\"odd\">\n<td>fark etmek</td>\n<td>забелязвам</td>\n</tr>\n<tr class=\"even\">\n<td>hatırlamak</td>\n<td>спомням си</td>\n</tr>\n<tr class=\"odd\">\n<td>unutmak</td>\n<td>забравям</td>\n</tr>\n<tr class=\"even\">\n<td>öğrenmek</td>\n<td>научавам</td>\n</tr>\n<tr class=\"odd\">\n<td>inanmak</td>\n<td>вярвам</td>\n</tr>\n<tr class=\"even\">\n<td>eminim</td>\n<td>сигурен съм</td>\n</tr>\n<tr class=\"odd\">\n<td>doğru</td>\n<td>вярно</td>\n</tr>\n<tr class=\"even\">\n<td>yanlış</td>\n<td>грешно</td>\n</tr>\n<tr class=\"odd\">\n<td>gerçek</td>\n<td>истина</td>\n</tr>\n<tr class=\"even\">\n<td>galiba</td>\n<td>вероятно</td>\n</tr>\n</tbody>\n</table>\n<h3 id=\"граматика-19.1-проблемът\">Граматика 19.1 — Проблемът</h3>\n<p>Българският казва: „Знам, <strong>че</strong> той идва.“ Турският\nняма такъв съюз — вместо това <strong>превръща цялото подчинено\nизречение в съществително</strong>:</p>\n<table>\n<colgroup>\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th>Български</th>\n<th>Турски</th>\n<th>Буквално</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Знам, че идва.</td>\n<td>Gel<strong>diğini</strong> biliyorum.</td>\n<td>Знам неговото идване.</td>\n</tr>\n<tr class=\"even\">\n<td>Искам да отида.</td>\n<td>Git<strong>mek</strong> istiyorum.</td>\n<td>Искам отиване.</td>\n</tr>\n<tr class=\"odd\">\n<td>Радвам се, че дойде.</td>\n<td>Gel<strong>diğine</strong> sevindim.</td>\n<td>Зарадвах се на неговото дошло.</td>\n</tr>\n</tbody>\n</table>\n<p>Това е най-голямата структурна разлика между двата езика. Затова\nурокът е дълъг.</p>\n<h3 id=\"граматика-19.2-трите-отглаголни-имена\">Граматика 19.2 — Трите\nотглаголни имена</h3>\n<table>\n<colgroup>\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th>Окончание</th>\n<th>Име</th>\n<th>Кога се използва</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td><strong>-mak / -mek</strong></td>\n<td>инфинитив</td>\n<td>абстрактно действие, след определени глаголи</td>\n</tr>\n<tr class=\"even\">\n<td><strong>-ma / -me</strong></td>\n<td>отглаголно име</td>\n<td>конкретно действие, приема притежание и падеж</td>\n</tr>\n<tr class=\"odd\">\n<td><strong>-dık / -acak</strong></td>\n<td>подчинено изречение</td>\n<td>факт с определено лице и време</td>\n</tr>\n</tbody>\n</table>\n<h3 id=\"граматика-19.3--mak--mek-инфинитив\">Граматика 19.3 —\n<code>-mak / -mek</code> (инфинитив)</h3>\n<p>Използва се, когато подлогът на двата глагола е <strong>един и\nсъщ</strong>:</p>\n<ul>\n<li>Git<strong>mek</strong> istiyorum. — Искам да отида.</li>\n<li>Yüz<strong>mek</strong> öğreniyorum. — Уча се да плувам.</li>\n<li>Türkçe konuş<strong>mak</strong> zor değil. — Не е трудно да се\nговори турски.</li>\n<li>Sigara iç<strong>mek</strong> yasak. — Пушенето е забранено.</li>\n</ul>\n<p><strong>Пада в дателен падеж пред някои глаголи:</strong>\n<code>başlamak</code> (започвам) → <code>okuma**ya** başladım</code> —\nзапочнах да чета <em>(тук <code>-mak</code> става <code>-ma</code>,\nзащото приема падеж)</em></p>\n<p><strong>Глаголи, след които идва <code>-mak</code>:</strong> istemek\n(искам), sevmek (обичам), bilmek (умея), unutmak (забравям), zorunda\nolmak (принуден съм), lazım/gerek (трябва)</p>\n<h3 id=\"граматика-19.4--ma--me-отглаголно-име\">Граматика 19.4 —\n<code>-ma / -me</code> (отглаголно име)</h3>\n<p>За разлика от <code>-mak</code>, приема <strong>притежателен афикс и\nпадеж</strong>. Използва се, когато подлозите на двете действия са\n<strong>различни</strong>:</p>\n<table>\n<thead>\n<tr class=\"header\">\n<th>Лице</th>\n<th>gelmek</th>\n<th>Превод</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>ben</td>\n<td>gel<strong>mem</strong></td>\n<td>моето идване</td>\n</tr>\n<tr class=\"even\">\n<td>sen</td>\n<td>gel<strong>men</strong></td>\n<td>твоето идване</td>\n</tr>\n<tr class=\"odd\">\n<td>o</td>\n<td>gel<strong>mesi</strong></td>\n<td>неговото идване</td>\n</tr>\n<tr class=\"even\">\n<td>biz</td>\n<td>gel<strong>memiz</strong></td>\n<td>нашето идване</td>\n</tr>\n<tr class=\"odd\">\n<td>siz</td>\n<td>gel<strong>meniz</strong></td>\n<td>вашето идване</td>\n</tr>\n<tr class=\"even\">\n<td>onlar</td>\n<td>gel<strong>meleri</strong></td>\n<td>тяхното идване</td>\n</tr>\n</tbody>\n</table>\n<p>Примери: - Gel<strong>meni</strong> istiyorum. — Искам ти да дойдеш.\n- Ali’nin gel<strong>mesi</strong>ni bekliyorum. — Чакам Али да дойде. -\nErken kalk<strong>mam</strong> lazım. — Трябва да ставам рано. - Sigara\niç<strong>men</strong>e izin yok. — Нямаш разрешение да пушиш.</p>\n<p><strong>Сравни:</strong> - <code>Gitmek istiyorum.</code> — Искам\n<strong>аз</strong> да отида. <em>(един подлог → -mek)</em> -\n<code>Gitmeni istiyorum.</code> — Искам <strong>ти</strong> да отидеш.\n<em>(различни подлози → -me)</em></p>\n<h3 id=\"граматика-19.5--dık-и--acak-подчинено-изречение\">Граматика 19.5\n— <code>-dık</code> и <code>-acak</code> (подчинено изречение)</h3>\n<p>Тук вече има <strong>време</strong>. Използват се след глаголи за\nзнание, възприятие и мнение:</p>\n<table>\n<colgroup>\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th>Окончание</th>\n<th>Време</th>\n<th>Пример</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>-dık</td>\n<td>минало и сегашно</td>\n<td>Gel<strong>diğini</strong> biliyorum. — Знам, че е дошъл / че\nидва.</td>\n</tr>\n<tr class=\"even\">\n<td>-acak</td>\n<td>бъдеще</td>\n<td>Gel<strong>eceğini</strong> biliyorum. — Знам, че ще дойде.</td>\n</tr>\n</tbody>\n</table>\n<p><strong>Спрежение (<code>gelmek</code>, с\n<code>-dık</code>):</strong></p>\n<div class=\"line-block\">ben | gel<strong>diğim</strong> | че съм дошъл\n|<br />\nsen | gel<strong>diğin</strong> | че си дошъл |<br />\no | gel<strong>diği</strong> | че е дошъл |<br />\nbiz | gel<strong>diğimiz</strong> | че сме дошли |<br />\nsiz | gel<strong>diğiniz</strong> | че сте дошли |<br />\nonlar | gel<strong>dikleri</strong> | че са дошли |</div>\n<p><strong>Падежът зависи от главния глагол:</strong></p>\n<table>\n<thead>\n<tr class=\"header\">\n<th>Главен глагол</th>\n<th>Падеж</th>\n<th>Пример</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>bilmek (знам)</td>\n<td>винителен</td>\n<td>Geldiğin<strong>i</strong> biliyorum.</td>\n</tr>\n<tr class=\"even\">\n<td>söylemek (казвам)</td>\n<td>винителен</td>\n<td>Geldiğin<strong>i</strong> söyledi.</td>\n</tr>\n<tr class=\"odd\">\n<td>duymak (чувам)</td>\n<td>винителен</td>\n<td>Geldiğin<strong>i</strong> duydum.</td>\n</tr>\n<tr class=\"even\">\n<td>sevinmek (радвам се)</td>\n<td>дателен</td>\n<td>Geldiğin<strong>e</strong> sevindim.</td>\n</tr>\n<tr class=\"odd\">\n<td>inanmak (вярвам)</td>\n<td>дателен</td>\n<td>Geldiğin<strong>e</strong> inanmıyorum.</td>\n</tr>\n<tr class=\"even\">\n<td>emin olmak (сигурен съм)</td>\n<td>изходен</td>\n<td>Geldiğin<strong>den</strong> eminim.</td>\n</tr>\n<tr class=\"odd\">\n<td>korkmak (страхувам се)</td>\n<td>изходен</td>\n<td>Geleceğin<strong>den</strong> korkuyorum.</td>\n</tr>\n</tbody>\n</table>\n<p>Примери: - Ali’nin geldiğini duydum. — Чух, че Али е дошъл. - Yarın\nyağmur yağacağını söylediler. — Казаха, че утре ще вали. - Haklı\nolduğunu biliyorum. — Знам, че си прав. - Beni sevmediğini anladım. —\nРазбрах, че не ме обичаш.</p>\n<h3 id=\"граматика-19.6-как-да-избереш-формата\">Граматика 19.6 — Как да\nизбереш формата</h3>\n<p>Три въпроса подред:</p>\n<p><strong>1. Има ли различен подлог?</strong> Не → <code>-mak</code> ·\nДа → продължи</p>\n<p><strong>2. Има ли собствено време (минало/бъдеще)?</strong> Не\n(желание, нужда) → <code>-ma</code> · Да (факт) → продължи</p>\n<p><strong>3. Кое време?</strong> Минало/сегашно → <code>-dık</code> ·\nБъдеще → <code>-acak</code></p>\n<table>\n<thead>\n<tr class=\"header\">\n<th>Изречение</th>\n<th>Форма</th>\n<th>Турски</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Искам да отида.</td>\n<td>-mek</td>\n<td>Gitmek istiyorum.</td>\n</tr>\n<tr class=\"even\">\n<td>Искам ти да отидеш.</td>\n<td>-me</td>\n<td>Gitmeni istiyorum.</td>\n</tr>\n<tr class=\"odd\">\n<td>Знам, че отиде.</td>\n<td>-dık</td>\n<td>Gittiğini biliyorum.</td>\n</tr>\n<tr class=\"even\">\n<td>Знам, че ще отиде.</td>\n<td>-acak</td>\n<td>Gideceğini biliyorum.</td>\n</tr>\n</tbody>\n</table>\n<h3 id=\"граматика-19.7-готови-изрази\">Граматика 19.7 — Готови\nизрази</h3>\n<div class=\"line-block\">olduğu gibi | както си е | Olduğu gibi bırak.\n|<br />\nolduğu için | понеже е | Hasta olduğu için gelmedi. |<br />\nolduğunu | че е | Doğru olduğunu biliyorum. |<br />\nsöylediğim gibi | както казах | |<br />\nbildiğim kadarıyla | доколкото знам | |<br />\ngördüğüm kadarıyla | доколкото виждам | |<br />\n-dığı takdirde | в случай че | Gelmediği takdirde başlarız. |<br />\n-dığı sürece | докато | Sen burada olduğun sürece güvendeyim. |</div>\n<h3 id=\"защо-е-така-neden-böyle-18\">Защо е така · Neden böyle</h3>\n<p><strong>Защо турският няма съюз „че“?</strong> Защото е език, който\nпредпочита да свива изречения в думи. Вместо да свърже две изречения със\nсъюз, той превръща едното в съществително и го прави обект на другото.\n<code>Geldiğini biliyorum</code> буквално е „Знам неговото-дошло“ — само\nедно изречение с един спрегнат глагол.</p>\n<p>Всъщност турският <strong>има</strong> съюза <code>ki</code> (заемка\nот персийски), но той се използва ограничено и звучи книжовно:\n<code>Biliyorum ki geldi.</code> Носителите предпочитат\n<code>-dık</code>.</p>\n<p><strong>Защо <code>-mak</code> не приема притежание, а\n<code>-ma</code> — да?</strong> Историческа причина: <code>-mak</code> е\nзастинала инфинитивна форма, докато <code>-ma</code> е живо\nсловообразувателно окончание, което прави пълноценни съществителни.\nЗатова има думи като <code>dondurma</code> (сладолед, буквално\n„замразяване“), <code>kavurma</code> (пържено месо), <code>dolma</code>\n(пълнено).</p>\n<p><strong>Защо падежът зависи от главния глагол?</strong> Защото\nподчиненото изречение вече е съществително, а всяко съществително приема\nпадежа, който глаголът изисква. <code>sevinmek</code> иска дателен\n(<code>bir şeye sevinmek</code> — радвам се на нещо), затова и\n<code>geldiğine sevindim</code>. Тоест: научи падежа на глагола веднъж и\nтой важи и тук.</p>\n<p><strong>Каква е основната грешка на българите?</strong> Да преведат\nбуквално „че“ и да кажат <del>Biliyorum ki o geliyor</del> навсякъде.\nГраматически не е грешно, но звучи като превод. Естественото е\n<code>Geldiğini biliyorum</code>.</p>\n<h3 id=\"текст-за-четене-и-превод-okuma-ve-çeviri-metni-17\">Текст за\nчетене и превод · Okuma ve çeviri metni</h3>\n<p><strong>Bir karar — Едно решение</strong></p>\n<blockquote>\n<p>Uzun süredir yurt dışına gitmeyi düşünüyordum. Arkadaşlarım gitmemin\niyi bir fikir olduğunu söylüyorlardı, ama ailem endişeliydi. Annem\ngitmemi istemiyordu; babam ise karar vermemin bana ait olduğunu\ndüşünüyordu.</p>\n<p>Sonunda başvurmaya karar verdim. Kabul edileceğimi hiç sanmıyordum, o\nyüzden cevap geldiğinde çok şaşırdım. Kabul edildiğimi okuyunca önce\ninanamadım.</p>\n<p>Ailem haberi duyduğunda ne diyeceklerinden emin değildim. Annem\nağladı ama gurur duyduğunu söyledi. Babam sadece „Biliyordum,“ dedi.</p>\n<p>Şimdi hazırlanıyorum. Gitmeden önce yapmam gereken çok iş var: vize,\nbilet, ev. Zor olacağını biliyorum ama pişman olmayacağımdan eminim.</p>\n</blockquote>\n<p><em>Нови думи:</em> <code>yurt dışı</code> — чужбина;\n<code>fikir</code> — идея; <code>endişeli</code> — притеснен;\n<code>başvurmak</code> — кандидатствам; <code>kabul edilmek</code> —\nприет съм; <code>şaşırmak</code> — изненадвам се;\n<code>gurur duymak</code> — гордея се; <code>hazırlanmak</code> —\nподготвям се; <code>vize</code> — виза; <code>pişman olmak</code> —\nсъжалявам.</p>\n<p><strong>Въпроси:</strong></p>\n<ol type=\"1\">\n<li>Ailesi ne düşünüyordu?</li>\n<li>Cevap gelince ne hissetti?</li>\n<li>Babası ne dedi?</li>\n<li>Gitmeden önce ne yapması gerekiyor?</li>\n</ol>\n<h3 id=\"упражнения-alıştırmalar-18\">Упражнения · Alıştırmalar</h3>\n<p><strong>Упр. 19.1 — <code>-mak</code> или <code>-ma</code>?</strong>\n<em>(„-mak“ mı, „-ma“ mı?)</em></p>\n<ol type=\"1\">\n<li>Искам да отида. → Git___ istiyorum.</li>\n<li>Искам ти да отидеш. → Git___ istiyorum.</li>\n<li>Трябва да ставам рано. → Erken kalk___ lazım.</li>\n<li>Пушенето е забранено. → Sigara iç___ yasak.</li>\n<li>Чакам Али да дойде. → Ali’nin gel___ bekliyorum.</li>\n<li>Уча се да плувам. → Yüz___ öğreniyorum.</li>\n</ol>\n<p><strong>Упр. 19.2 — Спрегни <code>-ma</code> за всички лица.</strong>\n<em>(Bütün kişiler için „-ma“.)</em></p>\n<p>Глагол: gelmek</p>\n<ol type=\"1\">\n<li>ben ___</li>\n<li>sen ___</li>\n<li>o ___</li>\n<li>biz ___</li>\n<li>siz ___</li>\n<li>onlar ___</li>\n</ol>\n<p><strong>Упр. 19.3 — Направи <code>-dık</code> форма.</strong>\n<em>(„-dık“ biçimini yapın.)</em></p>\n<ol type=\"1\">\n<li>gelmek (o)</li>\n<li>gitmek (sen)</li>\n<li>yapmak (ben)</li>\n<li>bilmek (biz)</li>\n<li>olmak (o)</li>\n<li>görmek (onlar)</li>\n</ol>\n<p><strong>Упр. 19.4 — Кой падеж иска главният глагол?</strong> <em>(Ana\nfiil hangi hâli ister?)</em></p>\n<ol type=\"1\">\n<li>Geldiğin___ biliyorum.</li>\n<li>Geldiğin___ sevindim.</li>\n<li>Geldiğin___ eminim.</li>\n<li>Geldiğin___ söyledi.</li>\n<li>Geleceğin___ korkuyorum.</li>\n<li>Geldiğin___ inanmıyorum.</li>\n</ol>\n<p><strong>Упр. 19.5 — Преобразувай с <code>-dık</code> /\n<code>-acak</code>.</strong> <em>(„-dık/-acak“ ile çevirin.)</em></p>\n<p>Пример: Знам. Той дойде. → Geldiğini biliyorum.</p>\n<ol type=\"1\">\n<li>Чух. Али е дошъл.</li>\n<li>Казаха. Утре ще вали.</li>\n<li>Знам. Ти си прав.</li>\n<li>Разбрах. Ти не ме обичаш.</li>\n<li>Сигурен съм. Той ще дойде.</li>\n</ol>\n<p><strong>Упр. 19.6 — Преведи на турски.</strong> <em>(Türkçeye\nçevirin.)</em></p>\n<ol type=\"1\">\n<li>Искам да отида.</li>\n<li>Искам ти да дойдеш.</li>\n<li>Знам, че е дошъл.</li>\n<li>Знам, че ще дойде.</li>\n<li>Чух, че Али е дошъл.</li>\n<li>Радвам се, че дойде.</li>\n<li>Понеже беше болен, не дойде.</li>\n<li>доколкото знам</li>\n</ol>\n<hr />\n<h2 id=\"урок-20-страдателен-залог-edilgen-çatı\">УРОК 20 · Страдателен\nзалог · Edilgen çatı</h2>\n<h3 id=\"речник-sözlük-18\">Речник · Sözlük</h3>\n<table>\n<thead>\n<tr class=\"header\">\n<th>Турски</th>\n<th>Български</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>yapılmak</td>\n<td>прави се</td>\n</tr>\n<tr class=\"even\">\n<td>açılmak</td>\n<td>отваря се</td>\n</tr>\n<tr class=\"odd\">\n<td>kapanmak</td>\n<td>затваря се</td>\n</tr>\n<tr class=\"even\">\n<td>satılmak</td>\n<td>продава се</td>\n</tr>\n<tr class=\"odd\">\n<td>yazılmak</td>\n<td>пише се</td>\n</tr>\n<tr class=\"even\">\n<td>kullanılmak</td>\n<td>използва се</td>\n</tr>\n<tr class=\"odd\">\n<td>bulunmak</td>\n<td>намира се</td>\n</tr>\n<tr class=\"even\">\n<td>bilinmek</td>\n<td>известно е</td>\n</tr>\n<tr class=\"odd\">\n<td>verilmek</td>\n<td>дава се</td>\n</tr>\n<tr class=\"even\">\n<td>alınmak</td>\n<td>взема се</td>\n</tr>\n<tr class=\"odd\">\n<td>kurmak</td>\n<td>основавам</td>\n</tr>\n<tr class=\"even\">\n<td>inşa etmek</td>\n<td>строя</td>\n</tr>\n<tr class=\"odd\">\n<td>üretmek</td>\n<td>произвеждам</td>\n</tr>\n<tr class=\"even\">\n<td>tamir etmek</td>\n<td>ремонтирам</td>\n</tr>\n<tr class=\"odd\">\n<td>temizlemek</td>\n<td>чистя</td>\n</tr>\n<tr class=\"even\">\n<td>hazırlamak</td>\n<td>приготвям</td>\n</tr>\n<tr class=\"odd\">\n<td>davet etmek</td>\n<td>каня</td>\n</tr>\n<tr class=\"even\">\n<td>seçmek</td>\n<td>избирам</td>\n</tr>\n<tr class=\"odd\">\n<td>kabul etmek</td>\n<td>приемам</td>\n</tr>\n<tr class=\"even\">\n<td>reddetmek</td>\n<td>отхвърлям</td>\n</tr>\n</tbody>\n</table>\n<h3 id=\"граматика-20.1-какво-е-страдателен-залог\">Граматика 20.1 — Какво\nе страдателен залог</h3>\n<p>При страдателния залог вършителят се измества назад или изчезва\nсъвсем. Българският го прави със „се“ или с „бива“:</p>\n<table>\n<colgroup>\n<col style=\"width: 50%\" />\n<col style=\"width: 50%\" />\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th>Действителен</th>\n<th>Страдателен</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Ahmet kapıyı açtı. — Ахмет отвори вратата.</td>\n<td>Kapı açıldı. — Вратата беше отворена / се отвори.</td>\n</tr>\n<tr class=\"even\">\n<td>Bu evi 1990’da yaptılar. — Построиха къщата през 1990.</td>\n<td>Bu ev 1990’da yapıldı. — Къщата беше построена през 1990.</td>\n</tr>\n</tbody>\n</table>\n<p>Турският използва страдателен залог <strong>много по-често</strong>\nот българския — особено в обяви, инструкции, новини и официален\nстил.</p>\n<h3 id=\"граматика-20.2-образуване\">Граматика 20.2 — Образуване</h3>\n<p>Правилото зависи от последния звук на корена:</p>\n<table>\n<colgroup>\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th>Условие</th>\n<th>Окончание</th>\n<th>Пример</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>коренът завършва на <strong>гласна</strong></td>\n<td>-n-</td>\n<td>oku- → oku<strong>n</strong>mak (чете се)</td>\n</tr>\n<tr class=\"even\">\n<td>коренът завършва на <strong><code>l</code></strong></td>\n<td>-in- / -ın-</td>\n<td>bul- → bul<strong>un</strong>mak (намира се)</td>\n</tr>\n<tr class=\"odd\">\n<td>всички останали съгласни</td>\n<td>-il- / -ıl- / -ul- / -ül-</td>\n<td>yap- → yap<strong>ıl</strong>mak (прави се)</td>\n</tr>\n</tbody>\n</table>\n<p><strong>Примери по трите правила:</strong></p>\n<div class=\"line-block\">Гласна → -n- | oku<strong>n</strong>du,\nye<strong>n</strong>di, söyle<strong>n</strong>di,\nbaşla<strong>n</strong>dı |<br />\nНа <code>l</code> → -in- | bul<strong>un</strong>du,\nal<strong>ın</strong>dı, bil<strong>in</strong>di,\nöl<strong>ün</strong>dü |<br />\nДруга съгласна → -il- | yap<strong>ıl</strong>dı,\naç<strong>ıl</strong>dı, ver<strong>il</strong>di,\nsat<strong>ıl</strong>dı, yaz<strong>ıl</strong>dı |</div>\n<p><strong>Внимание:</strong> <code>almak</code> (вземам) →\n<code>alınmak</code>, а не <del>alılmak</del>, защото коренът завършва\nна <code>l</code>.</p>\n<h3 id=\"граматика-20.3-страдателен-залог-във-всички-времена\">Граматика\n20.3 — Страдателен залог във всички времена</h3>\n<p><strong>yapmak (правя) → yapılmak (прави се):</strong></p>\n<table>\n<thead>\n<tr class=\"header\">\n<th>Време</th>\n<th>Форма</th>\n<th>Превод</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>сегашно</td>\n<td>yapılıyor</td>\n<td>прави се</td>\n</tr>\n<tr class=\"even\">\n<td>широко</td>\n<td>yapılır</td>\n<td>прави се (обикновено)</td>\n</tr>\n<tr class=\"odd\">\n<td>минало</td>\n<td>yapıldı</td>\n<td>беше направено</td>\n</tr>\n<tr class=\"even\">\n<td>преразказно</td>\n<td>yapılmış</td>\n<td>било направено</td>\n</tr>\n<tr class=\"odd\">\n<td>бъдеще</td>\n<td>yapılacak</td>\n<td>ще бъде направено</td>\n</tr>\n<tr class=\"even\">\n<td>дължимост</td>\n<td>yapılmalı</td>\n<td>трябва да се направи</td>\n</tr>\n<tr class=\"odd\">\n<td>условно</td>\n<td>yapılırsa</td>\n<td>ако се направи</td>\n</tr>\n</tbody>\n</table>\n<p>Примери: - Bu ev 1990’da yapıldı. — Тази къща беше построена през\n1990. - Kapı saat sekizde açılır. — Вратата се отваря в осем. - Yeni bir\nokul yapılacak. — Ще бъде построено ново училище. - Sigara içilmez. — Не\nсе пуши. <em>(табела)</em></p>\n<h3 id=\"граматика-20.4-кой-е-подлогът\">Граматика 20.4 — Кой е\nподлогът</h3>\n<p>При страдателния залог <strong>обектът става подлог</strong> и губи\nвинителния падеж:</p>\n<table>\n<thead>\n<tr class=\"header\">\n<th>Действителен</th>\n<th>Страдателен</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Kapı<strong>yı</strong> açtılar.</td>\n<td><strong>Kapı</strong> açıldı.</td>\n</tr>\n<tr class=\"even\">\n<td>Mektub<strong>u</strong> yazdım.</td>\n<td><strong>Mektup</strong> yazıldı.</td>\n</tr>\n<tr class=\"odd\">\n<td>Ev<strong>i</strong> sattılar.</td>\n<td><strong>Ev</strong> satıldı.</td>\n</tr>\n</tbody>\n</table>\n<p><strong>Вършителят</strong> се изразява с <code>tarafından</code> (от\nстрана на) — но се използва рядко: - Bu kitap Orhan Pamuk\n<strong>tarafından</strong> yazıldı. — Тази книга е написана от Орхан\nПамук. - Kapı rüzgâr <strong>tarafından</strong> açıldı. —\nПо-естествено: <code>Kapıyı rüzgâr açtı.</code></p>\n<p>Турският предпочита да не назовава вършителя — ако трябва да го\nспомене, обикновено използва действителен залог.</p>\n<h3 id=\"граматика-20.5-безличният-страдателен-залог\">Граматика 20.5 —\nБезличният страдателен залог</h3>\n<p>Тук е разликата с българския: турският прави страдателен залог дори\nот <strong>непреходни глаголи</strong> — там, където няма обект. Тогава\nсмисълът е безличен:</p>\n<table>\n<thead>\n<tr class=\"header\">\n<th>Форма</th>\n<th>Превод</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Buraya gid<strong>il</strong>ir.</td>\n<td>Оттук се минава.</td>\n</tr>\n<tr class=\"even\">\n<td>Burada yüz<strong>ül</strong>mez.</td>\n<td>Тук не се плува.</td>\n</tr>\n<tr class=\"odd\">\n<td>Nasıl gid<strong>il</strong>ir?</td>\n<td>Как се стига?</td>\n</tr>\n<tr class=\"even\">\n<td>Bu nasıl yap<strong>ıl</strong>ır?</td>\n<td>Как се прави това?</td>\n</tr>\n<tr class=\"odd\">\n<td>Çok çalış<strong>ıl</strong>dı.</td>\n<td>Работи се много.</td>\n</tr>\n</tbody>\n</table>\n<p>Това е основната форма за <strong>надписи, инструкции и общи\nправила</strong>:</p>\n<ul>\n<li>Sigara içilmez. — Пушенето забранено.</li>\n<li>Buraya park edilmez. — Тук не се паркира.</li>\n<li>Girilmez. — Вход забранен.</li>\n<li>Bu kelime nasıl yazılır? — Как се пише тази дума?</li>\n</ul>\n<h3 id=\"граматика-20.6-двоен-страдателен-залог\">Граматика 20.6 — Двоен\nстрадателен залог</h3>\n<p>Ако коренът вече завършва на <code>l</code>, а формата иска\n<code>-il-</code>, се получава двойно окончание. Турският го избягва,\nкато добавя <code>-n-</code>:</p>\n<p><code>söylemek</code> (казвам) → söyle<strong>n</strong>mek (казва\nсе), не <del>söyleilmek</del> <code>temizlemek</code> (чистя) →\ntemizle<strong>n</strong>mek (чисти се) <code>beklemek</code> (чакам) →\nbekle<strong>n</strong>mek (чака се)</p>\n<p>Правилото важи за всички глаголи на <code>-lemek/-lamak</code> — те\nса много: <code>hazırlamak → hazırlanmak</code>,\n<code>başlamak → başlanmak</code>, <code>toplamak → toplanmak</code></p>\n<p><strong>Внимание — омонимия:</strong> <code>hazırlanmak</code> значи\nи „приготвя се“ (страдателно), и „приготвям се“ (възвратно). Контекстът\nрешава: - Yemek hazırlandı. — Ядката беше приготвена. - Ben hazırlandım.\n— Аз се приготвих.</p>\n<h3 id=\"защо-е-така-neden-böyle-19\">Защо е така · Neden böyle</h3>\n<p><strong>Защо турският използва страдателен залог толкова\nчесто?</strong> Защото културата на езика избягва прякото посочване на\nвършителя в официален контекст. Където българският казва „Забранено е\nпушенето“, турският казва <code>Sigara içilmez</code> — буквално „не се\nпуши“, без никакъв деец.</p>\n<p>Освен това турският няма удобно безлично „се“ като българското,\nзатова използва страдателния залог за същата работа.</p>\n<p><strong>Защо <code>almak → alınmak</code>, а не\n<code>alılmak</code>?</strong> Защото два <code>l</code> подред са\nнеудобни за изговор. Същата причина стои зад <code>söylenmek</code>\nвместо <del>söyleilmek</del>. Турският системно избягва струпване на\nеднакви съгласни — езикът е много „фонетично удобен“.</p>\n<p><strong>Защо <code>tarafından</code> се използва рядко?</strong>\nЗащото ако знаеш кой е вършителят, по-естествено е да го направиш\nподлог: <code>Kapıyı Ahmet açtı</code> е по-турско от\n<code>Kapı Ahmet tarafından açıldı</code>. Втората форма звучи като\nпревод от европейски език. Използва се в новини, научни текстове и\nюридически документи.</p>\n<p><strong>Как да разпозная страдателен от възвратен залог?</strong> Не\nвинаги можеш само по формата — <code>yıkanmak</code> е и „измива се“, и\n„мие се сам“. Смисълът се вади от контекста и от това дали има одушевен\nподлог: <code>Bulaşıklar yıkandı</code> (съдовете бяха измити) ↔︎\n<code>Çocuk yıkandı</code> (детето се изкъпа).</p>\n<h3 id=\"текст-за-четене-и-превод-okuma-ve-çeviri-metni-18\">Текст за\nчетене и превод · Okuma ve çeviri metni</h3>\n<p><strong>Bir müze — Един музей</strong></p>\n<blockquote>\n<p>Bu müze 1923 yılında kuruldu ve o zamandan beri milyonlarca ziyaretçi\ntarafından gezildi. Bina aslında bir saray olarak inşa edilmişti,\nsonradan müzeye çevrildi.</p>\n<p>İçeride yaklaşık on bin eser sergileniyor. Eserlerin çoğu Anadolu’da\nyapılan kazılarda bulundu. En değerli parçalar birinci katta, özel bir\nsalonda korunuyor.</p>\n<p>Müze her gün saat dokuzda açılır, akşam altıda kapanır. Pazartesi\ngünleri kapalıdır. Bilet gişeden alınabilir ya da internetten satın\nalınabilir.</p>\n<p>İçeride fotoğraf çekilebilir ama flaş kullanılmaz. Çantalar girişte\nbırakılmalıdır. Rehberli turlar sabah on birde ve öğleden sonra üçte\nbaşlar.</p>\n</blockquote>\n<p><em>Нови думи:</em> <code>kurulmak</code> — основан съм;\n<code>ziyaretçi</code> — посетител; <code>gezilmek</code> — обхождам се;\n<code>saray</code> — дворец; <code>çevrilmek</code> — превръщам се;\n<code>eser</code> — творба, експонат; <code>sergilenmek</code> — излага\nсе; <code>kazı</code> — разкопка; <code>değerli</code> — ценен;\n<code>korunmak</code> — пази се; <code>gişe</code> — каса;\n<code>flaş</code> — светкавица; <code>giriş</code> — вход;\n<code>rehberli</code> — с екскурзовод.</p>\n<p><strong>Въпроси:</strong></p>\n<ol type=\"1\">\n<li>Müze ne zaman kuruldu?</li>\n<li>Bina önce ne olarak inşa edilmiş?</li>\n<li>Eserler nerede bulunmuş?</li>\n<li>İçeride ne yasak?</li>\n</ol>\n<h3 id=\"упражнения-alıştırmalar-19\">Упражнения · Alıştırmalar</h3>\n<p><strong>Упр. 20.1 — Направи страдателен залог.</strong> <em>(Edilgen\nçatı yapın.)</em></p>\n<ol type=\"1\">\n<li>yapmak</li>\n<li>açmak</li>\n<li>yazmak</li>\n<li>satmak</li>\n<li>okumak</li>\n<li>bulmak</li>\n<li>almak</li>\n<li>vermek</li>\n</ol>\n<p><strong>Упр. 20.2 — Кое правило? (-n-, -in-, -il-)</strong>\n<em>(Hangi kural?)</em></p>\n<ol type=\"1\">\n<li>okumak → ___</li>\n<li>bulmak → ___</li>\n<li>yapmak → ___</li>\n<li>almak → ___</li>\n<li>söylemek → ___</li>\n<li>açmak → ___</li>\n</ol>\n<p><strong>Упр. 20.3 — Преобразувай в страдателен залог.</strong>\n<em>(Edilgene çevirin.)</em></p>\n<p>Пример: Kapıyı açtılar. → Kapı açıldı.</p>\n<ol type=\"1\">\n<li>Mektubu yazdım.</li>\n<li>Evi sattılar.</li>\n<li>Yemeği hazırladık.</li>\n<li>Kitabı okudular.</li>\n<li>Pencereyi kapattı.</li>\n</ol>\n<p><strong>Упр. 20.4 — Безличен страдателен залог (надписи).</strong>\n<em>(Kişisiz edilgen.)</em></p>\n<ol type=\"1\">\n<li>Не се пуши.</li>\n<li>Тук не се паркира.</li>\n<li>Вход забранен.</li>\n<li>Как се стига?</li>\n<li>Как се пише тази дума?</li>\n</ol>\n<p><strong>Упр. 20.5 — Постави в посоченото време.</strong>\n<em>(Belirtilen zamana çevirin.)</em></p>\n<p>Глагол: yapılmak</p>\n<ol type=\"1\">\n<li>сегашно</li>\n<li>широко</li>\n<li>минало</li>\n<li>бъдеще</li>\n<li>дължимост</li>\n</ol>\n<p><strong>Упр. 20.6 — Преведи на турски.</strong> <em>(Türkçeye\nçevirin.)</em></p>\n<ol type=\"1\">\n<li>Тази къща беше построена през 1990.</li>\n<li>Вратата се отваря в осем.</li>\n<li>Ще бъде построено ново училище.</li>\n<li>Тази книга е написана от Орхан Памук.</li>\n<li>Билетът може да се купи от касата.</li>\n<li>Не се пуши.</li>\n<li>Как се прави това?</li>\n<li>Чантите трябва да се оставят на входа.</li>\n</ol>\n<hr />\n<hr />\n<h1 id=\"речник-sözlük-19\">РЕЧНИК · Sözlük</h1>\n<p>Речникът има две части: <strong>по уроци</strong> (за преговор след\nвсеки урок) и <strong>азбучен</strong> (за справка). Докосни турската\nдума, за да я чуеш.</p>\n<hr />\n<h2 id=\"речник-по-уроци-ünitelere-göre-sözlük\">Речник по уроци ·\nÜnitelere göre sözlük</h2>\n<h3 id=\"урок-1\">УРОК 1</h3>\n<table>\n<thead>\n<tr class=\"header\">\n<th>Türkçe</th>\n<th>Български</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>merhaba</td>\n<td>здравей / здравейте</td>\n</tr>\n<tr class=\"even\">\n<td>günaydın</td>\n<td>добро утро</td>\n</tr>\n<tr class=\"odd\">\n<td>iyi günler</td>\n<td>добър ден</td>\n</tr>\n<tr class=\"even\">\n<td>iyi akşamlar</td>\n<td>добър вечер</td>\n</tr>\n<tr class=\"odd\">\n<td>iyi geceler</td>\n<td>лека нощ</td>\n</tr>\n<tr class=\"even\">\n<td>hoşça kal / hoşça kalın</td>\n<td>остани/останете си със здраве</td>\n</tr>\n<tr class=\"odd\">\n<td>güle güle</td>\n<td>довиждане (на този, който си тръгва)</td>\n</tr>\n<tr class=\"even\">\n<td>görüşürüz</td>\n<td>ще се видим</td>\n</tr>\n<tr class=\"odd\">\n<td>teşekkür ederim</td>\n<td>благодаря</td>\n</tr>\n<tr class=\"even\">\n<td>rica ederim</td>\n<td>моля / няма защо</td>\n</tr>\n<tr class=\"odd\">\n<td>lütfen</td>\n<td>моля (при молба)</td>\n</tr>\n<tr class=\"even\">\n<td>evet</td>\n<td>да</td>\n</tr>\n<tr class=\"odd\">\n<td>hayır</td>\n<td>не</td>\n</tr>\n<tr class=\"even\">\n<td>ad / isim</td>\n<td>име</td>\n</tr>\n<tr class=\"odd\">\n<td>öğrenci</td>\n<td>ученик, студент</td>\n</tr>\n<tr class=\"even\">\n<td>öğretmen</td>\n<td>учител</td>\n</tr>\n<tr class=\"odd\">\n<td>doktor</td>\n<td>лекар</td>\n</tr>\n<tr class=\"even\">\n<td>mühendis</td>\n<td>инженер</td>\n</tr>\n<tr class=\"odd\">\n<td>avukat</td>\n<td>адвокат</td>\n</tr>\n<tr class=\"even\">\n<td>aşçı</td>\n<td>готвач</td>\n</tr>\n<tr class=\"odd\">\n<td>şoför</td>\n<td>шофьор</td>\n</tr>\n<tr class=\"even\">\n<td>Türk</td>\n<td>турчин</td>\n</tr>\n<tr class=\"odd\">\n<td>Bulgar</td>\n<td>българин</td>\n</tr>\n<tr class=\"even\">\n<td>nasılsın? / nasılsınız?</td>\n<td>как си? / как сте?</td>\n</tr>\n<tr class=\"odd\">\n<td>iyiyim</td>\n<td>добре съм</td>\n</tr>\n<tr c
