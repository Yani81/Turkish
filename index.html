strong>çe</strong>, çocuk<strong>ça</strong>, güzel<strong>ce</strong></td></tr><tr><td>-cık / -cik / -cuk / -cük</td><td>умалително</td><td>kitap<strong>çık</strong>, ev<strong>cik</strong>, küçü<strong>cük</strong></td></tr></tbody></table><p><strong>Озвучаване:</strong> след звучен звук наставката започва с <code>c</code>, а след <code>ç f h k p s ş t</code> — с <code>ç</code>: <code>gazete<strong>ci</strong></code>, но <code>kitap<strong>çı</strong></code>.</p><h3>Граматика 27.3 — От глагол към име</h3><table><thead><tr><th>Наставка</th><th>Значение</th><th>Примери</th></tr></thead><tbody><tr><td>-gı / -gi / -gu / -gü</td><td>резултат, нещо получено</td><td>bil- → bil<strong>gi</strong>, sev- → sev<strong>gi</strong>, çal- → çal<strong>gı</strong></td></tr><tr><td>-ım / -im / -um / -üm</td><td>еднократно действие</td><td>al- → al<strong>ım</strong>, öl- → öl<strong>üm</strong>, seç- → seç<strong>im</strong></td></tr><tr><td>-gın / -gin / -gun / -gün</td><td>състояние (прилагателно)</td><td>yor- → yor<strong>gun</strong>, üz- → üz<strong>gün</strong>, dal- → dal<strong>gın</strong></td></tr><tr><td>-ık / -ik / -uk / -ük</td><td>резултат (прилагателно)</td><td>kır- → kır<strong>ık</strong>, aç- → a<strong>çık</strong>, boz- → boz<strong>uk</strong></td></tr><tr><td>-ıcı / -ici</td><td>който върши</td><td>yaz- → yaz<strong>ıcı</strong> (принтер), sat- → sat<strong>ıcı</strong> (продавач)</td></tr></tbody></table><h3>Граматика 27.4 — От име към глагол</h3><table><thead><tr><th>Наставка</th><th>Примери</th></tr></thead><tbody><tr><td>-lamak / -lemek</td><td>su → su<strong>lamak</strong> (поливам), temiz → temiz<strong>lemek</strong></td></tr><tr><td>-laşmak / -leşmek</td><td>güzel → güzel<strong>leşmek</strong>, sert → sert<strong>leşmek</strong></td></tr><tr><td>-lanmak / -lenmek</td><td>ev → ev<strong>lenmek</strong> (женя се), hasta → hasta<strong>lanmak</strong></td></tr></tbody></table><h3>Граматика 27.5 — Редът на наставките</h3><p>Наставките се нанизват в строг ред: <strong>словообразуващи първо, граматични после</strong>.</p><p>göz + lük + çü + ler + de = <code>gözlükçülerde</code> — при оптиците.<br />iş + çi + ler + imiz + in = <code>işçilerimizin</code> — на нашите работници.</p><p>Никога не се слага граматична наставка преди словообразуваща: <del>gözlerlük</del> е невъзможно.</p><h3>Прочети и отговори · Okuyup cevaplayın</h3><blockquote><p>Dedem gençken gözlükçüydü. Küçük bir dükkânı vardı ve bütün mahalle ondan gözlük alırdı. Babam ise gazeteci oldu; işi zordu ama sevgiyle çalışırdı. Ben de öğretmenlik okuyorum. Üçümüz de farklı işler yapıyoruz, ama dedem der ki: „İşsizlik en büyük yorgunluktur.“</p></blockquote><ol type=\"1\"><li>Dede gençken ne işle uğraşırmış?</li><li>Baba hangi mesleği seçmiş?</li><li>Anlatan kişi ne okuyor?</li><li>Dedeye göre en büyük yorgunluk nedir?</li></ol><h3>Упражнения · Alıştırmalar</h3><p><strong>Упр. 27.1 — Направи професия с -cı / -çi.</strong> <em>(Meslek adı yapın.)</em></p><ol type=\"1\"><li>iş</li><li>kitap</li><li>gazete</li><li>yol</li><li>göz</li><li>süt</li></ol><p><strong>Упр. 27.2 — Направи дума с -lık / -lik.</strong> <em>(-lık / -lik ile türetin.)</em></p><ol type=\"1\"><li>güzel</li><li>öğretmen</li><li>göz</li><li>tuz</li><li>çocuk</li></ol><p><strong>Упр. 27.3 — -lı или -sız?</strong> <em>(-lı mı -sız mı?)</em></p><ol type=\"1\"><li>чай със захар: şeker___ çay</li><li>кафе без захар: şeker___ kahve</li><li>безработен: iş___</li><li>от Истанбул: İstanbul___</li><li>безводен: su___</li></ol><p><strong>Упр. 27.4 — Направи име от глагола.</strong> <em>(Fiilden isim türetin.)</em></p><ol type=\"1\"><li>bilmek (знание)</li><li>sevmek (обич)</li><li>seçmek (избор)</li><li>yormak (уморен)</li><li>kırmak (счупен)</li></ol><p><strong>Упр. 27.5 — Разглоби думата на наставки.</strong> <em>(Kelimeyi eklerine ayırın.)</em></p><ol type=\"1\"><li>gözlükçülerde</li><li>işçilerimizin</li><li>güzelliğinden</li><li>kitapçıdan</li><li>evlenmek</li></ol><p><strong>Упр. 27.6 — Преведи на турски.</strong> <em>(Türkçeye çevirin.)</em></p><ol type=\"1\"><li>книжар</li><li>журналист</li><li>очила</li><li>чай без захар</li><li>красота</li><li>безработица</li><li>продавач</li><li>от България</li></ol>\n<h3>Тематичен речник · Konu sözlüğü — Професии и работно място · Meslekler ve iş yeri</h3><table><thead><tr><th>Türkçe</th><th>Български</th></tr></thead><tbody><tr><td>meslek</td><td>професия</td></tr><tr><td>kariyer</td><td>кариера</td></tr><tr><td>işveren</td><td>работодател</td></tr><tr><td>personel</td><td>персонал</td></tr><tr><td>ekip</td><td>екип</td></tr><tr><td>departman</td><td>отдел</td></tr><tr><td>yönetici</td><td>ръководител</td></tr><tr><td>asistan</td><td>асистент</td></tr><tr><td>sekreter</td><td>секретар</td></tr><tr><td>muhasebeci</td><td>счетоводител</td></tr><tr><td>mimar</td><td>архитект</td></tr><tr><td>teknisyen</td><td>техник</td></tr><tr><td>veteriner</td><td>ветеринар</td></tr><tr><td>kasiyer</td><td>касиер</td></tr><tr><td>tezgâhtar</td><td>продавач-консултант</td></tr><tr><td>kurye</td><td>куриер</td></tr><tr><td>temizlikçi</td><td>чистач</td></tr><tr><td>güvenlik görevlisi</td><td>охранител</td></tr><tr><td>akademisyen</td><td>университетски преподавател</td></tr><tr><td>çevirmen</td><td>преводач (писмен)</td></tr><tr><td>tercüman</td><td>преводач (устен)</td></tr><tr><td>yazılımcı</td><td>програмист</td></tr><tr><td>tasarımcı</td><td>дизайнер</td></tr><tr><td>satış temsilcisi</td><td>търговски представител</td></tr><tr><td>iş görüşmesi</td><td>интервю за работа</td></tr><tr><td>özgeçmiş</td><td>автобиография</td></tr><tr><td>referans</td><td>препоръка</td></tr><tr><td>deneyim</td><td>опит</td></tr><tr><td>staj</td><td>стаж</td></tr><tr><td>terfi</td><td>повишение</td></tr><tr><td>zam</td><td>увеличение на заплатата</td></tr><tr><td>emekli</td><td>пенсионер</td></tr><tr><td>emeklilik</td><td>пенсиониране</td></tr><tr><td>vardiya</td><td>смяна</td></tr><tr><td>fazla mesai</td><td>извънреден труд</td></tr><tr><td>iş yükü</td><td>натовареност</td></tr><tr><td>son teslim tarihi</td><td>краен срок</td></tr><tr><td>verimli</td><td>ефективен</td></tr><tr><td>işten ayrılmak</td><td>напускам работа</td></tr><tr><td>işe alım</td><td>назначаване</td></tr><tr><td>sözleşmeli</td><td>на договор</td></tr><tr><td>serbest çalışan</td><td>свободна практика</td></tr><tr><td>uzaktan çalışma</td><td>дистанционна работа</td></tr><tr><td>ofis</td><td>офис</td></tr><tr><td>iş arkadaşı</td><td>колега</td></tr></tbody></table><p><strong>Упр. 27.7 — Как е на турски?</strong> <em>(Türkçesi nedir?)</em></p><ol type=\"1\"><li>професия</li><li>работодател</li><li>отдел</li><li>счетоводител</li><li>автобиография</li><li>стаж</li><li>повишение</li><li>смяна</li><li>краен срок</li><li>колега</li></ol><hr />\n<h1 id=\"четива\">ЧЕТИВА · Okuma parçaları</h1><p>Текстовете вървят от кратък към дълъг. Първото четиво е сто и петдесет думи с прости изречения; последното минава триста и ползва всичко от Част II и III. Докосни абзац, за да го чуеш целия.</p><h2 id=\"четиво-1\">ЧЕТИВО 1 · İlk iş günüm — Първият ми работен ден</h2><p class=\"lvl\"><em>Ниво A2–B1 · 153 думи · 30 нови</em></p><p>Dün yeni işime başladım. Sabah çok erkenden kalktım, çünkü geç kalmaktan korkuyordum. Otobüs durağında yirmi dakika bekledim; trafik her zamanki gibi yoğundu.</p><p>Ofise vardığımda müdür beni kapıda karşıladı ve diğer çalışanlarla tanıştırdı. Herkes çok samimiydi. Bana bir masa, bir bilgisayar ve bir de anahtar kartı verdiler. Sonra insan kaynakları sözleşmemi imzalattı ve deneme süresinin üç ay olduğunu söyledi.</p><p>Öğle arasında meslektaşlarımla kantine gittik. Maaş, mesai saatleri ve izin günleri hakkında konuştuk. Biri geçen yıl terfi almış, bir başkası ise altı ay sonra işten çıkmayı düşünüyormuş. Anladığım kadarıyla şirket çalışanlarına iyi davranıyor.</p><p>Öğleden sonra ilk toplantıma katıldım. Konuşulanların yarısını anlamadım ama not aldım. Müdür bana ilk görevimi verdi: haftaya küçük bir sunum hazırlayacağım.</p><p>Akşam eve döndüğümde çok yorgundum ama mutluydum. Yeni bir başlangıç insanı hem korkutuyor hem heyecanlandırıyor. Yatmadan önce başvuru yaptığım günü hatırladım ve gülümsedim.</p><p>İşe alınma sürecim aslında bir ay sürdü. Önce ilanı gördüm, sonra başvuru yaptım; iki hafta sonra telefonla aradılar.</p><h3>Нови думи · Yeni kelimeler</h3><table><thead><tr><th>Türkçe</th><th>Български</th></tr></thead><tbody><tr><td>iş günü</td><td>работен ден</td></tr><tr><td>geç kalmak</td><td>закъснявам</td></tr><tr><td>durak</td><td>спирка</td></tr><tr><td>yoğun</td><td>натоварен, гъст</td></tr><tr><td>varmak</td><td>пристигам</td></tr><tr><td>müdür</td><td>директор</td></tr><tr><td>karşılamak</td><td>посрещам</td></tr><tr><td>çalışan</td><td>служител</td></tr><tr><td>tanıştırmak</td><td>запознавам (двама)</td></tr><tr><td>samimi</td><td>сърдечен, искрен</td></tr><tr><td>anahtar kartı</td><td>карта за достъп</td></tr><tr><td>öğle arası</td><td>обедна почивка</td></tr><tr><td>meslektaş</td><td>колега</td></tr><tr><td>kantin</td><td>стол, бюфет</td></tr><tr><td>maaş</td><td>заплата</td></tr><tr><td>mesai</td><td>работно време</td></tr><tr><td>izin günü</td><td>почивен ден</td></tr><tr><td>şirket</td><td>фирма</td></tr><tr><td>davranmak</td><td>отнасям се, държа се</td></tr><tr><td>başlangıç</td><td>начало</td></tr><tr><td>korkutmak</td><td>плаша</td></tr><tr><td>heyecanlandırmak</td><td>вълнувам</td></tr><tr><td>başvuru</td><td>кандидатстване</td></tr><tr><td>sözleşme</td><td>договор</td></tr><tr><td>deneme süresi</td><td>изпитателен срок</td></tr><tr><td>terfi</td><td>повишение</td></tr><tr><td>işten çıkmak</td><td>напускам работа</td></tr><tr><td>işe almak</td><td>назначавам</td></tr><tr><td>toplantı</td><td>среща, събрание</td></tr><tr><td>görev</td><td>задача, длъжност</td></tr></tbody></table><h3>Упражнения · Alıştırmalar</h3><p><strong>Упр. Ч1.1 — Отговори на въпросите.</strong> <em>(Soruları cevaplayın.)</em></p><ol type=\"1\"><li>Yazar neden erken kalkmış?</li><li>Ofiste ona ne vermişler?</li><li>Öğle arasında ne konuşmuşlar?</li><li>Akşam nasıl hissetmiş?</li><li>İnsan kaynakları ne yaptırmış?</li><li>İlk görevi neymiş?</li></ol><p><strong>Упр. Ч1.2 — Как е на турски?</strong> <em>(Türkçesi nedir?)</em></p><ol type=\"1\"><li>заплата</li><li>колега</li><li>фирма</li><li>спирка</li><li>договор</li><li>повишение</li><li>обедна почивка</li><li>задача</li></ol><hr /><h2 id=\"четиво-2\">ЧЕТИВО 2 · Doktorda — При лекаря</h2><p class=\"lvl\"><em>Ниво A2 · 162 думи · 30 нови</em></p><p>Üç gündür kendimi iyi hissetmiyordum. Başım ağrıyordu, ateşim vardı ve sürekli öksürüyordum. Geceleri zor nefes alıyordum, sabahları ise başım dönüyordu. Sonunda randevu aldım ve sağlık ocağına gittim.</p><p>Bekleme salonu kalabalıktı. Hemşire önce ateşimi ölçtü, sonra beni muayene odasına aldı. Doktor boğazıma baktı, ciğerlerimi dinledi ve birkaç soru sordu: „Ne zaman başladı? Midenizde bir şikâyet var mı?“</p><p>„Ciddi bir şey yok,“ dedi sonunda, „sadece soğuk algınlığı. Grip olsaydınız ateşiniz çok daha yüksek olurdu. Bol bol dinlenin, sıcak sıvı için ve üç gün dışarı çıkmayın.“ Tahlil istemedi, iğne de yazmadı.</p><p>Bana şurup ve ağrı kesici yazdı. Reçeteyi alıp eczaneye gittim. Eczacı ilaçları günde üç kez, yemekten sonra almamı söyledi ve şurubu buzdolabında saklamamı tembih etti.</p><p>İki gün sonra çok daha iyiydim. Yine de doktor bir hafta boyunca soğuk havada dışarı çıkmamamı istemişti. Sonbaharda hastalanmamak için her yıl aşı olmayı düşünüyorum, ama her yıl da unutuyorum.</p><p>Eczaneden çıkarken aklıma geldi: sağlık sigortam bu yıl yenilenmemiş olabilirdi. Neyse ki eczacı kartı okuttu ve her şey yolundaydı.</p><h3>Нови думи · Yeni kelimeler</h3><table><thead><tr><th>Türkçe</th><th>Български</th></tr></thead><tbody><tr><td>hissetmek</td><td>чувствам се</td></tr><tr><td>ağrımak</td><td>боли ме</td></tr><tr><td>ateş</td><td>температура</td></tr><tr><td>öksürmek</td><td>кашлям</td></tr><tr><td>randevu</td><td>час, среща</td></tr><tr><td>sağlık ocağı</td><td>поликлиника</td></tr><tr><td>ölçmek</td><td>меря</td></tr><tr><td>boğaz</td><td>гърло</td></tr><tr><td>ciddi</td><td>сериозен</td></tr><tr><td>soğuk algınlığı</td><td>настинка</td></tr><tr><td>dinlenmek</td><td>почивам си</td></tr><tr><td>sıvı</td><td>течност</td></tr><tr><td>şurup</td><td>сироп</td></tr><tr><td>ağrı kesici</td><td>болкоуспокояващо</td></tr><tr><td>reçete</td><td>рецепта</td></tr><tr><td>eczane</td><td>аптека</td></tr><tr><td>eczacı</td><td>аптекар</td></tr><tr><td>ilaç</td><td>лекарство</td></tr><tr><td>tembih etmek</td><td>заръчвам, предупреждавам</td></tr><tr><td>hastalanmak</td><td>разболявам се</td></tr><tr><td>grip</td><td>грип</td></tr><tr><td>aşı</td><td>ваксина</td></tr><tr><td>iğne</td><td>инжекция; игла</td></tr><tr><td>tahlil</td><td>изследване, проба</td></tr><tr><td>muayene</td><td>преглед</td></tr><tr><td>hemşire</td><td>медицинска сестра</td></tr><tr><td>acil</td><td>спешен</td></tr><tr><td>nefes almak</td><td>дишам</td></tr><tr><td>mide</td><td>стомах</td></tr><tr><td>baş dönmesi</td><td>световъртеж</td></tr></tbody></table><h3>Упражнения · Alıştırmalar</h3><p><strong>Упр. Ч2.1 — Отговори на въпросите.</strong> <em>(Soruları cevaplayın.)</em></p><ol type=\"1\"><li>Yazarın şikâyetleri nelermiş?</li><li>Doktor ne teşhis koymuş?</li><li>İlaçları ne zaman alacakmış?</li><li>Doktor bir hafta ne yapmamasını söylemiş?</li><li>Hemşire ne yapmış?</li><li>Doktor şurubu nerede saklamasını istemiş?</li></ol><p><strong>Упр. Ч2.2 — Как е на турски?</strong> <em>(Türkçesi nedir?)</em></p><ol type=\"1\"><li>аптека</li><li>рецепта</li><li>настинка</li><li>температура</li><li>преглед</li><li>ваксина</li><li>медицинска сестра</li><li>лекарство</li></ol><hr /><h2 id=\"четиво-3\">ЧЕТИВО 3 · İstanbul'da bir gün — Един ден в Истанбул</h2><p class=\"lvl\"><em>Ниво A2 · 181 думи · 30 нови</em></p><p>Sabah metroyla Taksim'e indim. Meydan kalabalıktı; turistler fotoğraf çekiyor, satıcılar simit satıyor, biri de gitar çalıyordu. Oradan tramvaya binip Sultanahmet'e gittim. Aktarma yaparken kartımda para kalmadığını fark ettim ve gişeden yeniden yükledim.</p><p>Ayasofya'nın önünde uzun bir kuyruk vardı. Yarım saat bekledim, ama içerisi bu beklemeye değdi. Çıkışta bir görevliye yolu sordum; caddeyi gösterip „Trafik ışığından sonra sola dönün,“ dedi. Kaldırımlar dardı, yayalar zor yürüyordu.</p><p>Öğleden sonra iskeleye indim ve vapurla karşı yakaya geçtim. Boğaz'da martılar peşimizden geldi; yolcular onlara simit atıyordu. Köprünün altından geçerken şehir bir anda başka bir şehre benzedi.</p><p>Kadıköy'de sahil boyunca yürüdüm ve bir çay bahçesinde oturdum. Yanımdaki masada iki öğrenci sınavlardan şikâyet ediyordu. Sokakları dolaşırken küçük kitapçılar, balıkçılar ve eski plakçılar gördüm.</p><p>Akşamüstü dolmuşla otele döndüm. Şoför yönü sorduğumda uzun uzun tarif etti, hatta yanlış inmeyeyim diye beni uyardı. Şehir büyük, ulaşım karışık, otopark bulmak neredeyse imkânsız — ama insanlar yolu tarif etmekten hiç şikâyet etmiyor.</p><p>Sultanahmet'ten çıkınca bir kahvehanede mola verdim. Yaşlı adamlar tavla oynuyor, garson ince belli bardaklarla çay taşıyordu. Yan masadaki bir amca nereli olduğumu sordu; Bulgaristan'dan geldiğimi söyleyince gülümsedi ve „Komşuyuz o zaman,“ dedi.</p><h3>Нови думи · Yeni kelimeler</h3><table><thead><tr><th>Türkçe</th><th>Български</th></tr></thead><tbody><tr><td>metro</td><td>метро</td></tr><tr><td>meydan</td><td>площад</td></tr><tr><td>kalabalık</td><td>тълпа; многолюден</td></tr><tr><td>satıcı</td><td>продавач</td></tr><tr><td>tramvay</td><td>трамвай</td></tr><tr><td>kuyruk</td><td>опашка; опашка (на животно)</td></tr><tr><td>gişe</td><td>каса, гише</td></tr><tr><td>değmek</td><td>струва си</td></tr><tr><td>vapur</td><td>ферибот</td></tr><tr><td>yaka</td><td>бряг (на пролива); яка</td></tr><tr><td>boğaz</td><td>проток</td></tr><tr><td>martı</td><td>чайка</td></tr><tr><td>sahil</td><td>крайбрежие</td></tr><tr><td>çay bahçesi</td><td>чайна градина</td></tr><tr><td>akşamüstü</td><td>привечер</td></tr><tr><td>dolmuş</td><td>маршрутка</td></tr><tr><td>ulaşım</td><td>транспорт</td></tr><tr><td>tarif etmek</td><td>обяснявам (път)</td></tr><tr><td>şikâyet etmek</td><td>оплаквам се</td></tr><tr><td>kaldırım</td><td>тротоар</td></tr><tr><td>köprü</td><td>мост</td></tr><tr><td>iskele</td><td>кей, пристан</td></tr><tr><td>aktarma</td><td>прекачване</td></tr><tr><td>bilet almak</td><td>купувам билет</td></tr><tr><td>yön</td><td>посока</td></tr><tr><td>cadde</td><td>булевард</td></tr><tr><td>sokak</td><td>улица</td></tr><tr><td>trafik ışığı</td><td>светофар</td></tr><tr><td>yaya</td><td>пешеходец</td></tr><tr><td>otopark</td><td>паркинг</td></tr></tbody></table><h3>Упражнения · Alıştırmalar</h3><p><strong>Упр. Ч3.1 — Отговори на въпросите.</strong> <em>(Soruları cevaplayın.)</em></p><ol type=\"1\"><li>Yazar Taksim'e nasıl gitmiş?</li><li>Ayasofya'da ne kadar beklemiş?</li><li>Karşı yakaya nasıl geçmiş?</li><li>Otele nasıl dönmüş?</li><li>Kartında ne olmuş?</li><li>Görevli yolu nasıl tarif etmiş?</li></ol><p><strong>Упр. Ч3.2 — Как е на турски?</strong> <em>(Türkçesi nedir?)</em></p><ol type=\"1\"><li>ферибот</li><li>маршрутка</li><li>транспорт</li><li>площад</li><li>мост</li><li>тротоар</li><li>прекачване</li><li>пешеходец</li></ol><hr /><h2 id=\"четиво-4\">ЧЕТИВО 4 · Kapalı Çarşı'da pazarlık — Пазарлък в Капалъ чарши</h2><p class=\"lvl\"><em>Ниво B1 · 196 думи · 30 нови</em></p><p>Kapalı Çarşı'ya girer girmez esnafın sesleri her yandan geldi. Dar sokaklarda binlerce dükkân var; halıcılar, kuyumcular, deri satanlar. Bir vitrinde güzel bir halı gördüm ve içeri girdim.</p><p>Satıcı beni güler yüzle karşıladı. Fiyatını sorunca gülümseyerek yüksek bir rakam söyledi. „Bu biraz pahalı,“ dedim. „Daha ucuzu var mı? İndirim yapabilir misiniz?“ Cevap vermeden önce çay ısmarladı ve pazarlık böylece başladı.</p><p>Önce halının nereden geldiğini, kaç yılda dokunduğunu anlattı. Ben de başka dükkânlarda benzerini gördüğümü söyledim. On dakika sonra fiyat üçte bir düşmüştü. Kredi kartıyla ödeyecektim, ama nakit ödeyince biraz daha indirim yaptı; taksit istemediğim için memnun oldu.</p><p>Fişi istedim; garanti belgesi de verdi. Kalitesinden emin olmak için halıyı iyice inceledim, arkasını çevirdim, düğümlerine baktım. „Beğenmezseniz bir hafta içinde iade edebilir ya da değiştirebilirsiniz,“ dedi. Para üstünü verirken adımı sordu.</p><p>Çıkarken kampanya afişlerine takıldı gözüm: „Her ikinci ürün yarı fiyatına.“ Kasada uzun bir kuyruk vardı, çoğu turist. Çarşıdan çıkarken düşündüm: burada pazarlık sadece bir para meselesi değil, bir çeşit sohbet. Müşteriyi tanımadan fiyat söylemiyorlar.</p><p>Yan dükkânda bir kadın beden sorunu yaşıyordu. Aldığı ceket dar gelmiş, değiştirmek istiyordu. Satıcı önce başka bir renk denemesini önerdi, sonra kasadan parasını geri verdi. Kimse sesini yükseltmedi; her şey çay içilirken hallolmuş gibiydi.</p><h3>Нови думи · Yeni kelimeler</h3><table><thead><tr><th>Türkçe</th><th>Български</th></tr></thead><tbody><tr><td>çarşı</td><td>пазар, чаршия</td></tr><tr><td>esnaf</td><td>търговци, занаятчии</td></tr><tr><td>dükkân</td><td>магазин, дюкян</td></tr><tr><td>halı</td><td>килим</td></tr><tr><td>fiyat</td><td>цена</td></tr><tr><td>rakam</td><td>цифра, число</td></tr><tr><td>pahalı</td><td>скъп</td></tr><tr><td>ucuz</td><td>евтин</td></tr><tr><td>indirim</td><td>отстъпка</td></tr><tr><td>pazarlık</td><td>пазарлък</td></tr><tr><td>ısmarlamak</td><td>поръчвам, черпя</td></tr><tr><td>düşmek</td><td>падам, спада</td></tr><tr><td>nakit</td><td>в брой</td></tr><tr><td>ödemek</td><td>плащам</td></tr><tr><td>fiş</td><td>касова бележка</td></tr><tr><td>garanti belgesi</td><td>гаранция</td></tr><tr><td>kalite</td><td>качество</td></tr><tr><td>incelemek</td><td>разглеждам внимателно</td></tr><tr><td>mesele</td><td>въпрос, работа</td></tr><tr><td>sohbet</td><td>разговор</td></tr><tr><td>taksit</td><td>вноска</td></tr><tr><td>kredi kartı</td><td>кредитна карта</td></tr><tr><td>para üstü</td><td>ресто</td></tr><tr><td>kasa</td><td>каса</td></tr><tr><td>beden</td><td>размер (дреха)</td></tr><tr><td>denemek</td><td>пробвам</td></tr><tr><td>iade etmek</td><td>връщам (стока)</td></tr><tr><td>değiştirmek</td><td>сменям</td></tr><tr><td>müşteri</td><td>клиент</td></tr><tr><td>kampanya</td><td>промоция</td></tr></tbody></table><h3>Упражнения · Alıştırmalar</h3><p><strong>Упр. Ч4.1 — Отговори на въпросите.</strong> <em>(Soruları cevaplayın.)</em></p><ol type=\"1\"><li>Yazar dükkânda neyi beğenmiş?</li><li>Satıcı pazarlık sırasında ne ısmarlamış?</li><li>Fiyat ne kadar düşmüş?</li><li>Satıcı fişin yanında ne vermiş?</li><li>Satıcı halı hakkında ne anlatmış?</li><li>İade süresi ne kadarmış?</li></ol><p><strong>Упр. Ч4.2 — Как е на турски?</strong> <em>(Türkçesi nedir?)</em></p><ol type=\"1\"><li>отстъпка</li><li>в брой</li><li>касова бележка</li><li>килим</li><li>ресто</li><li>вноска</li><li>клиент</li><li>качество</li></ol><hr /><h2 id=\"четиво-5\">ЧЕТИВО 5 · Yeni daire — Новият апартамент</h2><p class=\"lvl\"><em>Ниво B1 · 224 думи · 30 нови</em></p><p>Geçen ay taşındık. Yeni dairemiz üçüncü katta; asansör var ama bazen bozuluyor. Kira eskisinden biraz yüksek, yine de aidat düşük olduğu için sonuçta aynı kapıya çıkıyor. Emlakçı depozito olarak iki kira istedi.</p><p>İlk hafta her şey sorun çıkardı. Mutfaktaki musluk damlıyordu, banyoda su kaçağı vardı, salonun prizlerinden biri çalışmıyordu. Kombi de çalışıyor gibi yapıyor, ama suyu bir türlü ısıtmıyordu.</p><p>Tesisatçıyı çağırdık. Geldiğinde lavabonun altına baktı ve „Bu boru yıllar önce değişmeliydi,“ dedi. Muslukla lavaboyu tamir etti, kaçağı durdurdu. Elektrikçi de prizi değiştirdi ve tavandaki lambayı yeniledi. Ev sahibiyle konuştuk; masrafların yarısını üstlendi, çünkü sözleşmede böyle yazıyordu.</p><p>Sonra biz de kendi payımıza düşeni yaptık. Duvarlara badana yaptırdık, perdeleri astık, eski mobilyaların bir kısmını attık. Kapıcı taşınırken bize çok yardım etti; asansör bozuk olduğu için eşyaları üçüncü kata elimizde taşıdık.</p><p>Şimdi her şey yolunda. Balkondan bahçe görünüyor, zeminde küçük bir çocuk parkı var ve komşular sessiz. Ev sahibi geçen gün uğradı, „Anahtar teslim gibi oldu,“ diye şaka yaptı. Sonunda kendimizi evimizde hissetmeye başladık.</p><p>Komşularla ilk tanışmamız merdivende oldu. Alt kattaki teyze elinde poğaça tabağıyla kapıya geldi ve „Hoş geldiniz,“ dedi. Üst kattaki aile ise iki küçük çocukluydu; bazen tavandan koşma sesleri geliyor, ama kimse buna kızmıyor.</p><p>Bir de kapıcının defteri var. Her ay aidatı oraya yazıyor, bozulan bir şey olduğunda önce ona haber veriyoruz. Geçen hafta asansör yine durdu; tamirci gelene kadar iki gün merdiven çıktık.</p><h3>Нови думи · Yeni kelimeler</h3><table><thead><tr><th>Türkçe</th><th>Български</th></tr></thead><tbody><tr><td>taşınmak</td><td>местя се</td></tr><tr><td>daire</td><td>апартамент</td></tr><tr><td>kat</td><td>етаж</td></tr><tr><td>asansör</td><td>асансьор</td></tr><tr><td>bozulmak</td><td>повреждам се</td></tr><tr><td>kira</td><td>наем</td></tr><tr><td>aidat</td><td>такса поддръжка</td></tr><tr><td>sorun çıkarmak</td><td>създавам проблем</td></tr><tr><td>musluk</td><td>кран</td></tr><tr><td>damlamak</td><td>капе</td></tr><tr><td>su kaçağı</td><td>теч на вода</td></tr><tr><td>priz</td><td>контакт</td></tr><tr><td>tesisatçı</td><td>водопроводчик</td></tr><tr><td>lavabo</td><td>мивка</td></tr><tr><td>elektrikçi</td><td>електротехник</td></tr><tr><td>ev sahibi</td><td>хазаин</td></tr><tr><td>masraf</td><td>разход</td></tr><tr><td>üstlenmek</td><td>поемам</td></tr><tr><td>balkon</td><td>балкон</td></tr><tr><td>komşu</td><td>съсед</td></tr><tr><td>kapıcı</td><td>портиер</td></tr><tr><td>kombi</td><td>газов котел</td></tr><tr><td>perde</td><td>завеса</td></tr><tr><td>mobilya</td><td>мебели</td></tr><tr><td>badana</td><td>боядисване (на стени)</td></tr><tr><td>anahtar teslim</td><td>до ключ</td></tr><tr><td>depozito</td><td>депозит</td></tr><tr><td>emlakçı</td><td>брокер</td></tr><tr><td>tavan</td><td>таван</td></tr><tr><td>zemin</td><td>под, партер</td></tr></tbody></table><h3>Упражнения · Alıştırmalar</h3><p><strong>Упр. Ч5.1 — Отговори на въпросите.</strong> <em>(Soruları cevaplayın.)</em></p><ol type=\"1\"><li>Yeni daire kaçıncı katta?</li><li>İlk hafta hangi sorunlar çıkmış?</li><li>Prizi kim değiştirmiş?</li><li>Masrafların ne kadarını ev sahibi ödemiş?</li><li>Emlakçı depozito olarak ne istemiş?</li><li>Kombide ne sorun varmış?</li></ol><p><strong>Упр. Ч5.2 — Как е на турски?</strong> <em>(Türkçesi nedir?)</em></p><ol type=\"1\"><li>наем</li><li>хазаин</li><li>водопроводчик</li><li>асансьор</li><li>депозит</li><li>брокер</li><li>съсед</li><li>разход</li></ol><hr /><h2 id=\"четиво-6\">ЧЕТИВО 6 · Annemin mutfağı — Кухнята на майка ми</h2><p class=\"lvl\"><em>Ниво A2–B1 · 247 думи · 30 нови</em></p><p>Annem yemek yapmayı çok sever. Her pazar sabahı erkenden mutfağa girer, önlüğünü takar, radyoyu açar ve hamur yoğurmaya başlar. Mutfak o saatlerde evin en sıcak yeridir; camlar buğulanır, her yer un olur.</p><p>En sevdiğim yemeği mantıdır. Hamuru ince açar, içine baharatlı kıyma koyar, küçük küçük keser. Suyu kaynayınca mantıları atar, birkaç dakika haşlar. Üzerine yoğurt ve kızgın tereyağı döker; tereyağını dökerken ses çıkmazsa yağ yeterince kızmamış demektir.</p><p>Bazen sebze yemekleri de pişirir: taze fasulye, biber dolması, karnıyarık. Soğanı ince doğrar, salçayla kavurur, sonra sebzeleri ekleyip karıştırır. „Tencerede ağır ateşte, yavaş yavaş pişirmek gerekir,“ der. „Aceleyle pişen yemek acele yenir, akılda kalmaz.“</p><p>Tatlıyı sona saklar. Bazen sütlaç yapar, bazen de komşudan gelen ekşi elmalarla bir kek. Tuzlu ile tatlıyı asla aynı tencerede pişirmez; ayrı tencere, ayrı kaşık.</p><p>Tarifleri hiç yazmaz; hepsi aklındadır. „Ölçü göz kararıdır,“ diyor. „Yemek elin ölçüsüne alışır.“ Ben yine de defterime yazmaya çalışıyorum: bir çay bardağı bu, iki kaşık şu. Ama her denediğimde tadı biraz farklı çıkıyor, annem de buna gülüyor.</p><p>Bayramlarda mutfak bambaşka olur. Bir gün önceden başlar: hamur tepsileri masaya sığmaz, komşulardan tencere ödünç alınır. Annem o gün kimseyi mutfağa sokmaz, ama herkesi çağırıp tattırır.</p><p>Çocukken ben de yardım etmek isterdim. Bana hep en kolay işi verirdi: soğanların kabuğunu soymak ya da salatayı karıştırmak. „Mutfak sabır ister,“ derdi. „Acele eden ya elini keser ya yemeği yakar.“</p><p>Şimdi kendi evimde pişiriyorum. Baharatları onun gibi koyuyorum, tencereyi onun gibi kısıyorum, ama tadı yine de eksik kalıyor. Belki de eksik olan tarif değil, o mutfağın sesi.</p><h3>Нови думи · Yeni kelimeler</h3><table><thead><tr><th>Türkçe</th><th>Български</th></tr></thead><tbody><tr><td>mutfak</td><td>кухня</td></tr><tr><td>önlük</td><td>престилка</td></tr><tr><td>hamur</td><td>тесто</td></tr><tr><td>yoğurmak</td><td>меся (тесто)</td></tr><tr><td>mantı</td><td>манти</td></tr><tr><td>açmak</td><td>разточвам; отварям</td></tr><tr><td>kıyma</td><td>кайма</td></tr><tr><td>kesmek</td><td>режа</td></tr><tr><td>kızgın</td><td>нагорещен; сърдит</td></tr><tr><td>tereyağı</td><td>масло</td></tr><tr><td>dökmek</td><td>изсипвам, наливам</td></tr><tr><td>sebze</td><td>зеленчук</td></tr><tr><td>taze fasulye</td><td>зелен фасул</td></tr><tr><td>dolma</td><td>пълнено ястие</td></tr><tr><td>karnıyarık</td><td>карнъяръ̀к</td></tr><tr><td>tencere</td><td>тенджера</td></tr><tr><td>ağır ateş</td><td>слаб огън</td></tr><tr><td>pişirmek</td><td>готвя, пека</td></tr><tr><td>tarif</td><td>рецепта</td></tr><tr><td>ölçü</td><td>мярка</td></tr><tr><td>göz kararı</td><td>на око</td></tr><tr><td>kavurmak</td><td>запържвам</td></tr><tr><td>haşlamak</td><td>варя</td></tr><tr><td>kızartmak</td><td>пържа</td></tr><tr><td>doğramak</td><td>нарязвам</td></tr><tr><td>karıştırmak</td><td>бъркам, смесвам</td></tr><tr><td>baharat</td><td>подправка</td></tr><tr><td>tuzlu</td><td>солен</td></tr><tr><td>tatlı</td><td>сладък; десерт</td></tr><tr><td>ekşi</td><td>кисел</td></tr></tbody></table><h3>Упражнения · Alıştırmalar</h3><p><strong>Упр. Ч6.1 — Отговори на въпросите.</strong> <em>(Soruları cevaplayın.)</em></p><ol type=\"1\"><li>Anne pazar sabahı ne yapar?</li><li>Yazarın en sevdiği yemek ne?</li><li>Mantının üzerine ne dökülür?</li><li>Anne tarifleri neden yazmaz?</li><li>Tereyağı kızmamışsa ne olur?</li><li>Anne tatlı olarak ne yapar?</li></ol><p><strong>Упр. Ч6.2 — Как е на турски?</strong> <em>(Türkçesi nedir?)</em></p><ol type=\"1\"><li>тесто</li><li>тенджера</li><li>подправка</li><li>зеленчук</li><li>варя</li><li>пържа</li><li>нарязвам</li><li>рецепта</li></ol><hr /><h2 id=\"четиво-7\">ЧЕТИВО 7 · Karadeniz'de yağmur — Дъжд по Черноморието</h2><p class=\"lvl\"><em>Ниво B1 · 267 думи · 30 нови</em></p><p>Karadeniz'e vardığımızda hava kapalıydı. Bulutlar dağların üstüne inmişti ve hafif bir çisenti vardı. Otobüsten inerken gözlük camlarım hemen buğulandı. Yerliler bu havaya alışkın; şemsiyesiz kimse dışarı çıkmıyor, ama kimse de yağmurdan şikâyet etmiyor.</p><p>Sabah köyün üstündeki yaylaya çıktık. Sis o kadar yoğundu ki on adım öteyi göremiyorduk. Çayırların arasından ince bir yol geçiyordu; toprak yumuşaktı, ayakkabılarımız çamura battı. Uzaktan bir ineğin çanı duyuluyordu.</p><p>Öğleden sonra sağanak başladı. Önce birkaç iri damla düştü, sonra gökyüzü bir anda karardı; şimşek çaktı, gök gürültüsü dağlarda yankılandı. Dereler taştı, yollar çamurlandı. Bir çay ocağına sığındık ve yağmurun dinmesini bekledik. İçerideki yaşlı adam, „Bu daha bir şey değil,“ dedi, „geçen yıl dolu yağdı, bütün fındıkları vurdu.“</p><p>Akşama doğru rüzgâr yön değiştirdi ve gökyüzü açıldı. Havanın nemi çayırların üzerinde durur gibiydi; her yer yemyeşildi ve güçlü bir toprak kokusu vardı. Bulutların arasından çıkan güneş, karşı yamaçta uzun gölgeler bıraktı.</p><p>Dönüş yolunda rehberimiz güldü: „Burada yılın üç yüz günü yağmur yağar. Yeşillik bedava değil.“ Sonra ekledi: „Kar yağınca yollar kapanır, o zaman köy iyice sessizleşir. Bize göre asıl güzelliği o zaman başlar.“</p><p>Ertesi sabah köyün kahvesinde oturduk. Duvarda eski bir fotoğraf vardı: 1970'lerde çekilmiş, sisin içinde kaybolmuş bir ev. Kahveci, o evin artık olmadığını, birkaç yıl önceki bir fırtınada çatısının uçtuğunu anlattı.</p><p>Öğleye doğru hava yeniden bozdu. Bu sefer yağmurdan çok rüzgâr vardı; ağaçlar eğiliyor, çay bahçesinin masaları devriliyordu. İçeri girip sobanın yanına oturduk.</p><p>Akşam otobüse binerken bir şey fark ettim: üç gün boyunca telefonuma neredeyse hiç bakmamıştım. Yağmur, insanı ya eve kapatıyor ya da sohbete zorluyor; ikisi de fena değil.</p><p>Köyden ayrılırken bize bir poşet fındık verdiler. „Yağmurun karşılığı bu,“ dedi kahveci gülerek.</p><h3>Нови думи · Yeni kelimeler</h3><table><thead><tr><th>Türkçe</th><th>Български</th></tr></thead><tbody><tr><td>kapalı hava</td><td>облачно време</td></tr><tr><td>bulut</td><td>облак</td></tr><tr><td>çisenti</td><td>ръмеж</td></tr><tr><td>yerli</td><td>местен жител</td></tr><tr><td>alışkın</td><td>свикнал</td></tr><tr><td>şemsiye</td><td>чадър</td></tr><tr><td>sağanak</td><td>порой</td></tr><tr><td>dere</td><td>река, поток</td></tr><tr><td>taşmak</td><td>прелива</td></tr><tr><td>çamur</td><td>кал</td></tr><tr><td>çay ocağı</td><td>чайна</td></tr><tr><td>sığınmak</td><td>подслонявам се</td></tr><tr><td>dinmek</td><td>спира (дъжд)</td></tr><tr><td>gökyüzü</td><td>небе</td></tr><tr><td>nem</td><td>влага</td></tr><tr><td>çayır</td><td>ливада</td></tr><tr><td>yemyeşil</td><td>съвсем зелен</td></tr><tr><td>toprak</td><td>почва, земя</td></tr><tr><td>koku</td><td>мирис</td></tr><tr><td>rehber</td><td>екскурзовод, пътеводител</td></tr><tr><td>yeşillik</td><td>зеленина</td></tr><tr><td>bedava</td><td>безплатен</td></tr><tr><td>fırtına</td><td>буря</td></tr><tr><td>şimşek</td><td>светкавица</td></tr><tr><td>gök gürültüsü</td><td>гръм</td></tr><tr><td>sis</td><td>мъгла</td></tr><tr><td>dolu</td><td>градушка; пълен</td></tr><tr><td>rüzgâr</td><td>вятър</td></tr><tr><td>kar yağmak</td><td>вали сняг</td></tr><tr><td>gölge</td><td>сянка</td></tr></tbody></table><h3>Упражнения · Alıştırmalar</h3><p><strong>Упр. Ч7.1 — Отговори на въпросите.</strong> <em>(Soruları cevaplayın.)</em></p><ol type=\"1\"><li>Karadeniz'de hava nasılmış?</li><li>Öğleden sonra ne olmuş?</li><li>Yağmurdan nereye sığınmışlar?</li><li>Rehber ne demiş?</li><li>Yaylada sis nasılmış?</li><li>Geçen yıl dolu neyi vurmuş?</li></ol><p><strong>Упр. Ч7.2 — Как е на турски?</strong> <em>(Türkçesi nedir?)</em></p><ol type=\"1\"><li>чадър</li><li>буря</li><li>мъгла</li><li>влага</li><li>светкавица</li><li>градушка</li><li>ливада</li><li>вятър</li></ol><hr /><h2 id=\"четиво-8\">ЧЕТИВО 8 · Telefonsuz bir gün — Ден без телефон</h2><p class=\"lvl\"><em>Ниво B1 · 302 думи · 30 нови</em></p><p>Geçen cumartesi telefonumu kapatmaya karar verdim. Bir hafta önce ekran süreme baktığımda otuz saati geçtiğini görmüş ve şaşırmıştım. Otuz saat — yani günde dört saatten fazla. Bunun ne kadarını gerçekten seçtiğimi, ne kadarının alışkanlık olduğunu bilmiyordum.</p><p>Sabah alarmsız uyandım. Haberlere bakmadım, sosyal medyayı açmadım, hiçbir uygulamayı indirmedim. Önce garip geldi; elim sürekli cebime gidiyordu. Bir şey merak ettiğimde bakacak yer yoktu, bu yüzden merakım kendiliğinden geçiyordu.</p><p>Öğleden sonra kitap okudum, yürüyüşe çıktım, bir arkadaşımı aradım — ama ev telefonundan. Konuşma tuhaf biçimde uzun sürdü, çünkü aramızda bir ekran yoktu. Bildirim gelmeyince dikkatimin dağılmadığını, bir sayfayı baştan sona okuyabildiğimi fark ettim.</p><p>Akşamüstü şarj aletini bile çekmecede unuttum. Aklıma şifremi değiştirmem gerektiği geldi, sonra hesabımı yedeklemediğimi hatırladım; ikisini de ertesi güne bıraktım. Paylaşacak bir fotoğraf çektim ama paylaşmadım. Kimseyi takip etmeyince kimsenin de beni takip etmediğini düşündüm ve rahatladım.</p><p>Gece telefonu tekrar açtım. Yirmi üç mesaj, kırk bildirim, birkaç yorum ve sayısız beğeni birikmişti. Aralarında bir sürü reklam da vardı. Hiçbiri acil değildi; hiçbirini kaçırmakla bir şey kaybetmemiştim.</p><p>Bu küçük deneyi ayda bir tekrarlamayı düşünüyorum. Uygulamaları silmek gerekmiyor, güncellemeleri durdurmak da değil. Sadece bir gün için gizliliğimi kendime geri veriyorum — bağlantıyı kesmek, bazen bağlanmanın tek yolu oluyor.</p><p>Öğle yemeğini de yalnız yedim, ama masaya telefon koymadan. Karşımdaki adam yemeğini fotoğraflayıp geri koydu, sonra yirmi dakika ekranına baktı ve tabağına neredeyse hiç dokunmadı. Bir yıl önce ben de öyleydim.</p><p>En zoru akşamüstü oldu. Canım sıkıldı ve sıkılmak tuhaf bir duyguydu; yıllardır sıkılmaya fırsat bulmamıştım. Camdan dışarı baktım, sokakta yürüyen insanları saydım, sonra çekmeceyi topladım. Sıkıntı yarım saat sürdü ve sonra geçti.</p><p>Bir arkadaşım deneyi duyunca güldü: „Bunu anlatmak için yine telefona ihtiyacın olacak.“ Haklıydı. Ama fark şu: bu kez ben ne zaman açacağıma karar verdim, telefon bana karar vermedi.</p><p>Bir de şunu fark ettim: gün uzun geldi. Aynı yirmi dört saatti, ama içine daha çok şey sığdı.</p><h3>Нови думи · Yeni kelimeler</h3><table><thead><tr><th>Türkçe</th><th>Български</th></tr></thead><tbody><tr><td>ekran süresi</td><td>екранно време</td></tr><tr><td>geçmek</td><td>надхвърлям; минавам</td></tr><tr><td>şaşırmak</td><td>учудвам се</td></tr><tr><td>alarm</td><td>аларма, будилник</td></tr><tr><td>haber</td><td>новина</td></tr><tr><td>sosyal medya</td><td>социални мрежи</td></tr><tr><td>garip</td><td>странен</td></tr><tr><td>cep</td><td>джоб</td></tr><tr><td>yürüyüş</td><td>разходка пеша</td></tr><tr><td>bildirim</td><td>известие, нотификация</td></tr><tr><td>dikkat</td><td>внимание</td></tr><tr><td>dağılmak</td><td>разсейвам се, разпръсквам се</td></tr><tr><td>fark etmek</td><td>забелязвам</td></tr><tr><td>mesaj</td><td>съобщение</td></tr><tr><td>deney</td><td>опит, експеримент</td></tr><tr><td>tekrarlamak</td><td>повтарям</td></tr><tr><td>uygulama</td><td>приложение</td></tr><tr><td>şarj</td><td>заряд, зареждане</td></tr><tr><td>şifre</td><td>парола</td></tr><tr><td>hesap</td><td>профил; сметка</td></tr><tr><td>bağlantı</td><td>връзка</td></tr><tr><td>indirmek</td><td>свалям, изтеглям</td></tr><tr><td>paylaşmak</td><td>споделям</td></tr><tr><td>takip etmek</td><td>следя, следвам</td></tr><tr><td>yorum</td><td>коментар</td></tr><tr><td>beğeni</td><td>харесване</td></tr><tr><td>reklam</td><td>реклама</td></tr><tr><td>gizlilik</td><td>поверителност</td></tr><tr><td>yedeklemek</td><td>архивирам</td></tr><tr><td>güncellemek</td><td>обновявам</td></tr></tbody></table><h3>Упражнения · Alıştırmalar</h3><p><strong>Упр. Ч8.1 — Отговори на въпросите.</strong> <em>(Soruları cevaplayın.)</em></p><ol type=\"1\"><li>Yazar ne karar vermiş?</li><li>Haftada kaç saat ekran süresi varmış?</li><li>Arkadaşını neyle aramış?</li><li>Akşam kaç mesaj varmış?</li><li>Günde kaç saat ekran süresi çıkıyormuş?</li><li>Telefonsuz konuşma neden uzun sürmüş?</li></ol><p><strong>Упр. Ч8.2 — Как е на турски?</strong> <em>(Türkçesi nedir?)</em></p><ol type=\"1\"><li>известие</li><li>парола</li><li>приложение</li><li>съобщение</li><li>споделям</li><li>коментар</li><li>реклама</li><li>обновявам</li></ol><hr /><h1 id=\"речник-sözlük-19\">РЕЧНИК · Sözlük</h1>\n<p>Речникът има две части: <strong>по уроци</strong> (за преговор след\nвсеки урок) и <strong>азбучен</strong> (за справка). Докосни турската\nдума, за да я чуеш.</p>\n<hr />\n<h2 id=\"речник-по-уроци-ünitelere-göre-sözlük\">Речник по уроци ·\nÜnitelere göre sözlük</h2>\n<h3 id=\"урок-1\">УРОК 1</h3>\n<table>\n<thead>\n<tr class=\"header\">\n<th>Türkçe</th>\n<th>Български</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>merhaba</td>\n<td>здравей / здравейте</td>\n</tr>\n<tr class=\"even\">\n<td>günaydın</td>\n<td>добро утро</td>\n</tr>\n<tr class=\"odd\">\n<td>iyi günler</td>\n<td>добър ден</td>\n</tr>\n<tr class=\"even\">\n<td>iyi akşamlar</td>\n<td>добър вечер</td>\n</tr>\n<tr class=\"odd\">\n<td>iyi geceler</td>\n<td>лека нощ</td>\n</tr>\n<tr class=\"even\">\n<td>hoşça kal / hoşça kalın</td>\n<td>остани/останете си със здраве</td>\n</tr>\n<tr class=\"odd\">\n<td>güle güle</td>\n<td -linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 18l-2-8 8 4M36 18l2-8-8 4\"/><path d=\"M24 14c8 0 12 6 12 12s-5 12-12 12-12-5-12-12 4-12 12-12z\"/><circle cx=\"19\" cy=\"25\" r=\"1.6\" fill=\"var(--text)\" stroke=\"none\"/><circle cx=\"29\" cy=\"25\" r=\"1.6\" fill=\"var(--text)\" stroke=\"none\"/><path d=\"M24 29v2M20 33h8M8 28h8M32 28h8\"/></svg></span><figcaption><b>kedi</b><span>котка</span></figcaption></figure>\n</div><h1 id=\"ключ-с-отговорите\">КЛЮЧ С ОТГОВОРИТЕ</h1>\n<h2 id=\"урок-1-1\">Урок 1</h2>\n<p><strong>1.1</strong></p>\n<ol type=\"1\">\n<li>öğretmenim</li>\n<li>doktorsun</li>\n<li>Bulgarız</li>\n<li>avukatsınız</li>\n<li>aşçıyım</li>\n<li>mühendissin</li>\n</ol>\n<p><strong>1.2</strong></p>\n<ol type=\"1\">\n<li>Ben öğrenci değilim.</li>\n<li>Sen Türk değilsin.</li>\n<li>O doktor değil.</li>\n<li>Biz mühendis değiliz.</li>\n<li>Siz öğretmen değilsiniz.</li>\n</ol>\n<p><strong>1.3</strong></p>\n<ol type=\"1\">\n<li>Sen öğrenci misin?</li>\n<li>O avukat mı?</li>\n<li>Siz Bulgar mısınız?</li>\n<li>Onlar Türk mü?</li>\n</ol>\n<p><strong>1.4</strong></p>\n<ol type=\"1\">\n<li>Merhaba, ben İvan’ım.</li>\n<li>Sen öğretmen misin?</li>\n<li>Hayır, ben öğretmen değilim, ben mühendisim.</li>\n<li>Memnun oldum.</li>\n<li>Teşekkür ederim, iyiyim.</li>\n</ol>\n<p><strong>1.5</strong> 1-в · 2-а · 3-б · 4-д · 5-г</p>\n<p><strong>1.6</strong></p>\n<ol type=\"1\">\n<li>Ben öğrenciyim.</li>\n<li>Sen doktorsun.</li>\n<li>O Türk.</li>\n<li>Biz mühendisiz.</li>\n<li>Siz avukatsınız.</li>\n</ol>\n<p><strong>1.7</strong> kimsin (или: sen kimsin) · oldum · müsün ·\ndeğilim · ım · yapıyorsun · im</p>\n<p><strong>1.8</strong> Примерни отговори: Benim adım … · Bulgarım,\nSofyalıyım. · Mühendisim. · İyiyim, teşekkür ederim.</p>\n<p><strong>1.9</strong></p>\n<ol type=\"1\">\n<li>Ne</li>\n<li>Nereden</li>\n<li>Kaç</li>\n<li>Kim</li>\n<li>Nereye</li>\n<li>Nasıl</li>\n<li>Ne zaman</li>\n<li>Neden</li>\n</ol>\n<p><strong>1.10</strong></p>\n<ol type=\"1\">\n<li>mühendisim</li>\n<li>aşçısın</li>\n<li>avukat</li>\n<li>doktoruz</li>\n<li>şoförsünüz</li>\n<li>öğrenciler</li>\n<li>Bulgarım</li>\n<li>Türksün</li>\n<li>öğretmeniz</li>\n<li>mühendissiniz</li>\n</ol>\n<p><strong>1.11</strong></p>\n<ol type=\"1\">\n<li>Evet, doktorum. / Hayır, doktor değilim.</li>\n<li>Evet, Türk. / Hayır, Türk değil.</li>\n<li>Evet, mühendisiz. / Hayır, mühendis değiliz.</li>\n<li>Evet, öğretmenler. / Hayır, öğretmen değiller.</li>\n<li>Evet, Bulgarım. / Hayır, Bulgar değilim.</li>\n<li>Evet, avukat. / Hayır, avukat değil.</li>\n</ol>\n<p><strong>1.12</strong></p>\n<ol type=\"1\">\n<li>Kaç yaşındasın?</li>\n<li>Otuz yaşındayım.</li>\n<li>Nerelisiniz?</li>\n<li>O doktor değil, mühendis.</li>\n<li>Siz öğretmen misiniz?</li>\n<li>Neden gelmiyorsun?</li>\n<li>Ne zaman geliyorsun?</li>\n<li>Adın ne?</li>\n</ol>\n<p><strong>1.13</strong></p><ol type=\"1\"><li>hoş geldiniz</li><li>hoş bulduk</li><li>görüşmek üzere</li><li>kendine iyi bak</li><li>kolay gelsin</li><li>geçmiş olsun</li><li>affedersiniz</li><li>ne var ne yok?</li><li>maalesef</li><li>memnuniyetle</li></ol><p><strong>1.14</strong></p><ol type=\"1\"><li>İyi günler</li><li>İyi geceler</li><li>Rica ederim</li><li>Güle güle</li><li>Tebrikler</li><li>Çok yaşa</li><li>İyi şanslar</li><li>Peki</li></ol><h2 id=\"урок-2-1\">Урок 2</h2>\n<p><strong>Въпроси към текста:</strong></p>\n<ol type=\"1\">\n<li>Odada iki sandalye var. ·</li>\n<li>Masada bir bilgisayar, kitaplar ve defterler var. ·</li>\n<li>Hayır, odada televizyon yok. ·</li>\n<li>Kalemler çantada.</li>\n</ol>\n<p><strong>2.1</strong> evler · kitaplar · öğretmenler · arabalar ·\ngözler · okullar · şehirler · çocuklar</p>\n<p><strong>2.2</strong> okulda · evde · sınıfta · masada · çantada ·\nİzmir’de · sokakta · şehirde</p>\n<p><strong>2.3</strong></p>\n<ol type=\"1\">\n<li>var</li>\n<li>yok</li>\n<li>var</li>\n<li>yok</li>\n</ol>\n<p><strong>2.4</strong></p>\n<ol type=\"1\">\n<li>Bu bir kitap.</li>\n<li>Şu ne?</li>\n<li>Odada iki masa var.</li>\n<li>Çantada kalem yok.</li>\n<li>Bu evler eski.</li>\n</ol>\n<p><strong>2.5</strong> parkta · bahçede · dolapta · sokakta · otobüste\n· hastanede · mutfakta · denizde</p>\n<p><strong>2.6</strong></p>\n<ol type=\"1\">\n<li>Evet, var.</li>\n<li>Hayır, yok.</li>\n<li>Evet, var.</li>\n<li>Hayır, yok.</li>\n</ol>\n<p><strong>2.7</strong></p>\n<ol type=\"1\">\n<li>büyük ev</li>\n<li>yeni kitap</li>\n<li>güzel şehir</li>\n<li>eski araba</li>\n</ol>\n<p><strong>2.8</strong> Примерен отговор: Odam küçük ama güzel. Odamda\nbir masa ve iki sandalye var. Masada kitaplar var. Odada televizyon yok.\nPencere büyük.</p>\n<p><strong>2.9</strong></p>\n<ol type=\"1\">\n<li>okullar → okullarda</li>\n<li>kitaplar → kitaplarda</li>\n<li>sokaklar → sokaklarda</li>\n<li>bahçeler → bahçelerde</li>\n<li>şehirler → şehirlerde</li>\n<li>arabalar → arabalarda</li>\n<li>sınıflar → sınıflarda</li>\n<li>öğrenciler → öğrencilerde</li>\n</ol>\n<p><strong>2.10</strong></p>\n<ol type=\"1\">\n<li>б</li>\n<li>г</li>\n<li>в</li>\n<li>д</li>\n<li>е</li>\n<li>ж</li>\n<li>з</li>\n<li>а</li>\n</ol>\n<p><strong>2.11</strong></p>\n<ol type=\"1\">\n<li>Odada televizyon yok.</li>\n<li>Bahçede ağaç var.</li>\n<li>Çantada bir kalem var.</li>\n<li>Sınıfta öğrenci yok.</li>\n<li>Evde bahçe var.</li>\n<li>Sokakta araba yok.</li>\n</ol>\n<p><strong>2.12</strong></p>\n<ol type=\"1\">\n<li>Benim bir arabam var.</li>\n<li>Senin kardeşin var mı?</li>\n<li>Onun parası yok.</li>\n<li>Bizim büyük bir evimiz var.</li>\n<li>Sizin zamanınız var mı?</li>\n<li>Onların çocukları yok.</li>\n</ol>\n<p><strong>2.13</strong></p>\n<ol type=\"1\">\n<li>eski bir ev</li>\n<li>iki yeni kitap</li>\n<li>güzel bir kız</li>\n<li>bu pahalı araba</li>\n<li>büyük bir şehir</li>\n<li>sıcak bir çay</li>\n</ol>\n<p><strong>2.14</strong></p><ol type=\"1\"><li>uyruk</li><li>ana dil</li><li>bekâr</li><li>dul</li><li>yabancı</li><li>yetişkin</li><li>orta yaşlı</li><li>doğum yeri</li><li>ne iş yapıyorsun?</li><li>e-posta adresi</li></ol><p><strong>2.16</strong></p><ol type=\"1\"><li>işçi</li><li>memur</li><li>çiftçi</li><li>ressam</li><li>müzisyen</li><li>patron</li></ol><p><strong>2.15</strong></p><ol type=\"1\"><li>ben</li><li>bizim</li><li>bana</li><li>bunlar</li><li>neden?</li><li>ne zaman?</li><li>hangisi?</li><li>kime?</li></ol><h2 id=\"урок-3-1\">Урок 3</h2>\n<p><strong>Въпроси към текста:</strong></p>\n<ol type=\"1\">\n<li>Hayır, büyük değil. ·</li>\n<li>Annesinin adı Fatma. ·</li>\n<li>İstanbul’da çalışıyor. ·</li>\n<li>Evet, bir kedileri var, adı Pamuk.</li>\n</ol>\n<p><strong>3.1</strong> evim · kitabım · arabam · annem · okulum · gözüm\n· arkadaşım · sokağım</p>\n<p><strong>3.2</strong></p>\n<ol type=\"1\">\n<li>evin</li>\n<li>arabası</li>\n<li>okulumuz</li>\n<li>kitabınız</li>\n<li>evleri</li>\n<li>annem</li>\n</ol>\n<p><strong>3.3</strong></p>\n<ol type=\"1\">\n<li>Ali’nin evi</li>\n<li>öğretmenin kitabı</li>\n<li>Türk kahvesi</li>\n<li>ders kitabı</li>\n<li>odanın kapısı</li>\n<li>okul bahçesi</li>\n</ol>\n<p><strong>3.4</strong></p>\n<ol type=\"1\">\n<li>Annem öğretmen.</li>\n<li>Bu kitap kimin?</li>\n<li>Bu Ahmet’in arabası.</li>\n<li>Bizim evimiz Sofya’da.</li>\n<li>Bir kardeşim var.</li>\n</ol>\n<p><strong>3.5</strong> evi · arabası · kitabı · annesi · okulu ·\narkadaşı</p>\n<p><strong>3.6</strong></p>\n<ol type=\"1\">\n<li>odanın kapısı</li>\n<li>ders kitabı</li>\n<li>Türk kahvesi</li>\n<li>babamın arabası</li>\n<li>öğretmenin adı</li>\n</ol>\n<p><strong>3.7</strong></p>\n<ol type=\"1\">\n<li>Benim kitabım.</li>\n<li>Ahmet’in arabası.</li>\n<li>Bizim defterlerimiz.</li>\n<li>Onların evi.</li>\n</ol>\n<p><strong>3.8</strong> Примерен отговор: Ailem büyük değil. Annem\nöğretmen, babam mühendis. Bir kardeşim var, o öğrenci. Bizim evimiz\nSofya’da. Bir de kedimiz var.</p>\n<p><strong>3.9</strong></p>\n<ol type=\"1\">\n<li>kitabım, kitabın, kitabı, kitabımız, kitabınız, kitapları</li>\n<li>arabam, araban, arabası, arabamız, arabanız, arabaları</li>\n<li>okulum, okulun, okulu, okulumuz, okulunuz, okulları</li>\n<li>annem, annen, annesi, annemiz, anneniz, anneleri</li>\n<li>arkadaşım, arkadaşın, arkadaşı, arkadaşımız, arkadaşınız,\narkadaşları</li>\n<li>gözüm, gözün, gözü, gözümüz, gözünüz, gözleri</li>\n</ol>\n<p><strong>3.10</strong></p>\n<ol type=\"1\">\n<li>evin kapısı</li>\n<li>ev kapısı</li>\n<li>çocuk odası</li>\n<li>çocuğun odası</li>\n<li>Türk kahvesi</li>\n<li>Ahmet’in kahvesi</li>\n<li>ders kitabı</li>\n<li>öğretmenin kitabı</li>\n</ol>\n<p><strong>3.11</strong></p>\n<ol type=\"1\">\n<li>evin kapısının anahtarı</li>\n<li>Türkiye’nin başkenti</li>\n<li>okulun bahçesinin kapısı</li>\n<li>öğretmenin odasının penceresi</li>\n</ol>\n<p><strong>3.12</strong></p>\n<ol type=\"1\">\n<li>Benim iki ablam var.</li>\n<li>Benim zamanım yok.</li>\n<li>Senin araban var mı?</li>\n<li>Onun büyük bir evi var.</li>\n<li>Bizim paramız yok.</li>\n<li>Sizin çocuğunuz var mı?</li>\n<li>Onların kedisi var.</li>\n<li>Benim kardeşim yok.</li>\n</ol>\n<p><strong>3.13</strong></p>\n<ol type=\"1\">\n<li>Ali’nin</li>\n<li>Odanın</li>\n<li>annem</li>\n<li>Türkiye’nin</li>\n<li>kardeşi</li>\n<li>evimiz</li>\n</ol>\n<p><strong>3.14</strong></p><ol type=\"1\"><li>amca</li><li>dayı</li><li>teyze</li><li>yeğen</li><li>kuzen</li><li>kaynana</li><li>gelin</li><li>damat</li><li>aile ağacı</li><li>misafirperver</li></ol><p><strong>3.15</strong></p><ol type=\"1\"><li>ebeveyn</li><li>kız kardeş</li><li>ağabey</li><li>anneanne</li><li>koca</li><li>oğul</li></ol><h2 id=\"урок-4-1\">Урок 4</h2>\n<p><strong>Въпроси към текста:</strong></p>\n<ol type=\"1\">\n<li>Saat yedide evden çıkıyor. ·</li>\n<li>Otobüs durağına yürüyor. ·</li>\n<li>Ekmek ve süt alıyor. ·</li>\n<li>Annesiyle çay içiyorlar ve konuşuyorlar.</li>\n</ol>\n<p><strong>4.1</strong> okula · eve · İstanbul’a · sinemaya · arabaya ·\nişe</p>\n<p><strong>4.2</strong> evden · okuldan · marketten · Sofya’dan ·\nsınıftan · şehirden</p>\n<p><strong>4.3</strong> kitabı · arabayı · evi · Ali’yi · suyu ·\nöğretmeni</p>\n<p><strong>4.4</strong></p>\n<ol type=\"1\">\n<li>okula</li>\n<li>evden</li>\n<li>sınıfta</li>\n<li>Kitabı</li>\n<li>Anneme</li>\n</ol>\n<p><strong>4.5</strong></p>\n<ol type=\"1\">\n<li>İstanbul’a gidiyorum.</li>\n<li>Okuldan geliyorum.</li>\n<li>Ali’yi görüyorum.</li>\n<li>O evde.</li>\n<li>Marketten ekmek alıyorum.</li>\n</ol>\n<p><strong>4.6</strong></p>\n<ol type=\"1\">\n<li>okula</li>\n<li>işten</li>\n<li>Kitabı</li>\n<li>Ali’ye</li>\n<li>İstanbul’u</li>\n<li>Marketten</li>\n</ol>\n<p><strong>4.7</strong></p>\n<ol type=\"1\">\n<li>Okula gidiyorum.</li>\n<li>Evden geliyorum.</li>\n<li>Sofya’da oturuyorum.</li>\n<li>Ayşe’yi bekliyorum.</li>\n</ol>\n<p><strong>4.8</strong></p>\n<ol type=\"1\">\n<li>Nerede ·</li>\n<li>Nereye ·</li>\n<li>Nereden ·</li>\n<li>Nerede</li>\n</ol>\n<p><strong>4.9</strong></p>\n<ol type=\"1\">\n<li>Ben eve gidiyorum.</li>\n<li>O okuldan geliyor.</li>\n<li>Biz sinemaya gidiyoruz.</li>\n<li>Sen marketten ekmek alıyorsun.</li>\n</ol>\n<p><strong>4.10</strong></p>\n<ol type=\"1\">\n<li>filmi</li>\n<li>gazete</li>\n<li>Ali’yi</li>\n<li>Su</li>\n<li>kitabı</li>\n<li>Ekmek</li>\n<li>Arabasını</li>\n<li>Kahve</li>\n</ol>\n<p><strong>4.11</strong></p>\n<ol type=\"1\">\n<li>Otobüse</li>\n<li>Otobüsten</li>\n<li>Köpekten</li>\n<li>Derse</li>\n<li>Sana</li>\n<li>Öğretmene</li>\n<li>Seni</li>\n<li>Evden</li>\n</ol>\n<p><strong>4.12</strong></p>\n<ol type=\"1\">\n<li>evi, eve, evde, evden</li>\n<li>arabayı, arabaya, arabada, arabadan</li>\n<li>kitabı, kitaba, kitapta, kitaptan</li>\n<li>şehri, şehre, şehirde, şehirden</li>\n<li>sokağı, sokağa, sokakta, sokaktan</li>\n<li>anneyi, anneye, annede, anneden</li>\n</ol>\n<p><strong>4.13</strong></p>\n<ol type=\"1\">\n<li>O okuldan eve kitap getiriyor.</li>\n<li>Annem marketten bana çikolata aldı.</li>\n<li>Öğretmen öğrenciye soru sordu.</li>\n<li>Biz İstanbul’dan Ankara’ya trenle gidiyoruz.</li>\n</ol>\n<p><strong>4.14</strong></p>\n<ol type=\"1\">\n<li>Otobüsü bekliyorum.</li>\n<li>Seni seviyorum.</li>\n<li>Köpekten korkuyorum.</li>\n<li>Otobüse bindim.</li>\n<li>Otobüsten indim.</li>\n<li>Ona yardım ettim.</li>\n<li>Öğretmene sordum.</li>\n<li>Pencereden bakıyorum.</li>\n</ol>\n<p><strong>4.16</strong></p><ol type=\"1\"><li>bina</li><li>düz</li><li>taksi</li><li>havalimanı</li><li>postane</li><li>müze</li><li>istasyon</li><li>köşe</li></ol><p><strong>4.15</strong></p><ol type=\"1\"><li>salon</li><li>banyo</li><li>buzdolabı</li><li>çamaşır makinesi</li><li>fırın</li><li>klima</li><li>çatı</li><li>merdiven</li></ol><h2 id=\"урок-5-1\">Урок 5</h2>\n<p><strong>Въпроси към текста:</strong></p>\n<ol type=\"1\">\n<li>Evde kitap okuyor. ·</li>\n<li>Deniz kafede. ·</li>\n<li>Çünkü çok çalışıyor, yarın sınavı var. ·</li>\n<li>Sinemaya gidiyorlar.</li>\n</ol>\n<p><strong>5.1</strong> geliyorum · okuyorum · çalışıyorum · bekliyorum\n· görüyorum · uyuyorum</p>\n<p><strong>5.2</strong></p>\n<ol type=\"1\">\n<li>yapıyorsun</li>\n<li>dinliyor</li>\n<li>öğreniyoruz</li>\n<li>gidiyorlar</li>\n<li>içiyorsunuz</li>\n</ol>\n<p><strong>5.3</strong> gelmiyorum · çalışmıyorsun · okumuyor ·\ngörmüyoruz · beklemiyorsunuz</p>\n<p><strong>5.4</strong></p>\n<ol type=\"1\">\n<li>Sen çalışıyor musun?</li>\n<li>O geliyor mu?</li>\n<li>Siz Türkçe konuşuyor musunuz?</li>\n</ol>\n<p><strong>5.5</strong></p>\n<ol type=\"1\">\n<li>Ne yapıyorsun?</li>\n<li>Kitap okuyorum.</li>\n<li>Bugün çalışmıyorum.</li>\n<li>Yarın geliyor musun?</li>\n<li>Okulda Türkçe öğreniyoruz.</li>\n</ol>\n<p><strong>5.6</strong> bekliyorum · okuyorsun · yiyor · diyoruz ·\nbaşlıyorsunuz · uyuyorlar</p>\n<p><strong>5.7</strong></p>\n<ol type=\"1\">\n<li>Hayır, çalışmıyorum.</li>\n<li>Hayır, gelmiyor.</li>\n<li>Hayır, konuşmuyorlar.</li>\n<li>Hayır, içmiyoruz.</li>\n</ol>\n<p><strong>5.8</strong></p>\n<ol type=\"1\">\n<li>Ben okulda Türkçe öğreniyorum.</li>\n<li>O her gün kahve içiyor.</li>\n<li>Biz akşam sinemaya gidiyoruz.</li>\n<li>Sen şimdi ne yapıyorsun?</li>\n</ol>\n<p><strong>5.9</strong> Примерен отговор: Şu anda evdeyim. Kitap\nokuyorum. Çay içiyorum. Müzik dinliyorum.</p>\n<p><strong>5.10</strong></p>\n<ol type=\"1\">\n<li>bekliyorum</li>\n<li>okuyorum</li>\n<li>başlıyorum</li>\n<li>söylüyorum</li>\n<li>anlıyorum</li>\n<li>yürüyorum</li>\n<li>yiyorum</li>\n<li>diyorum</li>\n</ol>\n<p><strong>5.11</strong></p>\n<ol type=\"1\">\n<li>çalışıyorum</li>\n<li>çalışıyorsun</li>\n<li>çalışıyor</li>\n<li>çalışıyoruz</li>\n<li>çalışıyorsunuz</li>\n<li>çalışıyorlar</li>\n</ol>\n<p><strong>5.12</strong></p>\n<ol type=\"1\">\n<li>Çalışmıyor musun?</li>\n<li>O anlamıyor mu?</li>\n<li>Siz gelmiyor musunuz?</li>\n<li>Onlar bilmiyorlar mı?</li>\n<li>Biz gitmiyor muyuz?</li>\n<li>Sen yemiyor musun?</li>\n</ol>\n<p><strong>5.13</strong></p>\n<ol type=\"1\">\n<li>Ben her sabah kahve içiyorum.</li>\n<li>O şimdi çalışıyor.</li>\n<li>Biz bazen sinemaya gidiyoruz.</li>\n<li>Sen sürekli geç kalıyorsun.</li>\n<li>Onlar çok iyi Türkçe konuşuyorlar.</li>\n</ol>\n<p><strong>5.14</strong></p>\n<ol type=\"1\">\n<li>а</li>\n<li>б</li>\n<li>в</li>\n<li>г</li>\n</ol>\n<p><strong>5.15</strong></p>\n<ol type=\"1\">\n<li>Şu anda ne yapıyorsun?</li>\n<li>Anlamıyorum.</li>\n<li>Bugün çalışmıyor musun?</li>\n<li>Sofya’da oturuyorum.</li>\n<li>Yarın geliyorum.</li>\n<li>Sürekli geç kalıyorsun!</li>\n<li>Bu yıl Türkçe öğreniyoruz.</li>\n<li>Bazen sinemaya gidiyoruz.</li>\n</ol>\n<p><strong>5.16</strong></p><ol type=\"1\"><li>uyanmak</li><li>koşmak</li><li>satın almak</li><li>satmak</li><li>binmek</li><li>inmek</li><li>unutmak</li><li>yardım etmek</li></ol><h2 id=\"урок-6-1\">Урок 6</h2>\n<p><strong>Въпроси към текста:</strong></p>\n<ol type=\"1\">\n<li>Saat altı buçukta kalkıyor. ·</li>\n<li>Peynir, zeytin ve ekmek yiyor. ·</li>\n<li>Otobüsle gidiyor. ·</li>\n<li>Saat yedide eve dönüyor.</li>\n</ol>\n<p><strong>6.1</strong></p>\n<ol type=\"1\">\n<li>yedi</li>\n<li>on beş</li>\n<li>kırk iki</li>\n<li>yüz</li>\n<li>üç yüz altmış beş</li>\n<li>bin dokuz yüz doksan sekiz</li>\n</ol>\n<p><strong>6.2</strong></p>\n<ol type=\"1\">\n<li>Saat üç.</li>\n<li>Saat altı buçuk.</li>\n<li>Saat dokuzu çeyrek geçiyor.</li>\n<li>Saat on bire çeyrek var.</li>\n<li>Saat ikiyi yirmi geçiyor.</li>\n</ol>\n<p><strong>6.3</strong></p>\n<ol type=\"1\">\n<li>yedide</li>\n<li>sekize</li>\n<li>dördü</li>\n<li>bir buçukta</li>\n</ol>\n<p><strong>6.4</strong></p>\n<ol type=\"1\">\n<li>Saat kaç?</li>\n<li>Saat altı buçuk.</li>\n<li>Saat yedide kalkıyorum.</li>\n<li>Bugün pazartesi.</li>\n<li>Sınav beş Mart’ta.</li>\n</ol>\n<p><strong>6.5</strong></p>\n<ol type=\"1\">\n<li>Saat sekiz.</li>\n<li>Saat on bir buçuk.</li>\n<li>Saat biri çeyrek geçiyor.</li>\n<li>Saat altıya çeyrek var.</li>\n<li>Saat yediyi yirmi beş geçiyor.</li>\n<li>Saat on iki.</li>\n</ol>\n<p><strong>6.6</strong></p>\n<ol type=\"1\">\n<li>otuz beş ·</li>\n<li>yirmi sekiz ·</li>\n<li>yirmi beş ·</li>\n<li>kırk iki</li>\n</ol>\n<p><strong>6.7</strong></p>\n<ol type=\"1\">\n<li>Salı ·</li>\n<li>Perşembe ·</li>\n<li>Pazar ·</li>\n<li>Cuma</li>\n</ol>\n<p><strong>6.8</strong> Примерни отговори: Saat yedide kalkıyorum. ·\nSaat sekizde gidiyorum. · Saat on birde yatıyorum. · Bugün\npazartesi.</p>\n<p><strong>6.9</strong></p>\n<ol type=\"1\">\n<li>yirmi bir</li>\n<li>kırk yedi</li>\n<li>doksan dokuz</li>\n<li>yüz beş</li>\n<li>üç yüz seksen</li>\n<li>bin iki yüz elli</li>\n<li>on iki bin</li>\n<li>iki milyon</li>\n</ol>\n<p><strong>6.10</strong></p>\n<ol type=\"1\">\n<li>otuz beş</li>\n<li>otuz beş</li>\n<li>yetmiş iki</li>\n<li>yirmi</li>\n<li>yetmiş iki</li>\n<li>altmış bir</li>\n</ol>\n<p><strong>6.11</strong></p>\n<ol type=\"1\">\n<li>Saat iki.</li>\n<li>Saat dördü on geçiyor.</li>\n<li>Saat altıyı çeyrek geçiyor.</li>\n<li>Saat sekiz buçuk.</li>\n<li>Saat ona çeyrek var.</li>\n<li>Saat on ikiye on var.</li>\n<li>Saat biri yirmi beş geçiyor.</li>\n<li>Saat bire yirmi beş var.</li>\n</ol>\n<p><strong>6.12</strong></p>\n<ol type=\"1\">\n<li>dokuzda</li>\n<li>bir buçukta</li>\n<li>yedide</li>\n<li>on ikide</li>\n<li>sekizde</li>\n<li>üçte</li>\n</ol>\n<p><strong>6.13</strong></p>\n<ol type=\"1\">\n<li>beş Mart</li>\n<li>on iki Ağustos iki bin yirmi altı</li>\n<li>Sınav on Mayıs’ta.</li>\n<li>Bin dokuz yüz doksanda doğdum.</li>\n<li>Doğum günüm Ocak’ta.</li>\n</ol>\n<p><strong>6.14</strong></p>\n<ol type=\"1\">\n<li>Bugün … (напр. pazartesi).</li>\n<li>Saat … .</li>\n<li>Saat yedide kalkıyorum.</li>\n<li>Doğum günüm …’ta.</li>\n<li>Bir yılda on iki ay var.</li>\n<li>Bir haftada yedi gün var.</li>\n</ol>\n<p><strong>6.15</strong></p><ol type=\"1\"><li>hafta sonu</li><li>öbür gün</li><li>mevsim</li><li>ilkbahar</li><li>hava durumu</li><li>bulutlu</li><li>kar yağmak</li><li>derece</li><li>gün doğumu</li><li>gece yarısı</li></ol><p><strong>6.17</strong></p><ol type=\"1\"><li>Pazartesi</li><li>Perşembe</li><li>Ocak</li><li>Eylül</li><li>yüzyıl</li><li>hiçbir zaman</li><li>ertesi gün</li><li>ilkbahar</li></ol><p><strong>6.16</strong></p><ol type=\"1\"><li>sıfır</li><li>yedi</li><li>kırk</li><li>yüz</li><li>bin</li><li>üçüncü</li><li>buçuk</li><li>tane</li></ol><h2 id=\"урок-7-1\">Урок 7</h2>\n<p><strong>Въпроси към текста:</strong></p>\n<ol type=\"1\">\n<li>Genellikle saat onda kalkar. ·</li>\n<li>Parkta koşar. ·</li>\n<li>Genellikle evde kalır, ailesiyle yemek yer ve kitap okur. ·</li>\n<li>Çünkü pazartesi sabahı erken kalkar.</li>\n</ol>\n<p><strong>7.1</strong> gelirim · çalışırım · okurum · bakarım · görürüm\n· otururum · yazarım · beklerim</p>\n<p><strong>7.2</strong></p>\n<ol type=\"1\">\n<li>Gelmem.</li>\n<li>Çalışmazsın.</li>\n<li>Okumaz.</li>\n<li>Yazmayız.</li>\n<li>Bakmazsınız.</li>\n</ol>\n<p><strong>7.3</strong></p>\n<ol type=\"1\">\n<li>okuyorum</li>\n<li>içerim</li>\n<li>kalkarım</li>\n<li>izliyorum</li>\n</ol>\n<p><strong>7.4</strong></p>\n<ol type=\"1\">\n<li>Her gün çay içerim.</li>\n<li>Sigara içmem.</li>\n<li>Kahve içer misin?</li>\n<li>Bankada çalışır.</li>\n<li>Bazen sinemaya gideriz.</li>\n</ol>\n<p><strong>7.5</strong> alırım · bilirsin · gelir · buluruz · verirsiniz\n· kalırlar</p>\n<p><strong>7.6</strong></p>\n<ol type=\"1\">\n<li>Çay içer misiniz?</li>\n<li>Bana yardım eder misiniz?</li>\n<li>Kapıyı kapatır mısın?</li>\n<li>Yarın gelir misiniz?</li>\n</ol>\n<p><strong>7.7</strong></p>\n<ol type=\"1\">\n<li>her zaman ·</li>\n<li>Bazen ·</li>\n<li>hiç ·</li>\n<li>genellikle</li>\n</ol>\n<p><strong>7.8</strong> Примерен отговор: Her sabah erken kalkarım.\nKahvaltıda çay içerim. İşe otobüsle giderim. Akşamları kitap okurum.\nHafta sonu geç kalkarım.</p>\n<p><strong>7.9</strong></p>\n<ol type=\"1\">\n<li>yazarım</li>\n<li>çalışırım</li>\n<li>okurum</li>\n<li>gelirim</li>\n<li>görürüm</li>\n<li>beklerim</li>\n<li>otururum</li>\n<li>içerim</li>\n<li>alırım</li>\n<li>bilirim</li>\n</ol>\n<p><strong>7.10</strong></p>\n<ol type=\"1\">\n<li>bakarım</li>\n<li>bakarsın</li>\n<li>bakar</li>\n<li>bakarız</li>\n<li>bakarsınız</li>\n<li>bakarlar</li>\n</ol>\n<p><strong>7.11</strong></p>\n<ol type=\"1\">\n<li>Gelmem.</li>\n<li>Çalışmazsın.</li>\n<li>Okumaz.</li>\n<li>Bakmayız.</li>\n<li>Yazmazsınız.</li>\n<li>Gitmezler.</li>\n<li>Almam.</li>\n<li>Bilmeyiz.</li>\n</ol>\n<p><strong>7.12</strong></p>\n<ol type=\"1\">\n<li>Kapıyı kapatır mısınız?</li>\n<li>Bana yardım eder misin?</li>\n<li>Suyu verir misiniz?</li>\n<li>Çay içer misin?</li>\n<li>Yarın gelir misiniz?</li>\n<li>Tren istasyonu nerede, söyler misiniz?</li>\n</ol>\n<p><strong>7.13</strong></p>\n<ol type=\"1\">\n<li>okuyorum</li>\n<li>okurum</li>\n<li>çalışıyorum</li>\n<li>çalışır</li>\n<li>geliyorum</li>\n<li>gelir</li>\n<li>içmem</li>\n<li>yapıyorsun</li>\n</ol>\n<p><strong>7.14</strong></p>\n<ol type=\"1\">\n<li>Her sabah çay içerim.</li>\n<li>Sigara içmem.</li>\n<li>Su yüz derecede kaynar.</li>\n<li>O çok çalışır.</li>\n<li>Pencereyi kapatır mısınız?</li>\n<li>Genellikle erken kalkarım.</li>\n<li>Bazen sinemaya giderim.</li>\n<li>Hiç geç kalmam.</li>\n</ol>\n<p><strong>7.15</strong></p><ol type=\"1\"><li>vücut</li><li>kulak</li><li>diş</li><li>omuz</li><li>karın</li><li>kalp</li><li>hastalık</li><li>öksürük</li></ol><h2 id=\"урок-8-1\">Урок 8</h2>\n<p><strong>Въпроси към текста:</strong></p>\n<ol type=\"1\">\n<li>Antalya’ya gittiler. ·</li>\n<li>Bir hafta kaldılar. ·</li>\n<li>Erken kalktılar, kahvaltı yaptılar ve plaja indiler. ·</li>\n<li>Hava hep güneşliydi.</li>\n</ol>\n<p><strong>8.1</strong> geldim · gittim · okudum · yaptım · gördüm ·\nçalıştım · içtim · bekledim</p>\n<p><strong>8.2</strong></p>\n<ol type=\"1\">\n<li>oldun</li>\n<li>gittik</li>\n<li>okudu</li>\n<li>geldiler</li>\n<li>yaptınız</li>\n</ol>\n<p><strong>8.3</strong></p>\n<ol type=\"1\">\n<li>Gelmedim.</li>\n<li>Görmedin.</li>\n<li>Çalışmadı.</li>\n<li>Yapmadık.</li>\n<li>Okumadınız.</li>\n</ol>\n<p><strong>8.4</strong></p>\n<ol type=\"1\">\n<li>Dün okula gittim.</li>\n<li>Ali’yi görmedim.</li>\n<li>Dün ne yaptın?</li>\n<li>Hava güzeldi.</li>\n<li>Evdeydik.</li>\n</ol>\n<p><strong>8.5</strong></p>\n<ol type=\"1\">\n<li>yaptın</li>\n<li>gittik</li>\n<li>kalktı</li>\n<li>gördüler</li>\n<li>izlediniz</li>\n</ol>\n<p><strong>8.6</strong></p>\n<ol type=\"1\">\n<li>Okula gittim.</li>\n<li>Kitap okudun.</li>\n<li>Çay içti.</li>\n<li>Sinemaya gittik.</li>\n<li>Türkçe öğrendiniz.</li>\n</ol>\n<p><strong>8.7</strong></p>\n<ol type=\"1\">\n<li>-di (güzeldi) ·</li>\n<li>-dim (değildim) ·</li>\n<li>-dik (yorgunduk) ·</li>\n<li>-tu (yoktu) ·</li>\n<li>-ydi (öğrenciydi)</li>\n</ol>\n<p><strong>8.8</strong> Примерен отговор: Dün saat yedide kalktım.\nKahvaltı yaptım. İşe gittim. Öğlen arkadaşımla yemek yedim. Akşam eve\ndöndüm. Biraz televizyon izledim.</p>\n<p><strong>8.9</strong></p>\n<ol type=\"1\">\n<li>geldim</li>\n<li>gittim</li>\n<li>yaptım</li>\n<li>içtim</li>\n<li>okudum</li>\n<li>çalıştım</li>\n<li>gördüm</li>\n<li>baktım</li>\n<li>konuştum</li>\n<li>bekledim</li>\n</ol>\n<p><strong>8.10</strong></p>\n<ol type=\"1\">\n<li>yazdım</li>\n<li>yazdın</li>\n<li>yazdı</li>\n<li>yazdık</li>\n<li>yazdınız</li>\n<li>yazdılar</li>\n</ol>\n<p><strong>8.11</strong></p>\n<ol type=\"1\">\n<li>Okula gittim.</li>\n<li>Kitap okudun.</li>\n<li>Çay içti.</li>\n<li>Sinemaya gittik.</li>\n<li>Türkçe öğrendiniz.</li>\n<li>Erken kalktılar.</li>\n<li>Ali’yi bekledim.</li>\n<li>Yemek yaptın.</li>\n</ol>\n<p><strong>8.12</strong></p>\n<ol type=\"1\">\n<li>öğrenciydim</li>\n<li>hastaydın</li>\n<li>yorgundu</li>\n<li>evdeydik</li>\n<li>güzeldi</li>\n<li>yoktu</li>\n<li>vardı</li>\n<li>değildiniz</li>\n</ol>\n<p><strong>8.13</strong></p>\n<ol type=\"1\">\n<li>Gittin mi? — Hayır, gitmedim.</li>\n<li>Gördü mü? — Hayır, görmedi.</li>\n<li>Yaptık mı? — Hayır, yapmadık.</li>\n<li>Okudunuz mu? — Hayır, okumadık.</li>\n<li>Çalıştılar mı? — Hayır, çalışmadılar.</li>\n</ol>\n<p><strong>8.14</strong></p>\n<ol type=\"1\">\n<li>Dün okula gittim.</li>\n<li>Onu görmedim.</li>\n<li>Dün akşam ne yaptın?</li>\n<li>Hava çok güzeldi.</li>\n<li>Yorgunduk.</li>\n<li>Odada kimse yoktu.</li>\n<li>İki gün önce İstanbul’daydım.</li>\n<li>Az önce geldim.</li>\n</ol>\n<p><strong>8.16</strong></p><ol type=\"1\"><li>renk</li><li>kırmızı</li><li>sarı</li><li>turuncu</li><li>mor</li><li>kahverengi</li></ol><p><strong>8.15</strong></p><ol type=\"1\"><li>çirkin</li><li>zengin</li><li>üzgün</li><li>tok</li><li>boş</li><li>gürültülü</li><li>farklı</li><li>son</li></ol><h2 id=\"урок-9-1\">Урок 9</h2>\n<p><strong>Въпроси към текста:</strong></p>\n<ol type=\"1\">\n<li>Haziranda mezun olacak. ·</li>\n<li>Yunanistan’a gidecekler. ·</li>\n<li>Çünkü orada daha çok iş var. ·</li>\n<li>Kendi şirketini kuracak.</li>\n</ol>\n<p><strong>9.1</strong> geleceğim · yapacağım · okuyacağım · gideceğim ·\nbekleyeceğim · göreceğim</p>\n<p><strong>9.2</strong></p>\n<ol type=\"1\">\n<li>yapacaksın</li>\n<li>gideceğiz</li>\n<li>gelecek</li>\n<li>alacaklar</li>\n<li>bekleyeceksiniz</li>\n</ol>\n<p><strong>9.3</strong></p>\n<ol type=\"1\">\n<li>Gelmeyeceğim.</li>\n<li>Yapmayacaksın.</li>\n<li>Gitmeyecek.</li>\n<li>Okumayacağız.</li>\n<li>Beklemeyeceksiniz.</li>\n</ol>\n<p><strong>9.4</strong></p>\n<ol type=\"1\">\n<li>Yarın İstanbul’a gideceğim.</li>\n<li>Gelmeyeceğim.</li>\n<li>Yarın ne yapacaksın?</li>\n<li>Biletleri gelecek hafta alacağız.</li>\n<li>Yarın görüşecek miyiz?</li>\n</ol>\n<p><strong>9.5</strong></p>\n<ol type=\"1\">\n<li>olacak</li>\n<li>taşınacağız</li>\n<li>gelecek</li>\n<li>alacaklar</li>\n<li>yazacağım</li>\n</ol>\n<p><strong>9.6</strong></p>\n<ol type=\"1\">\n<li>Okula gideceğim.</li>\n<li>Kitap okuyacaksın.</li>\n<li>İş arayacak.</li>\n<li>Tatile çıkacağız.</li>\n<li>Erken yatacaksınız.</li>\n</ol>\n<p><strong>9.7</strong></p>\n<ol type=\"1\">\n<li>Hayır, gelmeyeceğim.</li>\n<li>Hayır, yapmayacak.</li>\n<li>Hayır, çıkmayacaklar.</li>\n<li>Hayır, etmeyeceğiz.</li>\n</ol>\n<p><strong>9.8</strong> Примерен отговор: Gelecek yıl Türkçe kursuna\nbaşlayacağım. Yeni bir iş arayacağım. Ailemle tatile gideceğim. Daha çok\nkitap okuyacağım. Spor yapacağım.</p>\n<p><strong>9.9</strong></p>\n<ol type=\"1\">\n<li>geleceğim, geleceğiz</li>\n<li>yapacağım, yapacağız</li>\n<li>okuyacağım, okuyacağız</li>\n<li>bekleyeceğim, bekleyeceğiz</li>\n<li>gideceğim, gideceğiz</li>\n<li>göreceğim, göreceğiz</li>\n<li>başlayacağım, başlayacağız</li>\n<li>yürüyeceğim, yürüyeceğiz</li>\n</ol>\n<p><strong>9.10</strong></p>\n<ol type=\"1\">\n<li>alacağım</li>\n<li>alacaksın</li>\n<li>alacak</li>\n<li>alacağız</li>\n<li>alacaksınız</li>\n<li>alacaklar</li>\n</ol>\n<p><strong>9.11</strong></p>\n<ol type=\"1\">\n<li>Gelmeyeceğim.</li>\n<li>Yapmayacaksın.</li>\n<li>Okumayacak.</li>\n<li>Beklemeyeceğiz.</li>\n<li>Gitmeyeceksiniz.</li>\n<li>Başlamayacaklar.</li>\n</ol>\n<p><strong>9.12</strong></p>\n<ol type=\"1\">\n<li>Yarın gelecek misin?</li>\n<li>O bu işi yapacak mı?</li>\n<li>Biz tatile çıkacak mıyız?</li>\n<li>Siz bize yardım edecek misiniz?</li>\n<li>Onlar bilet alacaklar mı?</li>\n</ol>\n<p><strong>9.13</strong></p>\n<ol type=\"1\">\n<li>olacak</li>\n<li>geliyorum</li>\n<li>taşınacağım</li>\n<li>gidiyoruz</li>\n<li>gideceğim</li>\n</ol>\n<p><strong>9.14</strong></p>\n<ol type=\"1\">\n<li>Yarın İstanbul’a gideceğim.</li>\n<li>Gelmeyeceğim.</li>\n<li>Gelecek hafta ne yapacaksın?</li>\n<li>Yarın yağmur yağacak.</li>\n<li>İki gün sonra döneceğim.</li>\n<li>Bize yardım edecek misiniz?</li>\n<li>Cumartesi çalışmayacağız.</li>\n<li>Yakında yeni bir işe başlayacağım.</li>\n</ol>\n<p><strong>9.15</strong></p><ol type=\"1\"><li>doğa</li><li>yağmur</li><li>rüzgâr</li><li>göl</li><li>dağ</li><li>orman</li><li>kuş</li><li>koyun</li></ol><h2 id=\"урок-10-1\">Урок 10</h2>\n<p><strong>Въпроси към текста:</strong></p>\n<ol type=\"1\">\n<li>Mercimek çorbası ve İskender kebap istiyor. ·</li>\n<li>Ayran alıyor. ·</li>\n<li>Sonra karar verecek. ·</li>\n<li>Hesabı istiyor.</li>\n</ol>\n<p><strong>10.1</strong></p>\n<ol type=\"1\">\n<li>Gel! / Gelin!</li>\n<li>Bak! / Bakın!</li>\n<li>Otur! / Oturun!</li>\n<li>Bekle! / Bekleyin!</li>\n<li>Dinle! / Dinleyin!</li>\n</ol>\n<p><strong>10.2</strong></p>\n<ol type=\"1\">\n<li>İstanbul’a gitmek istiyorum.</li>\n<li>Türkçe öğrenmek istiyorum.</li>\n<li>Bugün çalışmak istemiyorum.</li>\n<li>Ne yemek istiyorsun?</li>\n</ol>\n<p><strong>10.3</strong></p>\n<ol type=\"1\">\n<li>gelebilirim</li>\n<li>konuşabiliyor musun (или: konuşabilir misin)</li>\n<li>gelemez</li>\n<li>yardım edebiliriz</li>\n</ol>\n<p><strong>10.4</strong></p>\n<ol type=\"1\">\n<li>Arkadaşımla</li>\n<li>için</li>\n<li>sonra</li>\n<li>önce</li>\n</ol>\n<p><strong>10.5</strong></p>\n<ol type=\"1\">\n<li>Lütfen oturun.</li>\n<li>Unutma!</li>\n<li>Burada oturabilir miyim?</li>\n<li>Bugün gelemem.</li>\n<li>Arkadaşımla sinemaya gidiyorum.</li>\n</ol>\n<p><strong>10.6</strong></p>\n<ol type=\"1\">\n<li>Gelme!</li>\n<li>Unutma!</li>\n<li>Konuşmayın!</li>\n<li>Geç kalmayın!</li>\n<li>Bekleme!</li>\n</ol>\n<p><strong>10.7</strong></p>\n<ol type=\"1\">\n<li>yardım edebilirim</li>\n<li>anlayamıyorum</li>\n<li>içemezsiniz</li>\n<li>açabilir</li>\n</ol>\n<p><strong>10.8</strong></p>\n<ol type=\"1\">\n<li>Merhaba / İyi günler.</li>\n<li>Teşekkür ederim.</li>\n<li>Hesabı alabilir miyim, lütfen?</li>\n<li>Hoşça kalın. / Görüşürüz.</li>\n<li>Efendim? / Tekrar eder misiniz, lütfen?</li>\n</ol>\n<p><strong>10.9</strong> Примерен отговор: — Buyurun, ne alırsınız? —\nBir çay lütfen. — Şekerli mi? — Sade olsun. — Başka bir şey? — Hayır,\nteşekkür ederim.</p>\n<hr />\n<p><strong>10.16</strong></p><ol type=\"1\"><li>garson</li><li>sipariş</li><li>başlangıç</li><li>ana yemek</li><li>maden suyu</li><li>çatal</li><li>peçete</li><li>bahşiş</li><li>rezervasyon yapmak</li><li>paket servis</li></ol><p><strong>10.17</strong></p><ol type=\"1\"><li>içecek</li><li>yumurta</li><li>elma</li><li>üzüm</li><li>patates</li><li>sarımsak</li><li>zeytinyağı</li><li>dondurma</li></ol><h1 id=\"приложения\">ПРИЛОЖЕНИЯ</h1>\n<h2 id=\"приложение-1-гласната-хармония-накратко\">Приложение 1 — Гласната\nхармония накратко</h2>\n<table>\n<thead>\n<tr class=\"header\">\n<th>Последна гласна</th>\n<th>2-фолд (a/e)</th>\n<th>4-фолд (ı/i/u/ü)</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>a, ı</td>\n<td>a</td>\n<td>ı</td>\n</tr>\n<tr class=\"even\">\n<td>e, i</td>\n<td>e</td>\n<td>i</td>\n</tr>\n<tr class=\"odd\">\n<td>o, u</td>\n<td>a</td>\n<td>u</td>\n</tr>\n<tr class=\"even\">\n<td>ö, ü</td>\n<td>e</td>\n<td>ü</td>\n</tr>\n</tbody>\n</table>\n<h2 id=\"приложение-2-всички-времена-на-gelmek-ben-форма\">Приложение 2 —\nВсички времена на <code>gelmek</code> (ben-форма)</h2>\n<table>\n<thead>\n<tr class=\"header\">\n<th>Време</th>\n<th>Форма</th>\n<th>Превод</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Сегашно продълж.</td>\n<td>geliyorum</td>\n<td>идвам (сега)</td>\n</tr>\n<tr class=\"even\">\n<td>Широко сегашно</td>\n<td>gelirim</td>\n<td>идвам (обикновено)</td>\n</tr>\n<tr class=\"odd\">\n<td>Минало определено</td>\n<td>geldim</td>\n<td>дойдох</td>\n</tr>\n<tr class=\"even\">\n<td>Бъдеще</td>\n<td>geleceğim</td>\n<td>ще дойда</td>\n</tr>\n<tr class=\"odd\">\n<td>Възможност</td>\n<td>gelebilirim</td>\n<td>мога да дойда</td>\n</tr>\n<tr class=\"even\">\n<td>Желание</td>\n<td>gelmek istiyorum</td>\n<td>искам да дойда</td>\n</tr>\n</tbody>\n</table>\n<h2 id=\"приложение-3-съгласни-промени\">Приложение 3 — Съгласни\nпромени</h2>\n<p><strong>Твърди съгласни (fıstıkçı şahap): ç, f, h, k, p, s, ş,\nt</strong> → окончанието започва с <code>t</code> вместо <code>d</code>:\n<code>-ta/-te</code>, <code>-tan/-ten</code>, <code>-tı/-ti</code></p>\n<p><strong>Омекотяване пред гласна:</strong> p→b · ç→c · t→d · k→ğ (k→g\nпри едносрични)</p>\n<h2 id=\"приложение-4-речник-на-глаголите-от-част-1\">Приложение 4 —\nРечник на глаголите от Част 1</h2>\n<p>almak (вземам) · bakmak (гледам) · başlamak (започвам) · beklemek\n(чакам) · bilmek (зная) · bitirmek (завършвам) · bulmak (намирам) ·\nçalışmak (работя) · demek (казвам) · dinlemek (слушам) · dönmek (връщам\nсе) · gelmek (идвам) · gezmek (разхождам се) · gitmek (отивам) · görmek\n(виждам) · içmek (пия) · istemek (искам) · izlemek (гледам) · kalkmak\n(ставам) · kalmak (оставам) · konuşmak (говоря) · okumak (чета) ·\noturmak (седя, живея) · sevmek (обичам) · unutmak (забравям) · uyumak\n(спя) · vermek (давам) · yapmak (правя) · yazmak (пиша) · yemek (ям) ·\nyürümek (вървя)</p>\n<hr />\n<p><em>Край на Част 1 (ниво A1).</em> <em>Следва Част 2 (A2): минало\nнеопределено време (-mış), условно наклонение, сравнение, деепричастия,\n„преди да / след като“, страдателен залог, по-дълги текстове.</em></p>\n<p><strong>10.10</strong></p>\n<ol type=\"1\">\n<li>Bak! Baksın! Bakın! Bakmasın!</li>\n<li>Otur! Otursun! Oturun! Oturmasın!</li>\n<li>Bekle! Beklesin! Bekleyin! Beklemesin!</li>\n<li>Git! Gitsin! Gidin! Gitmesin!</li>\n<li>Konuş! Konuşsun! Konuşun! Konuşmasın!</li>\n</ol>\n<p><strong>10.11</strong></p>\n<ol type=\"1\">\n<li>yapayım</li>\n<li>gidelim</li>\n<li>edeyim</li>\n<li>içelim</li>\n<li>buluşalım</li>\n<li>sorayım</li>\n</ol>\n<p><strong>10.12</strong></p>\n<ol type=\"1\">\n<li>edebilirim</li>\n<li>anlayamıyorum</li>\n<li>gelemedim</li>\n<li>içemezsiniz</li>\n<li>gelebileceğim</li>\n<li>konuşabiliyorum</li>\n</ol>\n<p><strong>10.13</strong></p>\n<ol type=\"1\">\n<li>Arkadaşımla</li>\n<li>için</li>\n<li>Yemekten önce</li>\n<li>Dersten sonra</li>\n<li>kadar</li>\n<li>otobüsle</li>\n<li>için</li>\n<li>önce</li>\n</ol>\n<p><strong>10.14</strong></p>\n<ol type=\"1\">\n<li>Merhaba. / İyi günler.</li>\n<li>Kolay gelsin.</li>\n<li>Geçmiş olsun.</li>\n<li>Afiyet olsun.</li>\n<li>Hoş geldiniz.</li>\n<li>Güle güle kullan.</li>\n</ol>\n<p><strong>10.15</strong></p>\n<ol type=\"1\">\n<li>Lütfen oturun.</li>\n<li>Unutma!</li>\n<li>Sinemaya gidelim.</li>\n<li>Sana yardım edeyim mi?</li>\n<li>Burada oturabilir miyim?</li>\n<li>Bugün gelemem.</li>\n<li>Arkadaşımla gidiyorum.</li>\n<li>Yemekten önce ellerini yıka.</li>\n</ol>\n<h2 id=\"глава-за-падежите\">Глава за падежите</h2>\n<p><strong>П.1</strong></p>\n<ol type=\"1\">\n<li>okulu, okula, okulda, okuldan, okulun</li>\n<li>arabayı, arabaya, arabada, arabadan, arabanın</li>\n<li>kitabı, kitaba, kitapta, kitaptan, kitabın</li>\n<li>sokağı, sokağa, sokakta, sokaktan, sokağın</li>\n<li>öğrenciyi, öğrenciye, öğrencide, öğrenciden, öğrencinin</li>\n<li>gözü, göze, gözde, gözden, gözün</li>\n<li>şehri, şehre, şehirde, şehirden, şehrin</li>\n<li>kapıyı, kapıya, kapıda, kapıdan, kapının</li>\n</ol>\n<p><strong>П.2</strong></p>\n<ol type=\"1\">\n<li>İstanbul’a</li>\n<li>evden</li>\n<li>sınıfta</li>\n<li>Kitabı</li>\n<li>Ali’nin</li>\n<li>Okuldan</li>\n<li>Öğretmene</li>\n<li>Köpekten</li>\n</ol>\n<p><strong>П.3</strong></p>\n<ol type=\"1\">\n<li>filmi</li>\n<li>gazete</li>\n<li>kitabı</li>\n<li>Su</li>\n<li>Ali’yi</li>\n<li>Türkçe</li>\n<li>Arabanı</li>\n<li>Ekmek</li>\n</ol>\n<p><strong>П.4</strong></p>\n<ol type=\"1\">\n<li>Otobüse</li>\n<li>Otobüsten</li>\n<li>Sana</li>\n<li>Köpekten</li>\n<li>Müziği</li>\n<li>Derse</li>\n<li>Evden</li>\n<li>Seni</li>\n<li>Ona</li>\n<li>müzikten</li>\n</ol>\n<p><strong>П.5</strong></p>\n<ol type=\"1\">\n<li>bana</li>\n<li>sana</li>\n<li>ona</li>\n<li>bize</li>\n<li>size</li>\n<li>onlara</li>\n</ol>\n<p><strong>П.6</strong></p>\n<ol type=\"1\">\n<li>kitabımı, kitabıma, kitabımda, kitabımdan</li>\n<li>arabasını, arabasına, arabasında, arabasından</li>\n<li>okulumuzu, okulumuza, okulumuzda, okulumuzdan</li>\n<li>evini, evine, evinde, evinden</li>\n<li>annemi, anneme, annemde, annemden</li>\n<li>odasını, odasına, odasında, odasından</li>\n</ol>\n<p><strong>П.7</strong></p>\n<ol type=\"1\">\n<li>Bana verdi.</li>\n<li>Otobüse bindim.</li>\n<li>Kitabı okudum.</li>\n<li>İstanbul’da yaşıyorum.</li>\n<li>Sana söyledim.</li>\n<li>Evimden çıktım.</li>\n</ol>\n<p><strong>П.8</strong></p>\n<ol type=\"1\">\n<li>İstanbul’a gidiyorum.</li>\n<li>Okuldan geliyorum.</li>\n<li>Evdeyim.</li>\n<li>Kitabı okudum.</li>\n<li>Ona para verdim.</li>\n<li>Köpekten korkuyorum.</li>\n<li>Yüz liraya aldım.</li>\n<li>Pencereden baktım.</li>\n<li>Soğuktan hastalandım.</li>\n<li>Benden uzunsun.</li>\n</ol>\n<h1 id=\"ключ-с-отговорите-a2\">КЛЮЧ С ОТГОВОРИТЕ · A2</h1>\n<h2 id=\"урок-11-1\">Урок 11</h2>\n<p><strong>11.1</strong></p>\n<ol type=\"1\">\n<li>gelmiş</li>\n<li>yapmışsın</li>\n<li>gitmişler</li>\n<li>okumuşum</li>\n<li>içmiş</li>\n<li>çalışmışız</li>\n<li>görmüşsünüz</li>\n<li>beklemiş</li>\n</ol>\n<p><strong>11.2</strong></p>\n<ol type=\"1\">\n<li>gördüm</li>\n<li>duydum</li>\n<li>yağmış</li>\n<li>gittim</li>\n<li>unutmuşum</li>\n<li>yaptım</li>\n</ol>\n<p><strong>11.3</strong></p>\n<ol type=\"1\">\n<li>doktormuş</li>\n<li>Hastaymış</li>\n<li>Evdeymiş</li>\n<li>güzelmiş</li>\n<li>yokmuş</li>\n<li>varmış</li>\n</ol>\n<p><strong>11.4</strong></p>\n<ol type=\"1\">\n<li>geliyormuş</li>\n<li>gelecekmiş</li>\n<li>gelirmiş</li>\n<li>çalışıyormuşsun</li>\n<li>yapacaklarmış</li>\n</ol>\n<p><strong>11.5</strong></p>\n<ol type=\"1\">\n<li>Gelmemiş.</li>\n<li>Yapmamışsın.</li>\n<li>Gitmemişler.</li>\n<li>Okumamışım.</li>\n<li>Görmemişiz.</li>\n</ol>\n<p><strong>11.6</strong></p>\n<ol type=\"1\">\n<li>Ali dün gelmiş.</li>\n<li>Yağmur yağmış.</li>\n<li>Anahtarı unutmuşum.</li>\n<li>Yarın gelecekmiş.</li>\n<li>Meğer haklıymışsın.</li>\n<li>Bir varmış, bir yokmuş.</li>\n<li>Ayşe evlenmiş.</li>\n<li>Eskiden çok sigara içermiş.</li>\n</ol>\n<p><strong>11.7</strong></p><ol type=\"1\"><li>kibar</li><li>kaba</li><li>çalışkan</li><li>tembel</li><li>cömert</li><li>cimri</li><li>cesur</li><li>utangaç</li></ol><h2 id=\"урок-12-1\">Урок 12</h2>\n<p><strong>12.1</strong></p>\n<ol type=\"1\">\n<li>gitmeliyim</li>\n<li>çalışmalısın</li>\n<li>dinlenmeli</li>\n<li>beklemeliyiz</li>\n<li>yapmalısınız</li>\n<li>gelmeliler</li>\n</ol>\n<p><strong>12.2</strong></p>\n<ol type=\"1\">\n<li>Gitmemeliyim.</li>\n<li>Yapmamalısın.</li>\n<li>İçmemeli.</li>\n<li>Beklememeliyiz.</li>\n<li>Konuşmamalısınız.</li>\n</ol>\n<p><strong>12.3</strong></p>\n<ol type=\"1\">\n<li>Çalışman lazım.</li>\n<li>Dinlenmesi lazım.</li>\n<li>Beklememiz lazım.</li>\n<li>Gitmeniz lazım.</li>\n<li>Yapmam lazım.</li>\n</ol>\n<p><strong>12.4</strong></p>\n<ol type=\"1\">\n<li>yapmalı</li>\n<li>zorundayım</li>\n<li>lazım</li>\n<li>içmemelisin</li>\n<li>zorundayım</li>\n</ol>\n<p><strong>12.5</strong></p>\n<ol type=\"1\">\n<li>Girebilir miyim?</li>\n<li>Sigara içmek yasak.</li>\n<li>Burada park etmek serbest.</li>\n<li>Girmeyin!</li>\n<li>Burada oturabilir miyim?</li>\n</ol>\n<p><strong>12.6</strong></p>\n<ol type=\"1\">\n<li>Daha çok çalışmalıyım.</li>\n<li>Sigara içmemelisin.</li>\n<li>Gitmem lazım.</li>\n<li>Çalışmak zorundayım.</li>\n<li>Gitmek zorunda değilim.</li>\n<li>Ne yapmalıyım?</li>\n<li>Dinlenmen lazım.</li>\n<li>Gitmek zorunda kaldım.</li>\n</ol>\n<p><strong>12.8</strong></p><ol type=\"1\"><li>sınav</li><li>fakülte</li><li>bölüm</li><li>mezun olmak</li><li>burs</li><li>silgi</li><li>kalemtıraş</li><li>defter</li></ol><p><strong>12.7</strong></p><ol type=\"1\"><li>kiracı</li><li>mobilya</li><li>ütü</li><li>ütülemek</li><li>toz almak</li><li>ampul</li><li>çöp</li><li>dağınık</li></ol><h2 id=\"урок-13-1\">Урок 13</h2>\n<p><strong>13.1</strong></p>\n<ol type=\"1\">\n<li>gelirsen</li>\n<li>yaparsa</li>\n<li>çalışırsam</li>\n<li>gidersek</li>\n<li>olursa</li>\n<li>istersen</li>\n</ol>\n<p><strong>13.2</strong></p>\n<ol type=\"1\">\n<li>б</li>\n<li>г</li>\n<li>д</li>\n<li>а</li>\n<li>в</li>\n</ol>\n<p><strong>13.3</strong></p>\n<ol type=\"1\">\n<li>Erken kalksaydım, treni kaçırmazdım.</li>\n<li>Zengin olsaydım, dünyayı gezerdim.</li>\n<li>Beni dinleseydin, bu olmazdı.</li>\n<li>Çalışsaydı, kazanırdı.</li>\n</ol>\n<p><strong>13.4</strong></p>\n<ol type=\"1\">\n<li>Keşke</li>\n<li>Keşke</li>\n<li>Keşke</li>\n<li>Keşke</li>\n</ol>\n<p><strong>13.5</strong></p>\n<ol type=\"1\">\n<li>Hastaysan</li>\n<li>Müsaitseniz</li>\n<li>Varsa</li>\n<li>Yoksa</li>\n<li>Meşgulsen</li>\n</ol>\n<p><strong>13.6</strong></p>\n<ol type=\"1\">\n<li>Yarın gelirsen, birlikte yemek yeriz.</li>\n<li>Yağmur yağarsa, evde kalırız.</li>\n<li>Param olsaydı, alırdım.</li>\n<li>Keşke gelseydin.</li>\n<li>İstersen gidelim.</li>\n<li>Acele et, yoksa geç kalacaksın.</li>\n<li>Hastaysan, evde kal.</li>\n<li>Erken kalksaydım, treni kaçırmazdım.</li>\n</ol>\n<p><strong>13.7</strong></p><ol type=\"1\"><li>tedavi</li><li>ameliyat</li><li>tansiyon</li><li>hap</li><li>yara</li><li>kemik</li><li>alerji</li><li>iyileşmek</li></ol><h2 id=\"урок-14-1\">Урок 14</h2>\n<p><strong>14.1</strong></p>\n<ol type=\"1\">\n<li>Bu ev, o evden daha büyük.</li>\n<li>İstanbul, Ankara’dan daha kalabalık.</li>\n<li>Ben senden daha gencim.</li>\n<li>Tren, otobüsten daha hızlı.</li>\n<li>Bu kitap, o kitaptan daha ilginç.</li>\n</ol>\n<p><strong>14.2</strong></p>\n<ol type=\"1\">\n<li>Sınıfın en iyi öğrencisi.</li>\n<li>Dünyanın en yüksek dağı.</li>\n<li>Türkiye’nin en büyük şehri.</li>\n<li>Ailenin en küçük çocuğu.</li>\n</ol>\n<p><strong>14.3</strong></p>\n<ol type=\"1\">\n<li>kadar</li>\n<li>gibi</li>\n<li>gibi</li>\n<li>kadar</li>\n<li>gibi</li>\n</ol>\n<p><strong>14.4</strong></p>\n<ol type=\"1\">\n<li>Biraz</li>\n<li>fazla</li>\n<li>neredeyse</li>\n<li>en az</li>\n<li>çok</li>\n</ol>\n<p><strong>14.5</strong></p>\n<ol type=\"1\">\n<li>geçen yıla göre</li>\n<li>senin aksine</li>\n<li>aynı babası gibi</li>\n<li>bu
