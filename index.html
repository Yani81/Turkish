de>yolculuk</code> — пътуване; <code>sürmek</code> — трае;\n<code>dakika</code> — минута; <code>öğle yemeği</code> — обяд;\n<code>bitmek</code> — свършва; <code>-den sonra</code> — след;\n<code>biraz</code> — малко; <code>veya</code> — или; <code>yatmak</code>\n— лягам.</p>\n<p><strong>Въпроси:</strong></p>\n<ol type=\"1\">\n<li>Saat kaçta kalkıyor?</li>\n<li>Kahvaltıda ne yiyor?</li>\n<li>İşe nasıl gidiyor?</li>\n<li>Akşam saat kaçta eve dönüyor?</li>\n</ol>\n<h3 id=\"упражнения-alıştırmalar-5\">Упражнения · Alıştırmalar</h3>\n<p><strong>Упр. 6.1 — Напиши с думи.</strong> <em>(Yazıyla\nyazın.)</em></p>\n<ol type=\"1\">\n<li>7</li>\n<li>15</li>\n<li>42</li>\n<li>100</li>\n<li>365</li>\n<li>1998</li>\n</ol>\n<p><strong>Упр. 6.2 — Колко е часът?</strong> <em>(Saat kaç?)</em></p>\n<ol type=\"1\">\n<li>3:00</li>\n<li>6:30</li>\n<li>9:15</li>\n<li>10:45</li>\n<li>2:20</li>\n</ol>\n<p><strong>Упр. 6.3 — Попълни правилното окончание.</strong> <em>(Doğru\neki yazın.)</em></p>\n<ol type=\"1\">\n<li>Saat yedi___ kalkıyorum.</li>\n<li>Saat sekiz___ çeyrek var.</li>\n<li>Saat dört___ on geçiyor.</li>\n<li>Saat bir buçuk___ geliyorum.</li>\n</ol>\n<p><strong>Упр. 6.4 — Преведи на турски.</strong> <em>(Türkçeye\nçevirin.)</em></p>\n<ol type=\"1\">\n<li>Колко е часът?</li>\n<li>Часът е шест и половина.</li>\n<li>Ставам в седем часа.</li>\n<li>Днес е понеделник.</li>\n<li>Изпитът е на пети март.</li>\n</ol>\n<h3 id=\"допълнителни-упражнения-ek-alıştırmalar-5\">Допълнителни\nупражнения · Ek alıştırmalar</h3>\n<p><strong>Упр. 6.5 — Напиши часа с думи.</strong> <em>(Saati yazıyla\nyazın.)</em></p>\n<ol type=\"1\">\n<li>8:00</li>\n<li>11:30</li>\n<li>1:15</li>\n<li>5:45</li>\n<li>7:25</li>\n<li>12:00</li>\n</ol>\n<p><strong>Упр. 6.6 — Пресметни.</strong> <em>(Hesaplayın.)</em></p>\n<ol type=\"1\">\n<li>on beş + yirmi =</li>\n<li>kırk − on iki =</li>\n<li>yüz : dört =</li>\n<li>altı × yedi =</li>\n</ol>\n<p><strong>Упр. 6.7 — Кой ден е?</strong> <em>(Hangi gün?)</em></p>\n<ol type=\"1\">\n<li>Pazartesi’den sonra …</li>\n<li>Cuma’dan önce …</li>\n<li>Cumartesi ve … hafta sonu.</li>\n<li>Perşembe’den sonra …</li>\n</ol>\n<p><strong>Упр. 6.8 — Отговори за себе си.</strong> <em>(Kendiniz için\ncevap verin.)</em></p>\n<ol type=\"1\">\n<li>Saat kaçta kalkıyorsun?</li>\n<li>Saat kaçta işe/okula gidiyorsun?</li>\n<li>Saat kaçta yatıyorsun?</li>\n<li>Bugün günlerden ne?</li>\n</ol>\n<p><strong>Упр. 6.9 — Напиши числата с думи.</strong> <em>(Sayıları\nyazıyla yazın.)</em></p>\n<ol type=\"1\">\n<li>21</li>\n<li>47</li>\n<li>99</li>\n<li>105</li>\n<li>380</li>\n<li>1 250</li>\n<li>12 000</li>\n<li>2 000 000</li>\n</ol>\n<p><strong>Упр. 6.10 — Пресметни и напиши отговора с думи.</strong>\n<em>(Hesaplayın ve cevabı yazıyla yazın.)</em></p>\n<ol type=\"1\">\n<li>yirmi + on beş =</li>\n<li>altmış − yirmi beş =</li>\n<li>dokuz × sekiz =</li>\n<li>yüz : beş =</li>\n<li>kırk + otuz iki =</li>\n<li>seksen − on dokuz =</li>\n</ol>\n<p><strong>Упр. 6.11 — Колко е часът?</strong> <em>(Saat kaç?)</em></p>\n<ol type=\"1\">\n<li>2:00</li>\n<li>4:10</li>\n<li>6:15</li>\n<li>8:30</li>\n<li>9:45</li>\n<li>11:50</li>\n<li>1:25</li>\n<li>12:35</li>\n</ol>\n<p><strong>Упр. 6.12 — В колко часа? (добави местен падеж)</strong>\n<em>(Saat kaçta? (bulunma hâli ekleyin))</em></p>\n<ol type=\"1\">\n<li>Sınav saat dokuz___ .</li>\n<li>Ders saat bir buçuk___ başlıyor.</li>\n<li>Saat yedi___ kalkıyorum.</li>\n<li>Toplantı saat on iki___ .</li>\n<li>Film saat sekiz___ başlıyor.</li>\n<li>Saat üç___ geliyorum.</li>\n</ol>\n<p><strong>Упр. 6.13 — Дати.</strong> <em>(Tarihler.)</em></p>\n<ol type=\"1\">\n<li>5 март</li>\n<li>12 август 2026</li>\n<li>Изпитът е на десети май.</li>\n<li>Роден съм през 1990.</li>\n<li>Рожденият ми ден е през януари.</li>\n</ol>\n<p><strong>Упр. 6.14 — Отговори с пълно изречение.</strong> <em>(Tam\ncümleyle cevap verin.)</em></p>\n<ol type=\"1\">\n<li>Bugün günlerden ne?</li>\n<li>Saat kaç?</li>\n<li>Saat kaçta kalkıyorsun?</li>\n<li>Doğum günün ne zaman?</li>\n<li>Bir yılda kaç ay var?</li>\n<li>Bir haftada kaç gün var?</li>\n</ol>\n<hr />\n<h2 id=\"урок-7-широко-сегашно-време-geniş-zaman\">УРОК 7 · Широко сегашно\nвреме — Geniş zaman</h2>\n<h3 id=\"речник-sözlük-5\">Речник · Sözlük</h3>\n<table>\n<thead>\n<tr class=\"header\">\n<th>Турски</th>\n<th>Български</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>her gün</td>\n<td>всеки ден</td>\n</tr>\n<tr class=\"even\">\n<td>her zaman</td>\n<td>винаги</td>\n</tr>\n<tr class=\"odd\">\n<td>genellikle</td>\n<td>обикновено</td>\n</tr>\n<tr class=\"even\">\n<td>bazen</td>\n<td>понякога</td>\n</tr>\n<tr class=\"odd\">\n<td>asla / hiç</td>\n<td>никога</td>\n</tr>\n<tr class=\"even\">\n<td>sık sık</td>\n<td>често</td>\n</tr>\n<tr class=\"odd\">\n<td>nadiren</td>\n<td>рядко</td>\n</tr>\n<tr class=\"even\">\n<td>yardım etmek</td>\n<td>помагам</td>\n</tr>\n<tr class=\"odd\">\n<td>gezmek</td>\n<td>разхождам се</td>\n</tr>\n<tr class=\"even\">\n<td>yüzmek</td>\n<td>плувам</td>\n</tr>\n<tr class=\"odd\">\n<td>koşmak</td>\n<td>тичам</td>\n</tr>\n<tr class=\"even\">\n<td>kitap okumak</td>\n<td>чета книга</td>\n</tr>\n<tr class=\"odd\">\n<td>erken</td>\n<td>рано</td>\n</tr>\n<tr class=\"even\">\n<td>geç</td>\n<td>късно</td>\n</tr>\n<tr class=\"odd\">\n<td>birlikte</td>\n<td>заедно</td>\n</tr>\n<tr class=\"even\">\n<td>bazı</td>\n<td>някои</td>\n</tr>\n</tbody>\n</table>\n<h3\nid=\"граматика-7.1-geniş-zaman--r--ar--er--ır--ir--ur--ür-geniş-zaman\">Граматика\n7.1 — Geniş zaman: -r / -ar / -er / -ır / -ir / -ur / -ür · Geniş\nzaman</h3>\n<p>Употребява се за: - навици и повтарящи се действия:\n<code>Her gün kahve içerim.</code> — Всеки ден пия кафе. - общи истини:\n<code>Su yüz derecede kaynar.</code> — Водата кипи при 100 градуса. -\nучтиви молби и предложения: <code>Bir çay alır mısınız?</code> — Ще\nпиете ли чай?</p>\n<p><strong>Правила за образуване:</strong></p>\n<ol type=\"1\">\n<li><p>Ако коренът свършва на <strong>гласна</strong> → <code>-r</code>\n<code>oku-</code> → oku<strong>r</strong>, <code>bekle-</code> →\nbekle<strong>r</strong>, <code>başla-</code> →\nbaşla<strong>r</strong></p></li>\n<li><p>Ако коренът е <strong>едносричен и завършва на съгласна</strong>\n→ <code>-ar / -er</code> <code>gel-</code> → gel<strong>er</strong>,\n<code>yaz-</code> → yaz<strong>ar</strong>, <code>bak-</code> →\nbak<strong>ar</strong>, <code>git-</code> →\ngid<strong>er</strong></p></li>\n<li><p>Ако коренът е <strong>многосричен и завършва на съгласна</strong>\n→ <code>-ır / -ir / -ur / -ür</code> <code>çalış-</code> →\nçalış<strong>ır</strong>, <code>otur-</code> → otur<strong>ur</strong>,\n<code>öğren-</code> → öğren<strong>ir</strong>, <code>götür-</code> →\ngötür<strong>ür</strong></p></li>\n</ol>\n<p><strong>Изключения</strong> (едносрични, но вземат тясната гласна):\n<code>almak → alır</code>, <code>bilmek → bilir</code>,\n<code>bulmak → bulur</code>, <code>gelmek → gelir</code>,\n<code>görmek → görür</code>, <code>kalmak → kalır</code>,\n<code>olmak → olur</code>, <code>ölmek → ölür</code>,\n<code>sanmak → sanır</code>, <code>varmak → varır</code>,\n<code>vermek → verir</code>, <code>vurmak → vurur</code>,\n<code>durmak → durur</code>.</p>\n<p><strong>Спрежение (<code>gelmek</code>):</strong></p>\n<table>\n<tbody>\n<tr class=\"odd\">\n<td>ben gel<strong>irim</strong></td>\n<td>biz gel<strong>iriz</strong></td>\n</tr>\n<tr class=\"even\">\n<td>sen gel<strong>irsin</strong></td>\n<td>siz gel<strong>irsiniz</strong></td>\n</tr>\n<tr class=\"odd\">\n<td>o gel<strong>ir</strong></td>\n<td>onlar gel<strong>irler</strong></td>\n</tr>\n</tbody>\n</table>\n<p><strong>Отрицание — внимание, различно е!</strong></p>\n<table>\n<tbody>\n<tr class=\"odd\">\n<td>ben gel<strong>mem</strong></td>\n<td>biz gel<strong>meyiz</strong></td>\n</tr>\n<tr class=\"even\">\n<td>sen gel<strong>mezsin</strong></td>\n<td>siz gel<strong>mezsiniz</strong></td>\n</tr>\n<tr class=\"odd\">\n<td>o gel<strong>mez</strong></td>\n<td>onlar gel<strong>mezler</strong></td>\n</tr>\n</tbody>\n</table>\n<p>За 1 л. ед.ч. и мн.ч. се използва само <code>-me/-ma</code>, за\nостаналите — <code>-mez/-maz</code>.</p>\n<p><strong>Въпрос:</strong> <code>Gelir misin?</code> (Идваш ли\nобикновено? / Ще дойдеш ли?) · <code>Gelmez misin?</code></p>\n<h3\nid=\"граматика-7.2-разлика-между--yor-и-geniş-zaman-şimdiki-zaman-ve-geniş-zaman-farkı\">Граматика\n7.2 — Разлика между <code>-yor</code> и <code>geniş zaman</code> ·\nŞimdiki zaman ve geniş zaman farkı</h3>\n<table>\n<colgroup>\n<col style=\"width: 50%\" />\n<col style=\"width: 50%\" />\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th>-yor (сега)</th>\n<th>geniş zaman (обикновено)</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Şimdi çay içiyorum. — Сега пия чай.</td>\n<td>Her sabah çay içerim. — Всяка сутрин пия чай.</td>\n</tr>\n<tr class=\"even\">\n<td>Şu anda çalışıyor. — В момента работи.</td>\n<td>Bankada çalışır. — Работи в банка (по принцип).</td>\n</tr>\n</tbody>\n</table>\n<h3\nid=\"граматика-7.3-пълните-правила-за-geniş-zaman-geniş-zamanın-kuralları\">Граматика\n7.3 — Пълните правила за geniş zaman · Geniş zamanın kuralları</h3>\n<p>Изборът на окончание зависи от корена:</p>\n<p><strong>Правило 1 — корен на гласна → <code>-r</code></strong></p>\n<div class=\"line-block\">oku- | oku<strong>r</strong>um | чета |<br />\nbekle- | bekle<strong>r</strong>im | чакам |<br />\nbaşla- | başla<strong>r</strong>ım | започвам |<br />\nyürü- | yürü<strong>r</strong>üm | вървя |</div>\n<p><strong>Правило 2 — едносричен корен на съгласна →\n<code>-ar/-er</code></strong></p>\n<div class=\"line-block\">yaz- | yaz<strong>ar</strong>ım | пиша |<br />\nbak- | bak<strong>ar</strong>ım | гледам |<br />\niç- | iç<strong>er</strong>im | пия |<br />\ngit- | gid<strong>er</strong>im | отивам <em>(t→d)</em> |<br />\nyap- | yap<strong>ar</strong>ım | правя |</div>\n<p><strong>Правило 3 — многосричен корен на съгласна →\n<code>-ır/-ir/-ur/-ür</code></strong></p>\n<div class=\"line-block\">çalış- | çalış<strong>ır</strong>ım | работя\n|<br />\nöğren- | öğren<strong>ir</strong>im | уча |<br />\notur- | otur<strong>ur</strong>um | седя |<br />\ngötür- | götür<strong>ür</strong>üm | нося |</div>\n<p><strong>13-те изключения</strong> — едносрични, но с тясна гласна.\nЗапомни ги наизуст:</p>\n<p><code>al-ır</code> · <code>bil-ir</code> · <code>bul-ur</code> ·\n<code>dur-ur</code> · <code>gel-ir</code> · <code>gör-ür</code> ·\n<code>kal-ır</code> · <code>ol-ur</code> · <code>öl-ür</code> ·\n<code>san-ır</code> · <code>var-ır</code> · <code>ver-ir</code> ·\n<code>vur-ur</code></p>\n<p><strong>Мнемоника:</strong> почти всички са свързани с основни\nдействия — вземам, зная, намирам, идвам, виждам, оставам, ставам, давам.\nИменно най-употребяваните думи в един език запазват стари форми — същото\nе и в българския („съм“, „ям“, „дам“).</p>\n<p><strong>Внимавай с <code>etmek</code>:</strong> <code>et-</code> е\nедносричен, но следва правило 2 → <code>eder</code>,\n<code>ederim</code>, <code>edersin</code>. Затова:\n<code>yardım ederim</code> (помагам), <code>teşekkür ederim</code>\n(благодаря), <code>rica ederim</code> (моля). Това са едни от\nнай-честите изрази в турския.</p>\n<h3\nid=\"граматика-7.4-отрицанието-е-неправилно-geniş-zamanın-olumsuzu\">Граматика\n7.4 — Отрицанието е неправилно · Geniş zamanın olumsuzu</h3>\n<p>Тук turkish прави нещо особено — 1 лице се различава от\nостаналите:</p>\n<table>\n<thead>\n<tr class=\"header\">\n<th>Лице</th>\n<th>Форма</th>\n<th>Обяснение</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>ben</td>\n<td>gel<strong>mem</strong></td>\n<td>само -me/-ma</td>\n</tr>\n<tr class=\"even\">\n<td>sen</td>\n<td>gel<strong>mez</strong>sin</td>\n<td>-mez/-maz</td>\n</tr>\n<tr class=\"odd\">\n<td>o</td>\n<td>gel<strong>mez</strong></td>\n<td>-mez/-maz</td>\n</tr>\n<tr class=\"even\">\n<td>biz</td>\n<td>gel<strong>meyiz</strong></td>\n<td>-me + -yiz</td>\n</tr>\n<tr class=\"odd\">\n<td>siz</td>\n<td>gel<strong>mez</strong>siniz</td>\n<td>-mez/-maz</td>\n</tr>\n<tr class=\"even\">\n<td>onlar</td>\n<td>gel<strong>mez</strong>ler</td>\n<td>-mez/-maz</td>\n</tr>\n</tbody>\n</table>\n<p>С дебели гласни (<code>yapmak</code>):\n<code>yapmam, yapmazsın, yapmaz, yapmayız, yapmazsınız, yapmazlar</code></p>\n<h3\nid=\"граматика-7.5-кога-се-използва-geniş-zaman-geniş-zamanın-kullanımları\">Граматика\n7.5 — Кога се използва geniş zaman · Geniş zamanın kullanımları</h3>\n<ol type=\"1\">\n<li><strong>Навици:</strong> Her sabah kahve içerim. — Всяка сутрин пия\nкафе.</li>\n<li><strong>Общи истини:</strong> Su yüz derecede kaynar. — Водата кипи\nпри 100 градуса.</li>\n<li><strong>Характер:</strong> Çok çalışır. — Той е много работлив.</li>\n<li><strong>Учтива молба:</strong> Kapıyı kapatır mısınız? — Ще\nзатворите ли вратата?</li>\n<li><strong>Предложение:</strong> Bir çay içer misin? — Ще пиеш ли\nчай?</li>\n<li><strong>Обещание:</strong> Yarın gelirim. — Ще дойда утре.</li>\n<li><strong>Възможност:</strong> Belki gelir. — Може и да дойде.</li>\n</ol>\n<h3\nid=\"граматика-7.6--yor-срещу-geniş-zaman-şimdiki-zaman-ve-geniş-zaman\">Граматика\n7.6 — <code>-yor</code> срещу geniş zaman · Şimdiki zaman ve geniş\nzaman</h3>\n<table>\n<thead>\n<tr class=\"header\">\n<th>Ситуация</th>\n<th>Кое време</th>\n<th>Пример</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Сега, в момента</td>\n<td>-yor</td>\n<td>Şimdi çalışıyorum.</td>\n</tr>\n<tr class=\"even\">\n<td>Навик</td>\n<td>geniş</td>\n<td>Her gün çalışırım.</td>\n</tr>\n<tr class=\"odd\">\n<td>Този период</td>\n<td>-yor</td>\n<td>Bu ay çok çalışıyorum.</td>\n</tr>\n<tr class=\"even\">\n<td>Характер</td>\n<td>geniş</td>\n<td>O çok çalışır.</td>\n</tr>\n<tr class=\"odd\">\n<td>Сигурно бъдеще</td>\n<td>-yor</td>\n<td>Yarın geliyorum.</td>\n</tr>\n<tr class=\"even\">\n<td>Възможно бъдеще</td>\n<td>geniş</td>\n<td>Yarın gelirim.</td>\n</tr>\n<tr class=\"odd\">\n<td>Учтива молба</td>\n<td>geniş</td>\n<td>Yardım eder misiniz?</td>\n</tr>\n</tbody>\n</table>\n<p><strong>Класическа разлика:</strong> - <code>Sigara içiyorum.</code>\n— Пуша (точно сега, в момента). - <code>Sigara içerim.</code> — Пушач\nсъм. - <code>Sigara içmem.</code> — Не пуша (изобщо).</p>\n<h3 id=\"защо-е-така-neden-böyle-6\">Защо е така · Neden böyle</h3>\n<p><strong>Защо се казва „широко“ време?</strong> Защото обхваща широк\nотрязък от време — минало, настояще и бъдеще едновременно.\n<code>Her sabah kahve içerim</code> важи и за вчера, и за днес, и за\nутре. Затова с него се изразяват навици, характер и общи истини — все\nнеща без конкретен момент.</p>\n<p><strong>Защо отрицанието на 1 лице е различно?</strong>\n<code>gelmem</code> вместо очакваното <code>gelmezim</code>. Историческа\nпричина: старата форма е била <code>gelmezim</code>, но с времето е\nизтъркана в говора. Тази неправилност е малка цена — това е единственото\nмясто в турската глаголна система с такова изключение.</p>\n<p><strong>Защо учтивите молби са в geniş zaman?</strong> Защото това\nвреме не твърди нищо конкретно — оставя вратичка.\n<code>Kapıyı kapatır mısınız?</code> буквално е „Затваряте ли обикновено\nвратата?“, което е по-меко от прякото „Затвори вратата!“. Английският\nправи същото с <em>would you</em>.</p>\n<h3 id=\"текст-за-четене-и-превод-okuma-ve-çeviri-metni-5\">Текст за\nчетене и превод · Okuma ve çeviri metni</h3>\n<p><strong>Hafta sonu — Уикендът</strong></p>\n<blockquote>\n<p>Hafta içi çok çalışırım, bu yüzden hafta sonunu çok severim.\nCumartesi sabahı geç kalkarım, genellikle saat onda. Kahvaltıdan sonra\nparka giderim ve orada koşarım. Öğleden sonra bazen arkadaşlarımla\nbuluşurum. Birlikte kahve içeriz ve konuşuruz. Akşam sinemaya gideriz\nveya evde film izleriz. Pazar günü genellikle evde kalırım. Ailemle\nyemek yerim, biraz kitap okurum. Pazar akşamı erken yatarım, çünkü\npazartesi sabahı erken kalkarım.</p>\n</blockquote>\n<p><em>Нови думи:</em> <code>hafta içi</code> — през седмицата;\n<code>bu yüzden</code> — затова; <code>hafta sonu</code> — уикенд;\n<code>buluşmak</code> — срещам се; <code>kalmak</code> — оставам;\n<code>çünkü</code> — защото.</p>\n<p><strong>Въпроси:</strong></p>\n<ol type=\"1\">\n<li>Cumartesi saat kaçta kalkar?</li>\n<li>Parkta ne yapar?</li>\n<li>Pazar günü ne yapar?</li>\n<li>Neden pazar akşamı erken yatar?</li>\n</ol>\n<h3 id=\"упражнения-alıştırmalar-6\">Упражнения · Alıştırmalar</h3>\n<p><strong>Упр. 7.1 — Постави в geniş zaman (ben).</strong> <em>(Geniş\nzamana çevirin (ben).)</em></p>\n<ol type=\"1\">\n<li>gelmek</li>\n<li>çalışmak</li>\n<li>okumak</li>\n<li>bakmak</li>\n<li>görmek</li>\n<li>oturmak</li>\n<li>yazmak</li>\n<li>beklemek</li>\n</ol>\n<p><strong>Упр. 7.2 — Направи отрицателни.</strong> <em>(Olumsuz\nyapın.)</em></p>\n<ol type=\"1\">\n<li>Gelirim.</li>\n<li>Çalışırsın.</li>\n<li>Okur.</li>\n<li>Yazarız.</li>\n<li>Bakarsınız.</li>\n</ol>\n<p><strong>Упр. 7.3 — Избери правилната форма (-yor или geniş\nzaman).</strong> <em>(Doğru biçimi seçin (-yor / geniş zaman).)</em></p>\n<ol type=\"1\">\n<li>Şu anda kitap (okumak) ___ .</li>\n<li>Her gün kahve (içmek) ___ .</li>\n<li>Genellikle erken (kalkmak) ___ .</li>\n<li>Şimdi televizyon (izlemek) ___ .</li>\n</ol>\n<p><strong>Упр. 7.4 — Преведи на турски.</strong> <em>(Türkçeye\nçevirin.)</em></p>\n<ol type=\"1\">\n<li>Всеки ден пия чай.</li>\n<li>Не пуша. (<code>sigara içmek</code> — пуша)</li>\n<li>Ще пиеш ли кафе?</li>\n<li>Той работи в банка.</li>\n<li>Понякога ходим на кино.</li>\n</ol>\n<h3 id=\"допълнителни-упражнения-ek-alıştırmalar-6\">Допълнителни\nупражнения · Ek alıştırmalar</h3>\n<p><strong>Упр. 7.5 — Постави в geniş zaman (внимавай с\nизключенията).</strong> <em>(Geniş zamana çevirin (istisnalara\ndikkat).)</em></p>\n<ol type=\"1\">\n<li>almak (ben)</li>\n<li>bilmek (sen)</li>\n<li>gelmek (o)</li>\n<li>bulmak (biz)</li>\n<li>vermek (siz)</li>\n<li>kalmak (onlar)</li>\n</ol>\n<p><strong>Упр. 7.6 — Учтива молба с geniş zaman.</strong> <em>(Geniş\nzamanla kibar rica.)</em></p>\n<ol type=\"1\">\n<li>Ще пиете ли чай?</li>\n<li>Ще ми помогнете ли?</li>\n<li>Ще затвориш ли вратата? (<code>kapatmak</code>)</li>\n<li>Ще дойдете ли утре?</li>\n</ol>\n<p><strong>Упр. 7.7 — Попълни с наречие: <code>her zaman</code>,\n<code>bazen</code>, <code>genellikle</code>, <code>hiç</code>.</strong>\n<em>(Zarfla tamamlayın: her zaman, bazen, genellikle, hiç.)</em></p>\n<ol type=\"1\">\n<li>Sabahları ___ kahve içerim.</li>\n<li>___ sinemaya gideriz, ama çok sık değil.</li>\n<li>O ___ sigara içmez.</li>\n<li>Pazar günü ___ evde kalırım.</li>\n</ol>\n<p><strong>Упр. 7.8 — Опиши навиците си (5 изречения в geniş\nzaman).</strong> <em>(Alışkanlıklarınızı anlatın (geniş zamanla beş\ncümle).)</em></p>\n<p><strong>Упр. 7.9 — Кое правило? Спрегни за <code>ben</code>.</strong>\n<em>(Hangi kural? „ben“ için çekimleyin.)</em></p>\n<ol type=\"1\">\n<li>yazmak</li>\n<li>çalışmak</li>\n<li>okumak</li>\n<li>gelmek</li>\n<li>görmek</li>\n<li>beklemek</li>\n<li>oturmak</li>\n<li>içmek</li>\n<li>almak</li>\n<li>bilmek</li>\n</ol>\n<p><strong>Упр. 7.10 — Пълна таблица за <code>bakmak</code>.</strong>\n<em>(„bakmak“ için tam tablo.)</em></p>\n<ol type=\"1\">\n<li>ben ___</li>\n<li>sen ___</li>\n<li>o ___</li>\n<li>biz ___</li>\n<li>siz ___</li>\n<li>onlar ___</li>\n</ol>\n<p><strong>Упр. 7.11 — Отрицателна форма (внимавай с 1 лице).</strong>\n<em>(Olumsuz biçim (birinci kişiye dikkat).)</em></p>\n<ol type=\"1\">\n<li>Gelirim.</li>\n<li>Çalışırsın.</li>\n<li>Okur.</li>\n<li>Bakarız.</li>\n<li>Yazarsınız.</li>\n<li>Giderler.</li>\n<li>Alırım.</li>\n<li>Biliriz.</li>\n</ol>\n<p><strong>Упр. 7.12 — Учтива молба с geniş zaman.</strong> <em>(Geniş\nzamanla kibar rica.)</em></p>\n<ol type=\"1\">\n<li>Ще затворите ли вратата?</li>\n<li>Ще ми помогнеш ли?</li>\n<li>Ще ми дадете ли водата?</li>\n<li>Ще пиеш ли чай?</li>\n<li>Ще дойдете ли утре?</li>\n<li>Ще ми кажете ли къде е гарата?</li>\n</ol>\n<p><strong>Упр. 7.13 — <code>-yor</code> или geniş zaman?</strong>\n<em>(-yor mu, geniş zaman mı?)</em></p>\n<ol type=\"1\">\n<li>Şu anda kitap (okumak) ___ .</li>\n<li>Her akşam kitap (okumak) ___ .</li>\n<li>Bu ay çok (çalışmak) ___ .</li>\n<li>O çok (çalışmak) ___ , tembel değil.</li>\n<li>Yarın kesinlikle (gelmek) ___ .</li>\n<li>Belki yarın (gelmek) ___ .</li>\n<li>Sigara (içmek) ___ , hiç sevmem.</li>\n<li>Şimdi ne (yapmak) ___ ?</li>\n</ol>\n<p><strong>Упр. 7.14 — Преведи на турски.</strong> <em>(Türkçeye\nçevirin.)</em></p>\n<ol type=\"1\">\n<li>Всяка сутрин пия чай.</li>\n<li>Не пуша.</li>\n<li>Водата кипи при сто градуса.</li>\n<li>Той е много работлив.</li>\n<li>Ще затворите ли прозореца?</li>\n<li>Обикновено ставам рано.</li>\n<li>Понякога ходя на кино.</li>\n<li>Никога не закъснявам.</li>\n</ol>\n<hr />\n<h2 id=\"урок-8-минало-време-dün-ne-yaptın\">УРОК 8 · Минало време — Dün\nne yaptın?</h2>\n<h3 id=\"речник-sözlük-6\">Речник · Sözlük</h3>\n<table>\n<thead>\n<tr class=\"header\">\n<th>Турски</th>\n<th>Български</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>dün</td>\n<td>вчера</td>\n</tr>\n<tr class=\"even\">\n<td>geçen hafta</td>\n<td>миналата седмица</td>\n</tr>\n<tr class=\"odd\">\n<td>geçen yıl</td>\n<td>миналата година</td>\n</tr>\n<tr class=\"even\">\n<td>önce</td>\n<td>преди</td>\n</tr>\n<tr class=\"odd\">\n<td>sonra</td>\n<td>после, след</td>\n</tr>\n<tr class=\"even\">\n<td>doğmak</td>\n<td>раждам се</td>\n</tr>\n<tr class=\"odd\">\n<td>bitirmek</td>\n<td>завършвам</td>\n</tr>\n<tr class=\"even\">\n<td>taşınmak</td>\n<td>местя се</td>\n</tr>\n<tr class=\"odd\">\n<td>tanışmak</td>\n<td>запознавам се</td>\n</tr>\n<tr class=\"even\">\n<td>başlamak</td>\n<td>започвам</td>\n</tr>\n<tr class=\"odd\">\n<td>unutmak</td>\n<td>забравям</td>\n</tr>\n<tr class=\"even\">\n<td>hatırlamak</td>\n<td>помня</td>\n</tr>\n<tr class=\"odd\">\n<td>kaybetmek</td>\n<td>губя</td>\n</tr>\n<tr class=\"even\">\n<td>bulmak</td>\n<td>намирам</td>\n</tr>\n<tr class=\"odd\">\n<td>hiç</td>\n<td>никак, изобщо</td>\n</tr>\n<tr class=\"even\">\n<td>çok</td>\n<td>много</td>\n</tr>\n<tr class=\"odd\">\n<td>az</td>\n<td>малко</td>\n</tr>\n<tr class=\"even\">\n<td>tatil</td>\n<td>ваканция, отпуск</td>\n</tr>\n<tr class=\"odd\">\n<td>deniz</td>\n<td>море</td>\n</tr>\n<tr class=\"even\">\n<td>dağ</td>\n<td>планина</td>\n</tr>\n</tbody>\n</table>\n<h3\nid=\"граматика-8.1-минало-определено-време--dı--di--du--dü-görülen-geçmiş-zaman\">Граматика\n8.1 — Минало определено време (-dı / -di / -du / -dü) · Görülen geçmiş\nzaman</h3>\n<p>Използва се за завършени действия, които говорещият сам е\nвидял/преживял.</p>\n<p><strong>След <code>ç, f, h, k, p, s, ş, t</code> → -tı / -ti / -tu /\n-tü.</strong></p>\n<p><strong>Спрежение (<code>gelmek</code> — идвам):</strong></p>\n<table>\n<tbody>\n<tr class=\"odd\">\n<td>ben gel<strong>dim</strong></td>\n<td>дойдох</td>\n</tr>\n<tr class=\"even\">\n<td>sen gel<strong>din</strong></td>\n<td>ти дойде</td>\n</tr>\n<tr class=\"odd\">\n<td>o gel<strong>di</strong></td>\n<td>той дойде</td>\n</tr>\n<tr class=\"even\">\n<td>biz gel<strong>dik</strong></td>\n<td>дойдохме</td>\n</tr>\n<tr class=\"odd\">\n<td>siz gel<strong>diniz</strong></td>\n<td>вие дойдохте</td>\n</tr>\n<tr class=\"even\">\n<td>onlar gel<strong>diler</strong></td>\n<td>те дойдоха</td>\n</tr>\n</tbody>\n</table>\n<p><strong>Още примери:</strong></p>\n<table>\n<thead>\n<tr class=\"header\">\n<th>Глагол</th>\n<th>ben-форма</th>\n<th>Превод</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>yazmak</td>\n<td>yaz<strong>dım</strong></td>\n<td>писах</td>\n</tr>\n<tr class=\"even\">\n<td>okumak</td>\n<td>oku<strong>dum</strong></td>\n<td>четох</td>\n</tr>\n<tr class=\"odd\">\n<td>görmek</td>\n<td>gör<strong>düm</strong></td>\n<td>видях</td>\n</tr>\n<tr class=\"even\">\n<td>çalışmak</td>\n<td>çalış<strong>tım</strong></td>\n<td>работих</td>\n</tr>\n<tr class=\"odd\">\n<td>gitmek</td>\n<td>git<strong>tim</strong></td>\n<td>отидох</td>\n</tr>\n<tr class=\"even\">\n<td>yapmak</td>\n<td>yap<strong>tım</strong></td>\n<td>направих</td>\n</tr>\n<tr class=\"odd\">\n<td>içmek</td>\n<td>iç<strong>tim</strong></td>\n<td>пих</td>\n</tr>\n</tbody>\n</table>\n<p><strong>Отрицание:</strong> корен + <code>-ma/-me</code> +\n<code>-dı</code>\n<code>gelmedim, gelmedin, gelmedi, gelmedik, gelmediniz, gelmediler</code></p>\n<p><strong>Въпрос:</strong> частицата стои след глагола\n<code>Geldin mi?</code> — Дойде ли? · <code>Gitmedi mi?</code> — Не\nотиде ли?</p>\n<h3\nid=\"граматика-8.2-минало-време-на-именното-сказуемо-isim-cümlesinde-geçmiş-zaman\">Граматика\n8.2 — Минало време на именното сказуемо · İsim cümlesinde geçmiş\nzaman</h3>\n<ul>\n<li>Ben öğrenci<strong>ydim</strong>. — Аз бях студент.</li>\n<li>O hasta<strong>ydı</strong>. — Той беше болен.</li>\n<li>Biz evde<strong>ydik</strong>. — Ние бяхме вкъщи.</li>\n<li>Hava güzel<strong>di</strong>. — Времето беше хубаво.</li>\n<li>Ben orada değil<strong>dim</strong>. — Аз не бях там.</li>\n<li><code>var</code> → <strong>vardı</strong> (имаше); <code>yok</code>\n→ <strong>yoktu</strong> (нямаше)</li>\n</ul>\n<h3\nid=\"граматика-8.3-съгласната-пред--dı--dı-önünde-ünsüz-benzeşmesi\">Граматика\n8.3 — Съгласната пред <code>-dı</code> · „-dı“ önünde ünsüz\nbenzeşmesi</h3>\n<p>Ако коренът завършва на <strong>ç, f, h, k, p, s, ş, t</strong>\n(„FıSTıKÇı ŞaHaP“), окончанието започва с <code>t</code>:</p>\n<table>\n<thead>\n<tr class=\"header\">\n<th>Корен на</th>\n<th>Окончание</th>\n<th>Пример</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>гласна или мека съгласна</td>\n<td>-dı/-di/-du/-dü</td>\n<td>geldi, okudu, gördü</td>\n</tr>\n<tr class=\"even\">\n<td>ç f h k p s ş t</td>\n<td>-tı/-ti/-tu/-tü</td>\n<td>gitti, yaptı, içti, çalıştı</td>\n</tr>\n</tbody>\n</table>\n<p>Примери: <code>git-</code> → git<strong>ti</strong> ·\n<code>yap-</code> → yap<strong>tı</strong> · <code>iç-</code> →\niç<strong>ti</strong> · <code>çalış-</code> → çalış<strong>tı</strong> ·\n<code>bak-</code> → bak<strong>tı</strong> · <code>konuş-</code> →\nkonuş<strong>tu</strong></p>\n<h3 id=\"граматика-8.4-пълна-таблица-tam-çekim-tablosu\">Граматика 8.4 —\nПълна таблица · Tam çekim tablosu</h3>\n<p><strong>gitmek (отивам):</strong></p>\n<table>\n<thead>\n<tr class=\"header\">\n<th>Лице</th>\n<th>+</th>\n<th>−</th>\n<th>?</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>ben</td>\n<td>gittim</td>\n<td>gitmedim</td>\n<td>gittim mi?</td>\n</tr>\n<tr class=\"even\">\n<td>sen</td>\n<td>gittin</td>\n<td>gitmedin</td>\n<td>gittin mi?</td>\n</tr>\n<tr class=\"odd\">\n<td>o</td>\n<td>gitti</td>\n<td>gitmedi</td>\n<td>gitti mi?</td>\n</tr>\n<tr class=\"even\">\n<td>biz</td>\n<td>gittik</td>\n<td>gitmedik</td>\n<td>gittik mi?</td>\n</tr>\n<tr class=\"odd\">\n<td>siz</td>\n<td>gittiniz</td>\n<td>gitmediniz</td>\n<td>gittiniz mi?</td>\n</tr>\n<tr class=\"even\">\n<td>onlar</td>\n<td>gittiler</td>\n<td>gitmediler</td>\n<td>gittiler mi?</td>\n</tr>\n</tbody>\n</table>\n<p><strong>Забележи:</strong> в отрицателната форма винаги е\n<code>-medi/-madı</code>, защото <code>-me/-ma</code> завършва на\nгласна.</p>\n<h3\nid=\"граматика-8.5-минало-време-на-именното-сказуемо-isim-cümlesinde-geçmiş-zaman\">Граматика\n8.5 — Минало време на именното сказуемо · İsim cümlesinde geçmiş\nzaman</h3>\n<p>Когато няма глагол, а прилагателно или съществително:</p>\n<table>\n<thead>\n<tr class=\"header\">\n<th>Сега</th>\n<th>Минало</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Ben öğrenciyim.</td>\n<td>Ben öğrenci<strong>ydim</strong>.</td>\n</tr>\n<tr class=\"even\">\n<td>Sen hastasın.</td>\n<td>Sen hasta<strong>ydın</strong>.</td>\n</tr>\n<tr class=\"odd\">\n<td>O yorgun.</td>\n<td>O yorgun<strong>du</strong>.</td>\n</tr>\n<tr class=\"even\">\n<td>Biz evdeyiz.</td>\n<td>Biz evde<strong>ydik</strong>.</td>\n</tr>\n<tr class=\"odd\">\n<td>Hava güzel.</td>\n<td>Hava güzel<strong>di</strong>.</td>\n</tr>\n<tr class=\"even\">\n<td>Var.</td>\n<td>Var<strong>dı</strong>. — Имаше.</td>\n</tr>\n<tr class=\"odd\">\n<td>Yok.</td>\n<td>Yok<strong>tu</strong>. — Нямаше.</td>\n</tr>\n</tbody>\n</table>\n<p><strong>Правило за <code>y</code>:</strong> ако думата завършва на\nгласна, се вмъква <code>y</code>: <code>öğrenci</code> →\nöğrenci<strong>ydi</strong>, <code>hasta</code> →\nhasta<strong>ydı</strong></p>\n<h3\nid=\"граматика-8.6-наречия-за-минало-време-geçmiş-zaman-zarfları\">Граматика\n8.6 — Наречия за минало време · Geçmiş zaman zarfları</h3>\n<div class=\"line-block\">dün | вчера | dün akşam — снощи |<br />\nönceki gün | завчера | |<br />\ngeçen hafta | миналата седмица | |<br />\ngeçen ay | миналия месец | |<br />\ngeçen yıl | миналата година | |<br />\nbir saat önce | преди един час | |<br />\niki gün önce | преди два дни | |<br />\nuzun zaman önce | отдавна | |<br />\naz önce / demin | току-що | |<br />\no zaman | тогава | |</div>\n<h3\nid=\"граматика-8.7-разказ-в-минало-време-geçmiş-zamanda-anlatım\">Граматика\n8.7 — Разказ в минало време · Geçmiş zamanda anlatım</h3>\n<p>Типичен разказ подрежда действията с връзки:</p>\n<ul>\n<li><strong>önce</strong> — първо · <strong>sonra</strong> — после ·\n<strong>daha sonra</strong> — по-късно</li>\n<li><strong>ondan sonra</strong> — след това · <strong>en\nsonunda</strong> — накрая</li>\n<li><strong>-dıktan sonra</strong> — след като <em>(по-напред в\nкурса)</em></li>\n</ul>\n<p>Пример: &gt; Dün sabah erken kalktım. <strong>Önce</strong> kahvaltı\nyaptım, <strong>sonra</strong> işe gittim. &gt; Öğlen arkadaşımla yemek\nyedim. <strong>Ondan sonra</strong> markete uğradım. &gt; <strong>En\nsonunda</strong> eve döndüm ve dinlendim.</p>\n<h3 id=\"защо-е-така-neden-böyle-7\">Защо е така · Neden böyle</h3>\n<p><strong>Защо се нарича „свидетелско“ (görülen geçmiş zaman)?</strong>\nЗащото го използваш за неща, които сам си видял или преживял. Турският\nправи разлика между „видях как стана“ и „чух, че е станало“:</p>\n<ul>\n<li><code>Ali geldi.</code> — Али дойде. <em>(бях там)</em></li>\n<li><code>Ali gelmiş.</code> — Али дошъл. <em>(казаха ми / разбрах\nпосле)</em></li>\n</ul>\n<p>Втората форма идва на ниво A2, но е добре да знаеш още отсега, че\nтази разлика съществува — тя няма аналог в българския освен преизказното\nнаклонение.</p>\n<p><strong>Защо <code>evdeydim</code>, а не\n<code>evdedim</code>?</strong> Между две гласни се вмъква\n<code>y</code>: <code>evde</code> завършва на гласна, окончанието\n<code>-idi</code> започва с гласна. Същият механизъм като при\n<code>öğrenciydim</code>, <code>hastaydı</code>.</p>\n<p><strong>Защо <code>yoktu</code>, а не <code>yokdu</code>?</strong>\n<code>yok</code> завършва на <code>k</code> — беззвучна съгласна от\n„FıSTıKÇı ŞaHaP“, затова <code>d</code> → <code>t</code>.</p>\n<h3 id=\"текст-за-четене-и-превод-okuma-ve-çeviri-metni-6\">Текст за\nчетене и превод · Okuma ve çeviri metni</h3>\n<p><strong>Tatilim — Моята ваканция</strong></p>\n<blockquote>\n<p>Geçen yaz ailemle tatile gittik. Antalya’ya uçakla gittik ve orada\nbir hafta kaldık. Otelimiz denize çok yakındı. Her sabah erken kalktık,\nkahvaltı yaptık ve sonra plaja indik. Denizde yüzdük, kumda oynadık.\nÖğleden sonra biraz dinlendik. Bir gün eski şehri gezdik, müzeye gittik\nve çok güzel fotoğraflar çektik. Akşamları lokantada yemek yedik.\nAntalya’nın yemekleri çok lezzetliydi. Hava hep güneşliydi, hiç yağmur\nyağmadı. Tatil çok güzeldi ama çabuk bitti. Gelecek yıl yine gitmek\nistiyoruz.</p>\n</blockquote>\n<p><em>Нови думи:</em> <code>uçakla</code> — със самолет;\n<code>yakın</code> — близо; <code>plaj</code> — плаж; <code>inmek</code>\n— слизам; <code>kum</code> — пясък; <code>oynamak</code> — играя;\n<code>dinlenmek</code> — почивам си; <code>gezmek</code> — разглеждам;\n<code>fotoğraf çekmek</code> — снимам; <code>lezzetli</code> — вкусен;\n<code>güneşli</code> — слънчево; <code>yağmur yağmak</code> — вали дъжд;\n<code>çabuk</code> — бързо; <code>gelecek yıl</code> — следващата\nгодина; <code>yine</code> — отново.</p>\n<p><strong>Въпроси:</strong></p>\n<ol type=\"1\">\n<li>Geçen yaz nereye gittiler?</li>\n<li>Orada ne kadar kaldılar?</li>\n<li>Sabahları ne yaptılar?</li>\n<li>Hava nasıldı?</li>\n</ol>\n<h3 id=\"упражнения-alıştırmalar-7\">Упражнения · Alıştırmalar</h3>\n<p><strong>Упр. 8.1 — Постави в минало време (ben).</strong> <em>(Geçmiş\nzamana çevirin (ben).)</em></p>\n<ol type=\"1\">\n<li>gelmek</li>\n<li>gitmek</li>\n<li>okumak</li>\n<li>yapmak</li>\n<li>görmek</li>\n<li>çalışmak</li>\n<li>içmek</li>\n<li>beklemek</li>\n</ol>\n<p><strong>Упр. 8.2 — Постави глагола в правилната форма.</strong>\n<em>(Fiili doğru biçimde yazın.)</em></p>\n<ol type=\"1\">\n<li>Dün sen nerede (olmak) ___ ?</li>\n<li>Biz sinemaya (gitmek) ___ .</li>\n<li>O bir kitap (okumak) ___ .</li>\n<li>Onlar geç (gelmek) ___ .</li>\n<li>Siz ne (yapmak) ___ ?</li>\n</ol>\n<p><strong>Упр. 8.3 — Направи отрицателни.</strong> <em>(Olumsuz\nyapın.)</em></p>\n<ol type=\"1\">\n<li>Geldim.</li>\n<li>Gördün.</li>\n<li>Çalıştı.</li>\n<li>Yaptık.</li>\n<li>Okudunuz.</li>\n</ol>\n<p><strong>Упр. 8.4 — Преведи на турски.</strong> <em>(Türkçeye\nçevirin.)</em></p>\n<ol type=\"1\">\n<li>Вчера отидох на училище.</li>\n<li>Не видях Али.</li>\n<li>Какво направи вчера?</li>\n<li>Времето беше хубаво.</li>\n<li>Бяхме вкъщи.</li>\n</ol>\n<h3 id=\"допълнителни-упражнения-ek-alıştırmalar-7\">Допълнителни\nупражнения · Ek alıştırmalar</h3>\n<p><strong>Упр. 8.5 — Постави в минало време.</strong> <em>(Geçmiş\nzamana çevirin.)</em></p>\n<ol type=\"1\">\n<li>Dün ne (yapmak, sen) ___ ?</li>\n<li>Geçen hafta Ankara’ya (gitmek, biz) ___ .</li>\n<li>O sabah erken (kalkmak) ___ .</li>\n<li>Onlar bizi (görmek) ___ mü?</li>\n<li>Siz o filmi (izlemek) ___ mü?</li>\n</ol>\n<p><strong>Упр. 8.6 — Преобразувай в минало време.</strong> <em>(Geçmiş\nzamana dönüştürün.)</em></p>\n<ol type=\"1\">\n<li>Okula gidiyorum.</li>\n<li>Kitap okuyorsun.</li>\n<li>Çay içiyor.</li>\n<li>Sinemaya gidiyoruz.</li>\n<li>Türkçe öğreniyorsunuz.</li>\n</ol>\n<p><strong>Упр. 8.7 — Именно сказуемо в минало време.</strong> <em>(İsim\ncümlesinin geçmiş zamanı.)</em></p>\n<ol type=\"1\">\n<li>Hava güzel ___ .</li>\n<li>Ben orada değil ___ .</li>\n<li>Biz çok yorgun ___ .</li>\n<li>Sınıfta kimse yok ___ .</li>\n<li>O zaman öğrenci ___ .</li>\n</ol>\n<p><strong>Упр. 8.8 — Разкажи какво прави вчера (6 изречения).</strong>\n<em>(Dün ne yaptığınızı anlatın (altı cümle).)</em></p>\n<p><strong>Упр. 8.9 — -dı или -tı? Спрегни за <code>ben</code>.</strong>\n<em>(-dı mı, -tı mı? „ben“ için çekimleyin.)</em></p>\n<ol type=\"1\">\n<li>gelmek</li>\n<li>gitmek</li>\n<li>yapmak</li>\n<li>içmek</li>\n<li>okumak</li>\n<li>çalışmak</li>\n<li>görmek</li>\n<li>bakmak</li>\n<li>konuşmak</li>\n<li>beklemek</li>\n</ol>\n<p><strong>Упр. 8.10 — Пълна таблица за <code>yazmak</code>.</strong>\n<em>(„yazmak“ için tam tablo.)</em></p>\n<ol type=\"1\">\n<li>ben ___</li>\n<li>sen ___</li>\n<li>o ___</li>\n<li>biz ___</li>\n<li>siz ___</li>\n<li>onlar ___</li>\n</ol>\n<p><strong>Упр. 8.11 — Преобразувай от сегашно в минало.</strong>\n<em>(Şimdiki zamandan geçmiş zamana çevirin.)</em></p>\n<ol type=\"1\">\n<li>Okula gidiyorum.</li>\n<li>Kitap okuyorsun.</li>\n<li>Çay içiyor.</li>\n<li>Sinemaya gidiyoruz.</li>\n<li>Türkçe öğreniyorsunuz.</li>\n<li>Erken kalkıyorlar.</li>\n<li>Ali’yi bekliyorum.</li>\n<li>Yemek yapıyorsun.</li>\n</ol>\n<p><strong>Упр. 8.12 — Именно сказуемо в минало време.</strong>\n<em>(İsim cümlesinin geçmiş zamanı.)</em></p>\n<ol type=\"1\">\n<li>Ben öğrenci___ .</li>\n<li>Sen hasta___ .</li>\n<li>O çok yorgun___ .</li>\n<li>Biz evde___ .</li>\n<li>Hava çok güzel___ .</li>\n<li>Sınıfta kimse yok___ .</li>\n<li>Masada iki kitap var___ .</li>\n<li>Siz orada değil___ .</li>\n</ol>\n<p><strong>Упр. 8.13 — Направи въпрос и отговори отрицателно.</strong>\n<em>(Soru sorun ve olumsuz cevap verin.)</em></p>\n<p>Пример: Geldin. → Geldin mi? — Hayır, gelmedim.</p>\n<ol type=\"1\">\n<li>Gittin.</li>\n<li>Gördü.</li>\n<li>Yaptık.</li>\n<li>Okudunuz.</li>\n<li>Çalıştılar.</li>\n</ol>\n<p><strong>Упр. 8.14 — Преведи на турски.</strong> <em>(Türkçeye\nçevirin.)</em></p>\n<ol type=\"1\">\n<li>Вчера отидох на училище.</li>\n<li>Не го видях.</li>\n<li>Какво направи снощи?</li>\n<li>Времето беше много хубаво.</li>\n<li>Бяхме уморени.</li>\n<li>В стаята нямаше никого.</li>\n<li>Преди два дни бях в Истанбул.</li>\n<li>Току-що дойдох.</li>\n</ol>\n<hr />\n<h2 id=\"урок-9-бъдеще-време-yarın-ne-yapacaksın\">УРОК 9 · Бъдеще време —\nYarın ne yapacaksın?</h2>\n<h3 id=\"речник-sözlük-7\">Речник · Sözlük</h3>\n<table>\n<thead>\n<tr class=\"header\">\n<th>Турски</th>\n<th>Български</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>yarın</td>\n<td>утре</td>\n</tr>\n<tr class=\"even\">\n<td>öbür gün</td>\n<td>вдругиден</td>\n</tr>\n<tr class=\"odd\">\n<td>gelecek hafta</td>\n<td>следващата седмица</td>\n</tr>\n<tr class=\"even\">\n<td>gelecek ay</td>\n<td>следващият месец</td>\n</tr>\n<tr class=\"odd\">\n<td>ileride</td>\n<td>в бъдеще</td>\n</tr>\n<tr class=\"even\">\n<td>plan</td>\n<td>план</td>\n</tr>\n<tr class=\"odd\">\n<td>toplantı</td>\n<td>среща, събрание</td>\n</tr>\n<tr class=\"even\">\n<td>randevu</td>\n<td>час, среща (уговорена)</td>\n</tr>\n<tr class=\"odd\">\n<td>seyahat</td>\n<td>пътуване</td>\n</tr>\n<tr class=\"even\">\n<td>bilet</td>\n<td>билет</td>\n</tr>\n<tr class=\"odd\">\n<td>rezervasyon</td>\n<td>резервация</td>\n</tr>\n<tr class=\"even\">\n<td>hazırlanmak</td>\n<td>подготвям се</td>\n</tr>\n<tr class=\"odd\">\n<td>taşınmak</td>\n<td>местя се</td>\n</tr>\n<tr class=\"even\">\n<td>evlenmek</td>\n<td>женя се</td>\n</tr>\n<tr class=\"odd\">\n<td>mezun olmak</td>\n<td>завършвам (учебно заведение)</td>\n</tr>\n<tr class=\"even\">\n<td>belki</td>\n<td>може би</td>\n</tr>\n<tr class=\"odd\">\n<td>kesinlikle</td>\n<td>със сигурност</td>\n</tr>\n</tbody>\n</table>\n<h3 id=\"граматика-9.1-бъдеще-време--acak--ecek-gelecek-zaman\">Граматика\n9.1 — Бъдеще време: -acak / -ecek · Gelecek zaman</h3>\n<p><strong>След гласна се вмъква -y-:</strong> <code>bekle-</code> →\n<code>bekleyecek</code>, <code>oku-</code> → <code>okuyacak</code>.</p>\n<p><strong>Внимание при 1 лице:</strong> <code>k</code> → <code>ğ</code>\n(защото след него идва гласна).</p>\n<p><strong>Спрежение (<code>gelmek</code>):</strong></p>\n<table>\n<tbody>\n<tr class=\"odd\">\n<td>ben gel<strong>eceğim</strong></td>\n<td>ще дойда</td>\n</tr>\n<tr class=\"even\">\n<td>sen gel<strong>eceksin</strong></td>\n<td>ще дойдеш</td>\n</tr>\n<tr class=\"odd\">\n<td>o gel<strong>ecek</strong></td>\n<td>ще дойде</td>\n</tr>\n<tr class=\"even\">\n<td>biz gel<strong>eceğiz</strong></td>\n<td>ще дойдем</td>\n</tr>\n<tr class=\"odd\">\n<td>siz gel<strong>eceksiniz</strong></td>\n<td>ще дойдете</td>\n</tr>\n<tr class=\"even\">\n<td>onlar gel<strong>ecekler</strong></td>\n<td>ще дойдат</td>\n</tr>\n</tbody>\n</table>\n<p><strong>С дебели гласни (<code>yapmak</code>):</strong>\n<code>yapacağım, yapacaksın, yapacak, yapacağız, yapacaksınız, yapacaklar</code></p>\n<p><strong>Отрицание:</strong> корен + <code>-ma/-me</code> +\n<code>-y</code> + <code>acak/ecek</code>\n<code>gelmeyeceğim, gelmeyeceksin, gelmeyecek, gelmeyeceğiz, gelmeyeceksiniz, gelmeyecekler</code>\n<code>yapmayacağım, yapmayacaksın, yapmayacak...</code></p>\n<p><strong>Въпрос:</strong> <code>Gelecek misin?</code> — Ще дойдеш ли?\n· <code>Yapmayacak mısınız?</code> — Няма ли да направите?</p>\n<h3\nid=\"граматика-9.2-разговорни-съкращения-konuşma-dilinde-kısalmalar\">Граматика\n9.2 — Разговорни съкращения · Konuşma dilinde kısalmalar</h3>\n<p>В говоримия език често се чува: <code>geleceğim</code> →\n<strong>gelicem</strong>, <code>yapacağım</code> →\n<strong>yapıcam</strong>, <code>gideceğiz</code> →\n<strong>gidicez</strong>. В писмения език пиши пълната форма.</p>\n<h3 id=\"граматика-9.3-защо-k-става-ğ-k-neden-ğ-olur\">Граматика 9.3 —\nЗащо <code>k</code> става <code>ğ</code> · „k“ neden „ğ“ olur</h3>\n<p>Окончанието е <code>-acak/-ecek</code>. Когато след него идва гласна\n(при <code>ben</code> и <code>biz</code>), крайното <code>k</code> се\nсмекчава на <code>ğ</code>:</p>\n<div class=\"line-block\">gelecek + im | gelece<strong>ğ</strong>im\n|<br />\ngelecek + iz | gelece<strong>ğ</strong>iz |<br />\nyapacak + ım | yapaca<strong>ğ</strong>ım |<br />\nyapacak + ız | yapaca<strong>ğ</strong>ız |</div>\n<p>При останалите лица окончанието започва със съгласна, затова\n<code>k</code> остава:\n<code>geleceksin, gelecek, geleceksiniz, gelecekler</code></p>\n<h3 id=\"граматика-9.4-вмъкване-на-y-kaynaştırma-harfi-y\">Граматика 9.4 —\nВмъкване на <code>y</code> · Kaynaştırma harfi „y“</h3>\n<p>Ако коренът завършва на гласна, се вмъква <code>y</code>:</p>\n<div class=\"line-block\">bekle- | bekle<strong>y</strong>eceğim |<br />\noku- | oku<strong>y</strong>acağım |<br />\nbaşla- | başla<strong>y</strong>acağım |<br />\nyürü- | yürü<strong>y</strong>eceğim |</div>\n<p>Същото при отрицанието — <code>-ma/-me</code> завършва на гласна:\n<code>gelmeyeceğim</code>, <code>yapmayacağım</code>,\n<code>okumayacağım</code></p>\n<h3 id=\"граматика-9.5-пълна-таблица-tam-çekim-tablosu\">Граматика 9.5 —\nПълна таблица · Tam çekim tablosu</h3>\n<p><strong>yapmak (правя):</strong></p>\n<table>\n<thead>\n<tr class=\"header\">\n<th>Лице</th>\n<th>+</th>\n<th>−</th>\n<th>?</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>ben</td>\n<td>yapacağım</td>\n<td>yapmayacağım</td>\n<td>yapacak mıyım?</td>\n</tr>\n<tr class=\"even\">\n<td>sen</td>\n<td>yapacaksın</td>\n<td>yapmayacaksın</td>\n<td>yapacak mısın?</td>\n</tr>\n<tr class=\"odd\">\n<td>o</td>\n<td>yapacak</td>\n<td>yapmayacak</td>\n<td>yapacak mı?</td>\n</tr>\n<tr class=\"even\">\n<td>biz</td>\n<td>yapacağız</td>\n<td>yapmayacağız</td>\n<td>yapacak mıyız?</td>\n</tr>\n<tr class=\"odd\">\n<td>siz</td>\n<td>yapacaksınız</td>\n<td>yapmayacaksınız</td>\n<td>yapacak mısınız?</td>\n</tr>\n<tr class=\"even\">\n<td>onlar</td>\n<td>yapacaklar</td>\n<td>yapmayacaklar</td>\n<td>yapacaklar mı?</td>\n</tr>\n</tbody>\n</table>\n<h3\nid=\"граматика-9.6-бъдеще-срещу--yor-за-бъдещето-gelecek-zaman-ve-şimdiki-zaman\">Граматика\n9.6 — Бъдеще срещу <code>-yor</code> за бъдещето · Gelecek zaman ve\nşimdiki zaman</h3>\n<table>\n<colgroup>\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th>Форма</th>\n<th>Кога</th>\n<th>Пример</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>-yor</td>\n<td>уговорено, сигурно, близко</td>\n<td>Yarın geliyorum. — Утре идвам (уговорено).</td>\n</tr>\n<tr class=\"even\">\n<td>-acak</td>\n<td>план, обещание, прогноза</td>\n<td>Yarın geleceğim. — Ще дойда утре.</td>\n</tr>\n<tr class=\"odd\">\n<td>geniş</td>\n<td>възможност, вежливост</td>\n<td>Yarın gelirim. — Може и да дойда утре.</td>\n</tr>\n</tbody>\n</table>\n<p><strong>Прогноза за времето — винаги <code>-acak</code>:</strong> -\nYarın hava yağmurlu olacak. — Утре ще е дъждовно. - Hafta sonu kar\nyağacak. — През уикенда ще вали сняг.</p>\n<h3\nid=\"граматика-9.7-изрази-за-бъдеще-време-gelecek-zaman-ifadeleri\">Граматика\n9.7 — Изрази за бъдеще време · Gelecek zaman ifadeleri</h3>\n<div class=\"line-block\">yarın | утре |<br />\nöbür gün / yarından sonra | вдругиден |<br />\ngelecek hafta | следващата седмица |<br />\ngelecek ay | следващият месец |<br />\ngelecek yıl / seneye | следващата година |<br />\nbir saat sonra | след един час |<br />\niki gün sonra | след два дни |<br />\nyakında | скоро |<br />\nileride | в бъдеще |<br />\ner ya da geç | рано или късно |</div>\n<h3\nid=\"граматика-9.8-разговорни-съкращения-konuşma-dilinde-kısalmalar\">Граматика\n9.8 — Разговорни съкращения · Konuşma dilinde kısalmalar</h3>\n<p>В говора формите се съкращават силно. Разпознавай ги, но пиши\nпълните:</p>\n<table>\n<thead>\n<tr class=\"header\">\n<th>Пълна форма</th>\n<th>Разговорно</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>geleceğim</td>\n<td>gelicem</td>\n</tr>\n<tr class=\"even\">\n<td>yapacağım</td>\n<td>yapıcam</td>\n</tr>\n<tr class=\"odd\">\n<td>gideceğiz</td>\n<td>gidicez</td>\n</tr>\n<tr class=\"even\">\n<td>olacak</td>\n<td>olcak</td>\n</tr>\n<tr class=\"odd\">\n<td>bakacağım</td>\n<td>bakıcam</td>\n</tr>\n</tbody>\n</table>\n<h3 id=\"защо-е-така-neden-böyle-8\">Защо е така · Neden böyle</h3>\n<p><strong>Защо <code>-acak</code> става <code>-acağ</code> при „аз“ и\n„ние“?</strong> Защото след него идва гласна (<code>-ım</code>,\n<code>-ız</code>). Между две гласни <code>k</code> се смекчава в\n<code>ğ</code> — същото правило, което видя при\n<code>kitap → kitabım</code> и <code>sokak → sokağım</code>. При другите\nлица окончанието започва със съгласна (<code>-sın</code>,\n<code>-lar</code>), затова <code>k</code> остава.</p>\n<p><strong>Кога да използвам <code>-yor</code>, а кога\n<code>-acak</code> за бъдещето?</strong> Разликата е в сигурността:</p>\n<ul>\n<li><code>Yarın geliyorum</code> — уговорено е, билетът е купен, няма да\nсе промени.</li>\n<li><code>Yarın geleceğim</code> — възнамерявам, обещавам.</li>\n<li><code>Yarın gelirim</code> — може и да дойда, ако стане.</li>\n</ul>\n<p>Българският прави същото с „идвам утре“ срещу „ще дойда утре“.</p>\n<p><strong>Защо в говора се чува <code>gelicem</code>?</strong> Дългите\nформи се изтъркват в бързата реч: <code>geleceğim</code> →\n<code>gelcem</code> → <code>gelicem</code>. Разпознавай ги при слушане,\nно пиши пълните форми.</p>\n<h3 id=\"текст-за-четене-и-превод-okuma-ve-çeviri-metni-7\">Текст за\nчетене и превод · Okuma ve çeviri metni</h3>\n<p><strong>Gelecek planlarım — Плановете ми за бъдещето</strong></p>\n<blockquote>\n<p>Bu yıl üniversiteyi bitireceğim. Haziranda mezun olacağım ve sonra\nbir ay tatil yapacağım. Arkadaşlarımla Yunanistan’a gideceğiz. Biletleri\ngelecek hafta alacağız. Tatilden sonra iş arayacağım. Belki İstanbul’a\ntaşınacağım, çünkü orada daha çok iş var. Ailem beni destekleyecek. İlk\nyıl kolay olmayacak ama çalışacağım ve başaracağım. Beş yıl sonra kendi\nşirketimi kuracağım. Bu benim en büyük hayalim.</p>\n</blockquote>\n<p><em>Нови думи:</em> <code>üniversite</code> — университет;\n<code>Yunanistan</code> — Гърция; <code>iş aramak</code> — търся работа;\n<code>daha çok</code> — повече; <code>desteklemek</code> — подкрепям;\n<code>kolay</code> — лесен; <code>başarmak</code> — успявам;\n<code>kendi</code> — собствен; <code>şirket</code> — фирма;\n<code>kurmak</code> — основавам; <code>hayal</code> — мечта.</p>\n<p><strong>Въпроси:</strong></p>\n<ol type=\"1\">\n<li>Ne zaman mezun olacak?</li>\n<li>Tatilde nereye gidecekler?</li>\n<li>Neden İstanbul’a taşınacak?</li>\n<li>Beş yıl sonra ne yapacak?</li>\n</ol>\n<h3 id=\"упражнения-alıştırmalar-8\">Упражнения · Alıştırmalar</h3>\n<p><strong>Упр. 9.1 — Постави в бъдеще време (ben).</strong>\n<em>(Gelecek zamana çevirin (ben).)</em></p>\n<ol type=\"1\">\n<li>gelmek</li>\n<li>yapmak</li>\n<li>okumak</li>\n<li>gitmek</li>\n<li>beklemek</li>\n<li>görmek</li>\n</ol>\n<p><strong>Упр. 9.2 — Постави глагола в правилната форма.</strong>\n<em>(Fiili doğru biçimde yazın.)</em></p>\n<ol type=\"1\">\n<li>Yarın sen ne (yapmak) ___ ?</li>\n<li>Biz sinemaya (gitmek) ___ .</li>\n<li>O yarın (gelmek) ___ .</li>\n<li>Onlar bilet (almak) ___ .</li>\n<li>Siz burada (beklemek) ___ .</li>\n</ol>\n<p><strong>Упр. 9.3 — Направи отрицателни.</strong> <em>(Olumsuz\nyapın.)</em></p>\n<ol type=\"1\">\n<li>Geleceğim.</li>\n<li>Yapacaksın.</li>\n<li>Gidecek.</li>\n<li>Okuyacağız.</li>\n<li>Bekleyeceksiniz.</li>\n</ol>\n<p><strong>Упр. 9.4 — Преведи на турски.</strong> <em>(Türkçeye\nçevirin.)</em></p>\n<ol type=\"1\">\n<li>Утре ще отида в Истанбул.</li>\n<li>Няма да дойда.</li>\n<li>Какво ще правиш утре?</li>\n<li>Ще купим билетите следващата седмица.</li>\n<li>Ще се видим ли утре?</li>\n</ol>\n<h3 id=\"допълнителни-упражнения-ek-alıştırmalar-8\">Допълнителни\nупражнения · Ek alıştırmalar</h3>\n<p><strong>Упр. 9.5 — Постави в бъдеще време.</strong> <em>(Gelecek\nzamana çevirin.)</em></p>\n<ol type=\"1\">\n<li>Yarın hava nasıl (olmak) ___ ?</li>\n<li>Gelecek yıl İstanbul’a (taşınmak, biz) ___ .</li>\n<li>O bu akşam (gelmek) ___ mi?</li>\n<li>Onlar bileti internetten (almak) ___ .</li>\n<li>Ben sana yarın (yazmak) ___ .</li>\n</ol>\n<p><strong>Упр. 9.6 — Преобразувай от сегашно в бъдеще.</strong>\n<em>(Şimdiki zamandan gelecek zamana çevirin.)</em></p>\n<ol type=\"1\">\n<li>Okula gidiyorum.</li>\n<li>Kitap okuyorsun.</li>\n<li>İş arıyor.</li>\n<li>Tatile çıkıyoruz.</li>\n<li>Erken yatıyorsunuz.</li>\n</ol>\n<p><strong>Упр. 9.7 — Отговори отрицателно.</strong> <em>(Olumsuz cevap\nverin.)</em></p>\n<ol type=\"1\">\n<li>Yarın gelecek misin?</li>\n<li>O bu işi yapacak mı?</li>\n<li>Onlar tatile çıkacaklar mı?</li>\n<li>Bize yardım edecek misiniz?</li>\n</ol>\n<p><strong>Упр. 9.8 — Напиши 5 плана за следващата година.</strong>\n<em>(Gelecek yıl için beş plan yazın.)</em></p>\n<p><strong>Упр. 9.9 — Спрегни в бъдеще време за <code>ben</code> и\n<code>biz</code>.</strong> <em>(„ben“ ve „biz“ için gelecek zamanda\nçekimleyin.)</em></p>\n<ol type=\"1\">\n<li>gelmek</li>\n<li>yapmak</li>\n<li>okumak</li>\n<li>beklemek</li>\n<li>gitmek</li>\n<li>görmek</li>\n<li>başlamak</li>\n<li>yürümek</li>\n</ol>\n<p><strong>Упр. 9.10 — Пълна таблица за <code>almak</code>.</strong>\n<em>(„almak“ için tam tablo.)</em></p>\n<ol type=\"1\">\n<li>ben ___</li>\n<li>sen ___</li>\n<li>o ___</li>\n<li>biz ___</li>\n<li>siz ___</li>\n<li>onlar ___</li>\n</ol>\n<p><strong>Упр. 9.11 — Направи отрицателни.</strong> <em>(Olumsuz\nyapın.)</em></p>\n<ol type=\"1\">\n<li>Geleceğim.</li>\n<li>Yapacaksın.</li>\n<li>Okuyacak.</li>\n<li>Bekleyeceğiz.</li>\n<li>Gideceksiniz.</li>\n<li>Başlayacaklar.</li>\n</ol>\n<p><strong>Упр. 9.12 — Направи въпрос.</strong> <em>(Soru cümlesi\nyapın.)</em></p>\n<ol type=\"1\">\n<li>Yarın geleceksin.</li>\n<li>O bu işi yapacak.</li>\n<li>Biz tatile çıkacağız.</li>\n<li>Siz bize yardım edeceksiniz.</li>\n<li>Onlar bilet alacaklar.</li>\n</ol>\n<p><strong>Упр. 9.13 — <code>-yor</code> или\n<code>-acak</code>?</strong> <em>(-yor mu, -acak mı?)</em></p>\n<ol type=\"1\">\n<li>Yarın hava yağmurlu (olmak) ___ . (прогноза)</li>\n<li>Yarın saat üçte (gelmek) ___ . (уговорено)</li>\n<li>Gelecek yıl İstanbul’a (taşınmak) ___ . (план)</li>\n<li>Bu akşam sinemaya (gitmek) ___ . (билетите са купени)</li>\n<li>Bir gün Japonya’ya (gitmek) ___ . (мечта)</li>\n</ol>\n<p><strong>Упр. 9.14 — Преведи на турски.</strong> <em>(Türkçeye\nçevirin.)</em></p>\n<ol type=\"1\">\n<li>Утре ще отида в Истанбул.</li>\n<li>Няма да дойда.</li>\n<li>Какво ще правиш следващата седмица?</li>\n<li>Утре ще вали дъжд.</li>\n<li>След два дни ще се върна.</li>\n<li>Ще ни помогнете ли?</li>\n<li>Няма да работим в събота.</li>\n<li>Скоро ще започна нова работа.</li>\n</ol>\n<hr />\n<h2 id=\"урок-10-заповед-желание-и-възможност\">УРОК 10 · Заповед, желание\nи възможност</h2>\n<h3 id=\"речник-sözlük-8\">Речник · Sözlük</h3>\n<table>\n<thead>\n<tr class=\"header\">\n<th>Турски</th>\n<th>Български</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>gel!</td>\n<td>ела!</td>\n</tr>\n<tr class=\"even\">\n<td>bak!</td>\n<td>виж!</td>\n</tr>\n<tr class=\"odd\">\n<td>dur!</td>\n<td>спри!</td>\n</tr>\n<tr class=\"even\">\n<td>otur!</td>\n<td>седни!</td>\n</tr>\n<tr class=\"odd\">\n<td>dinle!</td>\n<td>слушай!</td>\n</tr>\n<tr class=\"even\">\n<td>acele etmek</td>\n<td>бързам</td>\n</tr>\n<tr class=\"odd\">\n<td>yardım</td>\n<td>помощ</td>\n</tr>\n<tr class=\"even\">\n<td>ile (-la / -le)</td>\n<td>с</td>\n</tr>\n<tr class=\"odd\">\n<td>için</td>\n<td>за, заради</td>\n</tr>\n<tr class=\"even\">\n<td>kadar</td>\n<td>до; колкото</td>\n</tr>\n<tr class=\"odd\">\n<td>gibi</td>\n<td>като</td>\n</tr>\n<tr class=\"even\">\n<td>önce</td>\n<td>преди</td>\n</tr>\n<tr class=\"odd\">\n<td>sonra</td>\n<td>след</td>\n</tr>\n<tr class=\"even\">\n<td>lazım</td>\n<td>нужно е</td>\n</tr>\n<tr class=\"odd\">\n<td>mümkün</td>\n<td>възможно</td>\n</tr>\n<tr class=\"even\">\n<td>yasak</td>\n<td>забранено</td>\n</tr>\n<tr class=\"odd\">\n<td>tehlikeli</td>\n<td>опасно</td>\n</tr>\n</tbody>\n</table>\n<h3\nid=\"граматика-10.1-повелително-наклонение-emir-kipi-emir-kipi\">Граматика\n10.1 — Повелително наклонение (emir kipi) · Emir kipi</h3>\n<table>\n<thead>\n<tr class=\"header\">\n<th>Лице</th>\n<th>Форма</th>\n<th>Пример</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>sen (ти)</td>\n<td>самият корен</td>\n<td><strong>Gel!</strong> — Ела! · <strong>Bak!</strong> — Виж!</td>\n</tr>\n<tr class=\"even\">\n<td>siz (вие, учтиво)</td>\n<td>-ın / -in / -un / -ün</td>\n<td><strong>Gelin!</strong> · <strong>Bakın!</strong></td>\n</tr>\n<tr class=\"odd\">\n<td>siz (много учтиво)</td>\n<td>-ınız / -iniz</td>\n<td><strong>Geliniz!</strong> · <strong>Buyurunuz!</strong></td>\n</tr>\n<tr class=\"even\">\n<td>o (нека той)</td>\n<td>-sın / -sin / -sun / -sün</td>\n<td><strong>Gelsin!</strong> — Нека дойде!</td>\n</tr>\n<tr class=\"odd\">\n<td>onlar</td>\n<td>-sınlar / -sinler</td>\n<td><strong>Gelsinler!</strong></td>\n</tr>\n</tbody>\n</table>\n<p><em>След гласна се вмъква <code>-y-</code>: <code>bekle</code> →\n<code>bekleyin</code>.</em></p>\n<p><strong>Отрицание:</strong> корен + <code>-ma/-me</code>\n<code>Gelme!</code> — Не идвай! · <code>Gelmeyin!</code> — Не идвайте! ·\n<code>Unutma!</code> — Не забравяй!</p>\n<p><strong>Учтиви форми:</strong> <code>Lütfen oturun.</code> — Моля,\nседнете. · <code>Buyurun.</code> — Заповядайте.</p>\n<h3 id=\"граматика-10.2-искам-да-istemek-istemek-ile\">Граматика 10.2 —\n„Искам да…“ — istemek · „istemek“ ile</h3>\n<p><strong>Инфинитив + istemek:</strong> - Gitmek istiyorum. — Искам да\nотида. - Türkçe öğrenmek istiyorum. — Искам да уча турски. - Ne yapmak\nistiyorsun? — Какво искаш да правиш? - Gelmek istemiyorum. — Не искам да\nдойда.</p>\n<p><strong>Съществително + istemek</strong> (винителен падеж или без\nнего): - Bir çay istiyorum. — Искам чай. - Su ister misiniz? — Желаете\nли вода?</p>\n<h3\nid=\"граматика-10.3-мога--abilmek--ebilmek-yeterlilik--abilmek\">Граматика\n10.3 — „Мога“ — -abilmek / -ebilmek · Yeterlilik: -abilmek</h3>\n<p><strong>Образуване:</strong> корен + <code>-abil / -ebil</code> +\nокончание за време. След гласна се вмъква <code>-y-</code>:\n<code>bekle-</code> → <code>bekleyebilirim</code>.</p>\n<ul>\n<li>Gel<strong>ebilirim</strong>. — Мога да дойда.</li>\n<li>Türkçe konuş<strong>abiliyorum</strong>. — Мога да говоря\nтурски.</li>\n<li>Yarın gel<strong>ebilir misin</strong>? — Можеш ли да дойдеш\nутре?</li>\n<li>Burada oturabilir miyim? — Мога ли да седна тук?</li>\n</ul>\n<p><strong>Отрицание — „не мога“ (-ama / -eme):</strong></p>\n<table>\n<tbody>\n<tr class=\"odd\">\n<td>ben gel<strong>emem</strong></td>\n<td>не мога да дойда</td>\n</tr>\n<tr class=\"even\">\n<td>sen gel<strong>emezsin</strong></td>\n<td>не можеш да дойдеш</td>\n</tr>\n<tr class=\"odd\">\n<td>o gel<strong>emez</strong></td>\n<td>не може да дойде</td>\n</tr>\n<tr class=\"even\">\n<td>biz gel<strong>eyiz</strong> → gel<strong>emeyiz</strong></td>\n<td>не можем</td>\n</tr>\n<tr class=\"odd\">\n<td>siz gel<strong>emezsiniz</strong></td>\n<td>не можете</td>\n</tr>\n<tr class=\"even\">\n<td>onlar gel<strong>emezler</strong></td>\n<td>не могат</td>\n</tr>\n</tbody>\n</table>\n<ul>\n<li>Bugün gelemem. — Днес не мога да дойда.</li>\n<li>Anlayamıyorum. — Не мога да разбера.</li>\n</ul>\n<h3 id=\"граматика-10.4-полезни-служебни-думи-edatlar\">Граматика 10.4 —\nПолезни служебни думи · Edatlar</h3>\n<p><strong>ile (-la / -le) — „с“:</strong> - Ali <strong>ile</strong> /\nAli’<strong>yle</strong> — с Али - otobüs <strong>ile</strong> /\notobüs<strong>le</strong> — с автобус - arkadaşım<strong>la</strong> — с\nмоя приятел - <em>С местоимения:</em> benimle, seninle, onunla, bizimle,\nsizinle, onlarla</p>\n<p><strong>için — „за“:</strong> - Senin <strong>için</strong> aldım. —\nКупих го за теб. - Bunun <strong>için</strong> geldim. — Затова\nдойдох.</p>\n<p><strong>önce / sonra:</strong> - Yemek<strong>ten önce</strong> —\nпреди ядене - Ders<strong>ten sonra</strong> — след урока - İki gün\n<strong>önce</strong> — преди два дни - Bir hafta <strong>sonra</strong>\n— след една седмица</p>\n<h3\nid=\"граматика-10.5-всички-форми-на-повелителното-наклонение-emir-kipinin-bütün-biçimleri\">Граматика\n10.5 — Всички форми на повелителното наклонение · Emir kipinin bütün\nbiçimleri</h3>\n<table>\n<thead>\n<tr class=\"header\">\n<th>Лице</th>\n<th>Утвърдително</th>\n<th>Отрицателно</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>sen</td>\n<td>Gel!</td>\n<td>Gelme!</td>\n</tr>\n<tr class=\"even\">\n<td>o</td>\n<td>Gelsin!</td>\n<td>Gelmesin!</td>\n</tr>\n<tr class=\"odd\">\n<td>siz</td>\n<td>Gelin!</td>\n<td>Gelmeyin!</td>\n</tr>\n<tr class=\"even\">\n<td>siz (много учтиво)</td>\n<td>Geliniz!</td>\n<td>Gelmeyiniz!</td>\n</tr>\n<tr class=\"odd\">\n<td>onlar</td>\n<td>Gelsinler!</td>\n<td>Gelmesinler!</td>\n</tr>\n</tbody>\n</table>\n<p><strong>Няма форма за <code>ben</code> и <code>biz</code></strong> —\nза тях се използва желателното наклонение: - Gide<strong>yim</strong> —\nда отида / нека отида - Gide<strong>lim</strong> — да отидем / хайде да\nотидем</p>\n<h3\nid=\"граматика-10.6-желателно-наклонение--ayım--eyim-istek-kipi\">Граматика\n10.6 — Желателно наклонение (-ayım / -eyim) · İstek kipi</h3>\n<div class=\"line-block\">ben | gel<strong>eyim</strong> | да дойда\n|<br />\nbiz | gel<strong>elim</strong> | да дойдем / хайде да дойдем |</div>\n<p>Употреба: - Ne yapayım? — Какво да правя? - Sana yardım edeyim mi? —\nДа ти помогна ли? - Hadi gidelim! — Хайде да тръгваме! - Bir kahve\niçelim mi? — Да пием ли по едно кафе? - Yarın buluşalım. — Нека се\nсрещнем утре.</p>\n<h3\nid=\"граматика-10.7-възможност--abilmek--ebilmek-yeterlilik-fiili\">Граматика\n10.7 — Възможност: -abilmek / -ebilmek · Yeterlilik fiili</h3>\n<p><strong>Утвърдително:</strong> корен + <code>-abil/-ebil</code> +\nокончание за време</p>\n<div class=\"line-block\">gelebilirim | мога да дойда |<br />\ngelebiliyorum | мога да дойда (в момента) |<br />\ngelebildim | можах да дойда |<br />\ngelebileceğim | ще мога да дойда |</div>\n<p><strong>Отрицателно („не мога“):</strong> корен +\n<code>-ama/-eme</code></p>\n<table>\n<colgroup>\n<col style=\"width: 50%\" />\n<col style=\"width: 50%\" />\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th>Време</th>\n<th>Форма</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>geniş</td>\n<td>gel<strong>emem</strong>, gel<strong>emezsin</strong>,\ngel<strong>emez</strong>,\ngel<strong>eyiz</strong>→gel<strong>emeyiz</strong></td>\n</tr>\n<tr class=\"even\">\n<td>-yor</td>\n<td>gel<strong>emiyorum</strong>, anla<strong>yamıyorum</strong></td>\n</tr>\n<tr class=\"odd\">\n<td>минало</td>\n<td>gel<strong>emedim</strong></td>\n</tr>\n<tr class=\"even\">\n<td>бъдеще</td>\n<td>gel<strong>emeyeceğim</strong></td>\n</tr>\n</tbody>\n</table>\n<p><strong>Разлика:</strong> - <code>Gelmem.</code> — Не идвам (не\nискам). - <code>Gelemem.</code> — Не мога да дойда (няма как).</p>\n<h3\nid=\"граматика-10.8-служебните-думи-в-детайли-edatlar-ayrıntılı\">Граматика\n10.8 — Служебните думи в детайли · Edatlar ayrıntılı</h3>\n<p><strong>ile (-la / -le)</strong> — „с“, „чрез“</p>\n<div class=\"line-block\">С човек | Ali ile / Ali’yle — с Али |<br />\nС предмет | kalem ile / kalemle — с молив |<br />\nПревозно средство | otobüsle, trenle, uçakla, arabayla |<br />\nС местоимение | benimle, seninle, onunla, bizimle, sizinle, onlarla\n|</div>\n<p><strong>için</strong> — „за“, „заради“</p>\n<ul>\n<li>Senin için — за теб</li>\n<li>Ne için? — За какво?</li>\n<li>Bunun için geldim. — За това дойдох.</li>\n<li>Sağlık için spor yapıyorum. — Спортувам заради здравето.</li>\n</ul>\n<p><strong>önce / sonra</strong> — с изходен падеж</p>\n<ul>\n<li>yemek<strong>ten</strong> önce — преди ядене</li>\n<li>ders<strong>ten</strong> sonra — след урока</li>\n<li>iki gün önce — преди два дни</li>\n<li>bir hafta sonra — след една седмица</li>\n</ul>\n<p><strong>kadar</strong> — „до“, „толкова колкото“</p>\n<ul>\n<li>Saat üçe kadar — до три часа</li>\n<li>Eve kadar — до вкъщи</li>\n<li>Senin kadar — колкото теб</li>\n</ul>\n<h3 id=\"граматика-10.9-учтивите-изрази-kibar-ifadeler\">Граматика 10.9 —\nУчтивите изрази · Kibar ifadeler</h3>\n<div class=\"line-block\">Buyurun. | Заповядайте. |<br />\nAfiyet olsun. | Добър апетит. |<br />\nKolay gelsin. | Лека работа. |<br />\nGeçmiş olsun. | Оздравявай. |<br />\nEline sağlık. | Благодаря за храната (към готвача). |<br />\nHoş geldiniz. — Hoş bulduk. | Добре дошли. — Добре заварили. |<br />\nGüle güle kullan. | Да го носиш със здраве. |<br />\nBaşınız sağ olsun. | Съболезнования. |<br />\nAllah kolaylık versin. | Да ти е леко. |<br />\nRica ederim. | Моля, няма защо. |</div>\n<h3 id=\"защо-е-така-neden-böyle-9\">Защо е така · Neden böyle</h3>\n<p><strong>Защо повелителната форма за „ти“ е самият корен?</strong>\nЗащото това е най-краткото възможно нареждане — без никакво окончание.\n<code>Gel!</code> е чистият глаголен корен. Турският е последователен:\nколкото по-учтиво, толкова по-дълга формата: <code>Gel!</code> →\n<code>Gelin!</code> → <code>Geliniz!</code> →\n<code>Gelir misiniz?</code></p>\n<p><strong>Каква е разликата между <code>gelmem</code> и\n<code>gelemem</code>?</strong> Едната буква мени всичко:</p>\n<ul>\n<li><code>gelmem</code> = не идвам (не искам, отказвам)</li>\n<li><code>gel**e**mem</code> = не мога да дойда (няма как, зает\nсъм)</li>\n</ul>\n<p>Първото е за воля, второто — за възможност. <code>-e-</code> е знакът\nна възможността.</p>\n<p><strong>Защо <code>-abilmek</code> съдържа <code>bil</code>\n(зная)?</strong> Защото формата идва от <code>gel-e bil-mek</code> — „да\nдойда зная“, тоест „умея да дойда“. С времето двете думи са се слели в\nедно окончание. Затова в положителната форма се вижда <code>bil</code>,\nа в отрицателната изчезва: <code>gelemem</code> (не съм в\nсъстояние).</p>\n<h3 id=\"текст-за-четене-и-превод-okuma-ve-çeviri-metni-8\">Текст за\nчетене и превод · Okuma ve çeviri metni</h3>\n<p><strong>Lokantada — В ресторанта</strong></p>\n<blockquote>\n<p>— Buyurun efendim, ne alırsınız?</p>\n<p>— Menüye bakabilir miyim, lütfen?</p>\n<p>— Tabii, buyurun.</p>\n<p>— Teşekkür ederim. Bugün ne tavsiye edersiniz?</p>\n<p>— Bugün mercimek çorbası ve İskender kebap çok güzel.</p>\n<p>— O zaman bir mercimek çorbası ve bir İskender istiyorum.</p>\n<p>— İçecek ne alırsınız?</p>\n<p>— Ayran alabilir miyim?</p>\n<p>— Elbette. Tatlı da ister misiniz?</p>\n<p>— Sonra karar vereceğim, teşekkürler.</p>\n<p>— Afiyet olsun! <em>(yemekten sonra)</em> — Hesabı alabilir miyim,\nlütfen?</p>\n<p>— Hemen getiriyorum efendim.</p>\n</blockquote>\n<p><em>Нови думи:</em> <code>efendim</code> — господине/госпожо;\n<code>menü</code> — меню; <code>tavsiye etmek</code> — препоръчвам;\n<code>mercimek çorbası</code> — леща супа; <code>içecek</code> —\nнапитка; <code>ayran</code> — айрян; <code>elbette</code> — разбира се;\n<code>tatlı</code> — десерт; <code>karar vermek</code> — решавам;\n<code>afiyet olsun</code> — добър апетит; <code>hesap</code> — сметка;\n<code>hemen</code> — веднага; <code>getirmek</code> — донасям.</p>\n<p><strong>Въпроси:</strong></p>\n<ol type=\"1\">\n<li>Müşteri ne yemek istiyor?</li>\n<li>Ne içecek alıyor?</li>\n<li>Tatlı istiyor mu?</li>\n<li>Sonunda ne istiyor?</li>\n</ol>\n<h3 id=\"упражнения-alıştırmalar-9\">Упражнения · Alıştırmalar</h3>\n<p><strong>Упр. 10.1 — Направи повелителна форма за <code>sen</code> и\n<code>siz</code>.</strong> <em>(„sen“ ve „siz“ için emir biçimi\nyapın.)</em></p>\n<ol type=\"1\">\n<li>gelmek</li>\n<li>bakmak</li>\n<li>oturmak</li>\n<li>beklemek</li>\n<li>dinlemek</li>\n</ol>\n<p><strong>Упр. 10.2 — Преведи с „искам да“.</strong> <em>(„istemek“ ile\nçevirin.)</em></p>\n<ol type=\"1\">\n<li>Искам да отида в Истанбул.</li>\n<li>Искам да уча турски.</li>\n<li>Не искам да работя днес.</li>\n<li>Какво искаш да ядеш?</li>\n</ol>\n<p><strong>Упр. 10.3 — Постави формата за възможност\n(-abilmek).</strong> <em>(Yeterlilik biçimini yazın\n(-abilmek).)</em></p>\n<ol type=\"1\">\n<li>Ben yarın (gelmek) ___ . (мога)</li>\n<li>Sen Türkçe (konuşmak) ___ mı? (можеш ли)</li>\n<li>O bugün (gelmek) ___ . (не може)</li>\n<li>Biz sana (yardım etmek) ___ . (можем)</li>\n</ol>\n<p><strong>Упр. 10.4 — Попълни с <code>ile</code>, <code>için</code>,\n<code>önce</code> или <code>sonra</code>.</strong> <em>(„ile, için,\nönce, sonra“ ile tamamlayın.)</em></p>\n<ol type=\"1\">\n<li>Arkadaşım___ sinemaya gidiyorum.</li>\n<li>Bu hediye senin ___ .</li>\n<li>Dersten ___ eve gideceğim.</li>\n<li>Yemekten ___ ellerini yıka.</li>\n</ol>\n<p><strong>Упр. 10.5 — Преведи на турски.</strong> <em>(Türkçeye\nçevirin.)</em></p>\n<ol type=\"1\">\n<li>Моля, седнете.</li>\n<li>Не забравяй!</li>\n<li>Мога ли да седна тук?</li>\n<li>Днес не мога да дойда.</li>\n<li>Отивам на кино с приятеля си.</li>\n</ol>\n<h3 id=\"допълнителни-упражнения-ek-alıştırmalar-9\">Допълнителни\nупражнения · Ek alıştırmalar</h3>\n<p><strong>Упр. 10.6 — Повелително наклонение: отрицателна\nформа.</strong> <em>(Emir kipi: olumsuz biçim.)</em></p>\n<ol type=\"1\">\n<li>gelmek (sen)</li>\n<li>unutmak (sen)</li>\n<li>konuşmak (siz)</li>\n<li>geç kalmak (siz)</li>\n<li>beklemek (sen)</li>\n</ol>\n<p><strong>Упр. 10.7 — „Мога / не мога“.</strong> <em>(„-abilmek /\n-amamak“.)</em></p>\n<ol type=\"1\">\n<li>Yarın sana (yardım etmek) ___ . (мога)</li>\n<li>Bu kelimeyi (anlamak) ___ . (не мога)</li>\n<li>Burada (sigara içmek) ___ . (не може)</li>\n<li>Pencereyi (açmak) ___ mıyım? (мога ли)</li>\n</ol>\n<p><strong>Упр. 10.8 — Учтиви изрази: какво ще кажеш?</strong>\n<em>(Kibar ifadeler: ne dersiniz?)</em></p>\n<ol type=\"1\">\n<li>Влизаш в магазин.</li>\n<li>Някой ти помага.</li>\n<li>Искаш сметката в ресторант.</li>\n<li>Тръгваш си от гости.</li>\n<li>Не разбра какво каза човекът.</li>\n</ol>\n<p><strong>Упр. 10.9 — Напиши диалог в кафене (6 реплики).</strong>\n<em>(Kafede bir diyalog yazın (altı replik).)</em></p>\n<p><strong>Упр. 10.10 — Направи всички повелителни форми.</strong>\n<em>(Bütün emir biçimlerini yazın.)</em></p>\n<p>Пример: gelmek → Gel! Gelsin! Gelin! Gelmesin!</p>\n<ol type=\"1\">\n<li>bakmak</li>\n<li>oturmak</li>\n<li>beklemek</li>\n<li>gitmek</li>\n<li>konuşmak</li>\n</ol>\n<p><strong>Упр. 10.11 — Желателно наклонение: <code>-eyim</code> или\n<code>-elim</code>?</strong> <em>(İstek kipi: -eyim mi, -elim\nmi?)</em></p>\n<ol type=\"1\">\n<li>Ne yap___ ? (аз)</li>\n<li>Hadi git___ ! (ние)</li>\n<li>Sana yardım ed___ mi? (аз)</li>\n<li>Bir kahve iç___ mi? (ние)</li>\n<li>Yarın buluş___ . (ние)</li>\n<li>Sana bir şey sor___ mu? (аз)</li>\n</ol>\n<p><strong>Упр. 10.12 — „Мога“ или „не мога“?</strong> <em>(„-abilmek“\nmi, „-amamak“ mı?)</em></p>\n<ol type=\"1\">\n<li>Yarın sana yardım ___ . (мога, geniş)</li>\n<li>Bu kelimeyi ___ . (не мога да разбера, -yor)</li>\n<li>Dün ___ . (не можах да дойда)</li>\n<li>Burada sigara ___ . (не може да се пуши)</li>\n<li>Yarın ___ . (ще мога да дойда)</li>\n<li>Türkçe ___ . (мога да говоря, -yor)</li>\n</ol>\n<p><strong>Упр. 10.13 — Попълни с <code>ile</code>, <code>için</code>,\n<code>önce</code>, <code>sonra</code> или <code>kadar</code>.</strong>\n<em>(„ile, için, önce, sonra, kadar“ ile tamamlayın.)</em></p>\n<ol type=\"1\">\n<li>Arkadaşım___ sinemaya gidiyorum.</li>\n<li>Bu hediye senin ___ .</li>\n<li>Yemek___ ___ ellerini yıka.</li>\n<li>Ders___ ___ eve gideceğim.</li>\n<li>Saat üçe ___ buradayım.</li>\n<li>Okula otobüs___ gidiyorum.</li>\n<li>Sağlık ___ spor yapıyorum.</li>\n<li>İki gün ___ İstanbul’daydım.</li>\n</ol>\n<p><strong>Упр. 10.14 — Какво ще кажеш в тази ситуация?</strong> <em>(Bu\ndurumda ne dersiniz?)</em></p>\n<ol type=\"1\">\n<li>Влизаш в магазин.</li>\n<li>Някой работи усилено.</li>\n<li>Приятелят ти е болен.</li>\n<li>Сядате на маса да ядете.</li>\n<li>Гост влиза в дома ти.</li>\n<li>Приятел си купи нова кола.</li>\n</ol>\n<p><strong>Упр. 10.15 — Преведи на турски.</strong> <em>(Türkçeye\nçevirin.)</em></p>\n<ol type=\"1\">\n<li>Моля, седнете.</li>\n<li>Не забравяй!</li>\n<li>Нека да отидем на кино.</li>\n<li>Да ти помогна ли?</li>\n<li>Мога ли да седна тук?</li>\n<li>Днес не мога да дойда.</li>\n<li>Отивам с приятеля си.</li>\n<li>Преди ядене си измий ръцете.</li>\n</ol>\n<hr />\n<h1 id=\"част-ii-ниво-a2\">ЧАСТ II · НИВО A2</h1>\n<p>На това ниво спираш да строиш прости изречения и започваш да свързваш\nмисли. Ключовите нови неща са: преразказното минало време (нещо, което\nбългарският има, а повечето езици — не), условните изречения,\nпричастията и деепричастията — турският начин да се каже „човекът, който\nдойде“ и „като дойдох, видях“.</p>\n<p>Уроците са построени като в Част I: речник, граматика с обяснения,\n„Защо е така“, текст за четене и упражнения с ключ.</p>\n<hr />\n<h2 id=\"урок-11-преразказно-минало-време-öğrenilen-geçmiş-zaman\">УРОК 11\n· Преразказно минало време · Öğrenilen geçmiş zaman</h2>\n<h3 id=\"речник-sözlük-9\">Речник · Sözlük</h3>\n<table>\n<thead>\n<tr class=\"header\">\n<th>Турски</th>\n<th>Български</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>duymak</td>\n<td>чувам</td>\n</tr>\n<tr class=\"even\">\n<td>söylemek</td>\n<td>казвам</td>\n</tr>\n<tr class=\"odd\">\n<td>anlatmak</td>\n<td>разказвам</td>\n</tr>\n<tr class=\"even\">\n<td>haber</td>\n<td>новина</td>\n</tr>\n<tr class=\"odd\">\n<td>galiba</td>\n<td>май, вероятно</td>\n</tr>\n<tr class=\"even\">\n<td>demek ki</td>\n<td>значи, излиза че</td>\n</tr>\n<tr class=\"odd\">\n<td>meğer</td>\n<td>оказва се</td>\n</tr>\n<tr class=\"even\">\n<td>rüya</td>\n<td>сън (насън)</td>\n</tr>\n<tr class=\"odd\">\n<td>masal</td>\n<td>приказка</td>\n</tr>\n<tr class=\"even\">\n<td>eskiden</td>\n<td>едно време</td>\n</tr>\n<tr class=\"odd\">\n<td>sanırım</td>\n<td>мисля че</td>\n</tr>\n<tr class=\"even\">\n<td>öyle mi?</td>\n<td>нима?</td>\n</tr>\n<tr class=\"odd\">\n<td>gerçekten</td>\n<td>наистина</td>\n</tr>\n<tr class=\"even\">\n<td>yalan</td>\n<td>лъжа</td>\n</tr>\n<tr class=\"odd\">\n<td>doğru</td>\n<td>вярно, истина</td>\n</tr>\n<tr class=\"even\">\n<td>olay</td>\n<td>случка, събитие</td>\n</tr>\n<tr class=\"odd\">\n<td>kaza</td>\n<td>злополука</td>\n</tr>\n<tr class=\"even\">\n<td>hava durumu</td>\n<td>прогноза за времето</td>\n</tr>\n<tr class=\"odd\">\n<td>gazete</td>\n<td>вестник</td>\n</tr>\n<tr class=\"even\">\n<td>dedikodu</td>\n<td>клюка</td>\n</tr>\n</tbody>\n</table>\n<h3\nid=\"граматика-11.1-какво-е-преразказно-време-öğrenilen-geçmiş-zaman\">Граматика\n11.1 — Какво е преразказно време · Öğrenilen geçmiş zaman</h3>\n<p>Турският има <strong>две минали времена</strong> и разликата между\nтях е като в българския:</p>\n<table>\n<colgroup>\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th>Форма</th>\n<th>Значение</th>\n<th>Пример</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td><strong>-dı</strong> (görülen)</td>\n<td>видях го, преживях го</td>\n<td>Ali geldi. — Али дойде.</td>\n</tr>\n<tr class=\"even\">\n<td><strong>-mış</strong> (öğrenilen)</td>\n<td>чух го, разбрах после</td>\n<td>Ali gelmiş. — Али бил дошъл.</td>\n</tr>\n</tbody>\n</table>\n<p>Българският прави същото с преизказното наклонение („дошъл“, „бил\nнаправил“), затова тази граматика ти е по-лесна, отколкото на англичанин\nили немец.</p>\n<h3 id=\"граматика-11.2-образуване\">Граматика 11.2 — Образуване</h3>\n<p><strong>Корен + -mış / -miş / -muş / -müş + лично\nокончание</strong></p>\n<table>\n<thead>\n<tr class=\"header\">\n<th>Лице</th>\n<th>gelmek</th>\n<th>yapmak</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>ben</td>\n<td>gel<strong>mişim</strong></td>\n<td>yap<strong>mışım</strong></td>\n</tr>\n<tr class=\"even\">\n<td>sen</td>\n<td>gel<strong>mişsin</strong></td>\n<td>yap<strong>mışsın</strong></td>\n</tr>\n<tr class=\"odd\">\n<td>o</td>\n<td>gel<strong>miş</strong></td>\n<td>yap<strong>mış</strong></td>\n</tr>\n<tr class=\"even\">\n<td>biz</td>\n<td>gel<strong>mişiz</strong></td>\n<td>yap<strong>mışız</strong></td>\n</tr>\n<tr class=\"odd\">\n<td>siz</td>\n<td>gel<strong>mişsiniz</strong></td>\n<td>yap<strong>mışsınız</strong></td>\n</tr>\n<tr class=\"even\">\n<td>onlar</td>\n<td>gel<strong>mişler</strong></td>\n<td>yap<strong>mışlar</strong></td>\n</tr>\n</tbody>\n</table>\n<p><strong>Няма асимилация на съгласната.</strong> За разлика от\n<code>-dı</code>, окончанието <code>-mış</code> започва със звучно\n<code>m</code>, затова никога не се обеззвучава: <code>gitmiş</code>,\n<code>yapmış</code>, <code>içmiş</code>, <code>çalışmış</code>. Сравни:\n<code>git-**t**i</code> (с асимилация) ↔︎ <code>git-**m**iş</code>\n(без).</p>\n<p><strong>Двойната форма за 3 л. мн.ч.:</strong> <code>gelmişler</code>\n(по-често) и <code>gelmiş</code> (когато подлогът е ясен от контекста).\nТурският изпуска <code>-ler</code> при глагола, ако подлогът вече е в\nмножествено число: <code>Çocuklar gelmiş.</code> е също толкова\nправилно, колкото <code>Çocuklar gelmişler.</code></p>\n<p><strong>Отрицание:</strong> корен + <code>-ma/-me</code> +\n<code>-mış</code>\n<code>gelmemiş, yapmamış, gitmemiş, okumamış</code></p>\n<p><strong>Въпрос:</strong> <code>Gelmiş mi?</code> — Дошъл ли е (както\nказват)?</p>\n<h3 id=\"граматика-11.3-четирите-употреби\">Граматика 11.3 — Четирите\nупотреби</h3>\n<p><strong>1. Чужда информация (най-честата):</strong> - Ali dün gelmiş.\n— Али бил дошъл вчера (казаха ми). - Hava yarın yağmurlu olacakmış. —\nВремето утре щяло да е дъждовно (по прогнозата). - Duydun mu? Ayşe\nevlenmiş! — Чу ли? Айше се била оженила!</p>\n<p><strong>2. Заключение от следа (осъзнаване след факта):</strong> -\nYağmur yağmış. — Валяло е. <em>(виждам мокрите улици)</em> - Çok\nyorulmuşum. — Много съм се уморил. <em>(усещам го чак сега)</em> -\nAnahtarı evde unutmuşum. — Забравил съм ключа вкъщи. <em>(осъзнавам го\nпред вратата)</em></p>\n<p><strong>3. Приказки и разкази:</strong> - Bir varmış, bir yokmuş. —\nИмало едно време. <em>(стандартното начало на турска приказка)</em> -\nPadişahın üç oğlu varmış. — Падишахът имал трима сина.</p>\n<p><strong>4. Учудване или ирония:</strong> - Demek çok çalışıyormuşsun!\n— Значи много си бил работлив! <em>(със съмнение)</em> - Meğer\nhaklıymışsın. — Оказва се, че си бил прав.</p>\n<h3 id=\"граматика-11.4-с-именно-сказуемо\">Граматика 11.4 — С именно\nсказуемо</h3>\n<p>Прикача се <code>-ymış</code> (след гласна) или <code>-mış</code>\n(след съгласна):</p>\n<table>\n<thead>\n<tr class=\"header\">\n<th>Сега</th>\n<th>Преразказно</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>O doktor.</td>\n<td>O doktor<strong>muş</strong>. — Той бил лекар.</td>\n</tr>\n<tr class=\"even\">\n<td>Hasta.</td>\n<td>Hasta<strong>ymış</strong>. — Бил болен.</td>\n</tr>\n<tr class=\"odd\">\n<td>Evde.</td>\n<td>Evde<strong>ymiş</strong>. — Бил вкъщи.</td>\n</tr>\n<tr class=\"even\">\n<td>Var.</td>\n<td>Var<strong>mış</strong>. — Имало.</td>\n</tr>\n<tr class=\"odd\">\n<td>Yok.</td>\n<td>Yok<strong>muş</strong>. — Нямало.</td>\n</tr>\n<tr class=\"even\">\n<td>Öğrenciyim.</td>\n<td>Öğrenci<strong>ymiş</strong>im. — Аз съм бил студент.</td>\n</tr>\n</tbody>\n</table>\n<h3 id=\"граматика-11.5-комбинации-с-други-времена\">Граматика 11.5 —\nКомбинации с други времена</h3>\n<p><code>-mış</code> може да се прикачи към друго време и тогава\nпреразказва него:</p>\n<table>\n<thead>\n<tr class=\"header\">\n<th>Форма</th>\n<th>Значение</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>geliyor<strong>muş</strong></td>\n<td>идвал (в момента, казват)</td>\n</tr>\n<tr class=\"even\">\n<td>gelecek<strong>miş</strong></td>\n<td>щял да дойде</td>\n</tr>\n<tr class=\"odd\">\n<td>gelir<strong>miş</strong></td>\n<td>идвал (обикновено, казват)</td>\n</tr>\n<tr class=\"even\">\n<td>geliyor<strong>muş</strong>um</td>\n<td>аз съм идвал (оказва се)</td>\n</tr>\n</tbody>\n</table>\n<p>Примери: - Ayşe şimdi çalışıyormuş. — Айше сега работела. - Yarın\ngelmeyecekmiş. — Утре нямало да дойде. - Eskiden çok sigara içermiş. —\nЕдно време много пушел.</p>\n<h3 id=\"граматика-11.6-кога-не-се-използва--mış\">Граматика 11.6 — Кога\nНЕ се използва <code>-mış</code></h3>\n<p>Ако си бил свидетел, винаги <code>-dı</code>, дори за далечно\nминало:</p>\n<ul>\n<li>✓ Dün Ali’yi gördüm. — Вчера видях Али.</li>\n<li>✗ <del>Dün Ali’yi görmüşüm.</del> <em>(освен ако не си бил пиян и не\nпомниш)</em></li>\n</ul>\n<p>За собствени действия <code>-mış</code> звучи странно, освен при\nосъзнаване: - <code>Uyumuşum.</code> — Заспал съм бил. <em>(правилно —\nосъзнаваш го при събуждане)</em> - <code>Dün sinemaya gitmişim.</code> —\nзвучи все едно не помниш дали си ходил.</p>\n<h3 id=\"защо-е-така-neden-böyle-10\">Защо е така · Neden böyle</h3>\n<p><strong>Защо турският изобщо има това време?</strong> Защото\nкултурата държи на разграничението „видях“ / „казаха ми“ — говорещият\nпоема или не поема отговорност за истинността. В новините ще чуеш\n<code>-mış</code> за непотвърдена информация и <code>-dı</code> за\nпроверена. Българският има същия механизъм, но го използваме\nпо-хлабаво.</p>\n<p><strong>Защо <code>yağmur yağmış</code> е за нещо, което сам\nвиждаш?</strong> Защото не си видял <strong>самото валене</strong> —\nвиждаш само следата. Логиката е: „заключавам от доказателство“, а не\n„присъствах“. Затова и <code>çok yorulmuşum</code> (уморил съм се) —\nумората е настъпила неусетно, осъзнаваш я после.</p>\n<p><strong>Защо приказките са в <code>-mış</code>?</strong> Защото\nразказвачът не е присъствал. <code>Bir varmış, bir yokmuş</code> е\nточният аналог на нашето „Имало едно време“ — и двата езика използват\nпреизказ за приказка. Ако турчин започне приказка с <code>-dı</code>,\nзвучи все едно твърди, че се е случило наистина.</p>\n<p><strong>Внимание:</strong> <code>-mış</code> понякога звучи като\nнедоверие. <code>Hastaymış</code> може да значи „бил болен“ (неутрално)\nили „уж бил болен“ (със съмнение) — интонацията решава. Не го използвай\nза неща, които знаеш със сигурност, за да не прозвучиш саркастично.</p>\n<h3 id=\"текст-за-четене-и-превод-okuma-ve-çeviri-metni-9\">Текст за\nчетене и превод · Okuma ve çeviri metni</h3>\n<p><strong>Dedikodu — Клюка</strong></p>\n<blockquote>\n<p>— Duydun mu? Ayşe işten ayrılmış!</p>\n<p>— Öyle mi? Neden peki?</p>\n<p>— Bilmiyorum ama yeni bir iş bulmuş diyorlar. Maaşı da çok daha\niyiymiş.</p>\n<p>— Demek ki iyi olmuş. Peki nerede çalışacakmış?</p>\n<p>— Bir bankada. Geçen hafta görüşmeye gitmiş ve hemen kabul\netmişler.</p>\n<p>— Vay! Hiç bahsetmemişti bana.</p>\n<p>— Bana da söylememiş. Ortak arkadaşımızdan duydum.</p>\n<p>— Neyse, ona bir mesaj atayım. Tebrik ederim, diyeyim.</p>\n<p>— İyi olur. Ama sakın benden duyduğunu söyleme!</p>\n</blockquote>\n<p><em>Нови думи:</em> <code>işten ayrılmak</code> — напускам работа;\n<code>maaş</code> — заплата; <code>görüşme</code> — интервю;\n<code>kabul etmek</code> — приемам; <code>bahsetmek</code> — споменавам;\n<code>ortak</code> — общ; <code>mesaj atmak</code> — пращам съобщение;\n<code>tebrik etmek</code> — поздравявам; <code>sakın</code> — да не си\nпосмял.</p>\n<p><strong>Въпроси:</strong></p>\n<ol type=\"1\">\n<li>Ayşe ne yapmış?</li>\n<li>Yeni işi nasılmış?</li>\n<li>Nerede çalışacakmış?</li>\n<li>Konuşan kişi haberi kimden duymuş?</li>\n</ol>\n<h3 id=\"упражнения-alıştırmalar-10\">Упражнения · Alıştırmalar</h3>\n<p><strong>Упр. 11.1 — Постави в преразказно време.</strong>\n<em>(Öğrenilen geçmiş zamana çevirin.)</em></p>\n<ol type=\"1\">\n<li>gelmek (o)</li>\n<li>yapmak (sen)</li>\n<li>gitmek (onlar)</li>\n<li>okumak (ben)</li>\n<li>içmek (o)</li>\n<li>çalışmak (biz)</li>\n<li>görmek (siz)</li>\n<li>beklemek (o)</li>\n</ol>\n<p><strong>Упр. 11.2 — <code>-dı</code> или <code>-mış</code>?</strong>\n<em>(-dı mı, -mış mı?)</em></p>\n<ol type=\"1\">\n<li>Dün Ali’yi (görmek) ___ . (бях там)</li>\n<li>Ayşe evlenmiş, ben de (duymak) ___ . (чух го)</li>\n<li>Yağmur (yağmak) ___ , yerler ıslak. (виждам следата)</li>\n<li>Geçen yıl İstanbul’a (gitmek) ___ . (аз ходих)</li>\n<li>Anahtarı evde (unutmak) ___ . (осъзнавам сега)</li>\n<li>Sabah kahvaltı (yapmak) ___ . (аз го направих)</li>\n</ol>\n<p><strong>Упр. 11.3 — Именно сказуемо в преразказно време.</strong>\n<em>(İsim cümlesini -mış ile yazın.)</em></p>\n<ol type=\"1\">\n<li>O doktor___ .</li>\n<li>Hasta___ .</li>\n<li>Evde__
