труден |<br />\nucuz / pahalı | евтин / скъп |<br />\ntemiz / kirli | чист / мръсен |<br />\nsıcak / soğuk | горещ / студен |<br />\naçık / kapalı | отворен / затворен |</div>\n<h3\nid=\"граматика-2.9-ред-на-думите-в-изречението-с-varyok-varyok-cümlesinde-kelime-sırası\">Граматика\n2.9 — Ред на думите в изречението с <code>var/yok</code> · „var/yok“\ncümlesinde kelime sırası</h3>\n<p>Основната схема е: <strong>място (в местен падеж) + предмет +\nvar/yok</strong></p>\n<ul>\n<li>Masa<strong>da</strong> kitap var. — На масата има книга.</li>\n<li>Oda<strong>da</strong> kimse yok. — В стаята няма никого.</li>\n<li>Bahçe<strong>de</strong> iki ağaç var. — В градината има две\nдървета.</li>\n</ul>\n<p>За притежание („имам“) се използва същата схема: -\nBen<strong>im</strong> bir araba<strong>m</strong> var. — Имам кола. -\nSen<strong>in</strong> kardeş<strong>in</strong> var mı? — Имаш ли\nбрат/сестра? - On<strong>un</strong> para<strong>sı</strong> yok. — Той\nняма пари.</p>\n<h3 id=\"защо-е-така-neden-böyle-1\">Защо е така · Neden böyle</h3>\n<p><strong>Защо <code>-lar/-ler</code> изчезва след число?</strong>\nЗащото числото вече казва, че са много. Турският не повтаря една и съща\nинформация два пъти. <code>beş kitap</code> — „пет книга“. Същото важи и\nза <code>çok</code>, <code>az</code>, <code>birkaç</code>:\n<code>çok kitap</code> (много книги), <code>birkaç öğrenci</code>\n(няколко ученици).</p>\n<p><strong>Защо <code>d</code> става <code>t</code> в\n<code>sınıfta</code>?</strong> Заради лекотата на изговора. След\nбеззвучна съгласна (<code>ç, f, h, k, p, s, ş, t</code>) езикът трудно\nпреминава към звучното <code>d</code>, затова то се обеззвучава в\n<code>t</code>. Същото прави и българският: „сграда“ но „скъп“.\nМнемониката е измислена дума <strong>„FıSTıKÇı ŞaHaP“</strong> (Шахап,\nпродавачът на шам-фъстък) — в нея са всичките осем букви.</p>\n<p><strong>Защо <code>var</code> и <code>yok</code> стоят в\nкрая?</strong> Защото те са сказуемото — а сказуемото в турския винаги е\nнакрая. <code>Masada kitap var.</code> = „На-масата книга има.“</p>\n<h3 id=\"текст-за-четене-и-превод-okuma-ve-çeviri-metni\">Текст за четене\nи превод · Okuma ve çeviri metni</h3>\n<p><strong>Benim odam — Моята стая</strong></p>\n<blockquote>\n<p>Bu benim odam. Odam çok büyük değil ama çok güzel. Odada bir masa,\niki sandalye ve bir yatak var. Masada bir bilgisayar, kitaplar ve\ndefterler var. Kalemler çantada. Duvarda bir harita var. Odada\ntelevizyon yok. Pencere büyük ve odam çok aydınlık. Ben odamı çok\nseviyorum.</p>\n</blockquote>\n<p><em>Нови думи:</em> <code>yatak</code> — легло;\n<code>bilgisayar</code> — компютър; <code>duvar</code> — стена;\n<code>harita</code> — карта; <code>pencere</code> — прозорец;\n<code>aydınlık</code> — светъл; <code>seviyorum</code> — обичам.</p>\n<p><strong>Въпроси към текста (отговори на турски):</strong></p>\n<ol type=\"1\">\n<li>Odada kaç sandalye var?</li>\n<li>Masada ne var?</li>\n<li>Odada televizyon var mı?</li>\n<li>Kalemler nerede?</li>\n</ol>\n<h3 id=\"упражнения-alıştırmalar-1\">Упражнения · Alıştırmalar</h3>\n<p><strong>Упр. 2.1 — Постави в множествено число.</strong> <em>(Çoğul\nyapın.)</em></p>\n<ol type=\"1\">\n<li>ev</li>\n<li>kitap</li>\n<li>öğretmen</li>\n<li>araba</li>\n<li>göz</li>\n<li>okul</li>\n<li>şehir</li>\n<li>çocuk</li>\n</ol>\n<p><strong>Упр. 2.2 — Постави местен падеж (-da/-de/-ta/-te).</strong>\n<em>(Bulunma hâli ekleyin (-da/-de/-ta/-te).)</em></p>\n<ol type=\"1\">\n<li>okul</li>\n<li>ev</li>\n<li>sınıf</li>\n<li>masa</li>\n<li>çanta</li>\n<li>İzmir</li>\n<li>sokak</li>\n<li>şehir</li>\n</ol>\n<p><strong>Упр. 2.3 — Попълни с <code>var</code> или\n<code>yok</code>.</strong> <em>(„var“ veya „yok“ ile\ntamamlayın.)</em></p>\n<ol type=\"1\">\n<li>Masada bir kitap ___ . (има)</li>\n<li>Odada televizyon ___ . (няма)</li>\n<li>Sınıfta öğrenciler ___ . (има)</li>\n<li>Evde su ___ . (няма)</li>\n</ol>\n<p><strong>Упр. 2.4 — Преведи на турски.</strong> <em>(Türkçeye\nçevirin.)</em></p>\n<ol type=\"1\">\n<li>Това е книга.</li>\n<li>Какво е онова?</li>\n<li>В стаята има две маси.</li>\n<li>В чантата няма молив.</li>\n<li>Тези къщи са стари.</li>\n</ol>\n<h3 id=\"допълнителни-упражнения-ek-alıştırmalar-1\">Допълнителни\nупражнения · Ek alıştırmalar</h3>\n<p><strong>Упр. 2.5 — Кое окончание: -da, -de, -ta или -te?</strong>\n<em>(Hangi ek: -da, -de, -ta, -te?)</em></p>\n<ol type=\"1\">\n<li>park</li>\n<li>bahçe</li>\n<li>dolap</li>\n<li>sokak</li>\n<li>otobüs</li>\n<li>hastane</li>\n<li>mutfak</li>\n<li>deniz</li>\n</ol>\n<p><strong>Упр. 2.6 — Отговори на въпроса с <code>var</code> или\n<code>yok</code>.</strong> <em>(Soruya „var“ veya „yok“ ile cevap\nverin.)</em></p>\n<ol type=\"1\">\n<li>Sınıfta öğretmen var mı? (да)</li>\n<li>Çantanda kitap var mı? (не)</li>\n<li>Evde su var mı? (да)</li>\n<li>Odada televizyon var mı? (не)</li>\n</ol>\n<p><strong>Упр. 2.7 — Постави прилагателното на правилното\nмясто.</strong> <em>(Sıfatı doğru yere koyun.)</em></p>\n<ol type=\"1\">\n<li>ev / büyük → …</li>\n<li>kitap / yeni → …</li>\n<li>şehir / güzel → …</li>\n<li>araba / eski → …</li>\n</ol>\n<p><strong>Упр. 2.8 — Опиши стаята си (5 изречения).</strong>\n<em>(Odanızı anlatın (beş cümle).)</em></p>\n<p>Използвай: <code>Odamda … var / yok</code>,\n<code>… büyük / küçük</code>, <code>… masada</code>.</p>\n<p><strong>Упр. 2.9 — Постави в множествено число и добави местен\nпадеж.</strong> <em>(Çoğul yapın ve bulunma hâli ekleyin.)</em></p>\n<p>Пример: ev → evler → evlerde</p>\n<ol type=\"1\">\n<li>okul</li>\n<li>kitap</li>\n<li>sokak</li>\n<li>bahçe</li>\n<li>şehir</li>\n<li>araba</li>\n<li>sınıf</li>\n<li>öğrenci</li>\n</ol>\n<p><strong>Упр. 2.10 — Свържи противоположните прилагателни.</strong>\n<em>(Zıt anlamlı sıfatları eşleştirin.)</em></p>\n<ol type=\"1\">\n<li>büyük</li>\n<li>yeni</li>\n<li>uzun</li>\n<li>ucuz</li>\n<li>sıcak</li>\n<li>temiz</li>\n<li>kolay</li>\n<li>açık</li>\n</ol>\n<p>а) kapalı б) küçük в) kısa г) eski д) pahalı е) soğuk ж) kirli з)\nzor</p>\n<p><strong>Упр. 2.11 — Направи изречения с <code>var</code> или\n<code>yok</code>.</strong> <em>(„var“ veya „yok“ ile cümle\nkurun.)</em></p>\n<p>Пример: masa / kitap (има) → Masada bir kitap var.</p>\n<ol type=\"1\">\n<li>oda / televizyon (няма)</li>\n<li>bahçe / ağaç (има)</li>\n<li>çanta / kalem (има)</li>\n<li>sınıf / öğrenci (няма)</li>\n<li>ev / bahçe (има)</li>\n<li>sokak / araba (няма)</li>\n</ol>\n<p><strong>Упр. 2.12 — Преведи изразите за притежание.</strong>\n<em>(Sahiplik ifadelerini çevirin.)</em></p>\n<ol type=\"1\">\n<li>Имам една кола.</li>\n<li>Имаш ли брат?</li>\n<li>Той няма пари.</li>\n<li>Имаме голяма къща.</li>\n<li>Имате ли време? (<code>zaman</code>)</li>\n<li>Те нямат деца. (<code>çocuk</code>)</li>\n</ol>\n<p><strong>Упр. 2.13 — Постави прилагателното на мястото му.</strong>\n<em>(Sıfatı doğru yere koyun.)</em></p>\n<ol type=\"1\">\n<li>ev / eski / bir</li>\n<li>kitap / yeni / iki</li>\n<li>kız / güzel / bir</li>\n<li>araba / pahalı / bu</li>\n<li>şehir / büyük / bir</li>\n<li>çay / sıcak / bir</li>\n</ol>\n<h3>Тематичен речник · Konu sözlüğü — Представяне: народност, професия, възраст · Tanıtma</h3><table><thead><tr><th>Türkçe</th><th>Български</th></tr></thead><tbody><tr><td>kendini tanıtmak</td><td>представям се</td></tr><tr><td>ad soyad</td><td>име и фамилия</td></tr><tr><td>takma ad</td><td>прякор</td></tr><tr><td>doğum yeri</td><td>месторождение</td></tr><tr><td>doğum tarihi</td><td>дата на раждане</td></tr><tr><td>uyruk</td><td>гражданство</td></tr><tr><td>vatandaş</td><td>гражданин</td></tr><tr><td>memleket</td><td>родно място</td></tr><tr><td>nereli?</td><td>откъде е?</td></tr><tr><td>Bulgaristanlı</td><td>от България</td></tr><tr><td>Türkiyeli</td><td>от Турция</td></tr><tr><td>Yunan</td><td>грък</td></tr><tr><td>Alman</td><td>германец</td></tr><tr><td>İngiliz</td><td>англичанин</td></tr><tr><td>Rus</td><td>руснак</td></tr><tr><td>Fransız</td><td>французин</td></tr><tr><td>İtalyan</td><td>италианец</td></tr><tr><td>Arap</td><td>арабин</td></tr><tr><td>yabancı</td><td>чужденец</td></tr><tr><td>göçmen</td><td>преселник</td></tr><tr><td>dil bilmek</td><td>знам език</td></tr><tr><td>ana dil</td><td>роден език</td></tr><tr><td>bekâr</td><td>неженен, ерген</td></tr><tr><td>evli</td><td>женен</td></tr><tr><td>dul</td><td>вдовец, разведен</td></tr><tr><td>yaş</td><td>възраст</td></tr><tr><td>yaşında</td><td>на … години</td></tr><tr><td>genç</td><td>млад</td></tr><tr><td>yaşlı</td><td>стар (за човек)</td></tr><tr><td>orta yaşlı</td><td>на средна възраст</td></tr><tr><td>çocuk</td><td>дете</td></tr><tr><td>yetişkin</td><td>възрастен, пълнолетен</td></tr><tr><td>emekli</td><td>пенсионер</td></tr><tr><td>öğrenci</td><td>ученик, студент</td></tr><tr><td>işsiz</td><td>безработен</td></tr><tr><td>çalışan</td><td>работещ</td></tr><tr><td>meslek sahibi</td><td>с професия</td></tr><tr><td>nerede çalışıyorsun?</td><td>къде работиш?</td></tr><tr><td>ne iş yapıyorsun?</td><td>с какво се занимаваш?</td></tr><tr><td>hangi okulda?</td><td>в кое училище?</td></tr><tr><td>kaç yaşındasın?</td><td>на колко години си?</td></tr><tr><td>nerede oturuyorsun?</td><td>къде живееш?</td></tr><tr><td>telefon numarası</td><td>телефонен номер</td></tr><tr><td>e-posta adresi</td><td>имейл адрес</td></tr><tr><td>imza atmak</td><td>подписвам се</td></tr></tbody></table><p><strong>Упр. 2.14 — Как е на турски?</strong> <em>(Türkçesi nedir?)</em></p><ol type=\"1\"><li>гражданство</li><li>роден език</li><li>неженен</li><li>вдовец</li><li>чужденец</li><li>възрастен (пълнолетен)</li><li>на средна възраст</li><li>месторождение</li><li>с какво се занимаваш?</li><li>имейл адрес</li></ol><h3>Тематичен речник · Konu sözlüğü — Професии · Meslekler</h3><table><thead><tr><th>Türkçe</th><th>Български</th></tr></thead><tbody><tr><td>iş</td><td>работа</td></tr><tr><td>işçi</td><td>работник</td></tr><tr><td>memur</td><td>чиновник, държавен служител</td></tr><tr><td>polis</td><td>полицай</td></tr><tr><td>çiftçi</td><td>земеделец</td></tr><tr><td>yazar</td><td>писател</td></tr><tr><td>ressam</td><td>художник</td></tr><tr><td>müzisyen</td><td>музикант</td></tr><tr><td>patron</td><td>шеф</td></tr><tr><td>iş insanı</td><td>бизнесмен</td></tr><tr><td>büro</td><td>бюро, офис</td></tr><tr><td>aşçı</td><td>готвач</td></tr></tbody></table><p><strong>Упр. 2.16 — Как е на турски?</strong> <em>(Türkçesi nedir?)</em></p><ol type=\"1\"><li>работник</li><li>чиновник</li><li>земеделец</li><li>художник</li><li>музикант</li><li>шеф</li></ol><h3>Тематичен речник · Konu sözlüğü — Местоимения и въпросителни думи · Zamirler ve soru kelimeleri</h3><table><thead><tr><th>Türkçe</th><th>Български</th></tr></thead><tbody><tr><td>ben</td><td>аз</td></tr><tr><td>sen</td><td>ти</td></tr><tr><td>biz</td><td>ние</td></tr><tr><td>siz</td><td>вие</td></tr><tr><td>onlar</td><td>те</td></tr><tr><td>benim</td><td>мой</td></tr><tr><td>senin</td><td>твой</td></tr><tr><td>onun</td><td>негов, неин</td></tr><tr><td>bizim</td><td>наш</td></tr><tr><td>sizin</td><td>ваш</td></tr><tr><td>onların</td><td>техен</td></tr><tr><td>bana</td><td>на мен</td></tr><tr><td>sana</td><td>на теб</td></tr><tr><td>ona</td><td>на него, на нея</td></tr><tr><td>bize</td><td>на нас</td></tr><tr><td>size</td><td>на вас</td></tr><tr><td>onlara</td><td>на тях</td></tr><tr><td>bunlar</td><td>тези</td></tr><tr><td>şunlar</td><td>онези (наблизо)</td></tr><tr><td>burada</td><td>тук</td></tr><tr><td>şurada</td><td>ето там</td></tr><tr><td>orada</td><td>там</td></tr><tr><td>burası</td><td>това място</td></tr><tr><td>orası</td><td>онова място</td></tr><tr><td>nasıl?</td><td>как?</td></tr><tr><td>neden?</td><td>защо?</td></tr><tr><td>niçin?</td><td>за какво?</td></tr><tr><td>ne zaman?</td><td>кога?</td></tr><tr><td>ne kadar?</td><td>колко? (за количество)</td></tr><tr><td>hangi?</td><td>кой, коя, кое? (избор)</td></tr><tr><td>hangisi?</td><td>кое от тях?</td></tr><tr><td>kimde?</td><td>у кого?</td></tr><tr><td>kimden?</td><td>от кого?</td></tr><tr><td>kime?</td><td>на кого?</td></tr></tbody></table><p><strong>Упр. 2.15 — Как е на турски?</strong> <em>(Türkçesi nedir?)</em></p><ol type=\"1\"><li>аз</li><li>наш</li><li>на мен</li><li>тези</li><li>защо?</li><li>кога?</li><li>кое от тях?</li><li>на кого?</li></ol><hr />\n<h2 id=\"урок-3-benim-kitabım-моята-книга\">УРОК 3 · Benim kitabım — Моята\nкнига</h2><figure class=\"illus\">\n<svg viewBox=\"0 0 400 190\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Семейно дърво\">\n<g stroke=\"var(--line)\" stroke-width=\"2\" fill=\"none\">\n<path d=\"M120 46 H280\"/><path d=\"M200 46 V78\"/><path d=\"M90 100 H310\"/>\n<path d=\"M90 100 V78\"/><path d=\"M200 100 V78\"/><path d=\"M310 100 V78\"/>\n</g>\n<g text-anchor=\"middle\">\n<g fill=\"var(--text-accent)\"><circle cx=\"120\" cy=\"34\" r=\"22\"/><circle cx=\"280\" cy=\"34\" r=\"22\"/></g>\n<g fill=\"#fff\" font-size=\"12\" font-weight=\"700\"><text x=\"120\" y=\"38\">anne</text><text x=\"280\" y=\"38\">baba</text></g>\n<g fill=\"#fff\" font-size=\"9\"><text x=\"120\" y=\"70\" fill=\"var(--text-muted)\">майка</text><text x=\"280\" y=\"70\" fill=\"var(--text-muted)\">баща</text></g>\n<g fill=\"var(--bad)\"><circle cx=\"90\" cy=\"126\" r=\"22\"/><circle cx=\"200\" cy=\"126\" r=\"22\"/><circle cx=\"310\" cy=\"126\" r=\"22\"/></g>\n<g fill=\"#fff\" font-size=\"11.5\" font-weight=\"700\"><text x=\"90\" y=\"130\">abla</text><text x=\"200\" y=\"130\">ben</text><text x=\"310\" y=\"130\">kardeş</text></g>\n<g font-size=\"9\" fill=\"var(--text-muted)\"><text x=\"90\" y=\"164\">по-голяма сестра</text><text x=\"200\" y=\"164\">аз</text><text x=\"310\" y=\"164\">по-малък брат/сестра</text></g>\n</g>\n</svg>\n<figcaption>Aile — семейството. Турският различава по-голям и по-малък брат/сестра.</figcaption></figure>\n<h3 id=\"речник-sözlük-2\">Речник · Sözlük</h3>\n<table>\n<thead>\n<tr class=\"header\">\n<th>Турски</th>\n<th>Български</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>anne</td>\n<td>майка</td>\n</tr>\n<tr class=\"even\">\n<td>baba</td>\n<td>баща</td>\n</tr>\n<tr class=\"odd\">\n<td>kardeş</td>\n<td>брат/сестра (по-малък)</td>\n</tr>\n<tr class=\"even\">\n<td>abi / ağabey</td>\n<td>по-голям брат</td>\n</tr>\n<tr class=\"odd\">\n<td>abla</td>\n<td>по-голяма сестра</td>\n</tr>\n<tr class=\"even\">\n<td>oğul</td>\n<td>син</td>\n</tr>\n<tr class=\"odd\">\n<td>kız</td>\n<td>дъщеря; момиче</td>\n</tr>\n<tr class=\"even\">\n<td>eş</td>\n<td>съпруг(а)</td>\n</tr>\n<tr class=\"odd\">\n<td>aile</td>\n<td>семейство</td>\n</tr>\n<tr class=\"even\">\n<td>arkadaş</td>\n<td>приятел</td>\n</tr>\n<tr class=\"odd\">\n<td>komşu</td>\n<td>съсед</td>\n</tr>\n<tr class=\"even\">\n<td>ad</td>\n<td>име</td>\n</tr>\n<tr class=\"odd\">\n<td>soyad</td>\n<td>фамилия</td>\n</tr>\n<tr class=\"even\">\n<td>iş</td>\n<td>работа</td>\n</tr>\n<tr class=\"odd\">\n<td>adres</td>\n<td>адрес</td>\n</tr>\n<tr class=\"even\">\n<td>telefon</td>\n<td>телефон</td>\n</tr>\n<tr class=\"odd\">\n<td>kimin</td>\n<td>чий</td>\n</tr>\n<tr class=\"even\">\n<td>kaç</td>\n<td>колко</td>\n</tr>\n<tr class=\"odd\">\n<td>kapı</td>\n<td>врата</td>\n</tr>\n<tr class=\"even\">\n<td>anahtar</td>\n<td>ключ</td>\n</tr>\n<tr class=\"odd\">\n<td>para</td>\n<td>пари</td>\n</tr>\n<tr class=\"even\">\n<td>oda</td>\n<td>стая</td>\n</tr>\n</tbody>\n</table>\n<h3 id=\"граматика-3.1-притежателни-афикси-iyelik-ekleri\">Граматика 3.1 —\nПритежателни афикси · İyelik ekleri</h3>\n<p>„Моята книга“ = <code>benim kitabım</code>. Местоимението може да се\nизпусне; окончанието е задължително.</p>\n<table>\n<colgroup>\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th>Лице</th>\n<th>След съгласна</th>\n<th>След гласна</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>benim (моят)</td>\n<td>-ım / -im / -um / -üm</td>\n<td>-m</td>\n</tr>\n<tr class=\"even\">\n<td>senin (твоят)</td>\n<td>-ın / -in / -un / -ün</td>\n<td>-n</td>\n</tr>\n<tr class=\"odd\">\n<td>onun (неговият)</td>\n<td>-ı / -i / -u / -ü</td>\n<td>-sı / -si / -su / -sü</td>\n</tr>\n<tr class=\"even\">\n<td>bizim (нашият)</td>\n<td>-ımız / -imiz / -umuz / -ümüz</td>\n<td>-mız / -miz / -muz / -müz</td>\n</tr>\n<tr class=\"odd\">\n<td>sizin (вашият)</td>\n<td>-ınız / -iniz / -unuz / -ünüz</td>\n<td>-nız / -niz / -nuz / -nüz</td>\n</tr>\n<tr class=\"even\">\n<td>onların (техният)</td>\n<td>-ları / -leri</td>\n<td>-ları / -leri</td>\n</tr>\n</tbody>\n</table>\n<p><strong>Пример с <code>ev</code> (къща):</strong></p>\n<table>\n<tbody>\n<tr class=\"odd\">\n<td>benim ev<strong>im</strong></td>\n<td>моята къща</td>\n</tr>\n<tr class=\"even\">\n<td>senin ev<strong>in</strong></td>\n<td>твоята къща</td>\n</tr>\n<tr class=\"odd\">\n<td>onun ev<strong>i</strong></td>\n<td>неговата къща</td>\n</tr>\n<tr class=\"even\">\n<td>bizim ev<strong>imiz</strong></td>\n<td>нашата къща</td>\n</tr>\n<tr class=\"odd\">\n<td>sizin ev<strong>iniz</strong></td>\n<td>вашата къща</td>\n</tr>\n<tr class=\"even\">\n<td>onların ev<strong>leri</strong></td>\n<td>тяхната къща</td>\n</tr>\n</tbody>\n</table>\n<p><strong>Пример с <code>araba</code> (кола, свършва на\nгласна):</strong>\n<code>arabam, araban, arabası, arabamız, arabanız, arabaları</code></p>\n<h3\nid=\"граматика-3.2-омекотяване-на-съгласната-ünsüz-yumuşaması\">Граматика\n3.2 — Омекотяване на съгласната · Ünsüz yumuşaması</h3>\n<p>Ако думата свършва на <strong>p, ç, t, k</strong> и след нея идва\nокончание, започващо с гласна, съгласната се смекчава:</p>\n<table>\n<tbody>\n<tr class=\"odd\">\n<td>p → b</td>\n<td>kitap → kita<strong>b</strong>ım</td>\n</tr>\n<tr class=\"even\">\n<td>ç → c</td>\n<td>ağaç → ağa<strong>c</strong>ım</td>\n</tr>\n<tr class=\"odd\">\n<td>t → d</td>\n<td>kanat → kana<strong>d</strong>ı</td>\n</tr>\n<tr class=\"even\">\n<td>k → ğ</td>\n<td>sokak → soka<strong>ğ</strong>ım</td>\n</tr>\n<tr class=\"odd\">\n<td>k → g (едносрични думи)</td>\n<td>renk → ren<strong>g</strong>i</td>\n</tr>\n</tbody>\n</table>\n<p><em>Изключения (не се смекчават):</em> <code>at → atı</code> (кон),\n<code>saat → saati</code>, <code>devlet → devleti</code>,\n<code>top → topu</code>.</p>\n<h3\nid=\"граматика-3.3-изафет-съществително-съществително-isim-tamlaması\">Граматика\n3.3 — Изафет: съществително + съществително · İsim tamlaması</h3>\n<p><strong>А) Определен изафет (притежание между две конкретни\nнеща):</strong> Първата дума получава <code>-ın/-in/-un/-ün</code>,\nвтората получава <code>-ı/-i/-u/-ü</code>.</p>\n<ul>\n<li>Ali’<strong>nin</strong> ev<strong>i</strong> — къщата на Али</li>\n<li>öğretmen<strong>in</strong> kitab<strong>ı</strong> — книгата на\nучителя</li>\n<li>kapı<strong>nın</strong> anahtar<strong>ı</strong> — ключът на\nвратата</li>\n</ul>\n<p><strong>Б) Неопределен изафет (вид, тип — като сложна дума):</strong>\nСамо втората дума получава окончание.</p>\n<ul>\n<li>ders kitab<strong>ı</strong> — учебник (книга за урок)</li>\n<li>Türk kahve<strong>si</strong> — турско кафе</li>\n<li>otobüs bilet<strong>i</strong> — билет за автобус</li>\n<li>diş fırça<strong>sı</strong> — четка за зъби</li>\n</ul>\n<h3 id=\"граматика-3.4-въпрос-kimin-чий-kimin-sorusu\">Граматика 3.4 —\nВъпрос „kimin?“ (чий?) · „Kimin?“ sorusu</h3>\n<ul>\n<li>Bu kimin kitabı? — Чия е тази книга?</li>\n<li>Bu benim kitabım. — Това е моята книга.</li>\n<li>Bu araba kimin? — Чия е тази кола?</li>\n<li>Ahmet’in. — На Ахмет.</li>\n</ul>\n<h3\nid=\"граматика-3.5-вмъкване-на-буква-пред-притежателния-афикс-iyelik-ekinden-önce-kaynaştırma\">Граматика\n3.5 — Вмъкване на буква пред притежателния афикс · İyelik ekinden önce\nkaynaştırma</h3>\n<p>Когато думата свършва на <strong>гласна</strong>, преди окончанието\nза 3 лице се вмъква <code>-s-</code>:</p>\n<div class=\"line-block\">araba | araba<strong>sı</strong> | неговата кола\n|<br />\nanne | anne<strong>si</strong> | неговата майка |<br />\nkapı | kapı<strong>sı</strong> | неговата врата |<br />\nütü | ütü<strong>sü</strong> | неговата ютия |</div>\n<p><strong>Изключение:</strong> <code>su</code> (вода) →\n<code>su**yu**</code>, <code>ne</code> → <code>ne**yi**</code>.</p>\n<h3\nid=\"граматика-3.6-кога-изафетът-е-определен-и-кога-не-belirtili-ve-belirtisiz-tamlama\">Граматика\n3.6 — Кога изафетът е определен и кога не · Belirtili ve belirtisiz\ntamlama</h3>\n<p>Сравни двете форми:</p>\n<table>\n<colgroup>\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th>Форма</th>\n<th>Пример</th>\n<th>Значение</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td><strong>Определен</strong> (двете думи с окончание)</td>\n<td>Türk’<strong>ün</strong> kahve<strong>si</strong></td>\n<td>кафето на турчина (на конкретния човек)</td>\n</tr>\n<tr class=\"even\">\n<td><strong>Неопределен</strong> (само втората)</td>\n<td>Türk kahve<strong>si</strong></td>\n<td>турско кафе (вид кафе)</td>\n</tr>\n</tbody>\n</table>\n<p>Още двойки:</p>\n<ul>\n<li>öğrenci<strong>nin</strong> kitab<strong>ı</strong> — книгата на\nученика ↔︎ öğrenci kitab<strong>ı</strong> — ученическа книга</li>\n<li>ev<strong>in</strong> kapı<strong>sı</strong> — вратата на къщата ↔︎\nev kapı<strong>sı</strong> — входна врата</li>\n<li>çocuğ<strong>un</strong> oda<strong>sı</strong> — стаята на детето ↔︎\nçocuk oda<strong>sı</strong> — детска стая</li>\n</ul>\n<p><strong>Правило:</strong> ако можеш да кажеш „на кого/на какво“ —\nопределен изафет. Ако е вид или предназначение — неопределен.</p>\n<h3\nid=\"граматика-3.7-верижен-изафет-zincirleme-isim-tamlaması\">Граматика\n3.7 — Верижен изафет · Zincirleme isim tamlaması</h3>\n<p>Изафетът може да се навърже:</p>\n<ul>\n<li>ev<strong>in</strong> kapı<strong>sın</strong>ın\nanahtar<strong>ı</strong> — ключът на вратата на къщата</li>\n<li>Türkiye’<strong>nin</strong> başkent<strong>i</strong> — столицата\nна Турция</li>\n<li>okul<strong>un</strong> müdür<strong>ün</strong>ün\noda<strong>sı</strong> — стаята на директора на училището</li>\n</ul>\n<p>Всяка нова брънка добавя <code>-nın/-nin</code> към предишната.</p>\n<h3 id=\"граматика-3.8-притежание-с-var-yok-sahiplik-var-yok\">Граматика\n3.8 — Притежание с <code>var / yok</code> · Sahiplik: var / yok</h3>\n<p>„Имам X“ = <strong>притежателят в родителен падеж + предметът с\nпритежателен афикс + var</strong></p>\n<div class=\"line-block\">Benim kitabım var. | Имам книга. |<br />\nSenin araban var mı? | Имаш ли кола? |<br />\nOnun kardeşi yok. | Той няма брат. |<br />\nBizim evimiz var. | Имаме къща. |<br />\nSizin çocuğunuz var mı? | Имате ли деца? |<br />\nOnların parası yok. | Те нямат пари. |</div>\n<p>Отрицание и въпрос: - Benim zamanım yok. — Нямам време. - Senin paran\nvar mı? — Имаш ли пари? - Hayır, yok. — Не, нямам.</p>\n<h3 id=\"защо-е-така-neden-böyle-2\">Защо е така · Neden böyle</h3>\n<p><strong>Защо притежанието се изразява два пъти?</strong>\n<code>benim kitabım</code> съдържа „мой“ два пъти — веднъж в\nместоимението, веднъж в окончанието. Това е като българското „моята моя\nкнига“ — излишно, затова местоимението обикновено се изпуска: просто\n<code>kitabım</code>. Оставя се само за наблягане:\n„<strong>моята</strong> книга, не твоята“.</p>\n<p><strong>Защо <code>kitap</code> става <code>kitabım</code>?</strong>\nКрайните <code>p, ç, t, k</code> са „твърди“ и между две гласни се\nсмекчават — езикът не обича да спира рязко насред дума. Затова\n<code>kitap + ım</code> → <code>kitabım</code>, <code>sokak + ım</code>\n→ <code>sokağım</code>. Същото явление има и в български: „нося“ →\n„ношка“ не звучи, затова казваме „носач“.</p>\n<p><strong>Защо в изафета и двете думи получават окончание?</strong>\nЗащото турският маркира и притежателя, и притежаваното:\n<code>oda-nın</code> казва „това е притежателят“, <code>kapı-sı</code>\nказва „това е притежаваното“. Така връзката е ясна дори ако думите се\nразделят от други думи в изречението.</p>\n<h3 id=\"текст-за-четене-и-превод-okuma-ve-çeviri-metni-1\">Текст за\nчетене и превод · Okuma ve çeviri metni</h3>\n<p><strong>Ailem — Моето семейство</strong></p>\n<blockquote>\n<p>Benim adım Emre. Ailem büyük değil. Annem, babam, bir ablam ve bir\nkardeşim var. Annemin adı Fatma, babamın adı Kemal. Annem öğretmen,\nbabam mühendis. Ablamın adı Zeynep. O doktor ve İstanbul’da çalışıyor.\nKardeşim küçük, o öğrenci. Bizim evimiz Ankara’da. Evimiz büyük ve\nbahçemiz var. Bir de kedimiz var, adı Pamuk.</p>\n</blockquote>\n<p><em>Нови думи:</em> <code>çalışıyor</code> — работи;\n<code>bahçe</code> — градина; <code>bir de</code> — освен това;\n<code>kedi</code> — котка; <code>Pamuk</code> — Памук (име,\n„памук“).</p>\n<p><strong>Въпроси:</strong></p>\n<ol type=\"1\">\n<li>Emre’nin ailesi büyük mü?</li>\n<li>Annesinin adı ne?</li>\n<li>Ablası nerede çalışıyor?</li>\n<li>Onların kedisi var mı?</li>\n</ol>\n<h3 id=\"упражнения-alıştırmalar-2\">Упражнения · Alıştırmalar</h3>\n<p><strong>Упр. 3.1 — Постави притежателен афикс за 1 л. ед.ч.\n(benim).</strong> <em>(Birinci tekil kişi iyelik ekini koyun\n(benim).)</em></p>\n<ol type=\"1\">\n<li>ev</li>\n<li>kitap</li>\n<li>araba</li>\n<li>anne</li>\n<li>okul</li>\n<li>göz</li>\n<li>arkadaş</li>\n<li>sokak</li>\n</ol>\n<p><strong>Упр. 3.2 — Постави правилното окончание.</strong> <em>(Doğru\neki koyun.)</em></p>\n<ol type=\"1\">\n<li>senin ev___</li>\n<li>onun araba___</li>\n<li>bizim okul___</li>\n<li>sizin kitap___</li>\n<li>onların ev___</li>\n<li>benim anne___</li>\n</ol>\n<p><strong>Упр. 3.3 — Направи изафет.</strong> <em>(İsim tamlaması\nkurun.)</em></p>\n<ol type=\"1\">\n<li>Ali + ev</li>\n<li>öğretmen + kitap</li>\n<li>Türk + kahve</li>\n<li>ders + kitap</li>\n<li>oda + kapı</li>\n<li>okul + bahçe</li>\n</ol>\n<p><strong>Упр. 3.4 — Преведи на турски.</strong> <em>(Türkçeye\nçevirin.)</em></p>\n<ol type=\"1\">\n<li>Моята майка е учителка.</li>\n<li>Чия е тази книга?</li>\n<li>Това е колата на Ахмет.</li>\n<li>Нашата къща е в София.</li>\n<li>Имам един брат. (букв.: моят брат има)</li>\n</ol>\n<h3 id=\"допълнителни-упражнения-ek-alıştırmalar-2\">Допълнителни\nупражнения · Ek alıştırmalar</h3>\n<p><strong>Упр. 3.5 — Постави притежателния афикс за\n<code>onun</code>.</strong> <em>(„onun“ için iyelik ekini\nkoyun.)</em></p>\n<ol type=\"1\">\n<li>ev</li>\n<li>araba</li>\n<li>kitap</li>\n<li>anne</li>\n<li>okul</li>\n<li>arkadaş</li>\n</ol>\n<p><strong>Упр. 3.6 — Преведи изафетите.</strong> <em>(İsim\ntamlamalarını çevirin.)</em></p>\n<ol type=\"1\">\n<li>вратата на стаята</li>\n<li>учебник</li>\n<li>турско кафе</li>\n<li>колата на баща ми</li>\n<li>името на учителката</li>\n</ol>\n<p><strong>Упр. 3.7 — Отговори на въпроса „Kimin?“</strong>\n<em>(„Kimin?“ sorusuna cevap verin.)</em></p>\n<ol type=\"1\">\n<li>Bu kimin kitabı? (мой)</li>\n<li>Bu kimin arabası? (на Ахмет)</li>\n<li>Bunlar kimin defterleri? (наши)</li>\n<li>O kimin evi? (техен)</li>\n</ol>\n<p><strong>Упр. 3.8 — Разкажи за семейството си (5 изречения).</strong>\n<em>(Ailenizi anlatın (beş cümle).)</em></p>\n<p>Използвай: <code>Annem …</code>, <code>Babam …</code>,\n<code>Bir kardeşim var</code>, <code>Bizim evimiz …</code>.</p>\n<p><strong>Упр. 3.9 — Постави притежателния афикс за всички\nлица.</strong> <em>(Bütün kişiler için iyelik ekini koyun.)</em></p>\n<p>Пример: ev → evim, evin, evi, evimiz, eviniz, evleri</p>\n<ol type=\"1\">\n<li>kitap</li>\n<li>araba</li>\n<li>okul</li>\n<li>anne</li>\n<li>arkadaş</li>\n<li>göz</li>\n</ol>\n<p><strong>Упр. 3.10 — Определен или неопределен изафет?\nПреведи.</strong> <em>(Belirtili mi, belirtisiz mi tamlama?\nÇevirin.)</em></p>\n<ol type=\"1\">\n<li>вратата на къщата</li>\n<li>входна врата</li>\n<li>детска стая</li>\n<li>стаята на детето</li>\n<li>турско кафе</li>\n<li>кафето на Ахмет</li>\n<li>учебник</li>\n<li>книгата на учителя</li>\n</ol>\n<p><strong>Упр. 3.11 — Направи верижен изафет.</strong> <em>(Zincirleme\nisim tamlaması kurun.)</em></p>\n<ol type=\"1\">\n<li>ev + kapı + anahtar</li>\n<li>Türkiye + başkent</li>\n<li>okul + bahçe + kapı</li>\n<li>öğretmen + oda + pencere</li>\n</ol>\n<p><strong>Упр. 3.12 — Преведи с „имам / нямам“.</strong> <em>(„var /\nyok“ ile çevirin.)</em></p>\n<ol type=\"1\">\n<li>Имам две сестри.</li>\n<li>Нямам време.</li>\n<li>Имаш ли кола?</li>\n<li>Той има голяма къща.</li>\n<li>Нямаме пари.</li>\n<li>Имате ли деца?</li>\n<li>Те имат котка.</li>\n<li>Нямам брат.</li>\n</ol>\n<p><strong>Упр. 3.13 — Попълни с правилното окончание.</strong>\n<em>(Doğru ekle tamamlayın.)</em></p>\n<ol type=\"1\">\n<li>Ali___ arabası çok yeni.</li>\n<li>Oda___ kapısı açık.</li>\n<li>Benim anne___ öğretmen.</li>\n<li>Türkiye___ başkenti Ankara.</li>\n<li>Onun kardeş___ öğrenci.</li>\n<li>Bizim ev___ Sofya’da.</li>\n</ol>\n<h3>Тематичен речник · Konu sözlüğü — Семейство и роднини · Aile ve akrabalar</h3><table><thead><tr><th>Türkçe</th><th>Български</th></tr></thead><tbody><tr><td>akrabalık</td><td>родство</td></tr><tr><td>amca</td><td>чичо (брат на бащата)</td></tr><tr><td>dayı</td><td>вуйчо (брат на майката)</td></tr><tr><td>hala</td><td>леля (сестра на бащата)</td></tr><tr><td>teyze</td><td>леля (сестра на майката)</td></tr><tr><td>yeğen</td><td>племенник</td></tr><tr><td>kuzen</td><td>братовчед</td></tr><tr><td>kayınpeder</td><td>свекър, тъст</td></tr><tr><td>kaynana</td><td>свекърва, тъща</td></tr><tr><td>gelin</td><td>снаха; булка</td></tr><tr><td>damat</td><td>зет; младоженец</td></tr><tr><td>bacanak</td><td>баджанак</td></tr><tr><td>baldız</td><td>балдъза</td></tr><tr><td>kayınbirader</td><td>шурей, девер</td></tr><tr><td>üvey</td><td>доведен, пастрок</td></tr><tr><td>ikiz</td><td>близнак</td></tr><tr><td>tek çocuk</td><td>единствено дете</td></tr><tr><td>büyük aile</td><td>голямо семейство</td></tr><tr><td>çekirdek aile</td><td>семейство от родители и деца</td></tr><tr><td>soy</td><td>род, потекло</td></tr><tr><td>nesil</td><td>поколение</td></tr><tr><td>aile ağacı</td><td>родословно дърво</td></tr><tr><td>evlat</td><td>чедо, син или дъщеря</td></tr><tr><td>bebek</td><td>бебе</td></tr><tr><td>hamile</td><td>бременна</td></tr><tr><td>doğum</td><td>раждане</td></tr><tr><td>vaftiz</td><td>кръщене</td></tr><tr><td>sünnet</td><td>обрязване (обичай)</td></tr><tr><td>nişanlı</td><td>годеник</td></tr><tr><td>düğün</td><td>сватба</td></tr><tr><td>evlenmek</td><td>женя се</td></tr><tr><td>boşanmak</td><td>развеждам се</td></tr><tr><td>dul kalmak</td><td>овдовявам</td></tr><tr><td>cenaze</td><td>погребение</td></tr><tr><td>taziye</td><td>съболезнование</td></tr><tr><td>aile toplantısı</td><td>семейна среща</td></tr><tr><td>misafir</td><td>гост</td></tr><tr><td>misafirperver</td><td>гостоприемен</td></tr><tr><td>ev sahibi</td><td>домакин</td></tr><tr><td>sofra</td><td>трапеза</td></tr><tr><td>aile bağı</td><td>семейна връзка</td></tr><tr><td>birlikte yaşamak</td><td>живеем заедно</td></tr><tr><td>bakmak</td><td>гледам, грижа се за</td></tr><tr><td>büyütmek</td><td>отглеждам</td></tr><tr><td>saygı göstermek</td><td>проявявам уважение</td></tr></tbody></table><p><strong>Упр. 3.14 — Как е на турски?</strong> <em>(Türkçesi nedir?)</em></p><ol type=\"1\"><li>чичо</li><li>вуйчо</li><li>леля (по майка)</li><li>племенник</li><li>братовчед</li><li>свекърва</li><li>снаха</li><li>зет</li><li>родословно дърво</li><li>гостоприемен</li></ol><h3>Тематичен речник · Konu sözlüğü — Още за семейството · Aile (devam)</h3><table><thead><tr><th>Türkçe</th><th>Български</th></tr></thead><tbody><tr><td>ebeveyn</td><td>родители</td></tr><tr><td>erkek</td><td>мъж, момче</td></tr><tr><td>kız kardeş</td><td>сестра</td></tr><tr><td>erkek kardeş</td><td>брат</td></tr><tr><td>ağabey</td><td>батко, по-голям брат</td></tr><tr><td>abi</td><td>батко (разговорно)</td></tr><tr><td>babaanne</td><td>баба по бащина линия</td></tr><tr><td>anneanne</td><td>баба по майчина линия</td></tr><tr><td>büyükbaba</td><td>дядо</td></tr><tr><td>koca</td><td>мъж, съпруг</td></tr><tr><td>eş</td><td>съпруг, съпруга</td></tr><tr><td>oğul</td><td>син</td></tr><tr><td>abla</td><td>кака, по-голяма сестра</td></tr><tr><td>kardeş</td><td>брат или сестра</td></tr></tbody></table><p><strong>Упр. 3.15 — Как е на турски?</strong> <em>(Türkçesi nedir?)</em></p><ol type=\"1\"><li>родители</li><li>сестра</li><li>батко</li><li>баба по майчина линия</li><li>съпруг</li><li>син</li></ol><hr />\n<h2 id=\"урок-4-падежи-okula-gidiyorum\">УРОК 4 · Падежи — Okula\ngidiyorum</h2><figure class=\"illus\">\n<svg viewBox=\"0 0 400 230\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Падежите около къщата\">\n<path d=\"M200 60 L262 105 L262 172 L138 172 L138 105 Z\" fill=\"var(--sel)\" stroke=\"var(--text-accent)\" stroke-width=\"2\"/>\n<path d=\"M200 60 L262 105 L138 105 Z\" fill=\"var(--text-accent)\" opacity=\".15\"/>\n<rect x=\"186\" y=\"136\" width=\"28\" height=\"36\" fill=\"var(--text-accent)\" opacity=\".55\"/>\n<text x=\"200\" y=\"126\" text-anchor=\"middle\" font-size=\"17\" font-weight=\"700\" fill=\"var(--text)\">ev</text>\n<text x=\"200\" y=\"196\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--text-muted)\">къща</text>\n<g stroke=\"var(--accent)\" stroke-width=\"2\" fill=\"none\" marker-end=\"url(#ah)\">\n<path d=\"M62 100 L126 118\"/><path d=\"M338 100 L274 118\"/>\n</g>\n<defs><marker id=\"ah\" markerWidth=\"8\" markerHeight=\"8\" refX=\"7\" refY=\"4\" orient=\"auto\">\n<path d=\"M0 0 L8 4 L0 8 z\" fill=\"var(--accent)\"/></marker></defs>\n<g font-size=\"13\" font-weight=\"600\" fill=\"var(--text)\">\n<text x=\"10\" y=\"86\">ev<tspan fill=\"var(--bad)\">e</tspan></text>\n<text x=\"10\" y=\"122\" font-size=\"10\" font-weight=\"400\" fill=\"var(--text-muted)\">към къщата · nereye?</text>\n<text x=\"300\" y=\"86\">ev<tspan fill=\"var(--bad)\">den</tspan></text>\n<text x=\"300\" y=\"122\" font-size=\"10\" font-weight=\"400\" fill=\"var(--text-muted)\">от къщата · nereden?</text>\n<text x=\"200\" y=\"42\" text-anchor=\"middle\">ev<tspan fill=\"var(--bad)\">de</tspan>\n<tspan font-size=\"10\" font-weight=\"400\" fill=\"var(--text-muted)\"> — в къщата · nerede?</tspan></text>\n<text x=\"200\" y=\"218\" text-anchor=\"middle\">ev<tspan fill=\"var(--bad)\">i</tspan>\n<tspan font-size=\"10\" font-weight=\"400\" fill=\"var(--text-muted)\"> — къщата (определен обект)</tspan></text>\n</g>\n</svg>\n<figcaption>Петте основни форми на съществителното.</figcaption></figure>\n<h3 id=\"речник-sözlük-3\">Речник · Sözlük</h3>\n<table>\n<thead>\n<tr class=\"header\">\n<th>Турски</th>\n<th>Български</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>gitmek</td>\n<td>отивам</td>\n</tr>\n<tr class=\"even\">\n<td>gelmek</td>\n<td>идвам</td>\n</tr>\n<tr class=\"odd\">\n<td>bakmak</td>\n<td>гледам</td>\n</tr>\n<tr class=\"even\">\n<td>almak</td>\n<td>вземам, купувам</td>\n</tr>\n<tr class=\"odd\">\n<td>vermek</td>\n<td>давам</td>\n</tr>\n<tr class=\"even\">\n<td>görmek</td>\n<td>виждам</td>\n</tr>\n<tr class=\"odd\">\n<td>sevmek</td>\n<td>обичам</td>\n</tr>\n<tr class=\"even\">\n<td>istemek</td>\n<td>искам</td>\n</tr>\n<tr class=\"odd\">\n<td>pazar</td>\n<td>пазар</td>\n</tr>\n<tr class=\"even\">\n<td>market</td>\n<td>магазин</td>\n</tr>\n<tr class=\"odd\">\n<td>hastane</td>\n<td>болница</td>\n</tr>\n<tr class=\"even\">\n<td>lokanta / restoran</td>\n<td>ресторант</td>\n</tr>\n<tr class=\"odd\">\n<td>kütüphane</td>\n<td>библиотека</td>\n</tr>\n<tr class=\"even\">\n<td>sinema</td>\n<td>кино</td>\n</tr>\n<tr class=\"odd\">\n<td>iş yeri</td>\n<td>месторабота</td>\n</tr>\n<tr class=\"even\">\n<td>otobüs</td>\n<td>автобус</td>\n</tr>\n<tr class=\"odd\">\n<td>tren</td>\n<td>влак</td>\n</tr>\n<tr class=\"even\">\n<td>uçak</td>\n<td>самолет</td>\n</tr>\n<tr class=\"odd\">\n<td>yol</td>\n<td>път</td>\n</tr>\n<tr class=\"even\">\n<td>nereye</td>\n<td>накъде</td>\n</tr>\n<tr class=\"odd\">\n<td>nereden</td>\n<td>откъде</td>\n</tr>\n<tr class=\"even\">\n<td>şimdi</td>\n<td>сега</td>\n</tr>\n<tr class=\"odd\">\n<td>bugün</td>\n<td>днес</td>\n</tr>\n<tr class=\"even\">\n<td>yarın</td>\n<td>утре</td>\n</tr>\n<tr class=\"odd\">\n<td>dün</td>\n<td>вчера</td>\n</tr>\n</tbody>\n</table>\n<h3 id=\"граматика-4.1-дателен-падеж--a--e-към-на-yönelme-hâli\">Граматика\n4.1 — Дателен падеж: -a / -e (към, на) · Yönelme hâli</h3>\n<p>Въпрос: <strong>nereye?</strong> (накъде?), <strong>kime?</strong>\n(на кого?)</p>\n<table>\n<thead>\n<tr class=\"header\">\n<th>Последна гласна</th>\n<th>Окончание</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>a, ı, o, u</td>\n<td><strong>-a</strong></td>\n</tr>\n<tr class=\"even\">\n<td>e, i, ö, ü</td>\n<td><strong>-e</strong></td>\n</tr>\n</tbody>\n</table>\n<p>След гласна се вмъква <strong>-y-</strong>:\n<code>okul → okula</code>, но <code>araba → arabaya</code>.</p>\n<ul>\n<li>Okul<strong>a</strong> gidiyorum. — Отивам на училище.</li>\n<li>Ev<strong>e</strong> geliyorum. — Идвам вкъщи.</li>\n<li>İstanbul’<strong>a</strong> gidiyoruz. — Отиваме в Истанбул.</li>\n<li>Anneme para verdim. — Дадох пари на майка ми.</li>\n</ul>\n<h3 id=\"граматика-4.2-изходен-падеж--dan--den-от-ayrılma-hâli\">Граматика\n4.2 — Изходен падеж: -dan / -den (от) · Ayrılma hâli</h3>\n<p>Въпрос: <strong>nereden?</strong> (откъде?)</p>\n<p>След <code>ç, f, h, k, p, s, ş, t</code> → <strong>-tan /\n-ten</strong>.</p>\n<ul>\n<li>Okul<strong>dan</strong> geliyorum. — Идвам от училище.</li>\n<li>Ev<strong>den</strong> çıktım. — Излязох от къщи.</li>\n<li>Sofya’<strong>dan</strong> geldim. — Дойдох от София.</li>\n<li>Market<strong>ten</strong> ekmek aldım. — Купих хляб от\nмагазина.</li>\n</ul>\n<h3\nid=\"граматика-4.3-винителен-падеж--ı--i--u--ü-belirtme-hâli\">Граматика\n4.3 — Винителен падеж: -ı / -i / -u / -ü · Belirtme hâli</h3>\n<p>Използва се само за <strong>определен, конкретен</strong> обект. След\nгласна се вмъква <strong>-y-</strong>.</p>\n<ul>\n<li>Kitap okuyorum. — Чета книга. <em>(неопределено — без\nокончание)</em></li>\n<li>Kitab<strong>ı</strong> okuyorum. — Чета книгата. <em>(конкретна\nкнига)</em></li>\n<li>Ali’<strong>yi</strong> gördüm. — Видях Али.</li>\n<li>Araba<strong>yı</strong> aldım. — Купих колата.</li>\n<li>Sen<strong>i</strong> seviyorum. — Обичам те.</li>\n</ul>\n<p><strong>Собствените имена и личните местоимения винаги вземат\nокончание:</strong>\n<code>beni, seni, onu, bizi, sizi, onları</code>.</p>\n<h3\nid=\"граматика-4.4-обобщение-на-падежите-думата-ev-hâl-eklerinin-özeti\">Граматика\n4.4 — Обобщение на падежите (думата <code>ev</code>) · Hâl eklerinin\nözeti</h3>\n<table>\n<thead>\n<tr class=\"header\">\n<th>Падеж</th>\n<th>Форма</th>\n<th>Въпрос</th>\n<th>Превод</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>основна</td>\n<td>ev</td>\n<td>ne?</td>\n<td>къща</td>\n</tr>\n<tr class=\"even\">\n<td>винителен</td>\n<td>evi</td>\n<td>neyi?</td>\n<td>къщата (обект)</td>\n</tr>\n<tr class=\"odd\">\n<td>дателен</td>\n<td>eve</td>\n<td>nereye?</td>\n<td>към къщата</td>\n</tr>\n<tr class=\"even\">\n<td>местен</td>\n<td>evde</td>\n<td>nerede?</td>\n<td>в къщата</td>\n</tr>\n<tr class=\"odd\">\n<td>изходен</td>\n<td>evden</td>\n<td>nereden?</td>\n<td>от къщата</td>\n</tr>\n</tbody>\n</table>\n<p>С притежателен афикс се вмъква <strong>-n-</strong>:\n<code>evim → evim**i**</code>, <code>evine</code>, <code>evinde</code>,\n<code>evinden</code>; <code>arabası → arabası**n**a</code>,\n<code>arabası**n**da</code>, <code>arabası**n**dan</code>.</p>\n<h3\nid=\"граматика-4.5-кога-винителният-падеж-се-слага-и-кога-не-belirtme-hâli-ne-zaman-kullanılır\">Граматика\n4.5 — Кога винителният падеж се слага и кога не · Belirtme hâli ne zaman\nkullanılır</h3>\n<p>Това е една от най-честите грешки. Правилото:</p>\n<p><strong>СЛАГА СЕ</strong> окончание <code>-ı/-i/-u/-ü</code>, когато\nобектът е <strong>определен</strong>:</p>\n<ul>\n<li>Kitab<strong>ı</strong> okudum. — Прочетох книгата. <em>(конкретна\nкнига)</em></li>\n<li>Ali’<strong>yi</strong> gördüm. — Видях Али. <em>(собствено\nиме)</em></li>\n<li>Sen<strong>i</strong> bekliyorum. — Чакам те.\n<em>(местоимение)</em></li>\n<li>Bu film<strong>i</strong> izledim. — Гледах този филм.\n<em>(bu/şu/o)</em></li>\n<li>Araba<strong>mı</strong> sattım. — Продадох си колата. <em>(с\nпритежателен афикс)</em></li>\n</ul>\n<p><strong>НЕ СЕ СЛАГА</strong>, когато обектът е неопределен или\nобщ:</p>\n<ul>\n<li>Kitap okudum. — Четох книга (каквато и да е).</li>\n<li>Su içiyorum. — Пия вода.</li>\n<li>Her gün ekmek alırım. — Всеки ден купувам хляб.</li>\n</ul>\n<p><strong>Сравни:</strong></p>\n<table>\n<thead>\n<tr class=\"header\">\n<th>Без окончание</th>\n<th>С окончание</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Film izliyorum. — Гледам филм.</td>\n<td>Filmi izliyorum. — Гледам филма.</td>\n</tr>\n<tr class=\"even\">\n<td>Kahve içtim. — Пих кафе.</td>\n<td>Kahveyi içtim. — Изпих кафето.</td>\n</tr>\n<tr class=\"odd\">\n<td>Araba aldım. — Купих кола.</td>\n<td>Arabayı aldım. — Купих колата.</td>\n</tr>\n</tbody>\n</table>\n<h3\nid=\"граматика-4.6-глаголи-които-изискват-определен-падеж-hâl-eki-isteyen-fiiller\">Граматика\n4.6 — Глаголи, които изискват определен падеж · Hâl eki isteyen\nfiiller</h3>\n<p>Много турски глаголи „управляват“ падеж, различен от българския. Тези\nтрябва да се запомнят:</p>\n<p><strong>С дателен падеж (-a/-e):</strong></p>\n<div class=\"line-block\">başlamak | започвам (нещо) | Derse başladık.\n|<br />\nbinmek | качвам се | Otobüse bindim. |<br />\ngitmek | отивам | Okula gidiyorum. |<br />\nbakmak | гледам | Pencereye bakıyorum. |<br />\ninanmak | вярвам | Sana inanıyorum. |<br />\nsormak | питам | Öğretmene sordum. |<br />\nsöylemek | казвам (на) | Bana söyledi. |<br />\nyardım etmek | помагам | Ona yardım ettim. |</div>\n<p><strong>С изходен падеж (-dan/-den):</strong></p>\n<div class=\"line-block\">inmek | слизам | Otobüsten indim. |<br />\nkorkmak | страхувам се | Köpekten korkuyorum. |<br />\nhoşlanmak | харесвам | Bu müzikten hoşlanıyorum. |<br />\nnefret etmek | мразя | Yalandan nefret ederim. |<br />\nçıkmak | излизам | Evden çıktım. |</div>\n<p><strong>С винителен падеж:</strong></p>\n<div class=\"line-block\">sevmek | обичам | Seni seviyorum. |<br />\nbeklemek | чакам | Otobüsü bekliyorum. |<br />\naramak | търся / звъня | Seni aradım. |</div>\n<h3\nid=\"граматика-4.7-двойни-падежи-в-едно-изречение-bir-cümlede-birkaç-hâl-eki\">Граматика\n4.7 — Двойни падежи в едно изречение · Bir cümlede birkaç hâl eki</h3>\n<p>Едно изречение може да съдържа няколко падежа наведнъж:</p>\n<ul>\n<li><p><strong>Ben</strong> okul<strong>dan</strong>\nev<strong>e</strong> kitap<strong>ları</strong> götürüyorum. — Нося\nкнигите от училище вкъщи.</p></li>\n<li><p><strong>Annem</strong> market<strong>ten</strong>\nban<strong>a</strong> çikolata al<strong>dı</strong>. — Мама ми купи\nшоколад от магазина.</p></li>\n<li><p><strong>Öğretmen</strong> öğrenci<strong>ye</strong>\nsoru<strong>yu</strong> sordu. — Учителят зададе въпроса на\nученика.</p></li>\n</ul>\n<p>Ред на думите (обичаен, но гъвкав): <strong>подлог → време → място →\nадресат → обект → глагол</strong></p>\n<h3 id=\"защо-е-така-neden-böyle-3\">Защо е така · Neden böyle</h3>\n<p><strong>Защо понякога има винителен падеж, а понякога не?</strong>\nЗащото турският няма определителен член („книгата“), но му трябва начин\nда покаже дали става дума за конкретно нещо. Тази работа я върши\nвинителният падеж:</p>\n<ul>\n<li><code>Kitap okuyorum</code> = „чета някаква книга“ (≈ англ. <em>a\nbook</em>)</li>\n<li><code>Kitabı okuyorum</code> = „чета книгата“ (≈ англ. <em>the\nbook</em>)</li>\n</ul>\n<p>Тоест окончанието <code>-ı</code> тук работи като нашето „-та“.</p>\n<p><strong>Защо <code>otobüse binmek</code>, а не\n<code>otobüsü binmek</code>?</strong> Защото турският мисли за качването\nкато движение <strong>към</strong> нещо — „качвам се към автобуса“.\nЗатова е дателен падеж. По същата логика слизането е движение\n<strong>от</strong> нещо: <code>otobüsten inmek</code>. Тези глаголи\nтрябва да се учат заедно с падежа си, като в немския.</p>\n<p><strong>Защо собствените имена се пишат с апостроф?</strong>\n<code>Ali'ye</code>, <code>İstanbul'da</code> — апострофът показва къде\nсвършва името и започва окончанието, за да не се чете като част от\nимето. При нарицателните имена не се слага апостроф.</p>\n<h3 id=\"текст-за-четене-и-превод-okuma-ve-çeviri-metni-2\">Текст за\nчетене и превод · Okuma ve çeviri metni</h3>\n<p><strong>Bir gün — Един ден</strong></p>\n<blockquote>\n<p>Sabah saat yedide evden çıkıyorum. Otobüs durağına yürüyorum. Otobüs\nbeni okula götürüyor. Okulda arkadaşlarımı görüyorum. Öğleden sonra\nkütüphaneye gidiyorum ve orada kitap okuyorum. Akşam markete uğruyorum,\nekmek ve süt alıyorum. Sonra eve dönüyorum. Evde annemle çay içiyoruz ve\nkonuşuyoruz.</p>\n</blockquote>\n<p><em>Нови думи:</em> <code>sabah</code> — сутрин; <code>durak</code> —\nспирка; <code>yürümek</code> — вървя; <code>götürmek</code> — водя,\nоткарвам; <code>öğleden sonra</code> — следобед; <code>uğramak</code> —\nотбивам се; <code>ekmek</code> — хляб; <code>süt</code> — мляко;\n<code>dönmek</code> — връщам се; <code>içmek</code> — пия;\n<code>konuşmak</code> — говоря.</p>\n<p><strong>Въпроси:</strong></p>\n<ol type=\"1\">\n<li>Saat kaçta evden çıkıyor?</li>\n<li>Nereye yürüyor?</li>\n<li>Marketten ne alıyor?</li>\n<li>Evde ne yapıyorlar?</li>\n</ol>\n<h3 id=\"упражнения-alıştırmalar-3\">Упражнения · Alıştırmalar</h3>\n<p><strong>Упр. 4.1 — Постави дателен падеж (-a/-e).</strong>\n<em>(Yönelme hâli ekleyin (-a/-e).)</em></p>\n<ol type=\"1\">\n<li>okul</li>\n<li>ev</li>\n<li>İstanbul</li>\n<li>sinema</li>\n<li>araba</li>\n<li>iş</li>\n</ol>\n<p><strong>Упр. 4.2 — Постави изходен падеж\n(-dan/-den/-tan/-ten).</strong> <em>(Ayrılma hâli ekleyin\n(-dan/-den/-tan/-ten).)</em></p>\n<ol type=\"1\">\n<li>ev</li>\n<li>okul</li>\n<li>market</li>\n<li>Sofya</li>\n<li>sınıf</li>\n<li>şehir</li>\n</ol>\n<p><strong>Упр. 4.3 — Постави винителен падеж.</strong> <em>(Belirtme\nhâli ekleyin.)</em></p>\n<ol type=\"1\">\n<li>kitap</li>\n<li>araba</li>\n<li>ev</li>\n<li>Ali</li>\n<li>su</li>\n<li>öğretmen</li>\n</ol>\n<p><strong>Упр. 4.4 — Попълни правилния падеж.</strong> <em>(Doğru hâl\nekini yazın.)</em></p>\n<ol type=\"1\">\n<li>Ben okul___ gidiyorum. (към)</li>\n<li>O ev___ geliyor. (от)</li>\n<li>Biz sınıf___ oturuyoruz. (в)</li>\n<li>Kitab___ okuyorum. (определен обект)</li>\n<li>Anne___ telefon ediyorum. (на)</li>\n</ol>\n<p><strong>Упр. 4.5 — Преведи на турски.</strong> <em>(Türkçeye\nçevirin.)</em></p>\n<ol type=\"1\">\n<li>Отивам в Истанбул.</li>\n<li>Идвам от училище.</li>\n<li>Виждам Али.</li>\n<li>Той е вкъщи.</li>\n<li>Купувам хляб от магазина.</li>\n</ol>\n<h3 id=\"допълнителни-упражнения-ek-alıştırmalar-3\">Допълнителни\nупражнения · Ek alıştırmalar</h3>\n<p><strong>Упр. 4.6 — Постави правилния падеж.</strong> <em>(Doğru hâl\nekini koyun.)</em></p>\n<ol type=\"1\">\n<li>Her sabah okul___ gidiyorum.</li>\n<li>Akşam iş___ dönüyorum.</li>\n<li>Kitab___ masaya koydum.</li>\n<li>Ali___ bir mektup yazdım.</li>\n<li>İstanbul___ çok seviyorum.</li>\n<li>Market___ süt aldım.</li>\n</ol>\n<p><strong>Упр. 4.7 — Отговори на въпроса.</strong> <em>(Soruya cevap\nverin.)</em></p>\n<ol type=\"1\">\n<li>Nereye gidiyorsun? (на училище)</li>\n<li>Nereden geliyorsun? (от вкъщи)</li>\n<li>Nerede oturuyorsun? (в София)</li>\n<li>Kimi bekliyorsun? (Айше)</li>\n</ol>\n<p><strong>Упр. 4.8 — Nereye, nerede или nereden?</strong> <em>(Nereye,\nnerede, nereden?)</em></p>\n<ol type=\"1\">\n<li>___ oturuyorsun? — Sofya’da.</li>\n<li>___ gidiyorsun? — Okula.</li>\n<li>___ geliyorsun? — Marketten.</li>\n<li>___ çalışıyorsun? — Bir bankada.</li>\n</ol>\n<p><strong>Упр. 4.9 — Съедини в изречение.</strong> <em>(Cümle\nkurun.)</em></p>\n<ol type=\"1\">\n<li>ben / ev / gitmek</li>\n<li>o / okul / gelmek</li>\n<li>biz / sinema / gitmek</li>\n<li>sen / market / ekmek / almak</li>\n</ol>\n<p><strong>Упр. 4.10 — Със или без винителен падеж?</strong>\n<em>(Belirtme hâli ekli mi, eksiz mi?)</em></p>\n<ol type=\"1\">\n<li>Dün akşam film ___ izledim. (конкретен филм)</li>\n<li>Her gün gazete ___ okurum. (каквато и да е)</li>\n<li>Ali ___ gördün mü? (собствено име)</li>\n<li>Su ___ içiyorum. (просто вода)</li>\n<li>Bu kitap ___ çok sevdim. (тази книга)</li>\n<li>Ekmek ___ aldım. (хляб изобщо)</li>\n<li>Araba ___ sattı. (своята кола)</li>\n<li>Kahve ___ ister misin? (кафе изобщо)</li>\n</ol>\n<p><strong>Упр. 4.11 — Кой падеж иска глаголът?</strong> <em>(Fiil hangi\nhâli ister?)</em></p>\n<ol type=\"1\">\n<li>Otobüs___ bindim.</li>\n<li>Otobüs___ indim.</li>\n<li>Köpek___ korkuyorum.</li>\n<li>Ders___ başladık.</li>\n<li>Sen___ inanıyorum.</li>\n<li>Öğretmen___ sordum.</li>\n<li>Seni___ bekliyorum.</li>\n<li>Ev___ çıktım.</li>\n</ol>\n<p><strong>Упр. 4.12 — Постави всички падежни форми.</strong> <em>(Bütün\nhâl eklerini yazın.)</em></p>\n<p>Пример: okul → okulu, okula, okulda, okuldan</p>\n<ol type=\"1\">\n<li>ev</li>\n<li>araba</li>\n<li>kitap</li>\n<li>şehir</li>\n<li>sokak</li>\n<li>anne</li>\n</ol>\n<p><strong>Упр. 4.13 — Съедини в едно изречение с всички\nпадежи.</strong> <em>(Bütün hâl ekleriyle tek cümle kurun.)</em></p>\n<p>Пример: ben / market / ev / ekmek / götürmek → Ben marketten eve\nekmek götürüyorum.</p>\n<ol type=\"1\">\n<li>o / okul / ev / kitap / getirmek</li>\n<li>anne / market / ben / çikolata / almak</li>\n<li>öğretmen / öğrenci / soru / sormak</li>\n<li>biz / İstanbul / Ankara / tren / gitmek</li>\n</ol>\n<p><strong>Упр. 4.14 — Преведи на турски.</strong> <em>(Türkçeye\nçevirin.)</em></p>\n<ol type=\"1\">\n<li>Чакам автобуса.</li>\n<li>Обичам те.</li>\n<li>Страхувам се от кучета.</li>\n<li>Качих се на автобуса.</li>\n<li>Слязох от автобуса.</li>\n<li>Помогнах му.</li>\n<li>Питах учителя.</li>\n<li>Гледам през прозореца.</li>\n</ol>\n<h3>Тематичен речник · Konu sözlüğü — Градът и транспортът · Şehir ve ulaşım</h3><table><thead><tr><th>Türkçe</th><th>Български</th></tr></thead><tbody><tr><td>kent</td><td>град</td></tr><tr><td>park</td><td>парк</td></tr><tr><td>bina</td><td>сграда</td></tr><tr><td>apartman</td><td>жилищен блок</td></tr><tr><td>düz</td><td>направо</td></tr><tr><td>uzak</td><td>далеч</td></tr><tr><td>otomobil</td><td>автомобил</td></tr><tr><td>minibüs</td><td>микробус</td></tr><tr><td>taksi</td><td>такси</td></tr><tr><td>gemi</td><td>кораб</td></tr><tr><td>istasyon</td><td>гара, станция</td></tr><tr><td>havalimanı</td><td>летище</td></tr><tr><td>yolcu</td><td>пътник</td></tr><tr><td>trafik</td><td>движение, трафик</td></tr><tr><td>mağaza</td><td>магазин (голям)</td></tr><tr><td>dükkân</td><td>дюкян, магазинче</td></tr><tr><td>banka</td><td>банка</td></tr><tr><td>postane</td><td>поща</td></tr><tr><td>otel</td><td>хотел</td></tr><tr><td>müze</td><td>музей</td></tr><tr><td>tiyatro</td><td>театър</td></tr><tr><td>harita</td><td>карта</td></tr><tr><td>köşe</td><td>ъгъл</td></tr><tr><td>merkez</td><td>център</td></tr></tbody></table><p><strong>Упр. 4.16 — Как е на турски?</strong> <em>(Türkçesi nedir?)</em></p><ol type=\"1\"><li>сграда</li><li>направо</li><li>такси</li><li>летище</li><li>поща</li><li>музей</li><li>гара</li><li>ъгъл</li></ol><h3>Тематичен речник · Konu sözlüğü — Домът и мебелите · Ev ve eşyalar</h3><table><thead><tr><th>Türkçe</th><th>Български</th></tr></thead><tbody><tr><td>salon</td><td>хол, всекидневна</td></tr><tr><td>yatak odası</td><td>спалня</td></tr><tr><td>banyo</td><td>баня</td></tr><tr><td>tuvalet</td><td>тоалетна</td></tr><tr><td>eşya</td><td>вещ, мебел</td></tr><tr><td>koltuk</td><td>фотьойл</td></tr><tr><td>kanepe</td><td>диван</td></tr><tr><td>buzdolabı</td><td>хладилник</td></tr><tr><td>çamaşır makinesi</td><td>пералня</td></tr><tr><td>bulaşık makinesi</td><td>съдомиялна</td></tr><tr><td>fırın</td><td>фурна</td></tr><tr><td>ocak</td><td>котлон, готварска печка</td></tr><tr><td>televizyon</td><td>телевизор</td></tr><tr><td>lamba</td><td>лампа</td></tr><tr><td>klima</td><td>климатик</td></tr><tr><td>çatı</td><td>покрив</td></tr><tr><td>duvar</td><td>стена</td></tr><tr><td>merdiven</td><td>стълбище</td></tr></tbody></table><p><strong>Упр. 4.15 — Как е на турски?</strong> <em>(Türkçesi nedir?)</em></p><ol type=\"1\"><li>хол</li><li>баня</li><li>хладилник</li><li>пералня</li><li>фурна</li><li>климатик</li><li>покрив</li><li>стълбище</li></ol><hr />\n<h2 id=\"падежите-подробно-hâl-ekleri-ayrıntılı\">ПАДЕЖИТЕ ПОДРОБНО · Hâl\nekleri ayrıntılı</h2><figure class=\"illus\">\n<svg viewBox=\"0 0 400 230\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Падежите около къщата\">\n<path d=\"M200 60 L262 105 L262 172 L138 172 L138 105 Z\" fill=\"var(--sel)\" stroke=\"var(--text-accent)\" stroke-width=\"2\"/>\n<path d=\"M200 60 L262 105 L138 105 Z\" fill=\"var(--text-accent)\" opacity=\".15\"/>\n<rect x=\"186\" y=\"136\" width=\"28\" height=\"36\" fill=\"var(--text-accent)\" opacity=\".55\"/>\n<text x=\"200\" y=\"126\" text-anchor=\"middle\" font-size=\"17\" font-weight=\"700\" fill=\"var(--text)\">ev</text>\n<text x=\"200\" y=\"196\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--text-muted)\">къща</text>\n<g stroke=\"var(--accent)\" stroke-width=\"2\" fill=\"none\" marker-end=\"url(#ah)\">\n<path d=\"M62 100 L126 118\"/><path d=\"M338 100 L274 118\"/>\n</g>\n<defs><marker id=\"ah\" markerWidth=\"8\" markerHeight=\"8\" refX=\"7\" refY=\"4\" orient=\"auto\">\n<path d=\"M0 0 L8 4 L0 8 z\" fill=\"var(--accent)\"/></marker></defs>\n<g font-size=\"13\" font-weight=\"600\" fill=\"var(--text)\">\n<text x=\"10\" y=\"86\">ev<tspan fill=\"var(--bad)\">e</tspan></text>\n<text x=\"10\" y=\"122\" font-size=\"10\" font-weight=\"400\" fill=\"var(--text-muted)\">към къщата · nereye?</text>\n<text x=\"300\" y=\"86\">ev<tspan fill=\"var(--bad)\">den</tspan></text>\n<text x=\"300\" y=\"122\" font-size=\"10\" font-weight=\"400\" fill=\"var(--text-muted)\">от къщата · nereden?</text>\n<text x=\"200\" y=\"42\" text-anchor=\"middle\">ev<tspan fill=\"var(--bad)\">de</tspan>\n<tspan font-size=\"10\" font-weight=\"400\" fill=\"var(--text-muted)\"> — в къщата · nerede?</tspan></text>\n<text x=\"200\" y=\"218\" text-anchor=\"middle\">ev<tspan fill=\"var(--bad)\">i</tspan>\n<tspan font-size=\"10\" font-weight=\"400\" fill=\"var(--text-muted)\"> — къщата (определен обект)</tspan></text>\n</g>\n</svg>\n<figcaption>Петте основни форми на съществителното.</figcaption></figure>\n<p>Това е най-важната глава в A1. Ако разбереш падежите, половината\nтурска граматика става лесна. Прочети я сега бегло, върни се към нея\nслед Урок 4 и я използвай като справочник, докато не ти влезе в\nкръвта.</p>\n<h3 id=\"каква-работа-вършат-падежите\">Каква работа вършат падежите</h3>\n<p>Българският показва ролята на думата с <strong>предлог</strong> и с\n<strong>словоред</strong>. Турският я показва с\n<strong>окончание</strong> в края на думата — и затова редът на думите е\nсвободен.</p>\n<table>\n<thead>\n<tr class=\"header\">\n<th>Български</th>\n<th>Турски</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Отивам <strong>в</strong> училище</td>\n<td>Okul<strong>a</strong> gidiyorum</td>\n</tr>\n<tr class=\"even\">\n<td>Идвам <strong>от</strong> училище</td>\n<td>Okul<strong>dan</strong> geliyorum</td>\n</tr>\n<tr class=\"odd\">\n<td><strong>В</strong> училище съм</td>\n<td>Okul<strong>da</strong>yım</td>\n</tr>\n<tr class=\"even\">\n<td>Обичам училище<strong>то</strong></td>\n<td>Okul<strong>u</strong> seviyorum</td>\n</tr>\n<tr class=\"odd\">\n<td>Вратата <strong>на</strong> училището</td>\n<td>Okul<strong>un</strong> kapısı</td>\n</tr>\n</tbody>\n</table>\n<p>Забележи: една и съща дума <code>okul</code>, пет различни окончания,\nпет различни значения.</p>\n<hr />\n<h3 id=\"основен-падеж-yalın-hâl\">1. Основен падеж · Yalın hâl</h3>\n<p><strong>Окончание:</strong> няма <strong>Въпрос:</strong>\n<em>ne?</em> (какво?), <em>kim?</em> (кой?)</p>\n<p>Това е формата от речника. Използва се, когато думата е:</p>\n<ul>\n<li><strong>подлог:</strong> <code>Ali geldi.</code> — Али дойде.</li>\n<li><strong>неопределено допълнение:</strong>\n<code>Kitap okuyorum.</code> — Чета книга (каквато и да е).</li>\n<li><strong>именно сказуемо:</strong> <code>O doktor.</code> — Той е\nлекар.</li>\n</ul>\n<hr />\n<h3 id=\"винителен-падеж-belirtme-hâli\">2. Винителен падеж · Belirtme\nhâli</h3>\n<p><strong>Окончание:</strong> -ı / -i / -u / -ü <em>(след гласна: -yı /\n-yi / -yu / -yü)</em> <strong>Въпрос:</strong> <em>neyi?</em> (какво?),\n<em>kimi?</em> (кого?)</p>\n<table>\n<colgroup>\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th>Последна гласна</th>\n<th>Окончание</th>\n<th>Пример</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>a, ı</td>\n<td>-ı</td>\n<td>kız → kız<strong>ı</strong></td>\n</tr>\n<tr class=\"even\">\n<td>e, i</td>\n<td>-i</td>\n<td>ev → ev<strong>i</strong></td>\n</tr>\n<tr class=\"odd\">\n<td>o, u</td>\n<td>-u</td>\n<td>okul → okul<strong>u</strong></td>\n</tr>\n<tr class=\"even\">\n<td>ö, ü</td>\n<td>-ü</td>\n<td>göz → göz<strong>ü</strong></td>\n</tr>\n<tr class=\"odd\">\n<td>завършва на гласна</td>\n<td>-yı/-yi/-yu/-yü</td>\n<td>araba → araba<strong>yı</strong>, kedi →\nkedi<strong>yi</strong></td>\n</tr>\n</tbody>\n</table>\n<p><strong>Кога СЕ СЛАГА</strong> — когато обектът е определен, тоест\nзнаем за кое конкретно нещо говорим:</p>\n<table>\n<thead>\n<tr class=\"header\">\n<th>Случай</th>\n<th>Пример</th>\n<th>Превод</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>собствено име</td>\n<td>Ali’<strong>yi</strong> gördüm</td>\n<td>Видях Али</td>\n</tr>\n<tr class=\"even\">\n<td>местоимение</td>\n<td>Sen<strong>i</strong> bekliyorum</td>\n<td>Чакам те</td>\n</tr>\n<tr class=\"odd\">\n<td>с bu / şu / o</td>\n<td>Bu film<strong>i</strong> izledim</td>\n<td>Гледах този филм</td>\n</tr>\n<tr class=\"even\">\n<td>с притежателен афикс</td>\n<td>Kitab<strong>ım</strong>ı kaybettim</td>\n<td>Загубих си книгата</td>\n</tr>\n<tr class=\"odd\">\n<td>вече споменато</td>\n<td>Kitab<strong>ı</strong> okudum</td>\n<td>Прочетох книгата</td>\n</tr>\n<tr class=\"even\">\n<td>единствено по рода си</td>\n<td>Güneş<strong>i</strong> görüyorum</td>\n<td>Виждам слънцето</td>\n</tr>\n</tbody>\n</table>\n<p><strong>Кога НЕ СЕ СЛАГА</strong> — когато обектът е неопределен или\nобщ:</p>\n<table>\n<thead>\n<tr class=\"header\">\n<th>Пример</th>\n<th>Превод</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Kitap okuyorum</td>\n<td>Чета книга</td>\n</tr>\n<tr class=\"even\">\n<td>Su içiyorum</td>\n<td>Пия вода</td>\n</tr>\n<tr class=\"odd\">\n<td>Her gün ekmek alırım</td>\n<td>Всеки ден купувам хляб</td>\n</tr>\n<tr class=\"even\">\n<td>Türkçe öğreniyorum</td>\n<td>Уча турски</td>\n</tr>\n</tbody>\n</table>\n<p><strong>Двойката за сравнение:</strong></p>\n<table>\n<thead>\n<tr class=\"header\">\n<th>Без окончание</th>\n<th>С окончание</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Film izliyorum. — Гледам филм.</td>\n<td>Filmi izliyorum. — Гледам филма.</td>\n</tr>\n<tr class=\"even\">\n<td>Araba aldım. — Купих кола.</td>\n<td>Arabayı aldım. — Купих колата.</td>\n</tr>\n<tr class=\"odd\">\n<td>Çay içtim. — Пих чай.</td>\n<td>Çayı içtim. — Изпих чая.</td>\n</tr>\n<tr class=\"even\">\n<td>Mektup yazdım. — Писах писмо.</td>\n<td>Mektubu yazdım. — Написах писмото.</td>\n</tr>\n</tbody>\n</table>\n<p><strong>Правило за проверка:</strong> ако на български можеш да\nсложиш „-та/-ът/-то“ или „този“, на турски трябва окончание.</p>\n<p><strong>Внимание:</strong> ако между обекта и глагола застане друга\nдума, окончанието става задължително дори при неопределен обект:\n<code>Dün bir kitap aldım.</code> но\n<code>Bir kitab**ı** dün aldım.</code></p>\n<hr />\n<h3 id=\"дателен-падеж-yönelme-hâli\">3. Дателен падеж · Yönelme hâli</h3>\n<p><strong>Окончание:</strong> -a / -e <em>(след гласна: -ya / -ye)</em>\n<strong>Въпрос:</strong> <em>nereye?</em> (накъде?), <em>kime?</em> (на\nкого?), <em>neye?</em> (на какво?)</p>\n<table>\n<colgroup>\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th>Последна гласна</th>\n<th>Окончание</th>\n<th>Пример</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>a, ı, o, u</td>\n<td>-a</td>\n<td>okul → okul<strong>a</strong></td>\n</tr>\n<tr class=\"even\">\n<td>e, i, ö, ü</td>\n<td>-e</td>\n<td>ev → ev<strong>e</strong></td>\n</tr>\n<tr class=\"odd\">\n<td>завършва на гласна</td>\n<td>-ya / -ye</td>\n<td>araba → araba<strong>ya</strong>, kedi →\nkedi<strong>ye</strong></td>\n</tr>\n</tbody>\n</table>\n<p><strong>Значения:</strong></p>\n<table>\n<thead>\n<tr class=\"header\">\n<th>Значение</th>\n<th>Пример</th>\n<th>Превод</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>посока</td>\n<td>İstanbul’<strong>a</strong> gidiyorum</td>\n<td>Отивам в Истанбул</td>\n</tr>\n<tr class=\"even\">\n<td>получател</td>\n<td>Ali’<strong>ye</strong> verdim</td>\n<td>Дадох на Али</td>\n</tr>\n<tr class=\"odd\">\n<td>цел</td>\n<td>Sinema<strong>ya</strong> gidiyoruz</td>\n<td>Отиваме на кино</td>\n</tr>\n<tr class=\"even\">\n<td>до момент</td>\n<td>Saat üç<strong>e</strong> kadar</td>\n<td>До три часа</td>\n</tr>\n<tr class=\"odd\">\n<td>цена (за)</td>\n<td>Yüz lira<strong>ya</strong> aldım</td>\n<td>Купих го за сто лири</td>\n</tr>\n<tr class=\"even\">\n<td>според</td>\n<td>Ban<strong>a</strong> göre</td>\n<td>Според мен</td>\n</tr>\n</tbody>\n</table>\n<p><strong>Личните местоимения са неправилни:</strong></p>\n<div class=\"line-block\">ben → <strong>bana</strong> | на мен |<br />\nsen → <strong>sana</strong> | на теб |<br />\no → <strong>ona</strong> | на него |<br />\nbiz → <strong>bize</strong> | на нас |<br />\nsiz → <strong>size</strong> | на вас |<br />\nonlar → <strong>onlara</strong> | на тях |</div>\n<p><em>Внимавай:</em> <code>bana</code>, а не <code>bene</code>;\n<code>sana</code>, а не <code>sene</code>.</p>\n<hr />\n<h3 id=\"местен-падеж-bulunma-hâli\">4. Местен падеж · Bulunma hâli</h3>\n<p><strong>Окончание:</strong> -da / -de / -ta / -te\n<strong>Въпрос:</strong> <em>nerede?</em> (къде?), <em>kimde?</em> (у\nкого?)</p>\n<table>\n<thead>\n<tr class=\"header\">\n<th>Условие</th>\n<th>Окончание</th>\n<th>Пример</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>задна гласна, мека съгласна</td>\n<td>-da</td>\n<td>okul<strong>da</strong></td>\n</tr>\n<tr class=\"even\">\n<td>предна гласна, мека съгласна</td>\n<td>-de</td>\n<td>ev<strong>de</strong></td>\n</tr>\n<tr class=\"odd\">\n<td>задна гласна, след ç f h k p s ş t</td>\n<td>-ta</td>\n<td>kitap<strong>ta</strong></td>\n</tr>\n<tr class=\"even\">\n<td>предна гласна, след ç f h k p s ş t</td>\n<td>-te</td>\n<td>çiçek<strong>te</strong></td>\n</tr>\n</tbody>\n</table>\n<p><strong>Бележка за подбора:</strong> гласната се избира по\n<strong>последната гласна</strong> на думата, съгласната — по\n<strong>последната съгласна</strong>. Двете решения са независими:</p>\n<table>\n<thead>\n<tr class=\"header\">\n<th>Дума</th>\n<th>Последна гласна</th>\n<th>Последна съгласна</th>\n<th>Резултат</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>kitap</td>\n<td>a (задна)</td>\n<td>p (твърда)</td>\n<td>kitap<strong>ta</strong></td>\n</tr>\n<tr class=\"even\">\n<td>sınıf</td>\n<td>ı (задна)</td>\n<td>f (твърда)</td>\n<td>sınıf<strong>ta</strong></td>\n</tr>\n<tr class=\"odd\">\n<td>sokak</td>\n<td>a (задна)</td>\n<td>k (твърда)</td>\n<td>sokak<strong>ta</strong></td>\n</tr>\n<tr class=\"even\">\n<td>çiçek</td>\n<td>e (предна)</td>\n<td>k (твърда)</td>\n<td>çiçek<strong>te</strong></td>\n</tr>\n<tr class=\"odd\">\n<td>ev</td>\n<td>e (предна)</td>\n<td>v (мека)</td>\n<td>ev<strong>de</strong></td>\n</tr>\n<tr class=\"even\">\n<td>okul</td>\n<td>u (задна)</td>\n<td>l (мека)</td>\n<td>okul<strong>da</strong></td>\n</tr>\n</tbody>\n</table>\n<p><strong>Значения:</strong></p>\n<table>\n<thead>\n<tr class=\"header\">\n<th>Значение</th>\n<th>Пример</th>\n<th>Превод</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>място</td>\n<td>Ev<strong>de</strong>yim</td>\n<td>Вкъщи съм</td>\n</tr>\n<tr class=\"even\">\n<td>време</td>\n<td>Saat üç<strong>te</strong></td>\n<td>В три часа</td>\n</tr>\n<tr class=\"odd\">\n<td>у някого</td>\n<td>Kitap ben<strong>de</strong></td>\n<td>Книгата е у мен</td>\n</tr>\n<tr class=\"even\">\n<td>цена/мярка</td>\n<td>Yüz lira<strong>da</strong> anlaştık</td>\n<td>Спазарихме се на сто лири</td>\n</tr>\n<tr class=\"odd\">\n<td>състояние</td>\n<td>İyi bir durum<strong>da</strong></td>\n<td>В добро състояние</td>\n</tr>\n</tbody>\n</table>\n<hr />\n<h3 id=\"изходен-падеж-ayrılma-hâli\">5. Изходен падеж · Ayrılma hâli</h3>\n<p><strong>Окончание:</strong> -dan / -den / -tan / -ten\n<strong>Въпрос:</strong> <em>nereden?</em> (откъде?), <em>kimden?</em>\n(от кого?)</p>\n<p>Подборът е по същата логика като при местния падеж:\n<code>ev**den**</code>, <code>okul**dan**</code>,\n<code>kitap**tan**</code>, <code>sokak**tan**</code>,\n<code>çiçek**ten**</code></p>\n<p><strong>Значения:</strong></p>\n<table>\n<thead>\n<tr class=\"header\">\n<th>Значение</th>\n<th>Пример</th>\n<th>Превод</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>източник</td>\n<td>Ev<strong>den</strong> geliyorum</td>\n<td>Идвам от вкъщи</td>\n</tr>\n<tr class=\"even\">\n<td>от кого</td>\n<td>Ali’<strong>den</strong> duydum</td>\n<td>Чух го от Али</td>\n</tr>\n<tr class=\"odd\">\n<td>материал</td>\n<td>Tahta<strong>dan</strong> yapılmış</td>\n<td>Направено е от дърво</td>\n</tr>\n<tr class=\"even\">\n<td>причина</td>\n<td>Soğuk<strong>tan</strong> hastalandım</td>\n<td>Разболях се от студа</td>\n</tr>\n<tr class=\"odd\">\n<td>част от цяло</td>\n<td>Öğrenciler<strong>den</strong> biri</td>\n<td>Един от учениците</td>\n</tr>\n<tr class=\"even\">\n<td>сравнение</td>\n<td>Ben<strong>den</strong> uzun</td>\n<td>По-висок от мен</td>\n</tr>\n<tr class=\"odd\">\n<td>през</td>\n<td>Pencere<strong>den</strong> baktım</td>\n<td>Гледах през прозореца</td>\n</tr>\n<tr class=\"even\">\n<td>преди</td>\n<td>Yemek<strong>ten</strong> önce</td>\n<td>Преди ядене</td>\n</tr>\n<tr class=\"odd\">\n<td>след</td>\n<td>Ders<strong>ten</strong> sonra</td>\n<td>След урока</td>\n</tr>\n</tbody>\n</table>\n<hr />\n<h3 id=\"родителен-падеж-ilgi-hâli\">6. Родителен падеж · İlgi hâli</h3>\n<p><strong>Окончание:</strong> -ın / -in / -un / -ün <em>(след гласна:\n-nın / -nin / -nun / -nün)</em> <strong>Въпрос:</strong> <em>kimin?</em>\n(чий?), <em>neyin?</em> (на какво?)</p>\n<table>\n<thead>\n<tr class=\"header\">\n<th>Пример</th>\n<th>Превод</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>ev<strong>in</strong> kapısı</td>\n<td>вратата на къщата</td>\n</tr>\n<tr class=\"even\">\n<td>Ali’<strong>nin</strong> arabası</td>\n<td>колата на Али</td>\n</tr>\n<tr class=\"odd\">\n<td>araba<strong>nın</strong> rengi</td>\n<td>цветът на колата</td>\n</tr>\n<tr class=\"even\">\n<td>öğrenci<strong>nin</strong> kitabı</td>\n<td>книгата на ученика</td>\n</tr>\n</tbody>\n</table>\n<p>Родителният падеж никога не стои сам — той винаги е първата част на\nизафет, а втората дума получава притежателен афикс. Затова е разгледан\nподробно в Урок 3.</p>\n<p><strong>Личните местоимения:</strong></p>\n<div class=\"line-block\">benim | мой | senin | твой |<br />\nonun | негов | bizim | наш |<br />\nsizin | ваш | onların | техен |</div>\n<hr />\n<h3 id=\"пълна-таблица-една-дума-във-всички-падежи\">Пълна таблица: една\nдума във всички падежи</h3>\n<p><strong>ev (къща) — мека съгласна, предна гласна:</strong></p>\n<table>\n<thead>\n<tr class=\"header\">\n<th>Падеж</th>\n<th>Форма</th>\n<th>Превод</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>yalın</td>\n<td>ev</td>\n<td>къща</td>\n</tr>\n<tr class=\"even\">\n<td>belirtme</td>\n<td>evi</td>\n<td>къщата (обект)</td>\n</tr>\n<tr class=\"odd\">\n<td>yönelme</td>\n<td>eve</td>\n<td>към къщата</td>\n</tr>\n<tr class=\"even\">\n<td>bulunma</td>\n<td>evde</td>\n<td>в къщата</td>\n</tr>\n<tr class=\"odd\">\n<td>ayrılma</td>\n<td>evden</td>\n<td>от къщата</td>\n</tr>\n<tr class=\"even\">\n<td>ilgi</td>\n<td>evin</td>\n<td>на къщата</td>\n</tr>\n</tbody>\n</table>\n<p><strong>kitap (книга) — твърда съгласна, задна гласна:</strong></p>\n<div class=\"line-block\">yalın | kitap |<br />\nbelirtme | kitabı <em>(p → b)</em> |<br />\nyönelme | kitaba <em>(p → b)</em> |<br />\nbulunma | kitapta |<br />\nayrılma | kitaptan |<br />\nilgi | kitabın <em>(p → b)</em> |</div>\n<p><strong>Забележи:</strong> пред окончание, започващо с\n<strong>гласна</strong>, крайното <code>p</code> се смекчава в\n<code>b</code>. Пред окончание, започващо със <strong>съгласна</strong>,\nостава <code>p</code>.</p>\n<p><strong>araba (кола) — завършва на гласна:</strong></p>\n<div class=\"line-block\">yalın | araba |<br />\nbelirtme | arabayı |<br />\nyönelme | arabaya |<br />\nbulunma | arabada |<br />\nayrılma | arabadan |<br />\nilgi | arabanın |</div>\n<hr />\n<h3 id=\"падежи-върху-дума-с-притежателен-афикс\">Падежи върху дума с\nпритежателен афикс</h3>\n<p>Когато думата вече има притежание, пред падежното окончание се вмъква\n<strong>-n-</strong> (за 3 лице) или окончанието се лепи направо (за\nдругите лица):</p>\n<p><strong>evim (моята къща):</strong></p>\n<div class=\"line-block\">evim<strong>i</strong> | моята къща (обект)\n|<br />\nevim<strong>e</strong> | към моята къща |<br />\nevim<strong>de</strong> | в моята къща |<br />\nevim<strong>den</strong> | от моята къща |</div>\n<p><strong>evi (неговата къща) — тук се появява -n-:</strong></p>\n<div class=\"line-block\">evi<strong>n</strong>i | неговата къща (обект)\n|<br />\nevi<strong>n</strong>e | към неговата къща |<br />\nevi<strong>n</strong>de | в неговата къща |<br />\nevi<strong>n</strong>den | от неговата къща |</div>\n<p><em>Защо?</em> Защото без <code>n</code> формите биха се сблъскали:\n<code>evi + e</code> е неизговоримо, а <code>evi + de</code> би се\nобъркало с „evde“.</p>\n<p><strong>Внимание с двусмислието:</strong> <code>evinde</code> може да\nзначи „в твоята къща“ (ev-in-de) или „в неговата къща“ (ev-i-n-de).\nКонтекстът решава.</p>\n<hr />\n<h3 id=\"собствени-имена\">Собствени имена</h3>\n<p>Пред окончанието се пише <strong>апостроф</strong>:</p>\n<div class=\"line-block\">İstanbul’<strong>da</strong> | в Истанбул\n|<br />\nAnkara’<strong>ya</strong> | към Анкара |<br />\nAli’<strong>yi</strong> | Али (обект) |<br />\nAyşe’<strong>nin</strong> | на Айше |<br />\nTürkiye’<strong>den</strong> | от Турция |</div>\n<p>Апострофът показва къде свършва името. При нарицателни имена не се\nпише.</p>\n<hr />\n<h3 id=\"глаголи-с-фиксиран-падеж\">Глаголи с фиксиран падеж</h3>\n<p>Много глаголи изискват определен падеж, който не съвпада с\nбългарския. Тези се учат наизуст, заедно с падежа:</p>\n<p><strong>Дателен падеж (-a / -e):</strong></p>\n<div class=\"line-block\">başlamak | започвам | Ders<strong>e</strong>\nbaşladık |<br />\nbinmek | качвам се | Otobüs<strong>e</strong> bindim |<br />\nbakmak | гледам | Pencere<strong>ye</strong> baktım |<br />\ninanmak | вярвам | San<strong>a</strong> inanıyorum |<br />\nsormak | питам | Öğretmen<strong>e</strong> sordum |<br />\nsöylemek | казвам на | Ban<strong>a</strong> söyledi |<br />\nyardım etmek | помагам | On<strong>a</strong> yardım ettim |<br />\ngitmek | отивам | Okul<strong>a</strong> gidiyorum |<br />\nçıkmak | качвам се / излизам нагоре | Dağ<strong>a</strong> çıktık\n|<br />\nkızmak | сърдя се на | Ban<strong>a</strong> kızdı |<br />\nâşık olmak | влюбвам се в | On<strong>a</strong> âşık oldum |</div>\n<p><strong>Изходен падеж (-dan / -den):</strong></p>\n<div class=\"line-block\">inmek | слизам | Otobüs<strong>ten</strong>\nindim |<br />\nkorkmak | страхувам се от | Köpek<strong>ten</strong> korkuyorum |<br />\nhoşlanmak | харесвам | Bu müzik<strong>ten</strong> hoşlanıyorum |<br />\nnefret etmek | мразя | Yalan<strong>dan</strong> nefret ederim |<br />\nçıkmak | излизам от | Ev<strong>den</strong> çıktım |<br />\nbahsetmek | говоря за | Sen<strong>den</strong> bahsettik |<br />\nvazgeçmek | отказвам се от | Fikrim<strong>den</strong> vazgeçtim\n|<br />\nanlamak | разбирам от | Müzik<strong>ten</strong> anlarım |</div>\n<p><strong>Винителен падеж:</strong></p>\n<div class=\"line-block\">sevmek | обичам | Sen<strong>i</strong>\nseviyorum |<br />\nbeklemek | чакам | Otobüs<strong>ü</strong> bekliyorum |<br />\naramak | търся / звъня | Sen<strong>i</strong> aradım |<br />\ntanımak | познавам | On<strong>u</strong> tanıyorum |<br />\ndinlemek | слушам | Müziğ<strong>i</strong> dinliyorum |</div>\n<p><strong>Внимавай с двата смисъла на <code>çıkmak</code>:</strong>\n<code>evden çıkmak</code> (излизам от къщи) ↔︎ <code>dağa çıkmak</code>\n(качвам се на планина).</p>\n<hr />\n<h3 id=\"как-да-се-упражняваш\">Как да се упражняваш</h3>\n<p>Вземи всяка нова дума и я изговори в шестте падежа наведнъж:</p>\n<blockquote>\n<p><strong>masa</strong> — masayı, masaya, masada, masadan, masanın\n<strong>öğrenci</strong> — öğrenciyi, öğrenciye, öğrencide, öğrenciden,\nöğrencinin <strong>sokak</strong> — sokağı, sokağa, sokakta, sokaktan,\nsokağın</p>\n</blockquote>\n<p>След двадесет думи хармонията и асимилацията ще ти станат\nавтоматични.</p>\n<hr />\n<h3 id=\"чести-грешки\">Чести грешки</h3>\n<table>\n<colgroup>\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th>Грешно</th>\n<th>Правилно</th>\n<th>Защо</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td><del>bene</del></td>\n<td>bana</td>\n<td>неправилно местоимение</td>\n</tr>\n<tr class=\"even\">\n<td><del>sene</del></td>\n<td>sana</td>\n<td>неправилно местоимение</td>\n</tr>\n<tr class=\"odd\">\n<td><del>otobüsü bindim</del></td>\n<td>otobüse bindim</td>\n<td><code>binmek</code> иска дателен</td>\n</tr>\n<tr class=\"even\">\n<td><del>kitapı</del></td>\n<td>kitabı</td>\n<td>смекчаване p → b пред гласна</td>\n</tr>\n<tr class=\"odd\">\n<td><del>sokakta gidiyorum</del></td>\n<td>sokakta yürüyorum / sokağa gidiyorum</td>\n<td>място vs. посока</td>\n</tr>\n<tr class=\"even\">\n<td><del>evimde</del> за „от моята къща“</td>\n<td>evimden</td>\n<td>сбъркан падеж</td>\n</tr>\n<tr class=\"odd\">\n<td><del>İstanbulda</del></td>\n<td>İstanbul’da</td>\n<td>липсва апостроф</td>\n</tr>\n<tr class=\"even\">\n<td><del>kitapta okudum</del></td>\n<td>kitabı okudum</td>\n<td>обектът иска винителен</td>\n</tr>\n</tbody>\n</table>\n<hr />\n<h3\nid=\"упражнения-към-главата-за-падежите-hâl-ekleri-alıştırmaları\">Упражнения\nкъм главата за падежите · Hâl ekleri alıştırmaları</h3>\n<p><strong>Упр. П.1 — Постави думата в шестте падежа.</strong>\n<em>(Kelimeyi bütün hâllerde yazın.)</em></p>\n<p>Пример: ev → evi, eve, evde, evden, evin</p>\n<ol type=\"1\">\n<li>okul</li>\n<li>araba</li>\n<li>kitap</li>\n<li>sokak</li>\n<li>öğrenci</li>\n<li>göz</li>\n<li>şehir</li>\n<li>kapı</li>\n</ol>\n<p><strong>Упр. П.2 — Кой падеж липсва?</strong> <em>(Hangi hâl eki\neksik?)</em></p>\n<ol type=\"1\">\n<li>Ben İstanbul___ gidiyorum.</li>\n<li>O ev___ geliyor.</li>\n<li>Biz sınıf___ oturuyoruz.</li>\n<li>Kitab___ okudum.</li>\n<li>Bu araba Ali___ .</li>\n<li>Okul___ çıktım.</li>\n<li>Öğretmen___ sordum.</li>\n<li>Köpek___ korkuyorum.</li>\n</ol>\n<p><strong>Упр. П.3 — Със или без винителен падеж?</strong>\n<em>(Belirtme hâli ekli mi, eksiz mi?)</em></p>\n<ol type=\"1\">\n<li>Dün akşam film ___ izledim. (конкретния филм)</li>\n<li>Her gün gazete ___ okurum. (вестник изобщо)</li>\n<li>Bu kitap ___ çok sevdim. (тази книга)</li>\n<li>Su ___ içiyorum. (вода изобщо)</li>\n<li>Ali ___ gördüm. (собствено име)</li>\n<li>Türkçe ___ öğreniyorum. (турски изобщо)</li>\n<li>Araban ___ sattın mı? (твоята кола)</li>\n<li>Ekmek ___ aldım. (хляб изобщо)</li>\n</ol>\n<p><strong>Упр. П.4 — Кой падеж иска глаголът?</strong> <em>(Fiil hangi\nhâli ister?)</em></p>\n<ol type=\"1\">\n<li>Otobüs___ bindim.</li>\n<li>Otobüs___ indim.</li>\n<li>Sen___ inanıyorum.</li>\n<li>Köpek___ korkuyorum.</li>\n<li>Müzik___ dinliyorum.</li>\n<li>Ders___ başladık.</li>\n<li>Ev___ çıktım.</li>\n<li>Sen___ bekliyorum.</li>\n<li>On___ yardım ettim.</li>\n<li>Bu müzik___ hoşlanıyorum.</li>\n</ol>\n<p><strong>Упр. П.5 — Личните местоимения в дателен падеж.</strong>\n<em>(Kişi zamirleri yönelme hâlinde.)</em></p>\n<ol type=\"1\">\n<li>ben ___</li>\n<li>sen ___</li>\n<li>o ___</li>\n<li>biz ___</li>\n<li>siz ___</li>\n<li>onlar ___</li>\n</ol>\n<p><strong>Упр. П.6 — Падеж върху дума с притежателен афикс.</strong>\n<em>(İyelik ekli kelimeye hâl eki.)</em></p>\n<p>Пример: evim → evimi, evime, evimde, evimden</p>\n<ol type=\"1\">\n<li>kitabım</li>\n<li>arabası</li>\n<li>okulumuz</li>\n<li>evi</li>\n<li>annem</li>\n<li>odası</li>\n</ol>\n<p><strong>Упр. П.7 — Поправи грешката.</strong> <em>(Hatayı\ndüzeltin.)</em></p>\n<ol type=\"1\">\n<li>Bene verdi.</li>\n<li>Otobüsü bindim.</li>\n<li>Kitapı okudum.</li>\n<li>İstanbulda yaşıyorum.</li>\n<li>Sene söyledim.</li>\n<li>Evimde çıktım. (излязох от къщи)</li>\n</ol>\n<p><strong>Упр. П.8 — Преведи на турски.</strong> <em>(Türkçeye\nçevirin.)</em></p>\n<ol type=\"1\">\n<li>Отивам в Истанбул.</li>\n<li>Идвам от училище.</li>\n<li>Вкъщи съм.</li>\n<li>Прочетох книгата.</li>\n<li>Дадох му пари.</li>\n<li>Страхувам се от кучета.</li>\n<li>Купих го за сто лири.</li>\n<li>Гледах през прозореца.</li>\n<li>Разболях се от студа.</li>\n<li>По-висок си от мен.</li>\n</ol>\n<hr />\n<h2 id=\"урок-5-сегашно-време-ne-yapıyorsun\">УРОК 5 · Сегашно време — Ne\nyapıyorsun?</h2><figure class=\"illus\">\n<svg viewBox=\"0 0 400 170\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Строеж на глаголната форма\">\n<g font-size=\"14\" font-weight=\"700\" text-anchor=\"middle\">\n<rect x=\"14\" y=\"40\" width=\"86\" height=\"46\" rx=\"9\" fill=\"var(--text-accent)\"/><text x=\"57\" y=\"69\" fill=\"#fff\">gel-</text>\n<rect x=\"108\" y=\"40\" width=\"96\" height=\"46\" rx=\"9\" fill=\"var(--accent)\"/><text x=\"156\" y=\"69\" fill=\"var(--accent-fg)\">-iyor-</text>\n<rect x=\"212\" y=\"40\" width=\"80\" height=\"46\" rx=\"9\" fill=\"var(--bad)\"/><text x=\"252\" y=\"69\" fill=\"#fff\">-um</text>\n<rect x=\"300\" y=\"40\" width=\"86\" height=\"46\" rx=\"9\" fill=\"#fff\" stroke=\"var(--line)\"/><text x=\"343\" y=\"69\" fill=\"var(--text)\">=</text>\n</g>\n<g font-size=\"10\" text-anchor=\"middle\" fill=\"var(--text-muted)\">\n<text x=\"57\" y=\"104\">корен</text><text x=\"156\" y=\"104\">време</text><text x=\"252\" y=\"104\">лице</text>\n</g>\n<text x=\"200\" y=\"140\" text-anchor=\"middle\" font-size=\"19\" font-weight=\"700\" fill=\"var(--text)\">geliyorum\n<tspan font-size=\"12\" font-weight=\"400\" fill=\"var(--text-muted)\"> — идвам</tspan></text>\n<text x=\"200\" y=\"160\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--text-muted)\">турската дума расте надясно: всяко значение е отделно парче</text>\n</svg>\n<figcaption>Аглутинация: думата се сглобява като кубчета.</figcaption></figure>\n<h3 id=\"речник-sözlük-4\">Речник · Sözlük</h3>\n<table>\n<thead>\n<tr class=\"header\">\n<th>Турски</th>\n<th>Български</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>yapmak</td>\n<td>правя</td>\n</tr>\n<tr class=\"even\">\n<td>okumak</td>\n<td>чета, уча</td>\n</tr>\n<tr class=\"odd\">\n<td>yazmak</td>\n<td>пиша</td>\n</tr>\n<tr class=\"even\">\n<td>içmek</td>\n<td>пия</td>\n</tr>\n<tr class=\"odd\">\n<td>yemek</td>\n<td>ям; ястие</td>\n</tr>\n<tr class=\"even\">\n<td>çalışmak</td>\n<td>работя, уча</td>\n</tr>\n<tr class=\"odd\">\n<td>uyumak</td>\n<td>спя</td>\n</tr>\n<tr class=\"even\">\n<td>oturmak</td>\n<td>седя, живея</td>\n</tr>\n<tr class=\"odd\">\n<td>dinlemek</td>\n<td>слушам</td>\n</tr>\n<tr class=\"even\">\n<td>izlemek</td>\n<td>гледам (филм)</td>\n</tr>\n<tr class=\"odd\">\n<td>konuşmak</td>\n<td>говоря</td>\n</tr>\n<tr class=\"even\">\n<td>beklemek</td>\n<td>чакам</td>\n</tr>\n<tr class=\"odd\">\n<td>başlamak</td>\n<td>започвам</td>\n</tr>\n<tr class=\"even\">\n<td>bitirmek</td>\n<td>завършвам</td>\n</tr>\n<tr class=\"odd\">\n<td>müzik</td>\n<td>музика</td>\n</tr>\n<tr class=\"even\">\n<td>film</td>\n<td>филм</td>\n</tr>\n<tr class=\"odd\">\n<td>yemek yapmak</td>\n<td>готвя</td>\n</tr>\n<tr class=\"even\">\n<td>su</td>\n<td>вода</td>\n</tr>\n<tr class=\"odd\">\n<td>çay</td>\n<td>чай</td>\n</tr>\n<tr class=\"eve
