arıyla | доколкото виждам | |<br />\n-dığı takdirde | в случай че | Gelmediği takdirde başlarız. |<br />\n-dığı sürece | докато | Sen burada olduğun sürece güvendeyim. |</div>\n<h3 id=\"защо-е-така-neden-böyle-18\">Защо е така · Neden böyle</h3>\n<p><strong>Защо турският няма съюз „че“?</strong> Защото е език, който\nпредпочита да свива изречения в думи. Вместо да свърже две изречения със\nсъюз, той превръща едното в съществително и го прави обект на другото.\n<code>Geldiğini biliyorum</code> буквално е „Знам неговото-дошло“ — само\nедно изречение с един спрегнат глагол.</p>\n<p>Всъщност турският <strong>има</strong> съюза <code>ki</code> (заемка\nот персийски), но той се използва ограничено и звучи книжовно:\n<code>Biliyorum ki geldi.</code> Носителите предпочитат\n<code>-dık</code>.</p>\n<p><strong>Защо <code>-mak</code> не приема притежание, а\n<code>-ma</code> — да?</strong> Историческа причина: <code>-mak</code> е\nзастинала инфинитивна форма, докато <code>-ma</code> е живо\nсловообразувателно окончание, което прави пълноценни съществителни.\nЗатова има думи като <code>dondurma</code> (сладолед, буквално\n„замразяване“), <code>kavurma</code> (пържено месо), <code>dolma</code>\n(пълнено).</p>\n<p><strong>Защо падежът зависи от главния глагол?</strong> Защото\nподчиненото изречение вече е съществително, а всяко съществително приема\nпадежа, който глаголът изисква. <code>sevinmek</code> иска дателен\n(<code>bir şeye sevinmek</code> — радвам се на нещо), затова и\n<code>geldiğine sevindim</code>. Тоест: научи падежа на глагола веднъж и\nтой важи и тук.</p>\n<p><strong>Каква е основната грешка на българите?</strong> Да преведат\nбуквално „че“ и да кажат <del>Biliyorum ki o geliyor</del> навсякъде.\nГраматически не е грешно, но звучи като превод. Естественото е\n<code>Geldiğini biliyorum</code>.</p>\n<h3 id=\"текст-за-четене-и-превод-okuma-ve-çeviri-metni-17\">Текст за\nчетене и превод · Okuma ve çeviri metni</h3>\n<p><strong>Bir karar — Едно решение</strong></p>\n<blockquote>\n<p>Uzun süredir yurt dışına gitmeyi düşünüyordum. Arkadaşlarım gitmemin\niyi bir fikir olduğunu söylüyorlardı, ama ailem endişeliydi. Annem\ngitmemi istemiyordu; babam ise karar vermemin bana ait olduğunu\ndüşünüyordu.</p>\n<p>Sonunda başvurmaya karar verdim. Kabul edileceğimi hiç sanmıyordum, o\nyüzden cevap geldiğinde çok şaşırdım. Kabul edildiğimi okuyunca önce\ninanamadım.</p>\n<p>Ailem haberi duyduğunda ne diyeceklerinden emin değildim. Annem\nağladı ama gurur duyduğunu söyledi. Babam sadece „Biliyordum,“ dedi.</p>\n<p>Şimdi hazırlanıyorum. Gitmeden önce yapmam gereken çok iş var: vize,\nbilet, ev. Zor olacağını biliyorum ama pişman olmayacağımdan eminim.</p>\n</blockquote>\n<p><em>Нови думи:</em> <code>yurt dışı</code> — чужбина;\n<code>fikir</code> — идея; <code>endişeli</code> — притеснен;\n<code>başvurmak</code> — кандидатствам; <code>kabul edilmek</code> —\nприет съм; <code>şaşırmak</code> — изненадвам се;\n<code>gurur duymak</code> — гордея се; <code>hazırlanmak</code> —\nподготвям се; <code>vize</code> — виза; <code>pişman olmak</code> —\nсъжалявам.</p>\n<p><strong>Въпроси:</strong></p>\n<ol type=\"1\">\n<li>Ailesi ne düşünüyordu?</li>\n<li>Cevap gelince ne hissetti?</li>\n<li>Babası ne dedi?</li>\n<li>Gitmeden önce ne yapması gerekiyor?</li>\n</ol>\n<h3 id=\"упражнения-alıştırmalar-18\">Упражнения · Alıştırmalar</h3>\n<p><strong>Упр. 19.1 — <code>-mak</code> или <code>-ma</code>?</strong>\n<em>(„-mak“ mı, „-ma“ mı?)</em></p>\n<ol type=\"1\">\n<li>Искам да отида. → Git___ istiyorum.</li>\n<li>Искам ти да отидеш. → Git___ istiyorum.</li>\n<li>Трябва да ставам рано. → Erken kalk___ lazım.</li>\n<li>Пушенето е забранено. → Sigara iç___ yasak.</li>\n<li>Чакам Али да дойде. → Ali’nin gel___ bekliyorum.</li>\n<li>Уча се да плувам. → Yüz___ öğreniyorum.</li>\n</ol>\n<p><strong>Упр. 19.2 — Спрегни <code>-ma</code> за всички лица.</strong>\n<em>(Bütün kişiler için „-ma“.)</em></p>\n<p>Глагол: gelmek</p>\n<ol type=\"1\">\n<li>ben ___</li>\n<li>sen ___</li>\n<li>o ___</li>\n<li>biz ___</li>\n<li>siz ___</li>\n<li>onlar ___</li>\n</ol>\n<p><strong>Упр. 19.3 — Направи <code>-dık</code> форма.</strong>\n<em>(„-dık“ biçimini yapın.)</em></p>\n<ol type=\"1\">\n<li>gelmek (o)</li>\n<li>gitmek (sen)</li>\n<li>yapmak (ben)</li>\n<li>bilmek (biz)</li>\n<li>olmak (o)</li>\n<li>görmek (onlar)</li>\n</ol>\n<p><strong>Упр. 19.4 — Кой падеж иска главният глагол?</strong> <em>(Ana\nfiil hangi hâli ister?)</em></p>\n<ol type=\"1\">\n<li>Geldiğin___ biliyorum.</li>\n<li>Geldiğin___ sevindim.</li>\n<li>Geldiğin___ eminim.</li>\n<li>Geldiğin___ söyledi.</li>\n<li>Geleceğin___ korkuyorum.</li>\n<li>Geldiğin___ inanmıyorum.</li>\n</ol>\n<p><strong>Упр. 19.5 — Преобразувай с <code>-dık</code> /\n<code>-acak</code>.</strong> <em>(„-dık/-acak“ ile çevirin.)</em></p>\n<p>Пример: Знам. Той дойде. → Geldiğini biliyorum.</p>\n<ol type=\"1\">\n<li>Чух. Али е дошъл.</li>\n<li>Казаха. Утре ще вали.</li>\n<li>Знам. Ти си прав.</li>\n<li>Разбрах. Ти не ме обичаш.</li>\n<li>Сигурен съм. Той ще дойде.</li>\n</ol>\n<p><strong>Упр. 19.6 — Преведи на турски.</strong> <em>(Türkçeye\nçevirin.)</em></p>\n<ol type=\"1\">\n<li>Искам да отида.</li>\n<li>Искам ти да дойдеш.</li>\n<li>Знам, че е дошъл.</li>\n<li>Знам, че ще дойде.</li>\n<li>Чух, че Али е дошъл.</li>\n<li>Радвам се, че дойде.</li>\n<li>Понеже беше болен, не дойде.</li>\n<li>доколкото знам</li>\n</ol>\n<h3>Тематичен речник · Konu sözlüğü — Технологии и медии · Teknoloji ve medya</h3><table><thead><tr><th>Türkçe</th><th>Български</th></tr></thead><tbody><tr><td>internet</td><td>интернет</td></tr><tr><td>bilgisayar</td><td>компютър</td></tr><tr><td>dizüstü bilgisayar</td><td>лаптоп</td></tr><tr><td>akıllı telefon</td><td>смартфон</td></tr><tr><td>ekran</td><td>екран</td></tr><tr><td>klavye</td><td>клавиатура</td></tr><tr><td>fare</td><td>мишка</td></tr><tr><td>şarj aleti</td><td>зарядно</td></tr><tr><td>kulaklık</td><td>слушалки</td></tr><tr><td>e-posta</td><td>имейл</td></tr><tr><td>parola</td><td>парола</td></tr><tr><td>video</td><td>видео</td></tr><tr><td>arama</td><td>обаждане; търсене</td></tr><tr><td>gazete</td><td>вестник</td></tr><tr><td>dergi</td><td>списание</td></tr><tr><td>radyo</td><td>радио</td></tr><tr><td>televizyon kanalı</td><td>телевизионен канал</td></tr><tr><td>yayın</td><td>предаване, излъчване</td></tr><tr><td>indirmek</td><td>изтеглям</td></tr><tr><td>yüklemek</td><td>качвам; инсталирам</td></tr></tbody></table><p><strong>Упр. 19.7 — Как е на турски?</strong> <em>(Türkçesi nedir?)</em></p><ol type=\"1\"><li>компютър</li><li>лаптоп</li><li>клавиатура</li><li>мишка</li><li>слушалки</li><li>вестник</li><li>списание</li><li>изтеглям</li></ol><hr />\n<h2 id=\"урок-20-страдателен-залог-edilgen-çatı\">УРОК 20 · Страдателен\nзалог · Edilgen çatı</h2>\n<h3 id=\"речник-sözlük-18\">Речник · Sözlük</h3>\n<table>\n<thead>\n<tr class=\"header\">\n<th>Турски</th>\n<th>Български</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>yapılmak</td>\n<td>прави се</td>\n</tr>\n<tr class=\"even\">\n<td>açılmak</td>\n<td>отваря се</td>\n</tr>\n<tr class=\"odd\">\n<td>kapanmak</td>\n<td>затваря се</td>\n</tr>\n<tr class=\"even\">\n<td>satılmak</td>\n<td>продава се</td>\n</tr>\n<tr class=\"odd\">\n<td>yazılmak</td>\n<td>пише се</td>\n</tr>\n<tr class=\"even\">\n<td>kullanılmak</td>\n<td>използва се</td>\n</tr>\n<tr class=\"odd\">\n<td>bulunmak</td>\n<td>намира се</td>\n</tr>\n<tr class=\"even\">\n<td>bilinmek</td>\n<td>известно е</td>\n</tr>\n<tr class=\"odd\">\n<td>verilmek</td>\n<td>дава се</td>\n</tr>\n<tr class=\"even\">\n<td>alınmak</td>\n<td>взема се</td>\n</tr>\n<tr class=\"odd\">\n<td>kurmak</td>\n<td>основавам</td>\n</tr>\n<tr class=\"even\">\n<td>inşa etmek</td>\n<td>строя</td>\n</tr>\n<tr class=\"odd\">\n<td>üretmek</td>\n<td>произвеждам</td>\n</tr>\n<tr class=\"even\">\n<td>tamir etmek</td>\n<td>ремонтирам</td>\n</tr>\n<tr class=\"odd\">\n<td>temizlemek</td>\n<td>чистя</td>\n</tr>\n<tr class=\"even\">\n<td>hazırlamak</td>\n<td>приготвям</td>\n</tr>\n<tr class=\"odd\">\n<td>davet etmek</td>\n<td>каня</td>\n</tr>\n<tr class=\"even\">\n<td>seçmek</td>\n<td>избирам</td>\n</tr>\n<tr class=\"odd\">\n<td>kabul etmek</td>\n<td>приемам</td>\n</tr>\n<tr class=\"even\">\n<td>reddetmek</td>\n<td>отхвърлям</td>\n</tr>\n</tbody>\n</table>\n<h3 id=\"граматика-20.1-какво-е-страдателен-залог\">Граматика 20.1 — Какво\nе страдателен залог</h3>\n<p>При страдателния залог вършителят се измества назад или изчезва\nсъвсем. Българският го прави със „се“ или с „бива“:</p>\n<table>\n<colgroup>\n<col style=\"width: 50%\" />\n<col style=\"width: 50%\" />\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th>Действителен</th>\n<th>Страдателен</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Ahmet kapıyı açtı. — Ахмет отвори вратата.</td>\n<td>Kapı açıldı. — Вратата беше отворена / се отвори.</td>\n</tr>\n<tr class=\"even\">\n<td>Bu evi 1990’da yaptılar. — Построиха къщата през 1990.</td>\n<td>Bu ev 1990’da yapıldı. — Къщата беше построена през 1990.</td>\n</tr>\n</tbody>\n</table>\n<p>Турският използва страдателен залог <strong>много по-често</strong>\nот българския — особено в обяви, инструкции, новини и официален\nстил.</p>\n<h3 id=\"граматика-20.2-образуване\">Граматика 20.2 — Образуване</h3>\n<p>Правилото зависи от последния звук на корена:</p>\n<table>\n<colgroup>\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th>Условие</th>\n<th>Окончание</th>\n<th>Пример</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>коренът завършва на <strong>гласна</strong></td>\n<td>-n-</td>\n<td>oku- → oku<strong>n</strong>mak (чете се)</td>\n</tr>\n<tr class=\"even\">\n<td>коренът завършва на <strong><code>l</code></strong></td>\n<td>-in- / -ın-</td>\n<td>bul- → bul<strong>un</strong>mak (намира се)</td>\n</tr>\n<tr class=\"odd\">\n<td>всички останали съгласни</td>\n<td>-il- / -ıl- / -ul- / -ül-</td>\n<td>yap- → yap<strong>ıl</strong>mak (прави се)</td>\n</tr>\n</tbody>\n</table>\n<p><strong>Примери по трите правила:</strong></p>\n<div class=\"line-block\">Гласна → -n- | oku<strong>n</strong>du,\nye<strong>n</strong>di, söyle<strong>n</strong>di,\nbaşla<strong>n</strong>dı |<br />\nНа <code>l</code> → -in- | bul<strong>un</strong>du,\nal<strong>ın</strong>dı, bil<strong>in</strong>di,\nöl<strong>ün</strong>dü |<br />\nДруга съгласна → -il- | yap<strong>ıl</strong>dı,\naç<strong>ıl</strong>dı, ver<strong>il</strong>di,\nsat<strong>ıl</strong>dı, yaz<strong>ıl</strong>dı |</div>\n<p><strong>Внимание:</strong> <code>almak</code> (вземам) →\n<code>alınmak</code>, а не <del>alılmak</del>, защото коренът завършва\nна <code>l</code>.</p>\n<h3 id=\"граматика-20.3-страдателен-залог-във-всички-времена\">Граматика\n20.3 — Страдателен залог във всички времена</h3>\n<p><strong>yapmak (правя) → yapılmak (прави се):</strong></p>\n<table>\n<thead>\n<tr class=\"header\">\n<th>Време</th>\n<th>Форма</th>\n<th>Превод</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>сегашно</td>\n<td>yapılıyor</td>\n<td>прави се</td>\n</tr>\n<tr class=\"even\">\n<td>широко</td>\n<td>yapılır</td>\n<td>прави се (обикновено)</td>\n</tr>\n<tr class=\"odd\">\n<td>минало</td>\n<td>yapıldı</td>\n<td>беше направено</td>\n</tr>\n<tr class=\"even\">\n<td>преразказно</td>\n<td>yapılmış</td>\n<td>било направено</td>\n</tr>\n<tr class=\"odd\">\n<td>бъдеще</td>\n<td>yapılacak</td>\n<td>ще бъде направено</td>\n</tr>\n<tr class=\"even\">\n<td>дължимост</td>\n<td>yapılmalı</td>\n<td>трябва да се направи</td>\n</tr>\n<tr class=\"odd\">\n<td>условно</td>\n<td>yapılırsa</td>\n<td>ако се направи</td>\n</tr>\n</tbody>\n</table>\n<p>Примери: - Bu ev 1990’da yapıldı. — Тази къща беше построена през\n1990. - Kapı saat sekizde açılır. — Вратата се отваря в осем. - Yeni bir\nokul yapılacak. — Ще бъде построено ново училище. - Sigara içilmez. — Не\nсе пуши. <em>(табела)</em></p>\n<h3 id=\"граматика-20.4-кой-е-подлогът\">Граматика 20.4 — Кой е\nподлогът</h3>\n<p>При страдателния залог <strong>обектът става подлог</strong> и губи\nвинителния падеж:</p>\n<table>\n<thead>\n<tr class=\"header\">\n<th>Действителен</th>\n<th>Страдателен</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Kapı<strong>yı</strong> açtılar.</td>\n<td><strong>Kapı</strong> açıldı.</td>\n</tr>\n<tr class=\"even\">\n<td>Mektub<strong>u</strong> yazdım.</td>\n<td><strong>Mektup</strong> yazıldı.</td>\n</tr>\n<tr class=\"odd\">\n<td>Ev<strong>i</strong> sattılar.</td>\n<td><strong>Ev</strong> satıldı.</td>\n</tr>\n</tbody>\n</table>\n<p><strong>Вършителят</strong> се изразява с <code>tarafından</code> (от\nстрана на) — но се използва рядко: - Bu kitap Orhan Pamuk\n<strong>tarafından</strong> yazıldı. — Тази книга е написана от Орхан\nПамук. - Kapı rüzgâr <strong>tarafından</strong> açıldı. —\nПо-естествено: <code>Kapıyı rüzgâr açtı.</code></p>\n<p>Турският предпочита да не назовава вършителя — ако трябва да го\nспомене, обикновено използва действителен залог.</p>\n<h3 id=\"граматика-20.5-безличният-страдателен-залог\">Граматика 20.5 —\nБезличният страдателен залог</h3>\n<p>Тук е разликата с българския: турският прави страдателен залог дори\nот <strong>непреходни глаголи</strong> — там, където няма обект. Тогава\nсмисълът е безличен:</p>\n<table>\n<thead>\n<tr class=\"header\">\n<th>Форма</th>\n<th>Превод</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Buraya gid<strong>il</strong>ir.</td>\n<td>Оттук се минава.</td>\n</tr>\n<tr class=\"even\">\n<td>Burada yüz<strong>ül</strong>mez.</td>\n<td>Тук не се плува.</td>\n</tr>\n<tr class=\"odd\">\n<td>Nasıl gid<strong>il</strong>ir?</td>\n<td>Как се стига?</td>\n</tr>\n<tr class=\"even\">\n<td>Bu nasıl yap<strong>ıl</strong>ır?</td>\n<td>Как се прави това?</td>\n</tr>\n<tr class=\"odd\">\n<td>Çok çalış<strong>ıl</strong>dı.</td>\n<td>Работи се много.</td>\n</tr>\n</tbody>\n</table>\n<p>Това е основната форма за <strong>надписи, инструкции и общи\nправила</strong>:</p>\n<ul>\n<li>Sigara içilmez. — Пушенето забранено.</li>\n<li>Buraya park edilmez. — Тук не се паркира.</li>\n<li>Girilmez. — Вход забранен.</li>\n<li>Bu kelime nasıl yazılır? — Как се пише тази дума?</li>\n</ul>\n<h3 id=\"граматика-20.6-двоен-страдателен-залог\">Граматика 20.6 — Двоен\nстрадателен залог</h3>\n<p>Ако коренът вече завършва на <code>l</code>, а формата иска\n<code>-il-</code>, се получава двойно окончание. Турският го избягва,\nкато добавя <code>-n-</code>:</p>\n<p><code>söylemek</code> (казвам) → söyle<strong>n</strong>mek (казва\nсе), не <del>söyleilmek</del> <code>temizlemek</code> (чистя) →\ntemizle<strong>n</strong>mek (чисти се) <code>beklemek</code> (чакам) →\nbekle<strong>n</strong>mek (чака се)</p>\n<p>Правилото важи за всички глаголи на <code>-lemek/-lamak</code> — те\nса много: <code>hazırlamak → hazırlanmak</code>,\n<code>başlamak → başlanmak</code>, <code>toplamak → toplanmak</code></p>\n<p><strong>Внимание — омонимия:</strong> <code>hazırlanmak</code> значи\nи „приготвя се“ (страдателно), и „приготвям се“ (възвратно). Контекстът\nрешава: - Yemek hazırlandı. — Ядката беше приготвена. - Ben hazırlandım.\n— Аз се приготвих.</p>\n<h3 id=\"защо-е-така-neden-böyle-19\">Защо е така · Neden böyle</h3>\n<p><strong>Защо турският използва страдателен залог толкова\nчесто?</strong> Защото културата на езика избягва прякото посочване на\nвършителя в официален контекст. Където българският казва „Забранено е\nпушенето“, турският казва <code>Sigara içilmez</code> — буквално „не се\nпуши“, без никакъв деец.</p>\n<p>Освен това турският няма удобно безлично „се“ като българското,\nзатова използва страдателния залог за същата работа.</p>\n<p><strong>Защо <code>almak → alınmak</code>, а не\n<code>alılmak</code>?</strong> Защото два <code>l</code> подред са\nнеудобни за изговор. Същата причина стои зад <code>söylenmek</code>\nвместо <del>söyleilmek</del>. Турският системно избягва струпване на\nеднакви съгласни — езикът е много „фонетично удобен“.</p>\n<p><strong>Защо <code>tarafından</code> се използва рядко?</strong>\nЗащото ако знаеш кой е вършителят, по-естествено е да го направиш\nподлог: <code>Kapıyı Ahmet açtı</code> е по-турско от\n<code>Kapı Ahmet tarafından açıldı</code>. Втората форма звучи като\nпревод от европейски език. Използва се в новини, научни текстове и\nюридически документи.</p>\n<p><strong>Как да разпозная страдателен от възвратен залог?</strong> Не\nвинаги можеш само по формата — <code>yıkanmak</code> е и „измива се“, и\n„мие се сам“. Смисълът се вади от контекста и от това дали има одушевен\nподлог: <code>Bulaşıklar yıkandı</code> (съдовете бяха измити) ↔︎\n<code>Çocuk yıkandı</code> (детето се изкъпа).</p>\n<h3 id=\"текст-за-четене-и-превод-okuma-ve-çeviri-metni-18\">Текст за\nчетене и превод · Okuma ve çeviri metni</h3>\n<p><strong>Bir müze — Един музей</strong></p>\n<blockquote>\n<p>Bu müze 1923 yılında kuruldu ve o zamandan beri milyonlarca ziyaretçi\ntarafından gezildi. Bina aslında bir saray olarak inşa edilmişti,\nsonradan müzeye çevrildi.</p>\n<p>İçeride yaklaşık on bin eser sergileniyor. Eserlerin çoğu Anadolu’da\nyapılan kazılarda bulundu. En değerli parçalar birinci katta, özel bir\nsalonda korunuyor.</p>\n<p>Müze her gün saat dokuzda açılır, akşam altıda kapanır. Pazartesi\ngünleri kapalıdır. Bilet gişeden alınabilir ya da internetten satın\nalınabilir.</p>\n<p>İçeride fotoğraf çekilebilir ama flaş kullanılmaz. Çantalar girişte\nbırakılmalıdır. Rehberli turlar sabah on birde ve öğleden sonra üçte\nbaşlar.</p>\n</blockquote>\n<p><em>Нови думи:</em> <code>kurulmak</code> — основан съм;\n<code>ziyaretçi</code> — посетител; <code>gezilmek</code> — обхождам се;\n<code>saray</code> — дворец; <code>çevrilmek</code> — превръщам се;\n<code>eser</code> — творба, експонат; <code>sergilenmek</code> — излага\nсе; <code>kazı</code> — разкопка; <code>değerli</code> — ценен;\n<code>korunmak</code> — пази се; <code>gişe</code> — каса;\n<code>flaş</code> — светкавица; <code>giriş</code> — вход;\n<code>rehberli</code> — с екскурзовод.</p>\n<p><strong>Въпроси:</strong></p>\n<ol type=\"1\">\n<li>Müze ne zaman kuruldu?</li>\n<li>Bina önce ne olarak inşa edilmiş?</li>\n<li>Eserler nerede bulunmuş?</li>\n<li>İçeride ne yasak?</li>\n</ol>\n<h3 id=\"упражнения-alıştırmalar-19\">Упражнения · Alıştırmalar</h3>\n<p><strong>Упр. 20.1 — Направи страдателен залог.</strong> <em>(Edilgen\nçatı yapın.)</em></p>\n<ol type=\"1\">\n<li>yapmak</li>\n<li>açmak</li>\n<li>yazmak</li>\n<li>satmak</li>\n<li>okumak</li>\n<li>bulmak</li>\n<li>almak</li>\n<li>vermek</li>\n</ol>\n<p><strong>Упр. 20.2 — Кое правило? (-n-, -in-, -il-)</strong>\n<em>(Hangi kural?)</em></p>\n<ol type=\"1\">\n<li>okumak → ___</li>\n<li>bulmak → ___</li>\n<li>yapmak → ___</li>\n<li>almak → ___</li>\n<li>söylemek → ___</li>\n<li>açmak → ___</li>\n</ol>\n<p><strong>Упр. 20.3 — Преобразувай в страдателен залог.</strong>\n<em>(Edilgene çevirin.)</em></p>\n<p>Пример: Kapıyı açtılar. → Kapı açıldı.</p>\n<ol type=\"1\">\n<li>Mektubu yazdım.</li>\n<li>Evi sattılar.</li>\n<li>Yemeği hazırladık.</li>\n<li>Kitabı okudular.</li>\n<li>Pencereyi kapattı.</li>\n</ol>\n<p><strong>Упр. 20.4 — Безличен страдателен залог (надписи).</strong>\n<em>(Kişisiz edilgen.)</em></p>\n<ol type=\"1\">\n<li>Не се пуши.</li>\n<li>Тук не се паркира.</li>\n<li>Вход забранен.</li>\n<li>Как се стига?</li>\n<li>Как се пише тази дума?</li>\n</ol>\n<p><strong>Упр. 20.5 — Постави в посоченото време.</strong>\n<em>(Belirtilen zamana çevirin.)</em></p>\n<p>Глагол: yapılmak</p>\n<ol type=\"1\">\n<li>сегашно</li>\n<li>широко</li>\n<li>минало</li>\n<li>бъдеще</li>\n<li>дължимост</li>\n</ol>\n<p><strong>Упр. 20.6 — Преведи на турски.</strong> <em>(Türkçeye\nçevirin.)</em></p>\n<ol type=\"1\">\n<li>Тази къща беше построена през 1990.</li>\n<li>Вратата се отваря в осем.</li>\n<li>Ще бъде построено ново училище.</li>\n<li>Тази книга е написана от Орхан Памук.</li>\n<li>Билетът може да се купи от касата.</li>\n<li>Не се пуши.</li>\n<li>Как се прави това?</li>\n<li>Чантите трябва да се оставят на входа.</li>\n</ol>\n<hr />\n<h3>Тематичен речник · Konu sözlüğü — Свързващи думи · Bağlaçlar ve edatlar</h3><table><thead><tr><th>Türkçe</th><th>Български</th></tr></thead><tbody><tr><td>önceki</td><td>предишен</td></tr><tr><td>sonraki</td><td>следващ</td></tr><tr><td>lakin</td><td>обаче (книжно)</td></tr><tr><td>veya</td><td>или</td></tr><tr><td>ya da</td><td>или пък</td></tr><tr><td>gibi</td><td>като, сякаш</td></tr><tr><td>kadar</td><td>до; колкото</td></tr><tr><td>göre</td><td>според</td></tr><tr><td>için</td><td>за; за да</td></tr><tr><td>rağmen</td><td>въпреки</td></tr><tr><td>karşın</td><td>въпреки (книжно)</td></tr><tr><td>acaba</td><td>дали, чудя се</td></tr><tr><td>hatta</td><td>дори</td></tr><tr><td>zaten</td><td>и без това</td></tr></tbody></table><p><strong>Упр. 20.8 — Как е на турски?</strong> <em>(Türkçesi nedir?)</em></p><ol type=\"1\"><li>предишен</li><li>следващ</li><li>или</li><li>според</li><li>въпреки</li><li>дали, чудя се</li><li>дори</li><li>и без това</li></ol><h3>Тематичен речник · Konu sözlüğü — Разширени глаголи · Fiiller (devam)</h3><table><thead><tr><th>Türkçe</th><th>Български</th></tr></thead><tbody><tr><td>karar vermek</td><td>вземам решение</td></tr><tr><td>söz vermek</td><td>давам дума</td></tr><tr><td>dilemek</td><td>пожелавам</td></tr><tr><td>ummak</td><td>надявам се</td></tr><tr><td>nefret etmek</td><td>мразя</td></tr><tr><td>kızmak</td><td>ядосвам се</td></tr><tr><td>şaşırmak</td><td>изненадвам се</td></tr><tr><td>sevinmek</td><td>радвам се</td></tr><tr><td>üzülmek</td><td>натъжавам се</td></tr><tr><td>sıkılmak</td><td>скучно ми е</td></tr><tr><td>yorulmak</td><td>уморявам се</td></tr><tr><td>değiştirmek</td><td>променям, сменям</td></tr><tr><td>harcamak</td><td>харча</td></tr><tr><td>kazanmak</td><td>печеля</td></tr><tr><td>kaybetmek</td><td>губя</td></tr><tr><td>seçmek</td><td>избирам</td></tr><tr><td>toplamak</td><td>събирам, подреждам</td></tr><tr><td>dağıtmak</td><td>раздавам, разпилявам</td></tr><tr><td>hazırlamak</td><td>подготвям</td></tr><tr><td>kontrol etmek</td><td>проверявам</td></tr><tr><td>sanmak</td><td>мисля, струва ми се</td></tr><tr><td>hissetmek</td><td>чувствам</td></tr><tr><td>fark etmek</td><td>забелязвам</td></tr><tr><td>göstermek</td><td>показвам</td></tr><tr><td>ulaşmak</td><td>достигам</td></tr><tr><td>katılmak</td><td>участвам; съгласявам се</td></tr><tr><td>iptal etmek</td><td>отменям</td></tr><tr><td>kavga etmek</td><td>карам се</td></tr></tbody></table><p><strong>Упр. 20.7 — Как е на турски?</strong> <em>(Türkçesi nedir?)</em></p><ol type=\"1\"><li>вземам решение</li><li>надявам се</li><li>ядосвам се</li><li>скучно ми е</li><li>харча</li><li>губя</li><li>забелязвам</li><li>отменям</li></ol><hr />\n<h1 id=\"част-iii-ниво-b1\">ЧАСТ III · НИВО B1</h1><h2 id=\"урок-21-косвена-реч-dolaylı-anlatım\">УРОК 21 · Косвена реч · Dolaylı anlatım</h2><h3>Речник · Sözlük</h3><table><thead><tr><th>Турски</th><th>Български</th></tr></thead><tbody><tr><td>söylemek</td><td>казвам (на някого)</td></tr><tr><td>demek</td><td>казвам, река (dedi)</td></tr><tr><td>anlatmak</td><td>разказвам, обяснявам</td></tr><tr><td>sormak</td><td>питам</td></tr><tr><td>cevap vermek</td><td>отговарям</td></tr><tr><td>bilmek</td><td>зная</td></tr><tr><td>duymak</td><td>чувам, узнавам</td></tr><tr><td>sanmak</td><td>мисля, струва ми се</td></tr><tr><td>düşünmek</td><td>мисля, смятам</td></tr><tr><td>inanmak</td><td>вярвам</td></tr><tr><td>haber</td><td>новина</td></tr><tr><td>yalan</td><td>лъжа</td></tr><tr><td>gerçek</td><td>истина, действителност</td></tr><tr><td>doğru</td><td>вярно, право</td></tr><tr><td>iddia etmek</td><td>твърдя</td></tr><tr><td>itiraf etmek</td><td>признавам</td></tr><tr><td>söz</td><td>дума; обещание</td></tr><tr><td>fikir</td><td>мисъл, мнение</td></tr><tr><td>emin</td><td>сигурен</td></tr><tr><td>belli</td><td>ясно, личи си</td></tr></tbody></table><h3>Граматика 21.1 — demek или söylemek</h3><p>Двата глагола не са взаимозаменяеми. <code>demek</code> въвежда <strong>пряка реч</strong> — думите както са казани. <code>söylemek</code> въвежда <strong>косвена реч</strong> и иска лице в дателен падеж.</p><table><thead><tr><th>Пряка реч (demek)</th><th>Косвена реч (söylemek)</th></tr></thead><tbody><tr><td>Ali: „Yarın geliyorum,“ dedi.</td><td>Ali yarın geldiğini söyledi.</td></tr><tr><td>Anne: „Ödevini yap,“ dedi.</td><td>Annem ödevimi yapmamı söyledi.</td></tr></tbody></table><p><strong>Внимание:</strong> <code>bana söyledi</code> (каза ми), но <del>bana dedi</del> е разговорно и се избягва в писмен текст. С <code>demek</code> се използва <code>bana dedi ki…</code>.</p><h3>Граматика 21.2 — Наставката -DIK (че + сегашно/минало)</h3><p>Турският няма съюз „че“. Вместо това цялото подчинено изречение се превръща в <strong>отглаголно име</strong> с наставката <code>-dık</code>, което после получава притежателно окончание и падеж.</p><table><thead><tr><th>Стъпка</th><th>Пример</th></tr></thead><tbody><tr><td>1. корен + -dık / -dik / -duk / -dük</td><td>gel- → geldik-</td></tr><tr><td>след ç f h k p s ş t → -tık</td><td>git- → gittik-</td></tr><tr><td>2. + притежателно окончание</td><td>geldiğ<strong>im</strong> (че аз съм дошъл)</td></tr><tr><td>3. + падеж според глагола</td><td>geldiğim<strong>i</strong> biliyor</td></tr></tbody></table><p><strong>k → ğ</strong> пред гласна: geldi<strong>k</strong> + im → geldi<strong>ğ</strong>im.</p><table><thead><tr><th>Лице</th><th>Форма</th><th>Превод</th></tr></thead><tbody><tr><td>ben</td><td>geldiğimi</td><td>че съм дошъл</td></tr><tr><td>sen</td><td>geldiğini</td><td>че си дошъл</td></tr><tr><td>o</td><td>geldiğini</td><td>че е дошъл</td></tr><tr><td>biz</td><td>geldiğimizi</td><td>че сме дошли</td></tr><tr><td>siz</td><td>geldiğinizi</td><td>че сте дошли</td></tr><tr><td>onlar</td><td>geldiklerini</td><td>че са дошли</td></tr></tbody></table><p><strong>Подлогът на подчиненото изречение отива в родителен падеж:</strong></p><p>Ali<strong>’nin</strong> geldiğini biliyorum. — Знам, че Али е дошъл.<br />Onlar<strong>ın</strong> İstanbul’da oturduklarını duydum. — Чух, че живеят в Истанбул.</p><h3>Граматика 21.3 — Наставката -ACAK (че + бъдеще)</h3><p>За бъдещо действие се използва <code>-acak / -ecek</code> по същата схема. Пак важи <strong>k → ğ</strong>: gelecek + im → gelece<strong>ğ</strong>im<strong>i</strong>.</p><table><thead><tr><th>Време в подчиненото изречение</th><th>Наставка</th><th>Пример</th></tr></thead><tbody><tr><td>сегашно / минало</td><td>-dık</td><td>Geldiğini söyledi. — Каза, че е дошъл.</td></tr><tr><td>бъдеще</td><td>-acak</td><td>Geleceğini söyledi. — Каза, че ще дойде.</td></tr></tbody></table><p>Ali’nin yarın geleceğini biliyorum. — Знам, че Али ще дойде утре.<br />Sınavı geçeceğimi sanmıyorum. — Не мисля, че ще изкарам изпита.</p><h3>Граматика 21.4 — Косвен въпрос</h3><p><strong>С въпросителна дума</strong> — думата остава, глаголът се превръща в -dık/-acak форма:</p><p>Nereye gittiğini bilmiyorum. — Не знам къде отиде.<br />Ne zaman geleceğini sordu. — Попита кога ще дойда.</p><p><strong>Въпрос с да/не</strong> — глаголът се повтаря положително и отрицателно с <code>-ıp</code>:</p><table><thead><tr><th>Пряк въпрос</th><th>Косвен въпрос</th></tr></thead><tbody><tr><td>Geldi mi?</td><td>Gelip gelmediğini bilmiyorum.</td></tr><tr><td>Gelecek mi?</td><td>Gelip gelmeyeceğini sordu.</td></tr><tr><td>Biliyor mu?</td><td>Bilip bilmediğini merak ediyorum.</td></tr></tbody></table><h3>Граматика 21.5 — Косвена заповед и молба</h3><p>Заповедта не се предава с -dık, а с <code>-ma / -me</code> + притежателно + винителен падеж, след което идва <code>söylemek</code>, <code>istemek</code> или <code>rica etmek</code>.</p><table><thead><tr><th>Пряка реч</th><th>Косвена реч</th></tr></thead><tbody><tr><td>„Gel!“</td><td>Gelmesini söyledim. — Казах му да дойде.</td></tr><tr><td>„Bekleyin.“</td><td>Beklememizi istedi. — Поиска да чакаме.</td></tr><tr><td>„Sigara içme.“</td><td>Sigara içmememi söyledi. — Каза ми да не пуша.</td></tr></tbody></table><h3>Прочети и отговори · Okuyup cevaplayın</h3><blockquote><p>Dün Mehmet beni aradı ve hafta sonu köye gideceğini söyledi. Bana da gelmemi istedi, ama işim olduğunu söyledim. Sonra kardeşinin de geleceğini, orada üç gün kalacaklarını anlattı. Ne zaman döneceklerini sordum; pazar akşamı döneceklerini söyledi.</p></blockquote><ol type=\"1\"><li>Mehmet nereye gidecek?</li><li>Konuşan kişi neden gitmiyor?</li><li>Mehmet’in yanında kim olacak?</li><li>Ne zaman dönecekler?</li></ol><h3>Упражнения · Alıştırmalar</h3><p><strong>Упр. 21.1 — Направи -dık форма за „ben“.</strong> <em>(„ben“ için -dık biçimini yazın.)</em></p><ol type=\"1\"><li>gelmek</li><li>gitmek</li><li>yapmak</li><li>okumak</li><li>bilmek</li><li>almak</li></ol><p><strong>Упр. 21.2 — Пряка реч → косвена (-dığını söyledi).</strong> <em>(Dolaylı anlatıma çevirin.)</em></p><p>Пример: Ali: „Geliyorum.“ → Ali geldiğini söyledi.</p><ol type=\"1\"><li>Ali: „Hastayım.“</li><li>Ayşe: „İstanbul’da oturuyorum.“</li><li>Mehmet: „Dün geldim.“</li><li>Öğretmen: „Sınav zor.“</li><li>Çocuklar: „Acıktık.“</li></ol><p><strong>Упр. 21.3 — -dık или -acak?</strong> <em>(-dık mı, -acak mı?)</em></p><ol type=\"1\"><li>Ali’nin dün ___ (gelmek) biliyorum.</li><li>Yarın ___ (yağmur yağmak) söylediler.</li><li>Sınavı ___ (geçmek — бъдеще) sanmıyorum.</li><li>Onun İzmir’de ___ (oturmak — сегашно) duydum.</li><li>Haftaya ___ (taşınmak — бъдеще) anlattı.</li></ol><p><strong>Упр. 21.4 — Направи косвен въпрос.</strong> <em>(Dolaylı soru yapın.)</em></p><ol type=\"1\"><li>Nereye gitti?</li><li>Ne zaman gelecek?</li><li>Geldi mi?</li><li>Biliyor mu?</li><li>Kaç yaşında?</li></ol><p><strong>Упр. 21.5 — Косвена заповед.</strong> <em>(Dolaylı emir.)</em></p><ol type=\"1\"><li>„Gel!“ (söylemek)</li><li>„Bekle.“ (istemek)</li><li>„Sigara içme.“ (söylemek)</li><li>„Pencereyi aç.“ (rica etmek)</li><li>„Erken kalkın.“ (istemek)</li></ol><p><strong>Упр. 21.6 — Преведи на турски.</strong> <em>(Türkçeye çevirin.)</em></p><ol type=\"1\"><li>Знам, че Али е дошъл.</li><li>Каза, че ще дойде утре.</li><li>Не знам къде отиде.</li><li>Чух, че живеят в Истанбул.</li><li>Попита кога ще се върнем.</li><li>Казах му да дойде.</li><li>Не мисля, че ще завали.</li><li>Не знам дали е дошъл.</li></ol><h3>Тематичен речник · Konu sözlüğü — Разговор и мнение · Konuşma ve fikir</h3><table><thead><tr><th>Türkçe</th><th>Български</th></tr></thead><tbody><tr><td>sohbet</td><td>разговор, беседа</td></tr><tr><td>tartışma</td><td>спор, дискусия</td></tr><tr><td>tartışmak</td><td>споря, обсъждам</td></tr><tr><td>itiraz etmek</td><td>възразявам</td></tr><tr><td>katılmak</td><td>съгласявам се; участвам</td></tr><tr><td>savunmak</td><td>защитавам (мнение)</td></tr><tr><td>ikna etmek</td><td>убеждавам</td></tr><tr><td>ikna olmak</td><td>убеждавам се</td></tr><tr><td>kanıt</td><td>доказателство</td></tr><tr><td>örnek vermek</td><td>давам пример</td></tr><tr><td>açıklamak</td><td>обяснявам</td></tr><tr><td>özetlemek</td><td>обобщавам</td></tr><tr><td>sözünü kesmek</td><td>прекъсвам някого</td></tr><tr><td>dinleyici</td><td>слушател</td></tr><tr><td>konuşmacı</td><td>говорител, лектор</td></tr><tr><td>fikir ayrılığı</td><td>различие в мненията</td></tr><tr><td>ortak nokta</td><td>обща точка</td></tr><tr><td>çözüm</td><td>решение</td></tr><tr><td>öneri</td><td>предложение</td></tr><tr><td>önermek</td><td>предлагам</td></tr><tr><td>kabul etmek</td><td>приемам</td></tr><tr><td>reddetmek</td><td>отхвърлям</td></tr><tr><td>şüphelenmek</td><td>съмнявам се</td></tr><tr><td>güvenmek</td><td>доверявам се</td></tr><tr><td>yorum yapmak</td><td>коментирам</td></tr><tr><td>eleştirmek</td><td>критикувам</td></tr><tr><td>övmek</td><td>хваля</td></tr><tr><td>şaka yapmak</td><td>шегувам се</td></tr><tr><td>ciddiye almak</td><td>вземам на сериозно</td></tr><tr><td>yanlış anlamak</td><td>разбирам погрешно</td></tr><tr><td>açık sözlü</td><td>откровен</td></tr><tr><td>kısaca</td><td>накратко</td></tr><tr><td>ayrıntı</td><td>подробност</td></tr><tr><td>konu dışı</td><td>извън темата</td></tr><tr><td>sözünde durmak</td><td>държа на думата си</td></tr><tr><td>haklı çıkmak</td><td>излизам прав</td></tr><tr><td>susmak</td><td>мълча</td></tr><tr><td>bağırmak</td><td>викам</td></tr><tr><td>fısıldamak</td><td>шепна</td></tr><tr><td>çekinmeden</td><td>без стеснение</td></tr><tr><td>aslında</td><td>всъщност</td></tr><tr><td>bence</td><td>според мен</td></tr><tr><td>kesinlikle</td><td>със сигурност</td></tr><tr><td>belki de</td><td>може би пък</td></tr><tr><td>her hâlükârda</td><td>при всички положения</td></tr></tbody></table><p><strong>Упр. 21.7 — Как е на турски?</strong> <em>(Türkçesi nedir?)</em></p><ol type=\"1\"><li>спор</li><li>убеждавам</li><li>възразявам</li><li>доказателство</li><li>предложение</li><li>критикувам</li><li>прекъсвам някого</li><li>мълча</li><li>подробност</li><li>накратко</li></ol><hr /><h2 id=\"урок-22-понудителен-залог-ettirgen-çatı\">УРОК 22 · Понудителен залог · Ettirgen çatı</h2><h3>Речник · Sözlük</h3><table><thead><tr><th>Турски</th><th>Български</th></tr></thead><tbody><tr><td>yaptırmak</td><td>карам да направят, поръчвам</td></tr><tr><td>kestirmek</td><td>давам да подстрижат/отрежат</td></tr><tr><td>temizletmek</td><td>давам да почистят</td></tr><tr><td>tamir ettirmek</td><td>давам на ремонт</td></tr><tr><td>yedirmek</td><td>храня, давам да яде</td></tr><tr><td>içirmek</td><td>давам да пие</td></tr><tr><td>giydirmek</td><td>обличам (някого)</td></tr><tr><td>uyutmak</td><td>приспивам</td></tr><tr><td>güldürmek</td><td>разсмивам</td></tr><tr><td>ağlatmak</td><td>разплаквам</td></tr><tr><td>öldürmek</td><td>убивам</td></tr><tr><td>bitirmek</td><td>завършвам, свършвам нещо</td></tr><tr><td>başlatmak</td><td>започвам нещо, пускам в ход</td></tr><tr><td>hatırlatmak</td><td>напомням</td></tr><tr><td>berber</td><td>бръснар</td></tr><tr><td>kuaför</td><td>фризьор</td></tr><tr><td>terzi</td><td>шивач</td></tr><tr><td>usta</td><td>майстор</td></tr><tr><td>saç</td><td>коса</td></tr><tr><td>boya</td><td>боя</td></tr></tbody></table><h3>Граматика 22.1 — Какво прави понудителният залог</h3><p>Понудителният залог (каузатив) показва, че подлогът <strong>не върши действието сам</strong>, а кара или оставя друг да го извърши. Българският го предава описателно — „карам да“, „давам да“, „възлагам“.</p><table><thead><tr><th>Обикновен глагол</th><th>Понудителен</th><th>Превод</th></tr></thead><tbody><tr><td>Ev yaptım.</td><td>Ev yaptırdım.</td><td>Построих си къща (наех майстори).</td></tr><tr><td>Saçımı kestim.</td><td>Saçımı kestirdim.</td><td>Подстригах се (при бръснар).</td></tr><tr><td>Çocuk yedi.</td><td>Çocuğa yemek yedirdim.</td><td>Нахраних детето.</td></tr></tbody></table><p>Това е <strong>ежедневна</strong> форма, не книжна: за всичко, което правиш чрез друг човек — фризьор, шивач, майстор, сервиз — турският задължително използва каузатив.</p><h3>Граматика 22.2 — Четирите наставки</h3><table><thead><tr><th>Наставка</th><th>Кога</th><th>Примери</th></tr></thead><tbody><tr><td>-dır- / -dir- / -dur- / -dür-</td><td>най-често; след повечето корени</td><td>yap- → yap<strong>tır</strong>mak, öl- → öl<strong>dür</strong>mek, bil- → bil<strong>dir</strong>mek</td></tr><tr><td>-t-</td><td>след корен на гласна, <code>l</code> или <code>r</code> с 2+ срички</td><td>temizle- → temizle<strong>t</strong>mek, otur- → otur<strong>t</strong>mak, uya- → uya<strong>t</strong>mak</td></tr><tr><td>-ır- / -ir- / -ur- / -ür-</td><td>малка затворена група</td><td>iç- → iç<strong>ir</strong>mek, bit- → bit<strong>ir</strong>mek, doğ- → doğ<strong>ur</strong>mak</td></tr><tr><td>-ar- / -er-</td><td>още по-малка група</td><td>çık- → çık<strong>ar</strong>mak, kop- → kop<strong>ar</strong>mak, gid- → gid<strong>er</strong>mek</td></tr></tbody></table><p>Групите с <code>-ır-</code> и <code>-ar-</code> се <strong>заучават наизуст</strong> — те са малко на брой, но са сред най-честите глаголи в езика.</p><p><strong>Неправилни, но много чести:</strong> ye- → <code>yedirmek</code>, gel- → <code>getirmek</code> (донасям), git- → <code>götürmek</code> (отнасям), gör- → <code>göstermek</code> (показвам), kalk- → <code>kaldırmak</code> (вдигам).</p><h3>Граматика 22.3 — Падежите се разместват</h3><p>Щом добавиш каузатив, изречението получава нов участник — и падежите се преподреждат:</p><table><thead><tr><th>Изречение</th><th>Кой какъв е</th></tr></thead><tbody><tr><td>Çocuk yemek yedi.</td><td>çocuk = подлог</td></tr><tr><td>Anne çocuğ<strong>a</strong> yemek yedirdi.</td><td>anne = подлог, çocuğ<strong>a</strong> = дателен</td></tr><tr><td>Ali mektub<strong>u</strong> yazdı.</td><td>Ali = подлог</td></tr><tr><td>Müdür Ali<strong>’ye</strong> mektub<strong>u</strong> yazdırdı.</td><td>изпълнителят minaва в дателен падеж</td></tr></tbody></table><p><strong>Правило:</strong> ако глаголът вече има пряко допълнение (винителен падеж), новият изпълнител отива в <strong>дателен</strong>. Ако няма, изпълнителят отива във <strong>винителен</strong>: Çocuğ<strong>u</strong> uyuttum. — Приспах детето.</p><h3>Граматика 22.4 — Двоен каузатив</h3><p>Наставките могат да се трупат — всяко ниво добавя по един посредник:</p><p>temizle<strong>mek</strong> (чистя) → temizle<strong>t</strong>mek (карам да почистят) → temizle<strong>ttir</strong>mek (карам някого да накара трети да почисти).</p><p>Ev<strong>i</strong> temizlettim. — Дадох да почистят къщата.<br />Müdür sekretere ev<strong>i</strong> temizlettirdi. — Директорът накара секретарката да уреди почистването.</p><h3>Прочети и отговори · Okuyup cevaplayın</h3><blockquote><p>Geçen hafta çok işim vardı. Önce arabamı tamir ettirdim, sonra kuaförde saçımı kestirdim. Eve dönerken pastaneden bir pasta yaptırdım, çünkü kızımın doğum günüydü. Akşam çocukları erken yatırdım ama kızım heyecandan uyumadı; ona bir masal okudum ve sonunda uyuttum.</p></blockquote><ol type=\"1\"><li>Yazar arabasını ne yaptı?</li><li>Saçını nerede kestirdi?</li><li>Pastayı neden yaptırdı?</li><li>Kızı neden uyumadı?</li></ol><h3>Упражнения · Alıştırmalar</h3><p><strong>Упр. 22.1 — Направи понудителна форма.</strong> <em>(Ettirgen biçimi yazın.)</em></p><ol type=\"1\"><li>yapmak</li><li>kesmek</li><li>temizlemek</li><li>içmek</li><li>gülmek</li><li>oturmak</li><li>bitmek</li><li>ölmek</li></ol><p><strong>Упр. 22.2 — Кой глагол е неправилен? Напиши формата.</strong> <em>(Düzensiz biçimi yazın.)</em></p><ol type=\"1\"><li>yemek</li><li>gelmek</li><li>gitmek</li><li>görmek</li><li>kalkmak</li></ol><p><strong>Упр. 22.3 — Постави правилния падеж.</strong> <em>(Doğru hâl ekini koyun.)</em></p><ol type=\"1\"><li>Anne çocuğ___ yemek yedirdi.</li><li>Çocuğ___ uyuttum.</li><li>Müdür Ali___ mektubu yazdırdı.</li><li>Berber saçım___ kesti.</li><li>Öğretmen öğrenciler___ kitabı okuttu.</li></ol><p><strong>Упр. 22.4 — Преработи с каузатив.</strong> <em>(Ettirgen çatıya çevirin.)</em></p><ol type=\"1\"><li>Saçımı kestim. (при бръснар)</li><li>Evi temizledim. (наех човек)</li><li>Arabayı tamir ettim. (в сервиз)</li><li>Elbiseyi diktim. (при шивач)</li><li>Çocuk uyudu. (аз го приспах)</li></ol><p><strong>Упр. 22.5 — Преведи на турски.</strong> <em>(Türkçeye çevirin.)</em></p><ol type=\"1\"><li>Подстригах се вчера.</li><li>Дадох колата на ремонт.</li><li>Нахраних детето.</li><li>Приспах децата рано.</li><li>Този филм ме разсмя.</li><li>Директорът накара Али да напише писмото.</li><li>Дадохме да ни построят къща.</li><li>Напомни ми утре.</li></ol><h3>Тематичен речник · Konu sözlüğü — Услуги и занаяти · Hizmetler ve zanaatlar</h3><table><thead><tr><th>Türkçe</th><th>Български</th></tr></thead><tbody><tr><td>servis</td><td>сервиз</td></tr><tr><td>tamirci</td><td>техник, майстор</td></tr><tr><td>tamir</td><td>ремонт</td></tr><tr><td>arıza</td><td>повреда</td></tr><tr><td>arızalanmak</td><td>повреждам се</td></tr><tr><td>bakım</td><td>поддръжка, обслужване</td></tr><tr><td>garanti</td><td>гаранция</td></tr><tr><td>yedek parça</td><td>резервна част</td></tr><tr><td>montaj</td><td>монтаж</td></tr><tr><td>kurulum</td><td>инсталиране</td></tr><tr><td>boyacı</td><td>бояджия</td></tr><tr><td>marangoz</td><td>дърводелец</td></tr><tr><td>camcı</td><td>стъклар</td></tr><tr><td>çilingir</td><td>ключар</td></tr><tr><td>ayakkabıcı</td><td>обущар</td></tr><tr><td>saatçi</td><td>часовникар</td></tr><tr><td>kuru temizleme</td><td>химическо чистене</td></tr><tr><td>dikiş</td><td>шев, шиене</td></tr><tr><td>prova</td><td>проба (при шивач)</td></tr><tr><td>ölçü almak</td><td>вземам мярка</td></tr><tr><td>kısaltmak</td><td>скъсявам</td></tr><tr><td>uzatmak</td><td>удължавам</td></tr><tr><td>onarmak</td><td>поправям</td></tr><tr><td>sökmek</td><td>разглобявам, разпарям</td></tr><tr><td>takmak</td><td>поставям, слагам</td></tr><tr><td>vidalamak</td><td>завинтвам</td></tr><tr><td>çivi</td><td>пирон</td></tr><tr><td>çekiç</td><td>чук</td></tr><tr><td>tornavida</td><td>отвертка</td></tr><tr><td>matkap</td><td>бормашина</td></tr><tr><td>merdiven</td><td>стълба</td></tr><tr><td>zımpara</td><td>шкурка</td></tr><tr><td>fatura</td><td>фактура, сметка</td></tr><tr><td>makbuz</td><td>квитанция</td></tr><tr><td>peşin</td><td>в брой, предварително</td></tr><tr><td>taksitle</td><td>на изплащане</td></tr><tr><td>ücret</td><td>такса, цена на услуга</td></tr><tr><td>ücretsiz</td><td>безплатен</td></tr><tr><td>randevu almak</td><td>запазвам час</td></tr><tr><td>teslim etmek</td><td>предавам</td></tr><tr><td>teslim almak</td><td>получавам</td></tr><tr><td>söz vermek</td><td>обещавам</td></tr><tr><td>gecikmek</td><td>закъснявам</td></tr><tr><td>acil</td><td>спешен</td></tr><tr><td>uzman</td><td>специалист</td></tr></tbody></table><p><strong>Упр. 22.6 — Как е на турски?</strong> <em>(Türkçesi nedir?)</em></p><ol type=\"1\"><li>ремонт</li><li>повреда</li><li>гаранция</li><li>ключар</li><li>дърводелец</li><li>отвертка</li><li>на изплащане</li><li>безплатен</li><li>запазвам час</li><li>резервна част</li></ol><hr /><h2 id=\"урок-23-възвратен-и-взаимен-залог-dönüşlü-ve-işteş-çatı\">УРОК 23 · Възвратен и взаимен залог · Dönüşlü ve işteş çatı</h2><h3>Речник · Sözlük</h3><table><thead><tr><th>Турски</th><th>Български</th></tr></thead><tbody><tr><td>yıkanmak</td><td>мия се, къпя се</td></tr><tr><td>giyinmek</td><td>обличам се</td></tr><tr><td>taranmak</td><td>реша се</td></tr><tr><td>hazırlanmak</td><td>приготвям се</td></tr><tr><td>süslenmek</td><td>гиздя се, разкрасявам се</td></tr><tr><td>çekinmek</td><td>стеснявам се, свеня се</td></tr><tr><td>dövünmek</td><td>бия се от мъка, кая се</td></tr><tr><td>sevinmek</td><td>радвам се</td></tr><tr><td>tanışmak</td><td>запознавам се</td></tr><tr><td>görüşmek</td><td>виждаме се, срещаме се</td></tr><tr><td>buluşmak</td><td>срещаме се (по уговорка)</td></tr><tr><td>anlaşmak</td><td>разбираме се, споразумяваме се</td></tr><tr><td>kavga etmek</td><td>карам се, бия се</td></tr><tr><td>yardımlaşmak</td><td>помагаме си</td></tr><tr><td>selamlaşmak</td><td>поздравяваме се</td></tr><tr><td>mektuplaşmak</td><td>кореспондираме си</td></tr><tr><td>bakışmak</td><td>споглеждаме се</td></tr><tr><td>ayna</td><td>огледало</td></tr><tr><td>kendi</td><td>сам, свой</td></tr><tr><td>birbiri</td><td>един друг</td></tr></tbody></table><h3>Граматика 23.1 — Четирите залога наведнъж</h3><p>Турският има четири залога и всички се образуват с наставка между корена и времето. Ето ги едно до друго с корена <code>yıka-</code> (мия):</p><table><thead><tr><th>Залог</th><th>Наставка</th><th>Пример</th><th>Превод</th></tr></thead><tbody><tr><td>действителен</td><td>—</td><td>yıkamak</td><td>мия (нещо)</td></tr><tr><td>страдателен</td><td>-ıl- / -n-</td><td>yıkanmak</td><td>бива измито</td></tr><tr><td>възвратен</td><td>-ın-</td><td>yıkanmak</td><td>мия се</td></tr><tr><td>взаимен</td><td>-ış-</td><td>yıkaşmak <em>(рядко)</em></td><td>мием се взаимно</td></tr><tr><td>понудителен</td><td>-t- / -dır-</td><td>yıkatmak</td><td>давам да измият</td></tr></tbody></table><p><strong>Важно:</strong> страдателният и възвратният залог често изглеждат <strong>еднакво</strong>. Разликата се вижда само от контекста: <code>Çamaşırlar yıkandı.</code> — Прането беше изпрано <em>(страдателен)</em>; <code>Çocuk yıkandı.</code> — Детето се изкъпа <em>(възвратен)</em>.</p><h3>Граматика 23.2 — Възвратен залог: -In-</h3><p>Действието се връща върху самия вършител. Наставката е <code>-ın- / -in- / -un- / -ün-</code>, а след гласна — само <code>-n-</code>.</p><table><thead><tr><th>Основен глагол</th><th>Възвратен</th><th>Превод</th></tr></thead><tbody><tr><td>yıkamak (мия)</td><td>yıka<strong>n</strong>mak</td><td>мия се</td></tr><tr><td>giymek (обличам)</td><td>giy<strong>in</strong>mek</td><td>обличам се</td></tr><tr><td>taramak (реша)</td><td>tara<strong>n</strong>mak</td><td>реша се</td></tr><tr><td>hazırlamak (приготвям)</td><td>hazırla<strong>n</strong>mak</td><td>приготвям се</td></tr><tr><td>sevmek (обичам)</td><td>sev<strong>in</strong>mek</td><td>радвам се</td></tr></tbody></table><p>За подсилване се добавя <code>kendi</code> (сам, себе си): <code>Kendi kendine giyindi.</code> — Облече се сам.</p><h3>Граматика 23.3 — Взаимен залог: -Iş-</h3><p>Двама или повече вършат действието <strong>един спрямо друг</strong> или <strong>заедно</strong>. Наставката е <code>-ış- / -iş- / -uş- / -üş-</code>, след гласна — <code>-ş-</code>.</p><table><thead><tr><th>Основен глагол</th><th>Взаимен</th><th>Превод</th></tr></thead><tbody><tr><td>görmek (виждам)</td><td>gör<strong>üş</strong>mek</td><td>виждаме се, разговаряме</td></tr><tr><td>tanımak (познавам)</td><td>tanı<strong>ş</strong>mak</td><td>запознаваме се</td></tr><tr><td>bulmak (намирам)</td><td>bul<strong>uş</strong>mak</td><td>срещаме се</td></tr><tr><td>anlamak (разбирам)</td><td>anla<strong>ş</strong>mak</td><td>разбираме се</td></tr><tr><td>bakmak (гледам)</td><td>bak<strong>ış</strong>mak</td><td>споглеждаме се</td></tr><tr><td>yardım etmek (помагам)</td><td>yardım<strong>laş</strong>mak</td><td>помагаме си</td></tr></tbody></table><p>Взаимният залог върви с <code>birbiri</code> (един друг) или с <code>ile / -le</code>:</p><p>Ali ile Ayşe dün tanıştılar. — Али и Айше се запознаха вчера.<br />Birbirimize yardım ediyoruz. — Помагаме си един на друг.<br />Saat beşte buluşalım. — Да се срещнем в пет.</p><h3>Граматика 23.4 — -laş- / -leş-: „ставам такъв“</h3><p>Добавена към <strong>име или прилагателно</strong>, същата наставка означава превръщане:</p><table><thead><tr><th>Дума</th><th>Глагол</th><th>Превод</th></tr></thead><tbody><tr><td>güzel (хубав)</td><td>güzelleşmek</td><td>разхубавявам се</td></tr><tr><td>sert (твърд)</td><td>sertleşmek</td><td>втвърдявам се</td></tr><tr><td>modern</td><td>modernleşmek</td><td>модернизирам се</td></tr><tr><td>az (малко)</td><td>azalmak</td><td>намалявам</td></tr><tr><td>kötü (лош)</td><td>kötüleşmek</td><td>влошавам се</td></tr></tbody></table><h3>Прочети и отговори · Okuyup cevaplayın</h3><blockquote><p>Ali ile Mehmet üniversitede tanışmışlar. O zamandan beri her hafta buluşuyor, sınavlardan önce yardımlaşıyorlar. Geçen ay küçük bir konu yüzünden kavga etmişler, ama iki gün sonra anlaşmışlar. Ali diyor ki: „İyi arkadaşlar tartışır, sonra barışır.“</p></blockquote><ol type=\"1\"><li>Ali ile Mehmet nerede tanışmışlar?</li><li>Sınavlardan önce ne yapıyorlar?</li><li>Geçen ay ne olmuş?</li><li>Ali’ye göre iyi arkadaşlar ne yapar?</li></ol><h3>Упражнения · Alıştırmalar</h3><p><strong>Упр. 23.1 — Направи възвратна форма.</strong> <em>(Dönüşlü biçimi yazın.)</em></p><ol type=\"1\"><li>yıkamak</li><li>giymek</li><li>taramak</li><li>hazırlamak</li><li>sevmek</li><li>süslemek</li></ol><p><strong>Упр. 23.2 — Направи взаимна форма.</strong> <em>(İşteş biçimi yazın.)</em></p><ol type=\"1\"><li>görmek</li><li>tanımak</li><li>bulmak</li><li>anlamak</li><li>bakmak</li><li>selamlamak</li></ol><p><strong>Упр. 23.3 — Възвратен или страдателен?</strong> <em>(Dönüşlü mü, edilgen mi?)</em></p><ol type=\"1\"><li>Çocuk yıkandı.</li><li>Çamaşırlar yıkandı.</li><li>Kapı açıldı.</li><li>Ayşe hazırlandı.</li><li>Mektup yazıldı.</li></ol><p><strong>Упр. 23.4 — Направи глагол с -laş- / -leş-.</strong> <em>(-laş- / -leş- ile fiil yapın.)</em></p><ol type=\"1\"><li>güzel</li><li>sert</li><li>modern</li><li>kötü</li><li>aynı</li></ol><p><strong>Упр. 23.5 — Преведи на турски.</strong> <em>(Türkçeye çevirin.)</em></p><ol type=\"1\"><li>Детето се изкъпа.</li><li>Облякох се бързо.</li><li>Запознахме се миналата година.</li><li>Да се срещнем в пет.</li><li>Помагаме си един на друг.</li><li>Разбрахме се.</li><li>Времето се влоши.</li><li>Той се приготви сам.</li></ol>\n<hr />\n<h3>Тематичен речник · Konu sözlüğü — Отношения и чувства · İlişkiler ve duygular</h3><table><thead><tr><th>Türkçe</th><th>Български</th></tr></thead><tbody><tr><td>ilişki</td><td>отношение, връзка</td></tr><tr><td>arkadaşlık</td><td>приятелство</td></tr><tr><td>dostluk</td><td>дружба</td></tr><tr><td>güven</td><td>доверие</td></tr><tr><td>saygı</td><td>уважение</td></tr><tr><td>sevgi</td><td>обич</td></tr><tr><td>aşk</td><td>любов</td></tr><tr><td>kıskançlık</td><td>ревност</td></tr><tr><td>kıskanmak</td><td>ревнувам, завиждам</td></tr><tr><td>özlemek</td><td>липсва ми, тъгувам за</td></tr><tr><td>darılmak</td><td>обиждам се</td></tr><tr><td>küsmek</td><td>сърдя се, прекъсвам общуване</td></tr><tr><td>barışmak</td><td>сдобрявам се</td></tr><tr><td>affetmek</td><td>прощавам</td></tr><tr><td>özür dilemek</td><td>извинявам се</td></tr><tr><td>minnet</td><td>признателност</td></tr><tr><td>destek olmak</td><td>подкрепям</td></tr><tr><td>sırdaş</td><td>доверен приятел</td></tr><tr><td>yalnızlık</td><td>самота</td></tr><tr><td>mutluluk</td><td>щастие</td></tr><tr><td>üzüntü</td><td>мъка</td></tr><tr><td>korku</td><td>страх</td></tr><tr><td>öfke</td><td>гняв</td></tr><tr><td>sinirlenmek</td><td>ядосвам се</td></tr><tr><td>sakinleşmek</td><td>успокоявам се</td></tr><tr><td>heyecan</td><td>вълнение</td></tr><tr><td>utanmak</td><td>срамувам се</td></tr><tr><td>gurur</td><td>гордост</td></tr><tr><td>gurur duymak</td><td>гордея се</td></tr><tr><td>hayal kırıklığı</td><td>разочарование</td></tr><tr><td>umut</td><td>надежда</td></tr><tr><td>umutsuz</td><td>безнадежден</td></tr><tr><td>endişe</td><td>тревога</td></tr><tr><td>endişelenmek</td><td>тревожа се</td></tr><tr><td>rahatlamak</td><td>отпускам се</td></tr><tr><td>sarılmak</td><td>прегръщам</td></tr><tr><td>evlilik</td><td>брак</td></tr><tr><td>nişan</td><td>годеж</td></tr><tr><td>ayrılık</td><td>раздяла</td></tr><tr><td>vazgeçmek</td><td>отказвам се</td></tr><tr><td>anlayış</td><td>разбиране</td></tr><tr><td>hoşgörü</td><td>търпимост</td></tr><tr><td>samimiyet</td><td>искреност</td></tr><tr><td>içten</td><td>сърдечен, искрен</td></tr><tr><td>vefalı</td><td>верен, предан</td></tr></tbody></table><p><strong>Упр. 23.6 — Как е на турски?</strong> <em>(Türkçesi nedir?)</em></p><ol type=\"1\"><li>доверие</li><li>уважение</li><li>ревнувам</li><li>липсва ми</li><li>прощавам</li><li>разочарование</li><li>тревожа се</li><li>прегръщам</li><li>самота</li><li>гордея се</li></ol><hr /><h2 id=\"урок-24-сложни-времена-birleşik-zamanlar\">УРОК 24 · Сложни времена · Birleşik zamanlar</h2><h3>Речник · Sözlük</h3><table><thead><tr><th>Турски</th><th>Български</th></tr></thead><tbody><tr><td>eskiden</td><td>едно време, някога</td></tr><tr><td>o zamanlar</td><td>по онова време</td></tr><tr><td>çocukken</td><td>като дете</td></tr><tr><td>her yaz</td><td>всяко лято</td></tr><tr><td>genellikle</td><td>обикновено</td></tr><tr><td>ara sıra</td><td>от време на време</td></tr><tr><td>hiç</td><td>никак; никога</td></tr><tr><td>artık</td><td>вече, отсега нататък</td></tr><tr><td>hâlâ</td><td>все още</td></tr><tr><td>henüz</td><td>още не</td></tr><tr><td>meğer</td><td>оказало се, че</td></tr><tr><td>demek ki</td><td>значи, излиза че</td></tr><tr><td>aslında</td><td>всъщност</td></tr><tr><td>gerçekten</td><td>наистина</td></tr><tr><td>neredeyse</td><td>почти</td></tr><tr><td>az kalsın</td><td>за малко да</td></tr><tr><td>planlamak</td><td>планирам</td></tr><tr><td>vazgeçmek</td><td>отказвам се</td></tr><tr><td>ertelemek</td><td>отлагам</td></tr><tr><td>başarmak</td><td>успявам, справям се</td></tr></tbody></table><h3>Граматика 24.1 — Какво е сложно време</h3><p>Сложното време = <strong>основно време + помощен глагол</strong>. Помощният глагол е формата на <code>imek</code>, която в съвременния език се пише слято: <code>-ydı</code>, <code>-ymış</code>, <code>-ysa</code>.</p><table><thead><tr><th>Помощник</th><th>Име</th><th>Какво добавя</th></tr></thead><tbody><tr><td>-ydı / -ydi</td><td>разказвателно (hikâye)</td><td>мести действието в миналото</td></tr><tr><td>-ymış / -ymiş</td><td>преизказно (rivayet)</td><td>„казват, че“ — чуто от друг</td></tr><tr><td>-ysa / -yse</td><td>условно (şart)</td><td>„ако“</td></tr></tbody></table><p>Схемата винаги е една и съща: <strong>корен + време + помощник + лице</strong>.</p><h3>Граматика 24.2 — Разказвателните форми (-ydı)</h3><table><thead><tr><th>Основно време</th><th>Сложна форма</th><th>Превод</th></tr></thead><tbody><tr><td>geliyor</td><td>geliyor<strong>du</strong></td><td>идваше (в онзи момент)</td></tr><tr><td>gelir</td><td>gelir<strong>di</strong></td><td>идваше (обикновено, навик)</td></tr><tr><td>gelmiş</td><td>gelmiş<strong>ti</strong></td><td>беше дошъл (преди друго минало)</td></tr><tr><td>gelecek</td><td>gelecek<strong>ti</strong></td><td>щеше да дойде</td></tr><tr><td>gelmeli</td><td>gelmeli<strong>ydi</strong></td><td>трябваше да дойде</td></tr></tbody></table><p>Разликата между <code>geliyordu</code> и <code>gelirdi</code> е същата като в българския между „идваше“ (тогава, в момента) и „идваше“ (всяко лято, по навик):</p><p>Dün saat üçte ders çalışıyordum. — Вчера в три учех.<br />Çocukken her yaz köye giderdik. — Като деца всяко лято ходехме на село.<br />Tren kalkmıştı. — Влакът беше тръгнал <em>(преди да стигна)</em>.<br />Gelecektim ama işim çıktı. — Щях да дойда, но ми изникна работа.</p><h3>Граматика 24.3 — Лицата при -ydı</h3><table><thead><tr><th>Лице</th><th>geliyordum</th><th>gelirdim</th><th>gelmiştim</th></tr></thead><tbody><tr><td>ben</td><td>geliyordum</td><td>gelirdim</td><td>gelmiştim</td></tr><tr><td>sen</td><td>geliyordun</td><td>gelirdin</td><td>gelmiştin</td></tr><tr><td>o</td><td>geliyordu</td><td>gelirdi</td><td>gelmişti</td></tr><tr><td>biz</td><td>geliyorduk</td><td>gelirdik</td><td>gelmiştik</td></tr><tr><td>siz</td><td>geliyordunuz</td><td>gelirdiniz</td><td>gelmiştiniz</td></tr><tr><td>onlar</td><td>geliyorlardı</td><td>gelirlerdi</td><td>gelmişlerdi</td></tr></tbody></table><p><strong>Внимание:</strong> личното окончание идва <strong>след</strong> помощника, не преди него: gel<strong>iyordu-m</strong>, а не <del>geliyorum-du</del>.</p><h3>Граматика 24.4 — Преизказните форми (-ymış)</h3><p>Добавя се, когато говорещият не е бил свидетел — чул е, разбрал е, изненадан е:</p><table><thead><tr><th>Форма</th><th>Превод</th></tr></thead><tbody><tr><td>geliyormuş</td><td>идвал (казват)</td></tr><tr><td>gelirmiş</td><td>идвал обикновено (казват)</td></tr><tr><td>gelecekmiş</td><td>щял да дойде</td></tr><tr><td>gelmeliymiş</td><td>трябвало да дойде</td></tr><tr><td>hastaymış</td><td>бил болен</td></tr></tbody></table><p>Ali gelmeyecekmiş. — Али нямало да дойде <em>(така казаха)</em>.<br />Meğer bizi beklemiyorlarmış. — Оказало се, че изобщо не са ни чакали.</p><h3>Граматика 24.5 — Условните форми (-ysa)</h3><table><thead><tr><th>Форма</th><th>Превод</th></tr></thead><tbody><tr><td>geliyorsa</td><td>ако идва (сега)</td></tr><tr><td>geldiyse</td><td>ако е дошъл</td></tr><tr><td>gelecekse</td><td>ако ще идва</td></tr><tr><td>gelirse</td><td>ако дойде</td></tr><tr><td>hastaysa</td><td>ако е болен</td></tr></tbody></table><p>Разликата с урок 13: <code>gelirse</code> е <strong>условие за бъдещето</strong>, а <code>geliyorsa</code> / <code>geldiyse</code> са <strong>предположения за факт</strong> — „ако наистина е така“.</p><p>Yağmur yağarsa gitmeyiz. — Ако завали, няма да ходим.<br />Bu kadar yorgunsan biraz dinlen. — Щом си толкова уморен, си почини.</p><h3>Прочети и отговори · Okuyup cevaplayın</h3><blockquote><p>Çocukken her yaz dedemin köyüne giderdik. Sabahları erken kalkar, bahçede çalışırdık. Bir yaz gittiğimizde dedem yeni bir kuyu kazdırmıştı. O zamanlar köyde elektrik yokmuş, akşamları lambayla otururlarmış. Geçen sene tekrar gidecektim ama işlerim yüzünden erteledim.</p></blockquote><ol type=\"1\"><li>Çocukken her yaz nereye giderlerdi?</li><li>Dede ne yaptırmıştı?</li><li>Eskiden köyde ne yokmuş?</li><li>Geçen sene neden gidememiş?</li></ol><h3>Упражнения · Alıştırmalar</h3><p><strong>Упр. 24.1 — Направи разказвателна форма (-ydı) за „ben“.</strong> <em>(Hikâye biçimini yazın.)</em></p><ol type=\"1\"><li>geliyor</li><li>gelir</li><li>gelmiş</li><li>gelecek</li><li>gelmeli</li></ol><p><strong>Упр. 24.2 — „тогава“ или „по навик“? Избери geliyordu / gelirdi.</strong> <em>(Doğru biçimi seçin.)</em></p><ol type=\"1\"><li>Dün saat üçte ders ___ (çalışmak).</li><li>Çocukken her yaz köye ___ (gitmek).</li><li>O sırada televizyon ___ (izlemek — biz).</li><li>Eskiden her sabah yürüyüş ___ (yapmak — o).</li><li>Telefon çaldığında ___ (uyumak — ben).</li></ol><p><strong>Упр. 24.3 — Направи преизказна форма (-ymış).</strong> <em>(Rivayet biçimini yazın.)</em></p><ol type=\"1\"><li>geliyor</li><li>gelecek</li><li>gelir</li><li>hasta</li><li>gelmeli</li></ol><p><strong>Упр. 24.4 — Постави в -mıştı (предминало).</strong> <em>(-mıştı biçimine çevirin.)</em></p><ol type=\"1\"><li>Tren kalktı.</li><li>Yemek bitti.</li><li>Onlar gitti.</li><li>Ben görmedim.</li><li>Sen söyledin.</li></ol><p><strong>Упр. 24.5 — Преведи на турски.</strong> <em>(Türkçeye çevirin.)</em></p><ol type=\"1\"><li>Вчера в три учех.</li><li>Като деца всяко лято ходехме на село.</li><li>Влакът беше тръгнал.</li><li>Щях да дойда, но ми изникна работа.</li><li>Али нямало да дойде.</li><li>Ако завали, няма да ходим.</li><li>Оказа се, че не са ни чакали.</li><li>Трябваше да тръгнем по-рано.</li></ol><h3>Тематичен речник · Konu sözlüğü — Спомени и детство · Anılar ve çocukluk</h3><table><thead><tr><th>Türkçe</th><th>Български</th></tr></thead><tbody><tr><td>çocukluk</td><td>детство</td></tr><tr><td>gençlik</td><td>младост</td></tr><tr><td>anı</td><td>спомен</td></tr><tr><td>hatıra</td><td>спомен, спомен-предмет</td></tr><tr><td>eski günler</td><td>старите дни</td></tr><tr><td>o zamanlar</td><td>по онова време</td></tr><tr><td>büyümek</td><td>раста, порасвам</td></tr><tr><td>yetişmek</td><td>отраствам; сварвам</td></tr><tr><td>mahalle</td><td>квартал</td></tr><tr><td>komşuluk</td><td>съседство</td></tr><tr><td>oyun</td><td>игра</td></tr><tr><td>oyuncak</td><td>играчка</td></tr><tr><td>saklambaç</td><td>криеница</td></tr><tr><td>top oynamak</td><td>играя на топка</td></tr><tr><td>bisiklet</td><td>велосипед</td></tr><tr><td>salıncak</td><td>люлка</td></tr><tr><td>dede</td><td>дядо</td></tr><tr><td>nine</td><td>баба</td></tr><tr><td>torun</td><td>внук</td></tr><tr><td>akraba</td><td>роднина</td></tr><tr><td>düğün</td><td>сватба</td></tr><tr><td>bayram</td><td>празник</td></tr><tr><td>harçlık</td><td>джобни пари</td></tr><tr><td>okul çantası</td><td>ученическа чанта</td></tr><tr><td>sıra</td><td>чин; ред</td></tr><tr><td>teneffüs</td><td>междучасие</td></tr><tr><td>karne</td><td>бележник</td></tr><tr><td>ders zili</td><td>училищен звънец</td></tr><tr><td>tahta</td><td>дъска</td></tr><tr><td>tebeşir</td><td>тебешир</td></tr><tr><td>sıra arkadaşı</td><td>съученик по чин</td></tr><tr><td>ceza</td><td>наказание</td></tr><tr><td>ödül</td><td>награда</td></tr><tr><td>yaz tatili</td><td>лятна ваканция</td></tr><tr><td>tarla</td><td>нива</td></tr><tr><td>hayvan beslemek</td><td>гледам животни</td></tr><tr><td>inek</td><td>крава</td></tr><tr><td>tavuk</td><td>кокошка</td></tr><tr><td>masal anlatmak</td><td>разказвам приказка</td></tr><tr><td>ninni</td><td>приспивна песен</td></tr><tr><td>özlem</td><td>носталгия, копнеж</td></tr><tr><td>geçmiş</td><td>минало</td></tr><tr><td>büyükanne</td><td>баба</td></tr><tr><td>büyükbaba</td><td>дядо</td></tr><tr><td>aile albümü</td><td>семеен албум</td></tr></tbody></table><p><strong>Упр. 24.6 — Как е на турски?</strong> <em>(Türkçesi nedir?)</em></p><ol type=\"1\"><li>детство</li><li>спомен</li><li>квартал</li><li>играчка</li><li>междучасие</li><li>бележник</li><li>джобни пари</li><li>роднина</li><li>лятна ваканция</li><li>носталгия</li></ol><hr /><h2 id=\"урок-25-съюзи-и-сложно-изречение-bağlaçlar\">УРОК 25 · Съюзи и сложно изречение · Bağlaçlar</h2><h3>Речник · Sözlük</h3><table><thead><tr><th>Турски</th><th>Български</th></tr></thead><tbody><tr><td>ve</td><td>и</td></tr><tr><td>ile / -le</td><td>с; и</td></tr><tr><td>ama / fakat</td><td>но</td></tr><tr><td>ancak</td><td>но, само че</td></tr><tr><td>çünkü</td><td>защото</td></tr><tr><td>bu yüzden</td><td>затова</td></tr><tr><td>bunun için</td><td>заради това</td></tr><tr><td>ayrıca</td><td>освен това</td></tr><tr><td>üstelik</td><td>отгоре на това</td></tr><tr><td>yoksa</td><td>иначе; или пък</td></tr><tr><td>hâlbuki / oysa</td><td>а всъщност, докато</td></tr><tr><td>yani</td><td>тоест</td></tr><tr><td>mesela / örneğin</td><td>например</td></tr><tr><td>özellikle</td><td>особено</td></tr><tr><td>bir de</td><td>и още, а също</td></tr><tr><td>hem de</td><td>и то</td></tr><tr><td>ne yazık ki</td><td>за съжаление</td></tr><tr><td>neyse ki</td><td>за щастие</td></tr><tr><td>kısacası</td><td>накратко</td></tr><tr><td>sonuç olarak</td><td>в заключение</td></tr></tbody></table><h3>Граматика 25.1 — Съюзи за свързване и противопоставяне</h3><table><thead><tr><th>Съюз</th><th>Значение</th><th>Пример</th></tr></thead><tbody><tr><td>ve</td><td>и</td><td>Ali ve Ayşe geldi.</td></tr><tr><td>ile / -le</td><td>с, и <em>(само между имена)</em></td><td>Ali ile Ayşe / Ali’yle</td></tr><tr><td>ama, fakat</td><td>но</td><td>Geldim ama seni bulamadım.</td></tr><tr><td>ancak</td><td>но, само че <em>(по-официално)</em></td><td>Haklısın, ancak geç kaldın.</td></tr><tr><td>hâlbuki, oysa</td><td>а всъщност</td><td>Zengin sanıyordum, hâlbuki hiç parası yok.</td></tr></tbody></table><p><strong>ve срещу ile:</strong> <code>ve</code> свързва всичко — думи и цели изречения. <code>ile</code> свързва само имена и означава още „с“: <code>Ali ile geldim.</code> — Дойдох с Али.</p><h3>Граматика 25.2 — Причина и следствие</h3><table><thead><tr><th>Съюз</th><th>Място</th><th>Пример</th></tr></thead><tbody><tr><td>çünkü</td><td>в началото на <strong>втората</strong> част</td><td>Gelmedim çünkü hastaydım.</td></tr><tr><td>bu yüzden / bu nedenle</td><td>въвежда следствието</td><td>Hastaydım, bu yüzden gelmedim.</td></tr><tr><td>-dığı için</td><td>вместо цяло изречение</td><td>Hasta olduğum için gelmedim.</td></tr><tr><td>-den dolayı</td><td>заради (с име)</td><td>Yağmur<strong>dan dolayı</strong> gelmedik.</td></tr></tbody></table><p>Трите изречения по-долу значат едно и също, но звучат различно — първото е разговорно, третото е книжно:</p><p>Gelmedim çünkü hastaydım.<br />Hastaydım, bu yüzden gelmedim.<br />Hasta olduğum için gelmedim.</p><h3>Граматика 25.3 — Двойните съюзи</h3><table><thead><tr><th>Двойка</th><th>Значение</th><th>Пример</th></tr></thead><tbody><tr><td>hem … hem (de)</td><td>и … и</td><td>Hem çalışıyor hem okuyor.</td></tr><tr><td>ya … ya (da)</td><td>или … или</td><td>Ya sen gel ya ben geleyim.</td></tr><tr><td>ne … ne (de)</td><td>нито … нито</td><td>Ne parası var ne işi.</td></tr><tr><td>gerek … gerek(se)</td><td>както … така и</td><td>Gerek büyükler gerek çocuklar.</td></tr></tbody></table><p><strong>Капан:</strong> при <code>ne … ne</code> глаголът остава <strong>положителен</strong>, защото отрицанието е вече в съюза: <code>Ne geldi ne aradı.</code> — Нито дойде, нито се обади. Казването на <del>ne gelmedi ne aramadı</del> е грешка.</p><h3>Граматика 25.4 — Съюзът ki</h3><p><code>ki</code> е заемка от персийски и работи <strong>като българското „че“</strong> — единственият случай, в който турското изречение тръгва по европейски модел. Използва се в разговорна реч и в устойчиви изрази:</p><table><thead><tr><th>Изречение</th><th>Превод</th></tr></thead><tbody><tr><td>Duydum ki evleniyormuşsun.</td><td>Чух, че се жениш.</td></tr><tr><td>O kadar yorgunum ki ayakta duramıyorum.</td><td>Толкова съм уморен, че не мога да стоя прав.</td></tr><tr><td>Öyle bir baktı ki…</td><td>Така ме погледна, че…</td></tr><tr><td>Ne yazık ki gelemem.</td><td>За съжаление не мога да дойда.</td></tr></tbody></table><p><strong>Не бъркай</strong> този <code>ki</code> с наставката <code>-ki</code> от урок 16 (<code>masadaki</code>, <code>benimki</code>) — тя се пише слято и не се променя по хармонията.</p><h3>Прочети и отговори · Okuyup cevaplayın</h3><blockquote><p>Bu yaz tatile gidemedim çünkü hem işim çok yoğundu hem de param yetmedi. Aslında bilet almıştım, ancak son anda iptal ettim. Ne denize gidebildim ne de arkadaşlarımı görebildim. Neyse ki eylülde birkaç gün izin alacağım; yani tatil bitmiş sayılmaz.</p></blockquote><ol type=\"1\"><li>Yazar neden tatile gidememiş?</li><li>Bilete ne olmuş?</li><li>Yazın ne yapamamış?</li><li>Eylülde ne olacak?</li></ol><h3>Упражнения · Alıştırmalar</h3><p><strong>Упр. 25.1 — Попълни подходящия съюз.</strong> <em>(Uygun bağlacı yazın.)</em></p><ol type=\"1\"><li>Gelmedim ___ hastaydım.</li><li>Hastaydım, ___ gelmedim.</li><li>___ çalışıyor ___ okuyor.</li><li>___ parası var ___ işi.</li><li>Zengin sanıyordum, ___ hiç parası yok.</li></ol><p><strong>Упр. 25.2 — ve или ile?</strong> <em>(„ve“ mi „ile“ mi?)</em></p><ol type=\"1\"><li>Ali ___ Ayşe geldi.</li><li>Ali ___ sinemaya gittim.</li><li>Geldim ___ seni göremedim.</li><li>Kalem ___ yaz.</li><li>Anne ___ baba evde.</li></ol><p><strong>Упр. 25.3 — Кажи същото с -dığı için.</strong> <em>(-dığı için ile söyleyin.)</em></p><ol type=\"1\"><li>Gelmedim çünkü hastaydım.</li><li>Çalışmadım çünkü yorgundum.</li><li>Sevindim çünkü kazandım.</li><li>Gitmedik çünkü yağmur yağıyordu.</li><li>Anlamadım çünkü çok hızlı konuştu.</li></ol><p><strong>Упр. 25.4 — Поправи грешката.</strong> <em>(Yanlışı düzeltin.)</em></p><ol type=\"1\"><li>Ne gelmedi ne aramadı.</li><li>Hem çalışmıyor hem okumuyor. (иска се: и работи, и учи)</li><li>Ya sen gel ya da ben geleyim ya.</li><li>Çünkü hastaydım, gelmedim.</li><li>Duydum evleniyormuşsun.</li></ol><p><strong>Упр. 25.5 — Преведи на турски.</strong> <em>(Türkçeye çevirin.)</em></p><ol type=\"1\"><li>Дойдох, но не те намерих.</li><li>Не отидох, защото бях болен.</li><li>И работи, и учи.</li><li>Нито дойде, нито се обади.</li><li>Чух, че се жениш.</li><li>За съжаление не мога да дойда.</li><li>Толкова съм уморен, че не мога да стоя прав.</li><li>Валеше, затова не излязохме.</li></ol><h3>Тематичен речник · Konu sözlüğü — Образование и учене · Eğitim ve öğrenme</h3><table><thead><tr><th>Türkçe</th><th>Български</th></tr></thead><tbody><tr><td>eğitim</td><td>образование</td></tr><tr><td>öğrenim</td><td>обучение</td></tr><tr><td>konu</td><td>тема</td></tr><tr><td>ünite</td><td>раздел, единица</td></tr><tr><td>yazılı</td><td>писмен изпит</td></tr><tr><td>sözlü</td><td>устен изпит</td></tr><tr><td>ödev</td><td>домашно</td></tr><tr><td>proje</td><td>проект</td></tr><tr><td>sunum</td><td>презентация</td></tr><tr><td>araştırma</td><td>проучване</td></tr><tr><td>kaynak</td><td>източник</td></tr><tr><td>not almak</td><td>водя записки</td></tr><tr><td>ezberlemek</td><td>уча наизуст</td></tr><tr><td>öğretmek</td><td>преподавам</td></tr><tr><td>açıklama</td><td>обяснение</td></tr><tr><td>alıştırma</td><td>упражнение</td></tr><tr><td>hata</td><td>грешка</td></tr><tr><td>düzeltmek</td><td>поправям</td></tr><tr><td>başarı</td><td>успех</td></tr><tr><td>başarısızlık</td><td>неуспех</td></tr><tr><td>sınıfta kalmak</td><td>повтарям класа</td></tr><tr><td>diploma</td><td>диплома</td></tr><tr><td>sertifika</td><td>сертификат</td></tr><tr><td>kurs</td><td>курс</td></tr><tr><td>seviye</td><td>ниво</td></tr><tr><td>ilerlemek</td><td>напредвам</td></tr><tr><td>gelişmek</td><td>развивам се</td></tr><tr><td>zorlanmak</td><td>затруднявам се</td></tr><tr><td>odaklanmak</td><td>съсредоточавам се</td></tr><tr><td>dikkat dağınıklığı</td><td>разсеяност</td></tr><tr><td>motivasyon</td><td>мотивация</td></tr><tr><td>hedef</td><td>цел</td></tr><tr><td>plan yapmak</td><td>планирам</td></tr><tr><td>düzenli</td><td>редовен</td></tr><tr><td>disiplin</td><td>дисциплина</td></tr><tr><td>sabır</td><td>търпение</td></tr><tr><td>azim</td><td>упоритост</td></tr><tr><td>tekrar</td><td>повторение</td></tr><tr><td>özet</td><td>резюме</td></tr><tr><td>kelime hazinesi</td><td>речников запас</td></tr><tr><td>telaffuz</td><td>произношение</td></tr><tr><td>akıcı</td><td>гладък, свободен (за говор)</td></tr><tr><td>anadili</td><td>роден език</td></tr><tr><td>yabancı dil</td><td>чужд език</td></tr><tr><td>çeviri</td><td>превод</td></tr></tbody></table><p><strong>Упр. 25.6 — Как е на турски?</strong> <em>(Türkçesi nedir?)</em></p><ol type=\"1\"><li>образование</li><li>домашно</li><li>презентация</li><li>уча наизуст</li><li>грешка</li><li>напредвам</li><li>цел</li><li>търпение</li><li>произношение</li><li>чужд език</li></ol><hr /><h2 id=\"урок-26-вероятност-и-предположение-olasılık-ve-tahmin\">УРОК 26 · Вероятност и предположение · Olasılık ve tahmin</h2><h3>Речник · Sözlük</h3><table><thead><tr><th>Турски</th><th>Български</th></tr></thead><tbody><tr><td>belki</td><td>може би</td></tr><tr><td>herhalde</td><td>навярно, сигурно</td></tr><tr><td>galiba</td><td>струва ми се, май</td></tr><tr><td>sanırım</td><td>мисля, предполагам</td></tr><tr><td>bence</td><td>според мен</td></tr><tr><td>kesinlikle</td><td>със сигурност</td></tr><tr><td>mutlaka</td><td>непременно</td></tr><tr><td>muhtemelen</td><td>вероятно</td></tr><tr><td>olabilir</td><td>възможно е</td></tr><tr><td>imkânsız</td><td>невъзможно</td></tr><tr><td>emin olmak</td><td>сигурен съм</td></tr><tr><td>şüphe</td><td>съмнение</td></tr><tr><td>tahmin etmek</td><td>предполагам, гадая</td></tr><tr><td>beklemek</td><td>чакам; очаквам</td></tr><tr><td>ihtimal</td><td>вероятност</td></tr><tr><td>kesin</td><td>сигурно, точно</td></tr><tr><td>belli ki</td><td>личи си, че</td></tr><tr><td>anlaşılan</td><td>както изглежда</td></tr><tr><td>umarım</td><td>дано, надявам се</td></tr><tr><td>keşke</td><td>де да, дано беше</td></tr></tbody></table><h3>Граматика 26.1 — Скалата на сигурността</h3><p>Турският подрежда предположенията по сила. Ето ги от най-слабото към най-силното:</p><table><thead><tr><th>Израз</th><th>Сила</th><th>Пример</th></tr></thead><tbody><tr><td>belki</td><td>може би (слабо)</td><td>Belki gelir.</td></tr><tr><td>galiba / sanırım</td><td>май, струва ми се</td><td>Galiba evde.</td></tr><tr><td>muhtemelen</td><td>вероятно</td><td>Muhtemelen yarın döner.</td></tr><tr><td>herhalde</td><td>навярно (силно)</td><td>Herhalde uyuyordur.</td></tr><tr><td>kesinlikle / mutlaka</td><td>със сигурност</td><td>Kesinlikle geldi.</td></tr></tbody></table><p><strong>belki</strong> иска глагол в широко време или с <code>-abilir</code>, не в сегашно: <code>Belki gelir.</code> / <code>Belki gelebilir.</code>, а не <del>Belki geliyor</del>.</p><h3>Граматика 26.2 — Наставката -dır като предположение</h3><p>Познатата от урок 1 наставка <code>-dır</code> има втора работа: залепена за <strong>време</strong>, тя превръща твърдението в <strong>предположение</strong>.</p><table><thead><tr><th>Форма</th><th>Превод</th></tr></thead><tbody><tr><td>Ali evde.</td><td>Али си е вкъщи. <em>(знам)</em></td></tr><tr><td>Ali ev<strong>dedir</strong>.</td><td>Али сигурно си е вкъщи.</td></tr><tr><td>Uyuyor.</td><td>Спи. <em>(виждам го)</em></td></tr><tr><td>Uyuyor<strong>dur</strong>.</td><td>Сигурно спи.</td></tr><tr><td>Gelmiş<strong>tir</strong>.</td><td>Сигурно е дошъл.</td></tr><tr><td>Gelecek<strong>tir</strong>.</td><td>Ще дойде със сигурност.</td></tr></tbody></table><p>Затова <code>Şimdi evdedir.</code> не значи „Той е вкъщи“, а „Сигурно вече си е вкъщи“ — говорещият прави извод, не съобщава факт.</p><h3>Граматика 26.3 — -mış olmalı: логичен извод</h3><p><code>olmalı</code> изразява извод от доказателство — „щом е така, значи…“:</p><table><thead><tr><th>Форма</th><th>Превод</th></tr></thead><tbody><tr><td>gelmiş olmalı</td><td>трябва да е дошъл</td></tr><tr><td>uyuyor olmalı</td><td>трябва да спи</td></tr><tr><td>görmüş olmalısın</td><td>сигурно си видял</td></tr><tr><td>yorgun olmalı</td><td>трябва да е уморен</td></tr></tbody></table><p>Işık yanıyor, demek ki eve gelmiş olmalı. — Свети лампа, значи трябва да се е прибрал.</p><h3>Граматика 26.4 — Възможност и невъзможност</h3><table><thead><tr><th>Форма</th><th>Значение</th><th>Пример</th></tr></thead><tbody><tr><td>-abilir / -ebilir</td><td>може, възможно е</td><td>Yarın yağmur yağabilir.</td></tr><tr><td>-amaz / -emez</td><td>не може, изключено е</td><td>Bu doğru olamaz.</td></tr><tr><td>-abilirdi</td><td>можеше да (но не стана)</td><td>Gelebilirdi ama gelmedi.</td></tr><tr><td>-abilirmiş</td><td>можело да</td><td>Gelebilirmiş.</td></tr></tbody></table><p><strong>olamaz</strong> е най-честият израз на недоверие: <code>Olamaz!</code> — Не може да бъде!</p><h3>Граматика 26.5 — umarım и keşke</h3><p><code>umarım</code> гледа напред и иска бъдеще или широко време: <code>Umarım gelir.</code> — Дано дойде.<br /><code>Keşke</code> гледа назад, към нещо неслучило се, и иска <code>-saydı</code>: <code>Keşke gelseydi.</code> — Де да беше дошъл.</p><h3>Прочети и отговори · Okuyup cevaplayın</h3><blockquote><p>Ali sabahtan beri telefona çıkmıyor. Herhalde toplantıdadır, çünkü bugün önemli bir sunumu vardı. Belki de telefonunu sessize almıştır. Galiba akşam görüşürüz; kesin bir şey söyleyemem. Umarım her şey yolundadır. Keşke sabah ona mesaj atsaydım.</p></blockquote><ol type=\"1\"><li>Ali neden telefona çıkmıyor olabilir?</li><li>Bugün Ali’nin nesi vardı?</li><li>Yazar ne zaman görüşeceklerini düşünüyor?</li><li>Yazar neye pişman?</li></ol><h3>Упражнения · Alıştırmalar</h3><p><strong>Упр. 26.1 — Подреди по сила: най-слабо → най-силно.</strong> <em>(Zayıftan güçlüye sıralayın.)</em></p><p>Напиши подредбата с числа от 1 (най-слабо) до 5 (най-силно).</p><ol type=\"1\"><li>kesinlikle</li><li>belki</li><li>herhalde</li><li>muhtemelen</li><li>galiba</li></ol><p><strong>Упр. 26.2 — Направи предположение с -dır.</strong> <em>(-dır ile tahmin yapın.)</em></p><ol type=\"1\"><li>Ali evde.</li><li>Uyuyor.</li><li>Gelmiş.</li><li>Yorgun.</li><li>Gelecek.</li></ol><p><strong>Упр. 26.3 — Кажи същото с -mış olmalı.</strong> <em>(-mış olmalı ile söyleyin.)</em></p><ol type=\"1\"><li>Herhalde gelmiş.</li><li>Herhalde görmüş.</li><li>Herhalde unutmuş.</li><li>Herhalde çıkmış.</li><li>Herhalde duymuş.</li></ol><p><strong>Упр. 26.4 — umarım или keşke?</strong> <em>(„umarım“ mı „keşke“ mi?)</em></p><ol type=\"1\"><li>___ yarın hava güzel olur.</li><li>___ dün gelseydin.</li><li>___ sınavı geçerim.</li><li>___ ona söylemeseydim.</li><li>___ her şey yolundadır.</li></ol><p><strong>Упр. 26.5 — Преведи на турски.</strong> <em>(Türkçeye çevirin.)</em></p><ol type=\"1\"><li>Може би ще дойде.</li><li>Сигурно спи.</li><li>Трябва да се е прибрал.</li><li>Утре може да завали.</li><li>Не може да бъде!</li><li>Дано всичко е наред.</li><li>Де да бях тръгнал по-рано.</li><li>Според мен това не е вярно.</li></ol><h3>Тематичен речник · Konu sözlüğü — Пари, банка и документи · Para, banka ve belgeler</h3><table><thead><tr><th>Türkçe</th><th>Български</th></tr></thead><tbody><tr><td>hesap açmak</td><td>откривам сметка</td></tr><tr><td>hesap numarası</td><td>номер на сметка</td></tr><tr><td>şifre</td><td>парола, ПИН</td></tr><tr><td>para çekmek</td><td>тегля пари</td></tr><tr><td>para yatırmak</td><td>внасям пари</td></tr><tr><td>havale</td><td>превод</td></tr><tr><td>döviz</td><td>валута</td></tr><tr><td>kur</td><td>валутен курс</td></tr><tr><td>faiz</td><td>лихва</td></tr><tr><td>kredi</td><td>кредит</td></tr><tr><td>borç</td><td>дълг</td></tr><tr><td>makbuz</td><td>квитанция</td></tr><tr><td>vergi</td><td>данък</td></tr><tr><td>gelir</td><td>приход</td></tr><tr><td>gider</td><td>разход</td></tr><tr><td>bütçe</td><td>бюджет</td></tr><tr><td>tasarruf</td><td>спестяване</td></tr><tr><td>birikim</td><td>натрупани спестявания</td></tr><tr><td>harcamak</td><td>харча</td></tr><tr><td>biriktirmek</td><td>спестявам</td></tr><tr><td>yatırım</td><td>инвестиция</td></tr><tr><td>sigorta</td><td>застраховка</td></tr><tr><td>poliçe</td><td>полица</td></tr><tr><td>başvuru</td><td>заявление, кандидатстване</td></tr><tr><td>form doldurmak</td><td>попълвам формуляр</td></tr><tr><td>imza</td><td>подпис</td></tr><tr><td>imzalamak</td><td>подписвам</td></tr><tr><td>mühür</td><td>печат</td></tr><tr><td>belge</td><td>документ</td></tr><tr><td>kimlik</td><td>лична карта</td></tr><tr><td>pasaport</td><td>паспорт</td></tr><tr><td>ehliyet</td><td>шофьорска книжка</td></tr><tr><td>ikametgâh</td><td>адресна регистрация</td></tr><tr><td>nüfus müdürlüğü</td><td>служба ГРАО</td></tr><tr><td>vergi dairesi</td><td>данъчна служба</td></tr><tr><td>noter</td><td>нотариус</td></tr><tr><td>dilekçe</td><td>молба, заявление</td></tr><tr><td>onay</td><td>одобрение</td></tr><tr><td>onaylamak</td><td>одобрявам</td></tr><tr><td>iptal etmek</td><td>отменям</td></tr><tr><td>geçerli</td><td>валиден</td></tr><tr><td>süresi dolmak</td><td>изтича срокът</td></tr><tr><td>yetkili</td><td>отговорно лице, служител</td></tr><tr><td>sıra numarası</td><td>номер на опашка</td></tr><tr><td>gişe</td><td>гише</td></tr></tbody></table><p><strong>Упр. 26.6 — Как е на турски?</strong> <em>(Türkçesi nedir?)</em></p><ol type=\"1\"><li>сметка</li><li>превод (банков)</li><li>данък</li><li>подпис</li><li>документ</li><li>паспорт</li><li>шофьорска книжка</li><li>нотариус</li><li>валиден</li><li>гише</li></ol><hr /><h2 id=\"урок-27-словообразуване-yapım-ekleri\">УРОК 27 · Словообразуване · Yapım ekleri</h2><h3>Речник · Sözlük</h3><table><thead><tr><th>Турски</th><th>Български</th></tr></thead><tbody><tr><td>iş</td><td>работа</td></tr><tr><td>işçi</td><td>работник</td></tr><tr><td>göz</td><td>око</td></tr><tr><td>gözlük</td><td>очила</td></tr><tr><td>su</td><td>вода</td></tr><tr><td>susuz</td><td>безводен, без вода</td></tr><tr><td>tuz</td><td>сол</td></tr><tr><td>tuzlu</td><td>солен</td></tr><tr><td>kitapçı</td><td>книжар</td></tr><tr><td>gazeteci</td><td>журналист</td></tr><tr><td>öğretmenlik</td><td>учителство, професия учител</td></tr><tr><td>güzellik</td><td>красота</td></tr><tr><td>şekerli</td><td>със захар</td></tr><tr><td>şekersiz</td><td>без захар</td></tr><tr><td>kolay</td><td>лесен</td></tr><tr><td>kolaylık</td><td>улеснение</td></tr><tr><td>çocukça</td><td>детински, като дете</td></tr><tr><td>kitapçık</td><td>книжле, брошура</td></tr><tr><td>bilgi</td><td>знание, информация</td></tr><tr><td>sevgi</td><td>обич</td></tr></tbody></table><h3>Граматика 27.1 — Защо си струва</h3><p>Турският строи думи като конструктор. Ако знаеш десетина наставки, от една позната дума разчиташ пет непознати — без речник. Това е най-бързият начин да разшириш речника си след A2.</p><p>От <code>göz</code> (око): <code>gözlük</code> (очила), <code>gözlükçü</code> (оптик), <code>gözlü</code> (с очи), <code>gözsüz</code> (без очи), <code>gözcü</code> (наблюдател).</p><h3>Граматика 27.2 — От име към име</h3><table><thead><tr><th>Наставка</th><th>Значение</th><th>Примери</th></tr></thead><tbody><tr><td>-cı / -ci / -cu / -cü</td><td>професия, занимаващ се с</td><td>iş<strong>çi</strong>, kitap<strong>çı</strong>, gazete<strong>ci</strong>, yol<strong>cu</strong></td></tr><tr><td>-lık / -lik / -luk / -lük</td><td>абстрактно понятие; предмет за</td><td>güzel<strong>lik</strong>, öğretmen<strong>lik</strong>, göz<strong>lük</strong>, tuz<strong>luk</strong></td></tr><tr><td>-lı / -li / -lu / -lü</td><td>с, притежаващ; от (град)</td><td>şeker<strong>li</strong>, para<strong>lı</strong>, İstanbul<strong>lu</strong>, Bulgaristan<strong>lı</strong></td></tr><tr><td>-sız / -siz / -suz / -süz</td><td>без</td><td>şeker<strong>siz</strong>, su<strong>suz</strong>, iş<strong>siz</strong>, para<strong>sız</strong></td></tr><tr><td>-ca / -ce / -ça / -çe</td><td>език; по начина на</td><td>Türk<
