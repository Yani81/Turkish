<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E2338">
<meta name="description" content="Учебник по турски за българи: уроци A1–B1, четива, аудио диалози, речник и тестове. Работи офлайн.">
<title>Türkçe · Учебник и диалози</title>

<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon-64.png" sizes="64x64">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Türkçe">
<style>
/* ============================================================
   ТОКЕНИ · слой 1 — примитиви (пигменти и скали)
   Компонентите НЕ ползват този слой директно.
   ============================================================ */
:root{
  /* пигменти */
  --p-ink:#12212F; --p-iznik:#17618F; --p-turkuaz:#2FA3A0; --p-bole:#B03D2A;
  --p-sand:#ECEFEA; --p-gold:#9A7A18; --p-white:#fff; --p-deep:#0E2338;

  /* отстояния · 4pt скала */
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px;

  /* радиус */
  --r-xs:4px; --r-sm:8px; --r-md:10px; --r-lg:12px; --r-xl:14px; --r-pill:999px;

  /* движение */
  --dur-fast:150ms; --dur-base:200ms; --dur-slow:300ms;
  --ease:cubic-bezier(.4,0,.2,1);

  /* сенки */
  --e1:0 3px 10px rgba(0,0,0,.14);
  --e2:0 4px 14px rgba(0,0,0,.25);
  --e3:0 6px 20px rgba(0,0,0,.30);

  /* размери */
  --tap:44px; --h-topbar:56px; --h-navbar:64px; --fs:16px;
}

/* ============================================================
   ТОКЕНИ · слой 2 — семантика (какво прави цветът)
   ============================================================ */
:root{
  --bg:#ECEFEA;           /* фон на страницата */
  --surface-1:#fff;       /* картa */
  --surface-2:#FBFCFB;    /* хлътнало поле в карта */
  --surface-3:#E4EDF2;    /* заглавен ред на таблица */
  --surface-alt:#FAFBFA;  /* зебра ред */
  --text:#12212F; --text-muted:#5C6B72; --text-accent:#17618F;
  --line:#D6DCD8;         /* декоративна линия */
  --field:#7F8B93;        /* рамка на интерактивен елемент (≥3:1) */
  --btn-bg:#17618F; --btn-fg:#fff;
  --accent:#2FA3A0; --accent-fg:#06262A;
  --mark:#9A7A18;         /* маркер „минат тест“ */
  --hl:#E4F5F3;           /* четено в момента */
  --sel:#EAF2F6; --cur:#E9F3F2; --on:#F0F8F7;
  --ok:#2E9E5B; --ok-fg:#2E7D48; --ok-bg:#EDF9F1;
  --bad:#B03D2A; --bad-bg:#FDEFEC;
  --warn-bg:#FFF3E0; --quote-bg:#FCFAF2; --code-bg:#E8EEEB; --img-bg:#F4F7F6;
  --bar-bg:#0E2338; --bar-fg:#EAF1F0; --bar-line:#5E7A94; --bar-field:#152E48; --bar-ph:#9DB3BF;
  --scrim:rgba(14,35,56,.55);
  --focus:#17618F; --focus-bar:#FFD966;
}
html[data-theme="dark"]{
  --bg:#0B141D;
  --surface-1:#131E29; --surface-2:#0F1924; --surface-3:#1A2833; --surface-alt:#16212C;
  --text:#E7EEF4; --text-muted:#A6B8C5; --text-accent:#84C4EC;
  --line:#2A3846; --field:#5E7183;
  --btn-bg:#84C4EC; --btn-fg:#08131C;
  --accent:#48CBC6; --accent-fg:#06262A;
  --mark:#DDB84C;
  --hl:#123531; --sel:#152B3B; --cur:#12303A; --on:#102A2C;
  --ok:#4FBF7C; --ok-fg:#84D6A4; --ok-bg:#12291D;
  --bad:#F2907A; --bad-bg:#331B18;
  --warn-bg:#2B2415; --quote-bg:#221E15; --code-bg:#1B2733; --img-bg:#1A2531;
  --bar-bg:#081119; --bar-fg:#D7E3EA; --bar-line:#54708A; --bar-field:#101D2B; --bar-ph:#8AA1B0;
  --scrim:rgba(0,0,0,.6);
  --focus:#84C4EC;
}


/* ============================================================
   ТОКЕНИ · типография
   --t-*  съдържание (rem — расте с контрола за шрифт)
   --c-*  рамка на приложението (px — НЕ расте, за да не се чупи)
   ============================================================ */
:root{
  --font-sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --font-serif:"Iowan Old Style","Palatino Linotype",Georgia,serif;
  --font-mono:ui-monospace,Menlo,monospace;

  --t-1:.75rem;    /* 12.0 — микроетикети, подписи под снимки */
  --t-2:.8125rem;  /* 13.0 — обратна връзка, подсказки */
  --t-3:.875rem;   /* 14.0 — таблици, второстепенен текст */
  --t-4:.9375rem;  /* 15.0 — полета, опции, въпроси */
  --t-5:1rem;      /* 16.0 — основен текст */
  --t-6:1.0625rem; /* 17.0 — h3, реплика на турски */
  --t-7:1.1875rem; /* 19.0 — заглавие на диалог */
  --t-8:1.3125rem; /* 21.0 — h2 */
  --t-9:1.5rem;    /* 24.0 — h1 */

  --c-1:10px; --c-2:11px; --c-3:12px; --c-4:13px; --c-5:14px; --c-6:16px;

  --lh-1:1.2;  /* заглавия */
  --lh-2:1.3;  /* компактен текст */
  --lh-3:1.35; /* подзаглавия */
  --lh-4:1.55; /* четивен текст */
}

html{font-size:var(--fs)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--text);
 font:var(--t-5)/var(--lh-4) var(--font-sans);
 padding-bottom:calc(var(--h-navbar) + var(--s2));}

/* ---------- Горна лента ---------- */
.top{position:sticky;top:0;z-index:40;background:var(--bar-bg);color:var(--bar-fg);
 padding:calc(var(--s1) + 2px + env(safe-area-inset-top)) var(--s3) calc(var(--s1) + 2px);
 display:flex;gap:var(--s2);align-items:center;border-bottom:3px solid var(--accent)}
.top h1{font:600 var(--c-5)/var(--lh-1) var(--font-serif);margin:0;flex:1;letter-spacing:.01em;min-width:0}
.top h1 #title{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top .sub{display:block;font:500 var(--c-1)/var(--lh-1) var(--font-mono);color:var(--accent);letter-spacing:.16em;text-transform:uppercase}
.iconbtn{border:1px solid var(--bar-line);background:transparent;color:var(--bar-fg);
 width:var(--tap);height:var(--tap);border-radius:var(--r-md);display:grid;place-items:center;cursor:pointer;font-size:var(--c-6);flex:0 0 auto;line-height:1}
#markdone.locked{opacity:.6}
#markdone.isdone{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}

/* ---------- Съдържание ---------- */
.wrap{max-width:760px;margin:0 auto;padding:0 var(--s3)}
#view{padding-top:var(--s3)}
.crumb{font:600 var(--c-1)/1 var(--font-mono);letter-spacing:.18em;color:var(--bad);
 text-transform:uppercase;margin:0 0 var(--s2)}
h1,h2,h3,h4{font-family:var(--font-serif);line-height:1.2}
#view h1{font-size:var(--t-9);color:var(--text-accent);margin:var(--s1) 0 var(--s3)}
#view h2{font-size:var(--t-8);margin:var(--s1) 0 var(--s3);padding-bottom:var(--s2);border-bottom:2px solid var(--text-accent)}
#view h3{font-size:var(--t-6);margin:var(--s5) 0 var(--s2);color:var(--text-accent);scroll-margin-top:calc(var(--h-topbar) + var(--s3))}
#view h4{font-size:var(--t-4);margin:var(--s4) 0 var(--s1)}
#view p{margin:var(--s2) 0}
#view ul,#view ol{padding-left:var(--s5);margin:var(--s2) 0}
#view li{margin:var(--s1) 0}
#view table{border-collapse:collapse;width:100%;margin:0;font-size:var(--t-3)}
#view th,#view td{border:1px solid var(--line);padding:var(--s2) var(--s3);text-align:left;vertical-align:top}
#view th{background:var(--surface-3);font-family:var(--font-mono);font-size:var(--t-1);letter-spacing:.05em}
#view tbody tr:nth-child(even) td{background:var(--surface-alt)}
#view blockquote{border-left:4px solid var(--mark);background:var(--quote-bg);margin:var(--s3) 0;
 padding:var(--s3) var(--s4);border-radius:0 var(--r-sm) var(--r-sm) 0}
#view blockquote p{margin:var(--s2) 0}
#view blockquote p + p{border-top:1px dotted var(--line);padding-top:var(--s2)}
#view hr{border:0;border-top:1px solid var(--line);margin:var(--s5) 0}
#view code{font-family:var(--font-mono);font-size:var(--t-2);background:var(--code-bg);padding:1px var(--s1);border-radius:var(--r-xs)}
#view strong{font-weight:700}

/* ---------- Карта ---------- */
.card{background:var(--surface-1);border:1px solid var(--line);border-radius:var(--r-xl);margin-bottom:var(--s3)}
.card--plain{padding:var(--s4) var(--s4) var(--s5)}
.card--dialog{overflow:hidden}

/* таблици с хоризонтален скрол */
.tblwrap{position:relative;margin:var(--s3) 0;overflow-x:auto}
.tblwrap.more::after{content:"";position:absolute;top:0;right:0;bottom:0;width:var(--s6);pointer-events:none;
 background:linear-gradient(90deg,transparent,var(--surface-1));transition:opacity var(--dur-fast) var(--ease)}
.tblwrap.more.end::after{opacity:0}
.tblwrap.more .scrollhint{position:absolute;top:-9px;right:0;font:600 var(--c-1)/1 var(--font-mono);
 letter-spacing:.1em;color:var(--text-muted);text-transform:uppercase}
.tblwrap.end .scrollhint{opacity:0}

/* вътрешно съдържание на урока */
.toc{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-lg);
 padding:var(--s2) var(--s3);margin:0 0 var(--s4)}
.toc b{display:block;font:600 var(--c-1)/1 var(--font-mono);letter-spacing:.16em;
 text-transform:uppercase;color:var(--text-muted);margin-bottom:var(--s2)}
.toc button{display:block;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);
 padding:var(--s3) 0;min-height:var(--tap);color:var(--text-accent);font:inherit;font-size:var(--t-3);cursor:pointer}
.toc button:first-of-type{border-top:0}

/* турски текст, който може да се чуе */
.tr-say{cursor:pointer;border-bottom:1px dotted var(--accent)}
.tr-say.speaking{background:var(--hl);border-radius:var(--r-xs)}
td.tr-say{border-bottom:1px solid var(--line);box-shadow:inset 0 -2px 0 var(--accent)}
td.tr-say.speaking{background:var(--hl)!important}

.pager{display:flex;gap:var(--s2);margin:var(--s1) 0 var(--s4)}
.pager button{flex:1;min-height:var(--tap);border:1px solid var(--text-accent);background:var(--surface-1);
 color:var(--text-accent);padding:var(--s3);border-radius:var(--r-md);font:600 var(--c-4)/1 inherit;cursor:pointer}
.pager button:disabled{opacity:.35}

#view figure.illus{margin:var(--s4) 0;padding:var(--s3) var(--s3) var(--s2);background:var(--surface-1);
 border:1px solid var(--line);border-radius:var(--r-lg);text-align:center}
#view figure.illus svg{width:100%;height:auto;max-width:460px}
#view figure.illus figcaption{font-size:var(--t-2);color:var(--text-muted);margin-top:var(--s2);font-style:italic}

#view .picgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:var(--s3);margin:var(--s4) 0}
#view figure.pic{margin:0;padding:var(--s3) var(--s1);background:var(--surface-1);border:1px solid var(--line);
 border-radius:var(--r-lg);text-align:center;cursor:pointer}
#view figure.pic .pic-img{display:block;height:96px;margin-bottom:var(--s2);position:relative;
 border-radius:var(--r-sm);overflow:hidden;background:var(--img-bg)}
#view figure.pic svg{width:52px;height:52px;display:block;margin:22px auto 0}
#view figure.pic img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity var(--dur-slow) var(--ease)}
#view figure.pic img.loaded{opacity:1}
#view p.lvl{color:var(--text-muted);font-size:var(--t-2);margin:0 0 var(--s4);font-family:var(--font-mono);letter-spacing:.04em}
#view .readall{margin:var(--s2) 0 var(--s1)}
#view .picbar{background:var(--warn-bg);border:1px solid var(--mark);padding:var(--s3);border-radius:var(--r-md);font-size:var(--t-3);margin:var(--s3) 0}
#view .piccredit{font-size:var(--t-1);color:var(--text-muted);margin:var(--s2) 0 0}
#view figure.pic figcaption{font-size:var(--t-2);line-height:1.35}
#view figure.pic b{display:block;color:var(--text);font-weight:700}
#view figure.pic span{color:var(--text-muted);font-size:var(--t-1)}
#view figure.pic.speaking{background:var(--hl);border-color:var(--accent)}

/* ---------- интерактивни упражнения ---------- */
#view .exwrap{background:var(--surface-1);border:1px solid var(--line);border-radius:var(--r-lg);padding:var(--s3) var(--s4);margin:var(--s4) 0}
#view .exwrap > p:first-child{margin-top:0}
#view .exwrap em{display:block;color:var(--text-accent);font-size:var(--t-3);font-style:normal;margin-top:2px}
#view .exrow{display:flex;gap:var(--s2);align-items:flex-start;margin:var(--s2) 0}
#view .exnum{flex:0 0 22px;color:var(--text-muted);font:600 var(--t-2)/1.9 var(--font-mono)}
#view .exq{flex:1;min-width:0}
#view .exq .qt{font-size:var(--t-4)}
#view .exwrap input.exin{width:100%;min-height:var(--tap);margin-top:var(--s1);padding:var(--s3);
 border:1px solid var(--field);border-radius:var(--r-md);font:var(--t-4)/var(--lh-2) inherit;background:var(--surface-2);color:var(--text)}
#view .exwrap input.exin:focus{border-color:var(--text-accent);background:var(--surface-1);outline:none}
#view .exwrap input.ok{border-color:var(--ok);background:var(--ok-bg)}
#view .exwrap input.bad{border-color:var(--bad);background:var(--bad-bg)}
#view .exfb{font-size:var(--t-2);margin-top:var(--s1)}
#view .exfb.ok{color:var(--ok-fg)}
#view .exfb.bad{color:var(--bad)}
#view .exfb.try{color:var(--text-muted)}
#view .exbtns{display:flex;gap:var(--s2);margin-top:var(--s3);flex-wrap:wrap;align-items:center}
#view .exscore{font:600 var(--t-2)/var(--lh-2) var(--font-mono);color:var(--text-muted)}
#view .exfree{background:var(--quote-bg);border:1px dashed var(--mark);border-radius:var(--r-md);padding:var(--s3);font-size:var(--t-3);margin-top:var(--s2)}

#view .exgap{line-height:2.6;margin:var(--s2) 0}
#view input.gapin{display:inline-block;width:11ch;max-width:100%;min-height:38px;margin:0 var(--s1);
 padding:var(--s1) var(--s2);text-align:center;border:1px solid var(--text-accent);border-radius:var(--r-sm);
 background:var(--surface-1);font:var(--t-4)/1 inherit;color:var(--text);vertical-align:baseline}
#view input.gapin.ok{border-color:var(--ok);background:var(--ok-bg)}
#view input.gapin.bad{border-color:var(--bad);background:var(--bad-bg)}

#view .dictsearch{position:sticky;top:calc(var(--h-topbar) + var(--s1));z-index:20;background:var(--surface-1);
 padding:var(--s2) 0 var(--s3);margin:0 0 var(--s1)}
#view .dictsearch input{width:100%;min-height:var(--tap);padding:var(--s3);border:1px solid var(--field);
 border-radius:var(--r-md);font:var(--t-4)/1 inherit;background:var(--surface-1);color:var(--text)}
#view .dictsearch input:focus{border-color:var(--text-accent);outline:none}
#view tr.hidden,#view .tblwrap.hidden,#view table.hidden,#view h2.hidden,#view h3.hidden,#view figure.hidden{display:none}
#view .dicthint{font-size:var(--t-2);color:var(--text-muted);margin:var(--s1) 0 0}

/* ---------- ключ с отговорите ---------- */
#view details.ansbox{background:var(--surface-1);border:1px dashed var(--line);border-radius:var(--r-lg);
 margin:var(--s4) 0 var(--s2);padding:0 var(--s4)}
#view details.ansbox[open]{padding-bottom:var(--s2)}
#view details.ansbox summary{cursor:pointer;list-style:none;padding:var(--s3) 0;font:600 var(--t-3)/var(--lh-2) inherit;
 color:var(--text-muted);display:flex;gap:var(--s2);align-items:center;min-height:var(--tap)}
#view details.ansbox summary::-webkit-details-marker{display:none}
#view details.ansbox summary::before{content:"▸";color:var(--text-accent)}
#view details.ansbox[open] summary::before{content:"▾"}

/* ---------- тест след урока ---------- */
#view .quiz{background:var(--surface-1);border:2px solid var(--text-accent);border-radius:var(--r-xl);padding:var(--s4);margin:var(--s5) 0 var(--s2)}
#view .quiz h3{margin:0 0 var(--s1);color:var(--text-accent);font-size:var(--t-6)}
#view .quiz .qsub{color:var(--text-muted);font-size:var(--t-3);margin:0 0 var(--s3)}
#view .qitem{margin:var(--s3) 0;padding-top:var(--s3);border-top:1px dashed var(--line)}
#view .qitem:first-of-type{border-top:0;padding-top:0}
#view .qtext{font-size:var(--t-4);margin-bottom:var(--s2)}
#view .qtext b{color:var(--text-accent)}
#view .qopts{display:grid;gap:var(--s2)}
#view .qopt{border:1px solid var(--field);background:var(--surface-2);border-radius:var(--r-md);
 padding:var(--s3);min-height:var(--tap);font:var(--t-4)/var(--lh-2) inherit;text-align:left;cursor:pointer;color:var(--text)}
#view .qopt:active{background:var(--cur)}
#view .qopt.sel{border-color:var(--text-accent);background:var(--sel);box-shadow:inset 0 0 0 1px var(--text-accent)}
#view .qopt.ok{border-color:var(--ok);background:var(--ok-bg)}
#view .qopt.ok::after{content:" ✓";color:var(--ok-fg);font-weight:700}
#view .qopt.bad{border-color:var(--bad);background:var(--bad-bg)}
#view .qopt.bad::after{content:" ✕";color:var(--bad);font-weight:700}
#view .quizfoot{margin-top:var(--s4);display:flex;gap:var(--s2);align-items:center;flex-wrap:wrap}
#view .qresult{font:600 var(--t-3)/var(--lh-2) inherit;flex:1;min-width:140px}
#view .qresult.pass{color:var(--ok-fg)}
#view .qresult.fail{color:var(--bad)}
#view .quizlock{background:var(--warn-bg);border:1px solid var(--mark);border-radius:var(--r-md);padding:var(--s3);font-size:var(--t-3);margin:var(--s3) 0 0}

/* ---------- Диалози ---------- */
.dlgbar{display:flex;gap:var(--s2);flex-wrap:wrap;padding:var(--s3) 0 var(--s1)}
.dlgbar button{border:1px solid var(--field);background:var(--surface-1);color:var(--text);border-radius:var(--r-pill);
 padding:var(--s3) var(--s4);min-height:40px;font:600 var(--c-3)/1 inherit;cursor:pointer}
.dlgbar button[aria-pressed="true"]{background:var(--btn-bg);border-color:var(--btn-bg);color:var(--btn-fg)}
.dhead{padding:var(--s4) var(--s4) var(--s3);border-bottom:1px dashed var(--line)}
.dtag{font:600 var(--c-1)/1 var(--font-mono);letter-spacing:.18em;color:var(--bad);text-transform:uppercase}
.dtitle{font-size:var(--t-7);margin:var(--s1) 0 2px;font-weight:600;font-family:var(--font-serif)}
.dsub{margin:0;color:var(--text-muted);font-size:var(--t-3)}
.lines{list-style:none;margin:0;padding:var(--s1) 0}
.line{display:flex;gap:var(--s3);align-items:flex-start;padding:var(--s3) var(--s4);border-left:3px solid transparent;
 transition:background var(--dur-base) var(--ease),opacity var(--dur-base) var(--ease)}
.line.on{background:var(--on);border-left-color:var(--accent)}
.playing .line:not(.on){opacity:.4}
.who{flex:0 0 28px;width:28px;height:28px;display:grid;place-items:center;color:#fff;
 font:700 var(--c-2)/1 var(--font-mono);margin-top:var(--s2);
 clip-path:polygon(30% 0,70% 0,100% 30%,100% 70%,70% 100%,30% 100%,0 70%,0 30%)}
.a .who{background:var(--text-accent)} .b .who{background:var(--bad)}
.txt{flex:1;min-width:0}
.tr{font-size:var(--t-6);font-weight:500}
.bg{font-size:var(--t-3);color:var(--text-muted);margin-top:3px;display:block}
.hidebg .bg{display:none}
.say{flex:0 0 auto;border:1px solid var(--field);background:var(--surface-1);border-radius:var(--r-md);

const RAW = document.createElement('div');
RAW.innerHTML = "<h1 id=\"как-да-ползваш\">КАК ДА ПОЛЗВАШ УЧЕБНИКА</h1><h2 id=\"карта-на-учебника\">КАРТА НА УЧЕБНИКА · Konu haritası</h2><p>Уроците са подредени по граматика — от простото към сложното. Тази карта ги подрежда <strong>по тема</strong>, както е в турските учебници. Ползвай я, когато търсиш „за какво да говоря“, а не „кое правило да науча“.</p><table><thead><tr><th>№</th><th>Тема</th><th>На български</th><th>Къде е</th><th>Граматика</th></tr></thead><tbody><tr><td>1</td><td><strong>MERHABA</strong></td><td>Запознанство</td><td>Урок 1 · Урок 2</td><td><em>KOŞAÇ TÜMCESİ (haber kipi) -(y)İm · VAROLUŞ TÜMCESİ var, yok · SIRALAMA -(İ)ncİ</em></td></tr><tr><td>2</td><td><strong>GÜNLÜK HAYAT</strong></td><td>Ежедневие</td><td>Урок 5 · Урок 6</td><td><em>ŞİMDİKİ ZAMAN -(İ)yor · DURUM -(y)E, -DE, -DEn · SAATLER</em></td></tr><tr><td>3</td><td><strong>YAKIN ÇEVREMİZ</strong></td><td>Близката среда</td><td>Урок 3 · Урок 4 · Падежите подробно</td><td><em>İYELİK -(İ)m, -(İ)n, -(s)İ · AD TAMLAMASI -(n)İn …-(s)İ · DURUM (belirtme) -(y)İ</em></td></tr><tr><td>4</td><td><strong>ZAMAN GEÇİYOR</strong></td><td>Времето минава</td><td>Урок 7 · Урок 8 · Четиво 6</td><td><em>GEÇMİŞ ZAMAN -Dİ · GENİŞ ZAMAN -(E/İ)r · ULAÇLAR -(y)ken</em></td></tr><tr><td>5</td><td><strong>AFİYET OLSUN</strong></td><td>Храна и трапеза</td><td>Урок 10 · Четиво 6</td><td><em>EMİR KİPİ -(y)İn · İSTEK KİPİ -(y)E · SIFATLAŞTIRMA -lİ, -sİz</em></td></tr><tr><td>6</td><td><strong>BÜROKRASİ HER YERDE</strong></td><td>Документи и институции</td><td>— <em>(предстои)</em></td><td><em>ŞİMDİKİ ZAMAN (resmî) -mEktE · İLGİ EKİ -ki · BAĞLAÇLAR de/da</em></td></tr><tr><td>7</td><td><strong>GELECEK DE BİR GÜN GELECEK</strong></td><td>Бъдеще и планове</td><td>Урок 9 · Урок 12 · Урок 13</td><td><em>GELECEK ZAMAN -(y)EcEK · GEREKLİLİK -mElİ · ŞART -sE</em></td></tr><tr><td>8</td><td><strong>RİVAYET ODUR Kİ…</strong></td><td>Чуто и преразказано</td><td>Урок 11 · Урок 24</td><td><em>GEÇMİŞ ZAMAN (belirsiz) -mİş · BİRLEŞİK ZAMANLAR -(y)Dİ, -(y)mİş · PEKİŞTİRME -Dİr</em></td></tr><tr><td>9</td><td><strong>FARKLI DÜNYALAR</strong></td><td>Различни светове</td><td>Урок 14 · Урок 22 · Урок 23</td><td><em>KARŞILAŞTIRMA -DEn daha · ÜSTÜNLÜK en · YETERLİK -(y)Ebil- / -(y)EmE- · ÇATI</em></td></tr><tr><td>10</td><td><strong>MEDYA</strong></td><td>Медии и технологии</td><td>Урок 19 · Урок 21 · Четиво 8</td><td><em>ADLAŞTIRMA -mE, -mEk, -(y)İş · DOLAYLI ANLATIM -DİĞİnİ, -(y)EcEĞİnİ</em></td></tr><tr><td>11</td><td><strong>SAĞLIKLI BİR YAŞAM</strong></td><td>Здраве и живот</td><td>Урок 18 · Четиво 2</td><td><em>ULAÇLAR -(y)İp, -mEdEn, -(y)ErEk · olarak</em></td></tr><tr><td>12</td><td><strong>YOLCULUK</strong></td><td>Път и пътуване</td><td>Урок 15 · Урок 25 · Четиво 3</td><td><em>İLGEÇLER gibi, kadar, için · BAĞLAÇLAR çünkü, bu yüzden · ULAÇLAR -mEk üzere</em></td></tr></tbody></table><p>Единствената тема без свой урок засега е <strong>BÜROKRASİ HER YERDE</strong> — документи, гишета, официални писма. Тя е следващата на ред.</p><h3>Останалото в учебника</h3><table><thead><tr><th>Раздел</th><th>Съдържание</th></tr></thead><tbody><tr><td>Част III · B1</td><td>Уроци 21–27 — залози, сложни времена, съюзи, словообразуване</td></tr><tr><td>Четива</td><td>Осем текста с речник, въпроси и упражнения</td></tr><tr><td>Диалози</td><td>Десет озвучени ситуации, A1–B1</td></tr><tr><td>Речник</td><td>По уроци и азбучен, с номер на урока</td></tr><tr><td>Картинен речник</td><td>Четири теми със снимки</td></tr><tr><td>Приложения</td><td>Хармония, времена, съгласни промени, глаголи</td></tr></tbody></table><hr /><h2 id=\"нотация\">КАК ДА ЧЕТЕШ ОКОНЧАНИЯТА · Ek yazımı</h2><p>Турските окончания се менят по гласната хармония, затова едно окончание има по два, четири или осем облика. Вместо да ги изброяваме всеки път, оттук нататък използваме <strong>кратката нотация</strong> — същата, която ще срещнеш в турските учебници.</p><h3>Главна буква = менлив звук</h3><table><thead><tr><th>Знак</th><th>Става на</th><th>Пример</th><th>Разгърнато</th></tr></thead><tbody><tr><td><strong>E</strong></td><td>a, e</td><td>-(y)<strong>E</strong></td><td>-a / -e (дателен падеж)</td></tr><tr><td><strong>İ</strong></td><td>ı, i, u, ü</td><td>-(<strong>İ</strong>)yor</td><td>-ıyor / -iyor / -uyor / -üyor</td></tr><tr><td><strong>D</strong></td><td>d, t</td><td>-<strong>D</strong>E</td><td>-da / -de / -ta / -te</td></tr><tr><td><strong>C</strong></td><td>c, ç</td><td>-<strong>C</strong>İ</td><td>-cı / -ci / -cu / -cü / -çı / -çi / -çu / -çü</td></tr><tr><td><strong>K</strong></td><td>k, ğ</td><td>-E<strong>CEK</strong></td><td>-acak / -ecek (→ -acağ- пред гласна)</td></tr></tbody></table><h3>Скоба = буквата пада понякога</h3><table><thead><tr><th>Знак</th><th>Кога се появява</th><th>Пример</th></tr></thead><tbody><tr><td><strong>(y)</strong></td><td>само след гласна</td><td>araba<strong>y</strong>a, но eve</td></tr><tr><td><strong>(n)</strong></td><td>само след гласна</td><td>kapı<strong>n</strong>ın, но evin</td></tr><tr><td><strong>(s)</strong></td><td>само след гласна</td><td>araba<strong>s</strong>ı, но evi</td></tr><tr><td><strong>(İ)</strong></td><td>само след съгласна</td><td>yap<strong>ı</strong>lmak, но okunmak</td></tr></tbody></table><blockquote><p><strong>Пример за разчитане:</strong> <code>-DiktEn sonra</code> се разгъва на <em>-dıktan / -dikten / -duktan / -dükten / -tıktan / -tikten / -tuktan / -tükten sonra</em> — осем облика в четири знака.</p></blockquote><h3>Упражнения · Alıştırmalar</h3><p><strong>Упр. Н.1 — Разгърни окончанието за дадената дума.</strong> <em>(Eki açın.)</em></p><ol type=\"1\"><li>ev + -DE</li><li>okul + -DE</li><li>kitap + -DE</li><li>araba + -(y)E</li><li>göz + -(İ)m</li><li>kapı + -(n)İn</li><li>iş + -Cİ</li><li>kitap + -Cİ</li></ol><p><strong>Упр. Н.2 — Напиши в кратка нотация.</strong> <em>(Kısa yazımla yazın.)</em></p><ol type=\"1\"><li>-da / -de / -ta / -te</li><li>-ıyor / -iyor / -uyor / -üyor</li><li>-acak / -ecek</li><li>-a / -e (след съгласна)</li><li>-cı / -ci / -çı / -çi</li></ol><hr /><h2 id=\"граматични-термини\">ГРАМАТИЧНИ ТЕРМИНИ · Dil bilgisi terimleri</h2><p>Ако някога отвориш турски учебник, влезеш в курс в Турция или потърсиш обяснение в турски сайт, ще срещнеш тези думи. Повечето имат по два варианта: <strong>стар</strong> (арабско-персийски, <em>fiil, cümle, zamir</em>) и <strong>нов</strong> (турски, <em>eylem, tümce, adıl</em>). И двата са в употреба.</p><table><thead><tr><th>Türkçe</th><th>Български</th></tr></thead><tbody><tr><td>ad / isim</td><td>име, съществително</td></tr><tr><td>eylem / fiil</td><td>глагол</td></tr><tr><td>sıfat</td><td>прилагателно</td></tr><tr><td>zarf</td><td>наречие</td></tr><tr><td>adıl / zamir</td><td>местоимение</td></tr><tr><td>ilgeç / edat</td><td>следлог</td></tr><tr><td>bağlaç</td><td>съюз</td></tr><tr><td>ünlem</td><td>междуметие</td></tr><tr><td>ünlü</td><td>гласна</td></tr><tr><td>ünsüz</td><td>съгласна</td></tr><tr><td>hece</td><td>сричка</td></tr><tr><td>kök</td><td>корен</td></tr><tr><td>ek</td><td>окончание, наставка</td></tr><tr><td>yapım eki</td><td>словообразуваща наставка</td></tr><tr><td>çekim eki</td><td>граматична наставка</td></tr><tr><td>tümce / cümle</td><td>изречение</td></tr><tr><td>özne</td><td>подлог</td></tr><tr><td>nesne</td><td>допълнение</td></tr><tr><td>yüklem</td><td>сказуемо</td></tr><tr><td>tümleç</td><td>обстоятелствено пояснение</td></tr><tr><td>zaman</td><td>време (глаголно)</td></tr><tr><td>kip</td><td>наклонение</td></tr><tr><td>şimdiki zaman</td><td>сегашно време</td></tr><tr><td>geniş zaman</td><td>широко сегашно време</td></tr><tr><td>geçmiş zaman</td><td>минало време</td></tr><tr><td>gelecek zaman</td><td>бъдеще време</td></tr><tr><td>emir kipi</td><td>повелително наклонение</td></tr><tr><td>istek kipi</td><td>желателно наклонение</td></tr><tr><td>şart kipi</td><td>условно наклонение</td></tr><tr><td>gereklilik</td><td>дължимост</td></tr><tr><td>yeterlik</td><td>възможност</td></tr><tr><td>olumsuz</td><td>отрицателен</td></tr><tr><td>olumlu</td><td>положителен</td></tr><tr><td>soru</td><td>въпрос</td></tr><tr><td>çatı</td><td>залог</td></tr><tr><td>edilgen</td><td>страдателен</td></tr><tr><td>ettirgen</td><td>понудителен</td></tr><tr><td>dönüşlü</td><td>възвратен</td></tr><tr><td>işteş</td><td>взаимен</td></tr><tr><td>durum / hâl</td><td>падеж</td></tr><tr><td>yalın hâl</td><td>именителен падеж</td></tr><tr><td>belirtme hâli</td><td>винителен падеж</td></tr><tr><td>yönelme hâli</td><td>дателен падеж</td></tr><tr><td>bulunma hâli</td><td>местен падеж</td></tr><tr><td>çıkma hâli</td><td>отделителен падеж</td></tr><tr><td>tamlayan hâli</td><td>родителен падеж</td></tr><tr><td>iyelik</td><td>притежание</td></tr><tr><td>ad tamlaması</td><td>именна група</td></tr><tr><td>ulaç / zarf-fiil</td><td>деепричастие</td></tr><tr><td>ortaç / sıfat-fiil</td><td>причастие</td></tr><tr><td>adlaştırma</td><td>субстантивация</td></tr><tr><td>karşılaştırma</td><td>сравнение</td></tr><tr><td>üstünlük</td><td>превъзходна степен</td></tr><tr><td>pekiştirme</td><td>подсилване</td></tr><tr><td>ünlü uyumu</td><td>гласна хармония</td></tr><tr><td>ünsüz yumuşaması</td><td>озвучаване на съгласна</td></tr><tr><td>ünsüz benzeşmesi</td><td>уподобяване на съгласни</td></tr><tr><td>kaynaştırma harfi</td><td>буфер</td></tr><tr><td>vurgu</td><td>ударение</td></tr><tr><td>söz varlığı</td><td>речников запас</td></tr></tbody></table><h3>Упражнения · Alıştırmalar</h3><p><strong>Упр. Т.1 — Как е на турски?</strong> <em>(Türkçesi nedir?)</em></p><ol type=\"1\"><li>глагол</li><li>изречение</li><li>подлог</li><li>падеж</li><li>гласна хармония</li><li>залог</li><li>причастие</li><li>деепричастие</li></ol><p><strong>Упр. Т.2 — Кой падеж е?</strong> <em>(Hangi hâl?)</em></p><ol type=\"1\"><li>eve</li><li>evde</li><li>evden</li><li>evi</li><li>evin</li></ol>\n<hr />\n<h1 id=\"учебник-a1-уроци-и-упражнения\">УЧЕБНИК A1 · УРОЦИ И\nУПРАЖНЕНИЯ</h1>\n<hr />\n<h3 id=\"как-да-работиш-с-учебника\">Как да работиш с учебника</h3>\n<p>Всеки урок има еднаква структура:</p>\n<ol type=\"1\">\n<li><strong>Речник</strong> — новите думи с превод</li>\n<li><strong>Граматика</strong> — правилото с таблици</li>\n<li><strong>Примери</strong> — изречения с превод</li>\n<li><strong>Текст за четене и превод</strong></li>\n<li><strong>Упражнения</strong></li>\n</ol>\n<p><strong>Ключът с отговорите на всички упражнения е в края на\nучебника.</strong> Прави упражненията писмено и чак после гледай\nотговорите.</p>\n<hr />\n<h2 id=\"въведение-азбука-и-произношение\">ВЪВЕДЕНИЕ: АЗБУКА И\nПРОИЗНОШЕНИЕ</h2><figure class=\"illus\">\n<svg viewBox=\"0 0 400 150\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Поздрави през деня\">\n<line x1=\"24\" y1=\"96\" x2=\"376\" y2=\"96\" stroke=\"var(--line)\" stroke-width=\"2\"/>\n<g text-anchor=\"middle\">\n<g fill=\"var(--mark)\"><circle cx=\"80\" cy=\"96\" r=\"9\"/></g>\n<circle cx=\"190\" cy=\"96\" r=\"9\" fill=\"var(--accent)\"/>\n<circle cx=\"290\" cy=\"96\" r=\"9\" fill=\"var(--text-accent)\"/>\n<circle cx=\"360\" cy=\"96\" r=\"9\" fill=\"var(--text)\"/>\n<g font-size=\"12.5\" font-weight=\"700\" fill=\"var(--text)\">\n<text x=\"80\" y=\"66\">günaydın</text><text x=\"190\" y=\"66\">iyi günler</text>\n<text x=\"290\" y=\"46\">iyi akşamlar</text><text x=\"352\" y=\"66\">iyi geceler</text>\n</g>\n<g font-size=\"10\" fill=\"var(--text-muted)\">\n<text x=\"80\" y=\"122\">сутрин</text><text x=\"190\" y=\"122\">ден</text><text x=\"290\" y=\"122\">вечер</text><text x=\"358\" y=\"122\">нощ</text>\n</g>\n</g>\n</svg>\n<figcaption>Поздравът се сменя с часа на деня.</figcaption></figure>\n<p>Турската азбука е латинска, има <strong>29 букви</strong>. Няма Q, W,\nX. Има Ç, Ğ, I, İ, Ö, Ş, Ü.</p>\n<p>Турският се чете както се пише — една буква = един звук.</p>\n<table>\n<colgroup>\n<col style=\"width: 25%\" />\n<col style=\"width: 25%\" />\n<col style=\"width: 25%\" />\n<col style=\"width: 25%\" />\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th>Буква</th>\n<th>Звук</th>\n<th>Пример</th>\n<th>Превод</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>A a</td>\n<td>а</td>\n<td><strong>a</strong>ta</td>\n<td>прародител</td>\n</tr>\n<tr class=\"even\">\n<td>B b</td>\n<td>б</td>\n<td><strong>b</strong>aba</td>\n<td>баща</td>\n</tr>\n<tr class=\"odd\">\n<td>C c</td>\n<td>дж</td>\n<td><strong>c</strong>am</td>\n<td>стъкло</td>\n</tr>\n<tr class=\"even\">\n<td>Ç ç</td>\n<td>ч</td>\n<td><strong>ç</strong>ay</td>\n<td>чай</td>\n</tr>\n<tr class=\"odd\">\n<td>D d</td>\n<td>д</td>\n<td><strong>d</strong>ost</td>\n<td>приятел</td>\n</tr>\n<tr class=\"even\">\n<td>E e</td>\n<td>е</td>\n<td><strong>e</strong>v</td>\n<td>къща</td>\n</tr>\n<tr class=\"odd\">\n<td>F f</td>\n<td>ф</td>\n<td><strong>f</strong>il</td>\n<td>слон</td>\n</tr>\n<tr class=\"even\">\n<td>G g</td>\n<td>г</td>\n<td><strong>g</strong>öz</td>\n<td>око</td>\n</tr>\n<tr class=\"odd\">\n<td>Ğ ğ</td>\n<td>не се чете (удължава гласната преди себе си)</td>\n<td>da<strong>ğ</strong></td>\n<td>планина</td>\n</tr>\n<tr class=\"even\">\n<td>H h</td>\n<td>х (леко)</td>\n<td><strong>h</strong>ava</td>\n<td>въздух</td>\n</tr>\n<tr class=\"odd\">\n<td>I ı</td>\n<td>ъ</td>\n<td>k<strong>ı</strong>z</td>\n<td>момиче</td>\n</tr>\n<tr class=\"even\">\n<td>İ i</td>\n<td>и</td>\n<td><strong>i</strong>ki</td>\n<td>две</td>\n</tr>\n<tr class=\"odd\">\n<td>J j</td>\n<td>ж</td>\n<td><strong>j</strong>apon</td>\n<td>японец</td>\n</tr>\n<tr class=\"even\">\n<td>K k</td>\n<td>к</td>\n<td><strong>k</strong>itap</td>\n<td>книга</td>\n</tr>\n<tr class=\"odd\">\n<td>L l</td>\n<td>л</td>\n<td><strong>l</strong>imon</td>\n<td>лимон</td>\n</tr>\n<tr class=\"even\">\n<td>M m</td>\n<td>м</td>\n<td><strong>m</strong>asa</td>\n<td>маса</td>\n</tr>\n<tr class=\"odd\">\n<td>N n</td>\n<td>н</td>\n<td><strong>n</strong>e</td>\n<td>какво</td>\n</tr>\n<tr class=\"even\">\n<td>O o</td>\n<td>о</td>\n<td><strong>o</strong>kul</td>\n<td>училище</td>\n</tr>\n<tr class=\"odd\">\n<td>Ö ö</td>\n<td>ьо (като нем. ö)</td>\n<td><strong>ö</strong>ğrenci</td>\n<td>ученик</td>\n</tr>\n<tr class=\"even\">\n<td>P p</td>\n<td>п</td>\n<td><strong>p</strong>ara</td>\n<td>пари</td>\n</tr>\n<tr class=\"odd\">\n<td>R r</td>\n<td>р</td>\n<td><strong>r</strong>enk</td>\n<td>цвят</td>\n</tr>\n<tr class=\"even\">\n<td>S s</td>\n<td>с</td>\n<td><strong>s</strong>u</td>\n<td>вода</td>\n</tr>\n<tr class=\"odd\">\n<td>Ş ş</td>\n<td>ш</td>\n<td><strong>ş</strong>eker</td>\n<td>захар</td>\n</tr>\n<tr class=\"even\">\n<td>T t</td>\n<td>т</td>\n<td><strong>t</strong>uz</td>\n<td>сол</td>\n</tr>\n<tr class=\"odd\">\n<td>U u</td>\n<td>у</td>\n<td><strong>u</strong>zun</td>\n<td>дълъг</td>\n</tr>\n<tr class=\"even\">\n<td>Ü ü</td>\n<td>ю (като нем. ü)</td>\n<td><strong>ü</strong>züm</td>\n<td>грозде</td>\n</tr>\n<tr class=\"odd\">\n<td>V v</td>\n<td>в</td>\n<td><strong>v</strong>ar</td>\n<td>има</td>\n</tr>\n<tr class=\"even\">\n<td>Y y</td>\n<td>й</td>\n<td><strong>y</strong>ol</td>\n<td>път</td>\n</tr>\n<tr class=\"odd\">\n<td>Z z</td>\n<td>з</td>\n<td><strong>z</strong>aman</td>\n<td>време</td>\n</tr>\n</tbody>\n</table>\n<h3 id=\"важни-бележки-за-произношението-telaffuz-notları\">Важни бележки\nза произношението · Telaffuz notları</h3>\n<ul>\n<li><strong>I ı</strong> (без точка) = българското <strong>ъ</strong>:\n<code>kız</code> (къз) — момиче, <code>kırmızı</code> (кърмъзъ) —\nчервен.</li>\n<li><strong>İ i</strong> (с точка) = <strong>и</strong>. Главната буква\nна <code>i</code> е <code>İ</code>: <code>İstanbul</code>,\n<code>İzmir</code>.</li>\n<li><strong>Ö</strong> и <strong>Ü</strong> — устните са закръглени като\nза „о“/„у“, но езикът е в позиция за „е“/„и“.</li>\n<li><strong>Ğ ğ</strong> (yumuşak g) — никога не стои в началото на\nдума. Между гласни почти не се чува, а гласната преди нея се удължава:\n<code>dağ</code> → „даа“, <code>öğretmen</code> → „ьоретмен“.</li>\n<li><strong>C</strong> = дж, а <strong>Ç</strong> = ч. Внимавай:\n<code>cam</code> (джам) ≠ <code>çam</code> (чам, бор).</li>\n<li><strong>E</strong> пред <code>m, n, l, r</code> звучи по-отворено\n(като „ае“): <code>ben</code>, <code>gel</code>.</li>\n</ul>\n<h3 id=\"ударение-vurgu\">Ударение · Vurgu</h3>\n<p>По правило ударението е <strong>на последната сричка</strong>:\n<code>kitáp</code>, <code>öğrencí</code>, <code>arkadaşím</code>.</p>\n<p>Изключения (ударението пада в началото или средата): - Географски\nимена: <code>Í-stanbul</code>, <code>Án-kara</code>,\n<code>Búl-garistan</code> - Наречия: <code>şímdi</code> (сега),\n<code>nérede</code> (къде), <code>sónra</code> (после) - Отрицателна\nчастица <code>-ma/-me</code> дърпа ударението пред себе си:\n<code>gélme</code> (не идвай)</p>\n<hr />\n<h2 id=\"как-работи-турският-език-türkçe-nasıl-işler\">КАК РАБОТИ ТУРСКИЯТ\nЕЗИК · Türkçe nasıl işler</h2>\n<p>Преди да започнеш уроците, прочети това. Турският е устроен различно\nот българския и щом разбереш принципа, всичко останало става\nлогично.</p>\n<h3 id=\"основната-идея-думата-се-сглобява-eklemeli-dil\">Основната идея:\nдумата се сглобява · Eklemeli dil</h3>\n<p>Турският е <strong>аглутинативен</strong> (турски: <em>eklemeli</em>\n— „лепящ“) език. Това значи, че значенията се добавят като отделни\nпарченца — <strong>окончания</strong> — едно след друго в края на\nдумата. Всяко парченце има точно едно значение и не се слива с\nостаналите.</p>\n<p>Сравни:</p>\n<table>\n<colgroup>\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th>Турски</th>\n<th>Разбор</th>\n<th>Български</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>ev</td>\n<td>ev</td>\n<td>къща</td>\n</tr>\n<tr class=\"even\">\n<td>ev<strong>ler</strong></td>\n<td>ev + мн.ч.</td>\n<td>къщи</td>\n</tr>\n<tr class=\"odd\">\n<td>ev<strong>ler</strong>im</td>\n<td>ev + мн.ч. + мой</td>\n<td>моите къщи</td>\n</tr>\n<tr class=\"even\">\n<td>ev<strong>ler</strong>im<strong>de</strong></td>\n<td>ev + мн.ч. + мой + в</td>\n<td>в моите къщи</td>\n</tr>\n<tr class=\"odd\">\n<td>ev<strong>ler</strong>im<strong>de</strong>ki</td>\n<td>ev + мн.ч. + мой + в + който е</td>\n<td>който е в моите къщи</td>\n</tr>\n</tbody>\n</table>\n<p>В българския за същото трябват няколко думи и предлози. В турския —\nедна дума. Затова турската дума расте надясно и <strong>редът на\nокончанията е винаги един и същ</strong>:</p>\n<p><strong>корен → множествено число → притежание → падеж</strong></p>\n<p><code>ev-ler-im-de</code> — никога <code>ev-de-ler-im</code>.</p>\n<h3 id=\"какво-е-корен-kök\">Какво е „корен“ · Kök</h3>\n<p>Коренът е думата без никакви окончания — това, което намираш в\nречника. При глаголите речникът дава инфинитив (<code>gelmek</code>), а\nкоренът е това, което остава след махане на <code>-mek/-mak</code>:\n<code>gel-</code>.</p>\n<p>Всяко спрежение започва от корена: <code>gel-iyor-um</code>,\n<code>gel-di-m</code>, <code>gel-ecek-sin</code>.</p>\n<h3 id=\"какво-е-окончание-афикс-ek\">Какво е „окончание“ (афикс) ·\nEk</h3>\n<p>Окончанието е парченце без самостоятелно значение, което се лепи за\nкорена. В този учебник ще срещаш два вида:</p>\n<ul>\n<li><strong>Словоизменителни</strong> — променят формата:\n<code>-ler</code> (мн.ч.), <code>-de</code> (в), <code>-im</code>\n(мой)</li>\n<li><strong>Словообразувателни</strong> — правят нова дума:\n<code>göz</code> (око) → <code>göz-lük</code> (очила), <code>iş</code>\n(работа) → <code>iş-çi</code> (работник)</li>\n</ul>\n<h3 id=\"защо-гласните-се-менят-ünlü-uyumu\">Защо гласните се менят · Ünlü\nuyumu</h3>\n<p>Понеже окончанията се лепят едно за друго, турският ги „настройва“\nтака, че думата да звучи гладко. Това е <strong>гласната\nхармония</strong>: гласната в окончанието се приспособява към последната\nгласна в думата.</p>\n<p>Не е произвол — езикът избягва скокове между предната и задната част\nна устата: <code>ev-de</code> (двете гласни са предни),\n<code>okul-da</code> (двете са задни).</p>\n<p>Ще срещнеш две системи: - <strong>двойна</strong> (a/e) — за\nокончания като <code>-lar/-ler</code>, <code>-da/-de</code>,\n<code>-a/-e</code> - <strong>четворна</strong> (ı/i/u/ü) — за окончания\nкато <code>-ım/-im/-um/-üm</code>, <code>-ı/-i/-u/-ü</code></p>\n<h3 id=\"какво-е-падеж-hâl-durum\">Какво е „падеж“ · Hâl / durum</h3>\n<p>Падежът показва <strong>ролята на съществителното</strong> в\nизречението. В българския това го вършат предлозите (в, от, към) и\nсловоредът. В турския — окончание в края на думата.</p>\n<table>\n<thead>\n<tr class=\"header\">\n<th>Български</th>\n<th>Турски</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td><strong>в</strong> къщата</td>\n<td>ev<strong>de</strong></td>\n</tr>\n<tr class=\"even\">\n<td><strong>от</strong> къщата</td>\n<td>ev<strong>den</strong></td>\n</tr>\n<tr class=\"odd\">\n<td><strong>към</strong> къщата</td>\n<td>ev<strong>e</strong></td>\n</tr>\n</tbody>\n</table>\n<p>Шестте турски падежа:</p>\n<table>\n<thead>\n<tr class=\"header\">\n<th>Падеж</th>\n<th>Турски</th>\n<th>Окончание</th>\n<th>Въпрос</th>\n<th>Пример</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>основен</td>\n<td>yalın hâl</td>\n<td>—</td>\n<td>ne? kim?</td>\n<td>ev</td>\n</tr>\n<tr class=\"even\">\n<td>винителен</td>\n<td>belirtme hâli</td>\n<td>-ı/-i/-u/-ü</td>\n<td>neyi? kimi?</td>\n<td>evi</td>\n</tr>\n<tr class=\"odd\">\n<td>дателен</td>\n<td>yönelme hâli</td>\n<td>-a/-e</td>\n<td>nereye? kime?</td>\n<td>eve</td>\n</tr>\n<tr class=\"even\">\n<td>местен</td>\n<td>bulunma hâli</td>\n<td>-da/-de</td>\n<td>nerede? kimde?</td>\n<td>evde</td>\n</tr>\n<tr class=\"odd\">\n<td>изходен</td>\n<td>ayrılma hâli</td>\n<td>-dan/-den</td>\n<td>nereden? kimden?</td>\n<td>evden</td>\n</tr>\n<tr class=\"even\">\n<td>родителен</td>\n<td>ilgi hâli</td>\n<td>-ın/-in/-un/-ün</td>\n<td>kimin? neyin?</td>\n<td>evin</td>\n</tr>\n</tbody>\n</table>\n<h3 id=\"какво-е-изафет-isim-tamlaması\">Какво е „изафет“ · İsim\ntamlaması</h3>\n<p>Това е турският начин две съществителни да се свържат — там, където\nбългарският казва „на“ или прави прилагателно.</p>\n<ul>\n<li><code>oda-nın kapı-sı</code> — вратата <strong>на</strong>\nстаята</li>\n<li><code>ders kitab-ı</code> — учеб<strong>ник</strong> (книга за\nурок)</li>\n</ul>\n<p>Особеното е, че <strong>и двете думи</strong> получават окончание, а\nне само едната. Подробно в Урок 3.</p>\n<h3 id=\"какво-е-лице-kişi\">Какво е „лице“ · Kişi</h3>\n<p>Лицето показва <strong>кой</strong> върши действието: аз, ти, той,\nние, вие, те. В турския лицето се вижда от окончанието на глагола,\nзатова местоимението често се изпуска:</p>\n<ul>\n<li><code>Geliyorum.</code> — Идвам. <em>(окончанието <code>-um</code>\nвече казва „аз“)</em></li>\n<li><code>Ben geliyorum.</code> — <strong>Аз</strong> идвам. <em>(с\nнаблягане)</em></li>\n</ul>\n<h3 id=\"какво-е-наклонение-kip\">Какво е „наклонение“ · Kip</h3>\n<p>Наклонението показва <strong>отношението</strong> на говорещия към\nдействието:</p>\n<table>\n<colgroup>\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th>Наклонение</th>\n<th>Турски</th>\n<th>Пример</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>изявително (факт)</td>\n<td>haber kipi</td>\n<td>Geliyor. — Идва.</td>\n</tr>\n<tr class=\"even\">\n<td>повелително (заповед)</td>\n<td>emir kipi</td>\n<td>Gel! — Ела!</td>\n</tr>\n<tr class=\"odd\">\n<td>желателно (нека)</td>\n<td>istek kipi</td>\n<td>Gelelim. — Нека дойдем.</td>\n</tr>\n<tr class=\"even\">\n<td>условно (ако)</td>\n<td>şart kipi</td>\n<td>Gelirse — ако дойде</td>\n</tr>\n<tr class=\"odd\">\n<td>необходимост (трябва)</td>\n<td>gereklilik kipi</td>\n<td>Gelmeli. — Трябва да дойде.</td>\n</tr>\n</tbody>\n</table>\n<h3 id=\"редът-на-думите-kelime-sırası\">Редът на думите · Kelime\nsırası</h3>\n<p>Турското изречение завършва с глагола. Основната схема е:</p>\n<p><strong>подлог → допълнение → глагол</strong> (SOV)</p>\n<ul>\n<li>Ben (подлог) kitap (допълнение) okuyorum (глагол).</li>\n<li>Ali (подлог) Ayşe’yi (допълнение) seviyor (глагол).</li>\n</ul>\n<p>Българският е SVO („Аз чета книга“), турският е SOV („Аз книга\nчета“). Всичко останало — време, място, начин — стои между подлога и\nглагола:</p>\n<blockquote>\n<p><strong>Ben</strong> <em>dün akşam</em> <em>evde</em>\n<em>arkadaşımla</em> <strong>film izledim.</strong> Аз гледах филм снощи\nвкъщи с приятеля си.</p>\n</blockquote>\n<h3 id=\"пет-неща-които-турският-няма\">Пет неща, които турският НЯМА</h3>\n<p>Това улеснява много:</p>\n<ol type=\"1\">\n<li><strong>Няма род</strong> — <code>o</code> е и „той“, и „тя“, и\n„то“. Няма мъжки/женски прилагателни.</li>\n<li><strong>Няма определителен член</strong> като „-та, -ът“.\nОпределеността се показва иначе.</li>\n<li><strong>Няма глагол „съм“ като дума</strong> — той е окончание:\n<code>öğrenci-yim</code> (студент съм).</li>\n<li><strong>Няма глагол „имам“</strong> — казва се „моята книга\nсъществува“: <code>kitabım var</code>.</li>\n<li><strong>Няма неправилни глаголи</strong> (почти) — всички се спрягат\nпо едни и същи правила.</li>\n</ol>\n<h3 id=\"и-три-които-има-а-българският-няма\">И три, които има, а\nбългарският няма</h3>\n<ol type=\"1\">\n<li><strong>Гласна хармония</strong> — окончанията се менят според\nдумата.</li>\n<li><strong>Изафет</strong> — двете свързани съществителни получават\nокончания.</li>\n<li><strong>Свидетелско/несвидетелско минало</strong> —\n<code>geldi</code> (видях го да идва) срещу <code>gelmiş</code> (казаха\nми, че е дошъл). Това идва на ниво A2.</li>\n</ol>\n<hr />\n<h2 id=\"урок-1-merhaba-здравей\">УРОК 1 · Merhaba! — Здравей!</h2><figure class=\"illus\">\n<svg viewBox=\"0 0 400 150\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Поздрави през деня\">\n<line x1=\"24\" y1=\"96\" x2=\"376\" y2=\"96\" stroke=\"var(--line)\" stroke-width=\"2\"/>\n<g text-anchor=\"middle\">\n<g fill=\"var(--mark)\"><circle cx=\"80\" cy=\"96\" r=\"9\"/></g>\n<circle cx=\"190\" cy=\"96\" r=\"9\" fill=\"var(--accent)\"/>\n<circle cx=\"290\" cy=\"96\" r=\"9\" fill=\"var(--text-accent)\"/>\n<circle cx=\"360\" cy=\"96\" r=\"9\" fill=\"var(--text)\"/>\n<g font-size=\"12.5\" font-weight=\"700\" fill=\"var(--text)\">\n<text x=\"80\" y=\"66\">günaydın</text><text x=\"190\" y=\"66\">iyi günler</text>\n<text x=\"290\" y=\"46\">iyi akşamlar</text><text x=\"352\" y=\"66\">iyi geceler</text>\n</g>\n<g font-size=\"10\" fill=\"var(--text-muted)\">\n<text x=\"80\" y=\"122\">сутрин</text><text x=\"190\" y=\"122\">ден</text><text x=\"290\" y=\"122\">вечер</text><text x=\"358\" y=\"122\">нощ</text>\n</g>\n</g>\n</svg>\n<figcaption>Поздравът се сменя с часа на деня.</figcaption></figure>\n<h3 id=\"речник-sözlük\">Речник · Sözlük</h3>\n<table>\n<thead>\n<tr class=\"header\">\n<th>Турски</th>\n<th>Български</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>merhaba</td>\n<td>здравей / здравейте</td>\n</tr>\n<tr class=\"even\">\n<td>günaydın</td>\n<td>добро утро</td>\n</tr>\n<tr class=\"odd\">\n<td>iyi günler</td>\n<td>добър ден</td>\n</tr>\n<tr class=\"even\">\n<td>iyi akşamlar</td>\n<td>добър вечер</td>\n</tr>\n<tr class=\"odd\">\n<td>iyi geceler</td>\n<td>лека нощ</td>\n</tr>\n<tr class=\"even\">\n<td>hoşça kal / hoşça kalın</td>\n<td>остани/останете си със здраве</td>\n</tr>\n<tr class=\"odd\">\n<td>güle güle</td>\n<td>довиждане (на този, който си тръгва)</td>\n</tr>\n<tr class=\"even\">\n<td>görüşürüz</td>\n<td>ще се видим</td>\n</tr>\n<tr class=\"odd\">\n<td>teşekkür ederim</td>\n<td>благодаря</td>\n</tr>\n<tr class=\"even\">\n<td>rica ederim</td>\n<td>моля / няма защо</td>\n</tr>\n<tr class=\"odd\">\n<td>lütfen</td>\n<td>моля (при молба)</td>\n</tr>\n<tr class=\"even\">\n<td>evet</td>\n<td>да</td>\n</tr>\n<tr class=\"odd\">\n<td>hayır</td>\n<td>не</td>\n</tr>\n<tr class=\"even\">\n<td>ad / isim</td>\n<td>име</td>\n</tr>\n<tr class=\"odd\">\n<td>öğrenci</td>\n<td>ученик, студент</td>\n</tr>\n<tr class=\"even\">\n<td>öğretmen</td>\n<td>учител</td>\n</tr>\n<tr class=\"odd\">\n<td>doktor</td>\n<td>лекар</td>\n</tr>\n<tr class=\"even\">\n<td>mühendis</td>\n<td>инженер</td>\n</tr>\n<tr class=\"odd\">\n<td>avukat</td>\n<td>адвокат</td>\n</tr>\n<tr class=\"even\">\n<td>aşçı</td>\n<td>готвач</td>\n</tr>\n<tr class=\"odd\">\n<td>şoför</td>\n<td>шофьор</td>\n</tr>\n<tr class=\"even\">\n<td>Türk</td>\n<td>турчин</td>\n</tr>\n<tr class=\"odd\">\n<td>Bulgar</td>\n<td>българин</td>\n</tr>\n<tr class=\"even\">\n<td>nasılsın? / nasılsınız?</td>\n<td>как си? / как сте?</td>\n</tr>\n<tr class=\"odd\">\n<td>iyiyim</td>\n<td>добре съм</td>\n</tr>\n<tr class=\"even\">\n<td>memnun oldum</td>\n<td>приятно ми е</td>\n</tr>\n</tbody>\n</table>\n<h3 id=\"граматика-1.1-лични-местоимения-kişi-zamirleri\">Граматика 1.1 —\nЛични местоимения · Kişi zamirleri</h3>\n<table>\n<thead>\n<tr class=\"header\">\n<th>Турски</th>\n<th>Български</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>ben</td>\n<td>аз</td>\n</tr>\n<tr class=\"even\">\n<td>sen</td>\n<td>ти</td>\n</tr>\n<tr class=\"odd\">\n<td>o</td>\n<td>той / тя / то</td>\n</tr>\n<tr class=\"even\">\n<td>biz</td>\n<td>ние</td>\n</tr>\n<tr class=\"odd\">\n<td>siz</td>\n<td>вие</td>\n</tr>\n<tr class=\"even\">\n<td>onlar</td>\n<td>те</td>\n</tr>\n</tbody>\n</table>\n<p>Забележи: турският няма род. <code>o</code> = „той“, „тя“ и „то“.</p>\n<h3\nid=\"граматика-1.2-сказуемни-окончания-аз-съм-ти-си-ek-fiil-kişi-ekleri\">Граматика\n1.2 — Сказуемни окончания (аз съм, ти си…) · Ek fiil (kişi ekleri)</h3>\n<p>В турския няма глагол „съм“ като отделна дума. Окончанието се лепи за\nдумата:</p>\n<table>\n<thead>\n<tr class=\"header\">\n<th>Лице</th>\n<th>След <strong>e, i</strong></th>\n<th>След <strong>a, ı</strong></th>\n<th>След <strong>o, u</strong></th>\n<th>След <strong>ö, ü</strong></th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>ben</td>\n<td>-(y)im</td>\n<td>-(y)ım</td>\n<td>-(y)um</td>\n<td>-(y)üm</td>\n</tr>\n<tr class=\"even\">\n<td>sen</td>\n<td>-sin</td>\n<td>-sın</td>\n<td>-sun</td>\n<td>-sün</td>\n</tr>\n<tr class=\"odd\">\n<td>o</td>\n<td>-dir</td>\n<td>-dır</td>\n<td>-dur</td>\n<td>-dür</td>\n</tr>\n<tr class=\"even\">\n<td>biz</td>\n<td>-(y)iz</td>\n<td>-(y)ız</td>\n<td>-(y)uz</td>\n<td>-(y)üz</td>\n</tr>\n<tr class=\"odd\">\n<td>siz</td>\n<td>-siniz</td>\n<td>-sınız</td>\n<td>-sunuz</td>\n<td>-sünüz</td>\n</tr>\n<tr class=\"even\">\n<td>onlar</td>\n<td>-dirler</td>\n<td>-dırlar</td>\n<td>-durlar</td>\n<td>-dürler</td>\n</tr>\n</tbody>\n</table>\n<p>Коя гласна избираме, зависи от <strong>последната гласна на\nдумата</strong> (виж Урок 2 — гласна хармония).</p>\n<p><strong><code>y</code> се вмъква само ако думата свършва на\nгласна:</strong> <code>öğrenci</code> + <code>im</code> →\n<code>öğrenciyim</code>.</p>\n<p>За 3 л. ед.ч. окончанието <code>-dir</code> в говоримия език\nобикновено се изпуска: <code>O doktor.</code> — Той е лекар.</p>\n<p><strong>Примери:</strong></p>\n<ul>\n<li>Ben öğrenciyim. — Аз съм студент.</li>\n<li>Sen öğretmensin. — Ти си учител.</li>\n<li>O doktor. — Той/тя е лекар.</li>\n<li>Biz Bulgarız. — Ние сме българи.</li>\n<li>Siz mühendissiniz. — Вие сте инженер(и).</li>\n<li>Onlar Türk. — Те са турци.</li>\n</ul>\n<h3 id=\"граматика-1.3-отрицание-değil-olumsuzluk-değil\">Граматика 1.3 —\nОтрицание: değil · Olumsuzluk: değil</h3>\n<p><code>değil</code> = „не съм / не си / не е…“. Пише се отделно, а\nокончанието се лепи за него.</p>\n<table>\n<tbody>\n<tr class=\"odd\">\n<td>ben değilim</td>\n<td>не съм</td>\n</tr>\n<tr class=\"even\">\n<td>sen değilsin</td>\n<td>не си</td>\n</tr>\n<tr class=\"odd\">\n<td>o değil</td>\n<td>не е</td>\n</tr>\n<tr class=\"even\">\n<td>biz değiliz</td>\n<td>не сме</td>\n</tr>\n<tr class=\"odd\">\n<td>siz değilsiniz</td>\n<td>не сте</td>\n</tr>\n<tr class=\"even\">\n<td>onlar değil(ler)</td>\n<td>не са</td>\n</tr>\n</tbody>\n</table>\n<ul>\n<li>Ben doktor değilim. — Аз не съм лекар.</li>\n<li>Sen Türk değilsin. — Ти не си турчин.</li>\n<li>Biz öğrenci değiliz. — Ние не сме студенти.</li>\n</ul>\n<h3 id=\"граматика-1.4-въпрос-mı-mi-mu-mü-soru-eki\">Граматика 1.4 —\nВъпрос: mı / mi / mu / mü · Soru eki</h3>\n<p>Въпросителната частица се пише <strong>отделно</strong>, но\nокончанието се лепи за нея:</p>\n<ul>\n<li>Sen öğrenci misin? — Ти студент ли си?</li>\n<li>O doktor mu? — Той лекар ли е?</li>\n<li>Siz Bulgar mısınız? — Вие българи ли сте?</li>\n<li>Ben geç miyim? — Аз късен ли съм? (<code>y</code> след гласна)</li>\n</ul>\n<p>Изборът на гласна: след <strong>e, i</strong> → <code>mi</code>; след\n<strong>a, ı</strong> → <code>mı</code>; след <strong>o, u</strong> →\n<code>mu</code>; след <strong>ö, ü</strong> → <code>mü</code>.</p>\n<h3 id=\"защо-е-така-neden-böyle\">Защо е така · Neden böyle</h3>\n<p><strong>Защо няма „съм“?</strong> Турският го изразява с окончание,\nнаречено <em>ek fiil</em> („окончание-глагол“). <code>Öğrenciyim</code>\nбуквално е „студент-съм“ — една дума. Същото окончание се лепи и за\n<code>değil</code> (не съм) и за въпросителната частица <code>mi</code>.\nЗатова, щом научиш тези шест окончания, ще можеш да строиш изречения без\nнито един глагол.</p>\n<p><strong>Защо <code>değil</code> се пише отделно, а окончанието —\nне?</strong> Защото <code>değil</code> е самостоятелна дума („не е\nтака“), а <code>-im</code>, <code>-sin</code> са окончания. Затова:\n<code>öğrenci değilim</code> (три части: студент + не + аз), но\n<code>öğrenciyim</code> (една дума).</p>\n<p><strong>Защо въпросителната частица се пише отделно, а окончанието се\nлепи за нея?</strong> <code>mi</code> е дума, но „приема“ лицето върху\nсебе си: <code>öğrenci misin?</code> — частицата носи <code>-sin</code>.\nПравилото е просто: лицето винаги отива на последното парче в\nизречението.</p>\n<h3 id=\"диалог-за-четене-и-превод-okuma-ve-çeviri-diyaloğu\">Диалог за\nчетене и превод · Okuma ve çeviri diyaloğu</h3>\n<p><strong>Tanışma — Запознанство</strong></p>\n<blockquote>\n<p>— Merhaba! Ben Ayşe.</p>\n<p>— Merhaba Ayşe. Benim adım Petar.</p>\n<p>— Memnun oldum Petar. Sen Türk müsün?</p>\n<p>— Hayır, Türk değilim. Ben Bulgarım.</p>\n<p>— Öğrenci misin?</p>\n<p>— Evet, öğrenciyim. Sen ne iş yapıyorsun?</p>\n<p>— Ben öğretmenim.</p>\n<p>— Çok güzel! Nasılsın?</p>\n<p>— İyiyim, teşekkür ederim. Sen nasılsın?</p>\n<p>— Ben de iyiyim.</p>\n<p>— Görüşürüz Petar!</p>\n<p>— Güle güle Ayşe!</p>\n</blockquote>\n<p><em>Нови изрази:</em> <code>benim adım</code> — моето име;\n<code>ne iş yapıyorsun?</code> — с какво се занимаваш?;\n<code>çok güzel</code> — много хубаво; <code>ben de</code> — аз\nсъщо.</p>\n<h3 id=\"упражнения-alıştırmalar\">Упражнения · Alıştırmalar</h3>\n<p><strong>Упр. 1.1 — Постави правилното окончание.</strong> <em>(Doğru\neki koyun.)</em></p>\n<ol type=\"1\">\n<li>Ben öğretmen___ .</li>\n<li>Sen doktor___ .</li>\n<li>Biz Bulgar___ .</li>\n<li>Siz avukat___ .</li>\n<li>Ben aşçı___ .</li>\n<li>Sen mühendis___ .</li>\n</ol>\n<p><strong>Упр. 1.2 — Направи изреченията отрицателни.</strong>\n<em>(Cümleleri olumsuz yapın.)</em></p>\n<ol type=\"1\">\n<li>Ben öğrenciyim.</li>\n<li>Sen Türksün.</li>\n<li>O doktor.</li>\n<li>Biz mühendisiz.</li>\n<li>Siz öğretmensiniz.</li>\n</ol>\n<p><strong>Упр. 1.3 — Направи въпрос.</strong> <em>(Soru cümlesi\nyapın.)</em></p>\n<ol type=\"1\">\n<li>Sen öğrencisin.</li>\n<li>O avukat.</li>\n<li>Siz Bulgarsınız.</li>\n<li>Onlar Türk.</li>\n</ol>\n<p><strong>Упр. 1.4 — Преведи на турски.</strong> <em>(Türkçeye\nçevirin.)</em></p>\n<ol type=\"1\">\n<li>Здравей, аз съм Иван.</li>\n<li>Ти учител ли си?</li>\n<li>Не, аз не съм учител, аз съм инженер.</li>\n<li>Приятно ми е.</li>\n<li>Благодаря, добре съм.</li>\n</ol>\n<h3 id=\"допълнителни-упражнения-ek-alıştırmalar\">Допълнителни упражнения\n· Ek alıştırmalar</h3>\n<p><strong>Упр. 1.5 — Свържи въпроса с отговора.</strong> <em>(Soruyla\ncevabı eşleştirin.)</em></p>\n<ol type=\"1\">\n<li>Nasılsın?</li>\n<li>Adın ne?</li>\n<li>Sen Türk müsün?</li>\n<li>Ne iş yapıyorsun?</li>\n<li>Nerelisin?</li>\n</ol>\n<p>а) Benim adım Elif.<br />\nб) Hayır, Bulgarım.<br />\nв) İyiyim, teşekkür ederim.<br />\nг) Sofyalıyım.<br />\nд) Doktorum.</p>\n<p><strong>Упр. 1.6 — Поправи грешката.</strong> <em>(Hatayı\ndüzeltin.)</em></p>\n<ol type=\"1\">\n<li>Ben öğrencisin.</li>\n<li>Sen doktorum.</li>\n<li>O Türkim.</li>\n<li>Biz mühendissiniz.</li>\n<li>Siz avukatız.</li>\n</ol>\n<p><strong>Упр. 1.7 — Попълни диалога.</strong> <em>(Diyaloğu\ntamamlayın.)</em></p>\n<p>— Merhaba! Ben Deniz. Sen ___ ?<br />\n— Ben Petar. Memnun ___ .<br />\n— Sen Türk ___ ?<br />\n— Hayır, Türk ___ . Ben Bulgar___ .<br />\n— Ne iş ___ ?<br />\n— Öğretmen___ .</p>\n<p><strong>Упр. 1.8 — Отговори за себе си.</strong> <em>(Kendiniz için\ncevap verin.)</em></p>\n<ol type=\"1\">\n<li>Adın ne?</li>\n<li>Nerelisin?</li>\n<li>Ne iş yapıyorsun?</li>\n<li>Nasılsın?</li>\n</ol>\n<p><strong>Упр. 1.9 — Попълни с правилната въпросителна дума.</strong>\n<em>(Doğru soru kelimesiyle tamamlayın.)</em></p>\n<ol type=\"1\">\n<li>___ yapıyorsun? — Kitap okuyorum.</li>\n<li>___ geliyorsun? — Sofya’dan.</li>\n<li>___ yaşındasın? — Yirmi beş.</li>\n<li>___ o? — O benim kardeşim.</li>\n<li>___ gidiyorsun? — Okula.</li>\n<li>___ sın? — İyiyim, teşekkürler.</li>\n<li>___ geliyorsun? — Yarın.</li>\n<li>___ gelmiyorsun? — Çünkü hastayım.</li>\n</ol>\n<p><strong>Упр. 1.10 — Свържи лицето с окончанието.</strong>\n<em>(Kişiyle eki eşleştirin.)</em></p>\n<ol type=\"1\">\n<li>Ben mühendis___</li>\n<li>Sen aşçı___</li>\n<li>O avukat___</li>\n<li>Biz doktor___</li>\n<li>Siz şoför___</li>\n<li>Onlar öğrenci___</li>\n<li>Ben Bulgar___</li>\n<li>Sen Türk___</li>\n<li>Biz öğretmen___</li>\n<li>Siz mühendis___</li>\n</ol>\n<p><strong>Упр. 1.11 — Отговори утвърдително и отрицателно.</strong>\n<em>(Olumlu ve olumsuz cevap verin.)</em></p>\n<p>Пример: Sen öğrenci misin? → Evet, öğrenciyim. / Hayır, öğrenci\ndeğilim.</p>\n<ol type=\"1\">\n<li>Sen doktor musun?</li>\n<li>O Türk mü?</li>\n<li>Siz mühendis misiniz?</li>\n<li>Onlar öğretmen mi?</li>\n<li>Sen Bulgar mısın?</li>\n<li>O avukat mı?</li>\n</ol>\n<p><strong>Упр. 1.12 — Преведи на турски.</strong> <em>(Türkçeye\nçevirin.)</em></p>\n<ol type=\"1\">\n<li>На колко години си?</li>\n<li>Аз съм на тридесет години.</li>\n<li>Откъде сте?</li>\n<li>Той не е лекар, той е инженер.</li>\n<li>Вие учители ли сте?</li>\n<li>Защо не идваш?</li>\n<li>Кога идваш?</li>\n<li>Как се казваш?</li>\n</ol>\n<h3>Тематичен речник · Konu sözlüğü — Поздрави и светски разговор · Selamlaşma ve sohbet</h3><table><thead><tr><th>Türkçe</th><th>Български</th></tr></thead><tbody><tr><td>selam</td><td>здрасти</td></tr><tr><td>selamlaşmak</td><td>поздравяваме се</td></tr><tr><td>hoş geldiniz</td><td>добре дошли</td></tr><tr><td>hoş bulduk</td><td>добре заварили</td></tr><tr><td>nasılsınız?</td><td>как сте?</td></tr><tr><td>iyiyim</td><td>добре съм</td></tr><tr><td>şöyle böyle</td><td>горе-долу</td></tr><tr><td>fena değil</td><td>не е зле</td></tr><tr><td>sen nasılsın?</td><td>ти как си?</td></tr><tr><td>ne var ne yok?</td><td>какво ново?</td></tr><tr><td>iyilik sağlık</td><td>всичко е наред</td></tr><tr><td>uzun zamandır</td><td>отдавна</td></tr><tr><td>görüşmedik</td><td>не сме се виждали</td></tr><tr><td>tanıştığımıza sevindim</td><td>радвам се, че се запознахме</td></tr><tr><td>kendine iyi bak</td><td>пази се</td></tr><tr><td>görüşmek üzere</td><td>до скоро</td></tr><tr><td>yarın görüşürüz</td><td>до утре</td></tr><tr><td>iyi yolculuklar</td><td>добър път</td></tr><tr><td>iyi çalışmalar</td><td>приятна работа</td></tr><tr><td>iyi eğlenceler</td><td>приятно забавление</td></tr><tr><td>iyi hafta sonları</td><td>приятен уикенд</td></tr><tr><td>iyi tatiller</td><td>приятна ваканция</td></tr><tr><td>kolay gelsin</td><td>лека работа</td></tr><tr><td>geçmiş olsun</td><td>оздравявай</td></tr><tr><td>afiyet olsun</td><td>добър апетит</td></tr><tr><td>eline sağlık</td><td>благодаря за храната</td></tr><tr><td>sağ ol</td><td>благодаря (неформално)</td></tr><tr><td>bir şey değil</td><td>няма нищо</td></tr><tr><td>özür dilerim</td><td>извинявам се</td></tr><tr><td>affedersiniz</td><td>извинете</td></tr><tr><td>pardon</td><td>пардон</td></tr><tr><td>buyurun</td><td>заповядайте</td></tr><tr><td>tabii ki</td><td>разбира се</td></tr><tr><td>memnuniyetle</td><td>с удоволствие</td></tr><tr><td>maalesef</td><td>за съжаление</td></tr><tr><td>ne yazık ki</td><td>жалко, че</td></tr><tr><td>hava nasıl?</td><td>какво е времето?</td></tr><tr><td>nereden geliyorsun?</td><td>откъде идваш?</td></tr><tr><td>nereye gidiyorsun?</td><td>накъде отиваш?</td></tr><tr><td>işler nasıl?</td><td>как вървят нещата?</td></tr><tr><td>ailen nasıl?</td><td>как е семейството ти?</td></tr><tr><td>selam söyle</td><td>поздрави от мен</td></tr><tr><td>tekrar hoş geldin</td><td>отново добре дошъл</td></tr><tr><td>hayırlı olsun</td><td>на добър час</td></tr><tr><td>başarılar</td><td>успех</td></tr></tbody></table><p><strong>Упр. 1.13 — Как е на турски?</strong> <em>(Türkçesi nedir?)</em></p><ol type=\"1\"><li>добре дошли</li><li>добре заварили</li><li>до скоро</li><li>пази се</li><li>лека работа</li><li>оздравявай</li><li>извинете</li><li>какво ново?</li><li>за съжаление</li><li>с удоволствие</li></ol><h3>Тематичен речник · Konu sözlüğü — Учтивост и всекидневни изрази · Nezaket sözleri</h3><table><thead><tr><th>Türkçe</th><th>Български</th></tr></thead><tbody><tr><td>İyi günler</td><td>Добър ден</td></tr><tr><td>İyi akşamlar</td><td>Добър вечер</td></tr><tr><td>İyi geceler</td><td>Лека нощ</td></tr><tr><td>Nasılsın?</td><td>Как си?</td></tr><tr><td>Nasılsınız?</td><td>Как сте?</td></tr><tr><td>İyiyim</td><td>Добре съм</td></tr><tr><td>Teşekkürler</td><td>Благодаря</td></tr><tr><td>Sağ olun</td><td>Бъдете здрави, благодаря Ви</td></tr><tr><td>Rica ederim</td><td>Моля (в отговор на благодаря)</td></tr><tr><td>Lütfen</td><td>Моля (при молба)</td></tr><tr><td>Tamam</td><td>Добре, окей</td></tr><tr><td>Peki</td><td>Добре тогава</td></tr><tr><td>Kusura bakmayın</td><td>Не се сърдете, извинете</td></tr><tr><td>Hoşça kal</td><td>Довиждане (казва си тръгващият)</td></tr><tr><td>Hoşça kalın</td><td>Довиждане (учтиво)</td></tr><tr><td>Güle güle</td><td>Довиждане (казва оставащият)</td></tr><tr><td>Görüşürüz</td><td>Ще се видим</td></tr><tr><td>Tebrikler</td><td>Поздравления</td></tr><tr><td>Tebrik ederim</td><td>Поздравявам те</td></tr><tr><td>Çok yaşa</td><td>Наздраве (при кихане)</td></tr><tr><td>Sen de gör</td><td>И ти да видиш (отговор при кихане)</td></tr><tr><td>İyi şanslar</td><td>Късмет</td></tr><tr><td>İyi tatiller</td><td>Приятна ваканция</td></tr><tr><td>Evet</td><td>Да</td></tr><tr><td>Hayır</td><td>Не</td></tr><tr><td>Tabii</td><td>Разбира се</td></tr></tbody></table><p><strong>Упр. 1.14 — Как е на турски?</strong> <em>(Türkçesi nedir?)</em></p><ol type=\"1\"><li>Добър ден</li><li>Лека нощ</li><li>Моля (в отговор на благодаря)</li><li>Довиждане (казва оставащият)</li><li>Поздравления</li><li>Наздраве (при кихане)</li><li>Късмет</li><li>Добре тогава</li></ol><hr />\n<h2 id=\"урок-2-bu-ne-какво-е-това\">УРОК 2 · Bu ne? — Какво е това?</h2><figure class=\"illus\">\n<svg viewBox=\"0 0 400 236\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Дебели и тънки гласни\" font-family=\"var(--font-serif)\">\n<rect x=\"8\" y=\"8\" width=\"184\" height=\"194\" rx=\"12\" fill=\"var(--sel)\" stroke=\"var(--text-accent)\"/>\n<rect x=\"208\" y=\"8\" width=\"184\" height=\"194\" rx=\"12\" fill=\"var(--bad-bg)\" stroke=\"var(--bad)\"/>\n<text x=\"100\" y=\"34\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"700\" fill=\"var(--text-accent)\">ДЕБЕЛИ (задни)</text>\n<text x=\"300\" y=\"34\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"700\" fill=\"var(--bad)\">ТЪНКИ (предни)</text>\n<g font-size=\"30\" font-weight=\"600\" text-anchor=\"middle\" fill=\"var(--text)\">\n<text x=\"55\" y=\"90\">a</text><text x=\"145\" y=\"90\">ı</text>\n<text x=\"55\" y=\"150\">o</text><text x=\"145\" y=\"150\">u</text>\n<text x=\"255\" y=\"90\">e</text><text x=\"345\" y=\"90\">i</text>\n<text x=\"255\" y=\"150\">ö</text><text x=\"345\" y=\"150\">ü</text>\n</g>\n<g font-size=\"10\" text-anchor=\"middle\" fill=\"var(--text-muted)\">\n<text x=\"55\" y=\"106\">-a / -ı</text><text x=\"145\" y=\"106\">-a / -ı</text>\n<text x=\"55\" y=\"166\">-a / -u</text><text x=\"145\" y=\"166\">-a / -u</text>\n<text x=\"255\" y=\"106\">-e / -i</text><text x=\"345\" y=\"106\">-e / -i</text>\n<text x=\"255\" y=\"166\">-e / -ü</text><text x=\"345\" y=\"166\">-e / -ü</text>\n</g>\n<text x=\"200\" y=\"226\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--text-muted)\">окончанието следва последната гласна на думата</text>\n</svg>\n<figcaption>Гласната хармония: думата „тегли“ окончанието към своята група.</figcaption></figure>\n<h3 id=\"речник-sözlük-1\">Речник · Sözlük</h3>\n<table>\n<thead>\n<tr class=\"header\">\n<th>Турски</th>\n<th>Български</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>bu</td>\n<td>този, тази, това (близко)</td>\n</tr>\n<tr class=\"even\">\n<td>şu</td>\n<td>онзи (по-далече, посочено)</td>\n</tr>\n<tr class=\"odd\">\n<td>o</td>\n<td>онзи, онова (далечно)</td>\n</tr>\n<tr class=\"even\">\n<td>ne</td>\n<td>какво</td>\n</tr>\n<tr class=\"odd\">\n<td>kim</td>\n<td>кой</td>\n</tr>\n<tr class=\"even\">\n<td>nerede</td>\n<td>къде</td>\n</tr>\n<tr class=\"odd\">\n<td>masa</td>\n<td>маса</td>\n</tr>\n<tr class=\"even\">\n<td>sandalye</td>\n<td>стол</td>\n</tr>\n<tr class=\"odd\">\n<td>kitap</td>\n<td>книга</td>\n</tr>\n<tr class=\"even\">\n<td>defter</td>\n<td>тетрадка</td>\n</tr>\n<tr class=\"odd\">\n<td>kalem</td>\n<td>молив, химикал</td>\n</tr>\n<tr class=\"even\">\n<td>çanta</td>\n<td>чанта</td>\n</tr>\n<tr class=\"odd\">\n<td>ev</td>\n<td>къща, дом</td>\n</tr>\n<tr class=\"even\">\n<td>oda</td>\n<td>стая</td>\n</tr>\n<tr class=\"odd\">\n<td>okul</td>\n<td>училище</td>\n</tr>\n<tr class=\"even\">\n<td>sınıf</td>\n<td>клас, класна стая</td>\n</tr>\n<tr class=\"odd\">\n<td>araba</td>\n<td>кола</td>\n</tr>\n<tr class=\"even\">\n<td>şehir</td>\n<td>град</td>\n</tr>\n<tr class=\"odd\">\n<td>köy</td>\n<td>село</td>\n</tr>\n<tr class=\"even\">\n<td>var</td>\n<td>има</td>\n</tr>\n<tr class=\"odd\">\n<td>yok</td>\n<td>няма</td>\n</tr>\n<tr class=\"even\">\n<td>ve</td>\n<td>и</td>\n</tr>\n<tr class=\"odd\">\n<td>ama</td>\n<td>но</td>\n</tr>\n<tr class=\"even\">\n<td>çok</td>\n<td>много</td>\n</tr>\n<tr class=\"odd\">\n<td>güzel</td>\n<td>хубав, красив</td>\n</tr>\n<tr class=\"even\">\n<td>büyük</td>\n<td>голям</td>\n</tr>\n<tr class=\"odd\">\n<td>küçük</td>\n<td>малък</td>\n</tr>\n<tr class=\"even\">\n<td>yeni</td>\n<td>нов</td>\n</tr>\n<tr class=\"odd\">\n<td>eski</td>\n<td>стар</td>\n</tr>\n</tbody>\n</table>\n<h3 id=\"граматика-2.1-гласна-хармония-ünlü-uyumu-ünlü-uyumu\">Граматика\n2.1 — Гласна хармония (ünlü uyumu) · Ünlü uyumu</h3>\n<p>Това е <strong>най-важното правило в турския език</strong>. Гласните\nв окончанията се приспособяват към последната гласна на думата.</p>\n<p>Турските гласни се делят така:</p>\n<ul>\n<li><strong>Дебели (задни):</strong> a, ı, o, u</li>\n<li><strong>Тънки (предни):</strong> e, i, ö, ü</li>\n</ul>\n<p><strong>Малка (двойна) хармония — окончания с\n<code>a/e</code>:</strong></p>\n<table>\n<thead>\n<tr class=\"header\">\n<th>Последна гласна в думата</th>\n<th>Окончание</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>a, ı, o, u</td>\n<td><strong>-a</strong></td>\n</tr>\n<tr class=\"even\">\n<td>e, i, ö, ü</td>\n<td><strong>-e</strong></td>\n</tr>\n</tbody>\n</table>\n<p>Примери: <code>masa</code> → <code>masalar</code>, <code>ev</code> →\n<code>evler</code>, <code>okul</code> → <code>okullar</code>,\n<code>göz</code> → <code>gözler</code>.</p>\n<p><strong>Голяма (четворна) хармония — окончания с\n<code>ı/i/u/ü</code>:</strong></p>\n<table>\n<thead>\n<tr class=\"header\">\n<th>Последна гласна в думата</th>\n<th>Окончание</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>a, ı</td>\n<td><strong>-ı</strong></td>\n</tr>\n<tr class=\"even\">\n<td>e, i</td>\n<td><strong>-i</strong></td>\n</tr>\n<tr class=\"odd\">\n<td>o, u</td>\n<td><strong>-u</strong></td>\n</tr>\n<tr class=\"even\">\n<td>ö, ü</td>\n<td><strong>-ü</strong></td>\n</tr>\n</tbody>\n</table>\n<p>Примери: <code>kız</code> → <code>kızım</code>, <code>ev</code> →\n<code>evim</code>, <code>okul</code> → <code>okulum</code>,\n<code>göz</code> → <code>gözüm</code>.</p>\n<h3 id=\"граматика-2.2-множествено-число--lar--ler-çoğul-eki\">Граматика\n2.2 — Множествено число: -lar / -ler · Çoğul eki</h3>\n<table>\n<thead>\n<tr class=\"header\">\n<th>Ед.ч.</th>\n<th>Мн.ч.</th>\n<th>Превод</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>kitap</td>\n<td>kitap<strong>lar</strong></td>\n<td>книги</td>\n</tr>\n<tr class=\"even\">\n<td>ev</td>\n<td>ev<strong>ler</strong></td>\n<td>къщи</td>\n</tr>\n<tr class=\"odd\">\n<td>okul</td>\n<td>okul<strong>lar</strong></td>\n<td>училища</td>\n</tr>\n<tr class=\"even\">\n<td>öğrenci</td>\n<td>öğrenci<strong>ler</strong></td>\n<td>студенти</td>\n</tr>\n<tr class=\"odd\">\n<td>çocuk</td>\n<td>çocuk<strong>lar</strong></td>\n<td>деца</td>\n</tr>\n</tbody>\n</table>\n<p><strong>Важно:</strong> след число НЕ се слага\n<code>-lar/-ler</code>: <code>beş kitap</code> (пет книги), не <del>beş\nkitaplar</del>.</p>\n<h3\nid=\"граматика-2.3-показателни-местоимения-işaret-zamirleri\">Граматика\n2.3 — Показателни местоимения · İşaret zamirleri</h3>\n<ul>\n<li><strong>Bu</strong> — това (тук, до мен): <code>Bu bir kitap.</code>\n— Това е книга.</li>\n<li><strong>Şu</strong> — това/онова (малко по-далече, посочвам):\n<code>Şu masa.</code> — Онази маса.</li>\n<li><strong>O</strong> — онова (далече): <code>O ev büyük.</code> —\nОнази къща е голяма.</li>\n</ul>\n<p>Мн.ч.: <code>bunlar</code>, <code>şunlar</code>,\n<code>onlar</code>.</p>\n<ul>\n<li>Bu ne? — Bu bir kalem. → Какво е това? — Това е молив.</li>\n<li>Bunlar ne? — Bunlar kitaplar. → Какви са тези? — Това са книги.</li>\n<li>Bu kim? — Bu Ali. → Кой е този? — Това е Али.</li>\n</ul>\n<h3 id=\"граматика-2.4-местен-падеж--da--de-в-на-bulunma-hâli\">Граматика\n2.4 — Местен падеж: -da / -de (в, на) · Bulunma hâli</h3>\n<p>Отговаря на въпроса <strong>nerede?</strong> (къде?).</p>\n<table>\n<thead>\n<tr class=\"header\">\n<th>Последна гласна</th>\n<th>Окончание</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>a, ı, o, u</td>\n<td><strong>-da</strong></td>\n</tr>\n<tr class=\"even\">\n<td>e, i, ö, ü</td>\n<td><strong>-de</strong></td>\n</tr>\n</tbody>\n</table>\n<p><strong>Правило за твърдите съгласни:</strong> ако думата свършва на\n<code>ç, f, h, k, p, s, ş, t</code> (запомни ги с израза\n<strong>„FıSTıKÇı ŞaHaP“</strong>), окончанието става <strong>-ta /\n-te</strong>.</p>\n<table>\n<thead>\n<tr class=\"header\">\n<th>Дума</th>\n<th>+ местен падеж</th>\n<th>Превод</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>ev</td>\n<td>ev<strong>de</strong></td>\n<td>вкъщи</td>\n</tr>\n<tr class=\"even\">\n<td>okul</td>\n<td>okul<strong>da</strong></td>\n<td>в училище</td>\n</tr>\n<tr class=\"odd\">\n<td>kitap</td>\n<td>kitap<strong>ta</strong></td>\n<td>в книгата</td>\n</tr>\n<tr class=\"even\">\n<td>sınıf</td>\n<td>sınıf<strong>ta</strong></td>\n<td>в класната стая</td>\n</tr>\n<tr class=\"odd\">\n<td>İstanbul</td>\n<td>İstanbul’<strong>da</strong></td>\n<td>в Истанбул</td>\n</tr>\n</tbody>\n</table>\n<p><em>Собствените имена се пишат с апостроф пред окончанието:\n<code>Ali'de</code>, <code>Sofya'da</code>.</em></p>\n<h3 id=\"граматика-2.5-var-yok-има-няма-var-yok\">Граматика 2.5 — var /\nyok (има / няма) · var / yok</h3>\n<p>Глаголът стои <strong>накрая</strong> на изречението.</p>\n<ul>\n<li>Masada bir kitap var. — На масата има книга.</li>\n<li>Odada sandalye yok. — В стаята няма стол.</li>\n<li>Sınıfta öğrenciler var mı? — В класната стая има ли ученици?</li>\n<li>Evet, var. / Hayır, yok. — Да, има. / Не, няма.</li>\n</ul>\n<h3\nid=\"граматика-1.5-кога-се-изпуска--dir--dir-eki-ne-zaman-düşer\">Граматика\n1.5 — Кога се изпуска <code>-dir</code> · „-dir“ eki ne zaman düşer</h3>\n<p>Окончанието за 3 л. ед.ч. <code>-dir/-dır/-dur/-dür</code> в\nговоримия език почти винаги отпада:</p>\n<ul>\n<li>O doktor. — Той е лекар. <em>(обичайно)</em></li>\n<li>O doktordur. — Той е лекар. <em>(официално, в документи и\nучебници)</em></li>\n</ul>\n<p><code>-dir</code> се запазва в три случая:</p>\n<ol type=\"1\">\n<li><strong>Официален стил:</strong> <code>Toplantı saat üçtedir.</code>\n— Срещата е в три часа.</li>\n<li><strong>Общи истини:</strong> <code>Dünya yuvarlaktır.</code> —\nЗемята е кръгла.</li>\n<li><strong>Предположение:</strong> <code>Şimdi evdedir.</code> —\nСигурно вече си е вкъщи.</li>\n</ol>\n<h3 id=\"граматика-1.6-учтивото-siz-nezaket-siz\">Граматика 1.6 — Учтивото\n<code>siz</code> · Nezaket „siz“</h3>\n<p>Както в българския, <code>siz</code> е и „вие“ (мн.ч.), и учтива\nформа към един човек:</p>\n<ul>\n<li>Siz öğretmen misiniz? — Вие учител(ка) ли сте? <em>(към един човек,\nучтиво)</em></li>\n<li>Siz öğretmen misiniz? — Вие учители ли сте? <em>(към\nгрупа)</em></li>\n</ul>\n<p>Правило: към непознат, по-възрастен или в работна среда — винаги\n<code>siz</code>. Между приятели и връстници — <code>sen</code>.</p>\n<h3 id=\"граматика-1.7-въпросителни-думи-soru-kelimeleri\">Граматика 1.7 —\nВъпросителни думи · Soru kelimeleri</h3>\n<table>\n<thead>\n<tr class=\"header\">\n<th>Дума</th>\n<th>Значение</th>\n<th>Пример</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>ne</td>\n<td>какво</td>\n<td>Bu ne? — Какво е това?</td>\n</tr>\n<tr class=\"even\">\n<td>kim</td>\n<td>кой</td>\n<td>O kim? — Кой е той?</td>\n</tr>\n<tr class=\"odd\">\n<td>nerede</td>\n<td>къде</td>\n<td>Ali nerede? — Къде е Али?</td>\n</tr>\n<tr class=\"even\">\n<td>nereli</td>\n<td>откъде (по произход)</td>\n<td>Nerelisin? — Откъде си?</td>\n</tr>\n<tr class=\"odd\">\n<td>nasıl</td>\n<td>как</td>\n<td>Nasılsın? — Как си?</td>\n</tr>\n<tr class=\"even\">\n<td>kaç</td>\n<td>колко (брой)</td>\n<td>Kaç yaşındasın? — На колко години си?</td>\n</tr>\n<tr class=\"odd\">\n<td>ne zaman</td>\n<td>кога</td>\n<td>Ne zaman geliyorsun? — Кога идваш?</td>\n</tr>\n<tr class=\"even\">\n<td>neden / niçin</td>\n<td>защо</td>\n<td>Neden gelmiyorsun? — Защо не идваш?</td>\n</tr>\n</tbody>\n</table>\n<p><strong>Важно:</strong> въпросителната дума стои непосредствено пред\nглагола, а не в началото: <code>Sen ne yapıyorsun?</code> (не <del>Ne\nsen yapıyorsun?</del>)</p>\n<h3 id=\"граматика-1.8-възраст-yaş\">Граматика 1.8 — Възраст · Yaş</h3>\n<p>Възрастта се казва с <code>yaşında</code> (буквално „на…\nвъзраст“):</p>\n<ul>\n<li>Kaç yaşındasın? — На колко години си?</li>\n<li>Yirmi beş yaşındayım. — На двадесет и пет съм.</li>\n<li>O otuz yaşında. — Той е на тридесет.</li>\n<li>Kardeşim on iki yaşında. — Брат ми е на дванадесет.</li>\n</ul>\n<h3\nid=\"граматика-2.6-изключения-от-гласната-хармония-ünlü-uyumunun-istisnaları\">Граматика\n2.6 — Изключения от гласната хармония · Ünlü uyumunun istisnaları</h3>\n<p>Някои думи и окончания НЕ спазват хармонията:</p>\n<p><strong>А) Заемки</strong> (най-често от арабски, персийски и\nфренски). При тях последната съгласна се изговаря меко (палатализирано),\nзатова окончанието е тънко, макар гласната да е дебела:</p>\n<table>\n<thead>\n<tr class=\"header\">\n<th>Дума</th>\n<th>Очаквано по правилото</th>\n<th>Действително</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>saat (час)</td>\n<td><del>saatta</del></td>\n<td>saat<strong>te</strong>, saat<strong>i</strong></td>\n</tr>\n<tr class=\"even\">\n<td>kalp (сърце)</td>\n<td><del>kalpı</del></td>\n<td>kalb<strong>i</strong></td>\n</tr>\n<tr class=\"odd\">\n<td>hâl (положение)</td>\n<td><del>hâla</del></td>\n<td>hâl<strong>e</strong>, hâl<strong>i</strong></td>\n</tr>\n<tr class=\"even\">\n<td>rol (роля)</td>\n<td><del>rolu</del></td>\n<td>rol<strong>ü</strong></td>\n</tr>\n<tr class=\"odd\">\n<td>harf (буква)</td>\n<td><del>harfı</del></td>\n<td>harf<strong>i</strong></td>\n</tr>\n<tr class=\"even\">\n<td>kabul (приемане)</td>\n<td><del>kabulu</del></td>\n<td>kabul<strong>ü</strong></td>\n</tr>\n<tr class=\"odd\">\n<td>gol (гол)</td>\n<td><del>golu</del></td>\n<td>gol<strong>ü</strong></td>\n</tr>\n</tbody>\n</table>\n<p>Забележи общото: завършват на <code>l</code>, <code>t</code>,\n<code>f</code>, <code>p</code> след дебела гласна, но се произнасят\nмеко. Учат се поединично — не са много.</p>\n<p><strong>Б) Окончания, които никога не се менят:</strong></p>\n<table>\n<thead>\n<tr class=\"header\">\n<th>Окончание</th>\n<th>Значение</th>\n<th>Пример</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>-yor</td>\n<td>сегашно време</td>\n<td>geliyor, bakıyor, gülüyor</td>\n</tr>\n<tr class=\"even\">\n<td>-ken</td>\n<td>докато</td>\n<td>gelirken, okurken</td>\n</tr>\n<tr class=\"odd\">\n<td>-leyin</td>\n<td>по (време на деня)</td>\n<td>sabahleyin, akşamleyin</td>\n</tr>\n<tr class=\"even\">\n<td>-(i)mtırak</td>\n<td>нещо като</td>\n<td>yeşilimtırak (зеленикав)</td>\n</tr>\n<tr class=\"odd\">\n<td>-gil</td>\n<td>семейството на</td>\n<td>Ali<strong>gil</strong> (у Алиеви)</td>\n</tr>\n</tbody>\n</table>\n<p><strong>В) Съставни думи</strong> — всяка част пази своята хармония:\n<code>bugün</code> (bu + gün), <code>hanımeli</code>,\n<code>Çanakkale</code></p>\n<h3\nid=\"граматика-2.7-bir-неопределителен-член-belirsizlik-sıfatı-bir\">Граматика\n2.7 — <code>bir</code> — неопределителен член · Belirsizlik sıfatı\n„bir“</h3>\n<p><code>bir</code> означава „един“, но и „някакъв, един“:</p>\n<ul>\n<li>Bu bir kitap. — Това е (една) книга.</li>\n<li>Masada bir kalem var. — На масата има един/някакъв молив.</li>\n<li>Bir arkadaşım geldi. — Дойде един мой приятел.</li>\n</ul>\n<p><strong>Кога се слага и кога не:</strong></p>\n<table>\n<colgroup>\n<col style=\"width: 50%\" />\n<col style=\"width: 50%\" />\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th>Без <code>bir</code></th>\n<th>С <code>bir</code></th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>O öğretmen. — Той е учител. <em>(професия като качество)</em></td>\n<td>O bir öğretmen. — Той е учител. <em>(причислява го към\nгрупата)</em></td>\n</tr>\n<tr class=\"even\">\n<td>Kitap okuyorum. — Чета книга. <em>(занимание изобщо)</em></td>\n<td>Bir kitap okuyorum. — Чета една книга. <em>(конкретен, но неназован\nекземпляр)</em></td>\n</tr>\n</tbody>\n</table>\n<p>При професия и националност <code>bir</code> обикновено се пропуска:\n<code>O doktor.</code>, <code>Ben Bulgarım.</code> — не <del>O bir\ndoktor</del> в неутрален контекст.</p>\n<h3 id=\"граматика-2.8-прилагателните-sıfatlar\">Граматика 2.8 —\nПрилагателните · Sıfatlar</h3>\n<p>Прилагателното стои <strong>пред</strong> съществителното и не се\nмени по число и род:</p>\n<ul>\n<li>büyük ev — голяма къща</li>\n<li>büyük evler — големи къщи</li>\n<li>güzel kız — красиво момиче</li>\n<li>güzel kızlar — красиви момичета</li>\n</ul>\n<p><strong>Мястото на <code>bir</code> мени смисъла</strong> — тънкост,\nкоято българите често бъркат:</p>\n<table>\n<colgroup>\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th>Ред</th>\n<th>Пример</th>\n<th>Значение</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>прилагателно + <strong>bir</strong> + съществително</td>\n<td><strong>büyük bir ev</strong></td>\n<td>голяма къща <em>(неутрално, обичайното)</em></td>\n</tr>\n<tr class=\"even\">\n<td><strong>bir</strong> + прилагателно + съществително</td>\n<td><strong>bir büyük ev</strong></td>\n<td>една голяма къща <em>(наблягане на бройката)</em></td>\n</tr>\n</tbody>\n</table>\n<p>В огромното мнозинство случаи верният ред е\n<code>büyük bir ev</code>. Формата <code>bir büyük ev</code> се среща\nпри изброяване или контраст: <code>Bir büyük, bir küçük ev aldık.</code>\n— Купихме една голяма и една малка къща.</p>\n<p><strong>Основни двойки прилагателни:</strong></p>\n<div class=\"line-block\">büyük / küçük | голям / малък |<br />\nuzun / kısa | дълъг / къс |<br />\nyeni / eski | нов / стар |<br />\niyi / kötü | добър / лош |<br />\ngüzel / çirkin | красив / грозен |<br />\nkolay / zor | лесен /
